# Local development services. Not for production.
# Starts a PostgreSQL matching the DATABASE_URL in .env.example.
#   docker compose up -d
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: openproject
      POSTGRES_PASSWORD: openproject
      POSTGRES_DB: openproject
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openproject"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
