    <div class="row"><span>Margen</span><b class="${t.marginBaseCents < 0 ? "neg" : ""}">${eur(t.marginBaseCents)} · ${t.marginBasePct}%</b></div>
    <div class="row ${t.pendingCount ? "warn" : "mut"}"><span>Pendientes de precio</span><b>${t.pendingCount} · ${eur(t.pendingEstCents)}</b></div>
    <div class="row mut" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px"><span>Coste y margen</span><b>no salen del documento</b></div>
   </div>
   <div style="margin-top:14px">
    <div class="pbh" style="position:static;padding-left:0;border:0">Anexo gráfico</div>
    <div class="bside" style="position:static">
     <label class="opt"><input type="checkbox" id="bAnnexOn"${b.annex && b.annex.enabled ? " checked" : ""}> Incluir anexo en el documento</label>
     <label class="opt">Imágenes por página
      <select id="bAnnexPer">${[1, 2, 3, 4, 6].map((n) => `<option value="${n}"${(b.annex && b.annex.imagesPerPage) === n ? " selected" : ""}>${n}</option>`).join("")}</select></label>
     <div class="row mut" id="bAnnexCount">${
       imgs
         ? `${imgs} ${imgs === 1 ? "imagen" : "imágenes"} en ${b.annex && b.annex.enabled ? Math.ceil(imgs / ((b.annex && b.annex.imagesPerPage) || 2)) + " página(s)" : "—"}`
         : "Ninguna partida tiene imágenes todavía."
     }</div>
    </div>
   </div>
   ${
     resp
       ? `<div style="margin-top:14px">
    <div class="pbh" style="position:static;padding-left:0;border:0">${resp.accepted ? "Aceptación" : "Rechazo"}</div>
    <div class="bside" style="position:static">
     <div class="row"><span>Fecha</span><b>${esc(fmtD(resp.date))}</b></div>
     ${resp.acceptedBy ? `<div class="row"><span>Quién</span><b>${esc(resp.acceptedBy)}</b></div>` : ""}
     ${
       resp.evidence && resp.evidence.storageKey
         ? `<div class="row"><span>Justificante</span>
       <b><a href="#" data-evidence="${esc(JSON.stringify(resp.evidence))}">${esc(resp.evidence.name || "Ver el documento")}</a></b></div>`
         : resp.evidenceRef
           ? `<div class="row mut"><span>Justificante</span><b>${esc(resp.evidenceRef)}</b></div>`
           : `<div class="row mut"><span>Justificante</span><b>sin adjuntar</b></div>`
     }
    </div>
   </div>`
       : ""
   }`;
      }

      /* The visit, beside the presupuesto being written from it — the whole reason
   COM-02 records a report at all. Strictly reference: nothing here writes, and
   nothing here is copied into a line, because the specification's own note is
   that the visit does NOT inherit into the presupuesto (mapping §6, row 2). */
      function builderVisitPanel(b) {
        const found = budgetVisit(b);
        if (!found)
          return '<div class="empty">Este presupuesto no tiene ninguna visita asociada.</div>';
        const x = found.visit;
        const photos = (x.photos || [])
          .map((p) => (typeof p === "string" ? p : p.storageKey))
          .filter(Boolean);
        return `
   ${
     found.linked
       ? '<span class="pill g">Visita de este presupuesto</span>'
       : '<span class="pill y">Última visita del cliente — no vinculada a este presupuesto</span>'
   }
   <div class="bside" style="position:static;margin-top:10px">
    <div class="row"><span>Fecha</span><b>${fmtD(x.completedAt || x.date)}</b></div>
    <div class="row"><span>Mediciones</span><b>${(x.measurements || []).length}</b></div>
    <div class="row"><span>Fotos</span><b>${photos.length}</b></div>
   </div>
   ${
     (x.measurements || []).length
       ? `<div style="margin-top:10px">
     <div class="pbh" style="position:static;padding-left:0;border:0">Mediciones</div>
     <div class="bside" style="position:static">${(x.measurements || [])
       .map(
         (m) =>
           `<div class="row"><span>${esc(m.what || m.room || "—")}</span><b>${m.qtyMilli != null ? m.qtyMilli / 1000 : esc(String(m.qty ?? ""))} ${esc(m.unit || "")}</b></div>`,
       )
       .join("")}</div>
    </div>`
       : ""
   }
   ${
     x.notes
       ? `<div style="margin-top:10px">
     <div class="pbh" style="position:static;padding-left:0;border:0">Informe</div>
     <div style="font-size:12.5px;color:var(--body);white-space:pre-wrap">${esc(x.notes)}</div>
    </div>`
       : ""
   }
   ${
     photos.length
       ? `<div class="gal" style="margin-top:10px">
     ${photos.map((p) => `<div class="gi" style="grid-template-columns:minmax(0,1fr)"><img data-blob="${esc(p)}" alt="" style="width:100%;height:120px"></div>`).join("")}
    </div>`
       : ""
   }`;
      }

      /* ================= ADM-03 · document capture and validation (S6) =========
   Recognition happens in site/erp-ocr.js and meaning in the extraction
   capability; this is only the screen between them. Its whole job is the
   sentence the specification and CAP-04 both insist on: a partial extraction
   never creates a validated record in silence. So the record is written at
   the END, by a person pressing a button, and every field carries a dot
   saying whether anything actually checked it.

   `capWork` holds the document being validated. It is deliberately NOT in
   `erp.state`: nothing about a half-checked reading belongs in the company's
   data, and the moment it does belong there it stops being a reading and
   becomes a captured document. */
      let capWork = null; // {file, url, kind, recognised, result, blobKey, docType, focusKey}

      const CAP_FIELDS = [
        ["issuerName", "Emisor"],
        ["issuerTaxId", "NIF"],
        ["docNumber", "Nº documento"],
        ["issueDate", "Fecha"],
        ["dueDate", "Vencimiento"],
        ["netAmount", "Base imponible"],
        ["taxAmount", "IVA"],
        ["withholdingAmount", "Retención"],
        ["totalAmount", "Total"],
        ["iban", "IBAN"],
        ["orderRef", "Referencia"],
      ];
      const CAP_AMOUNTS = new Set(["netAmount", "taxAmount", "withholdingAmount", "totalAmount"]);

      const CAP_TYPE_LABEL = {
        supplierInvoice: "Factura proveedor",
        selfEmployedInvoice: "Factura autónomo",
        deliveryNote: "Albarán",
        valuedDeliveryNote: "Albarán valorado",
        ticket: "Ticket",
        supplierOffer: "Oferta",
        orderConfirmation: "Confirmación",
        paymentProof: "Justificante pago",
        creditNote: "Abono",
      };
      const CAP_STATUS = {
        captured: ["Capturado", "y"],
        extracted: ["Extraído", "y"],
        validated: ["Validado", "b"],
        allocated: ["Asignado", "g"],
        sentToAccounting: ["Enviado a gestoría", "g"],
        paid: ["Pagado", "g"],
      };
      /* The overhead categories the engine accepts, in the words the owner uses.
   The codes are the engine's (LISTS.overheadCategories) and this is only a
   rendering of them, so a category the engine does not know cannot be
   offered — which is the failure the allocation guard exists to prevent. */
      const OVERHEAD_LABEL = {
        rent: "Alquiler",
        vehicles: "Vehículos",
        fuel: "Combustible",
        insurance: "Seguros",
        office: "Oficina",
        accountingFirm: "Gestoría",
        marketing: "Marketing",
        financial: "Gastos financieros",
        taxes: "Impuestos",
        fixedAsset: "Inmovilizado",
        renting: "Renting",
        otherOverhead: "Otros gastos generales",
      };
      const COST_KIND_LABEL = {
        material: "Material",
        labour: "Mano de obra",
        subcontract: "Subcontrata",
        other: "Otros",
      };

      /** How a document's allocation reads in a table cell. */
      function capAllocationText(c) {
        if (!c.allocations.length) return '<span class="pill y">Sin asignar</span>';
        return esc(
          c.allocations
            .map((a) =>
              a.projectId
                ? erp.project(a.projectId).code + (a.chapterNum ? " · " + a.chapterNum : "")
                : OVERHEAD_LABEL[a.overheadCategory] || a.overheadCategory,
            )
            .join(", "),
        );
      }

      /* Thumbnails for the inbox cards.
   Cached per blob key for the life of the page: a card list re-renders on
   every keystroke elsewhere on the screen, and minting a fresh object URL
   each time would hold every picture ever shown in memory until the tab is
   closed. A PDF has no thumbnail an <img> can draw, so the icon stays — found
   by letting the load fail rather than by guessing from the file name, which
   is the only test that works for both the local and the served path. */
      const capThumbUrls = {};
      function capThumbs(root) {
        root.querySelectorAll(".thumb[data-blob]").forEach((box) => {
          const key = box.dataset.blob;
          if (!key) return;
          const show = (url) => {
            if (!url) return;
            const img = new Image();
            img.onload = () => {
              box.innerHTML = "";
              box.appendChild(img);
            };
            img.onerror = () => {}; // stays the 📄 icon: a PDF, or a blob that has gone
            img.alt = "";
            img.src = url;
          };
          if (capThumbUrls[key] !== undefined) {
            show(capThumbUrls[key]);
            return;
          }
          const direct = ErpStore.blobUrl(key);
          if (direct) {
            capThumbUrls[key] = direct;
            show(direct);
            return;
          }
          capThumbUrls[key] = null; // claim the key so a re-render does not fetch twice
          ErpStore.getBlob(key)
            .then((b) => {
              if (!b) return;
              capThumbUrls[key] = URL.createObjectURL(b);
              show(capThumbUrls[key]);
            })
            .catch(() => {});
        });
      }

      /* ---------- The document's own panel (ADM-03, S7) ----------
   Everything a filed document needs a person for, in the 480 side panel the
   specification makes the universal edit surface: where the cost lands, the
   two archive fields the workbook has columns for, and the note.

   Allocation is deliberately the last block rather than the first. The order
   on screen is the order of the questions — what is this, where did it come
   from, then who pays for it — and the amount you are splitting is stated
   above the split rather than remembered from the row you clicked. */
      function captureDrawer(id) {
        const c = erp.state.captured.find((x) => x.id === id);
        if (!c) return;
        const cf = c.confirmed;
        const total = cf ? cf.totalCents : 0;
        const db = openDrawer(c.stdName || CAP_TYPE_LABEL[c.docType] || "Documento");
        capAlloc = (
          c.allocations.length
            ? c.allocations
            : [
                {
                  projectId: "",
                  overheadCategory: "",
                  chapterNum: "",
                  kind: "material",
                  amountCents: total,
                },
              ]
        ).map((a) => ({
          projectId: a.projectId || "",
          overheadCategory: a.overheadCategory || "",
          chapterNum: a.chapterNum || "",
          kind: a.kind || "material",
          amountCents: a.amountCents,
        }));
        db.innerHTML = `
   <div class="card"><div class="ch"><h3>${esc(CAP_TYPE_LABEL[c.docType] || c.docType)}</h3>
     <span class="pill ${CAP_STATUS[c.status] ? CAP_STATUS[c.status][1] : ""}">${esc(CAP_STATUS[c.status] ? CAP_STATUS[c.status][0] : c.status)}</span></div>
    <div class="daylist">
     <div class="it"><span>Emisor</span><span style="flex:1"></span><b>${cf ? esc(cf.issuerName || "—") : "—"}</b></div>
     <div class="it"><span>NIF</span><span style="flex:1"></span><b>${cf ? esc(cf.issuerTaxId || "—") : "—"}</b></div>
     <div class="it"><span>Nº documento</span><span style="flex:1"></span><b>${cf ? esc(cf.docNumber || "—") : "—"}</b></div>
     <div class="it"><span>Fecha</span><span style="flex:1"></span><b>${cf && cf.date ? fmtD(cf.date) : "—"}</b></div>
     <div class="it"><span>Total</span><span style="flex:1"></span><b>${cf ? eur(cf.totalCents) : "—"}</b></div>
     ${c.duplicateSuspect ? '<div class="it"><span class="pill r">Posible duplicado</span><span>ya hay un documento con el mismo NIF y número</span></div>' : ""}
    </div></div>
   <div class="card"><div class="ch"><h3>Archivo</h3><span class="tag">de dónde viene y con qué se relaciona</span></div>
    <div class="fgrid" style="padding:10px 12px 12px">
     <div class="field full"><label>Referencia</label><input id="cd_ref" value="${esc(c.reference || "")}" placeholder="Nº de pedido, obra o expediente"></div>
     <div class="field full"><label>Ruta de origen</label><input id="cd_path" value="${esc(c.sourcePath || "")}" placeholder="Carpeta o archivo del que procede"></div>
     <div class="field full"><label>Notas</label><input id="cd_notes" value="${esc(c.notes || "")}" placeholder="Lo que la siguiente persona necesita saber"></div>
     <div class="field full"><button class="btn" id="cd_save">Guardar datos de archivo</button></div>
    </div></div>
   <div class="card"><div class="ch"><h3>Asignación</h3><span class="tag" id="cd_rest"></span></div>
    <div id="cd_rows" style="padding:6px 12px 12px"></div>
    <div style="display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap">
     <button class="btn sm" id="cd_add">＋ Repartir</button>
     <span style="flex:1"></span>
     <button class="btn primary" id="cd_alloc">Asignar</button>
    </div></div>`;

        $("#cd_save").onclick = () =>
          mutate(() => {
            erp.updateCapture(
              id,
              {
                reference: $("#cd_ref").value.trim(),
                sourcePath: $("#cd_path").value.trim(),
                notes: $("#cd_notes").value.trim(),
              },
              "backoffice",
            );
          }, "Datos de archivo guardados");
        $("#cd_add").onclick = () => {
          capAlloc.push({
            projectId: "",
            overheadCategory: "",
            chapterNum: "",
            kind: "material",
            amountCents: 0,
          });
          capAllocRows(id, total);
        };
        $("#cd_alloc").onclick = () =>
          mutate(() => {
            erp.allocateCapture(
              id,
              capAlloc.map((a) => ({
                projectId: a.projectId || null,
                overheadCategory: a.projectId ? null : a.overheadCategory || null,
                chapterNum: a.chapterNum || null,
                kind: a.kind,
                amountCents: a.amountCents,
              })),
              "backoffice",
            );
            closeDrawer();
          }, "Documento asignado");
        capAllocRows(id, total);
      }

      /* One row per destination. The destination is ONE select holding both kinds
   of answer — a project or an overhead category — because the engine refuses
   a line that names both, and a screen that lets you tick two boxes and then
   says no is a screen that asked the question badly. */
      let capAlloc = [];
      function capAllocRows(id, total) {
        const host = $("#cd_rows");
        if (!host) return;
        const projects = erp.state.projects.filter((p) => !p.closed);
        host.innerHTML = capAlloc
          .map(
            (a, i) => `
   <div class="fgrid" style="border-top:${i ? "1px solid var(--hair)" : "0"};padding-top:${i ? "8px" : "0"}">
    <div class="field full"><label>Destino</label><select data-ai="${i}" data-k="dest">
      <option value="">—</option>
      <optgroup label="Obras">${projects.map((p) => `<option value="p:${p.id}"${a.projectId === p.id ? " selected" : ""}>${esc(p.code)} — ${esc(erp.party(p.partyId).name)}</option>`).join("")}</optgroup>
      <optgroup label="Gastos generales">${Object.entries(OVERHEAD_LABEL)
        .map(
          ([k, l]) =>
            `<option value="o:${k}"${a.overheadCategory === k ? " selected" : ""}>${esc(l)}</option>`,
        )
        .join("")}</optgroup>
     </select></div>
    ${
      a.projectId
        ? `<div class="field"><label>Capítulo</label><select data-ai="${i}" data-k="chapterNum"><option value="">—</option>${chapterOptions(a.projectId, a.chapterNum)}</select></div>
    <div class="field"><label>Naturaleza</label><select data-ai="${i}" data-k="kind">${Object.entries(
      COST_KIND_LABEL,
    )
      .map(([k, l]) => `<option value="${k}"${a.kind === k ? " selected" : ""}>${esc(l)}</option>`)
      .join("")}</select></div>`
        : ""
    }
    <div class="field"><label>Importe (€)</label><input data-ai="${i}" data-k="amountCents" type="number" step="0.01" value="${(a.amountCents / 100).toFixed(2)}"></div>
    ${capAlloc.length > 1 ? `<div class="field" style="display:flex;align-items:flex-end"><button class="btn sm danger" data-rm="${i}">Quitar</button></div>` : ""}
   </div>`,
          )
          .join("");
        // The label and the figure are separate elements on purpose: a sentence with
        // a number inside it is one text node no dictionary can hold, which is the
        // gap S5 found the hard way. Splitting them fixes all three languages with
        // no interpolation rule at all.
        const assigned = capAlloc.reduce((s, a) => s + (a.amountCents || 0), 0);
        const rest = $("#cd_rest");
        if (rest) {
          const diff = total - assigned;
          rest.innerHTML = total
            ? Math.abs(diff) <= 1
              ? "<span>Cuadra con el documento</span>"
              : `<span>Sin repartir</span> <b>${eur(diff)}</b>`
            : "<span>Documento sin total confirmado</span>";
        }
        host.querySelectorAll("[data-ai]").forEach((inp) => {
          inp.onchange = () => {
            const a = capAlloc[+inp.dataset.ai],
              k = inp.dataset.k;
            if (k === "dest") {
              const val = inp.value;
              a.projectId = val.startsWith("p:") ? val.slice(2) : "";
              a.overheadCategory = val.startsWith("o:") ? val.slice(2) : "";
              if (!a.projectId) {
                a.chapterNum = "";
              }
            } else if (k === "amountCents")
              a.amountCents = Math.round(Number(String(inp.value).replace(",", ".")) * 100) || 0;
            else a[k] = inp.value;
            capAllocRows(id, total);
          };
        });
        host.querySelectorAll("[data-rm]").forEach(
          (b) =>
            (b.onclick = () => {
              capAlloc.splice(+b.dataset.rm, 1);
              capAllocRows(id, total);
            }),
        );
      }

      /** Read a chosen file and open the validation screen on the result. */
      function captureStart(file) {
        if (typeof ErpOcr === "undefined" || !ErpBridge.extraction) {
          toast("⚠ El lector de documentos no está disponible — introdúzcalo a mano");
          return;
        }
        toast("Leyendo el documento…");
        ErpOcr.recognise(file, {
          onProgress: (p) => {
            if (p > 0 && p < 1) toast(`Leyendo… ${Math.round(p * 100)}%`);
          },
        })
          .then((rec) => {
            let result;
            try {
              result = ErpBridge.extraction.read(rec.text);
            } catch (e) {
              // A photograph with nothing readable on it. The document is still
              // worth keeping — it just has to be typed. Never a dead end.
              toast("⚠ No se ha podido leer nada: rellénelo a mano");
              result = null;
            }
            capWork = {
              file,
              url: URL.createObjectURL(file),
              kind: /pdf$/i.test(file.type) ? "pdf" : "image",
              recognised: rec,
              result,
              docType: "supplierInvoice",
              focusKey: (result && result.needsReview[0]) || null,
            };
            render();
          })
          .catch((e) => toast("⚠ " + (e.message || "No se ha podido leer el documento")));
      }

      function captureClose() {
        if (capWork && capWork.url) URL.revokeObjectURL(capWork.url);
        capWork = null;
        render();
      }

      /** The value as it should appear in its box: cents become euros, else text. */
      function capShown(f) {
        if (f.value === null || f.value === undefined) return "";
        return CAP_AMOUNTS.has(f.key) ? (f.value / 100).toFixed(2) : String(f.value);
      }

      function captureValidate(v) {
        const w = capWork,
          r = w.result;
        document.body.classList.add("fs");
        const rec = w.recognised;
        const engine =
          rec.engine === "pdf-text"
            ? '<span class="pill g">Leído del texto del PDF</span>'
            : `<span class="pill y">Leído de una imagen${rec.confidence != null ? " · " + rec.confidence + "% de confianza" : ""}</span>`;
        const amber = r ? r.fields.filter((f) => f.verdict === "amber").length : CAP_FIELDS.length;

        v.innerHTML = `<div class="pb">
   <div class="pbbar">
    <button class="btn sm" id="capBack" title="Volver a la bandeja">←</button>
    <div class="who"><b>Validar documento</b><span>${esc(w.file.name || "documento")}</span></div>
    ${engine}
    <div class="tot"><span>Por revisar</span><b id="capAmber">${amber}</b></div>
    <div class="acts">
     <select id="capType" style="font:12px var(--sans);border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--paper);color:var(--ink)">
      ${[
        ["supplierInvoice", "Factura de proveedor"],
        ["selfEmployedInvoice", "Factura de autónomo"],
        ["deliveryNote", "Albarán"],
        ["valuedDeliveryNote", "Albarán valorado"],
        ["ticket", "Ticket"],
        ["supplierOffer", "Oferta"],
        ["orderConfirmation", "Confirmación de pedido"],
        ["paymentProof", "Justificante de pago"],
        ["creditNote", "Abono"],
      ]
        .map(([k, l]) => `<option value="${k}"${w.docType === k ? " selected" : ""}>${l}</option>`)
        .join("")}
     </select>
     <button class="btn primary sm" id="capSave">Confirmar y guardar</button>
    </div>
   </div>
   ${rec.warnings.length ? `<div class="pbcond"><span class="pill y">⚠</span> ${rec.warnings.map((x) => `<span>${esc(x)}</span>`).join(" ")}</div>` : ""}
   <div class="cap2">
    <div class="capdoc" id="capDoc"></div>
    <div class="capform" id="capForm"></div>
   </div>
  </div>`;

        $("#capBack").onclick = captureClose;
        $("#capType").onchange = (e) => {
          w.docType = e.target.value;
        };
        $("#capSave").onclick = captureSave;
        captureDocPane();
        captureFormPane();
      }

      /** The document itself. A PDF's first page is rendered, an image shown. */
      function captureDocPane() {
        const host = $("#capDoc"),
          w = capWork;
        if (w.kind === "image") {
          host.innerHTML = `<img src="${w.url}" alt="">`;
        } else {
          host.innerHTML = '<div class="empty">Preparando la vista…</div>';
          w.file
            .arrayBuffer()
            .then((buf) => ErpOcr.loadPdfjs().then((m) => ({ m, buf })))
            .then(({ m, buf }) => m.getDocument({ data: new Uint8Array(buf) }).promise)
            .then((doc) => doc.getPage(1))
            .then((page) => {
              const vp = page.getViewport({ scale: 1.4 });
              const c = document.createElement("canvas");
              c.width = Math.round(vp.width);
              c.height = Math.round(vp.height);
              return page
                .render({ canvasContext: c.getContext("2d"), viewport: vp })
                .promise.then(() => c);
            })
            .then((c) => {
              host.innerHTML = "";
              host.appendChild(c);
              captureLines(host);
            })
            .catch(() => {
              host.innerHTML = '<div class="empty">No se ha podido mostrar el documento.</div>';
              captureLines(host);
            });
          return;
        }
        captureLines(host);
      }

      /* The text the reader actually saw, under the picture. This is the provenance
   the specification asks for — "al pulsar un campo se destaca la zona de la
   imagen de la que se obtuvo". We have line offsets rather than pixel boxes,
   so the honest version of that is to highlight the LINE, and to show the
   lines. A wrong reading you can see the source of is a wrong reading somebody
   can fix; one you cannot is a mystery. */
      function captureLines(host) {
        if (!capWork) return;
        const r = capWork.result;
        if (!r) return;
        const box = document.createElement("div");
        box.className = "caplines";
        box.id = "capLines";
        box.innerHTML = r.lines
          .map((l, i) => `<div data-line="${i}">${esc(l) || "&nbsp;"}</div>`)
          .join("");
        host.appendChild(box);
        captureHighlight();
      }

      function captureHighlight() {
        if (!capWork) return;
        const r = capWork.result;
        if (!r) return;
        const box = $("#capLines");
        if (!box) return;
        box.querySelectorAll("[data-line]").forEach((d) => d.classList.remove("capsrc"));
        const f = r.fields.find((x) => x.key === capWork.focusKey);
        if (f && f.source) {
          const d = box.querySelector(`[data-line="${f.source.line}"]`);
          if (d) {
            d.classList.add("capsrc");
            d.scrollIntoView({ block: "nearest" });
          }
        }
      }

      function captureFormPane() {
        /* Guarded because the teardown order is genuinely racy: pressing "Confirmar"
     blurs whatever field had focus, and a blur fires `change` — which lands
     AFTER the save has already closed the screen and cleared capWork. */
        if (!capWork) return;
        const r = capWork.result;
        const host = $("#capForm");
        if (!r) {
          host.innerHTML = `<div class="pbh">Datos</div><div class="pbbody">
      <div class="empty">No se ha leído nada del documento. Escriba los datos a mano; la imagen queda adjunta igualmente.</div></div>`;
          return;
        }
        const badChecks = r.checks.filter((c) => c.status === "mismatch");
        host.innerHTML = `<div class="pbh">Datos leídos<span style="flex:1"></span>
     <span class="tag">${r.profile.id.split("/")[1] || r.profile.id}</span></div>
   ${
     badChecks.length
       ? `<div class="pbbody" style="padding-bottom:0">${badChecks
           .map(
             (c) =>
               `<div class="it"><span class="pill r">No cuadra</span> <span>${esc(c.detail)}</span></div>`,
           )
           .join("")}</div>`
       : ""
   }
   ${CAP_FIELDS.map(([key, label]) => {
     const f = r.fields.find((x) => x.key === key);
     const why = f.reasons.slice(0, 2).join(" · ");
     return `<div class="capf${capWork.focusKey === key ? " on" : ""}" data-f="${key}">
       <span class="dot ${f.verdict}" title="${f.verdict === "green" ? "Comprobado" : "Sin comprobar — revíselo"}"></span>
       <label for="cap_${key}">${label}</label>
       <input id="cap_${key}" data-key="${key}" value="${esc(capShown(f))}"
         ${CAP_AMOUNTS.has(key) ? 'inputmode="decimal"' : ""}>
       ${why ? `<div class="capwhy">${esc(why)}</div>` : ""}
      </div>`;
   }).join("")}
   <div class="pbbody"><div class="it" style="color:var(--muted)">Un punto verde significa que algo ha comprobado el dato — un dígito de control, una fecha real, una suma que cuadra. Ámbar significa que nadie lo ha comprobado, por muy claro que se leyera.</div></div>`;

        host.querySelectorAll(".capf").forEach((row) => {
          row.onclick = () => {
            if (!capWork) return;
            capWork.focusKey = row.dataset.f;
            captureFormPane();
            captureHighlight();
            const i = document.getElementById("cap_" + row.dataset.f);
            if (i) i.focus();
          };
        });
        host.querySelectorAll("input[data-key]").forEach((inp) => {
          inp.onchange = () => {
            if (!capWork || !capWork.result) return;
            const key = inp.dataset.key;
            const raw = inp.value.trim();
            const value =
              raw === ""
                ? null
                : CAP_AMOUNTS.has(key)
                  ? Math.round(Number(raw.replace(",", ".")) * 100)
                  : raw;
            // Re-check through the capability — the same arithmetic and the same
            // check digits the reading was judged by, so a typed value earns its
            // dot exactly as a read one does.
            capWork.result = ErpBridge.extraction.recheck(capWork.result, {
              [key]: Number.isNaN(value) ? null : value,
            });
            captureFormPane();
            captureHighlight();
            const again = document.getElementById("cap_" + key);
            if (again) {
              again.focus();
            }
            const a = $("#capAmber");
            if (a)
              a.textContent = capWork.result.fields.filter((f) => f.verdict === "amber").length;
          };
        });
        // The specification's own instruction: the cursor starts on the first thing
        // that needs a person.
        if (capWork.focusKey) {
          const i = document.getElementById("cap_" + capWork.focusKey);
          if (i) i.focus();
        }
      }

      /** Write the record — the only moment anything reaches the company's data. */
      function captureSave() {
        const w = capWork,
          r = w.result;
        const val = (k) => {
          const f = r && r.fields.find((x) => x.key === k);
          return f ? f.value : null;
        };
        const key = "cap_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
        const store = ErpStore.putBlob(key, w.file).catch(() => null);
        store
          .then(() => {
            mutate(() => {
              const cap = erp.captureDocument(
                {
                  docType: w.docType,
                  imageRef: key,
                  // Gap 10. A browser only knows what it was handed: the file's own name,
                  // or the path below the folder when a whole folder was chosen. That is
                  // less than the workbook's "Ruta completa" and it is what is true —
                  // the field is editable in the document's panel for the rest.
                  sourcePath: w.file.webkitRelativePath || w.file.name || "",
                  // Gap 11. The reader offers an order reference when it finds one; it
                  // is never green (nothing can check it), so it arrives here as a
                  // proposal a person has already seen on the validation screen.
                  reference: (r && (r.fields.find((f) => f.key === "orderRef") || {}).value) || "",
                  machineReadable: w.recognised.engine === "pdf-text",
                  // The reading travels with the record, unconfirmed, so that what the
                  // machine proposed stays visible beside what the person accepted.
                  extractable: r
                    ? {
                        fields: r.fields.map((f) => ({
                          key: f.key,
                          value: f.value,
                          verdict: f.verdict,
                          confidence: f.confidence,
                          raw: f.raw,
                        })),
                        profile: r.profile,
                        engine: w.recognised.engine,
                      }
                    : null,
                  confidence:
                    w.recognised.confidence != null ? w.recognised.confidence / 100 : undefined,
                },
                "backoffice",
              );
              erp.confirmCapture(
                cap.id,
                {
                  issuerName: val("issuerName") || "",
                  issuerTaxId: val("issuerTaxId") || "",
                  docNumber: val("docNumber") || "",
                  date: val("issueDate") || erp.today,
                  dueDate: val("dueDate") || null,
                  baseCents: val("netAmount") || 0,
                  vatCents: val("taxAmount") || 0,
                  totalCents: val("totalAmount") || 0,
                  iban: val("iban") || "",
                },
                "backoffice",
              );
            }, "Documento guardado");
          })
          .then(() => captureClose());
      }

      function builderIssues(id, issues) {
        const db = openDrawer("Validación · " + erp.budget(id).number);
        db.innerHTML = `<div class="card"><div class="ch"><h3>${issues.length} incidencias</h3><span class="tag">PRE-09</span></div><div class="daylist">
    ${
      issues
        .map(
          (i) =>
            `<div class="it"><span class="pill ${i.level === "block" ? "r" : "y"}">${i.level === "block" ? "Bloquea" : "Aviso"}</span> <span>${esc(i.line)} — ${esc(i.msg)}</span></div>`,
        )
        .join("") || '<div class="it">Nada que corregir. El presupuesto puede emitirse.</div>'
    }
  </div></div>`;
      }

      /* ---------- Sending (COM-03) ----------
   The last screen before a document leaves, and the only place the pending
   lines are stated as plainly as they deserve: they are NOT in the total the
   customer is about to read, and if nobody says so here the difference is
   discovered by the customer. Blocking issues disable the button rather than
   hiding it, so the reason the presupuesto cannot go is visible. */
      function sendBudgetDrawer(id) {
        const b = erp.budget(id),
          vsel = b.currentVersionId,
          V = erp.version(id, vsel);
        const t = erp.budgetTotals(id, vsel);
        const issues = erp.validateBudget(id);
        const blocks = issues.filter((i) => i.level === "block"),
          warns = issues.filter((i) => i.level === "warn");
        const party = erp.party(b.partyId);
        const db = openDrawer(`Enviar ${b.number} · v${V.vNumber}`);
        // Every sentence below is one whole text node, and every figure sits in an
        // element of its own. A sentence broken across <b> tags is three keys the
        // dictionary can never hold, which is how a screen ends up half translated.
        db.innerHTML = `
   <div class="card"><div class="ch"><h3>Lo que va a recibir el cliente</h3></div><div class="daylist">
    <div class="it"><span>${esc(party.name)}</span><span style="flex:1"></span>
      ${party.email ? `<span>${esc(party.email)}</span>` : '<span class="pill y">sin correo</span>'}</div>
    <div class="it"><span>Total</span><span style="flex:1"></span><b>${eur(t.grandCents)}</b></div>
    <div class="it"><span>Base imponible</span><span style="flex:1"></span><b>${eur(t.taxableCents)}</b></div>
    <div class="it"><span>IVA</span><span style="flex:1"></span><b>${t.vatBp / 100}%</b></div>
    <div class="it"><span>Idioma del documento</span><span style="flex:1"></span>
      <b>${b.language === "ca" ? "Català" : "Español"}</b></div>
    <div class="it"><span>Validez</span><span style="flex:1"></span><b>${fmtD(b.validityDate)}</b></div>
   </div></div>
   ${
     t.pendingCount
       ? `<div class="card"><div class="ch"><h3>Pendientes de precio</h3><span class="tag">no van en el total</span></div>
    <div class="daylist">
     <div class="it"><span>Partidas sin precio todavía</span><span style="flex:1"></span>
       <span class="pill y">${t.pendingCount}</span></div>
     <div class="it"><span>Valoradas provisionalmente en</span><span style="flex:1"></span><b>${eur(t.pendingEstCents)}</b></div>
     <div class="it"><span>No están incluidas en el total y no se imprimen en el documento.</span></div>
    </div></div>`
       : ""
   }
   ${
     blocks.length
       ? `<div class="card"><div class="ch"><h3>Bloqueos</h3><span class="tag">${blocks.length}</span></div><div class="daylist">
    ${blocks.map((i) => `<div class="it"><span class="pill r">Bloquea</span> <span>${esc(i.line)} — ${esc(i.msg)}</span></div>`).join("")}</div></div>`
       : ""
   }
   ${
     warns.length
       ? `<div class="card"><div class="ch"><h3>Avisos</h3><span class="tag">${warns.length}</span></div><div class="daylist">
    ${warns.map((i) => `<div class="it"><span class="pill y">Aviso</span> <span>${esc(i.line)} — ${esc(i.msg)}</span></div>`).join("")}</div></div>`
       : ""
   }
   <div class="card"><div class="ch"><h3>Enviar</h3></div><div class="daylist" style="gap:9px">
    <div class="it"><label class="opt">Canal
      <select id="sbChannel" style="margin-left:auto">
       <option value="email">Correo electrónico</option>
       <option value="whatsapp">WhatsApp</option>
       <option value="hand">En mano</option>
      </select></label></div>
    <div class="it" id="sbWaWarn" style="display:none"><span class="pill y">Sin móvil registrado — añádalo en Datos maestros para poder abrir WhatsApp</span></div>
    <div class="it" id="sbHandDateRow" style="display:none"><label class="opt">Fecha de envío
      <input id="sbHandDate" type="date" value="${esc(erp.today)}" max="${esc(erp.today)}" style="margin-left:auto"></label></div>
    <div class="it" id="sbHandTimeRow" style="display:none"><label class="opt">Hora
      <input id="sbHandTime" type="time" value="${nowHHMM()}" style="margin-left:auto"></label></div>
    <div class="it"><span>Al enviar, esta versión queda congelada: el documento del cliente se podrá reproducir siempre tal cual salió. Para cambiar algo después hay que crear una versión nueva.</span></div>
    <div class="it"><button class="btn sm" id="sbDownload">⤓ Descargar</button><span style="flex:1"></span>
     <button class="btn primary" id="sbGo"${blocks.length ? " disabled" : ""}>${blocks.length ? "Corrija los bloqueos primero" : "Enviar y congelar la versión"}</button></div>
   </div></div>`;
        $("#sbDownload").onclick = () => downloadBudgetPdf(id, vsel);
        const chSel = $("#sbChannel");
        const go = $("#sbGo");
        // Progressive disclosure, not a second popup: slide 1 asked for a
        // pop-up to catch the date and time on "en mano", but this drawer IS
        // already the one screen that question belongs to — a field that
        // only appears once it is relevant reads the same to the operator
        // and does not stack a modal on top of an open drawer.
        const syncChannel = () => {
          const ch = chSel.value;
          const isHand = ch === "hand";
          const isWa = ch === "whatsapp";
          const waBlocked = isWa && !party.mobile;
          $("#sbHandDateRow").style.display = isHand ? "" : "none";
          $("#sbHandTimeRow").style.display = isHand ? "" : "none";
          $("#sbWaWarn").style.display = waBlocked ? "" : "none";
          if (!blocks.length) {
            go.disabled = waBlocked;
            go.textContent = waBlocked
              ? "Añada un móvil para enviar por WhatsApp"
              : "Enviar y congelar la versión";
          }
        };
        chSel.onchange = syncChannel;
        syncChannel();
        if (go && !blocks.length)
          go.onclick = () => {
            const ch = chSel.value;
            let waLink = null;
            mutate(() => {
              const opts = { channel: ch };
              if (ch === "hand") {
                opts.sentDate = $("#sbHandDate").value || erp.today;
                opts.sentTime = $("#sbHandTime").value || null;
              }
              erp.issueVersion(id, opts, "backoffice");
              // The covering message — not the document itself — comes from
              // the operator's own "Envío de presupuesto" template in
              // Configuración → Comunicaciones, exactly as slide 1 asked.
              if (ch === "email" || ch === "whatsapp") {
                const tpl = erp.commsTemplate("quote-send");
                if (tpl) {
                  const vars = { number: b.number, cliente: party.name };
                  const C = commsApi();
                  const body = C ? C.render(tpl.body, vars) : tpl.body;
                  if (ch === "whatsapp" && party.mobile)
                    waLink =
                      "https://wa.me/" +
                      waPhone(party.mobile) +
                      "?text=" +
                      encodeURIComponent(body);
                  if (ch === "email") {
                    // Recorded through the SAME log-only queue every other
                    // communication in this system goes through (§5.7's own
                    // note: "the mandate is explicit — no real emails"). This
                    // is a person pressing send on ONE specific message, not
                    // an automated rule, so it is queued and marked sent in
                    // the same motion rather than left for a later approval
                    // step nobody is waiting to give.
                    const q = erp.queueCommunication(
                      {
                        ruleId: null,
                        event: "quote-send",
                        subjectRef: b.number,
                        template: tpl.key,
                        to: party.email,
                        channel: "email",
                        dueDate: erp.today,
                        vars,
                      },
                      "backoffice",
                    );
                    erp.approveCommunication(q.id, "backoffice");
                    erp.recordCommunicationSent(q.id, "backoffice");
                  }
                }
              }
              closeDrawer();
            }, "Presupuesto enviado — versión congelada");
            // A real send — even the WhatsApp text prefill — is a browser
            // side effect, not a state mutation, so it happens once mutate()
            // has actually committed rather than racing it.
            if (waLink) window.open(waLink, "_blank", "noopener");
          };
      }

      /* The customer's answer. One version, one answer — so this drawer closes the
   question for good, in whichever direction. */
      function budgetResponseDrawer(id, versionId) {
        const b = erp.budget(id),
          V = erp.version(id, versionId);
        const reasons = erp.listActive("lossReasons");
        const db = openDrawer(`Respuesta del cliente · ${b.number} v${V.vNumber}`);
        db.innerHTML = `
   <div class="card"><div class="ch"><h3>Aceptar</h3></div><div class="daylist" style="gap:9px">
    <div class="it">Aceptar crea el proyecto y da la oportunidad por ganada. La versión queda cerrada.</div>
    <div class="it" style="display:block"><label class="opt" style="margin-bottom:6px">Justificante</label>
     <div id="brEvid"></div></div>
    <div class="it"><label class="opt">Fecha de aceptación
      <input id="brDate" type="date" value="${esc(erp.today)}" max="${esc(erp.today)}" style="margin-left:auto"></label></div>
    <div class="it"><label class="opt">Quién lo ha aceptado
      <input id="brWho" placeholder="Nombre o puesto" style="margin-left:auto"></label></div>
    <div class="it"><button class="btn primary" id="brOk">Marcar como aceptado</button></div>
   </div></div>
   <div class="card"><div class="ch"><h3>Rechazar</h3></div><div class="daylist" style="gap:9px">
    <div class="it">Rechazar da la oportunidad por perdida con el motivo elegido, que es el mismo que cuentan los informes de conversión.</div>
    <div class="it"><label class="opt">Motivo
      <select id="brReason" style="margin-left:auto">${listOptions("lossReasons", "")}</select></label></div>
    <div class="it"><label class="opt">Qué dijo <input id="brNotes" placeholder="Opcional" style="margin-left:auto"></label></div>
    <div class="it"><button class="btn danger" id="brNo"${reasons.length ? "" : " disabled"}>Marcar como rechazado</button></div>
   </div></div>`;
        // The backing document is a file now, not a typed filename — see the
        // evidence field for why the blob is written before this form is saved.
        const evid = evidenceField($("#brEvid"), {
          prefix: "acc",
          hint: "Arrastra aquí el correo o el documento de aceptación (PDF o imagen), o búscalo en el dispositivo.",
        });
        $("#brOk").onclick = () =>
          mutate(() => {
            erp.acceptVersion(
              id,
              versionId,
              {
                evidence: evid.value(),
                date: $("#brDate").value || null,
                acceptedBy: $("#brWho").value.trim() || null,
              },
              "backoffice",
            );
            closeDrawer();
          }, "Presupuesto aceptado");
        const no = $("#brNo");
        if (no && reasons.length)
          no.onclick = () =>
            mutate(() => {
              erp.rejectVersion(
                id,
                versionId,
                { reason: $("#brReason").value, notes: $("#brNotes").value },
                "backoffice",
              );
              closeDrawer();
            }, "Presupuesto rechazado");
      }

      /* ---------- "Siguiente paso" (Package 1, slide 9) ----------
   Everything that belongs to FINISHING a presupuesto, in the order it is
   actually done: the money terms, then what the price does not include, then
   what the system objects to, then send. It replaced three buttons scattered
   along the bottom bar — Exclusiones, Validar, and a separate Enviar in the
   header — which is what made that zone "rara": three unrelated endings side
   by side with the fields you use while writing lines.

   The validation runs on OPEN rather than behind a button. A check somebody
   has to remember to press is a check that gets skipped, and this drawer
   exists precisely at the moment it matters. */
      function budgetNextStepDrawer(id, vsel) {
        const b = erp.budget(id);
        const cur = erp.version(id, vsel);
        const locked = cur.frozen || cur.issued || !!b.acceptedVersionId;
        const issues = erp.validateBudget(id);
        const blocks = issues.filter((i) => i.level === "block");
        const warns = issues.filter((i) => i.level === "warn");
        const t = erp.budgetTotals(id, vsel);
        const db = openDrawer(`Siguiente paso · ${b.number}`);
        const listCard = (key, title, help) => `
   <div class="card"><div class="ch"><h3>${title}</h3><span class="tag">${(b[key] || []).length}</span></div>
    <div class="daylist">
     <div class="it" style="color:var(--muted)">${help}</div>
     ${
       (b[key] || [])
         .map(
           (x, i) => `<div class="it"><span>${esc(x)}</span><span style="flex:1"></span>
       ${locked ? "" : `<button class="btn sm danger" data-del="${key}:${i}">✕</button>`}</div>`,
         )
         .join("") || '<div class="it" style="color:var(--muted)">Ninguna todavía.</div>'
     }
     ${locked ? "" : `<div class="it"><input id="bc_${key}" placeholder="Añadir y pulsar Enter" style="flex:1"></div>`}
    </div></div>`;
        db.innerHTML = `
   <div class="card"><div class="ch"><h3>Resumen</h3><span class="tag">${cur.chapters.length} capítulos</span></div>
    <div class="daylist">
     <div class="it">Base <b>${eur(t.baseCents)}</b> · IVA ${t.vatBp / 100}% <b>${eur(t.vatCents)}</b></div>
     <div class="it">Total <b>${eur(t.grandCents)}</b></div>
     <div class="it" style="color:var(--muted)">Margen ${eur(t.marginBaseCents)} · ${t.marginBasePct}% — no sale del documento</div>
    </div></div>
   ${
     locked
       ? ""
       : `<div class="card"><div class="ch"><h3>Condiciones de pago</h3></div>
     <div class="fgrid" style="padding:12px 16px">
      <div class="field full"><select id="ns_pay">${listOptionsCreatable("paymentConditions", b.paymentConditions || "")}</select></div>
     </div></div>`
   }
   ${listCard("exclusions", "Exclusiones", "Lo que el precio NO incluye. Se imprime bajo los totales.")}
   ${listCard("assumptions", "Supuestos", "Aquello que se ha dado por cierto al valorar; si cambia, cambia el precio.")}
   <div class="card"><div class="ch"><h3>Comprobación</h3>
     <span class="pill ${blocks.length ? "r" : warns.length ? "y" : "g"}">${
       blocks.length
         ? blocks.length + " " + (blocks.length === 1 ? "bloqueo" : "bloqueos")
         : warns.length
           ? warns.length + " " + (warns.length === 1 ? "aviso" : "avisos")
           : "sin incidencias"
     }</span></div>
    <div class="daylist">
     ${
       issues
         .map(
           (i) =>
             `<div class="it"><span class="pill ${i.level === "block" ? "r" : "y"}">${i.level === "block" ? "bloquea" : "aviso"}</span>
        <span style="flex:1">Partida ${esc(i.line)} — ${esc(i.msg)}</span></div>`,
         )
         .join("") ||
       '<div class="it">Nada que corregir: todas las partidas tienen cantidad, precio y coste coherentes.</div>'
     }
    </div></div>
   ${
     locked
       ? '<div class="card"><div class="daylist"><div class="it">Esta versión ya está congelada: se conserva tal como se envió.</div></div></div>'
       : `<div style="margin-top:10px">
     <button class="btn primary" id="ns_send"${blocks.length ? ' disabled title="Hay partidas que bloquean el envío"' : ""}>Enviar al cliente →</button>
     ${blocks.length ? '<div class="mhint" style="margin-top:6px">Corrige los bloqueos de arriba y vuelve a abrir este paso.</div>' : ""}
    </div>`
   }`;
        if (locked) return;
        wireCreatableSelect("#ns_pay", "paymentConditions", "Condiciones de pago", (code) =>
          mutate(
            () => erp.updateBudget(id, { paymentConditions: code }, "backoffice"),
            "Condiciones de pago actualizadas",
          ),
        );
        ["exclusions", "assumptions"].forEach((key) => {
          const inp = $("#bc_" + key);
          if (!inp) return;
          inp.onkeydown = (e) => {
            if (e.key !== "Enter") return;
            const val = inp.value.trim();
            if (!val) return;
            mutate(() => {
              erp.updateBudget(id, { [key]: [...(b[key] || []), val] }, "backoffice");
              budgetNextStepDrawer(id, vsel);
            }, "Añadido");
          };

      /* ---------- Gallery for one line (Improvement #1) ----------
   The pictures of a line are managed here and printed nowhere near it. Sources
   are the four the spec names: the catalogue item's own reference picture, a
   photo from the site visit, a file from this computer, and the phone camera
   (same input, `capture` set, which is what a mobile browser needs to open the
   camera instead of the file browser). Everything is compressed before it is
   stored. */
      function lineImagesDrawer(budgetId, lineId) {
        const b = erp.budget(budgetId),
          vsel = b.currentVersionId;
        const found = erp.findLine(budgetId, lineId, vsel);
        if (!found) return;
        const V = erp.version(budgetId, vsel);
        const locked = V.frozen || V.issued || b.acceptedVersionId === V.id;
        const l = found.line;
        const item = l.itemId ? erp.state.catalogue.find((c) => c.id === l.itemId) : null;
        const catImgs = ((item && item.imageRefs) || []).filter(
          (r) => !l.imageRefs.some((x) => x.storageKey === (r.storageKey || r)),
        );
        const visitPhotos = erp.state.visits
          .flatMap((x) => (x.photos || []).map((p) => (typeof p === "string" ? p : p.storageKey)))
          .filter(Boolean)
          .filter((p) => !l.imageRefs.some((x) => x.storageKey === p));
        const SRC = { catalogue: "catálogo", visit: "visita", upload: "archivo", camera: "cámara" };

        const db = openDrawer(`Imágenes · ${l.num} ${l.desc || ""}`);
        db.innerHTML = `
   <div class="card"><div class="ch"><h3>${l.imageRefs.length} imágenes</h3>
     <span class="tag">${b.annex && b.annex.enabled ? "el anexo está activo" : "el anexo está desactivado"}</span></div>
    <div class="daylist"><div class="it">Las imágenes no se imprimen en la fila de la partida: se reúnen en el anexo gráfico al final del documento, con su capítulo, su número de partida y su descripción.</div></div>
    <div class="gal" style="padding:0 16px 14px">
     ${
       l.imageRefs
         .map(
           (im, i) => `<div class="gi" data-img="${im.id}">
       <img data-blob="${esc(im.storageKey)}" alt="">
       <div class="m">
        <input type="text" data-cap="${im.id}" value="${esc(im.caption)}" placeholder="Pie de imagen (opcional)"${locked ? " disabled" : ""}>
        <div class="b">
         <label><input type="checkbox" data-int="${im.id}"${im.internal ? " checked" : ""}${locked ? " disabled" : ""}> Sólo uso interno</label>
         <span class="pill">${SRC[im.source] || im.source}</span>
         ${im.sizeBytes ? `<span class="pill">${Math.round(im.sizeBytes / 1024)} KB</span>` : ""}
         <span style="flex:1"></span>
         ${
           locked
             ? ""
             : `<button class="btn sm" data-up="${im.id}"${i === 0 ? " disabled" : ""}>↑</button>
         <button class="btn sm" data-down="${im.id}"${i === l.imageRefs.length - 1 ? " disabled" : ""}>↓</button>
         <button class="btn sm danger" data-del="${im.id}">✕</button>`

     }
    </div>
   </div>
   ${
     locked
       ? '<div class="card"><div class="daylist"><div class="it">La versión está congelada: su anexo se conserva tal como se emitió.</div></div></div>'
       : `
   <div class="card"><div class="ch"><h3>Añadir</h3></div><div class="daylist" style="gap:9px">
     <div class="it"><label class="btn sm">Desde el ordenador<input type="file" id="imgFile" accept="image/*" multiple hidden></label>
       <label class="btn sm">Cámara<input type="file" id="imgCam" accept="image/*" capture="environment" hidden></label></div>
     ${catImgs.length ? `<div class="it"><button class="btn sm" id="imgCat">Imagen del catálogo (${catImgs.length})</button></div>` : ""}
     ${visitPhotos.length ? `<div class="it"><button class="btn sm" id="imgVisit">Foto de la visita (${visitPhotos.length})</button></div>` : ""}
   </div></div>`
   }`;

        paintImages(db);
        if (locked) return;
        db.querySelectorAll("[data-cap]").forEach(
          (inp) =>
            (inp.onchange = () =>
              mutate(
                () =>
                  erp.updateLineImage(budgetId, lineId, inp.dataset.cap, { caption: inp.value }),

        );
        db.querySelectorAll("[data-int]").forEach(
          (cb) =>
            (cb.onchange = () =>
              mutate(
                () => {
                  erp.updateLineImage(budgetId, lineId, cb.dataset.int, { internal: cb.checked });

                },
                cb.checked ? "Imagen marcada como interna" : "Imagen incluida en el anexo",
              )),
        );
        db.querySelectorAll("[data-up]").forEach(
          (x) =>
            (x.onclick = () =>
              mutate(() => {
                erp.moveLineImage(budgetId, lineId, x.dataset.up, -1);
                lineImagesDrawer(budgetId, lineId);
              }, "Orden actualizado")),
        );
        db.querySelectorAll("[data-down]").forEach(
          (x) =>
            (x.onclick = () =>
              mutate(() => {
                erp.moveLineImage(budgetId, lineId, x.dataset.down, 1);
                lineImagesDrawer(budgetId, lineId);
              }, "Orden actualizado")),
        );
        db.querySelectorAll("[data-del]").forEach(
          (x) =>
            (x.onclick = () =>
              mutate(() => {
                erp.removeLineImage(budgetId, lineId, x.dataset.del);
                lineImagesDrawer(budgetId, lineId);
              }, "Imagen eliminada")),
        );

        const take = (input, source) => {
          if (!input) return;
          input.onchange = () => storeLineImages(budgetId, lineId, [...input.files], source);
        };
        take($("#imgFile"), "upload");
        take($("#imgCam"), "camera");
        const cat = $("#imgCat");
        if (cat)
          cat.onclick = () =>
            mutate(() => {
              const r = catImgs[0];
              erp.attachLineImage(
                budgetId,
                lineId,
                {
                  storageKey: r.storageKey || r,
                  source: "catalogue",
                  caption: (item && item.desc) || "",
                },
                "backoffice",
              );
              lineImagesDrawer(budgetId, lineId);
            }, "Imagen del catálogo añadida");
        const vis = $("#imgVisit");
        if (vis)
          vis.onclick = () =>
            mutate(() => {
              erp.attachLineImage(
                budgetId,
                lineId,
                { storageKey: visitPhotos[0], source: "visit" },
                "backoffice",
              );
              lineImagesDrawer(budgetId, lineId);
            }, "Foto de la visita añadida");
      }

      /** Compress → blob store → engine reference. Bytes never enter the state blob. */
      async function storeLineImages(budgetId, lineId, files, source) {
        if (!files.length) return;
        let added = 0;
        for (const f of files) {
          if (!/^image\//.test(f.type || "")) {
            toast("⚠ " + f.name + " no es una imagen");
            continue;
          }
          try {
            const c =
              typeof ErpBridge !== "undefined" && ErpBridge.docs
                ? await ErpBridge.docs.compressImage(f)
                : { blob: f, mime: f.type, width: 0, height: 0 };
            const key =
              "img_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
            await ErpStore.putBlob(key, c.blob);
            erp.attachLineImage(
              budgetId,
              lineId,
              {
                storageKey: key,
                source,
                mime: c.mime,
                sizeBytes: c.blob.size || 0,
                width: c.width,
                height: c.height,
              },
              "backoffice",
            );
            added++;
          } catch (e) {
            toast("⚠ " + e.message);
          }
        }
        if (added) {
          persist();
          render();
          lineImagesDrawer(budgetId, lineId);
          toast(`${added} ${added === 1 ? "imagen añadida" : "imágenes añadidas"}`);
        }
      }

      /* ===================== DMC-03/04/05 · the lists the owner maintains ================
   Three subsecciones, one renderer. They differ only in which list kinds they
   show and what the help column says, so writing them three times would be
   three chances for the same edit-and-save behaviour to drift.

   The editing model is the doc's: no drawer, no modal, no save button. A cell
   is an input; Enter or moving away commits it. That is right for a screen
   whose whole content is twenty short labels — a drawer per row would be more
   interaction than the data justifies.

   Two things are deliberately NOT offered:

     * renaming a code. Records store the code forever, so an editable code is
       an offer to break every record already carrying it. The label is what
       people read and the label is what is editable.
     * deleting an entry. Deactivate, never delete — the system-wide rule. A
       retired entry leaves the pickers and keeps resolving on the records
       that already carry it, which is why the "en uso" count is shown beside
       the retire button rather than used to block it. */
      const LIST_META = {
        units: {
          title: "Unidades de medida",
          code: "DMC-03",
          singular: "unidad",
          codeLabel: "Símbolo",
          codePlaceholder: "m2",
          esPlaceholder: "metro cuadrado",
          caPlaceholder: "metre quadrat",
        },
        leadSources: {
          title: "Fuentes de leads",
          code: "DMC-04",
          singular: "fuente",
          codeLabel: "Código",
          codePlaceholder: "feriaLocal",
          esPlaceholder: "Feria local",
          caPlaceholder: "Fira local",
        },
        lossReasons: {
          title: "Motivos de pérdida",
          code: "DMC-04",
          singular: "motivo",
          codeLabel: "Código",
          codePlaceholder: "plazo",
          esPlaceholder: "Plazo",
          caPlaceholder: "Termini",
        },
        paymentMethods: {
          title: "Formas de pago",
          code: "DMC-05",
          singular: "forma de pago",
          codeLabel: "Código",
          codePlaceholder: "transfer15",
          esPlaceholder: "Transferencia 15 días",
          caPlaceholder: "Transferència 15 dies",
        },
        // Package 1 (#4, #9): the code IS the wording here, not an
        // abbreviation — a payment split or a next action is typed once, not
        // coined as an identifier and then labelled. Editing "Nombre (ES)"
        // still works exactly as it does for the other lists; it is just also
        // what got stored the first time.
        paymentConditions: {
          title: "Condiciones de pago",
          code: "DMC-05",
          singular: "condición",
          codeIsLabel: true,
          esPlaceholder: "40% a la firma · 60% a la entrega",
          caPlaceholder: "40% a la signatura · 60% a l'entrega",
        },
        nextActions: {
          title: "Próximas acciones",
          code: "DMC-04",
          singular: "acción",
          codeIsLabel: true,
          esPlaceholder: "Llamar la semana que viene",
          caPlaceholder: "Trucar la setmana que ve",
        },
      };
      /** New-row drafts, keyed by list kind, so a half-typed entry survives re-render. */
      const listDraft = {};
      /** DMC-02's partida filter. A view concern, so it lives here, not in state. */
      let priceItem = "";
      /* ADM-07's wizard step, and where each kind of exception is actually fixed.
   An exception that cannot be acted on is a complaint; the route turns it into
   a task. Kinds with no obvious single screen are left off the map rather than
   pointed somewhere approximate. */
      let gesStep = 1;
      const EXC_ROUTE = {
        billNoDoc: ["supplier-invoices", "facturas de proveedores"],
        partyNoTaxId: ["suppliers", "proveedores"],
        movUnallocated: ["banking", "banco"],
        receiptUnmatched: ["invoicing", "facturación"],
        cashNoDoc: ["petty-cash", "caja chica"],
      };
      /** DMC-01: the selected chapter ("" = all), the tree's own search, and the drag. */
      let catChapter = "",
        catTreeQ = "",
        catQ = "",
        catDrag = null;

      /**
       * A picker over one of the owner-maintained lists.
       *
       * The option VALUE is the code and the option TEXT is the label, which is the
       * whole point of moving these lists into the document: a customer's origin
       * used to render as `referrer` because the list had codes and nothing else.
       *
       * A `selected` code that is no longer active is still offered, marked as
       * retired. Dropping it would silently rewrite the record to whatever happens
       * to be first in the list the next time somebody opens the drawer and saves —
       * a retired list entry must not be able to change data behind somebody's back.
       */
      function listOptions(kind, selected) {
        const rows = erp.listActive(kind).slice();
        if (selected && !rows.some((r) => r.code === selected)) {
          const gone = erp.listAll(kind).find((r) => r.code === selected);
          rows.unshift(
            gone
              ? Object.assign({}, gone, { _retired: true })
              : { code: selected, es: selected, _retired: true },
          );
        }
        return rows
          .map(
            (r) =>
              `<option value="${esc(r.code)}"${r.code === selected ? " selected" : ""}>${esc(r.es || r.code)}${r._retired ? " (retirada)" : ""}</option>`,
          )
          .join("");
      }

      /**
       * `listOptions` plus a trailing "＋ Nueva…" choice — for the two lists
       * where the operator's own wording IS the value (a próxima acción, a
       * condición de pago) rather than a short code picked from a fixed set.
       * Package 1 asked for exactly this on both: choose from what exists, or
       * type the one that doesn't and have it be there next time too.
       */
      function listOptionsCreatable(kind, selected) {
        return listOptions(kind, selected) + `<option value="__new__">＋ Nueva…</option>`;
      }
      /**
       * Wires a `<select>` built by `listOptionsCreatable`. Picking "＋
       * Nueva…" asks for the wording, writes it into `state.lists[kind]`
       * (so DMC-04/05 sees it and it survives past this one record), selects
       * it, and calls `onSet(code)` — the same callback an ordinary choice
       * gets. Cancelling restores whatever was selected before.
       *
       * `onSet` is optional: the leads screens only read `.value` when their
       * own Guardar button is pressed, so they pass nothing and the select's
       * value is enough; the presupuestador auto-saves on change and passes
       * its `hdr()` handler.
       */
      function wireCreatableSelect(elId, kind, label, onSet) {
        const el = $(elId);
        if (!el) return;
        let current = el.value;
        el.onchange = async () => {
          if (el.value !== "__new__") {
            current = el.value;
            if (onSet) onSet(el.value);
            return;
          }
          const text = await askText("Nueva entrada", {
            label,
            required: true,
            okLabel: "Añadir",
          });
          if (text === null) {
            el.value = current;
            return;
          }
          const code = text.trim();
          try {
            if (!erp.listAll(kind).some((r) => r.code === code))
              erp.addListEntry(kind, { code, es: code }, "backoffice");
          } catch (e) {
            toast("⚠ " + e.message);
            el.value = current;
            return;
          }
          persist();
          el.innerHTML = listOptionsCreatable(kind, code);
          current = code;
          if (onSet) onSet(code);
          else toast("Añadida a la lista");
        };
      }

      function listConfigTable(kind) {
        const m = LIST_META[kind];
        const rows = erp.listAll(kind);
        const d = listDraft[kind] || { code: "", es: "", ca: "" };
        // paymentConditions / nextActions: the wording IS the code, so a
        // narrow "código" column would just repeat the ES column in miniature
        // — worse, it would wrap a whole sentence into 110px. Their table
        // skips it: one text is typed once and doubles as the identity, the
        // same way the other lists treat their short codes.
        const codeCol = m.codeIsLabel ? "" : `<th style="width:110px">${esc(m.codeLabel)}</th>`;
        return `<div class="card"><div class="ch"><h3>${esc(m.title)}</h3>
    <span class="tag">${rows.filter((r) => r.active !== false).length} activas de ${rows.length}</span></div>
   <div class="scroll"><table><thead><tr>
     ${codeCol}<th>Nombre (ES)</th><th>Nom (CA)</th>
     <th class="num" style="width:70px">En uso</th><th style="width:96px"></th></tr></thead><tbody>
   ${rows
     .map((r) => {
       const used = erp.listEntryUsage(kind, r.code);
       const off = r.active === false;
       const codeCell = m.codeIsLabel ? "" : `<td class="k">${esc(r.code)}</td>`;
       return `<tr${off ? ' class="retired"' : ""}>
      ${codeCell}
      <td><input class="inline" data-lk="${kind}" data-lc="${esc(r.code)}" data-lf="es" value="${esc(r.es)}"></td>
      <td><input class="inline" data-lk="${kind}" data-lc="${esc(r.code)}" data-lf="ca" value="${esc(r.ca || "")}"></td>
      <td class="num">${used || "—"}</td>
      <td><button class="btn sm" data-ltoggle="${kind}" data-lc="${esc(r.code)}" data-lon="${off ? "1" : "0"}">${off ? "Reactivar" : "Retirar"}</button></td></tr>`;
     })
     .join("")}
   <tr>
     ${m.codeIsLabel ? "" : `<td><input class="inline" id="new_${kind}_code" placeholder="${esc(m.codePlaceholder)}" value="${esc(d.code)}"></td>`}
     <td><input class="inline" id="new_${kind}_es" placeholder="${esc(m.esPlaceholder)}" value="${esc(d.es)}"></td>
     <td><input class="inline" id="new_${kind}_ca" placeholder="${esc(m.caPlaceholder)}" value="${esc(d.ca)}"></td>
     <td></td>
     <td><button class="btn sm primary" data-ladd="${kind}">＋ Añadir</button></td></tr>
   </tbody></table></div></div>`;
      }
      function wireListConfig(v) {
        // Label edits commit on change (Enter or moving away), never on keystroke —
        // a re-render per character would take the caret with it.
        v.querySelectorAll("input[data-lk]").forEach(
          (inp) =>
            (inp.onchange = () => {
              const { lk, lc, lf } = inp.dataset;
              mutate(
                () => erp.updateListEntry(lk, lc, { [lf]: inp.value }, "backoffice"),
                "Lista actualizada",
              );
            }),
        );
        v.querySelectorAll("[data-ltoggle]").forEach(
          (b) =>
            (b.onclick = async () => {
              const kind = b.dataset.ltoggle,
                code = b.dataset.lc,
                turningOn = b.dataset.lon === "1";
              const used = erp.listEntryUsage(kind, code);
              if (
                !turningOn &&
                used &&
                !(await askConfirm(`Retirar «${erp.listLabel(kind, code)}»`, {
                  body: `Se usa en ${used} registro${used === 1 ? "" : "s"}. Retirarla la quita de los desplegables; los registros que ya la llevan la conservan y se siguen viendo con su nombre.`,
                  okLabel: "Retirar",
                }))
              )
                return;
              mutate(
                () => erp.setListEntryActive(kind, code, turningOn, "backoffice"),
                turningOn ? "Entrada reactivada" : "Entrada retirada",
              );
            }),
        );
        v.querySelectorAll("[data-ladd]").forEach(
          (b) =>
            (b.onclick = () => {
              const kind = b.dataset.ladd;
              const codeInput = $("#new_" + kind + "_code");
              const es = $("#new_" + kind + "_es").value.trim();
              const ca = $("#new_" + kind + "_ca").value.trim();
              // codeIsLabel kinds have no code box: the Spanish wording being
              // typed is what gets stored, exactly as it would be if this
              // same entry were added inline from the presupuestador or the
              // leads screen (see wireCreatableSelect).
              const code = codeInput ? codeInput.value.trim() : es;
              // Kept before the mutate so a rejected entry (duplicate code, missing
              // name) is still in the boxes when the toast explains why.
              listDraft[kind] = { code, es, ca };
              try {
                erp.addListEntry(kind, { code, es, ca }, "backoffice");
                listDraft[kind] = { code: "", es: "", ca: "" };
                persist();
                render();
                toast("Entrada añadida");
              } catch (e) {
                toast("⚠ " + e.message);
              }
            }),
        );
      }
      function listConfigScreen(v, kinds, sub, help) {
        $("#sub").textContent = sub;
        v.innerHTML = `<div class="cfgwrap">
    <div class="cfgtables${kinds.length > 1 ? " two" : ""}">${kinds.map(listConfigTable).join("")}</div>
    <div class="cfghelp">${help}</div></div>`;
        wireListConfig(v);
      }

      const VIEWS = {
        /* ---------- Torre de control · Mi día (DAS, spec §2.1/§2.2) ----------
    Defined once, above, as standalone functions — big enough (sparklines,
    the alert manager, the hitos calendar) that inlining them here would bury
    the rest of the map, the same reasoning session 10b and 11 used for their
    own screens. */
        tower: torre,

        /* ---------- Clientes y terceros (MDM) ---------- */
        /* ---------- Clientes (spec §3.1) ----------

        /* ---------- Visita (COM-02, spec §COM-02) ----------
    Two blocks, per the doc: programadas above (fixed six rows, own search
    and pagination) and realizadas below (same). A visit is one collection
    with a lifecycle (scheduled → done, S4 engine work), so both blocks read
    the same `state.visits` filtered by status rather than being two
    different kinds of record — scheduling one and completing it are two
    views onto one lifecycle, not two features. */
        visits(v) {
          $("#sub").textContent =
            "Visitas programadas y realizadas. Programar una visita no captura nada todavía; completarla registra mediciones, fotos y notas.";
          v.innerHTML = `<div class="card"><div class="ch"><h3>Programadas</h3></div><div style="padding:10px 14px" id="visProgWrap"></div></div>
    <div class="card" style="margin-top:14px"><div class="ch"><h3>Realizadas</h3></div><div style="padding:10px 14px" id="visRealWrap"></div></div>`;
          const scheduled = erp.state.visits
            .filter((x) => x.status === "scheduled")
            .sort((a, b) => (a.scheduledAt || "").localeCompare(b.scheduledAt || ""));
          const done = erp.state.visits
            .filter((x) => x.status === "done")
            .sort((a, b) => (b.completedAt || "").localeCompare(a.completedAt || ""));
          const OWNER = { operations: "Obra", backoffice: "Oficina" };
          renderMasterList($("#visProgWrap"), {
            id: "visits-programadas",
            fixedSize: 6,
            noExport: true,
            ids: { q: "vpQ", prev: "vpPrev", next: "vpNext", newBtn: "vpNew" },
            newLabel: "＋ Programar visita",
            // Opening this used to schedule against `withOpp[0]` — whichever
            // opportunity happened to be first — so pressing "Programar visita"
            // on the Visitas screen silently picked a customer for you. The
            // question the button actually raises is "for whom", and it now
            // asks it, with the leads that are waiting for a visit listed first.
            onNew: async () => {
              const open = erp.opportunityAges();
              if (!open.length) {
                toast("⚠ No hay oportunidades abiertas para programar una visita");
                return;
              }
              const visitCount = (id) =>
                erp.state.visits.filter((x) => x.opportunityId === id).length;
              const rank = (o) => (visitCount(o.id) === 0 ? 0 : 1);
              const options = open
                .slice()
                .sort((a, b) => rank(a) - rank(b) || b.ageDays - a.ageDays)
                .map((o) => {
                  const n = visitCount(o.id);
                  return {
                    value: o.id,
                    label: erp.party(o.partyId).name,
                    group: n === 0 ? "Sin visita todavía" : "Ya visitados — sería un seguimiento",
                    hint:
                      esc(o.requestedWork) +
                      " · " +
                      o.ageDays +
                      " d" +
                      (n ? " · " + n + " visita" + (n === 1 ? "" : "s") : ""),
                  };
                });
              const pick = await askChoice("¿Para qué lead?", options, {
                body: "Los que aún no se han visitado van primero, y dentro de cada grupo los que llevan más tiempo esperando.",
                okLabel: "Continuar",
                wide: true,
              });
              if (pick === null) return;
              scheduleVisitDrawer(pick);
            },
            searchPlaceholder: "Buscar por cliente",
            nounSingular: "visita programada",
            nounPlural: "visitas programadas",
            baseRows: scheduled,
            matches: (x, q) =>
              erp
                .party(erp.state.opportunities.find((o) => o.id === x.opportunityId).partyId)
                .name.toLowerCase()
                .includes(q),
            columns: [
              {
                label: "Fecha/hora",
                get: (x) => x.scheduledAt,
                html: (x) =>
                  `${fmtD(x.scheduledAt)}${x.scheduledTime ? " " + esc(x.scheduledTime) : ""}`,
              },
              {
                label: "Cliente",
                primary: true,
                get: (x) =>
                  erp.party(erp.state.opportunities.find((o) => o.id === x.opportunityId).partyId)
                    .name,
              },
              {
                label: "Dirección",
                get: (x) => {
                  const p = x.propertyId && erp.state.properties.find((y) => y.id === x.propertyId);
                  return p ? p.street : "";
                },
                html: (x) => {
                  const p = x.propertyId && erp.state.properties.find((y) => y.id === x.propertyId);
                  return p ? esc(p.street) : "—";
                },
              },
              { label: "Responsable", get: (x) => OWNER[x.owner] || x.owner },
              {
                label: "Estado",
                get: (x) => (x.scheduledAt < erp.today ? "Atrasada" : "Programada"),
                html: (x) => {
                  const overdue = x.scheduledAt && x.scheduledAt < erp.today;
                  return `<span class="pill ${overdue ? "r" : "y"}">${overdue ? "Atrasada" : "Programada"}</span>`;
                },
              },
            ],
            onRowClick: (id) => completeVisitDrawer(id),
            emptyText: "Sin visitas programadas.",
          });
          renderMasterList($("#visRealWrap"), {
            id: "visits-realizadas",
            fixedSize: 6,
            noExport: true,
            noNew: true,
            ids: { q: "vrQ", prev: "vrPrev", next: "vrNext" },
            searchPlaceholder: "Buscar por cliente",
            nounSingular: "visita realizada",
            nounPlural: "visitas realizadas",
            baseRows: done,
            matches: (x, q) =>
              erp
                .party(erp.state.opportunities.find((o) => o.id === x.opportunityId).partyId)
                .name.toLowerCase()
                .includes(q),
            columns: [
              { label: "Fecha", get: (x) => x.completedAt, html: (x) => fmtD(x.completedAt) },
              {
                label: "Cliente",
                primary: true,
                get: (x) =>
                  erp.party(erp.state.opportunities.find((o) => o.id === x.opportunityId).partyId)
                    .name,
              },
              {
                label: "Dirección",
                get: (x) => {
                  const p = x.propertyId && erp.state.properties.find((y) => y.id === x.propertyId);
                  return p ? p.street : "";
                },
                html: (x) => {
                  const p = x.propertyId && erp.state.properties.find((y) => y.id === x.propertyId);
                  return p ? esc(p.street) : "—";
                },
              },
              { label: "Fotos", get: (x) => (x.photos || []).length },
              {
                label: "Informe",
                get: (x) => (x.notes ? "Sí" : "No"),
                html: (x) =>
                  x.notes ? '<span class="pill g">Sí</span>' : '<span class="pill">No</span>',
              },
              {
                label: "Presupuesto",
                get: (x) =>
                  x.budgetId
                    ? erp.state.budgets.find((b) => b.id === x.budgetId)?.number || ""
                    : "",
                html: (x) => {
                  const b = x.budgetId && erp.state.budgets.find((y) => y.id === x.budgetId);
                  return b ? esc(b.number) : '<span class="pill y">Sin crear</span>';
                },
