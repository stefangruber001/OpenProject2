<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Canei Subirats — ERP</title>
<style>
  :root{
    --green:#48733c; --greenLt:#6ba85a; --greenDeep:#31532a; --greenSoft:#e7f0e1; --greenPale:#dce8d4; --spark:#f2c230;
    --ink:#14160f; --body:#4f5347; --muted:#8b8f80; --faint:#aab0a0;
    --line:#dde5d6; --hair:#e7eee1; --bg:#eef3ea; --paper:#fff;
    --danger:#b4402f; --dangerSoft:#f6e3df; --amber:#8a6d12; --amberSoft:#fbf0cf; --blue:#4f6b86; --blueSoft:#e6edf3;
    --shadow:0 1px 2px rgba(24,32,16,.03), 0 18px 40px -24px rgba(24,32,16,.18);
    --serif:"Roboto Serif",Georgia,serif; --sans:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; --mono:ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{touch-action:manipulation;-webkit-text-size-adjust:100%;overflow-x:hidden}
  body{margin:0;color:var(--body);font:14.5px/1.55 var(--sans);letter-spacing:-.004em;min-height:100vh;overflow-x:hidden;
    background:radial-gradient(1100px 560px at 90% -14%, rgba(72,115,60,.15), transparent 58%),
               radial-gradient(760px 430px at -6% 2%, rgba(242,194,48,.09), transparent 55%), var(--bg);
    -webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--serif);color:var(--ink);font-weight:600;margin:0;letter-spacing:-.02em}
  a{color:var(--green);text-decoration:none}
  .native-app .topbar{padding-top:max(12px,env(safe-area-inset-top))}

  .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;
    background:rgba(255,255,255,.85);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .nm{font-family:var(--serif);font-weight:600;font-size:15.5px;color:var(--ink);line-height:1;white-space:nowrap}
  .brand .nm small{display:block;font:600 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--green);margin-top:3px}
  .tsp{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;font:600 12.5px var(--sans);border-radius:10px;padding:8px 12px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:color-mix(in srgb,var(--green) 40%,var(--line));transform:translateY(-1px);box-shadow:var(--shadow)}
  .btn.primary{background:linear-gradient(120deg,var(--greenDeep),var(--green) 70%);color:#fff;border-color:transparent}
  .btn.sm{padding:5px 9px;font-size:11.5px;border-radius:8px}
  .btn.danger{color:var(--danger);border-color:var(--dangerSoft)}

  /* ---------- global bar (spec §1: search · create · alerts · period · profile) ---------- */
  .gsearch{position:relative;flex:1 1 210px;min-width:0;max-width:440px}
  .gsearch input{width:100%;font:13px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);
    border-radius:10px;padding:8px 11px;outline:0}
  .gsearch input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--greenSoft)}
  .sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);max-height:min(62vh,430px);overflow-y:auto;display:none;z-index:45}
  .sres.on{display:block}
  .sres .sg{font:700 9.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:9px 12px 3px}
  .sres .si{display:block;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:7px 12px;
    font:12.5px var(--sans);color:var(--muted)}
  .sres .si b{display:block;color:var(--ink);font:600 13px var(--sans)}
  .sres .si:hover,.sres .si.sel{background:var(--greenSoft)}
  .gactions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .menuwrap{position:relative}
  .menu{position:absolute;top:calc(100% + 6px);right:0;min-width:214px;background:var(--paper);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);padding:5px;display:none;z-index:45}
  .menu.on{display:block}
  .menu.wide{min-width:min(340px,84vw)}
  .menu button,.menu a{display:block;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;
    padding:8px 10px;border-radius:9px;font:600 12.5px var(--sans);color:var(--body)}
  .menu button:hover,.menu a:hover{background:var(--greenSoft);color:var(--ink)}
  .menu .sep{height:1px;background:var(--hair);margin:5px 2px}
  .menu .none{padding:10px;font-size:12.5px;color:var(--muted)}
  .menu .al{width:100%;text-align:left;margin-bottom:5px}
  .bell{position:relative}
  .bell .badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:999px;background:var(--danger);
    color:#fff;font:700 9.5px/16px var(--sans);text-align:center;padding:0 4px}
  select.period{font:600 12px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);
    border-radius:10px;padding:7px 8px;outline:0}
  input.dt{font:12px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 8px;outline:0}
  .periodnote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
  .periodnote .pill{background:var(--greenSoft);color:var(--greenDeep)}

  /* ---------- three panels (spec §1) ----------
     Panel 1 (sections) is always visible; panel 2 (subsections) overlays the
     main panel and collapses on choice or outside click; panel 3 (main) is the
     only one whose content changes. Both live inside .rail, which is the
     positioned ancestor panel 2 is absolute against — that keeps the overlay
     glued to panel 1 without hard-coding the centred layout's left margin. */
  .shell{display:grid;grid-template-columns:76px minmax(0,1fr);max-width:1400px;margin:0 auto;align-items:start}
  .rail{position:sticky;top:var(--top,59px);height:calc(100vh - var(--top,59px));z-index:35}
  .p1{height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:10px 6px 26px;
    border-right:1px solid var(--line)}
  .secitem{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;border:0;background:transparent;
    cursor:pointer;color:var(--body);padding:8px 2px;border-radius:11px;transition:.12s;position:relative}
  .secitem .ic{font-size:17px;line-height:1}
  .secitem .lb{font:600 9.5px var(--sans);line-height:1.15;text-align:center}
  .secitem:hover{background:var(--greenSoft);color:var(--ink)}
  .secitem.on{background:var(--greenSoft);color:var(--greenDeep)}
  .secitem .dot{position:absolute;top:5px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
  .p2{position:absolute;top:0;left:76px;width:240px;height:100%;overflow-y:auto;background:var(--paper);
    border-right:1px solid var(--line);box-shadow:22px 0 46px -34px rgba(20,26,14,.5);padding:14px 10px 26px;
    opacity:0;visibility:hidden;transform:translateX(-10px);transition:.16s}
  .p2.on{opacity:1;visibility:visible;transform:none}
  .p2 .p2h{font:700 10px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:0 10px 7px}
  .navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;
    font:600 13px var(--sans);color:var(--body);padding:8px 10px;border-radius:9px;transition:.12s}
  .navitem .ct{margin-left:auto;font:600 10.5px var(--sans);color:var(--faint);background:var(--hair);border-radius:999px;padding:1px 7px}
  .navitem .ct.alert{background:var(--dangerSoft);color:var(--danger)}
  .navitem .ext{margin-left:auto;font-size:11px;color:var(--faint)}
  .navitem:hover{background:var(--greenSoft);color:var(--ink)}
  .navitem.on{background:var(--greenSoft);color:var(--greenDeep)}
  .subscrim{position:fixed;inset:0;z-index:30;background:rgba(20,26,14,.10);opacity:0;pointer-events:none;transition:.16s}
  .subscrim.on{opacity:1;pointer-events:auto}

  main{padding:20px 22px 90px;min-width:0}
  .crumbs{font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .head{margin-bottom:14px}
  .head h1{font-size:clamp(20px,3vw,27px)}
  .head .sub{font-size:13px;color:var(--body);max-width:70ch;margin-top:5px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin:4px 0 16px}
  @media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:.12s}
  .kpi:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--green) 36%,var(--line))}
  .kpi .lab{font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-family:var(--serif);font-size:21px;color:var(--ink);margin-top:5px;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}
  .kpi.hi{background:linear-gradient(125deg,var(--greenDeep),var(--green) 72%);border-color:transparent}
  .kpi.hi .lab{color:rgba(255,255,255,.75)}.kpi.hi .val{color:#fff}.kpi.hi .sub{color:rgba(255,255,255,.8)}
  .kpi.warn .val{color:var(--danger)}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
  .card>.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
  .card>.ch h3{font-size:15px}
  .card>.ch .tag{margin-left:auto;font:600 11px var(--sans);color:var(--muted)}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
  thead th{text-align:left;font:700 10.5px var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
    background:var(--greenSoft);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:9px 14px;border-bottom:1px solid var(--hair);color:var(--body);vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.click{cursor:pointer}
  tbody tr.click:hover{background:var(--greenSoft)}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  th.num{text-align:right}
  td .k{font-weight:600;color:var(--ink)}
  tr.tot td{background:var(--greenSoft);font-weight:700;color:var(--greenDeep)}
  .pill{display:inline-block;font:600 10.5px var(--sans);border-radius:999px;padding:2px 8px;background:var(--hair);color:var(--body);white-space:nowrap}
  .pill.g{background:var(--greenSoft);color:var(--greenDeep)}
  .pill.y{background:var(--amberSoft);color:var(--amber)}
  .pill.r{background:var(--dangerSoft);color:var(--danger)}
  .pill.b{background:var(--blueSoft);color:var(--blue)}
  .bar{height:7px;border-radius:5px;background:var(--hair);overflow:hidden;min-width:70px}
  .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--green),var(--greenLt))}
  .empty{padding:34px;text-align:center;color:var(--muted)}
  input.inline,select.inline{font:12.5px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 8px;outline:0;max-width:130px}
  input.inline:focus{border-color:var(--green)}
  .alerts{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
  .al{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left-width:3px;border-radius:0 11px 11px 0;padding:9px 13px;cursor:pointer;background:var(--paper);transition:.12s}
  .al:hover{transform:translateX(2px)}
  .al.critical{border-left-color:var(--danger)} .al.high{border-left-color:var(--spark)} .al.medium{border-left-color:var(--blue)}
  .al b{color:var(--ink);font-size:12.5px;font-weight:600}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:960px){.grid2{grid-template-columns:1fr}}
  .daylist{padding:10px 16px;display:flex;flex-direction:column;gap:7px;font-size:13px}
  .daylist .it{display:flex;gap:8px;align-items:baseline}
  .daylist .it b{color:var(--ink);font-variant-numeric:tabular-nums}
  .doc{background:#fbfdf9;border:1px dashed var(--line);border-radius:12px;padding:18px 20px;font-size:12.5px}
  .doc .dh{display:flex;justify-content:space-between;gap:14px;border-bottom:2px solid var(--green);padding-bottom:10px;margin-bottom:12px}
  .doc .dh b{font-family:var(--serif);font-size:16px;color:var(--ink)}
  .chapline{display:flex;justify-content:space-between;gap:10px;padding:3px 0}

  /* ---------- Gantt (spec §3.3 · §4.3) ---------- */
  .gwrap{display:flex;align-items:flex-start;border-top:1px solid var(--hair)}
  .gnames{flex:none;width:190px;border-right:1px solid var(--line);background:var(--paper)}
  .gnames .gh{height:34px;border-bottom:1px solid var(--line);background:var(--greenSoft)}
  .gnames .gn{height:30px;display:flex;align-items:center;gap:6px;padding:0 10px;border-bottom:1px solid var(--hair);
    font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .gnames .gn:hover{background:var(--greenSoft)}
  .gnames .gn.on{background:var(--greenSoft);color:var(--greenDeep);font-weight:600}
  .gnames .gn.pay{color:var(--blue);cursor:default}
  .gnames .gn .dot{width:6px;height:6px;border-radius:50%;background:var(--danger);flex:none}
  .gscroll{overflow-x:auto;overflow-y:hidden;flex:1;-webkit-overflow-scrolling:touch}
  .gsvg{display:block}
  /* The bars own their gestures; everything else on the chart scrolls normally. */
  .gsvg .gbar,.gsvg .ggrip,.gsvg .gknob,.gsvg .gms{touch-action:none}
  .gsvg text{font:11px var(--sans);fill:var(--muted)}
  .gsvg text.mon{font:600 10px var(--sans);fill:var(--body)}
  .gsvg .gbar{fill:var(--green);cursor:grab}
  .gsvg .gbar.crit{fill:var(--danger)}
  .gsvg .gbar.sel{stroke:var(--ink);stroke-width:1.5}
  .gsvg .gprog{fill:rgba(255,255,255,.45);pointer-events:none}
  .gsvg .gghost{fill:none;stroke:var(--faint);stroke-width:1;stroke-dasharray:3 2}
  .gsvg .ggrip{fill:rgba(255,255,255,.55);cursor:ew-resize}
  .gsvg .gknob{fill:var(--paper);stroke:var(--green);stroke-width:1.5;cursor:crosshair}
  .gsvg .gdep{stroke:var(--muted);stroke-width:1.2;fill:none}
  .gsvg .gnonwork{fill:var(--hair)}
  .gsvg .gtoday{stroke:var(--spark);stroke-width:1.5}
  .gsvg .growline{stroke:var(--hair);stroke-width:1}
  .gsvg .gfloat{stroke:var(--faint);stroke-width:1;stroke-dasharray:2 2}
  .gsvg .gms{fill:var(--greenDeep);cursor:grab}
  .gsvg .gms.crit{fill:var(--danger)}
  .gsvg .gpay{fill:var(--blue)}
  .gsvg .grubber{stroke:var(--green);stroke-width:1.6;stroke-dasharray:4 3;fill:none;pointer-events:none}
  .gbarwrap{position:relative}
  .gtools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:10px 14px}
  .gtools .chip{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--sans);color:var(--body);
    background:var(--hair);border-radius:999px;padding:3px 9px}
  .gtools .chip b{color:var(--ink)}
  .gtools .chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;padding:0 1px}
  .glegend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--hair);font-size:11.5px;color:var(--muted)}
  .glegend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

  /* ---------- Project context: selector + fixed header (spec §4) ----------
     "El proyecto elegido queda como contexto activo y todas las subsecciones
     muestran únicamente su información." The strip is sticky because it is the
     frame of reference for everything below it — scrolling a cost table until
     you can no longer see which job it belongs to is how costs end up on the
     wrong project. */
  .projbar{position:sticky;top:var(--top,59px);z-index:25;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .projbar .psel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 13px;border-bottom:1px solid var(--hair);
    background:linear-gradient(120deg,var(--greenSoft),transparent 70%)}
  .projbar .psel select{font:600 12.5px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);
    border-radius:9px;padding:6px 9px;outline:0;max-width:min(340px,60vw)}
  .projbar .psel input{font:12.5px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);
    border-radius:9px;padding:6px 9px;outline:0;width:150px}
  .projbar .psel input:focus,.projbar .psel select:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--greenSoft)}
  .projbar .fav{border:0;background:transparent;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;color:var(--faint)}
  .projbar .fav.on{color:var(--spark)}
  .projbar .phead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 13px}
  .projbar .f{display:flex;flex-direction:column;gap:2px;min-width:0}
  .projbar .f .l{font:600 9.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .projbar .f .v{font:600 13px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .projbar .f .v.neg{color:var(--danger)}
  .projbar .f a{color:var(--green)}
  .projbar .sep{width:1px;align-self:stretch;background:var(--hair)}
  .projbar .pbar{min-width:90px}
  @media(max-width:860px){.projbar{position:static}.projbar .phead{gap:10px}.projbar .sep{display:none}}

  /* ---------- Technical + economic tracking (spec §4.3 / §4.4) ---------- */
  .trk{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;align-items:start}
  @media(max-width:1180px){.trk{grid-template-columns:minmax(0,1fr)}}
  .curve{display:block;width:100%;height:210px}
  .curve .cplan{fill:none;stroke:var(--faint);stroke-width:1.6;stroke-dasharray:4 3}
  .curve .cact{fill:none;stroke:var(--green);stroke-width:2.4}
  .curve .cproj{fill:none;stroke:var(--spark);stroke-width:2;stroke-dasharray:5 3}
  .curve .cnow{stroke:var(--blue);stroke-width:1.2;stroke-dasharray:2 2}
  .curve .cgrid{stroke:var(--hair);stroke-width:1}
  .curve text{font:10px var(--sans);fill:var(--muted)}
  .riskitem{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
  .riskitem:last-child{border-bottom:0}
  .riskitem .t{flex:1;min-width:0;color:var(--ink)}
  .pctin{width:64px;text-align:right;font-variant-numeric:tabular-nums}
  td.warn{color:var(--danger);font-weight:600}
  td.good{color:var(--greenDeep)}
  .adj{font:600 10px var(--sans);color:var(--amber);background:var(--amberSoft);border-radius:999px;padding:1px 6px;margin-left:5px}

  /* ---------- Conciliación bancaria (spec §5.3) ----------
     Two columns and the suggestions between them: statement on the left,
     candidate documents on the right, and the match with its reasons in the
     middle. The unreconciled queue sits underneath because it is the period's
     health indicator, not a footnote. */
  .rec{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
  @media(max-width:1180px){.rec{grid-template-columns:minmax(0,1fr)}}
  .movrow{display:grid;grid-template-columns:78px minmax(0,1fr) 96px;gap:8px;align-items:baseline;
    padding:8px 12px;border-bottom:1px solid var(--hair);cursor:pointer}
  .movrow:last-child{border-bottom:0}
  .movrow:hover{background:var(--greenSoft)}
  .movrow.on{background:var(--greenSoft);box-shadow:inset 3px 0 0 var(--green)}
  .movrow .cpt{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .movrow .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .movrow .amt.neg{color:var(--danger)} .movrow .amt.pos{color:var(--greenDeep)}
  .sugg{border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:8px;background:var(--paper)}
  .sugg.strong{border-color:var(--green);background:var(--greenSoft)}
  .sugg .hd{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
  .sugg .conf{font:700 12px var(--sans);font-variant-numeric:tabular-nums}
  .sugg .why{font-size:11px;color:var(--muted);margin-top:3px}

<script>
/* =============================== boot & persistence =============================== */
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const eur=c=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'}).format((c||0)/100);
const eur0=c=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:'always'}).format(Math.round((c||0)/100));
const fmtD=iso=>{if(!iso)return'—';const p=String(iso).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso;};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}

/* Persistence lives in erp-store.js — one module owns the IndexedDB version,
   because a second page opening "caneiERP" at a different version would throw
   VersionError and render nothing. */
let saveT;function persist(){clearTimeout(saveT);saveT=setTimeout(()=>ErpStore.saveState(erp.toJSON()).catch(()=>{}),140);}

let erp, cur="torre", bootNotice="";
async function boot(){
  let migration=null, fresh=false;
  try{
    const loaded=await ErpStore.loadState();      // migrates + backs up if needed
    migration=loaded.migration;
    if(loaded.state){ erp=ErpEngine.ERP.from(loaded.state); }
    else { erp=ErpSeed.build(); fresh=true; }
  }catch(e){
    // A blob newer than this build lands here. Never silently reseed over it:
    // that would destroy the user's data to make the page render.
    if(/schema v/i.test(String(e&&e.message))){
      document.body.innerHTML='<div style="max-width:36rem;margin:18vh auto;padding:0 24px;font:15px/1.6 var(--sans,system-ui);color:#14160f">'
        +'<h1 style="font-size:19px;margin:0 0 10px">Datos más recientes que la aplicación</h1>'
        +'<p style="color:#4f5347">'+esc(e.message)+'</p>'
        +'<p style="color:#8b8f80;font-size:13px">No se ha modificado nada. Actualiza la aplicación para volver a abrir estos datos.</p></div>';
      return;
    }
    erp=ErpSeed.build(); fresh=true;
  }

  // One-way, non-destructive fold-in of the legacy master-data store. Runs at
  // most once (recorded in state.imports); anything ambiguous becomes a
  // reviewable conflict rather than an automatic overwrite.
  let imported=null;
  try{ imported=await ErpStore.importLegacyMasterData(erp); }catch(e){ /* never block boot */ }

  if(fresh||migration?.applied.length||imported?.ran) persist();

  const notes=[];
  if(migration?.applied.length) notes.push(`Datos actualizados al formato v${migration.to} (copia de seguridad guardada).`);
  if(imported?.ran&&imported.imported) notes.push(`${imported.imported} clientes importados de Datos Maestros.`);
  if(imported?.ran&&imported.conflicts) notes.push(`${imported.conflicts} registros necesitan revisión.`);
  bootNotice=notes.join(" ");

  // The demo budget references four pictures by storage key; draw them once so
  // the graphic annex has something to show on a clean machine. Real pictures
  // arrive from a camera or a file — this commits no binary to the repository
  // and fetches nothing over the network.
  try{ await ensureDemoImages(); }catch(e){ /* never block boot over a picture */ }
  if(fresh){ seedPlans(); persist(); }

  // UI preferences (period) live in the store's `meta`, never in the state blob.
  try{ const prefs=await ErpStore.getMeta("ui.prefs"); if(prefs&&prefs.period) PERIOD={...PERIOD,...prefs.period}; }catch(e){}
  try{ const pp=await ErpStore.getMeta("ui.projects");
       if(pp){ projFavs=pp.favs||[]; projRecents=pp.recents||[]; } }catch(e){}
  try{ const tp=await ErpStore.getMeta("ui.torre");
       if(tp){ torreOrder=tp.order||[]; torreHidden=tp.hidden||[]; } }catch(e){}

  const hashKey=location.hash.slice(1);
  if(hashKey&&SUBMAP[hashKey]&&!SUBMAP[hashKey].href) cur=hashKey;
  // Cross-page deep link (journey.html's "abrir pantalla real" per stage,
  // §2.3): ?project=CODE preselects the project context, then the query
  // string is dropped so reloading or sharing the URL doesn't re-trigger it.
  const qsProject=new URLSearchParams(location.search).get('project');
  if(qsProject && erp.state.projects.some(p=>p.code===qsProject)){
    gProject=erp.state.projects.find(p=>p.code===qsProject).id;
    history.replaceState(null,'',location.pathname+location.hash);
  }
  measureTopbar(); buildPeriodControls(); buildUserMenu(); render();
  if(bootNotice) toast(bootNotice);
}
/* Demo pictures for the seeded budget's graphic annex, keyed exactly as
   erp-seed.js references them. Drawn, not downloaded: the page must work from
   a bare static host with no network, and a repository is the wrong place to
   keep a JPEG that only exists to make a screenshot look plausible. */
const DEMO_IMAGES={
  seed_img_pavimento:["#c9b79a","Pavimento cerámico"],
  seed_img_estado:["#9a9384","Estado actual"],
  seed_img_pintura:["#dfe6d8","Carta de color"],
  seed_img_interna:["#4f6b86","Detalle interno"],
};
async function ensureDemoImages(){
  for(const key of Object.keys(DEMO_IMAGES)){
    const [color,label]=DEMO_IMAGES[key];
    try{
      if(await ErpStore.getBlob(key)) continue;
      const c=document.createElement('canvas'); c.width=480; c.height=320;
      const x=c.getContext('2d');
      x.fillStyle=color; x.fillRect(0,0,480,320);
      x.fillStyle="rgba(255,255,255,.8)"; x.fillRect(0,246,480,74);
      x.fillStyle="#14160f"; x.font="600 20px Inter, system-ui, sans-serif";
      x.fillText(label,18,290);
      const blob=await new Promise(r=>c.toBlob(r,"image/png"));
      if(blob) await ErpStore.putBlob(key,blob);
    }catch(e){ /* one undrawable picture must not cost the whole boot */ }
  }
}

/* =============================== global bar (spec §1) ==============================
   Universal search · contextual create · alert bell · period selector · profile
   and help. The period is a preference, not business data: it lives in the
   store's `meta` object store, never in the state blob, so it can never collide
   with an engine key or need a schema migration to change. */
const MONTHS=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const PERIOD_MODES=[["year","Año"],["quarter","Trimestre"],["month","Mes"],["range","Rango"]];
let PERIOD={mode:"year",from:null,to:null};
const pad2=n=>String(n).padStart(2,"0");
const lastDay=(y,m)=>`${y}-${pad2(m)}-${new Date(Date.UTC(y,m,0)).getUTCDate()}`;
/* The reference date is the dataset's today, not the wall clock: this dataset
   lives in its own exercise year and a wall-clock period would empty every
   table for reasons the user cannot see. */
function periodRange(){
  const t=(erp&&erp.today)||new Date().toISOString().slice(0,10);
  const Y=+t.slice(0,4), M=+t.slice(5,7);
  if(PERIOD.mode==="month")   return {from:`${Y}-${pad2(M)}-01`,to:lastDay(Y,M),label:`${MONTHS[M-1]} ${Y}`};
  if(PERIOD.mode==="quarter"){const q=Math.floor((M-1)/3);return {from:`${Y}-${pad2(q*3+1)}-01`,to:lastDay(Y,q*3+3),label:`T${q+1} ${Y}`};}
  if(PERIOD.mode==="range"&&PERIOD.from&&PERIOD.to) return {from:PERIOD.from,to:PERIOD.to,label:`${fmtD(PERIOD.from)} – ${fmtD(PERIOD.to)}`};
  return {from:`${Y}-01-01`,to:`${Y}-12-31`,label:String(Y)};
}
const inPeriod=iso=>{const r=periodRange();return !!iso&&iso>=r.from&&iso<=r.to;};
/* Every filtered table says so, with how much it is hiding — a table that
   quietly drops rows is indistinguishable from a table with no data. */
function periodNote(shown,total){
  const r=periodRange();
  return `<div class="periodnote"><span class="pill">Periodo · ${esc(r.label)}</span>
    <span>${shown} de ${total} registros${shown<total?` · ${total-shown} fuera del periodo`:""}</span></div>`;
}
function savePrefs(){ try{ ErpStore.setMeta("ui.prefs",{period:PERIOD}); }catch(e){} }
function buildPeriodControls(){
  const sel=$('#periodMode');
  sel.innerHTML=PERIOD_MODES.map(([v,l])=>`<option value="${v}"${PERIOD.mode===v?" selected":""}>${l}</option>`).join("");
  const range=PERIOD.mode==="range";
  $('#periodFrom').hidden=!range; $('#periodTo').hidden=!range;
  const r=periodRange();
  $('#periodFrom').value=PERIOD.from||r.from; $('#periodTo').value=PERIOD.to||r.to;
  sel.title="Periodo aplicado: "+r.label;
}
$('#periodMode').onchange=e=>{
  PERIOD={...PERIOD,mode:e.target.value};
  if(PERIOD.mode==="range"&&(!PERIOD.from||!PERIOD.to)){const r=periodRange();PERIOD.from=r.from;PERIOD.to=r.to;}
  savePrefs(); buildPeriodControls(); render();
};
['#periodFrom','#periodTo'].forEach(id=>{ $(id).onchange=()=>{
  PERIOD={mode:"range",from:$('#periodFrom').value||null,to:$('#periodTo').value||null};
  savePrefs(); buildPeriodControls(); render();
};});

/* ---------- universal search ---------- */
function searchAll(term){
  const s=term.trim().toLowerCase(); if(s.length<2)return [];
  const S=erp.state, hit=(...vals)=>vals.some(x=>String(x||"").toLowerCase().includes(s));
  const groups=[], add=(type,items)=>{ if(items.length)groups.push({type,items:items.slice(0,6),more:Math.max(0,items.length-6)}); };
  const partyName=id=>{try{return erp.party(id).name;}catch(e){return "—";}};
  add("Clientes",S.parties.filter(p=>p.roles.includes("customer")&&hit(p.name,p.code,p.taxId,p.billCity))
    .map(p=>({lab:p.name,sub:`${p.code}${p.taxId?" · "+p.taxId:""}${p.billCity?" · "+p.billCity:""}`,k:"clientes",open:()=>partyDrawer(p.id)})));
  add("Proveedores",S.parties.filter(p=>p.roles.some(r=>["supplier","subcontractor","selfEmployed"].includes(r))&&hit(p.name,p.code,p.taxId))
    .map(p=>({lab:p.name,sub:`${p.code}${p.activityLine?" · "+p.activityLine:""}`,k:"clientes",open:()=>partyDrawer(p.id)})));
  add("Proyectos",S.projects.filter(p=>hit(p.code,partyName(p.partyId),p.activityLine))
    .map(p=>({lab:`${p.code} — ${partyName(p.partyId)}`,sub:p.closed?"cerrado":"activo",k:"proyectos",open:()=>projectDrawer(p.id)})));
  add("Presupuestos",S.budgets.filter(b=>hit(b.number,partyName(b.partyId)))
    .map(b=>({lab:`${b.number} — ${partyName(b.partyId)}`,sub:b.acceptedVersionId?"aceptado":b.status,k:"presupuestos",open:()=>budgetDrawer(b.id)})));
  add("Facturas",S.invoices.filter(i=>hit(i.number,partyName(i.partyId)))
    .map(i=>({lab:`${i.number} — ${partyName(i.partyId)}`,sub:`${fmtD(i.date)} · ${eur(i.totalCents)}`,k:"facturacion",open:null})));
  add("Documentos",(S.captured||[]).filter(c=>hit(c.stdName,c.imageRef,c.confirmed&&c.confirmed.issuerName))
    .map(c=>({lab:c.stdName||c.imageRef||c.id,sub:c.status,k:"captura",open:null})));
  return groups;
}
let searchHits=[];
function renderSearch(term){
  const box=$('#sres'); const groups=searchAll(term);
  searchHits=[];
  if(!groups.length){
    box.innerHTML=term.trim().length>=2?'<div class="sg">Sin resultados</div>':'';
    box.classList.toggle('on',term.trim().length>=2);
    return;
  }
  box.innerHTML=groups.map(g=>`<div class="sg">${g.type}</div>`+g.items.map(it=>{
    const idx=searchHits.push(it)-1;
    return `<button class="si" data-hit="${idx}"><b>${esc(it.lab)}</b>${esc(it.sub||"")}</button>`;
  }).join("")+(g.more?`<div class="sg" style="text-transform:none;letter-spacing:0">+${g.more} más</div>`:"")).join("");
  box.classList.add('on');
  box.querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>pickHit(searchHits[+b.dataset.hit]));
}
function pickHit(it){

/* ---------- alert bell ---------- */
function gotoAlert(ref){
  if(!ref)return go("torre");
  if(ref.project)go("proyectos",ref.project); else if(ref.invoice)go("facturacion"); else if(ref.contract)go("contratos");
  else if(ref.budget)go("presupuestos"); else if(ref.bill)go("pagos"); else if(ref.view==="bank"||ref.movement)go("banco");
  else if(ref.opportunity)go("oportunidades"); else if(ref.price)go("precios"); else if(ref.change)go("proyectos");
  else if(ref.subcontract)go("subcontratos"); else if(ref.worker)go("horas"); else if(ref.purchase)go("compras");
  else if(ref.quarter)go("gestoria"); else go("torre");
}

   ErpBridge — the first read that crosses into the typed capability layer.

/* Rows the one-way legacy import refused to merge automatically. Surfaced
   rather than silently dropped: an import that quietly discards records is
   indistinguishable, to the operator, from one that never ran. */
const IMPORT_CONFLICT_ES={yaExiste:"ya existe en el sistema",rechazado:"datos no válidos",sinNombre:"sin nombre"};
function importConflictsBanner(){
  const cs=(erp.state.importConflicts)||[];
  if(!cs.length)return"";
  const byReason={};cs.forEach(c=>{byReason[c.reason]=(byReason[c.reason]||0)+1;});
  const detail=Object.keys(byReason).map(r=>`${byReason[r]} ${IMPORT_CONFLICT_ES[r]||r}`).join(" · ");
  return `<div class="card" style="border-left:3px solid var(--spark);margin-bottom:14px"><div class="ch">
    <h3>Registros importados que necesitan revisión</h3><span class="tag">${cs.length}</span></div>
    <div style="font-size:13px;color:var(--body)">${esc(detail)}. No se ha sobrescrito ningún dato existente.</div>
    <div class="scroll" style="margin-top:8px"><table><thead><tr><th>Registro</th><th>Origen</th><th>Motivo</th></tr></thead><tbody>
    ${cs.slice(0,20).map(c=>`<tr><td class="k">${esc(c.label||c.ref||"—")}</td><td>${esc(c.source||"")}</td><td>${esc(IMPORT_CONFLICT_ES[c.reason]||c.reason)}${c.existingCode?" ("+esc(c.existingCode)+")":""}</td></tr>`).join("")}
    </tbody></table></div></div>`;
}
const TASK_STATUS_ES={planned:"Planificadas",in_progress:"En curso",done:"Hechas",blocked:"Bloqueadas"};
function taskStatusTags(){
  if(typeof ErpBridge==="undefined"||!ErpBridge.available)return"";
  return ErpBridge.scheduling.taskSummary(erp.state)
    .filter(s=>s.count>0)
    .map(s=>`<span class="tag"><b>${s.count}</b> ${TASK_STATUS_ES[s.status]||s.status}</span>`)
    .join("");
}
const pillProg=s=>s==="done"?'<span class="pill g">Hecho</span>':s==="inProgress"?'<span class="pill y">En curso</span>':'<span class="pill">Sin empezar</span>';

/* =============================== Gantt (spec §3.3 · §4.3) ==========================
   THE CHART IS A VIEW AND NOTHING MORE. Every date, duration, float,
   critical-path flag and baseline drift it draws is asked of
   @repo/capability-scheduling through ErpBridge. The only arithmetic in this
   block is pixels ↔ calendar days: where to put a bar, and what date a drag
   of N pixels landed on. Working-day questions — is this day closed, how long
   is this task really, where does the plan now finish — are the engine's, and
   the first time one of them gets recomputed here the chart and the engine
   will start disagreeing about the same plan. */
let gProject=null, gSel=null, gZoom=24, gBaseline=true, gDrag=null;
const G_ROW=30, G_HEAD=34;
const isoAdd=(iso,d)=>{const t=new Date(iso+"T00:00:00Z");t.setUTCDate(t.getUTCDate()+d);return t.toISOString().slice(0,10);};
const isoDiff=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);
function ganttApi(){ return (typeof ErpBridge!=="undefined"&&ErpBridge.available)?ErpBridge.scheduling.plans:null; }
/* Give every freshly-seeded project a schedule.
   Plans are owned by @repo/capability-scheduling and live in the bundle, not
   in erp-engine.js, so erp-seed.js (which also has to run under plain Node)
   cannot build one. Deriving here — once, right after a seed or a reset, and
   only for projects that have none — is what stops Seguimiento opening on an
   empty chart. Never touches a project that already has a plan, so a user's
   own dragging and re-linking is never overwritten. */
function seedPlans(){
  const B=ganttApi(); if(!B) return 0;
  let made=0;
  const cal=B.defaultCalendar();
  for(const p of erp.state.projects){
    if(!p.budgetId||!p.acceptedVersionId) continue;
    if(erp.state.plans&&erp.state.plans[p.id]) continue;
    try{
      const derived=B.fromBudget(erp,p.id,{calendar:cal});
      if(derived){ B.save(erp.state,p.id,derived.plan); made++; }
    }catch(e){ /* a project the capability cannot schedule is not a boot failure */ }
  }
  return made;
}
/* Every change goes through one door: recalculate, store, persist, re-render.
   mutate() turns an engine refusal (a cycle, a bad duration) into a toast. */
function ganttCommit(pid,plan,msg){
  const B=ganttApi();
  mutate(()=>{ B.save(erp.state,pid,B.recalculate(plan)); },msg);
}

function ganttChart(plan,sch,cmp,pays){
  const B=ganttApi(), cal=plan.calendar||B.defaultCalendar(), C=B.calendar;
  const S={}; if(sch) sch.tasks.forEach(t=>{S[t.taskId]=t;});
  const base={};
  if(cmp){ const b=(plan.baselines||[]).find(x=>x.id===cmp.baselineId); (b?b.tasks:[]).forEach(t=>{base[t.taskId]=t;}); }
  const pos=t=>S[t.id]||{start:t.plannedStart,finish:t.plannedEnd,critical:false,lateFinish:t.plannedEnd,totalFloatDays:0};

  let from=null,to=null;
  const touch=d=>{ if(!d)return; if(!from||d<from)from=d; if(!to||d>to)to=d; };
  plan.tasks.forEach(t=>{const p=pos(t);touch(p.start);touch(p.finish);const b=base[t.id];if(b){touch(b.start);touch(b.finish);}});
  pays.forEach(p=>touch(p.date));
  touch(erp.today);
  from=isoAdd(from,-3); to=isoAdd(to,4);

  const nDays=isoDiff(from,to)+1, W=Math.max(nDays*gZoom,360);
  const rows=plan.tasks.length+(pays.length?1:0), H=G_HEAD+rows*G_ROW;
  const x=iso=>isoDiff(from,iso)*gZoom;
  const barW=(a,b)=>Math.max(gZoom*0.7,(isoDiff(a,b)+1)*gZoom-3);

  /* --- axis: closed days shaded, day numbers, month labels, today --- */
  let axis="";
  for(let i=0;i<nDays;i++){
    const d=isoAdd(from,i), X=i*gZoom;
    if(!C.isWorkingDay(cal,d)) axis+=`<rect class="gnonwork" x="${X}" y="${G_HEAD}" width="${gZoom}" height="${H-G_HEAD}"/>`;
    if(gZoom>=24||d.slice(8)==="01"||i===0)
      axis+=`<text x="${X+gZoom/2}" y="${G_HEAD-6}" text-anchor="middle">${+d.slice(8)}</text>`;
    if(d.slice(8)==="01"||i===0)
      axis+=`<text class="mon" x="${X+2}" y="13">${MONTHS[+d.slice(5,7)-1]} ${d.slice(0,4)}</text>`;
  }
  axis+=`<line class="gtoday" x1="${x(erp.today)+gZoom/2}" y1="${G_HEAD}" x2="${x(erp.today)+gZoom/2}" y2="${H}"/>`;

  /* --- bars --- */
  let bars="", names="";
  plan.tasks.forEach((t,i)=>{
    const p=pos(t), y=G_HEAD+i*G_ROW, top=y+5, mid=y+G_ROW/2;
    const b=base[t.id];
    if(b) bars+=`<rect class="gghost" x="${x(b.start)}" y="${y+2}" width="${barW(b.start,b.finish)}" height="${G_ROW-4}" rx="4"/>`;
    if(t.milestone){
      const cx=x(p.start)+gZoom/2;
      bars+=`<polygon class="gms${p.critical?" crit":""}" data-task="${t.id}" data-role="move" points="${cx},${mid-9} ${cx+9},${mid} ${cx},${mid+9} ${cx-9},${mid}"><title>${esc(t.title)} · ${fmtD(p.start)}</title></polygon>`;
    }else{
      const w=barW(p.start,p.finish), X=x(p.start);
      if(p.totalFloatDays>0&&p.lateFinish>p.finish)
        bars+=`<line class="gfloat" x1="${X+w}" y1="${mid}" x2="${x(p.lateFinish)+gZoom-3}" y2="${mid}"/>`;
      bars+=`<g><rect class="gbar${p.critical?" crit":""}${gSel===t.id?" sel":""}" data-task="${t.id}" data-role="move" x="${X}" y="${top}" width="${w}" height="20" rx="5"><title>${esc(t.title)} · ${fmtD(p.start)} → ${fmtD(p.finish)} · ${p.durationDays} d${p.critical?" · crítica":` · holgura ${p.totalFloatDays} d`}</title></rect>
        ${t.progressPct?`<rect class="gprog" x="${X}" y="${top+14}" width="${Math.max(2,w*t.progressPct/100)}" height="4" rx="2"/>`:""}
        <rect class="ggrip" data-task="${t.id}" data-role="resize" x="${X+w-6}" y="${top}" width="6" height="20" rx="2"/>
        <circle class="gknob" data-task="${t.id}" data-role="link" cx="${X+w+7}" cy="${mid}" r="4.5"/></g>`;
    }
    names+=`<div class="gn${gSel===t.id?" on":""}" data-task="${t.id}" title="${esc(t.title)}">${p.critical?'<span class="dot"></span>':""}${t.milestone?"◆ ":""}${esc(t.title)}</div>`;
  });

  /* --- dependency arrows --- */
  let deps="";
  const rowOf={}; plan.tasks.forEach((t,i)=>{rowOf[t.id]=i;});
  (plan.dependencies||[]).forEach(d=>{
    const a=plan.tasks.find(t=>t.id===d.predecessorId), z=plan.tasks.find(t=>t.id===d.successorId);
    if(!a||!z)return;
    const pa=pos(a), pz=pos(z);
    const ya=G_HEAD+rowOf[a.id]*G_ROW+G_ROW/2, yz=G_HEAD+rowOf[z.id]*G_ROW+G_ROW/2;
    const xa=d.type==="SS"?x(pa.start):x(pa.finish)+barW(pa.start,pa.finish);
    const xz=d.type==="FF"?x(pz.finish)+barW(pz.start,pz.finish):x(pz.start);
    const midX=Math.max(xa+8,xz-8);
    deps+=`<path class="gdep" d="M ${xa} ${ya} H ${midX} V ${yz} H ${xz}"/>
      <polygon class="gdep" style="fill:var(--muted)" points="${xz},${yz} ${xz-5},${yz-3.5} ${xz-5},${yz+3.5}"/>`;
  });

  /* --- contract payment milestones: drawn, never scheduled --- */
  if(pays.length){
    const y=G_HEAD+plan.tasks.length*G_ROW, mid=y+G_ROW/2;
    pays.forEach(p=>{
      const cx=x(p.date)+gZoom/2;
      bars+=`<polygon class="gpay" points="${cx},${mid-8} ${cx+8},${mid} ${cx},${mid+8} ${cx-8},${mid}" opacity="${p.invoiced?1:.55}"><title>${esc(p.label)} · ${eur0(p.amountCents)} · ${fmtD(p.date)}${p.invoiced?" · facturado":""}</title></polygon>`;
    });
    names+=`<div class="gn pay">◆ Hitos de cobro</div>`;
  }

  let grid="";
  for(let r=0;r<=rows;r++) grid+=`<line class="growline" x1="0" y1="${G_HEAD+r*G_ROW}" x2="${W}" y2="${G_HEAD+r*G_ROW}"/>`;

  return `<div class="gwrap">
    <div class="gnames"><div class="gh"></div>${names}</div>
    <div class="gscroll"><svg class="gsvg" id="gSvg" width="${W}" height="${H}" data-from="${from}">
      ${axis}${grid}${deps}${bars}</svg></div>
  </div>`;
}

/* Pointer gestures. One handler set for mouse, pen and touch — the ERP runs
   inside two WebViews and a desktop browser, and a mouse-only chart would be
   unusable on the site visit it is meant for. */
function ganttWire(v,pid,plan,sch){
  const svg=v.querySelector('#gSvg'); if(!svg)return;
  const B=ganttApi(), cal=plan.calendar||B.defaultCalendar(), C=B.calendar;
  const S={}; if(sch) sch.tasks.forEach(t=>{S[t.taskId]=t;});

  v.querySelectorAll('.gn[data-task]').forEach(n=>{ n.onclick=()=>{ gSel=n.dataset.task; ganttTaskDrawer(pid,n.dataset.task); }; });

  const end=()=>{ if(gDrag&&gDrag.rubber)gDrag.rubber.remove(); gDrag=null; };

  svg.addEventListener('pointerdown',e=>{
    const el=e.target.closest('[data-task]'); if(!el)return;
    gDrag={id:el.dataset.task,role:el.dataset.role||"move",x0:e.clientX,y0:e.clientY,moved:false,el,rubber:null};
    if(gDrag.role==="link"){
      const r=document.createElementNS("http://www.w3.org/2000/svg","path");
      r.setAttribute("class","grubber"); svg.appendChild(r); gDrag.rubber=r;
      gDrag.cx=+el.getAttribute("cx"); gDrag.cy=+el.getAttribute("cy");
    }
    try{ svg.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });

  svg.addEventListener('pointermove',e=>{
    if(!gDrag)return;
    const dx=e.clientX-gDrag.x0;
    if(Math.abs(dx)>3||Math.abs(e.clientY-gDrag.y0)>3) gDrag.moved=true;
    if(gDrag.role==="link"){
      const pt=svgPoint(svg,e);
      gDrag.rubber.setAttribute("d",`M ${gDrag.cx} ${gDrag.cy} L ${pt.x} ${pt.y}`);
    }else if(gDrag.role==="resize"){
      const bar=svg.querySelector(`.gbar[data-task="${gDrag.id}"]`);
      if(bar) bar.setAttribute("width",Math.max(gZoom*0.7,(+bar.dataset.w0||+bar.getAttribute("width"))+dx));
      if(bar&&!bar.dataset.w0) bar.dataset.w0=String(+bar.getAttribute("width")-dx);
    }else{
      gDrag.el.setAttribute("transform",`translate(${dx},0)`);
    }
  });

  svg.addEventListener('pointerup',e=>{
    if(!gDrag)return;
    const {id,role,moved}=gDrag, dx=e.clientX-gDrag.x0;
    const hit=document.elementFromPoint(e.clientX,e.clientY);
    const target=hit&&hit.closest?hit.closest('[data-task]'):null;
    end();
    const cur=S[id]; if(!cur){ render(); return; }

    if(role==="link"){
      if(target&&target.dataset.task!==id)
        ganttCommit(pid,B.link(plan,{predecessorId:id,successorId:target.dataset.task}),"Dependencia creada");
      else render();
      return;
    }
    if(!moved){ gSel=id; ganttTaskDrawer(pid,id); return; }
    const days=Math.round(dx/gZoom);
    if(days===0){ render(); return; }
    if(role==="resize"){
      // A drag of N calendar days lands on a date; how many WORKING days that
      // is, is the calendar's answer, not this view's.
      const finish=isoAdd(cur.finish,days);
      const duration=C.workingDaysInclusive(cal,cur.start,finish<cur.start?cur.start:finish);
      ganttCommit(pid,B.setDuration(plan,id,Math.max(1,duration)),`Duración: ${Math.max(1,duration)} días laborables`);
    }else{
      ganttCommit(pid,B.move(plan,id,isoAdd(cur.start,days)),"Tarea movida — la planificación se ha recalculado");
    }
  });
  svg.addEventListener('pointercancel',()=>{ end(); render(); });
}
function svgPoint(svg,e){
  const r=svg.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}

   </div>

   </div>
   <div class="card" style="margin-top:12px"><div class="ch"><h3>Depende de</h3><span class="tag">${preds.length} dependencia${preds.length===1?"":"s"}</span></div><div class="daylist">
    ${preds.map(d=>{const a=plan.tasks.find(x=>x.id===d.predecessorId);return `<div class="it" style="align-items:center;gap:8px">
      <span style="flex:1">${esc(a?a.title:d.predecessorId)} <span class="pill b">${TYPE[d.type]}</span>${d.lagDays?` <span class="pill y">${d.lagDays>0?"+":""}${d.lagDays} d</span>`:""}</span>
      <button class="btn sm" data-unlink="${d.id}">Quitar</button></div>`;}).join("")||'<div class="it">Ninguna. Arrastra el punto de otra barra hasta ésta para crear una.</div>'}
   </div></div>

  db.querySelectorAll('[data-unlink]').forEach(b=>b.onclick=()=>mutate(()=>{
    B.save(erp.state,pid,B.recalculate(B.unlink(plan,b.dataset.unlink)));

    B.save(erp.state,pid,B.recalculate(B.removeTask(plan,taskId)));
    gSel=null; closeDrawer();

/* ===================== Technical tracking (spec §4.3) ==============================
   The chart came in session 6; this is the half around it — progress recorded
   per chapter and per line, the S curve, and the deviations panel.

   Same rule as everywhere else in this file: NOTHING here computes a schedule,
   a drift, a projection or a percentage of completion. Planned/actual/projected
   and every risk item come from @repo/capability-scheduling through the bridge;
   the value-weighting comes from erp.budgetTotals(). This block turns those
   numbers into pixels and inputs, and that is all. */

/** What each bar is worth, so the S curve is value- and not time-weighted:
    a week of demolition and a week of joinery are not the same amount of job. */
function planWeights(pid,plan){
  const w={};
  try{
    const p=erp.project(pid);
    const byNum={};
    (p.baseline.chapters||[]).forEach(c=>{byNum[c.num]=c.saleCents;});
    plan.tasks.forEach(t=>{
      const m=/^group:(.+)$/.exec(t.sourceRef||"");
      if(m&&byNum[m[1]]>0) w[t.id]=byNum[m[1]];
    });
  }catch(e){}
  return w;
}

/* Re-derives the plan from the accepted budget. The toast reports how the
   durations were arrived at, because "5 tasks, 2 with no known daily output"
   is the difference between a plan and a guess, and the planner should be told
   which one they just got rather than having to infer it from bar widths. */
function deriveFromBudget(pid,cal){
  const B=ganttApi();
  let msg="Planificación derivada del presupuesto";
  try{
    const derived=B.fromBudget(erp,pid,{calendar:cal});
    if(!derived) throw new Error("El proyecto no tiene presupuesto aceptado del que derivar");
    const guessed=derived.notes.filter(n=>n.basis==="default").length;
    msg=`${derived.plan.tasks.length} tareas · `+(guessed
      ? `${guessed} sin rendimiento conocido (duración por defecto)`
      : "duraciones derivadas de las cantidades");
    mutate(()=>{ B.save(erp.state,pid,derived.plan); },msg);
  }catch(e){ toast("⚠ "+e.message); }
}

/** Planned / actual / projected, drawn from the points the capability returned. */
function curveChart(curve){
  const W=560,H=210,L=34,R=10,T=12,Bm=26;
  const pts=curve.points; if(pts.length<2) return "";
  const x=i=>L+(i/(pts.length-1))*(W-L-R);
  const y=v=>T+(1-v/100)*(H-T-Bm);
  const path=key=>{
    let d="",open=false;
    pts.forEach((p,i)=>{ const v=p[key]; if(v==null){open=false;return;}
      d+=(open?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)+" "; open=true; });
    return d.trim();
  };
  const nowIdx=pts.findIndex(p=>p.date>curve.asOf);
  const nowX=nowIdx>0?x(nowIdx-1):null;
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Curva S de avance">
    ${[0,25,50,75,100].map(v=>`<line class="cgrid" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"></line>
      <text x="4" y="${y(v)+3}">${v}%</text>`).join("")}
    ${nowX!=null?`<line class="cnow" x1="${nowX}" y1="${T}" x2="${nowX}" y2="${H-Bm}"></line>`:""}
    <path class="cplan" d="${path("plannedPct")}"></path>
    <path class="cproj" d="${path("projectedPct")}"></path>
    <path class="cact" d="${path("actualPct")}"></path>
    <text x="${L}" y="${H-8}">${fmtD(pts[0].date)}</text>
    <text x="${W-R}" y="${H-8}" text-anchor="end">${fmtD(pts[pts.length-1].date)}</text>
  </svg>`;
}

/** Chapters (the bars) and, under each, the budget lines they are made of. */
function progressTable(pid,plan){
  let chapters=[];
  try{
    const p=erp.project(pid);
    chapters=p.budgetId?erp.version(p.budgetId,p.acceptedVersionId).chapters.filter(c=>c.section==="base"):[];
  }catch(e){}
  const taskFor={};
  plan.tasks.forEach(t=>{const m=/^group:(.+)$/.exec(t.sourceRef||"");if(m)taskFor[m[1]]=t;});
  if(!chapters.length&&!plan.tasks.length) return "";
  return `<div class="card"><div class="ch"><h3>Avance</h3>
    <span class="tag">por porcentaje o por cantidad ejecutada — lo que sepa la obra</span></div>
   <div class="scroll"><table><thead><tr>
     <th>Partida</th><th>Ud</th><th class="num">Cantidad</th><th class="num">Ejecutado</th>
     <th class="num">Avance</th><th>Fechas previstas</th><th>Estado</th></tr></thead><tbody>
   ${chapters.map(c=>{const t=taskFor[c.num];
     return `<tr class="chaprow"><td>${c.num}. ${esc(c.name)}</td><td></td><td></td><td></td>
       <td class="num"><input class="inline pctin" type="number" min="0" max="100" step="1" data-chap="${c.num}" value="${t?t.progressPct:0}"></td>
       <td>${t?`${fmtD(t.plannedStart)} → ${fmtD(t.plannedEnd)}`:"—"}</td>
       <td>${pillProg(c.progress)}</td></tr>
      ${c.lines.filter(l=>!l.pending).map(l=>{
        const qty=(l.subLines.length?l.subLines.reduce((a,s)=>a+Math.round(s.qtyMilli*(1+(s.wastePct||0)/100)),0):l.qtyMilli)/1000;
        return `<tr><td style="padding-left:26px">${l.num} ${esc(l.desc)}</td><td>${esc(l.unit)}</td>
         <td class="num">${qty}</td>
         <td class="num"><input class="inline pctin" type="number" min="0" step="0.001" data-lineqty="${l.id}" data-total="${qty}" value="${Math.round(qty*(l.progressPct||0))/100}"></td>
         <td class="num"><input class="inline pctin" type="number" min="0" max="100" step="1" data-line="${l.id}" value="${l.progressPct||0}"></td>
         <td></td><td>${pillProg(l.progress)}</td></tr>`;}).join("")}`;}).join("")
     ||'<tr><td colspan="7"><div class="empty">Sin capítulos aceptados: el avance se registra sobre las tareas del gráfico.</div></td></tr>'}
   </tbody></table></div></div>`;
}

function wireProgressTable(pid,plan){
  const B=ganttApi(); if(!B) return;
  const taskFor={};
  plan.tasks.forEach(t=>{const m=/^group:(.+)$/.exec(t.sourceRef||"");if(m)taskFor[m[1]]=t;});
  document.querySelectorAll('[data-chap]').forEach(inp=>inp.onchange=()=>{
    const t=taskFor[inp.dataset.chap];
    mutate(()=>{
      if(t) B.save(erp.state,pid,B.recalculate(B.recordProgress(erp,pid,plan,t.id,+inp.value)));
      else erp.markProgress(pid,inp.dataset.chap,+inp.value>=100?"done":+inp.value>0?"inProgress":"notStarted",+inp.value,"operations");
    },"Avance registrado");
  });
  document.querySelectorAll('[data-line]').forEach(inp=>inp.onchange=()=>mutate(()=>{
    erp.markLineProgress(pid,inp.dataset.line,{pct:+inp.value},"operations");
    B.save(erp.state,pid,B.syncProgress(erp,pid,plan));
  },"Avance de la partida registrado"));
  /* Quantity, not percentage: the number the site actually knows. The engine
     converts it against the line's own quantity — the view does not divide. */
  document.querySelectorAll('[data-lineqty]').forEach(inp=>inp.onchange=()=>mutate(()=>{
    erp.markLineProgress(pid,inp.dataset.lineqty,{qtyMilliDone:Math.round(+inp.value*1000)},"operations");
    B.save(erp.state,pid,B.syncProgress(erp,pid,plan));
  },"Cantidad ejecutada registrada"));
}

/* ===================== Compras · Subcontratos · Modificaciones · Horas ==============
   §4.1, §4.2, §4.5, §4.6. Every one of these is project-scoped through gProject,
   same as seguimiento/economía — one job is the context of the whole section.
   Nothing here computes a commitment, a reconciliation or a projection: those
   come from erp.purchaseNeeds()/purchaseReconciliation()/committedByChapter()/
   subcontractsForProject(), the same calls economía uses, so the figures on
   these screens can never disagree with the ones there. */
const DOC_KIND_LABEL={insurance:"Seguro RC",prl:"PRL",socialSecurity:"Alta S.S."};
const SUPPLIER_ROLES=["supplier","subcontractor","selfEmployed"];
const PURCHASE_STATUS_LABEL={draft:["Borrador",""],sent:["Enviada","b"],accepted:["Aceptada","b"],
  partialReceived:["Recibida parcial","y"],received:["Recibida","g"],invoiced:["Facturada","g"],
  paid:["Pagada","g"],cancelled:["Anulada","r"]};
const SUBCONTRACT_STATUS_LABEL={draft:["Borrador",""],sent:["Enviada","b"],accepted:["Aceptada","b"],
  inExecution:["En ejecución","y"],completed:["Completada","g"],terminated:["Rescindida","r"],
  rejected:["Rechazada","r"]};
const CHANGE_STATUS_LABEL={identified:["Detectada","y"],priced:["Valorada","y"],sent:["Enviada","b"],
  approved:["Aceptada","g"],executed:["Aceptada","g"],invoiced:["Aceptada","g"],
  rejected:["Rechazada","r"],cancelled:["Anulada","r"]};
function supplierOptions(sel){
  return erp.state.parties.filter(p=>p.active&&p.roles.some(r=>SUPPLIER_ROLES.includes(r)))
    .map(s=>`<option value="${s.id}"${s.id===sel?" selected":""}>${esc(s.name)}</option>`).join("");
}
function chapterOptions(pid,sel){
  const p=erp.project(pid);
  return (p.baseline.chapters||[]).map(c=>`<option value="${c.num}"${c.num===sel?" selected":""}>${c.num}. ${esc(c.name)}</option>`).join("");
}
function noProjectsCard(v){ v.innerHTML='<div class="card"><div class="empty">Todavía no hay proyectos.</div></div>'; }

  const pid=gProject;

  const orders=erp.state.purchases.filter(p=>p.projectId===pid);
  const arrivals=orders.filter(p=>p.expectedArrival&&!p.status.delivered&&!p.cancelledAt)

    <div class="scroll"><table><thead><tr><th>Capítulo</th><th class="num">Presupuestado</th><th class="num">Comprometido</th><th class="num">Pendiente</th><th></th></tr></thead><tbody>
    ${needs.map(c=>`<tr><td>${c.num}. ${esc(c.name)}</td><td class="num">${eur0(c.budgetCostCents)}</td><td class="num">${eur0(c.committedCents)}</td>
      <td class="num warn">${eur0(c.pendingCents)}</td><td><button class="btn sm" data-need="${c.num}">＋ OC</button></td></tr>`).join("")
      ||'<tr><td colspan="5"><div class="empty">Todos los capítulos están comprometidos.</div></td></tr>'}
    </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Órdenes de compra</h3><span class="tag">${orders.length}</span></div>
    <div class="scroll"><table><thead><tr><th>Número</th><th>Proveedor</th><th>Capítulo</th><th class="num">Importe</th><th>Llegada prevista</th><th>Estado</th></tr></thead><tbody>
    ${orders.slice().reverse().map(pu=>{const st=erp.purchaseStatus(pu),lab=PURCHASE_STATUS_LABEL[st];
      return `<tr class="click" data-pu="${pu.id}"><td class="k">${pu.number}</td><td>${esc(erp.party(pu.supplierId).name)}</td>
      <td>${pu.chapterNum||"—"}</td><td class="num">${eur(pu.totalCents-pu.status.returnedCents)}</td>
      <td>${pu.expectedArrival?fmtD(pu.expectedArrival):"—"}</td><td><span class="pill ${lab[1]}">${lab[0]}</span></td></tr>`;}).join("")

    ${arrivals.map(pu=>`<div class="it"><span class="pill ${pu.expectedArrival<erp.today?"r":"b"}">${fmtD(pu.expectedArrival)}</span> ${pu.number} — ${esc(erp.party(pu.supplierId).name)}</div>`).join("")
     ||'<div class="it">Sin llegadas previstas.</div>'}

    <div class="daylist"><div class="it">Pedido ${(rec.orderedQtyMilli/1000)} / Recibido ${(rec.receivedQtyMilli/1000)}${rec.qtyMismatch?' <span class="pill r">cantidad</span>':""}</div>
    <div class="it">Pedido ${eur(rec.orderedCents)} / Facturado ${rec.invoicedCents!=null?eur(rec.invoicedCents):"—"}${rec.amountMismatch?' <span class="pill r">importe</span>':""}</div></div></div>`:""}

    ${!pu.cancelledAt&&!pu.status.invoicedBillId?'<button class="btn sm" id="a_dup">Duplicar</button><button class="btn sm danger" id="a_cancel">Anular</button>':""}
    ${pu.status.delivered?`<div class="it"><label>Importe a devolver (€)</label><input id="a_ret" type="number" step="0.01" value="0"></div><button class="btn sm" id="a_return">Registrar devolución</button>`:""}
   </div></div>`;
  const send=$('#a_send'); if(send) send.onclick=()=>mutate(()=>{erp.sendPurchase(id,"backoffice");purchaseDrawer(id);},"Orden enviada");
  const accept=$('#a_accept'); if(accept) accept.onclick=()=>mutate(()=>{
    erp.acceptPurchase(id,{expectedArrival:$('#a_arr').value||null},"backoffice"); purchaseDrawer(id);
  },"Aceptación registrada");
  const recv=$('#a_recv'); if(recv) recv.onclick=()=>mutate(()=>{
    const q=+$('#a_qty').value; if(!(q>0)) throw new Error("Indica la cantidad recibida");
    erp.receivePurchase(id,{qtyMilli:Math.round(q*1000),docRef:$('#a_doc').value},"operations"); purchaseDrawer(id);

  const dup=$('#a_dup'); if(dup) dup.onclick=()=>mutate(()=>{erp.duplicatePurchase(id,"backoffice");closeDrawer();},"Orden duplicada");
  const cancel=$('#a_cancel'); if(cancel) cancel.onclick=()=>{

     <button class="btn sm" id="x_complete">Marcar completada</button>`:""}
    ${!["completed","terminated"].includes(s.status)?`<div class="it"><label>Nueva fecha fin</label><input id="x_ext" type="date" value="${s.dates.plannedEnd||""}"></div><button class="btn sm" id="x_extend">Ampliar</button>
     <button class="btn sm danger" id="x_term">Rescindir</button>`:""}
    ${s.retentionPct>0&&!s.retentionReleasedAt?'<button class="btn sm" id="x_release">Liberar retención</button>':""}
   </div></div>`;
  db.querySelectorAll('[data-docsave]').forEach(b=>b.onclick=()=>mutate(()=>{
    const kind=b.dataset.docsave, val=db.querySelector(`[data-doc="${kind}"]`).value;
    erp.renewSubcontractDoc(id,{kind,expiresOn:val||null},"backoffice"); subcontractDrawer(id);
  },"Documento renovado"));
  const send=$('#x_send'); if(send) send.onclick=()=>mutate(()=>{erp.sendSubcontract(id,"backoffice");subcontractDrawer(id);},"Subcontrata enviada");
  const accept=$('#x_accept'); if(accept) accept.onclick=()=>mutate(()=>{
    erp.acceptSubcontract(id,{plannedStart:$('#x_ps').value,plannedEnd:$('#x_pe').value},"backoffice"); subcontractDrawer(id);
  },"Aceptación registrada");
  const start=$('#x_start'); if(start) start.onclick=()=>mutate(()=>{erp.markSubcontractStarted(id,"operations");subcontractDrawer(id);},"Inicio registrado");
  const certsave=$('#x_certsave'); if(certsave) certsave.onclick=()=>mutate(()=>{
    const amt=Math.round(+$('#x_cert').value*100); if(!(amt>0)) throw new Error("Indica el importe certificado");
    erp.certifySubcontract(id,{amountCents:amt},"operations"); subcontractDrawer(id);
  },"Certificación registrada");
  const bsave=$('#x_bsave'); if(bsave) bsave.onclick=()=>mutate(()=>{
    const num=$('#x_binv').value.trim(), amt=Math.round(+$('#x_bamt').value*100);
    if(!num||!(amt>0)) throw new Error("Indica el número y el importe de la factura");
    erp.approveSubcontractorInvoice(id,{number:num,baseCents:amt},"backoffice"); closeDrawer();
  },"Factura aprobada");
  const complete=$('#x_complete'); if(complete) complete.onclick=()=>mutate(()=>{erp.markSubcontractCompleted(id,"operations");closeDrawer();},"Subcontrata completada");
  const extend=$('#x_extend'); if(extend) extend.onclick=()=>mutate(()=>{erp.extendSubcontract(id,{plannedEnd:$('#x_ext').value},"backoffice");subcontractDrawer(id);},"Fecha ampliada");
  const term=$('#x_term'); if(term) term.onclick=()=>{
    const reason=prompt("Motivo de la rescisión")||"";
    mutate(()=>{erp.terminateSubcontract(id,reason,"backoffice");closeDrawer();},"Subcontrata rescindida");
  };
  const release=$('#x_release'); if(release) release.onclick=()=>mutate(()=>{erp.releaseSubcontractRetention(id,"backoffice");subcontractDrawer(id);},"Retención liberada");
}

  if(c.status==="priced") return `<button class="btn sm" data-send="${c.id}">Enviar</button> <button class="btn sm danger" data-cancel="${c.id}">Anular</button>`;
  if(c.status==="sent") return `<button class="btn sm primary" data-approve="${c.id}">Aprobar</button> <button class="btn sm danger" data-reject="${c.id}">Rechazar</button>`;

  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{
