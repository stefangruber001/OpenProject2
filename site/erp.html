function ganttTaskDrawer(pid,taskId){
  const B=ganttApi(), plan=B.get(erp.state,pid), sch=B.schedule(plan);
  const t=plan.tasks.find(x=>x.id===taskId); if(!t)return;
  const p=(sch?sch.tasks.find(s=>s.taskId===taskId):null)||{start:t.plannedStart,finish:t.plannedEnd,durationDays:0,totalFloatDays:0,critical:false};
  const preds=(plan.dependencies||[]).filter(d=>d.successorId===taskId);
  const TYPE={FS:"fin → inicio",SS:"inicio → inicio",FF:"fin → fin"};
  const db=openDrawer(t.title);
  db.innerHTML=`
   <div class="kpis" style="grid-template-columns:1fr 1fr">
    <div class="kpi"><div class="lab">Fechas</div><div class="val" style="font-size:15px">${fmtD(p.start)} → ${fmtD(p.finish)}</div><div class="sub">${p.durationDays} días laborables</div></div>
    <div class="kpi ${p.critical?"warn":""}"><div class="lab">Holgura</div><div class="val">${p.critical?"0":p.totalFloatDays}</div><div class="sub">${p.critical?"en la ruta crítica":"días de margen"}</div></div>
   </div>
   <div class="fgrid">
    <div class="field full"><label>Nombre</label><input id="t_title" value="${esc(t.title)}"></div>
    ${t.milestone?"":`<div class="field"><label>Duración (días laborables)</label><input id="t_days" type="number" min="1" value="${p.durationDays}"></div>`}
    <div class="field"><label>Avance %</label><input id="t_pct" type="number" min="0" max="100" value="${t.progressPct||0}"></div>
    <div class="field full"><label>No empezar antes de ${t.earliestStart?"":"(sin fijar)"}</label><input id="t_pin" type="date" value="${t.earliestStart||""}"></div>
    <div class="field full"><button class="btn primary" id="t_save">Guardar</button> ${t.earliestStart?`<button class="btn" id="t_unpin">Soltar fecha</button>`:""}</div>
   </div>
   <div class="card" style="margin-top:12px"><div class="ch"><h3>Depende de</h3><span class="tag">${preds.length} dependencia${preds.length===1?"":"s"}</span></div><div class="daylist">
    ${preds.map(d=>{const a=plan.tasks.find(x=>x.id===d.predecessorId);return `<div class="it" style="align-items:center;gap:8px">
      <span style="flex:1">${esc(a?a.title:d.predecessorId)} <span class="pill b">${TYPE[d.type]}</span>${d.lagDays?` <span class="pill y">${d.lagDays>0?"+":""}${d.lagDays} d</span>`:""}</span>
      <button class="btn sm" data-unlink="${d.id}">Quitar</button></div>`;}).join("")||'<div class="it">Ninguna. Arrastra el punto de otra barra hasta ésta para crear una.</div>'}
   </div></div>
   <div style="margin-top:12px"><button class="btn danger" id="t_del">Eliminar de la planificación</button></div>`;
  $('#t_save').onclick=()=>mutate(()=>{
    let next=B.rename(plan,taskId,$('#t_title').value);
    if(!t.milestone) next=B.setDuration(next,taskId,Math.max(1,+$('#t_days').value||1));
    next=B.setProgress(next,taskId,+$('#t_pct').value||0);
    const pin=$('#t_pin').value;
    next=pin?B.move(next,taskId,pin):B.unpin(next,taskId);
    B.save(erp.state,pid,B.recalculate(next));
    closeDrawer();
  },"Tarea actualizada");
  const up=$('#t_unpin'); if(up) up.onclick=()=>mutate(()=>{
    B.save(erp.state,pid,B.recalculate(B.unpin(plan,taskId))); closeDrawer();
  },"La tarea vuelve a su fecha más temprana");
  db.querySelectorAll('[data-unlink]').forEach(b=>b.onclick=()=>mutate(()=>{
    B.save(erp.state,pid,B.recalculate(B.unlink(plan,b.dataset.unlink)));
  },"Dependencia eliminada"));
  $('#t_del').onclick=()=>mutate(()=>{
    B.save(erp.state,pid,B.recalculate(B.removeTask(plan,taskId)));
    gSel=null; closeDrawer();
  },"Tarea eliminada");
}

/* ===================== Technical tracking (spec §4.3) ==============================
   The chart came in session 6; this is the half around it — progress recorded
   per chapter and per line, the S curve, and the deviations panel.

   Same rule as everywhere else in this file: NOTHING here computes a schedule,
   a drift, a projection or a percentage of completion. Planned/actual/projected
   and every risk item come from @repo/capability-scheduling through the bridge;
   the value-weighting comes from erp.budgetTotals(). This block turns those
   numbers into pixels and inputs, and that is all. */

/** What each bar is worth, so the S curve is value- and not time-weighted:
    a week of demolition and a week of joinery are not the same amount of job. */
function planWeights(pid,plan){
  const w={};
  try{
    const p=erp.project(pid);
    const byNum={};
    (p.baseline.chapters||[]).forEach(c=>{byNum[c.num]=c.saleCents;});
    plan.tasks.forEach(t=>{
      const m=/^group:(.+)$/.exec(t.sourceRef||"");
      if(m&&byNum[m[1]]>0) w[t.id]=byNum[m[1]];
    });
  }catch(e){}
  return w;
}

/* Re-derives the plan from the accepted budget. The toast reports how the
   durations were arrived at, because "5 tasks, 2 with no known daily output"
   is the difference between a plan and a guess, and the planner should be told
   which one they just got rather than having to infer it from bar widths. */
function deriveFromBudget(pid,cal){
  const B=ganttApi();
  let msg="Planificación derivada del presupuesto";
  try{
    const derived=B.fromBudget(erp,pid,{calendar:cal});
    if(!derived) throw new Error("El proyecto no tiene presupuesto aceptado del que derivar");
    const guessed=derived.notes.filter(n=>n.basis==="default").length;
    msg=`${derived.plan.tasks.length} tareas · `+(guessed
      ? `${guessed} sin rendimiento conocido (duración por defecto)`
      : "duraciones derivadas de las cantidades");
    mutate(()=>{ B.save(erp.state,pid,derived.plan); },msg);
  }catch(e){ toast("⚠ "+e.message); }
}

/** Planned / actual / projected, drawn from the points the capability returned. */
function curveChart(curve){
  const W=560,H=210,L=34,R=10,T=12,Bm=26;
  const pts=curve.points; if(pts.length<2) return "";
  const x=i=>L+(i/(pts.length-1))*(W-L-R);
  const y=v=>T+(1-v/100)*(H-T-Bm);
  const path=key=>{
    let d="",open=false;
    pts.forEach((p,i)=>{ const v=p[key]; if(v==null){open=false;return;}
      d+=(open?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)+" "; open=true; });
    return d.trim();
  };
  const nowIdx=pts.findIndex(p=>p.date>curve.asOf);
  const nowX=nowIdx>0?x(nowIdx-1):null;
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Curva S de avance">
    ${[0,25,50,75,100].map(v=>`<line class="cgrid" x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}"></line>
      <text x="4" y="${y(v)+3}">${v}%</text>`).join("")}
    ${nowX!=null?`<line class="cnow" x1="${nowX}" y1="${T}" x2="${nowX}" y2="${H-Bm}"></line>`:""}
    <path class="cplan" d="${path("plannedPct")}"></path>
    <path class="cproj" d="${path("projectedPct")}"></path>
    <path class="cact" d="${path("actualPct")}"></path>
    <text x="${L}" y="${H-8}">${fmtD(pts[0].date)}</text>
    <text x="${W-R}" y="${H-8}" text-anchor="end">${fmtD(pts[pts.length-1].date)}</text>
  </svg>`;
}

/** Chapters (the bars) and, under each, the budget lines they are made of. */
function progressTable(pid,plan){
  let chapters=[];
  try{
    const p=erp.project(pid);
    chapters=p.budgetId?erp.version(p.budgetId,p.acceptedVersionId).chapters.filter(c=>c.section==="base"):[];
  }catch(e){}
  const taskFor={};
  plan.tasks.forEach(t=>{const m=/^group:(.+)$/.exec(t.sourceRef||"");if(m)taskFor[m[1]]=t;});
  if(!chapters.length&&!plan.tasks.length) return "";
  return `<div class="card"><div class="ch"><h3>Avance</h3>
    <span class="tag">por porcentaje o por cantidad ejecutada — lo que sepa la obra</span></div>
   <div class="scroll"><table><thead><tr>
     <th>Partida</th><th>Ud</th><th class="num">Cantidad</th><th class="num">Ejecutado</th>
     <th class="num">Avance</th><th>Fechas previstas</th><th>Estado</th></tr></thead><tbody>
   ${chapters.map(c=>{const t=taskFor[c.num];
     return `<tr class="chaprow"><td>${c.num}. ${esc(c.name)}</td><td></td><td></td><td></td>
       <td class="num"><input class="inline pctin" type="number" min="0" max="100" step="1" data-chap="${c.num}" value="${t?t.progressPct:0}"></td>
       <td>${t?`${fmtD(t.plannedStart)} → ${fmtD(t.plannedEnd)}`:"—"}</td>
       <td>${pillProg(c.progress)}</td></tr>
      ${c.lines.filter(l=>!l.pending).map(l=>{
        const qty=(l.subLines.length?l.subLines.reduce((a,s)=>a+Math.round(s.qtyMilli*(1+(s.wastePct||0)/100)),0):l.qtyMilli)/1000;
        return `<tr><td style="padding-left:26px">${l.num} ${esc(l.desc)}</td><td>${esc(l.unit)}</td>
         <td class="num">${qty}</td>
         <td class="num"><input class="inline pctin" type="number" min="0" step="0.001" data-lineqty="${l.id}" data-total="${qty}" value="${Math.round(qty*(l.progressPct||0))/100}"></td>
         <td class="num"><input class="inline pctin" type="number" min="0" max="100" step="1" data-line="${l.id}" value="${l.progressPct||0}"></td>
         <td></td><td>${pillProg(l.progress)}</td></tr>`;}).join("")}`;}).join("")
     ||'<tr><td colspan="7"><div class="empty">Sin capítulos aceptados: el avance se registra sobre las tareas del gráfico.</div></td></tr>'}
   </tbody></table></div></div>`;
}

function wireProgressTable(pid,plan){
  const B=ganttApi(); if(!B) return;
  const taskFor={};
  plan.tasks.forEach(t=>{const m=/^group:(.+)$/.exec(t.sourceRef||"");if(m)taskFor[m[1]]=t;});
  document.querySelectorAll('[data-chap]').forEach(inp=>inp.onchange=()=>{
    const t=taskFor[inp.dataset.chap];
    mutate(()=>{
      if(t) B.save(erp.state,pid,B.recalculate(B.recordProgress(erp,pid,plan,t.id,+inp.value)));
      else erp.markProgress(pid,inp.dataset.chap,+inp.value>=100?"done":+inp.value>0?"inProgress":"notStarted",+inp.value,"operations");
    },"Avance registrado");
  });
  document.querySelectorAll('[data-line]').forEach(inp=>inp.onchange=()=>mutate(()=>{
    erp.markLineProgress(pid,inp.dataset.line,{pct:+inp.value},"operations");
    B.save(erp.state,pid,B.syncProgress(erp,pid,plan));
  },"Avance de la partida registrado"));
  /* Quantity, not percentage: the number the site actually knows. The engine
     converts it against the line's own quantity — the view does not divide. */
  document.querySelectorAll('[data-lineqty]').forEach(inp=>inp.onchange=()=>mutate(()=>{
    erp.markLineProgress(pid,inp.dataset.lineqty,{qtyMilliDone:Math.round(+inp.value*1000)},"operations");
    B.save(erp.state,pid,B.syncProgress(erp,pid,plan));
  },"Cantidad ejecutada registrada"));
}

/* ===================== Compras · Subcontratos · Modificaciones · Horas ==============
   §4.1, §4.2, §4.5, §4.6. Every one of these is project-scoped through gProject,
   same as seguimiento/economía — one job is the context of the whole section.
   Nothing here computes a commitment, a reconciliation or a projection: those
   come from erp.purchaseNeeds()/purchaseReconciliation()/committedByChapter()/
   subcontractsForProject(), the same calls economía uses, so the figures on
   these screens can never disagree with the ones there. */
const DOC_KIND_LABEL={insurance:"Seguro RC",prl:"PRL",socialSecurity:"Alta S.S."};
const SUPPLIER_ROLES=["supplier","subcontractor","selfEmployed"];
const PURCHASE_STATUS_LABEL={draft:["Borrador",""],sent:["Enviada","b"],accepted:["Aceptada","b"],
  partialReceived:["Recibida parcial","y"],received:["Recibida","g"],invoiced:["Facturada","g"],
  paid:["Pagada","g"],cancelled:["Anulada","r"]};
/* The three the v4 screen counts by. The seven above still describe what the
   order knows; these are the coarser reading ADM-02 is organised around, and
   both are derived from the same facts so they cannot disagree. */
const PURCHASE_STAGE_LABEL={offer:["Oferta","y"],order:["Pedido","b"],invoiced:["Facturado","g"],
  cancelled:["Anulada","r"]};
const SUBCONTRACT_STATUS_LABEL={draft:["Borrador",""],sent:["Enviada","b"],accepted:["Aceptada","b"],
  inExecution:["En ejecución","y"],completed:["Completada","g"],terminated:["Rescindida","r"],
  rejected:["Rechazada","r"]};
const CHANGE_STATUS_LABEL={identified:["Detectada","y"],priced:["Valorada","y"],sent:["Enviada","b"],
  approved:["Aceptada","g"],executed:["Aceptada","g"],invoiced:["Aceptada","g"],
  rejected:["Rechazada","r"],cancelled:["Anulada","r"]};
function supplierOptions(sel){
  return erp.state.parties.filter(p=>p.active&&p.roles.some(r=>SUPPLIER_ROLES.includes(r)))
    .map(s=>`<option value="${s.id}"${s.id===sel?" selected":""}>${esc(s.name)}</option>`).join("");
}
function chapterOptions(pid,sel){
  const p=erp.project(pid);
  // A project reached from ADM-03's allocation panel need not have a frozen
  // baseline — a cost can land on a job before its presupuesto was accepted.
  // The screen offers no capítulo in that case rather than throwing.
  return ((p.baseline&&p.baseline.chapters)||[]).map(c=>`<option value="${c.num}"${c.num===sel?" selected":""}>${c.num}. ${esc(c.name)}</option>`).join("");
}
function noProjectsCard(v){ v.innerHTML='<div class="card"><div class="empty">Todavía no hay proyectos.</div></div>'; }

/* ---------- Compras (§4.1 · ADM-02, rebuilt in S7) ----------
   The specification's shape: three counters across the top — oferta, pedido,
   facturado — each carrying a count AND an amount, and each filtering the
   list when pressed. Then the orders themselves, on the shared list primitive
   so they paginate like every other table in the application.

   Necesidades and the arrivals calendar stay below. The v4 document does not
   describe them and could be read as removing them; they are kept because
   they are the only place the budget's committed-versus-pending figure is
   visible, and an order created from an open need is an order that already
   knows which capítulo it belongs to. Retiring them would move real work back
   into somebody's head. Logged in ASSUMPTIONS.md.

   Goods receipt is no longer a stage of this screen, which is what the doc
   asks for. The engine keeps `receivePurchase` and its reconciliation — the
   evidence a delivery note gives is not something to delete because a screen
   stopped counting by it — and the action stays in the record panel. */
let purchStage="";   // "" | offer | order | invoiced — which counter is pressed
function compras(v){

  const pid=gProject;

  const orders=erp.state.purchases.filter(p=>p.projectId===pid);
  const sum=erp.purchaseStageSummary(pid);
  const arrivals=orders.filter(p=>p.expectedArrival&&!p.status.delivered&&!p.cancelledAt)
    .sort((a,b)=>a.expectedArrival<b.expectedArrival?-1:1);
  const shown=purchStage?orders.filter(p=>erp.purchaseStage(p)===purchStage):orders;

  v.innerHTML=`
   <div class="counters" style="--cw:360px">
    ${["offer","order","invoiced"].map(k=>`<button class="counter${purchStage===k?" on":""}" data-stage="${k}">
      <div class="lab">${esc(PURCHASE_STAGE_LABEL[k][0])}</div>
      <div class="val">${eur0(sum[k].amountCents)}</div>
      <div class="sub"><span>${sum[k].count}</span> <span>${sum[k].count===1?"orden":"órdenes"}</span></div>
     </button>`).join("")}
   </div>
   <div id="puList"></div>
   <div class="card"><div class="ch"><h3>Necesidades</h3><span class="tag">lo comprometido frente a lo pendiente, por capítulo</span></div>
    <div class="scroll"><table><thead><tr><th>Capítulo</th><th class="num">Presupuestado</th><th class="num">Comprometido</th><th class="num">Pendiente</th><th></th></tr></thead><tbody>
    ${needs.map(c=>`<tr><td>${c.num}. ${esc(c.name)}</td><td class="num">${eur0(c.budgetCostCents)}</td><td class="num">${eur0(c.committedCents)}</td>
      <td class="num warn">${eur0(c.pendingCents)}</td><td><button class="btn sm" data-need="${c.num}">＋ OC</button></td></tr>`).join("")
      ||'<tr><td colspan="5"><div class="empty">Todos los capítulos están comprometidos.</div></td></tr>'}
    </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Calendario de llegadas</h3></div><div class="daylist">
    ${arrivals.map(pu=>`<div class="it"><span class="pill ${pu.expectedArrival<erp.today?"r":"b"}">${fmtD(pu.expectedArrival)}</span> ${pu.number} — ${esc(erp.party(pu.supplierId).name)}</div>`).join("")
     ||'<div class="it">Sin llegadas previstas.</div>'}
   </div></div>`;

  renderMasterList($('#puList'),{
    id:"purchases",
    ids:{q:"puQ",size:"puSize",prev:"puPrev",next:"puNext",newBtn:"cNew",exp:"puExp",
      expMenu:"puExpMenu",expXlsx:"puExpXlsx",expCsv:"puExpCsv"},
    newLabel:"＋ Nueva orden de compra",
    nounSingular:"orden", nounPlural:"órdenes",
    searchPlaceholder:"Buscar por número, proveedor o descripción…",
    emptyText:"Ninguna orden coincide con la búsqueda.",
    baseRows:shown.slice().reverse(),
    matches:(p,q)=>[p.number,p.desc,p.orderRef,erp.party(p.supplierId).name]
      .filter(Boolean).join(" ").toLowerCase().includes(q),
    columns:[
      {label:"Número",primary:true,get:p=>p.number},
      {label:"Proveedor",get:p=>erp.party(p.supplierId).name},
      {label:"Capítulo",get:p=>p.chapterNum||"—"},
      {label:"Importe",html:p=>eur(p.totalCents-(p.status.returnedCents||0))},
      {label:"Llegada prevista",get:p=>p.expectedArrival?fmtD(p.expectedArrival):"—"},
      {label:"Documento",html:p=>(p.docRefs||[]).length?'<span class="pill g">Sí</span>':'<span class="pill y">No</span>'},
      {label:"Estado",html:p=>{const l=PURCHASE_STAGE_LABEL[erp.purchaseStage(p)];
        return `<span class="pill ${l[1]}">${esc(l[0])}</span>`;}},
    ],
    onNew:()=>purchaseFormDrawer(pid),
    onRowClick:id=>{ puWork={id,zoom:1}; render(); },
  });

  v.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{
    purchStage=purchStage===b.dataset.stage?"":b.dataset.stage; render();
  });
  v.querySelectorAll('[data-need]').forEach(b=>b.onclick=()=>purchaseFormDrawer(pid,b.dataset.need));
}

   The third of the specification's four out-of-shell surfaces to be built:

/** The supplier's paperwork, or an honest statement that there is none. */
function purchaseDocPane(capId){
  const host=$('#puDocPane'); if(!host) return;
  const zoom=puWork?puWork.zoom:1;
  const fit=elm=>{ elm.style.width=(zoom*100)+"%"; };
  if(!capId){
    host.innerHTML='<div class="empty">Sin la oferta del proveedor. Captúrela en Facturas de proveedores y adjúntela aquí para comprobar el pedido contra lo que ofreció.</div>';
    return;
  }
  const cap=erp.state.captured.find(x=>x.id===capId);
  if(!cap||!cap.imageRef){ host.innerHTML='<div class="empty">El documento adjunto ya no tiene archivo.</div>'; return; }
  host.innerHTML='<div class="empty">Preparando la vista…</div>';
  ErpStore.getBlob(cap.imageRef).then(blob=>{
    if(!blob){ host.innerHTML='<div class="empty">El archivo no está en este dispositivo.</div>'; return; }
    if(!/pdf/i.test(blob.type||"")){
      const img=new Image();
      img.onload=()=>{ host.innerHTML=''; host.appendChild(img); fit(img); };
      img.onerror=()=>{ host.innerHTML='<div class="empty">No se ha podido mostrar el documento.</div>'; };
      img.alt=""; img.src=URL.createObjectURL(blob);
      return;
    }
    return blob.arrayBuffer()
      .then(buf=>import(ErpOcr.vendorBase()+"pdfjs/pdf.min.mjs").then(m=>({m,buf})))
      .then(({m,buf})=>m.getDocument({data:new Uint8Array(buf)}).promise)
      .then(doc=>doc.getPage(1))
      .then(page=>{
        const vp=page.getViewport({scale:1.4});
        const c=document.createElement('canvas');
        c.width=Math.round(vp.width); c.height=Math.round(vp.height);
        return page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(()=>c);
      })
      .then(c=>{ host.innerHTML=''; host.appendChild(c); fit(c); });
  }).catch(()=>{ host.innerHTML='<div class="empty">No se ha podido mostrar el documento.</div>'; });
}

     <div class="it"><label for="pa_doc">Albarán</label><input id="pa_doc" placeholder="ALB-..."></div><button class="btn sm" id="pa_recv">Registrar recepción</button>`:""}
    ${!pu.cancelledAt&&!pu.status.invoicedBillId?'<button class="btn sm" id="pa_dup">Duplicar</button><button class="btn sm danger" id="pa_cancel">Anular</button>':""}
    ${pu.status.delivered?`<div class="it"><label for="pa_ret">Importe a devolver (€)</label><input id="pa_ret" type="number" step="0.01" value="0"></div><button class="btn sm" id="pa_return">Registrar devolución</button>`:""}
   </div></div>`;

  const on=(id,fn)=>{ const b=$('#'+id); if(b) b.onclick=fn; };
  on('pa_send',()=>mutate(()=>erp.sendPurchase(pu.id,"backoffice"),"Orden enviada"));
  on('pa_accept',()=>mutate(()=>erp.acceptPurchase(pu.id,{expectedArrival:$('#pa_arr').value||null},"backoffice"),"Aceptación registrada"));
  on('pa_recv',()=>mutate(()=>{
    const q=+$('#pa_qty').value; if(!(q>0)) throw new Error("Indica la cantidad recibida");
    erp.receivePurchase(pu.id,{qtyMilli:Math.round(q*1000),docRef:$('#pa_doc').value},"operations");
  },"Recepción registrada"));
  on('pa_dup',()=>mutate(()=>{erp.duplicatePurchase(pu.id,"backoffice");puWork=null;},"Orden duplicada"));
  on('pa_cancel',()=>{
    const reason=prompt("Motivo de la anulación")||"";
    mutate(()=>erp.cancelPurchase(pu.id,reason,"backoffice"),"Orden anulada");
  });
  on('pa_return',()=>mutate(()=>{
    const amt=Math.round(+$('#pa_ret').value*100); if(!(amt>0)) throw new Error("Indica el importe a devolver");
    erp.recordReturn(pu.id,amt,"backoffice");
  },"Devolución registrada"));
}

function changeActionsHtml(c){
  if(c.status==="identified") return `<button class="btn sm" data-price="${c.id}">Valorar</button>`;
  if(c.status==="priced") return `<button class="btn sm" data-send="${c.id}">Enviar</button> <button class="btn sm danger" data-cancel="${c.id}">Anular</button>`;
  if(c.status==="sent") return `<button class="btn sm primary" data-approve="${c.id}">Aprobar</button> <button class="btn sm danger" data-reject="${c.id}">Rechazar</button>`;
  if(["approved","executed"].includes(c.status)){
    let h=`<button class="btn sm" data-doc="${c.id}">Ver adenda</button>`;
    if(c.chapterNum&&c.scheduleImpactDays) h+=` <button class="btn sm" data-apply="${c.id}">Aplicar a planificación</button>`;
    return h;
  }
  return "";
}
function wireChangeActions(pid){
  document.querySelectorAll('[data-price]').forEach(b=>b.onclick=()=>changePriceDrawer(b.dataset.price));
  document.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>mutate(()=>erp.sendChange(b.dataset.send,"backoffice"),"Modificación enviada"));
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>mutate(()=>erp.approveChange(b.dataset.approve,"aceptacion-cliente.png","backoffice"),"Modificación aprobada — adenda generada"));
  document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{
    const reason=prompt("Motivo del rechazo"); if(reason==null)return;
    mutate(()=>erp.rejectChange(b.dataset.reject,reason,"backoffice"),"Modificación rechazada");
  });
  document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{
    const reason=prompt("Motivo de la anulación")||"";
    mutate(()=>erp.cancelChange(b.dataset.cancel,reason,"backoffice"),"Modificación anulada");
  });
  document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>changeDocDrawer(b.dataset.doc));
  document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>{
    const B=ganttApi(); if(!B){ toast("⚠ Módulo de planificación no disponible"); return; }
    const c=erp.state.changes.find(x=>x.id===b.dataset.apply);
    mutate(()=>{
      const plan=B.get(erp.state,pid);
      const applied=B.applyChapterDelay(plan,c.chapterNum,c.scheduleImpactDays);
      if(applied===plan) throw new Error("El capítulo "+c.chapterNum+" no tiene todavía una tarea derivada — deriva la planificación primero");
      B.save(erp.state,pid,B.recalculate(applied));
    },"Planificación actualizada "+(c.scheduleImpactDays>0?"+":"")+c.scheduleImpactDays+" días");
  });
}

/* ---------- Horas (§4.6) ---------- */
let hWeekRef=null, hChapter=null;
function horas(v){
  $('#sub').textContent="Rejilla semanal por trabajador y capítulo. Un solo paso desde el móvil: marcar presentes y confirmar la jornada.";
  if(!erp.state.projects.length) return noProjectsCard(v);
  const pid=gProject;
  if(!hWeekRef) hWeekRef=erp.today;
  const week=erp.labourWeek(pid,hWeekRef);
  const p=erp.project(pid), chapters=p.baseline.chapters||[];
  if(!hChapter||!chapters.some(c=>c.num===hChapter)) hChapter=chapters[0]?chapters[0].num:null;
  const DOW=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
  v.innerHTML=`
   <div class="stepbar">
    <button class="btn sm" id="hPrev">← Semana anterior</button>
    <span class="pill">${fmtD(week.days[0])} – ${fmtD(week.days[6])}</span>
    <button class="btn sm" id="hNext">Semana siguiente →</button>
    <span style="flex:1"></span>
    <label style="font-size:12px;color:var(--muted)">Capítulo para horas nuevas</label>
    <select class="inline" id="hChapSel">${chapters.map(c=>`<option value="${c.num}"${c.num===hChapter?" selected":""}>${c.num}. ${esc(c.name)}</option>`).join("")||'<option value="">—</option>'}</select>
    <button class="btn sm" id="hRepeat" title="Copia las horas de ayer a hoy">↻ Repetir día anterior</button>
    <button class="btn sm" id="hAssign">＋ Asignar trabajador</button>
   </div>
   <div class="card"><div class="ch"><h3>Semana</h3><span class="tag">${(week.totalsByDayMilli.reduce((a,b)=>a+b,0)/1000).toLocaleString('es-ES')} h totales</span></div>
    <div class="scroll"><table class="wgrid"><thead><tr><th>Trabajador</th>${week.days.map((d,i)=>`<th class="${i>=5?'wknd':''}">${DOW[i]}<br>${fmtD(d).slice(0,5)}</th>`).join("")}<th class="wtot">Total</th><th></th></tr></thead><tbody>
    ${week.rows.map(r=>`<tr><td class="k">${esc(r.name)}</td>
      ${r.cells.map((c,i)=>`<td class="${i>=5?'wknd':''}">${c.entryIds.length>1
        ?`<span class="pill y" title="Repartido en varios capítulos — corrige desde el registro">${(c.hoursMilli/1000).toLocaleString('es-ES')}</span>`
        :`<input class="inline hin" type="number" step="0.25" min="0" data-worker="${r.workerId}" data-date="${c.date}" value="${c.hoursMilli?(c.hoursMilli/1000):''}"${c.locked?" disabled":""}>`}</td>`).join("")}
      <td class="wtot num">${(r.totalMilli/1000).toLocaleString('es-ES')}</td>
      <td>${r.cells.some(c=>c.locked)?`<button class="btn sm" data-unapprove="${r.workerId}">🔓 Reabrir</button>`:`<button class="btn sm" data-approve="${r.workerId}">🔒 Aprobar</button>`}
       <button class="btn sm" data-workerdoc="${r.workerId}">🪪</button></td></tr>`).join("")
      ||'<tr><td colspan="9"><div class="empty">Sin trabajadores asignados a este proyecto en esta semana.</div></td></tr>'}
    <tr class="tot"><td>Total día</td>${week.totalsByDayMilli.map((m,i)=>`<td class="${i>=5?'wknd':''} num">${m?(m/1000).toLocaleString('es-ES'):"—"}</td>`).join("")}<td class="wtot"></td><td></td></tr>
    </tbody></table></div></div>
   ${labourRegister(pid)}`;
  $('#hPrev').onclick=()=>{hWeekRef=isoAdd(week.weekStart,-7);render();};
  $('#hNext').onclick=()=>{hWeekRef=isoAdd(week.weekStart,7);render();};
  $('#hChapSel').onchange=e=>{hChapter=e.target.value;};
  $('#hRepeat').onclick=()=>mutate(()=>{
    erp.repeatDay(pid,isoAdd(erp.today,-1),erp.today,"operations");
  },"Jornada repetida desde ayer");
  $('#hAssign').onclick=()=>assignWorkerDrawer(pid);
  v.querySelectorAll('.wgrid input.hin').forEach(inp=>inp.onchange=()=>{
    const workerId=inp.dataset.worker, date=inp.dataset.date;
    const row=week.rows.find(r=>r.workerId===workerId), cell=row.cells.find(c=>c.date===date);
    const val=+inp.value||0;
    // Zero clears the entry outright — that is what "corregir y eliminar" means
    // for a grid cell, rather than leaving a stray zero-hour row behind.
    mutate(()=>{
      if(cell.entryIds.length===0){
        if(val<=0) return;
        if(!hChapter) throw new Error("Selecciona un capítulo antes de registrar horas");
        erp.recordHours({workerId,projectId:pid,chapterNum:hChapter,hoursMilli:Math.round(val*1000),date},"operations");
      } else if(val<=0){
        erp.deleteHours(cell.entryIds[0],"operations");
      } else {
        erp.correctHours(cell.entryIds[0],{hoursMilli:Math.round(val*1000)},"operations");
      }
    },"Horas actualizadas");
  });
  v.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>mutate(()=>erp.approveLabourWeek(b.dataset.approve,week.weekStart,"backoffice"),"Semana aprobada"));
  v.querySelectorAll('[data-unapprove]').forEach(b=>b.onclick=()=>mutate(()=>erp.unapproveLabourWeek(b.dataset.unapprove,week.weekStart,"backoffice"),"Semana reabierta"));
  v.querySelectorAll('[data-workerdoc]').forEach(b=>b.onclick=()=>workerDocDrawer(b.dataset.workerdoc));
  wireLabourRegister(pid);
}
function labourRegister(pid){
  const lab=erp.state.labour.filter(l=>l.projectId===pid&&inPeriod(l.date));
  return `<div class="card"><div class="ch"><h3>Registro</h3><span class="tag">reasigna o corrige una entrada</span></div>
   <div class="scroll"><table><thead><tr><th>Fecha</th><th>Trabajador</th><th>Capítulo</th><th class="num">Horas</th><th class="num">Coste</th><th>Estado</th><th></th></tr></thead><tbody>
   ${lab.slice().reverse().map(l=>`<tr><td>${fmtD(l.date)}</td><td>${esc(erp.state.workers.find(w=>w.id===l.workerId).name)}</td>
    <td>${l.chapterNum||"—"}</td><td class="num">${(l.hoursMilli/1000).toLocaleString('es-ES')}</td><td class="num">${eur(l.costCents)}</td>

   </tbody></table></div></div>`;
}
function wireLabourRegister(pid){
  document.querySelectorAll('[data-reassign]').forEach(b=>b.onclick=()=>{
    const l=erp.state.labour.find(x=>x.id===b.dataset.reassign);
    const code=prompt("Proyecto (código) — deja igual para no cambiar",erp.project(l.projectId).code); if(code==null)return;
    const chap=prompt("Capítulo",l.chapterNum||""); if(chap==null)return;
    mutate(()=>{
      const patch={chapterNum:chap||null};
      if(code&&code!==erp.project(l.projectId).code){
        const np=erp.state.projects.find(x=>x.code===code);
        if(!np) throw new Error("Proyecto no encontrado: "+code);
        patch.projectId=np.id;
      }
      erp.correctHours(l.id,patch,"backoffice");
    },"Horas reasignadas");
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>mutate(()=>erp.deleteHours(b.dataset.del,"backoffice"),"Entrada eliminada"));
}

/* ---------- Personal interno (DMT-04, spec §3.4) ----------

   overhead here rather than structure. Tarifas is append-only history

/* ---------- DMC-01 · a partida (S3) ----------
   One drawer for create and edit, because a partida is a short record and
   splitting it would mean two forms to keep in step. The code is editable
   only while creating: budget lines store it, so on an existing partida it
   is shown and not offered. */
function catalogueItemDrawer(id){
  const it=id?erp.state.catalogue.find(x=>x.id===id):null;
  const db=openDrawer(it?`${it.code} · ${it.desc}`:"Nueva partida");
  const chapters=erp.listActive("itemChapters");
  const TYPE=[["material","Material"],["ownLabour","Mano de obra propia"],["subcontract","Subcontrata"],
    ["machinery","Maquinaria"],["professional","Profesional"],["waste","Gestión de residuos"],["other","Otros"]];
  const val=(k,d)=>esc(it?(it[k]??d):d);
  db.innerHTML=`<div class="fgrid">
   ${it?`<div class="field"><label>Código</label><input value="${esc(it.code)}" disabled title="Las líneas de presupuesto guardan el código; no se cambia."></div>`
      :`<div class="field"><label>Código *</label><input id="ci_code" placeholder="ALB-011"></div>`}
   <div class="field"><label>Capítulo</label><select id="ci_chap">
     <option value="">— sin capítulo —</option>
     ${chapters.map(c=>`<option value="${esc(c.code)}"${it&&it.chapter===c.code?" selected":""}>${esc(c.es)}</option>`).join("")}</select></div>
   <div class="field full"><label>Descripción *</label><input id="ci_desc" value="${val("desc","")}"></div>
   <div class="field full"><label>Cómo se le dice al cliente <span style="font-weight:400;color:var(--muted)">(si difiere)</span></label><input id="ci_cw" value="${val("customerWording","")}"></div>
   <div class="field"><label>Unidad</label><select id="ci_unit">${listOptionsUnits(it?it.unit:"ud")}</select></div>
   <div class="field"><label>Tipo</label><select id="ci_type">${TYPE.map(([v,l])=>`<option value="${v}"${it&&it.type===v?" selected":""}>${l}</option>`).join("")}</select></div>
   <div class="field"><label>Marca</label><input id="ci_brand" value="${val("brand","")}"></div>
   <div class="field"><label>Modelo</label><input id="ci_model" value="${val("model","")}"></div>
   <div class="field"><label>Calidad</label><input id="ci_qual" value="${val("quality","")}" placeholder="estándar / alta"></div>
   <div class="field"><label>Coste de referencia (€)</label><input id="ci_cost" type="number" min="0" step="0.01" value="${it?(it.defaultCostCents/100):""}"></div>
   <div class="field"><label>Precio de referencia (€)</label><input id="ci_price" type="number" min="0" step="0.01" value="${it&&it.defaultPriceCents?(it.defaultPriceCents/100):""}"></div>
   <div class="field full" style="font-size:11.5px;color:var(--muted);margin-top:-2px">
     Un precio de referencia en blanco se muestra como «sin precio», nunca como cero — la partida
     entra en el presupuesto marcada como pendiente de valorar.</div>
   <div class="field full" style="margin-top:8px;display:flex;gap:8px;align-items:center">
     <button class="btn primary" id="ci_save">${it?"Guardar cambios":"Crear partida"}</button>
     ${it?'<span style="flex:1"></span><button class="btn" id="ci_off">Retirar del catálogo</button>':""}</div></div>
   ${it?`<div class="card"><div class="ch"><h3>Imágenes</h3><span class="tag">${(it.imageRefs||[]).length} en el anexo gráfico</span></div>
     <div class="daylist"><div class="it">
      ${(it.imageRefs||[]).map(r=>`<img class="catthumb" data-blob="${esc(r)}" alt="" style="margin-right:6px">`).join("")
        ||"Esta partida no tiene imágenes. Las que se añadan salen en el anexo gráfico del presupuesto, nunca dentro de la fila."}
     </div></div></div>`:""}`;
  if(it) paintImages(db);
  $('#ci_save').onclick=()=>mutate(()=>{
    const desc=$('#ci_desc').value.trim(); if(!desc) throw new Error("La descripción es obligatoria");
    const money=el=>{const raw=String($(el).value).trim(); if(!raw) return 0;
      const n=Number(raw.replace(",",".")); return Number.isFinite(n)?Math.round(n*100):0;};
    const patch={desc,customerWording:$('#ci_cw').value.trim(),chapter:$('#ci_chap').value,
      unit:$('#ci_unit').value,type:$('#ci_type').value,
      brand:$('#ci_brand').value.trim(),model:$('#ci_model').value.trim(),quality:$('#ci_qual').value.trim(),
      defaultCostCents:money('#ci_cost'),defaultPriceCents:money('#ci_price')};
    if(it) erp.updateCatalogueItem(it.id,patch,"backoffice");
    else{
      const code=$('#ci_code').value.trim();
      if(!code) throw new Error("El código es obligatorio");
      if(erp.state.catalogue.some(x=>x.code===code)) throw new Error("Ya existe una partida con el código "+code);
      erp.addCatalogueItem(Object.assign({code},patch),"backoffice");
    }
    closeDrawer();
  },it?"Partida actualizada":"Partida creada");

  if(off) off.onclick=()=>mutate(()=>{
    // Deactivate, never delete: a budget written last year references this
    // partida by id, and the line has to keep resolving.

  },"Partida retirada del catálogo");
}
/** Unit picker over the owner-maintained list, keeping a retired unit visible. */
function listOptionsUnits(selected){
  const rows=erp.listActive("units").slice();
  if(selected&&!rows.some(r=>r.code===selected)){
    const gone=erp.listAll("units").find(r=>r.code===selected);
    rows.unshift(gone?Object.assign({},gone,{_retired:true}):{code:selected,es:selected,_retired:true});
  }
  return rows.map(r=>`<option value="${esc(r.code)}"${r.code===selected?" selected":""}>${esc(r.code)} · ${esc(r.es||r.code)}${r._retired?" (retirada)":""}</option>`).join("");
}

/* ---------- DMC-02 · capturing a price (S3) ----------
   Prices are append-only (SUP-05): a new quote from the same supplier is a
   NEW row, never an edit of the old one, because the old one is what a
   budget written last month was priced from. So there is a "new" drawer and
   a read-only detail drawer, and no edit path at all — the absence is the
   feature.

   Net is derived from list × discount the moment either changes, but stays
   overridable: a supplier who quotes a flat net that does not divide evenly
   is common, and forcing the operator to invent a discount percentage that
   reproduces it would put a fiction in the record. */
function newPriceDrawer(itemId){
  const items=erp.state.catalogue.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code)));
  const sups=erp.state.parties.filter(p=>p.active&&p.roles.some(r=>["supplier","subcontractor","selfEmployed"].includes(r)));
  if(!items.length) return toast("⚠ Primero hay que dar de alta alguna partida");
  if(!sups.length) return toast("⚠ Primero hay que dar de alta algún proveedor");
  const db=openDrawer("Nuevo precio");
  const SRC=[["priceList","Tarifa"],["supplierPortal","Portal del proveedor"],["supplierOffer","Oferta"],
    ["valuedDeliveryNote","Albarán valorado"],["purchaseInvoice","Factura de compra"],["manualConfirmation","Confirmación manual"]];
  db.innerHTML=`<div class="fgrid">
   <div class="field full"><label>Partida *</label><select id="pr_item">${items.map(i=>`<option value="${i.id}"${i.id===itemId?" selected":""}>${esc(i.code)} · ${esc(i.desc)}</option>`).join("")}</select></div>
   <div class="field full"><label>Proveedor *</label><select id="pr_sup">${sups.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
   <div class="field"><label>Fecha *</label><input id="pr_date" type="date" value="${erp.today}"></div>
   <div class="field"><label>Código del artículo en el proveedor</label><input id="pr_ref" placeholder="el suyo, no el nuestro"></div>
   <div class="field"><label>Precio de lista (€) *</label><input id="pr_list" type="number" min="0" step="0.01"></div>
   <div class="field"><label>Descuento (%)</label><input id="pr_disc" type="number" min="0" max="100" step="0.1" value="0"></div>
   <div class="field"><label>Precio neto (€)</label><input id="pr_net" type="number" min="0" step="0.01" placeholder="se calcula solo"></div>
   <div class="field"><label>IVA (%)</label><input id="pr_tax" type="number" min="0" max="100" step="0.5" placeholder="sin dato"></div>
   <div class="field"><label>Transporte (€)</label><input id="pr_trans" type="number" min="0" step="0.01" value="0"></div>
   <div class="field"><label>Gestión de residuos (€)</label><input id="pr_waste" type="number" min="0" step="0.01" value="0"></div>
   <div class="field"><label>Pedido mínimo</label><input id="pr_min" type="number" min="0" step="0.01" placeholder="sin mínimo"></div>
   <div class="field"><label>Vigente hasta</label><input id="pr_until" type="date"></div>
   <div class="field"><label>Origen *</label><select id="pr_src">${SRC.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></div>
   <div class="field"><label>Documento de origen</label><input id="pr_doc" placeholder="nº de oferta, albarán o factura"></div>
   <div class="field full"><label>Proyecto para el que se pidió</label><input id="pr_proj" placeholder="código de obra, si el precio es específico"></div>
   <div class="field full"><label>Notas</label><input id="pr_notes"></div>
   <div class="field full" style="font-size:11.5px;color:var(--muted);margin-top:-2px">
     Los precios no se editan: cada cotización nueva se añade como una fila más, porque lo que se
     presupuestó el mes pasado tiene que seguir explicándose con el precio que había entonces.</div>
   <div class="field full" style="margin-top:8px"><button class="btn primary" id="pr_save">Guardar precio</button></div></div>`;
  const money=el=>{const n=Number(String($(el).value).replace(",","."));return Number.isFinite(n)?Math.round(n*100):0;};
  // Net follows list × discount until somebody types a net of their own.
  const recalc=()=>{
    if($('#pr_net').dataset.touched) return;
    const list=money('#pr_list'), disc=+$('#pr_disc').value||0;
    $('#pr_net').value=list?((Math.round(list*(1-disc/100))/100).toFixed(2)):"";
  };
  $('#pr_list').oninput=recalc; $('#pr_disc').oninput=recalc;
  $('#pr_net').oninput=()=>{ $('#pr_net').dataset.touched="1"; };
  $('#pr_save').onclick=()=>mutate(()=>{
    const listCents=money('#pr_list');
    if(listCents<=0) throw new Error("El precio de lista debe ser mayor que cero");
    const taxRaw=$('#pr_tax').value.trim(), minRaw=$('#pr_min').value.trim();
    erp.addPrice({
      itemId:$('#pr_item').value, supplierId:$('#pr_sup').value,
      date:$('#pr_date').value||erp.today,
      listCents, discountPct:+$('#pr_disc').value||0,
      netCents:money('#pr_net')||0,          // 0 lets the engine derive it
      // Empty stays null rather than becoming 0: "nobody recorded the rate"
      // and "the rate is 0%" are different facts about a supplier price.
      taxRateBp:taxRaw===""?null:Math.round(parseFloat(taxRaw)*100),
      supplierRef:$('#pr_ref').value.trim(),
      transportCents:money('#pr_trans'), wasteCents:money('#pr_waste'),
      minOrder:minRaw===""?null:parseFloat(minRaw),
      source:$('#pr_src').value, sourceDocRef:$('#pr_doc').value.trim(),
      projectRef:$('#pr_proj').value.trim(), notes:$('#pr_notes').value.trim(),
      validUntil:$('#pr_until').value||null,
    },"backoffice");
    closeDrawer();
  },"Precio registrado");
}
function priceDrawer(id){
  const p=erp.state.prices.find(x=>x.id===id); if(!p) return;
  const it=erp.state.catalogue.find(i=>i.id===p.itemId);
  const SRC={priceList:"Tarifa",supplierPortal:"Portal del proveedor",supplierOffer:"Oferta",
    valuedDeliveryNote:"Albarán valorado",purchaseInvoice:"Factura de compra",manualConfirmation:"Confirmación manual"};
  const db=openDrawer(`${it?it.code:"Precio"} · ${erp.party(p.supplierId).name}`);
  const expired=p.validUntil&&p.validUntil<erp.today;
  db.innerHTML=`<div class="card"><div class="ch"><h3>El precio</h3>
     <span class="tag">${expired?"caducado":"vigente"}</span></div><div class="daylist">
    <div class="it">Partida: <b>${esc(it?it.code+" · "+it.desc:"—")}</b>${it?` · por ${esc(it.unit)}`:""}</div>

/* ===================== Conciliación bancaria (spec §5.3) ===========================
   Statement on the left, candidate documents on the right, the proposed match
   and its REASONS in between. Every score and every reason comes from
   @repo/capability-reconciliation through the bridge; this block picks a
   movement, draws what came back, and turns a click into an engine call.

   The reasons are drawn deliberately, not decoratively. A person is being
   asked to accept or reject a proposal, and "0,99" gives them nothing to
   judge — "exact amount · reference quoted · same counterparty" gives them
   everything. A confidence with no argument behind it teaches people to click
   accept without reading, which is the failure mode this screen exists to
   avoid. */
let recSel=null;
const REC_REASON={
  exactAmount:"importe exacto", amountWithinTolerance:"importe casi exacto",
  sameDate:"misma fecha", dateWithinTolerance:"fecha próxima",
  referenceQuoted:"referencia citada", counterpartyNamed:"tercero coincidente",
  directionAgrees:"signo correcto",
};
function reconApi(){ return (typeof ErpBridge!=="undefined"&&ErpBridge.reconciliation&&ErpBridge.reconciliation.available)?ErpBridge.reconciliation:null; }

function conciliacion(v){
  $('#sub').textContent="Extracto a la izquierda, documentos candidatos a la derecha y la propuesta de emparejamiento en medio, con el porqué. La cola de movimientos sin conciliar es el indicador de salud del periodo.";
  const R=reconApi();
  const r=periodRange();
  const open=erp.unreconciledMovements(r.from,r.to);
  const allOpen=erp.unreconciledMovements();
  if(recSel&&!erp.state.movements.some(m=>m.id===recSel&&m.status==="unallocated")) recSel=null;
  if(!recSel&&open.length) recSel=open[0].id;
  const sel=recSel?erp.state.movements.find(m=>m.id===recSel):null;
  const suggestions=(R&&sel)?R.suggest(erp,sel.id):[];
  const candidates=sel?erp.reconciliationCandidates(sel.id):[];
  const transfers=R?R.internalTransfers(erp,r.from,r.to):[];
  const closed=sel?erp.bankPeriodClosed(sel.accountingDate):false;
  const threshold=R?R.autoAcceptScore:1;

  v.innerHTML=`${periodNote(open.length,allOpen.length)}
   <div class="card"><div class="queuebar">
     <span class="n">${open.length}</span><span>movimientos sin conciliar en el periodo</span>
     <span style="flex:1"></span>
     ${transfers.length?`<span class="pill b">${transfers.length} traspaso(s) interno(s) detectado(s)</span><button class="btn sm" id="rcTransfers">Marcar como internos</button>`:""}
     <button class="btn sm" id="rcClose" title="Bloquea el periodo; exige cero movimientos sin conciliar">🔒 Cerrar periodo</button>
   </div></div>
   ${!R?'<div class="card"><div class="empty">El emparejamiento asistido necesita el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>':""}
   <div class="rec">
    <div>
     <div class="card"><div class="ch"><h3>Extracto</h3><span class="tag">sin conciliar</span></div>
      ${open.map(m=>`<div class="movrow${m.id===recSel?" on":""}" data-mov="${m.id}">
        <span style="color:var(--muted)">${fmtD(m.accountingDate)}</span>
        <span class="cpt">${esc(m.concept||m.merchantText||"—")}${m.needsDoc?' <span class="pill r">sin respaldo</span>':""}</span>
        <span class="amt ${m.amountCents<0?"neg":"pos"}">${eur(m.amountCents)}</span></div>`).join("")
       ||'<div class="empty">Nada pendiente de conciliar en este periodo.</div>'}
     </div>
     ${sel?`<div class="card"><div class="ch"><h3>Propuestas</h3>
       <span class="tag">${suggestions.length} para ${esc(sel.concept||sel.merchantText||"")}</span></div>
      <div style="padding:11px 14px">
       ${closed?'<div class="it" style="color:var(--danger);margin-bottom:8px">El periodo está cerrado. Reábrelo para conciliar.</div>':""}
       ${suggestions.map(s=>{
         const docs=s.docIds.map(id=>candidates.find(c=>c.id===id)).filter(Boolean);
         const strong=s.confidence>=threshold;
         return `<div class="sugg${strong?" strong":""}">
          <div class="hd"><span class="conf" style="color:${strong?'var(--greenDeep)':'var(--body)'}">${Math.round(s.confidence*100)}%</span>
           <span style="flex:1">${docs.map(d=>`${esc(d.reference)} · ${esc(d.counterparty)} · ${eur(d.outstandingCents)}`).join(" + ")}</span>
           ${closed?"":`<button class="btn sm${strong?" primary":""}" data-accept="${s.docIds.join(",")}">Conciliar</button>`}</div>
          <div class="why">${s.reasons.map(x=>`<b>${REC_REASON[x]||x}</b>`).join(" · ")}${s.differenceCents?` · diferencia ${eur(s.differenceCents)}`:""}${s.combination?" · varios documentos":""}</div>
         </div>`;}).join("")
        ||'<div class="it" style="color:var(--muted)">Ningún documento explica este movimiento. Asígnalo a un proyecto o clasifícalo abajo.</div>'}
      </div>
      ${closed?"":`<div class="gtools" style="border-top:1px solid var(--hair)">
        <input class="inline" id="rcProj" placeholder="Nº de proyecto">
        <select class="inline" id="rcKind"><option value="material">Material</option><option value="labour">Mano de obra</option><option value="subcontract">Industrial</option><option value="other">Otro</option></select>
        <button class="btn sm" id="rcAssign">Asignar a proyecto</button>
        <span style="width:10px"></span>
        <select class="inline" id="rcClass">${["overhead","tax","salary","financial","internalTransfer"].map(c=>`<option value="${c}">${({overhead:"Gasto general",tax:"Impuestos",salary:"Nóminas",financial:"Financiero",internalTransfer:"Traspaso interno"})[c]}</option>`).join("")}</select>
        <button class="btn sm" id="rcClassify">Clasificar</button>
        <span style="flex:1"></span>
        <button class="btn sm" id="rcNoDoc">Marcar sin respaldo</button>
      </div>`}</div>`:""}
    </div>
    <div class="bside">
     <div class="card" style="margin:0 0 12px"><div class="ch"><h3>Candidatos</h3><span class="tag">${candidates.length}</span></div>
      <div class="daylist" style="padding:10px 14px">
       ${candidates.slice(0,12).map(c=>`<div class="it"><span class="pill ${c.direction==="in"?"g":"b"}">${c.kind==="invoice"?"Emitida":"Recibida"}</span>
         <span style="flex:1">${esc(c.reference)} · ${esc(c.counterparty)}</span><b>${eur(c.outstandingCents)}</b></div>`).join("")
        ||'<div class="it">Sin documentos abiertos en este sentido.</div>'}
       ${candidates.length>12?`<div class="it" style="color:var(--muted)">…y ${candidates.length-12} más</div>`:""}
      </div></div>
     <div class="card" style="margin:0"><div class="ch"><h3>Periodos cerrados</h3></div><div class="daylist" style="padding:10px 14px">
      ${(erp.state.bankPeriods||[]).map(p=>`<div class="it">${fmtD(p.from)} – ${fmtD(p.to)} ${p.reopenedAt?`<span class="pill y">reabierto ${fmtD(p.reopenedAt)}</span>`:'<span class="pill g">cerrado</span>'}
        ${p.reopenedAt?`<br><span style="color:var(--muted)">${esc(p.reopenReason)}</span>`:`<button class="btn sm" data-reopen="${p.from}">Reabrir</button>`}</div>`).join("")
       ||'<div class="it">Ningún periodo cerrado todavía.</div>'}
     </div></div>
    </div>
   </div>`;

  v.querySelectorAll('[data-mov]').forEach(row=>row.onclick=()=>{recSel=row.dataset.mov;render();});
  v.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>mutate(()=>{
    const ids=b.dataset.accept.split(",");
    // One movement against several documents is exactly §5.3's partial
    // reconciliation; matchMovement takes one at a time, so a combination is
    // applied document by document against the same movement.
    ids.forEach(id=>{
      const c=candidates.find(x=>x.id===id);
      erp.matchMovement(sel.id, c.kind==="invoice"?{invoiceId:id}:{billId:id}, "backoffice");
    });
    recSel=null;
  },"Movimiento conciliado"));
  const assign=$('#rcAssign');
  if(assign) assign.onclick=()=>mutate(()=>{
    const ref=$('#rcProj').value.trim(); if(!ref) throw new Error("Escribe el número de proyecto");
    erp.allocateMovementToProject(sel.id,ref,$('#rcKind').value,"backoffice"); recSel=null;
  },"Movimiento asignado");
  const classify=$('#rcClassify');
  if(classify) classify.onclick=()=>mutate(()=>{
    erp.classifyMovement(sel.id,$('#rcClass').value,"backoffice"); recSel=null;
  },"Movimiento clasificado");
  const nodoc=$('#rcNoDoc');
  if(nodoc) nodoc.onclick=()=>mutate(()=>erp.flagMovementNoDoc(sel.id,"backoffice"),
    "Marcado sin respaldo — tarea creada para reclamarlo");
  const tr=$('#rcTransfers');
  if(tr) tr.onclick=()=>mutate(()=>{
    transfers.forEach(t=>{
      erp.classifyMovement(t.outMovementId,"internalTransfer","backoffice");
      erp.classifyMovement(t.inMovementId,"internalTransfer","backoffice");
    });
  },transfers.length+" traspaso(s) marcados — no cuentan como ingreso ni gasto");
  $('#rcClose').onclick=()=>mutate(()=>erp.closeBankPeriod(r.from,r.to,"backoffice"),"Periodo cerrado");
  v.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{
    const reason=prompt("Motivo de la reapertura"); if(reason==null)return;
    mutate(()=>erp.reopenBankPeriod(b.dataset.reopen,reason,"backoffice"),"Periodo reabierto");
  });
}

/* ===================== Comunicaciones (spec §5.7) ==================================
   Template library, the rules that fire them, and the queue they fill.

   NOTHING ON THIS SCREEN SENDS ANYTHING. "Aprobar" moves a draft to approved
   and "Registrar envío" marks it sent; the only thing that could put a message
   on a wire is the messaging capability's email-out port, whose sole bound
   adapter records and delivers nothing. The mandate says no real emails, and
   the button labels are honest about which of the two things they do. */
let comSel=null, comTab="plantillas";
const COM_FAMILY={comercial:"Comercial",contractual:"Contractual",obra:"Obra",cobros:"Cobros",proveedores:"Proveedores",posventa:"Posventa"};
const COM_EVENT={"quote-sent":"Presupuesto enviado","invoice-overdue":"Factura vencida",
  "contract-signed":"Contrato firmado","works-finished":"Obra finalizada",
  "subcontractor-docs-expired":"Documentación de subcontrata caducada"};
function commsApi(){ return (typeof ErpBridge!=="undefined"&&ErpBridge.comms&&ErpBridge.comms.available)?ErpBridge.comms:null; }

function comunicaciones(v){
  $('#sub').textContent="Plantillas por familia, reglas evento → plantilla → destinatario → momento, y la cola resultante. Por defecto nada sale sin que una persona lo apruebe.";
  const C=commsApi();
  const tpls=erp.state.commsTemplates.filter(t=>t.active);
  if(comSel&&!tpls.some(t=>t.id===comSel)) comSel=null;
  if(!comSel&&tpls.length) comSel=tpls[0].id;
  const tpl=tpls.find(t=>t.id===comSel)||null;
  const pending=C?C.pending(erp):[];
  const queue=erp.state.commsQueue||[];
  const TABS=[["plantillas","Plantillas"],["reglas","Reglas"],["cola","Cola y historial"]];

  v.innerHTML=`<div class="stepbar">
    ${TABS.map(([k,l])=>`<button class="btn sm${comTab===k?" primary":""}" data-tab="${k}">${l}</button>`).join("")}
    <span style="flex:1"></span>
    ${pending.length?`<span class="pill y">${pending.length} por encolar</span><button class="btn sm" id="cmQueue">Encolar pendientes</button>`:'<span class="tag">nada pendiente de encolar</span>'}
   </div>
   ${!C?'<div class="card"><div class="empty">Las comunicaciones necesitan el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>':""}
   ${comTab==="plantillas"?templatesPanel(tpls,tpl):comTab==="reglas"?rulesPanel():queuePanel(queue,pending)}`;

  v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{comTab=b.dataset.tab;render();});
  const q=$('#cmQueue');
  if(q) q.onclick=()=>mutate(()=>{
    pending.forEach(p=>erp.queueCommunication(p,"backoffice"));
  },pending.length+" mensaje(s) en cola — ninguno se ha enviado");
  if(comTab==="plantillas") wireTemplatesPanel(tpl);
  if(comTab==="reglas") wireRulesPanel();
  if(comTab==="cola") wireQueuePanel();
}
function templatesPanel(tpls,tpl){
  const fams={}; tpls.forEach(t=>{(fams[t.family]=fams[t.family]||[]).push(t);});
  const vars=["cliente","number","importe","fecha"];
  return `<div class="comm">
   <div class="card" style="margin:0"><div class="ch"><h3>Biblioteca</h3><button class="btn sm" id="cmNewTpl">＋</button></div>
    <div class="tpllist">
     ${Object.keys(fams).map(f=>`<div class="fam">${COM_FAMILY[f]||f}</div>
       ${fams[f].map(t=>`<button class="tpl${t.id===(tpl&&tpl.id)?" on":""}" data-tpl="${t.id}">${esc(t.label||t.key)} <span style="color:var(--faint)">v${t.version}</span></button>`).join("")}`).join("")
      ||'<div class="empty">Sin plantillas.</div>'}
    </div></div>
   ${tpl?`<div>
    <div class="card" style="margin:0 0 12px"><div class="ch"><h3>${esc(tpl.label||tpl.key)}</h3>
      <span class="tag">${esc(tpl.key)} · ${tpl.lang} · v${tpl.version}</span></div>
     <div class="fgrid" style="padding:12px 16px">
      <div class="field full"><label>Asunto</label><input id="cm_subject" value="${esc(tpl.subject)}"></div>
      <div class="field full"><label>Cuerpo</label><textarea class="tplbody" id="cm_body">${esc(tpl.body)}</textarea></div>
      <div class="field full"><label>Variables — pulsa para insertar</label>
        <div>${vars.map(x=>`<span class="varchip" data-var="${x}">{{${x}}}</span>`).join("")}</div></div>
      <div class="field"><label>Adjunto automático</label><select id="cm_attach">${[["","Ninguno"],["budget","Presupuesto"],["invoice","Factura"],["contract","Contrato"]].map(([val,l])=>`<option value="${val}"${tpl.attach===val?" selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label>Idioma</label><select id="cm_lang">${["es","ca"].map(l=>`<option value="${l}"${tpl.lang===l?" selected":""}>${l==="es"?"Español":"Català"}</option>`).join("")}</select></div>
      <div class="field full" style="margin-top:6px"><button class="btn primary" id="cm_save">Guardar como nueva versión</button></div>
     </div></div>
    <div class="card" style="margin:0"><div class="ch"><h3>Previsualización</h3><span class="tag">con datos reales del primer registro que encaja</span></div>
     <div style="padding:12px 16px"><div class="preview" id="cm_preview"></div></div></div>
   </div>`:'<div class="card" style="margin:0"><div class="empty">Selecciona o crea una plantilla.</div></div>'}
  </div>`;
}
function wireTemplatesPanel(tpl){
  document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{comSel=b.dataset.tpl;render();});
  $('#cmNewTpl').onclick=()=>newTemplateDrawer();
  if(!tpl) return;
  const refresh=()=>{
    const C=commsApi(); if(!C) return;
    // Previewed against a REAL record (§5.7 "previsualización con datos reales"),
    // because a template that reads well against {{placeholders}} and badly
    // against an actual customer name is the normal failure.
    const ev=erp.commsEvents()[0]||{vars:{}};
    const vars=Object.assign({cliente:"—",number:"—",importe:0,fecha:fmtD(erp.today)},ev.vars||{});
    $('#cm_preview').textContent=C.render($('#cm_subject').value,vars)+"\n\n"+C.render($('#cm_body').value,vars);
  };
  $('#cm_subject').oninput=refresh; $('#cm_body').oninput=refresh; refresh();
  document.querySelectorAll('[data-var]').forEach(c=>c.onclick=()=>{
    const ta=$('#cm_body'); const tok="{{"+c.dataset.var+"}}";
    ta.setRangeText(tok,ta.selectionStart,ta.selectionEnd,"end"); ta.focus(); refresh();
  });
  $('#cm_save').onclick=()=>mutate(()=>{
    const next=erp.updateCommsTemplate(tpl.id,{subject:$('#cm_subject').value,body:$('#cm_body').value,
      attach:$('#cm_attach').value,lang:$('#cm_lang').value},"backoffice");
    comSel=next.id;
  },"Nueva versión guardada — la anterior se conserva");
}
function newTemplateDrawer(){
  const db=openDrawer("Nueva plantilla");

/* The Torre reads the whole chain and writes nothing: the doc says so twice,
   and says no panel opens from it. So this is five rows, ordered by severity
   rather than by age, each opening the record that caused it — and everything
   one actually DOES about an alert (assign, postpone, resolve, turn into a
   task, change the rule) happens in Configuración › Alertas. */
function torreAlerts(alerts){
  const rank={critical:0,high:1,medium:2,low:3};
  const top=[...alerts].sort((a,b)=>(rank[a.sev]??9)-(rank[b.sev]??9)).slice(0,5);
  return `<div class="card" style="margin:0"><div class="ch"><h3>Necesita atención</h3>
    <span class="tag">${alerts.filter(a=>a.sev==="critical").length} críticas · ${alerts.filter(a=>a.sev==="high").length} altas</span>
    <span style="flex:1"></span>

   <div class="almgr">${top.map(a=>`<div class="alrow">
     <div>${a.sev==="critical"?"🔴":a.sev==="high"?"🟡":"🔵"}</div>
     <div><b class="click" data-goref='${esc(JSON.stringify(a.ref))}'>${esc(a.msg)}</b>
      <div class="meta">${a.assignee?`<span>👤 ${esc(a.assignee)}</span>`:""}${a.dueDate?`<span>📅 ${fmtD(a.dueDate)}</span>`:""}</div></div>
    </div>`).join("")||'<div class="empty">Sin alertas. Todo en orden.</div>'}</div></div>`;

/** §2.1 "exportar la vista a PDF/Excel" — a real CSV download; print (Ctrl+P) covers PDF honestly via the browser's own dialog. */
/* ===================== table export: CSV and real .xlsx =====================
   A genuine .xlsx, not a CSV wearing an Excel extension. An .xlsx is a ZIP of
   XML parts, so the ZIP writer below stores (never deflates) the five parts
   Excel needs. Every cell is written as an inline string on purpose: postal
   codes, phone numbers and client codes are text, and letting Excel guess
   turns "08960" into 8960 and eats the leading zero. No dependency — the
   whole writer is ~60 lines and the alternative was shipping a library into
   a page that has to work from a bare static host. */
const CRC_T=(()=>{let c,t=[];for(let n=0;n<256;n++){c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=(a,o,v)=>{a[o]=v&255;a[o+1]=(v>>>8)&255;};
  const u32=(a,o,v)=>{a[o]=v&255;a[o+1]=(v>>>8)&255;a[o+2]=(v>>>16)&255;a[o+3]=(v>>>24)&255;};
  for(const f of files){
    const name=enc.encode(f.path), data=f.bytes, crc=crc32(data);
    const lh=new Uint8Array(30+name.length);
    u32(lh,0,0x04034b50); u16(lh,4,20); u16(lh,6,0); u16(lh,8,0); u16(lh,10,0); u16(lh,12,0);
    u32(lh,14,crc); u32(lh,18,data.length); u32(lh,22,data.length); u16(lh,26,name.length); u16(lh,28,0);
    lh.set(name,30); parts.push(lh,data);
    const ch=new Uint8Array(46+name.length);
    u32(ch,0,0x02014b50); u16(ch,4,20); u16(ch,6,20); u16(ch,8,0); u16(ch,10,0); u16(ch,12,0); u16(ch,14,0);
    u32(ch,16,crc); u32(ch,20,data.length); u32(ch,24,data.length); u16(ch,28,name.length);
    u16(ch,30,0); u16(ch,32,0); u16(ch,34,0); u16(ch,36,0); u32(ch,38,0); u32(ch,42,off);
    ch.set(name,46); central.push(ch); off+=lh.length+data.length;
  }
  let cs=0; central.forEach(c=>cs+=c.length);
  const end=new Uint8Array(22);
  u32(end,0,0x06054b50); u16(end,4,0); u16(end,6,0); u16(end,8,files.length); u16(end,10,files.length);
  u32(end,12,cs); u32(end,16,off); u16(end,20,0);
  return new Blob([...parts,...central,end],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xmlEsc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
const colRef=i=>{let s="",n=i;do{s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)-1;}while(n>=0);return s;};
function xlsxBlob(sheetName,rows){
  const enc=new TextEncoder();
  const sheet=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((c,ci)=>
      `<c r="${colRef(ci)}${ri+1}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`).join("")+`</row>`).join("");
  const f=(path,xml)=>({path,bytes:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+xml)});
  return zipStore([
    f("[Content_Types].xml",'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'),
    f("_rels/.rels",'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'),
    f("xl/workbook.xml",`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(sheetName).slice(0,31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`),
    f("xl/_rels/workbook.xml.rels",'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'),
    f("xl/worksheets/sheet1.xml",`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheet}</sheetData></worksheet>`),
  ]);
}
function downloadBlob(blob,filename){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
/** Excel opens a UTF-8 CSV correctly only with a BOM; without it accents break. */
function downloadCsv(rows,filename){
  const csv=rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  downloadBlob(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}),filename);
}

/* ---- Alerts panel as a manager, not a read-only feed (DAS-06/07) ----
   Grouped by type then by project, because that is how a backoffice person
   actually triages a list: "what kind of problem is this" first, "which job
   does it belong to" second. Every row can be assigned, given a deadline,
   snoozed with a reason, resolved with a note and evidence, or turned into a
   task — the four verbs §2.1 names for "gestor, no aviso". */
const ALERT_TYPE_LABEL={economica:"Económica",tecnica:"Técnica",documental:"Documental",fiscal:"Fiscal"};

  const groups={};
  alerts.forEach(a=>{
    const g=almgrGroupBy==="type"?(ALERT_TYPE_LABEL[a.type]||a.type):(a.project||"Sin proyecto");
    (groups[g]=groups[g]||[]).push(a);
  });
  const keys=Object.keys(groups).sort();
  return `<div class="card" style="margin:0"><div class="ch"><h3>Alertas</h3>
    <span class="tag">${alerts.filter(a=>a.sev==="critical").length} críticas · ${alerts.filter(a=>a.sev==="high").length} altas</span>

   <div class="almgr">${keys.map(g=>`<div class="algroup">${esc(g)}</div>${groups[g].map(a=>alertRowHtml(a)).join("")}`).join("")

}
function alertRowHtml(a){
  const icon=a.sev==="critical"?"🔴":a.sev==="high"?"🟡":"🔵";
  return `<div class="alrow" data-key="${esc(a.key)}">
   <div>${icon}</div>
   <div><b class="click" data-goref='${esc(JSON.stringify(a.ref))}'>${esc(a.msg)}</b>
    <div class="meta">${a.assignee?`<span>👤 ${esc(a.assignee)}</span>`:""}${a.dueDate?`<span>📅 ${fmtD(a.dueDate)}</span>`:""}${a.snoozedUntil?`<span>💤 hasta ${fmtD(a.snoozedUntil)}</span>`:""}</div></div>
   <div class="acts">
    <button class="btn sm" data-assign="${esc(a.key)}">Asignar</button>
    <button class="btn sm" data-due="${esc(a.key)}">Fecha</button>
    <button class="btn sm" data-snooze="${esc(a.key)}">Posponer</button>
    <button class="btn sm" data-resolve="${esc(a.key)}">Resolver</button>

function wireAlertsPanel(){
  document.querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{almgrGroupBy=b.dataset.grp; render();});
  document.querySelectorAll('[data-goref]').forEach(n=>n.onclick=()=>gotoAlert(JSON.parse(n.dataset.goref)));
  $('#aRules')?.addEventListener('click',()=>alertRulesDrawer());
  document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>{
    const who=prompt("¿A quién se asigna esta alerta?"); if(who===null)return;
    mutate(()=>erp.assignAlert(b.dataset.assign,who,"backoffice"),"Alerta asignada");
  });
  document.querySelectorAll('[data-due]').forEach(b=>b.onclick=()=>{
    const d=prompt("Fecha límite (AAAA-MM-DD):",erp.today); if(d===null)return;
    mutate(()=>erp.setAlertDue(b.dataset.due,d,"backoffice"),"Fecha límite guardada");
  });
  document.querySelectorAll('[data-snooze]').forEach(b=>b.onclick=()=>{
    const d=prompt("Posponer hasta (AAAA-MM-DD):"); if(d===null||!d)return;
    const reason=prompt("Motivo (opcional):")||"";
    mutate(()=>erp.snoozeAlert(b.dataset.snooze,d,reason,"backoffice"),"Alerta pospuesta");
  });
  document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>{
    const note=prompt("Nota de resolución (obligatoria):"); if(note===null||!note.trim())return;
    const ev=prompt("Evidencia (descripción; opcional):")||"";
    mutate(()=>erp.resolveAlert(b.dataset.resolve,note,ev.trim()?[ev.trim()]:[],"backoffice"),"Alerta resuelta");
  });
  document.querySelectorAll('[data-totask]').forEach(b=>{ if(b.disabled)return; b.onclick=()=>{
    const row=b.closest('.alrow'); const msg=row.querySelector('[data-goref]').textContent;
    const due=prompt("Vence (AAAA-MM-DD):",erp.today); if(due===null)return;
    mutate(()=>erp.convertAlertToTask(b.dataset.totask,msg,"backoffice",due,"backoffice"),"Convertida en tarea");
  };});
}
/** §2.1 "editor de reglas: condición, umbral, destinatario y canal". */
function alertRulesDrawer(){
  const db=openDrawer("Reglas de alertas");
  const render2=()=>{
    const rules=erp.ensureAlertRules();
    db.innerHTML=`<div class="rulesbox">${rules.map(r=>`<div class="rulesrow">
      <span>${esc(r.label)} <span class="tag">${ALERT_TYPE_LABEL[r.type]||r.type}</span></span>
      <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" data-en="${r.code}" ${r.enabled?"checked":""}> activa</label>
      ${r.thresholdValue!=null?`<input type="number" min="0" data-th="${r.code}" value="${r.thresholdValue}" title="días">`:'<span></span>'}
      <select data-rec="${r.code}"><option value="backoffice"${r.recipient==="backoffice"?" selected":""}>Oficina</option><option value="operations"${r.recipient==="operations"?" selected":""}>Obra</option></select>
      <select data-ch="${r.code}"><option value="app"${r.channel==="app"?" selected":""}>App</option><option value="email"${r.channel==="email"?" selected":""}>Email</option></select>
     </div>`).join("")}</div>`;
    // No render2() after these: the field the user just edited already shows
    // the value they set (native checkbox/select/input state), and rebuilding
    // db.innerHTML from inside that same field's own change/blur handler
    // fought the browser over a node it was mid-way through removing —
    // "node to be removed is no longer a child of this node" — for no benefit,
    // since nothing else on screen depends on the value that just changed.
    db.querySelectorAll('[data-en]').forEach(cb=>cb.onchange=()=>mutate(()=>erp.updateAlertRule(cb.dataset.en,{enabled:cb.checked},"backoffice"),"Regla actualizada"));
    db.querySelectorAll('[data-th]').forEach(inp=>inp.onchange=()=>mutate(()=>erp.updateAlertRule(inp.dataset.th,{thresholdValue:+inp.value||0},"backoffice"),"Umbral actualizado"));
    db.querySelectorAll('[data-rec]').forEach(s=>s.onchange=()=>mutate(()=>erp.updateAlertRule(s.dataset.rec,{recipient:s.value},"backoffice"),"Destinatario actualizado"));
    db.querySelectorAll('[data-ch]').forEach(s=>s.onchange=()=>mutate(()=>erp.updateAlertRule(s.dataset.ch,{channel:s.value},"backoffice"),"Canal actualizado"));
  };
  render2();
}

/* =============================== Shared master-data list primitive (S2) ==============
   Toolbar + table + pagination + export, written once so DMT-01..04 (Clientes,
   Proveedores, Subcontratas, Personal) inherit the same behaviour instead of
   each retyping it (decision 15). Page sizes are 10/25/50 per the doc —
   Clientes shipped with 10/20/50, which this corrects.

   `ids` lets a screen keep pre-existing element ids (Clientes' #cliQ etc. are
   already asserted on by site-e2e); a screen with no history gets fresh
   generic ids. Mobile: every <td> carries data-th, and CSS turns the table
   into two-line-ish cards at the phone breakpoint (verified in full in S14) —
   the same table markup serves both, so there is exactly one row template to
   keep correct. */
const LIST_PAGE_SIZES=[10,25,50];
const listState={};
function getListState(id,defSize){
  if(!listState[id]) listState[id]={q:"",page:1,pageSize:defSize||25};
  return listState[id];
}
async function loadListPageSize(id){ try{ const m=await ErpStore.getMeta("ui.list."+id); return m&&LIST_PAGE_SIZES.includes(m.pageSize)?m.pageSize:null; }catch(e){ return null; } }
function saveListPageSize(id,size){ try{ ErpStore.setMeta("ui.list."+id,{pageSize:size}); }catch(e){} }

/**
 * cfg: { id, ids?, newLabel, onNew, searchPlaceholder, nounSingular, nounPlural,
 *        baseRows, matches(row,q), columns:[{label,get,primary?,html?,sheet?}],
 *        onRowClick(id), exportFile, exportSheetName, emptyText }
 */
/**
 * cfg gains three optional flags for compact, fixed-height blocks like
 * COM-02's programadas/realizadas pair (S4): `fixedSize` pins the page size
 * and hides the "filas por pantalla" selector — the block's height is fixed
 * by the doc, not chosen by the operator; `noExport`/`noNew` drop those
 * toolbar buttons when a block has neither (a read-mostly sub-list still
 * gets its own search and pagination either way).
 */
function renderMasterList(v,cfg){
  const st=getListState(cfg.id,cfg.fixedSize||cfg.defSize);
  if(cfg.fixedSize) st.pageSize=cfg.fixedSize;
  const ids=Object.assign({q:"mlQ",size:"mlSize",prev:"mlPrev",next:"mlNext",newBtn:"mlNew",
    exp:"mlExp",expMenu:"mlExpMenu",expXlsx:"mlExpXlsx",expCsv:"mlExpCsv"},cfg.ids||{});
  const q=st.q.trim().toLowerCase();
  const base=cfg.baseRows;
  const rows=q?base.filter(r=>cfg.matches(r,q)):base;
  const pages=Math.max(1,Math.ceil(rows.length/st.pageSize));
  if(st.page>pages) st.page=pages;
  const start=(st.page-1)*st.pageSize, page=rows.slice(start,start+st.pageSize);
  const cols=cfg.columns;
  const sing=cfg.nounSingular||"registro", plur=cfg.nounPlural||"registros";
  v.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
    ${cfg.noNew?"":`<button class="btn primary sm" id="${ids.newBtn}">${cfg.newLabel||"＋ Nuevo"}</button>`}
    <input id="${ids.q}" placeholder="${esc(cfg.searchPlaceholder||"Buscar…")}" value="${esc(st.q)}"
      style="flex:0 1 280px;min-width:190px;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)">
    ${cfg.noExport?"":`<span style="position:relative">
      <button class="btn sm" id="${ids.exp}">⬇ Exportar</button>
      <span id="${ids.expMenu}" style="display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:160px;
        background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px;flex-direction:column">
        <button class="btn sm" id="${ids.expXlsx}" style="justify-content:flex-start;border:0;background:none">Excel (.xlsx)</button>
        <button class="btn sm" id="${ids.expCsv}" style="justify-content:flex-start;border:0;background:none">CSV (.csv)</button>
      </span></span>`}
    <span class="tag">${rows.length}${q?` de ${base.length}`:""} ${rows.length===1?sing:plur}</span></div>
   <div class="card"><div class="scroll"><table class="mlist"><thead><tr>
     ${cols.map(c=>`<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>
   ${page.map(r=>`<tr class="click" data-id="${r.id}">${cols.map(c=>
      `<td data-th="${esc(c.label)}"${c.primary?' class="k"':""}>${c.html?c.html(r):esc(String((c.get?c.get(r):"")??""))}</td>`).join("")}</tr>`).join("")
    ||`<tr><td colspan="${cols.length}"><div class="empty">${esc(cfg.emptyText||"Ningún registro coincide con la búsqueda.")}</div></td></tr>`}
   </tbody></table></div>
   <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)">
     ${cfg.fixedSize?"":`<label style="font-size:12px;color:var(--dim)">Filas por pantalla
       <select id="${ids.size}" style="font:inherit;font-size:12px;margin-left:6px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)">
         ${LIST_PAGE_SIZES.map(n=>`<option value="${n}"${n===st.pageSize?" selected":""}>${n}</option>`).join("")}
       </select></label>`}
     <span style="flex:1"></span>
     <span style="font-size:12px;color:var(--dim)">${rows.length?`${start+1}–${Math.min(start+st.pageSize,rows.length)} de ${rows.length}`:"0 de 0"} · página ${st.page} de ${pages}</span>
     <button class="btn sm" id="${ids.prev}"${st.page<=1?" disabled":""}>‹ Anterior</button>
     <button class="btn sm" id="${ids.next}"${st.page>=pages?" disabled":""}>Siguiente ›</button>
   </div></div>`;
  v.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>cfg.onRowClick(tr.dataset.id));
  if(!cfg.noNew) $('#'+ids.newBtn).onclick=cfg.onNew;
  const qi=$('#'+ids.q);
  qi.oninput=()=>{ st.q=qi.value; st.page=1; const at=qi.selectionStart; render();
    const n=$('#'+ids.q); if(n){n.focus(); n.setSelectionRange(at,at);} };
  if(!cfg.fixedSize) $('#'+ids.size).onchange=e=>{ st.pageSize=Number(e.target.value)||st.pageSize; st.page=1; saveListPageSize(cfg.id,st.pageSize); render(); };
  $('#'+ids.prev).onclick=()=>{ if(st.page>1){ st.page--; render(); } };
  $('#'+ids.next).onclick=()=>{ if(st.page<pages){ st.page++; render(); } };
  if(cfg.noExport) return;
  const menu=$('#'+ids.expMenu);
  const closeMenu=()=>{ menu.style.display="none"; };
  $('#'+ids.exp).onclick=ev=>{ ev.stopPropagation();
    const open=menu.style.display==="none";
    menu.style.display=open?"flex":"none";
    if(open) document.addEventListener('click',closeMenu,{once:true}); };
  menu.onclick=ev=>ev.stopPropagation();
  const sheet=()=>[cols.map(c=>c.label)].concat(rows.map(r=>cols.map(c=>c.sheet?c.sheet(r):String((c.get?c.get(r):"")??""))));
  const exportFile=cfg.exportFile||cfg.id, exportSheet=cfg.exportSheetName||plur;
  $('#'+ids.expXlsx).onclick=()=>{ closeMenu(); downloadBlob(xlsxBlob(exportSheet,sheet()),`${exportFile}-${erp.today}.xlsx`); toast("Exportado a Excel"); };
  $('#'+ids.expCsv).onclick=()=>{ closeMenu(); downloadCsv(sheet(),`${exportFile}-${erp.today}.csv`); toast("Exportado a CSV"); };
}
let projFavs=[], projRecents=[];
function saveProjPrefs(){ try{ ErpStore.setMeta("ui.projects",{favs:projFavs,recents:projRecents}); }catch(e){} }
function projectOptions(){
  const q=projFilter.trim().toLowerCase();
  return erp.state.projects.filter(p=>{
    if(projStatus==="open"&&p.closed) return false;
    if(projStatus==="closed"&&!p.closed) return false;
    if(projStatus==="fav"&&!projFavs.includes(p.id)) return false;
    if(!q) return true;
    return (p.code+" "+erp.party(p.partyId).name).toLowerCase().includes(q);
  }).sort((a,b)=>{
    // Favourites first, then most recently opened, then by code.
    const fa=projFavs.includes(a.id),fb=projFavs.includes(b.id); if(fa!==fb) return fa?-1:1;
    const ra=projRecents.indexOf(a.id),rb=projRecents.indexOf(b.id);
    if(ra!==rb) return (ra<0?99:ra)-(rb<0?99:rb);
    return a.code<b.code?-1:1;
  });
}
function setProject(id){
  gProject=id; gSel=null;
  projRecents=[id,...projRecents.filter(x=>x!==id)].slice(0,5); saveProjPrefs();
  render();
}

      <div class="f"><span class="l">Estado</span><span class="v"><span class="pill ${(ST[h.status]||["b"])[0]}">${(ST[h.status]||["","—"])[1]}</span></span></div>
      <div class="sep"></div>

      <div class="f"><span class="l">Margen actual</span><span class="v${h.marginCents<0?" neg":""}">${eur0(h.marginCents)} · ${h.marginPct}%</span></div>

    </div></div>`;
  $('#psel').onchange=e=>setProject(e.target.value);
  $('#pst').onchange=e=>{projStatus=e.target.value;render();};
