        /* ---------- Presupuestos (PRE/QUO) ----------
    Two states of one subsection: the register of budgets, and — when one is
    chosen — the three-zone constructor of §3.3. go() rewrites _arg on every
    navigation, so arriving here from the menu, an alert or a search always
    lands on the register, while mutate()'s re-render keeps the constructor
    open on whatever was being edited. */
        quotes(v) {
          bBudget = window._arg || null;
          if (bBudget && !erp.state.budgets.some((b) => b.id === bBudget)) bBudget = null;
          if (bBudget) return budgetBuilder(v, bBudget);
          budgetList(v);
        },

        /* ---------- Seguimiento económico de obra (spec §4.4) ----------
    Presupuestado · comprometido · real · proyectado · desviación · margen, por
    capítulo. The column that matters is "proyectado": "spent 40 of 100" reads
    as comfortable and says nothing, while "spent 40 to get a quarter of the way,
    so heading for 160" is the sentence somebody can act on. It is computed by
    @repo/capability-projects, never here. */
        /* ---------- PRY-02 Avance económico (S8 · PK4-B) ----------
    Same shape as PRY-01 now (PK4-A), for the identical reason the doc gave
    them the same shape in the first place: two adjacent screens that behave
    differently is a tax the operator pays every day. A row opens the job's
    own full-screen surface directly — no panel in between, no project bar
    repeating the KPI cards the panel already carries.

    Three things the panel says that no screen said before: the margin as its
    own card rather than a column somebody has to find; the per-capítulo table
    in the doc's own terms (presupuestado, acumulado, desviación en € y en %,
    margen); and — the point of the whole screen — the money that reached this
    job and stopped, because nobody said which capítulo pays for it. */
        economics(v) {

        /* ---------- COM-04 Contrato (S9) ----------

        contracts(v) {
          $("#sub").textContent =
            "Contratos vigentes e históricos. El importe vigente se marca en ámbar cuando ya no coincide con el original: significa que hay anexos.";

          const all = erp.contractsView();

            cancelled: ["Anulado", "r"],

        /* ---------- PRY-01 Avance físico (S8) ----------

    panel beside it with a fixed 88 header and three tabs. What used to be two
    routes behind a tab strip (Avance · Programación) is one screen.

    exactly four full-screen surfaces, so the Programación tab states the plan
    in figures and opens the chart outside the shell — which is both what the

    drag-and-drop timeline into half a panel. */
        /* PK4-A: two screens, and nothing between them. This route used to be
       list → centre panel → («Abrir la carta Gantt») → chart, and the middle
       step existed to state three figures (tareas, fin de obra previsto, ruta
       crítica) that the chart's own toolbar and its Desviaciones panel

       The project bar goes with it (see renderProjectBar): picking the job IS

        progress(v) {
          $("#sub").textContent =
            "Elige una obra para abrir su carta Gantt: ahí se marca el avance, se mueven las barras y se recalculan los cobros previstos.";

          if (!erp.state.projects.length) return noProjectsCard(v);
          if (arg) {
            const p = erp.state.projects.find((x) => x.code === arg);
            // A deep link names a job, and the job's screen is now the chart —
            // so an alert or a search result lands where the work is. The
            // recency list is updated by hand rather than through setProject,
            // which renders: this runs DURING a render already.
            if (p) {
              ganttFull = true;
              gProject = p.id;
              projRecents = [p.id, ...projRecents.filter((x) => x !== p.id)].slice(0, 5);

          if (ganttFull) return ganttScreen(v);
          renderMasterList(v, {

              expXlsx: "prgExpXlsx",
              expCsv: "prgExpCsv",

            nounSingular: "obra",
            nounPlural: "obras",
            searchPlaceholder: "Buscar por código o cliente…",
            emptyText: "Ninguna obra coincide con la búsqueda.",
            baseRows: erp.state.projects.slice().reverse(),
            matches: (p, q) => (p.code + " " + erp.party(p.partyId).name).toLowerCase().includes(q),
            columns: [
              { label: "Código", primary: true, get: (p) => p.code },
              { label: "Cliente", get: (p) => erp.party(p.partyId).name },
              {
                label: "Línea",

                },

              {
                label: "Estado",
                html: (p) =>
                  p.closed
                    ? '<span class="pill g">Cerrado</span>'
                    : '<span class="pill b">Activo</span>',

            ],
            // `setProject` renders on its own, so the flag is set FIRST or the

            onRowClick: (id) => {

        /* ---------- Seguimiento técnico: la carta Gantt (§3.3 · §4.3) ----------
    No longer a route of its own. §3.1 reserves full screen for exactly four
    surfaces and names the Gantt as one of them, so since S8 this is the body
    of `ganttScreen` — reached from PRY-01's Programación tab, drawn outside
    the shell, and unchanged in every other respect. */
        _ganttBody(v) {
          $("#sub").textContent =
            "Carta Gantt derivada del presupuesto aceptado, avance por partida o por cantidad ejecutada, y desviación frente a la línea base. Arrastra una barra para moverla, tira del borde para alargarla y une dos barras para crear una dependencia.";
          const P = erp.state.projects;
          if (!P.length) {
            v.innerHTML =
              '<div class="card"><div class="empty">Todavía no hay proyectos que planificar.</div></div>';
            return;
          }
          const B = ganttApi();
          if (!B) {
            v.innerHTML =
              '<div class="card"><div class="empty">La planificación necesita el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>';
            return;
          }

          const pid = gProject,
            plan = B.get(erp.state, pid),
            sch = B.schedule(plan);
          /* PK4-A: opening a job now lands here directly, so an UNPLANNED job
       lands here too — and the first row of the list is exactly that. The
       empty state therefore has to distinguish "no plan yet" from "nothing
       to plan from": a job with no accepted presupuesto has no chapters for
       `fromBudget` to derive and no partidas to record progress against, so
       offering «Derivar del presupuesto» there is offering a button that can
       only fail. */
          let derivable = false,
            budgetId = null;
          try {
            const pr = erp.project(pid);
            budgetId = pr.budgetId || null;
            derivable = !!(
              pr.budgetId &&
              erp
                .version(pr.budgetId, pr.acceptedVersionId)
                .chapters.some((c) => c.section === "base" && c.lines.length)
            );
          } catch (e) {}
          const cmp = gBaseline ? B.compareToBaseline(plan) : null;
          const pays = ErpBridge.scheduling.paymentMilestones(erp, pid);
          const cal = plan.calendar || B.defaultCalendar();
          const crit = sch ? sch.criticalPath.length : 0;
          /* Every figure in the deviations panel and both curves come from
     @repo/capability-scheduling. This view draws them and computes none. */
          const curve = B.curve(plan, { asOf: erp.today, weights: planWeights(pid, plan) });
          const risk = B.risk(plan, { asOf: erp.today, thresholdDays: 5 });

          v.innerHTML = `<div class="trk"><div>
   <div class="card"><div class="gtools">
     <button class="btn sm" id="gAdd">＋ Tarea</button>
     <button class="btn sm" id="gAddMs">◆ Hito</button>
     <button class="btn sm${plan.tasks.length || !derivable ? "" : " primary"}" id="gDerive"${derivable ? "" : " disabled"} title="${derivable ? "Vuelve a derivar la planificación de los capítulos y partidas del presupuesto aceptado, conservando el avance registrado" : "Esta obra no tiene un presupuesto aceptado del que derivar la planificación"}">↻ Derivar del presupuesto</button>
     <!-- Package 3 slide 3: moved out of PRY-01's Programación tab. Moving a
          milestone is a thing done TO the plan, and the plan is here. -->
     <button class="btn sm" id="gResched" title="Recalcula las fechas previstas de los hitos de cobro del contrato a partir de la planificación actual">Recalcular los cobros previstos</button>
     <span style="flex:1"></span>
     ${
       sch && plan.tasks.length
         ? `<span class="chip">Fin de obra <b>${fmtD(sch.finish)}</b></span>
     <span class="chip">Ruta crítica <b>${crit}</b> de ${plan.tasks.length}</span>`
         : ""
     }
     ${cmp ? `<span class="chip" title="Desvío frente a la línea base, en días laborables">Línea base «${esc(cmp.label)}» <b style="color:${cmp.finishDriftDays > 0 ? "var(--danger)" : "var(--greenDeep)"}">${cmp.finishDriftDays > 0 ? "+" : ""}${cmp.finishDriftDays} d</b></span>` : ""}
     <select class="inline" id="gZoom">${[
       [14, "Mes"],
       [24, "Semanas"],
       [38, "Días"],
     ]
       .map(([z, l]) => `<option value="${z}"${gZoom === z ? " selected" : ""}>${l}</option>`)
       .join("")}</select>
     ${plan.baselines && plan.baselines.length ? `<button class="btn sm${gBaseline ? " primary" : ""}" id="gBl">Línea base</button>` : ""}
     <button class="btn sm" id="gFreeze" title="Congelar la planificación actual como referencia">❄ Congelar</button>
   </div>
   ${
     plan.tasks.length
       ? ganttChart(plan, sch, cmp, pays)
       : derivable
         ? `<div class="empty">Sin planificación. «Derivar del presupuesto» la construye a partir de los capítulos y partidas aceptados: la duración de cada capítulo sale de sus cantidades y del rendimiento diario del oficio.</div>`
         : `<div class="empty">Esta obra todavía no tiene un presupuesto aceptado, así que no hay capítulos ni partidas que planificar ni sobre los que registrar avance.
       <div style="margin-top:10px"><button class="btn sm primary" id="gGoBudget">${budgetId ? "Abrir el presupuesto" : "Ir a Presupuestos"}</button></div></div>`
   }
   <div class="glegend">
     <span><i style="background:var(--green)"></i>Tarea</span>
     <span><i style="background:var(--danger)"></i>Ruta crítica — un día perdido aquí es un día perdido en la obra</span>
     <span><i style="background:var(--greenDeep);border-radius:2px;transform:rotate(45deg)"></i>Hito</span>
     <span><i style="background:var(--blue)"></i>Hito de cobro del contrato</span>
     ${cmp ? `<span><i style="background:transparent;border:1px dashed var(--faint)"></i>Línea base congelada</span>` : ""}
     <span><i style="background:var(--hair)"></i>Día no laborable</span>
   </div>
   <div class="gtools" style="border-top:1px solid var(--hair)">
     <span style="font:600 11px var(--sans);color:var(--muted)">DÍAS NO LABORABLES</span>
     ${(cal.nonWorkingDates || []).map((d) => `<span class="chip"><b>${fmtD(d)}</b><button data-nw="${d}" title="Quitar">✕</button></span>`).join("") || '<span class="chip">ninguno</span>'}
     <input class="dt" type="date" id="gNw"><button class="btn sm" id="gNwAdd">Añadir</button>
     <span style="font-size:11.5px;color:var(--muted)">Semana laboral: ${cal.workingWeekdays.length} días</span>
   </div></div>

   ${
     curve
       ? `<div class="card"><div class="ch"><h3>Curva S</h3>
     <span class="tag">planificado ${curve.plannedPct}% · real ${curve.actualPct}% · ${curve.driftPct >= 0 ? "+" : ""}${curve.driftPct} pts</span></div>
     ${curveChart(curve)}
     <div class="glegend">
       <span><i style="background:var(--faint)"></i>Planificado</span>
       <span><i style="background:var(--green)"></i>Real registrado</span>
       <span><i style="background:var(--spark)"></i>Proyectado al ritmo observado${curve.performanceIndex != null ? ` (×${curve.performanceIndex})` : ""}</span>
       <span>Fin previsto ${fmtD(curve.plannedFinish)} → proyectado <b>${fmtD(curve.projectedFinish)}</b></span>
     </div></div>`
       : ""
   }

   ${progressControl(pid, plan)}
  </div>

  <div class="bside">
   <div class="card" style="margin:0"><div class="ch"><h3>Desviaciones</h3>
     ${risk && risk.overThreshold ? '<span class="pill r">Supera el umbral</span>' : ""}</div>
    <div class="daylist" style="padding:10px 14px">
     ${
       risk
         ? `<div class="row" style="display:flex;justify-content:space-between"><span>Retraso sobre línea base</span><b style="color:${risk.delayDays > 0 ? "var(--danger)" : "var(--greenDeep)"}">${risk.delayDays > 0 ? "+" : ""}${risk.delayDays} d</b></div>
      <div class="row" style="display:flex;justify-content:space-between"><span>Tareas críticas en riesgo</span><b>${risk.criticalAtRisk}</b></div>
      ${risk.baselineFinish ? `<div class="row" style="display:flex;justify-content:space-between;color:var(--muted)"><span>Prometido</span><b>${fmtD(risk.baselineFinish)}</b></div>` : '<div class="row" style="color:var(--muted)">Sin línea base congelada: no hay promesa contra la que medir.</div>'}`
         : '<div class="row" style="color:var(--muted)">Sin planificación.</div>'
     }
    </div>
    ${
      risk && risk.items.length
        ? `<div style="padding:0 14px 12px">
      ${risk.items
        .slice(0, 12)
        .map(
          (i) => `<div class="riskitem">
        <span class="pill ${i.kind === "overdue" ? "r" : i.kind === "not_started" ? "y" : "b"}">${{ overdue: "Vencida", not_started: "Sin empezar", behind: "Retrasada" }[i.kind]}</span>
        <span class="t">${esc(i.title)}${i.critical ? ' <span class="pill r">crítica</span>' : ""}</span>
        <b>${i.kind === "behind" ? `${i.actualPct}/${i.plannedPct}%` : `${i.days} d`}</b></div>`,
        )
        .join("")}
      ${risk.items.length > 12 ? `<div class="riskitem" style="color:var(--muted)">…y ${risk.items.length - 12} más</div>` : ""}
     </div>`
        : risk
          ? '<div class="daylist" style="padding:0 14px 12px"><div class="it">Nada fuera de plazo.</div></div>'
          : ""
    }
   </div>
  </div></div>`;

          $("#gZoom").onchange = (e) => {
            gZoom = +e.target.value;
            render();
          };
          const bl = $("#gBl");
          if (bl)
            bl.onclick = () => {
              gBaseline = !gBaseline;
              render();
            };
          $("#gAdd").onclick = () => ganttNewTask(pid, false);
          $("#gAddMs").onclick = () => ganttNewTask(pid, true);
          $("#gDerive").onclick = () => deriveFromBudget(pid, cal);
          $("#gResched").onclick = () => rescheduleCashDrawer(pid);
          const goBudget = $("#gGoBudget");
          if (goBudget)
            goBudget.onclick = () => {
              ganttFull = false;
              go("quotes", budgetId || undefined);
            };
          $("#gFreeze").onclick = () => ganttFreeze(pid, plan);
          $("#gNwAdd").onclick = () => {
            const d = $("#gNw").value;
            if (!d) return;
            ganttCommit(
              pid,
              B.setCalendar(plan, {
                ...cal,
                nonWorkingDates: [...new Set([...(cal.nonWorkingDates || []), d])].sort(),
              }),
              "Día no laborable añadido",
            );
          };
          v.querySelectorAll("[data-nw]").forEach(
            (b) =>
              (b.onclick = () => {
                ganttCommit(
                  pid,
                  B.setCalendar(plan, {
                    ...cal,
                    nonWorkingDates: (cal.nonWorkingDates || []).filter((x) => x !== b.dataset.nw),
                  }),
                  "Día no laborable quitado",
                );
              }),
          );
          wireProgressControl(pid, plan);
          ganttWire(v, pid, plan, sch);
        },

        /* ---------- Captura (CAP) · ADM-03, two zones (S7) ----------
    The specification's shape: a 372 column of 96 px cards on the left, the
    register on the right. What decides which side a document is on is not
    its status name but whether it still needs a person — an unallocated
    document is work, an allocated one is history — because that is the only
    question the person opening this screen is actually asking.

    The register keeps the shared list primitive (S2) rather than a hand-built
    table, so it paginates 10/25/50 like the other twenty-eight screens. */
        _docInbox(v) {
          if (capWork) return captureValidate(v);
          $("#sub").textContent =
            "Fotografía o sube una factura, albarán o ticket y asígnalo a un proyecto o a gastos generales. Nada se valida sin confirmación humana.";
          // Newest first. The document somebody has just photographed is the one they
          // are about to file, and a worklist that appends to the bottom asks them to
          // scroll past everything they have already dealt with to reach it.
          const pending = erp.state.captured.filter((c) => !c.allocations.length).reverse();
          v.innerHTML = `<div class="inbox2">
   <div class="inbox">
    <div class="ih"><h3>Bandeja</h3><span style="flex:1"></span><span class="tag" id="capPend">${pending.length}</span></div>
    <div class="inboxl" id="capCards">
     ${
       pending
         .map((c) => {
           const cf = c.confirmed;
           return `<div class="icard" data-cap="${c.id}">
      <div class="thumb" data-blob="${esc(c.imageRef || "")}">📄</div>
      <div style="min-width:0">
       <div class="who">${cf && cf.issuerName ? esc(cf.issuerName) : "Emisor por confirmar"}</div>
       <div class="amt">${cf && cf.totalCents ? eur(cf.totalCents) : "—"}</div>
       <div class="meta"><span>${esc(CAP_TYPE_LABEL[c.docType] || c.docType)}</span> · <span>${fmtD(c.capturedAt)}</span></div>
      </div></div>`;
         })
         .join("") || '<div class="empty">Nada pendiente de asignar.</div>'
     }
    </div>
    <div style="display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)">
     <label class="btn primary sm">＋ Capturar documento<input type="file" id="capFile" accept="image/*,application/pdf" hidden></label>
     <label class="btn sm">Cámara<input type="file" id="capCam" accept="image/*" capture="environment" hidden></label>
     <button class="btn sm" id="capPrep">Preparar para trabajar sin cobertura</button>
    </div>
   </div>

      /* DMC-07 · Alertas — where an alert is actually worked, not just seen.

      /* DMC-08 · Usuarios — who may sign in, and what each may do.

      const USER_ROLES = [
        ["admin", "Administrador", "Todo, incluida esta pantalla."],
        ["backoffice", "Oficina", "Presupuestos, facturas, cobros y pagos. No gestiona usuarios."],

      let uList = [],
        uErr = "";

      async function usersApi(path, opts) {
        const base = ErpStore.apiBase() || "";
        const res = await fetch(
          base + "/api/~/users" + (path || ""),
          Object.assign({ headers: { "content-type": "application/json" } }, opts || {}),
        );
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.message || data.error || "HTTP " + res.status);
        return data;
      }

      async function loadUsers() {
        try {
          uList = (await usersApi("")).users || [];

        render();

      async function captureVisitPhotos(files) {

            continue;

      async function downloadBudgetPdf(id, versionId) {
        const doc = erp.renderBudgetDoc(id, versionId);
        const annex =
          typeof ErpBridge !== "undefined" && ErpBridge.docs
            ? ErpBridge.docs.annex(doc)
            : { enabled: false, pages: [], plateCount: 0, markedItems: [] };
        const marked = new Set(annex.markedItems);
        const perPage = (doc.annex && doc.annex.imagesPerPage) || 2;

            const u = await imageUrl(im.dataset.blob);
            if (u) im.src = u;
            else im.alt = "(imagen no disponible)";
          }),
        );
        window.print();
        sheet.remove();

         : erp.chapterEconomics(id).map((c) => ({
             chapter: c.num,
             budgetCents: c.budgetCostCents,
             actualCents: c.actualCents,
             varianceCents: c.actualCents - c.budgetCostCents,
             varianceBp: 0,
           }))
       )
         .map((c) => {
           const base =
             (p.baseline.chapters || []).find((x) => String(x.num) === String(c.chapter)) || {};
           const mg = (base.saleCents || 0) - (c.actualCents || 0);
           return `<tr><td class="k">${c.chapter}. ${esc(names[c.chapter] || "—")}</td>
        <td class="num">${eur0(c.budgetCents)}</td>
        <td class="num">${eur0(c.actualCents)}</td>
        <td class="num ${c.varianceCents > 0 ? "warn" : ""}">${c.varianceCents > 0 ? "+" : ""}${eur0(c.varianceCents)}</td>
        <td class="num">${((c.varianceBp || 0) / 100).toFixed(1)}%</td>
        <td class="num" style="color:${mg < 0 ? "var(--danger)" : "var(--greenDeep)"}">${eur0(mg)}</td>
        <td>${f ? `<button class="btn sm" data-adj="${c.chapter}">Ajustar</button>` : ""}</td></tr>`;
         })
         .join("") ||
       '<tr><td colspan="7"><div class="empty">Esta obra no tiene capítulos en su línea base.</div></td></tr>'
     }
     </tbody></table></div>
     ${f ? `<div class="daylist"><div class="it" style="color:var(--muted)">La proyección de cada capítulo parte del coste real y del avance registrado. «Ajustar» la sustituye a mano, y la cifra calculada se sigue mostrando junto a la ajustada.</div></div>` : ""}
    </div>

    <div class="card" style="margin-top:12px"><div class="ch"><h3>Pendiente de repartir</h3>
      ${pend.length ? `<span class="pill y">${pend.length}</span>` : '<span class="pill g">nada</span>'}</div>
     ${
       pend.length
         ? `<div class="scroll"><table><thead><tr>
       <th>Origen</th><th>Documento</th><th>Fecha</th><th class="num">Importe</th><th></th></tr></thead><tbody>
      ${pend
        .map(
          (r) => `<tr><td>${esc(SRC[r.source] || r.source)}</td>
        <td class="k">${esc(r.ref || "—")}${r.party ? `<br><span style="font-size:11px;color:var(--muted)">${esc(r.party)}</span>` : ""}</td>
        <td>${r.date ? fmtD(r.date) : "—"}</td>
        <td class="num">${eur(r.amountCents)}</td>
        <td><span class="pill y">Sin repartir</span> <button class="btn sm" data-assign="${esc(r.id)}">Repartir</button></td></tr>`,
        )
        .join("")}
     </tbody></table></div>`
         : '<div class="daylist"><div class="it">Todo el coste de esta obra tiene capítulo. La tabla de arriba cuadra con el proyecto.</div></div>'
     }
    </div>`;

        body.querySelectorAll("[data-assign]").forEach(
          (b) =>
            (b.onclick = () =>
              assignChapterDrawer(
                id,
                pend.find((r) => r.id === b.dataset.assign),
              )),
        );
        // The manual forecast override kept its button. The doc's table does not
        // mention one, but `setForecastOverride` is a real engine rule with a real
        // reason ("the tiler quoted a fixed price, stop extrapolating") and this is
        // its only interface — dropping it would un-cover it, which is the mistake
        // S1b named when the subcontract screens went.
        body
          .querySelectorAll("[data-adj]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                forecastDrawer(
                  id,
                  b.dataset.adj,
                  names[b.dataset.adj] || "",
                  f && f.byChapter.find((c) => String(c.chapter) === String(b.dataset.adj)),
                )),
          );
      }

      /** The full-screen shell for a job's Avance económico — PK4-B's mirror of
    `ganttScreen`. Same wrapper (`.pb`/`.pbbar`), same labelled way back. */
      function economicsScreen(v) {
        document.body.classList.add("fs");
        const p = erp.project(gProject);
        v.innerHTML = `<div class="pb">
    <div class="pbbar">
      <button class="btn sm" id="ecoBack" title="Volver a la lista de obras">← Obras</button>
      <div class="who"><b>${esc(p.code)}</b><span>${esc(erp.party(p.partyId).name)}</span></div>
      <span style="flex:1"></span>

    </div>
    <div id="ecoBody" class="ctrbody" style="flex:1;min-height:0;overflow:auto"></div>
   </div>`;
        $("#ecoBack").onclick = () => {
          ecoFull = false;
          render();
        };
        economicsPanel($("#ecoBody"), gProject);
      }

      /* The 480 panel §3.2 calls "the only place cost is split by capítulo", and it
   is exactly that: no other screen in the product writes `chapterNum` onto a
   cost. Splitting is offered because one supplier invoice routinely covers
   three chapters — refusing to split it is how a chapter ends up carrying a
   bathroom's tiles and a kitchen's. */
      let chapSplit = [];
      function assignChapterDrawer(pid, row) {
        if (!row) return;
        const p = erp.project(pid);
        const chapters = p.baseline.chapters || [];
        const db = openDrawer("Repartir · " + (row.ref || ""));
        const single = row.source === "labour";
        chapSplit = [
          {
            chapterNum: chapters.length ? String(chapters[0].num) : "",
            amountCents: row.amountCents,
          },
        ];
        db.innerHTML = `
   <div class="card"><div class="daylist">
     <div class="it"><span>Origen</span><span style="flex:1"></span><b>${esc(row.ref || "—")}</b></div>
     <div class="it"><span>Fecha</span><span style="flex:1"></span><b>${row.date ? fmtD(row.date) : "—"}</b></div>
     <div class="it"><span>Importe</span><span style="flex:1"></span><b>${eur(row.amountCents)}</b></div>
   </div></div>
   <div class="card"><div class="ch"><h3>Capítulos</h3><span class="tag" id="as_rest"></span></div>
    <div id="as_rows" style="padding:6px 12px 12px"></div>
    <div style="display:flex;gap:8px;padding:0 12px 12px">
      ${single ? "" : '<button class="btn sm" id="as_add">＋ Otro capítulo</button>'}
      <span style="flex:1"></span>
      <button class="btn primary" id="as_go">Repartir</button>
    </div>
    ${single ? '<div class="daylist"><div class="it" style="color:var(--muted)">Un parte de horas va a un solo capítulo: son las horas de una persona en un día, y partirlas aquí sería inventar un segundo parte.</div></div>' : ""}
   </div>`;
        const add = $("#as_add");
        if (add)
          add.onclick = () => {
            chapSplit.push({
              chapterNum: chapters.length ? String(chapters[0].num) : "",
              amountCents: 0,
            });
            chapSplitRows(pid, row, chapters);
          };
        $("#as_go").onclick = () =>
          mutate(() => {
            erp.assignChapterSplit(
              pid,
              row.id,
              chapSplit.map((s) => ({ chapterNum: s.chapterNum, amountCents: s.amountCents })),
              "backoffice",
            );
            closeDrawer();
          }, "Coste repartido por capítulo");
        chapSplitRows(pid, row, chapters);
      }
      function chapSplitRows(pid, row, chapters) {
        const host = $("#as_rows");
        if (!host) return;
        host.innerHTML = chapSplit
          .map(
            (s, i) => `
   <div class="fgrid" style="border-top:${i ? "1px solid var(--hair)" : "0"};padding-top:${i ? "8px" : "0"}">
    <div class="field"><label>Capítulo</label><select data-si="${i}" data-k="chapterNum">
      ${chapters.map((c) => `<option value="${c.num}"${String(c.num) === String(s.chapterNum) ? " selected" : ""}>${c.num}. ${esc(c.name)}</option>`).join("")}
    </select></div>
    <div class="field"><label>Importe (€)</label><input data-si="${i}" data-k="amountCents" type="number" step="0.01" value="${(s.amountCents / 100).toFixed(2)}"></div>
    ${chapSplit.length > 1 ? `<div class="field" style="display:flex;align-items:flex-end"><button class="btn sm danger" data-srm="${i}">Quitar</button></div>` : ""}
   </div>`,
          )
          .join("");
        const rest = $("#as_rest");
        if (rest) {
          const diff =
            Math.abs(row.amountCents) - chapSplit.reduce((a, s) => a + (s.amountCents || 0), 0);
          rest.innerHTML =
            Math.abs(diff) <= 1
              ? "<span>Cuadra con el coste</span>"
              : `<span>Sin repartir</span> <b>${eur(diff)}</b>`;
        }
        host.querySelectorAll("[data-si]").forEach(
          (inp) =>
            (inp.onchange = () => {
              const s = chapSplit[+inp.dataset.si];
              if (inp.dataset.k === "amountCents")
                s.amountCents = Math.round(Number(String(inp.value).replace(",", ".")) * 100) || 0;
              else s.chapterNum = inp.value;
              chapSplitRows(pid, row, chapters);
            }),
        );
        host.querySelectorAll("[data-srm]").forEach(
          (b) =>
            (b.onclick = () => {
              chapSplit.splice(+b.dataset.srm, 1);
              chapSplitRows(pid, row, chapters);
            }),
        );
      }

      /* ================= ADM-06 · Caja chica (S11) ==============================
   "The simplest screen" (§3.2), and the one that most rewards not being
   clever: a till is a bank account whose statement nobody imports, so entries
   are typed and the arqueo at the foot is what proves them.

   The closing figure is COMPUTED from the opening balance and the period's
   movements. A stored closing balance is a number nobody counted. */
      let cashAcc = "",
        bankAcc = "";
      function cajaChica(v) {
        $("#sub").textContent =
          "Entradas y salidas de la caja en efectivo, y el arqueo que las prueba. Una salida sin justificante se cuenta aparte: es el agujero clásico en las cuentas de una empresa pequeña.";
        const tills = erp.state.bankAccounts.filter((a) => a.kind === "till");
        if (!tills.length) {
          v.innerHTML =
            '<div class="card"><div class="empty">No hay ninguna caja en efectivo configurada.</div></div>';
          return;
        }
        if (!cashAcc || !tills.some((t) => t.id === cashAcc)) cashAcc = tills[0].id;
        const r = periodRange();
        const cc = erp.cashCount(cashAcc, r.from, r.to);
        const movs = erp.state.movements
          .filter((m) => m.accountId === cashAcc && inPeriod(m.accountingDate))
          .slice()
          .reverse();

        v.innerHTML = `
   <div class="stepbar">
     ${tills.length > 1 ? `<select class="inline" id="cashSel">${tills.map((t) => `<option value="${t.id}"${t.id === cashAcc ? " selected" : ""}>${esc(t.name)}</option>`).join("")}</select>` : ""}
     <button class="btn primary sm" id="cashIn">＋ Entrada</button>
     <button class="btn sm" id="cashOut">− Salida</button>
   </div>
   <div class="card"><div class="queuebar">
     <span class="n">${eur(cc.closingCents)}</span><span>en caja</span>
     <span style="flex:1"></span>
     ${cc.awaitingDoc ? `<span class="pill r"><span>${cc.awaitingDoc}</span> <span>sin justificante</span></span>` : '<span class="pill g">Todo justificado</span>'}
   </div></div>
   <div class="card"><div class="ch"><h3>Movimientos</h3><span class="tag">${cc.count}</span></div>
    <div class="scroll"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="num">Importe</th><th>Justificante</th><th></th></tr></thead><tbody>
    ${
      movs
        .map(
          (m) => `<tr><td>${fmtD(m.accountingDate)}</td>
      <td class="k">${esc(m.concept || m.merchantText || "—")}</td>
      <td class="num" style="color:${m.amountCents < 0 ? "var(--danger)" : "var(--greenDeep)"}">${eur(m.amountCents)}</td>
      <td>${m.needsDoc ? '<span class="pill r">Falta</span>' : '<span class="pill g">Sí</span>'}</td>
      <td>${m.needsDoc ? `<button class="btn sm" data-cashdoc="${m.id}">Marcar justificado</button>` : ""}</td></tr>`,
        )
        .join("") ||
      '<tr><td colspan="5"><div class="empty">Sin movimientos de caja en el periodo.</div></td></tr>'
    }
    </tbody></table></div>
    <div class="daylist" style="border-top:1px solid var(--line)">
      <div class="it"><span>Saldo inicial</span><span style="flex:1"></span><b>${eur(cc.openingCents)}</b></div>
      <div class="it"><span>Entradas</span><span style="flex:1"></span><b>${eur(cc.inCents)}</b></div>
      <div class="it"><span>Salidas</span><span style="flex:1"></span><b>${eur(-cc.outCents)}</b></div>
      <div class="it"><span>Saldo final</span><span style="flex:1"></span><b id="cashClose">${eur(cc.closingCents)}</b></div>
    </div>
   </div>`;
        const sel = $("#cashSel");
        if (sel)
          sel.onchange = () => {
            cashAcc = sel.value;
            render();
          };
        $("#cashIn").onclick = () => cashDrawer(cashAcc, 1);
        $("#cashOut").onclick = () => cashDrawer(cashAcc, -1);
        v.querySelectorAll("[data-cashdoc]").forEach(
          (b) =>
            (b.onclick = () =>
              mutate(() => {
                const m = erp.state.movements.find((x) => x.id === b.dataset.cashdoc);
                m.needsDoc = false;
              }, "Justificante registrado")),
        );
      }
      function cashDrawer(accountId, sign) {
        const db = openDrawer(sign > 0 ? "Entrada de caja" : "Salida de caja");
        db.innerHTML = `<div class="fgrid">
   <div class="field full"><label>Concepto *</label><input id="ca_c" placeholder="${sign > 0 ? "Reposición de caja" : "Ferretería del barrio"}"></div>
   <div class="field"><label>Importe (€)</label><input id="ca_a" type="number" step="0.01" min="0"></div>
   <div class="field"><label>Fecha</label><input id="ca_d" type="date" value="${erp.today}"></div>
   ${
     sign < 0
       ? `<div class="field full"><label style="display:flex;gap:6px;align-items:center">
     <input type="checkbox" id="ca_doc" checked> <span>Falta el justificante</span></label></div>`
       : ""
   }
   <div class="field full" style="margin-top:6px"><button class="btn primary" id="ca_go">Registrar</button></div>
  </div>`;
        $("#ca_go").onclick = () =>
          mutate(
            () => {
              const amt = Math.round(Number(String($("#ca_a").value).replace(",", ".")) * 100);
              if (!(amt > 0)) throw new Error("Indica el importe");
              const concept = $("#ca_c").value.trim();
              if (!concept) throw new Error("El concepto es obligatorio");
              const doc = $("#ca_doc");
              // BNK-07's own signature: the movement goes in through importMovements,
              // and NOT naming a supporting document is what flags it. There is no
              // second cash method — see the note in erp-engine.js.
              erp.recordCashMovement(
                accountId,
                {
                  accountingDate: $("#ca_d").value || erp.today,
                  concept,
                  amountCents: sign * amt,
                  supportingDocRef:
                    sign < 0 && doc && doc.checked ? null : "registrado-en-pantalla",
                },
                "operations",
              );
              closeDrawer();
            },
            sign > 0 ? "Entrada registrada" : "Salida registrada",
          );
      }

      /* ================= ADM-08 · Flujo de caja (S12) ============================
   The last unbuilt subsección in the menu, and the only screen in the
   document with no list on it at all.

   The forecast has existed in the engine since the beginning and the Torre
   has drawn it as a sparkline for as long. A sparkline answers "is it going
   up or down"; this screen answers the question that actually gets asked,
   which is «¿cuándo nos quedamos sin dinero, y por culpa de qué?» — so every
   figure in the grid is traceable back to a document with a date on it, and
   the cumulative row starts from the money that is really in the accounts
   rather than from zero.

   Company-wide or one job, week buckets or month buckets. Nothing here is
   stored: the whole grid is `cashFlowGrid()`, recomputed on each render, for
   the same reason ADM-01's counters are — a forecast somebody saved is a
   forecast that is wrong by the time it is read. */
      let cfMode = "week",
        cfProject = "",
        cfHorizon = 13;
      function flujoCaja(v) {
        $("#sub").textContent =
          "Previsión de tesorería por semanas o por meses. Cada importe viene de un documento con fecha: una factura pendiente, un hito de contrato, una factura de proveedor. El saldo acumulado se pinta en rojo el periodo en que se vuelve negativo.";
        const HORIZONS = cfMode === "week" ? [8, 13, 26] : [3, 6, 12];
        if (!HORIZONS.includes(cfHorizon)) cfHorizon = HORIZONS[1];
        const g = erp.cashFlowGrid({
          mode: cfMode,
          periods: cfHorizon,
          projectId: cfProject || null,
        });
        const label = (p, i) =>
          cfMode === "week"
            ? i === 0
              ? "Esta semana"
              : fmtD(p.from).slice(0, 5)
            : MONTHS[+p.to.slice(5, 7) - 1].slice(0, 3) + " " + p.to.slice(2, 4);
        // The three figures on the strip: where we are, the worst point the
        // forecast reaches, and when it gets there. "Mínimo" is the useful one —
        // a company does not run out of money at the end of the horizon, it runs
        // out at the trough, and the closing figure hides that entirely.
        let minI = 0;
        g.cumulativeCents.forEach((c, i) => {
          if (c < g.cumulativeCents[minI]) minI = i;
        });
        const minCents = g.cumulativeCents[minI];
        const jobs = erp.state.projects.filter((p) => p.status !== "archived");

        v.innerHTML = `
   <div class="stepbar">
    <select class="inline" id="cfProj"><option value="">Toda la empresa</option>
      ${jobs.map((p) => `<option value="${p.id}"${p.id === cfProject ? " selected" : ""}>${esc(p.code)} · ${esc(p.name)}</option>`).join("")}</select>
    <button class="btn sm${cfMode === "week" ? " primary" : ""}" id="cfWeek">Semanas</button>
    <button class="btn sm${cfMode === "month" ? " primary" : ""}" id="cfMonth">Meses</button>
    <span style="flex:1"></span>
    <label style="font-size:12px;color:var(--muted)">Horizonte</label>
    <select class="inline" id="cfHz">${HORIZONS.map((h) => `<option value="${h}"${h === cfHorizon ? " selected" : ""}>${h} ${cfMode === "week" ? "semanas" : "meses"}</option>`).join("")}</select>
   </div>

   <div class="counters" style="--cw:220px">
    <div class="counter" id="cfNow"><div class="lab">Saldo hoy</div>
      <div class="val">${eur0(g.openingCents)}</div>
      <div class="sub">bancos y caja</div></div>
    <div class="counter${minCents < 0 ? " warn" : ""}" id="cfMin"><div class="lab">Mínimo previsto</div>
      <div class="val">${eur0(minCents)}</div>
      <div class="sub">${label(g.periods[minI], minI)}</div></div>
    <div class="counter${g.cumulativeCents[g.periods.length - 1] < 0 ? " warn" : ""}" id="cfEnd"><div class="lab">Al final del horizonte</div>
      <div class="val">${eur0(g.cumulativeCents[g.periods.length - 1])}</div>
      <div class="sub">${label(g.periods[g.periods.length - 1], g.periods.length - 1)}</div></div>
   </div>

   <div class="card"><div class="ch"><h3>Previsión</h3>
     <span class="tag">${cfProject ? esc(erp.project(cfProject).code) : "toda la empresa"}</span></div>
    <div class="fcast"><table id="cfGrid" data-nocards style="width:${240 + 96 * g.periods.length}px"><thead><tr><th class="lab">Concepto</th>
     ${g.periods.map((p, i) => `<th title="${p.from} → ${p.to}">${label(p, i)}</th>`).join("")}</tr></thead><tbody>
     ${g.groups
       .map(
         (gr) => `
      <tr class="grp"><td class="lab" colspan="${g.periods.length + 1}">${esc(gr.label)}</td></tr>
      ${gr.rows
        .map(
          (r) => `<tr class="sub" data-row="${r.key}"><td class="lab">${esc(r.label)}</td>
        ${r.cells.map((c) => `<td>${c ? eur0(gr.key === "out" ? -c : c) : "—"}</td>`).join("")}</tr>`,
        )
        .join("")}
      <tr class="tot"><td class="lab">Total ${esc(gr.label.toLowerCase())}</td>
        ${gr.totals.map((c) => `<td>${c ? eur0(gr.key === "out" ? -c : c) : "—"}</td>`).join("")}</tr>`,
       )
       .join("")}
     <tr class="tot"><td class="lab">Neto del periodo</td>
       ${g.netCents.map((c) => `<td>${c ? eur0(c) : "—"}</td>`).join("")}</tr>
     <tr class="cum"><td class="lab">Saldo acumulado</td>
       ${g.cumulativeCents.map((c) => `<td class="${c < 0 ? "neg" : ""}">${eur0(c)}</td>`).join("")}</tr>
    </tbody></table></div>
    <div class="daylist" style="border-top:1px solid var(--line)"><div class="it">
      Sólo entra lo que tiene fecha comprometida: facturas pendientes por su vencimiento, hitos de
      contrato por su fecha prevista, facturas de proveedor por su vencimiento. Lo ya vencido se
      acumula en el primer periodo — no desaparece por haber pasado de fecha.
    </div></div>
   </div>`;

        $("#cfProj").onchange = (e) => {
          cfProject = e.target.value;
          render();
        };
        $("#cfWeek").onclick = () => {
          if (cfMode !== "week") {
            cfMode = "week";
            cfHorizon = 13;
            render();
          }
        };
        $("#cfMonth").onclick = () => {
          if (cfMode !== "month") {
            cfMode = "month";
            cfHorizon = 6;
            render();
          }
        };
        $("#cfHz").onchange = (e) => {
          cfHorizon = +e.target.value;
          render();
        };
      }

      /* ================= ADM-01 · Facturación (S10) =============================
   The invoice's own panel, and the collection that settles it.

   «Emitido» is the only counter that does not filter to a subset of the
   register — it IS the register — so pressing it clears the filter like
   pressing an active one, rather than pretending to narrow anything. */
      let invFilter = "";
      function invoiceDrawer(number) {
        const inv = erp.state.invoices.find((i) => i.number === number);
        if (!inv) return;
        const out = erp.invoiceOutstandingCents(inv.id);
        const row = erp.invoiceRegister().find((r) => r.number === number) || { daysOverdue: 0 };
        const p = erp.project(inv.projectId);
        const db = openDrawer(inv.number);
        db.innerHTML = `
   <div class="card"><div class="ch"><h3>${esc(erp.party(inv.partyId).name)}</h3>
     ${
       out <= 0
         ? '<span class="pill g">Cobrada</span>'
         : row.daysOverdue > 0
           ? `<span class="pill r">Vencida</span>`
           : '<span class="pill y">Pendiente</span>'
     }</div>
    <div class="daylist">
     <div class="it"><span>Obra</span><span style="flex:1"></span><b>${esc(p.code)}</b></div>
     <div class="it"><span>Fecha</span><span style="flex:1"></span><b>${fmtD(inv.date)}</b></div>
     <div class="it"><span>Vencimiento</span><span style="flex:1"></span><b>${fmtD(inv.dueDate)}</b></div>
     ${
       row.daysOverdue > 0
         ? `<div class="it"><span>Días de retraso</span><span style="flex:1"></span>
       <b style="color:var(--danger)">${row.daysOverdue}</b></div>`
         : ""
     }
     <div class="it"><span>Base imponible</span><span style="flex:1"></span><b>${eur(inv.baseCents)}</b></div>
     <div class="it"><span>IVA</span><span style="flex:1"></span><b>${inv.vatBp / 100}% · ${eur(inv.vatCents)}</b></div>
     ${inv.irpfCents ? `<div class="it"><span>Retención IRPF</span><span style="flex:1"></span><b>−${eur(inv.irpfCents)}</b></div>` : ""}
     <div class="it"><span>Total</span><span style="flex:1"></span><b>${eur(inv.totalCents)}</b></div>
     <div class="it"><span>Saldo</span><span style="flex:1"></span><b>${out > 0 ? eur(out) : "—"}</b></div>
    </div></div>
   ${
     out > 0
       ? `<div class="card"><div class="ch"><h3>Registrar cobro</h3></div>
    <div class="fgrid" style="padding:10px 12px 12px">
      <div class="field"><label>Importe (€)</label><input id="iv_amt" type="number" step="0.01" value="${(out / 100).toFixed(2)}"></div>
      <div class="field"><label>Forma</label><select id="iv_m">
        <option value="transfer">Transferencia</option><option value="cash">Efectivo</option></select></div>
      <div class="field full"><button class="btn primary" id="iv_go">Registrar cobro</button></div>
    </div>
    <div class="daylist"><div class="it" style="color:var(--muted)">Un cobro parcial deja el resto pendiente y el contador de vencido lo sigue contando.</div></div>
   </div>`

   }`;
        const go = $("#iv_go");
        if (go)
          go.onclick = () =>
            mutate(() => {
              const amt = Math.round(Number(String($("#iv_amt").value).replace(",", ".")) * 100);
              if (!(amt > 0)) throw new Error("Indica el importe cobrado");
              erp.recordCollection(
                {
                  partyId: inv.partyId,
                  amountCents: amt,
                  method: $("#iv_m").value,
                  allocations: [{ invoiceId: inv.id, amountCents: amt }],

      /* ================= COM-04 · the contract, full screen (S9) ================
   The last of §3.1's four out-of-shell surfaces. The document capped near
   760 on the left, and the panel on the right — Datos · Hitos de pago ·
   Anexos — taking whatever room is left (Package 2, PK2-C).

   The document is rendered FROM DATA, like the presupuesto in COM-03 and for
   the same reason: CON-03 made the terms structured on purpose, so requiring
   somebody to attach a scan of what the database already knows would be
   asking for the same contract twice. A signed scan is a captured document
   and belongs beside this, not instead of it.

   It carries `translate="no"`: the contract's language is a field on the
   record, chosen for the customer, not a preference of whoever is reading it.
   Same rule S5 established for the customer's presupuesto. */
      let conWork = null; // {id, tab}
      let conTab = "active";

        onSignature: "A la firma",

      const CON_GUARANTEE = {

      /**
       * The signed file, for a contract this system did not draw up.
       *
       * Uses the same pdf.js loader and the same honest fallback the evidence
       * viewer uses: where the page cannot be drawn, the real file is offered
       * to the browser's own reader rather than a dead end.
       */
      async function externalContractPane(host, d) {
        const doc = d.document;
        if (!doc || !doc.storageKey) {
          host.innerHTML = `<div class="cdoc"><h1>${esc(d.number)}</h1>
     <div class="meta">Contrato firmado fuera de este sistema.</div>
     <div class="empty">No se ha adjuntado el contrato firmado. Los datos están en el panel de al lado.</div></div>`;
          return;
        }
        const head = `<h1>${esc(d.number)}</h1>
    <div class="meta">Contrato firmado fuera de este sistema${d.externalRef ? " · " + esc(d.externalRef) : ""}</div>`;
        host.innerHTML = `<div class="cdoc">${head}<div class="empty">Abriendo el documento…</div></div>`;
        const blob = await ErpStore.getBlob(doc.storageKey).catch(() => null);
        if (!blob) {
          host.innerHTML = `<div class="cdoc">${head}
      <div class="empty">El archivo no está en este dispositivo.</div></div>`;
          return;
        }
        const url = URL.createObjectURL(blob);
        const foot = `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
     <a class="btn sm" href="${url}" download="${esc(doc.name || "contrato.pdf")}">⤓ Descargar</a>
     <a class="btn sm" href="${url}" target="_blank" rel="noopener">Abrir en una pestaña</a></div>`;
        if (!/pdf/i.test(doc.type || "")) {
          host.innerHTML = `<div class="cdoc">${head}
      <img src="${url}" alt="" style="max-width:100%;border-radius:6px">${foot}</div>`;
          return;
        }
        try {
          const r = await renderPdfPage(doc.storageKey, 1);
          host.innerHTML = `<div class="cdoc">${head}<div id="conPdf"></div>
      ${r.pages > 1 ? `<div style="margin-top:6px;color:var(--muted);font-size:12px">Página 1 de ${r.pages} — ábrelo para verlo entero.</div>` : ""}
      ${foot}</div>`;
          r.canvas.style.maxWidth = "100%";
          $("#conPdf").appendChild(r.canvas);
        } catch (e) {
          host.innerHTML = `<div class="cdoc">${head}
      <div class="empty">No se ha podido dibujar el documento aquí.</div>${foot}</div>`;
        }
      }

                days: "días",
                start: "Inicio comprometido",

   <div class="pair"><span>${esc(d.customer.address || "")}</span><span></span></div>
   <div class="pair"><span>${esc(L.work)}</span><span>${esc(d.projectCode || L.none)}</span></div>
   <div class="pair"><span>${esc(L.budget)}</span><span>${esc(d.budgetNumber || L.none)}</span></div>

   <h2>${esc(L.terms)}</h2>
   <div class="pair"><span>${esc(L.base)}</span><span>${eur(d.originalCents)}</span></div>

      <div class="it"><span>Cliente</span><span style="flex:1"></span><b>${esc(d.customer.name)}</b></div>

      <div class="it"><span>Importe vigente</span><span style="flex:1"></span><b>${eur(d.currentCents)}</b></div>
      <div class="it"><span>Plazo</span><span style="flex:1"></span><b>${d.duration.estimatedDays || "—"}</b></div>
      <div class="it"><span>Firma</span><span style="flex:1"></span>
        ${d.signature.customerSignedAt ? `<b>${fmtD(d.signature.customerSignedAt)}</b>` : '<span class="pill r">Sin firmar</span>'}</div>
     </div>`;
          return;
        }
        if (conWork.tab === "anexos") {
          // Package 2 slide 8: a number, a date and an amount proved an anexo
          // EXISTS but said nothing about what it was or let anyone reopen
          // its backup — the change record behind each one already carries

          // place to store the same facts.
          host.innerHTML = `<div class="daylist" style="gap:10px">
      ${
        d.annexes
          .map((a) => {
            const chg = erp.state.changes.find((x) => x.id === a.changeId);
            return `<div class="card" style="margin:0"><div class="ch"><h3>${esc(a.number)}</h3><b>${eur(a.valueCents)}</b></div>
      <div class="daylist">
       <div class="it"><span>Fecha</span><span style="flex:1"></span><b>${fmtD(a.date)}</b></div>
       ${chg ? `<div class="it"><span>Motivo</span><span style="flex:1"></span><b>${esc(chg.desc)}</b></div>` : ""}
       ${chg && chg.reason ? `<div class="it" style="color:var(--muted)">${esc(chg.reason)}</div>` : ""}
       ${
         chg && chg.photoRef
           ? `<div class="it"><span>Foto de origen</span><span style="flex:1"></span>

        <b data-evidence="${esc(JSON.stringify(chg.evidence))}">${esc(chg.evidence.name || "Ver el documento")}</b></div>`

             ? `<div class="it" style="color:var(--muted)"><span>Justificante</span><span style="flex:1"></span><b>${esc(chg.evidenceRef)}</b></div>`
             : `<div class="it" style="color:var(--muted)"><span>Justificante</span><span style="flex:1"></span><b>sin adjuntar</b></div>`
       }
      </div></div>`;
          })
          .join("") ||
        '<div class="card" style="margin:0"><div class="daylist"><div class="it">Sin anexos. El importe vigente es el original.</div></div></div>'

      ${d.annexes.length ? `<div class="it"><span>Total anexos</span><span style="flex:1"></span><b>${eur(val.annexCents)}</b></div>` : ""}

        const sum = d.installments.reduce((s, i) => s + i.amountCents, 0);

   ${
     d.installments

     <td class="k">${esc(CON_TRIGGER[i.trigger] || i.trigger)}${i.pct != null ? ` <span style="color:var(--muted)">${i.pct}%</span>` : ""}</td>

     <td colspan="2">${

         : `<span class="pill r">${diff > 0 ? "+" : ""}${eur(diff)} sobre el contratado</span>`
     }</td></tr>
   </tbody></table></div>
   <div class="daylist" style="margin-top:10px"><div class="it" style="color:var(--muted)">Una fecha marcada «de la planificación» la movió el calendario de obra, no una persona. Una fecha fija y un hito ya facturado nunca se mueven solos.</div></div>`;
      }

      /** The Gantt, outside the shell — the fourth of §3.1's full-screen surfaces. */

      /* ---------- Money chain, item 14 (S8) ----------
   The doc asks whether moving a payment milestone's date moves the expected
   cash. It did not: `cashForecast` has always read `installment.expectedDate`
   and nothing has ever written it after the contract was drawn up, so a job
   whose plan slipped three weeks kept forecasting the same money in the same
   week — wrong in the optimistic direction, with nothing on screen admitting
   it.

   It is a button rather than an automatic write, because a cash forecast that
   changes on its own while somebody is reading it is a forecast they stop
   trusting. The panel states every move before it happens. */
      function rescheduleCashDrawer(pid) {
        const p = erp.project(pid);
        const db = openDrawer("Cobros previstos · " + p.code);
        const c = p.contractId ? erp.state.contracts.find((x) => x.id === p.contractId) : null;
        if (!c) {
          db.innerHTML =
            '<div class="card"><div class="empty">Esta obra no tiene contrato, así que no hay hitos de cobro que recalcular.</div></div>';
          return;
        }
        const props =
          typeof ErpBridge !== "undefined" && ErpBridge.scheduling
            ? ErpBridge.scheduling.installmentDatesFromPlan(erp, pid)
            : {};
        const TRIG = {
          onSignature: "A la firma",
          atWorksStart: "Al inicio de obra",
          atStage: "Al llegar a una fase",
          onCompletion: "A la finalización",
          fixedDate: "Fecha fija",
        };
        const rows = c.installments.map((i, idx) => {
          const to = props[idx] || null;
          const blocked =
            i.status !== "planned" ? "facturado" : i.trigger === "fixedDate" ? "fecha fija" : null;
          const moves = !!to && !blocked && to !== i.expectedDate;
          return { idx, i, to, blocked, moves };
        });
        const moving = rows.filter((r) => r.moves);
        db.innerHTML = `
   <div class="card"><div class="ch"><h3>Lo que dice la planificación</h3>
     <span class="tag"><b>${moving.length}</b> <span>${moving.length === 1 ? "hito se mueve" : "hitos se mueven"}</span></span></div>
    <div class="scroll"><table><thead><tr><th>Hito</th><th>Disparador</th><th class="num">Importe</th><th>Prevista</th><th>Pasaría a</th></tr></thead><tbody>
    ${rows
      .map(
        (r) => `<tr><td class="k">${r.idx + 1}</td>
      <td>${esc(TRIG[r.i.trigger] || r.i.trigger)}</td>
      <td class="num">${eur(r.i.amountCents)}</td>
      <td>${r.i.expectedDate ? fmtD(r.i.expectedDate) : "—"}</td>
      <td>${r.moves ? `<b>${fmtD(r.to)}</b>` : r.blocked ? `<span class="pill">${esc(r.blocked)}</span>` : '<span class="pill">sin cambio</span>'}</td></tr>`,
      )
      .join("")}
    </tbody></table></div></div>
   <div class="card"><div class="daylist"><div class="it" style="color:var(--muted)">Un hito ya facturado no se mueve, y una fecha fija tampoco: es lo que el cliente firmó. El resto sigue a la planificación, y la previsión de caja lo nota en cuanto se guarda.</div></div></div>
   <div style="display:flex;gap:8px;margin-top:10px">
     <button class="btn primary" id="rs_go"${moving.length ? "" : " disabled"}>Aplicar a la previsión</button>
   </div>`;
        const go = $("#rs_go");
        if (go)
          go.onclick = () =>
            mutate(() => {
              const r = erp.setInstallmentDates(c.id, props, "backoffice", "schedule");
              if (!r.moved.length) throw new Error("No hay ningún hito que mover");
              closeDrawer();
            }, "Cobros previstos actualizados");
      }

      /* `projectDrawer` retired in S8. Its economics went to PRY-02's panel, its
   per-chapter progress buttons became the three-state control on PRY-01, and
   its Ficha content is that panel's third tab. Approving an extra, the one
   action it carried that nothing else did on this screen, has always also
   lived on Modificaciones, which is where the e2e drives it. */
      /* =============================== data actions (profile menu) =============================== */
      function exportData() {
        const blob = new Blob(
          [
            JSON.stringify(
              { _meta: { app: "Canei ERP", exportedAt: erp.today }, data: erp.toJSON() },
              null,
              1,
            ),
          ],
          { type: "application/json" },
        );
        const a = el("a");
        a.href = URL.createObjectURL(blob);
        a.download = "canei-erp.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1500);
        toast("Datos exportados");
      }
      /* The ONLY way the demo dataset is reloaded. Deliberately explicit and
   confirmed: boot() never reseeds over stored data by itself (see the schema
   guard there), so a device that already holds records keeps them until a
   person asks for this. That is also why a richer seed does not appear on its
   own after an update — you have to press this. */
      async function resetData() {
        // On the server this is not "reload the demo on this device" — the document
        // is the company's, so it would replace the real register, for everyone, from
        // one click behind one confirm box. The wording of that box ("en este
        // dispositivo") would also be a lie. Refused outright rather than confirmed
        // harder: there is no version of this that is safe against live data.
        if (ErpStore.isRemote()) {
          await say(
            "Datos reales en el servidor",
            "Estos son los datos reales de la empresa. No se pueden sustituir por datos de demostración desde aquí.",
          );
          return;
        }
        if (
          !(await askConfirm("¿Recargar los datos de demostración?", {
            body: "Se sustituye TODO lo que haya ahora en este dispositivo por el conjunto de ejemplo: dos años de actividad (2024-2025) más la situación actual de 2026.",
            okLabel: "Recargar",
            danger: true,
          }))
        )
          return;
        erp = ErpSeed.build();
        seedPlans();
        persist();
        render();
        toast("Datos de demostración recargados — 2024 a 2026");
      }
      /* A retired hash has to be normalised even when it resolves to the screen
   already on show, and even when its target is a page this shell does not own.
   Guarding on `k!==cur` did neither: arriving at #banco while already on
   banking left the dead hash in the address bar to be copied and shared, and
   #finanzas sat there rendering the wrong screen. */
      window.addEventListener("hashchange", () => {
        const raw = location.hash.slice(1),
          k = resolveRoute(raw);
        if (!k || !SUBMAP[k]) return;
        if (SUBMAP[k].href) {
          location.href = SUBMAP[k].href;
          return;
        }
        if (raw !== k) {
          location.hash = k;
          return;
        } // re-enters through this handler
        if (k !== cur) {
          cur = k;
          render();
        }
      });
      boot();
    </script>
  </body>
</html>
