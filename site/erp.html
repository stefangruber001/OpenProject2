  db.innerHTML=`<div class="fgrid">
   <div class="field full"><label>Tarea *</label><input id="t_title" placeholder="Llamar al cliente con la valoración"></div>
   <div class="field"><label>Responsable</label><select id="t_owner"><option value="backoffice">Oficina</option><option value="operations">Obra</option></select></div>
   <div class="field"><label>Vence</label><input id="t_due" type="date" value="${erp.today}"></div>
   <div class="field full" style="margin-top:8px"><button class="btn primary" id="t_save">Crear tarea</button></div></div>`;
  $('#t_save').onclick=()=>mutate(()=>{
    const title=$('#t_title').value.trim();
    if(!title) throw new Error("La tarea necesita un título");
    erp.addTask({title,owner:$('#t_owner').value,due:$('#t_due').value||erp.today},"backoffice");
    closeDrawer(); go("hoy");
  },"Tarea creada");
}
function budgetDrawer(id,versionId){
  const b=erp.budget(id); const vsel=versionId||b.acceptedVersionId||b.currentVersionId; const V=erp.version(id,vsel);
  const t=erp.budgetTotals(id,vsel); const doc=erp.renderBudgetDoc(id,vsel);
  /* The annex is laid out by @repo/capability-docs through the bridge: which
     picture goes on which page, in what order, under what reference. This view
     decides none of it — it only paints what came back, and asks the same
     object which rows carry the discreet mark. */
  const annex=(typeof ErpBridge!=="undefined"&&ErpBridge.docs)
    ? ErpBridge.docs.annex(doc) : {enabled:false,pages:[],plateCount:0,markedItems:[]};
  const marked=new Set(annex.markedItems);
  const perPage=(doc.annex&&doc.annex.imagesPerPage)||2;
  const db=openDrawer(b.number+" · v"+V.vNumber+(b.acceptedVersionId?" (aceptada)":""));
  const SEC={base:"",optional:" (opcional — aparte)",outOfScope:" (fuera de presupuesto)",extras:" (extras)"};
  db.innerHTML=`
   <div class="card"><div class="ch"><h3>Versiones</h3><span class="tag">automáticas, emitidas = congeladas</span></div><div class="daylist">
    ${b.versions.map(x=>`<div class="it"><b>v${x.vNumber}</b> ${fmtD(x.date)} · ${esc(x.reason||"—")} ${x.id===b.acceptedVersionId?'<span class="pill g">Aceptada</span>':x.issued?'<span class="pill b">Emitida</span>':'<span class="pill y">Borrador</span>'}${x.sent?` · enviada por ${x.sent.channel}`:""}</div>`).join("")}
    ${b.versions.length>1?(()=>{const d=erp.diffVersions(id,b.versions[0].id,b.versions[b.versions.length-1].id);return `<div class="it">Δ v${b.versions[0].vNumber}→v${b.versions[b.versions.length-1].vNumber}: <b>${eur(d.deltaCents)}</b> (${d.deltaPct}%) · ${d.changed.length} líneas modificadas</div>`;})():""}
   </div></div>
   <div class="doc">
    <div class="dh"><div><b>PRESUPUESTO ${doc.number} · v${doc.version}</b><br>${esc(doc.issuer.legalName)} · ${esc(doc.issuer.taxId)}<br>${esc(doc.issuer.address)}</div>
    <div style="text-align:right">${esc(doc.customer.name)}<br>${esc(doc.customer.taxId)}<br>${esc(doc.customer.address)}</div></div>
    ${doc.chapters.map(c=>`<div style="margin-bottom:8px"><b style="color:var(--greenDeep)">${c.num}. ${esc(c.name)}${SEC[c.section]||""}</b>
      ${c.lines.map(l=>`<div class="chapline"><span>${l.num} ${esc(l.desc)} — ${l.qty} ${l.unit} × ${eur(l.priceCents)}${marked.has(l.num)?'<span class="amark" title="Ver anexo gráfico">A</span>':""}</span><b>${eur(l.totalCents)}</b></div>`).join("")}</div>`).join("")}
    <div style="border-top:2px solid var(--green);padding-top:8px;margin-top:8px">
      <div class="chapline"><span>Base imponible</span><b>${eur(doc.totals.taxableCents)}</b></div>
      ${doc.totals.optionsCents?`<div class="chapline"><span>Opcionales (aparte)</span><span>${eur(doc.totals.optionsCents)}</span></div>`:""}
      <div class="chapline"><span>IVA ${doc.totals.vatBp/100}%</span><span>${eur(doc.totals.vatCents)}</span></div>
      <div class="chapline" style="font-size:14px"><b>TOTAL</b><b>${eur(doc.totals.grandCents)}</b></div>
      ${doc.totals.perM2Cents?`<div class="chapline"><span>Total por m²</span><span>${eur(doc.totals.perM2Cents)}/m²</span></div>`:""}
      ${t.pendingCount?`<div class="chapline"><span>⚠ Líneas pendientes de precio (no incluidas)</span><span>${t.pendingCount} · ~${eur(t.pendingEstCents)}</span></div>`:""}
    </div>
    ${annex.pages.map(pg=>`<div class="annexpg" data-annexpage="${pg.number}">
      <div class="ah">Anexo gráfico · página ${pg.number} de ${annex.pages.length}</div>
      <div class="plates" style="grid-template-columns:repeat(${Math.min(perPage,2)},minmax(0,1fr))">
       ${pg.plates.map(p=>`<figure class="plate"><img data-blob="${esc(p.ref)}" alt="${esc(p.itemLabel)}">
         <figcaption><b>${p.groupNum}. ${esc(p.groupName)} · partida ${p.itemNum}</b><br>${esc(p.itemLabel)}${p.sequence?` (${p.sequence} de ${p.siblings})`:""}${p.caption?`<br>${esc(p.caption)}`:""}</figcaption>
        </figure>`).join("")}
      </div></div>`).join("")}
    <div style="margin-top:8px;color:var(--muted)">Validez: ${fmtD(b.validityDate)} · ${esc(b.paymentConditions)} · IBAN ${esc(doc.issuer.iban)}</div>
   </div>
   <div class="card" style="margin-top:12px"><div class="ch"><h3>Margen interno</h3><span class="tag">nunca aparece en el documento del cliente</span></div><div class="daylist">
    <div class="it">Coste interno base: <b>${eur(t.costBaseCents)}</b> · Margen: <b>${eur(t.marginBaseCents)} (${t.marginBasePct}%)</b></div>
    ${t.chapters.filter(c=>c.section==="base").map(c=>`<div class="it">${c.num} ${esc(c.name)}: venta ${eur(c.saleCents)} · coste ${eur(c.costCents)} · <b style="color:${c.marginCents<0?'var(--danger)':'inherit'}">${eur(c.marginCents)}</b></div>`).join("")}
   </div></div>
   ${annex.plateCount?`<div class="card"><div class="ch"><h3>Anexo gráfico</h3><span class="tag">${annex.plateCount} imágenes · ${annex.pages.length} páginas</span></div>
    <div class="daylist"><div class="it">Se imprime después de los totales y antes de las condiciones. Al emitir la versión, el anexo queda congelado con ella.</div></div></div>`
    :(doc.annex&&doc.annex.enabled?"":`<div class="card"><div class="daylist"><div class="it">El anexo gráfico está desactivado para este presupuesto.</div></div></div>`)}`;
  paintImages(db);
}
/** Adjust one chapter's projection. The reason is required, by the engine. */
function forecastDrawer(pid,chapterNum,name,row){
  const db=openDrawer(`Proyección · ${chapterNum}. ${name}`);
  const stored=(erp.project(pid).forecastOverrides||{})[chapterNum];
  db.innerHTML=`<div class="card"><div class="ch"><h3>Coste a fin de obra</h3><span class="tag">§4.4</span></div>
   <div class="daylist">
    <div class="it">Presupuestado <b>${eur(row.budgetCents)}</b> · real <b>${eur(row.actualCents)}</b> · avance <b>${row.progressPct}%</b></div>
    <div class="it">Proyección calculada <b>${eur(row.calculatedCents)}</b>${row.provisional?' <span class="pill y">provisional — muy poco avance para extrapolar</span>':""}</div>
    ${stored?`<div class="it">Ajuste vigente <b>${eur(stored.costCents)}</b> · ${esc(stored.reason)} <span style="color:var(--muted)">(${esc(stored.by)}, ${fmtD(stored.at)})</span></div>`:""}
   </div></div>
   <div class="card"><div class="ch"><h3>Ajustar</h3></div><div class="fgrid" style="padding:12px 16px">
    <div class="field"><label>Coste a fin de obra (€)</label><input id="fc_amt" type="number" step="0.01" value="${((stored?stored.costCents:row.calculatedCents)/100).toFixed(2)}"></div>
    <div class="field full"><label>Motivo * — se guarda con el ajuste y es lo único revisable después</label>
      <input id="fc_why" placeholder="La parte cara ya está ejecutada" value="${esc(stored?stored.reason:"")}"></div>
    <div class="field full" style="margin-top:6px;display:flex;gap:8px">
      <button class="btn primary" id="fc_save">Guardar ajuste</button>
      ${stored?'<button class="btn danger" id="fc_clear">Volver a la calculada</button>':""}</div>
   </div></div>`;
  $('#fc_save').onclick=()=>mutate(()=>{
    erp.setForecastOverride(pid,chapterNum,{costCents:Math.round(+$('#fc_amt').value*100),reason:$('#fc_why').value},"backoffice");
    closeDrawer();
  },"Proyección ajustada");
  const cl=$('#fc_clear');
  if(cl) cl.onclick=()=>mutate(()=>{erp.clearForecastOverride(pid,chapterNum,"backoffice");closeDrawer();},"Ajuste retirado");
}

function projectDrawer(id){
  const p=erp.project(id); const e=erp.projectEconomics(id); const bill=erp.projectBilling(id); const ex=erp.extrasRegister(id);
  const db=openDrawer(p.code+" — "+erp.party(p.partyId).name);
  const chapters=p.budgetId?erp.version(p.budgetId,p.acceptedVersionId).chapters.filter(c=>c.section==="base"):[];
  const chEc=p.budgetId?erp.chapterEconomics(id):[];
  db.innerHTML=`
   <div class="kpis" style="grid-template-columns:1fr 1fr">
    <div class="kpi"><div class="lab">Venta actual</div><div class="val">${eur0(e.currentRevenueCents)}</div><div class="sub">base ${eur0(e.baselineRevenueCents)} + extras ${eur0(e.approvedChangesCents)}</div></div>
    <div class="kpi ${e.marginForecastCents<0?'warn':''}"><div class="lab">Margen previsto</div><div class="val">${eur0(e.marginForecastCents)}</div><div class="sub">${e.marginForecastPct}% · real ${eur0(e.actualCents)} de ${eur0(e.forecastCostCents)}</div></div>
   </div>
   <div class="card"><div class="ch"><h3>Avance por capítulo</h3><span class="tag">marca lo hecho — alimenta la certificación</span></div><div class="daylist">
    ${chapters.map(c=>`<div class="it" style="align-items:center;gap:10px">${pillProg(c.progress)} <span style="flex:1">${c.num}. ${esc(c.name)}</span>
      ${!p.closed?`<button class="btn sm" data-prog="${c.num}" data-st="inProgress">En curso</button><button class="btn sm" data-prog="${c.num}" data-st="done">✓ Hecho</button>`:""}</div>`).join("")||`<div class="it">Avance: ${e.progressPct}%</div>`}
   </div></div>
   ${chEc.length?`<div class="card"><div class="ch"><h3>Coste por capítulo</h3><span class="tag">previsto vs. real</span></div><div class="scroll"><table><thead><tr><th>Capítulo</th><th class="num">Venta</th><th class="num">Coste prev.</th><th class="num">Coste real</th><th></th></tr></thead><tbody>
    ${chEc.map(c=>`<tr><td>${c.num}. ${esc(c.name)}</td><td class="num">${eur0(c.saleCents)}</td><td class="num">${eur0(c.budgetCostCents)}</td><td class="num">${eur0(c.actualCents)}</td><td>${c.overrun?'<span class="pill r">Desvío</span>':''}</td></tr>`).join("")}
   </tbody></table></div></div>`:""}
   <div class="card"><div class="ch"><h3>Extras</h3><span class="tag">${ex.approved} aprobados · ${eur0(ex.unapprovedValueCents)} sin aprobar</span></div><div class="daylist">
    ${ex.items.map(c=>`<div class="it" style="align-items:center;gap:8px"><span class="pill ${({identified:"y",priced:"y",approved:"b",executed:"b",invoiced:"g",rejected:"r"})[c.status]}">${({identified:"Detectado",priced:"Valorado",approved:"Aprobado",executed:"Ejecutado",invoiced:"Facturado",rejected:"Rechazado"})[c.status]}</span>
      <span style="flex:1">${esc(c.desc)} — venta ${eur(c.priceCents)} · coste ${eur(c.costCents)}</span>
      ${c.status==="priced"?`<button class="btn sm" data-approve="${c.id}">Aprobar</button>`:""}</div>`).join("")||'<div class="it">Sin extras registrados.</div>'}
   </div></div>
   <div class="card"><div class="ch"><h3>Facturación del proyecto</h3></div><div class="daylist">
    <div class="it">Facturado <b>${eur(bill.invoicedCents)}</b> · Cobrado <b>${eur(bill.collectedCents)}</b> · Pendiente <b>${eur(bill.outstandingCents)}</b> · Por facturar <b>${eur(bill.remainingToInvoiceCents)}</b></div>
   </div></div>`;
  db.querySelectorAll('[data-prog]').forEach(b2=>b2.onclick=()=>mutate(()=>erp.markProgress(id,b2.dataset.prog,b2.dataset.st,null,"operations"),"Avance actualizado"));
  db.querySelectorAll('[data-approve]').forEach(b2=>b2.onclick=()=>mutate(()=>erp.approveChange(b2.dataset.approve,"aprobación-cliente.png","backoffice"),"Extra aprobado — anexo generado"));
}

/* =============================== data actions (profile menu) =============================== */
function exportData(){
  const blob=new Blob([JSON.stringify({_meta:{app:"Canei ERP",exportedAt:erp.today},data:erp.toJSON()},null,1)],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);a.download='canei-erp.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast("Datos exportados");
}
/* The ONLY way the demo dataset is reloaded. Deliberately explicit and
   confirmed: boot() never reseeds over stored data by itself (see the schema
   guard there), so a device that already holds records keeps them until a
   person asks for this. That is also why a richer seed does not appear on its
   own after an update — you have to press this. */
function resetData(){
  if(!confirm("¿Recargar los datos de demostración?\n\nSe sustituye TODO lo que haya ahora en este dispositivo por el conjunto de ejemplo: dos años de actividad (2024-2025) más la situación actual de 2026."))return;
  erp=ErpSeed.build(); seedPlans(); persist(); render(); toast("Datos de demostración recargados — 2024 a 2026"); }
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&SUBMAP[k]&&!SUBMAP[k].href&&k!==cur){cur=k;render();}});
boot();
</script>
