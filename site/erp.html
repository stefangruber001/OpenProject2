        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .gal .gi {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 8px;
        background: var(--paper);
      }
      .gal .gi img {
        width: 96px;
        height: 72px;
        object-fit: cover;
        border-radius: 8px;
        background: var(--hair);
      }
      .gal .gi .m {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .gal .gi .b {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .gal .gi input[type="text"] {
        font: 12.5px var(--sans);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 8px;
        outline: 0;
        color: var(--ink);
        background: var(--paper);
      }
      .gal .gi input[type="text"]:focus {
        border-color: var(--green);
      }
      .gal .gi label {
        font: 600 11px var(--sans);
        color: var(--muted);
        display: inline-flex;
        gap: 5px;
        align-items: center;
        cursor: pointer;
      }

      /* The question box lives in erp-modal.js — see that file for why it is
         not the browser's own prompt(). Its styles come with it. */

      /* Full-size photograph and live camera. Both sit above the drawer and the
         question box, because both are opened FROM one of those. */
      .pview,
      .camview {
        position: fixed;
        inset: 0;
        z-index: 95;
        background: rgba(12, 16, 9, 0.92);
        display: flex;
        flex-direction: column;
      }
      .pvbar,
      .cvbar,
      .cvfoot {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.96);
        flex-wrap: wrap;
      }
      .cvfoot {
        justify-content: center;
      }
      .pvn,
      .cvn {
        font: 600 12px var(--sans);
        color: var(--body);
        letter-spacing: 0.04em;
      }
      .pvimg,
      .cvstage {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .pvimg img,
      .pvimg canvas,
      .cvstage video {
        max-width: 100%;
        max-height: 100%;
        border-radius: 10px;
        box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.8);
        background: #000;
      }
      /* A rendered PDF page is white paper, not a photograph: the black
         backdrop the images want makes a document look like a mistake. */
      .pvimg canvas {
        background: #fff;
      }
      .pvimg .pvwait {
        font: 600 12px var(--sans);
        color: rgba(255, 255, 255, 0.82);
        letter-spacing: 0.04em;
      }
      /* A picture is a button now — say so before it is clicked. */
      img[data-blob],
      [data-evidence] {
        cursor: zoom-in;
      }

      /* ------------------------- evidence dropzone -------------------------
         The backing document for something that was agreed: an acceptance
         email, a signed contract, the photograph of a delivery note. It is a
         FILE, not a typed filename — "correo-aceptacion.pdf" in a text box
         proves nothing and cannot be reopened.

         Drag and browse both, because both are how the file actually
         arrives: dragged from the mail client on a laptop, chosen from the
         camera roll on a phone. */
      .evz {
        border: 1.5px dashed var(--line);
        border-radius: 11px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        text-align: center;
        background: var(--paper);
        transition: 0.14s;
      }
      .evz.over {
        border-color: var(--green);
        background: var(--hair);
      }
      .evz .evhint {
        font: 12px var(--sans);
        color: var(--muted);
        line-height: 1.4;
      }
      .evz .evrow {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
      }
      .evfile {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px;
        background: var(--paper);
        text-align: left;
      }
      .evfile .evth {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        background: var(--hair);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        overflow: hidden;
      }
      .evfile .evth img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Block, so the name can actually be clipped: text-overflow does nothing
         on an inline box, and a long attachment name would push the buttons
         off the chip instead of ending in an ellipsis. */
      .evfile .evnm {
        display: block;
        font: 600 12.5px var(--sans);
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .evfile .evsz {
        display: block;
        font: 11px var(--sans);
        color: var(--muted);
      }
      .evfile .evb {
        display: flex;
        gap: 6px;
      }
      @media print {
        .pview,
        .camview {
          display: none;
        }
        /* downloadBudgetPdf appends exactly one .printsheet as the last child
           of body and calls window.print(). Hiding every OTHER direct child
           of body is what keeps the rail, the drawer and its scrim out of the
           printed page — the sheet does not need its own print stylesheet,
           it only needs to be alone. */
        body > *:not(.printsheet) {
          display: none !important;
        }
      }
      .printsheet {
        display: none;
      }
      @media print {
        .printsheet {
          display: block;
          padding: 20px;
        }
        /* On screen .doc reads as a PREVIEW of a document — dashed border,
           tinted paper. On paper it IS the document, so it prints as one:
           plain white, no border, no rounded corners pretending to be a card. */
        .printsheet .doc {
          background: #fff;
          border: 0;
          border-radius: 0;
          padding: 0;
        }
        .printsheet .annexpg {
          break-before: page;
        }
      }

      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(20, 26, 14, 0.34);
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        z-index: 60;
      }
      .scrim.on {
        opacity: 1;
        pointer-events: auto;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: min(480px, 94vw);
        background: var(--bg);
        z-index: 70;
        box-shadow: -30px 0 80px -40px rgba(20, 26, 14, 0.5);
        transform: translateX(102%);
        transition: transform 0.22s;
        display: flex;
        flex-direction: column;
      }
      .drawer.on {
        transform: none;
      }
      .drawer .dh2 {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
      }
      .drawer .db {
        overflow-y: auto;
        padding: 14px 18px 30px;
        flex: 1;
      }
      .fgrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px 12px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field.full {
        grid-column: 1/-1;
      }
      .field label {
        font: 600 11px var(--sans);
        color: var(--muted);
      }
      .field input,
      .field select {
        font: 13.5px var(--sans);
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 10px;
        outline: 0;
      }
      .field input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--greenSoft);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translate(-50%, 20px);
        opacity: 0;
        pointer-events: none;
        transition: 0.2s;
        z-index: 90;
        background: var(--ink);
        color: #fff;
        font: 600 12.5px var(--sans);
        padding: 10px 16px;
        border-radius: 11px;
        max-width: 88vw;
      }
      .toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* DMC-01 — the partidas tree (S3). Two zones per the doc: a narrow tree on
     the left with its own search and a count per branch, and the table on the
     right. Chapters drag to reorder; the drop target is drawn as a line
     rather than by moving rows around, so the list never appears to have
     already committed a move the user has not released yet. */
      .catwrap {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .cattree {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .cattree .tsearch {
        padding: 10px 11px;
        border-bottom: 1px solid var(--line);
      }
      .cattree .tsearch input {
        width: 100%;
        font: inherit;
        font-size: 12.5px;
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
        outline: 0;
      }
      .catbr {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
        font-size: 13px;
        position: relative;
      }
      .catbr:last-child {
        border-bottom: 0;
      }
      .catbr:hover {
        background: var(--bg);
      }
      .catbr.on {
        background: var(--greenSoft);
        font-weight: 600;
      }
      .catbr.retired {
        opacity: 0.55;
      }
      .catbr .grip {
        cursor: grab;
        color: var(--faint);
        font-size: 12px;
        letter-spacing: -1px;
      }
      .catbr .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .catbr .ct {
        font: 600 11px var(--sans);
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 1px 7px;
      }
      .catbr.on .ct {
        background: var(--paper);
      }
      .catbr.dropbefore:before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: -1px;
        height: 2px;
        background: var(--green);
      }
      .catbr.dropafter:after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: var(--green);
      }
      .catbr.dragging {
        opacity: 0.4;
      }
      .catthumb {
        width: 34px;
        height: 34px;
        border-radius: 7px;
        object-fit: cover;
        border: 1px solid var(--line);
        background: var(--bg);
      }
      @media (max-width: 1080px) {
        .catwrap {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* DMC-02 — the supplier comparison strip (S3). It appears only when the
     screen is filtered to ONE partida, because comparing suppliers across
     different items is not a comparison. A supplier with no price is drawn
     grey and says «sin precio»: the doc is explicit that a missing price is
     never to be rendered as a zero, which would make the cheapest supplier
     the one nobody has quoted. */
      .pstrip {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(216px, 1fr));
        gap: 11px;
        margin: 2px 0 4px;
      }
      .pcard {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 11px 13px;
        box-shadow: var(--shadow);
      }
      .pcard.best {
        border-color: var(--green);
        box-shadow:
          0 0 0 2px var(--greenSoft),
          var(--shadow);
      }
      .pcard.none {
        background: var(--bg);
        border-style: dashed;
      }
      .pcard .sup {
        font: 600 12.5px var(--sans);
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pcard .net {
        font: 700 21px var(--sans);
        letter-spacing: -0.02em;
        margin: 4px 0 2px;
      }
      .pcard.none .net {
        color: var(--muted);
        font-size: 15px;
        font-weight: 600;
      }
      .pcard .meta {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.5;
      }

      /* DMC-03/04/05 — the three list-configuration screens (S3). The doc asks
     for a centred table with a help column beside it explaining where the
     list is used, and no side panel: these screens are short enough that a
     drawer would be more navigation than content. */
      .cfgwrap {
        display: grid;
        grid-template-columns: minmax(0, 720px) 396px;
        gap: 18px;
        align-items: start;
      }
      .cfgtables {
        display: grid;
        gap: 14px;
      }
      .cfgtables.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      /* DMC-04 carries three lists since Package 1 #2 — a table on its own in
         the last row would otherwise sit at half width with empty space
         beside it. `:last-child:nth-child(odd)` only matches a trailing item
         with nothing beside it (the 3rd of 3, the 5th of 5…), so a screen
         with an even count of tables is untouched. */
      .cfgtables.two > :last-child:nth-child(odd) {
        grid-column: 1 / -1;
      }
      .cfghelp {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: var(--shadow);
      }
      .cfghelp h4 {
        font: 700 12px var(--sans);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .cfghelp p {
        font-size: 12.5px;
        line-height: 1.55;
        color: var(--body);
        margin: 0 0 9px;
      }
      .cfghelp code {
        font:
          12px ui-monospace,
          monospace;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 1px 4px;
      }
      .cfgtables input.inline {
        width: 100%;
      }
      tr.retired td {
        opacity: 0.5;
      }
      @media (max-width: 1180px) {
        .cfgwrap {
          grid-template-columns: minmax(0, 1fr);
        }
        .cfgtables.two {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* Cards on a phone (§3, decision 15). S2 built this for the master-list
     primitive alone; S14 generalises it to EVERY table, because the document
     says «tables become two-line cards» and it does not mean only the ones
     that happen to share a helper. The label on each line comes from
     `td[data-th]`, which `autoCards()` fills in at render time from the
     table's own header — so a new screen gets cards for free and there is
     nothing per-screen to keep in sync.

     Opting out is explicit and rare: a GRID is not a list. The forecast, the
     Gantt and the week calendar carry `data-nocards`, because turning a
     period column into a labelled line destroys the one thing those layouts
     exist to show — the shape across time. Those scroll sideways inside their
     own container, which they already do. */
      @media (max-width: 700px) {
        table.cards thead {
          display: none;
        }
        table.cards,
        table.cards tbody,
        table.cards tr,
        table.cards td {
          display: block;
          width: 100%;
        }
        /* The one line that makes cards actually fit. `table` carries a global
       `min-width:520px` so a desktop table never collapses into unreadable
       columns — and `width:100%` cannot win against it, so every carded table
       was laid out at 520px inside a ~360px `.scroll` box and scrolled
       SIDEWAYS. The page itself never scrolled, because `.scroll` absorbed the
       overflow internally, which is why this survived the 390px sweep: the
       check watched the document, and the document was innocent. A card has
       no columns to preserve, so it has no use for the floor. */
        table.cards {
          min-width: 0;
        }
        table.cards tr {
          border: 1px solid var(--line);
          border-radius: 11px;
          margin-bottom: 8px;
          padding: 9px 11px;
        }
        table.cards tr.tot,
        table.cards tr.grouphd {
          background: var(--hair);
        }
        table.cards td {
          border: 0;
          padding: 2px 0;
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          /* A value too long to sit beside its label drops to its own line
         instead of forcing the row wider than the card — which is the
         «two-line card» the specification asks for, arrived at only when the
         line actually needs two. */
          flex-wrap: wrap;
          gap: 2px 10px;
          font-size: 13px;
          height: auto;
          text-align: left;
          white-space: normal;
          overflow-wrap: anywhere;
        }
        table.cards td:before {
          content: attr(data-th);
          color: var(--muted);
          font: 600 10.5px var(--sans);
          flex: 0 0 auto;
        }
        /* A cell with no header and no content is a spacer on desktop and
       noise on a phone — an empty labelled line people have to read past. */
        table.cards td:empty {
          display: none;
        }
        table.cards td.k {
          font-size: 14px;
        }
        table.cards td.k:before,
        table.cards td[data-th=""]:before {
          display: none;
        }
      }

      /* ---------- Inside the native shell (S15) ----------
     The iOS app is a shell around these pages and appends `CaneiApp/…` to its
     user agent so they can tell. Until now nothing read it, which meant a
     phone inside the app showed THREE things stacked at the bottom: the web's
     own five-icon bar, the native floating tab bar over it, and — since S14 —
     the site-action button positioned to clear the web bar that is no longer
     the one in front.

     Under `.native` the web bar stands down, because the native tab bar does
     the same job better (it is native, it has haptics, and it survives a page
     load). What the native bar cannot do is reach the twenty-nine
     subsecciones, so the breadcrumb becomes the opener for panel 2 — one tap,
     from anywhere, to the same list the web bar used to show. */
      /* The five-icon strip stands down; the rail itself does NOT, because it
     is what panel 2 is positioned against — hiding it takes the subsection
     list with it. It is lifted clear of the native tab bar and made
     transparent to taps, so only the panel it carries is interactive. */
      body.native .p1 {
        display: none;
      }
      body.native .rail {
        bottom: calc(84px + env(safe-area-inset-bottom));
        border-top: 0;
        background: transparent;
        pointer-events: none;
      }
      body.native .p2 {
        pointer-events: auto;
      }
      body.native .crumbs {
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 12px;
        background: var(--paper);
      }
      body.native .crumbs:after {
        content: "▾";
        color: var(--muted);
        font-size: 11px;
      }
      /* Room for the native tab bar, and a site-action button that clears it
     rather than the bar that is no longer there. */
      body.native main {
        padding-bottom: calc(104px + env(safe-area-inset-bottom));
      }
      body.native .fab {
        bottom: calc(104px + env(safe-area-inset-bottom));
      }
      body.native .fabmenu {
        bottom: calc(168px + env(safe-area-inset-bottom));
      }

      /* ---------- Site actions (S14) ----------
     §3 asks for «a floating button for frequent site actions». The constraint
     is not screen width, it is that the person pressing it is standing on a
     roof in gloves: 56 px target, three taps to done, and only the four things
     somebody on site actually does. It exists on phones only — on a desktop
     the same four are one click away in the create menu, and a floating button
     over a full-width screen is just a button in the way. */
      .fab {
        display: none;
        position: fixed;
        right: 16px;
        bottom: calc(74px + env(safe-area-inset-bottom));
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 0;
        z-index: 60;
        font-size: 24px;
        color: #fff;
        background: linear-gradient(120deg, var(--greenDeep), var(--green) 70%);
        box-shadow: 0 10px 26px -8px rgba(20, 26, 14, 0.55);
        cursor: pointer;
      }
      .fab:active {
        transform: scale(0.94);
      }
      .fabmenu {
        display: none;
        position: fixed;
        right: 16px;
        bottom: calc(138px + env(safe-area-inset-bottom));
        z-index: 60;
        min-width: 220px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 18px 40px -18px rgba(20, 26, 14, 0.45);
        padding: 6px;
      }
      .fabmenu.on {
        display: block;
      }
      .fabmenu button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 48px;
        border: 0;
        background: none;
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        text-align: left;
        padding: 0 10px;
        border-radius: 10px;
        cursor: pointer;
      }
      .fabmenu button:active {
        background: var(--greenSoft);
      }
      @media (max-width: 860px) {
        .fab {
          display: grid;
          place-items: center;
        }
      }

      /* Phones: panel 1 becomes a bottom bar and panel 2 a sheet above it (spec §1). */
      @media (max-width: 860px) {
        .shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .rail {
          position: fixed;
          top: auto;
          left: 0;
          right: 0;
          bottom: 0;
          height: auto;
          z-index: 55;
        }
        /* Five icons, and they FIT — no horizontal scroll. There are six
       secciones, so one has to leave the bar: Configuración, because it is
       the one nobody reaches for on a phone on site. It is a tap away in the
       profile menu, which is where the guides and the recorrido already live. */
        .p1 {
          flex-direction: row;
          height: auto;
          overflow: hidden;
          border-right: 0;
          border-top: 1px solid var(--line);
          background: rgba(255, 255, 255, 0.96);
          backdrop-filter: saturate(1.4) blur(12px);
          padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        }
        .secitem {
          flex: 1 1 0;
          min-width: 0;
        }
        .secitem[data-sec="settings"] {
          display: none;
        }
        .secitem .lb {
          font-size: 10.5px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .mobonly {
          display: block;
        }
        .p2 {
          top: auto;
          bottom: 100%;
          left: 0;
          right: 0;
          width: auto;
          height: auto;
          max-height: 58vh;
          border-right: 0;
          border-top: 1px solid var(--line);
          border-radius: 14px 14px 0 0;
          transform: translateY(12px);
          box-shadow: 0 -22px 46px -34px rgba(20, 26, 14, 0.5);
        }
        .subscrim {
          z-index: 50;
        }
        main {
          padding: 16px 14px 96px;
        }
        .fgrid {
          grid-template-columns: 1fr;
        }
        .kpis {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .mobonly {
        display: none;
      }
      @media (max-width: 560px) {
        .brand .nm small {
          display: none;
        }
        .topbar {
          padding: 9px 12px;
        }
        .gsearch {
          flex: 1 1 100%;
          order: 3;
          max-width: none;
        }
      }
    </style>
    <script src="i18n-dict.js"></script>
    <script src="i18n-dict-ca.js"></script>
    <script src="i18n.js"></script>
  </head>

    <script src="erp-modal.js"></script>
    <script src="erp-engine.js"></script>
    <!-- erp-history.js must load BEFORE erp-seed.js: the seed calls into it to
     back-fill 2024-06…2025-12 before staging its own 2026 records. -->
    <script src="erp-history.js"></script>
    <script src="erp-seed.js"></script>
    <!-- Persistence: one module owns the IndexedDB version for every page. -->
    <!-- erp-sync.js must load BEFORE the stores: they register their
     documents with it as soon as the first read comes back. Without it
     the page still works, it just never notices a change made elsewhere. -->
    <script src="erp-sync.js"></script>
    <script src="erp-migrations.js"></script>
    <script src="erp-store.js"></script>
    <!-- Typed capability layer: erp-factory.js is GENERATED from packages/erp-browser
     (do not edit by hand); erp-bridge.js is the seam erp.html calls through.
     Both degrade silently if unavailable, so the ERP still runs without them. -->
    <script src="erp-factory.js"></script>
    <script src="erp-bridge.js"></script>
    <!-- Document recognition (S6). This file is ~9 KB and loads nothing: pdf.js
     and tesseract.js, the ~7 MB behind it, are fetched only when a file is
     actually handed over — and the OCR half never at all for a PDF that
     turned out to have a text layer. -->
    <script src="erp-ocr.js"></script>
    <script>
      /* =============================== boot & persistence =============================== */
      const $ = (s) => document.querySelector(s),
        el = (t, c, h) => {
          const e = document.createElement(t);
          if (c) e.className = c;
          if (h != null) e.innerHTML = h;
          return e;
        };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m],
        );
      const eur = (c) =>
        new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: "EUR",
          useGrouping: "always",
        }).format((c || 0) / 100);
      const eur0 = (c) =>
        new Intl.NumberFormat("es-ES", {
          style: "currency",
          currency: "EUR",
          maximumFractionDigits: 0,
          useGrouping: "always",
        }).format(Math.round((c || 0) / 100));
      const fmtD = (iso) => {
        if (!iso) return "—";
        const p = String(iso).split("-");
        return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
      };
      /* wa.me needs digits only, in international form with no leading "+".
     Every mobile in this system is stored as a bare 9-digit Spanish number
     (see the party record), so a 9-digit value gets the country code
     prefixed; anything else is passed through digit-stripped, on the chance
     it was already typed with one. Tenant-specific, and that is fine here —
     `site/` is the host layer CLAUDE.md carves out for exactly this: the
     kernel and capabilities never see a country code, this file already
     hardcodes "España" as the default billing country. */
      function waPhone(raw) {
        const digits = String(raw || "").replace(/\D/g, "");
        return digits.length === 9 ? "34" + digits : digits;
      }
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(t._t);
        t._t = setTimeout(() => t.classList.remove("on"), 2200);
      }

      /* Persistence lives in erp-store.js — one module owns the IndexedDB version,
   because a second page opening "caneiERP" at a different version would throw
   VersionError and render nothing. */
      let saveT;
      function persist() {
        clearTimeout(saveT);
        saveT = setTimeout(() => ErpStore.saveState(erp.toJSON()).catch(() => {}), 140);
      }
      /* Flush the debounce and report the outcome. Everything on screen saves on its
   own 140 ms later; this exists for the one place that asks in so many words
   ("Guardar", COM-03) and so has to be able to answer truthfully — including
   when the write fails, which the fire-and-forget path above deliberately
   swallows because a toast per keystroke would be unreadable. */
      function persistNow() {
        clearTimeout(saveT);
        return ErpStore.saveState(erp.toJSON());
      }

      let erp,
        cur = "tower",
        bootNotice = "";
      /* Who is signed in and what they may see — client-side only, fetched once at
   boot from GET /api/~/session (S2). This is masking, not the security
   boundary: every write still goes through the server's own permission
   check (require_), which this only anticipates so a gestoría account is
   not shown a field it could never save anyway. Defaults permissive because
   local IndexedDB mode has no server-side identity to ask in the first
   place — everything on that single machine is already fully visible. */
      let SESSION = { email: "", role: "admin", bankRead: true };
      async function boot() {
        let migration = null,
          fresh = false;
        try {
          const loaded = await ErpStore.loadState(); // migrates + backs up if needed
          migration = loaded.migration;
          if (loaded.state) {
            erp = ErpEngine.ERP.from(loaded.state);
          } else {
            erp = ErpSeed.build();
            fresh = true;
          }
        } catch (e) {
          // A blob newer than this build lands here. Never silently reseed over it:
          // that would destroy the user's data to make the page render.
          if (/schema v/i.test(String(e && e.message))) {
            document.body.innerHTML =
              '<div style="max-width:36rem;margin:18vh auto;padding:0 24px;font:15px/1.6 var(--sans,system-ui);color:#14160f">' +
              '<h1 style="font-size:19px;margin:0 0 10px">Datos más recientes que la aplicación</h1>' +
              '<p style="color:#4f5347">' +
              esc(e.message) +
              "</p>" +
              '<p style="color:#8b8f80;font-size:13px">No se ha modificado nada. Actualiza la aplicación para volver a abrir estos datos.</p></div>';
            return;
          }
          // When the document lives on the server there is no local copy to fall back
          // to, and inventing one is not a degraded mode — it is destruction. The
          // seeded document would be saved over the company's register by the next
          // debounced persist(), so a dropped connection would erase real invoices.
          // Stop, say so, change nothing.
          if (ErpStore.isRemote()) {
            document.body.innerHTML =
              '<div style="max-width:36rem;margin:18vh auto;padding:0 24px;font:15px/1.6 var(--sans,system-ui);color:#14160f">' +
              '<h1 style="font-size:19px;margin:0 0 10px">No se ha podido conectar con el servidor</h1>' +
              '<p style="color:#4f5347">' +
              esc(String((e && e.message) || e)) +
              "</p>" +
              '<p style="color:#8b8f80;font-size:13px">Los datos están en el servidor y no se ha modificado nada. ' +
              "Vuelva a intentarlo cuando esté disponible.</p></div>";
            return;
          }
          erp = ErpSeed.build();
          fresh = true;
        }

        // One-way, non-destructive fold-in of the legacy master-data store. Runs at
        // most once (recorded in state.imports); anything ambiguous becomes a
        // reviewable conflict rather than an automatic overwrite.
        let imported = null;
        try {
          imported = await ErpStore.importLegacyMasterData(erp);
        } catch (e) {
          /* never block boot */
        }

        if (fresh || migration?.applied.length || imported?.ran) persist();

        const notes = [];
        if (migration?.applied.length)
          notes.push(
            `Datos actualizados al formato v${migration.to} (copia de seguridad guardada).`,
          );
        if (imported?.ran && imported.imported)
          notes.push(`${imported.imported} clientes importados de Datos Maestros.`);
        if (imported?.ran && imported.conflicts)
          notes.push(`${imported.conflicts} registros necesitan revisión.`);
        bootNotice = notes.join(" ");

        // The demo budget references four pictures by storage key; draw them once so
        // the graphic annex has something to show on a clean machine. Real pictures
        // arrive from a camera or a file — this commits no binary to the repository
        // and fetches nothing over the network.
        try {
          await ensureDemoImages();
        } catch (e) {
          /* never block boot over a picture */
        }
        if (fresh) {
          seedPlans();
          persist();
        }

        // UI preferences (period) live in the store's `meta`, never in the state blob.
        try {
          const prefs = await ErpStore.getMeta("ui.prefs");
          if (prefs && prefs.period) PERIOD = { ...PERIOD, ...prefs.period };
        } catch (e) {}
        try {
          const pp = await ErpStore.getMeta("ui.projects");
          if (pp) {
            projFavs = pp.favs || [];
            projRecents = pp.recents || [];
          }
        } catch (e) {}
        // Customers kept its pre-S2 storage key (ui.customers / the older
        // ui.clientes) so a page size somebody already chose is carried over
        // rather than reset; the three screens built in S2 use the shared
        // ui.list.<id> key from the start.
        try {
          const cp =
            (await ErpStore.getMeta("ui.customers")) || (await ErpStore.getMeta("ui.clientes"));
          const st = getListState("customers", 25);
          if (cp && LIST_PAGE_SIZES.includes(cp.pageSize)) st.pageSize = cp.pageSize;
          for (const id of ["suppliers", "subcontractors", "staff"]) {
            const sz = await loadListPageSize(id);
            if (sz) getListState(id, 25).pageSize = sz;
          }
        } catch (e) {}

        const rawHash = location.hash.slice(1),
          hashKey = resolveRoute(rawHash);
        if (hashKey && SUBMAP[hashKey]) {
          if (SUBMAP[hashKey].href) {
            location.replace(SUBMAP[hashKey].href);
            return;
          }
          cur = hashKey;
          // replaceState, not assignment: normalising the address must not push a
          // history entry, or Back would bounce between the old name and the new.
          if (rawHash !== hashKey)
            history.replaceState(null, "", location.pathname + location.search + "#" + hashKey);
        }
        // Cross-page deep link (journey.html's "abrir pantalla real" per stage,
        // §2.3): ?project=CODE preselects the project context, then the query
        // string is dropped so reloading or sharing the URL doesn't re-trigger it.
        const qsProject = new URLSearchParams(location.search).get("project");
        if (qsProject && erp.state.projects.some((p) => p.code === qsProject)) {
          gProject = erp.state.projects.find((p) => p.code === qsProject).id;
          history.replaceState(null, "", location.pathname + location.hash);
        }
        if (ErpStore.isRemote()) {
          try {
            const base = ErpStore.apiBase() || "";
            const res = await fetch(base + "/api/~/session", {
              headers: { "content-type": "application/json" },
            });
            if (res.ok) SESSION = await res.json();
          } catch (e) {
            /* keep the permissive default — masking only, see SESSION above */
          }
        }

        buildPeriodControls();
        buildUserMenu();
        render();

      /* Demo pictures for the seeded budget's graphic annex, keyed exactly as
   erp-seed.js references them. Drawn, not downloaded: the page must work from
   a bare static host with no network, and a repository is the wrong place to
   keep a JPEG that only exists to make a screenshot look plausible. */
      const DEMO_IMAGES = {
        seed_img_pavimento: ["#c9b79a", "Pavimento cerámico"],
        seed_img_estado: ["#9a9384", "Estado actual"],
        seed_img_pintura: ["#dfe6d8", "Carta de color"],
        seed_img_interna: ["#4f6b86", "Detalle interno"],
      };
      async function ensureDemoImages() {
        // Never against the server. These exist so the DEMONSTRATION budget has
        // something to show on a clean machine; uploading four invented pictures into
        // the company's real attachment store — where they would be backed up,
        // restored, and indistinguishable from a photograph of an actual wall — is
        // exactly the kind of fiction the remote guards elsewhere already refuse.
        if (ErpStore.isRemote()) return;
        for (const key of Object.keys(DEMO_IMAGES)) {
          const [color, label] = DEMO_IMAGES[key];
          try {
            if (await ErpStore.getBlob(key)) continue;
            const c = document.createElement("canvas");
            c.width = 480;
            c.height = 320;
            const x = c.getContext("2d");
            x.fillStyle = color;
            x.fillRect(0, 0, 480, 320);
            x.fillStyle = "rgba(255,255,255,.8)";
            x.fillRect(0, 246, 480, 74);
            x.fillStyle = "#14160f";
            x.font = "600 20px Inter, system-ui, sans-serif";
            x.fillText(label, 18, 290);
            const blob = await new Promise((r) => c.toBlob(r, "image/png"));
            if (blob) await ErpStore.putBlob(key, blob);
          } catch (e) {
            /* one undrawable picture must not cost the whole boot */
          }
        }
      }

      /* The sticky panels hang off the real topbar height: it wraps on narrow
   viewports, so a hard-coded offset would leave a gap or hide a row. */
      function measureTopbar() {
        const h = document.querySelector(".topbar").offsetHeight;
        document.documentElement.style.setProperty("--top", h + "px");
      }
      window.addEventListener("resize", () => {
        measureTopbar();
        closeSection();
      });
      function mutate(fn, msg) {
        try {
          fn();
          persist();
          render();

        } catch (e) {
          toast("⚠ " + e.message);
        }
      }

      /* =============================== navigation (v4 §1) ======================
   Three panels: sections (always visible) → subsections (open on demand) →
   content. Routing is by SUBSECTION key.

   The keys are ENGLISH, and that is a change: they used to be the Spanish
   words the flat menu shipped with, and every deep link, both native tab bars,
   the e2e suite and anything an owner bookmarked used them. ROUTE_ALIASES below
   maps every retired key to its replacement and `go()` resolves through it, so
   an old link still lands where it did — it just arrives at the new name.
   Renaming without that map is how you break a bookmark silently.

   Six secciones, twenty-nine subsecciones. The specification names twenty-six;
   the extra three are Comunicaciones, Alertas and Usuarios, moved into
   Configuración by operator decision rather than deleted (see ASSUMPTIONS).

   Subsections carry either a `view` (rendered in panel 3) or an `href` (a page
   this shell does not own yet). As of S12 every one of them resolves to a real
   screen; a route that resolves to neither is a dead link, not a promise, and
   says so. `code` is the specification's own identifier, so a screen can be
   traced to the paragraph that asked for it. */
      const SECTIONS = [
        {

            { k: "visits", lab: "Visitas", code: "COM-02" },
            { k: "quotes", lab: "Presupuestos", code: "COM-03" },
            { k: "contracts", lab: "Contratos", code: "COM-04" },

        },
        {

          lab: "Proyectos",
          short: "Proyectos",

        {

            { k: "supplier-invoices", lab: "Facturas de proveedores", code: "ADM-03" },
            { k: "labour", lab: "Horas", code: "ADM-04" },

            { k: "petty-cash", lab: "Caja chica", code: "ADM-06" },
            { k: "accountant", lab: "Reporte a gestoría", code: "ADM-07" },
            { k: "cash-flow", lab: "Flujo de caja", code: "ADM-08" },
            {

      /* Old hash → new key. Everything the previous menu could route to is here,
   including the four screens that were merged into two and the two that were
   removed outright — a retired link must still arrive somewhere sensible
   rather than at a blank panel. */
      const ROUTE_ALIASES = {
        torre: "tower",
        hoy: "tower", // Mi día removed; the Torre is what remains
        clientes: "customers",
        oportunidades: "leads",
        presupuestos: "quotes",
        contratos: "contracts",
        proyectos: "progress",
        seguimiento: "progress", // merged into PRY-01
        economia: "economics",
        modificaciones: "variations",
        compras: "purchasing",
        subcontratos: "subcontractors", // lifecycle screens retired; master data remains
        horas: "labour",
        facturacion: "invoicing",
        pagos: "supplier-invoices", // merged into ADM-03
        captura: "supplier-invoices", // merged into ADM-03
        conciliacion: "banking", // merged into ADM-05
        banco: "banking", // merged into ADM-05
        precios: "price-list",

      /** The key a hash actually resolves to. Unknown keys fall through unchanged so
    a typo lands on the default rather than being rewritten into a wrong screen. */
      function resolveRoute(k) {
        return (SUBMAP[k] ? k : ROUTE_ALIASES[k]) || k;
      }

      const SUBMAP = {};
      SECTIONS.forEach((s) => s.subs.forEach((x) => (SUBMAP[x.k] = { ...x, sec: s })));

      /* Every subsección in the menu now renders a real screen — ADM-08 was the last
   one waiting, and S12 built it. What is left here is the fallback for a route
   that does not exist at all: a stale bookmark, a typo, a link from an older
   build. It says exactly that rather than "en preparación", because promising
   a screen that was never planned is a worse lie than admitting a dead link.
   The e2e suite walks every menu entry and fails if any of them lands here. */
      function unknownRouteView(k, v) {
        $("#sub").textContent = "";
        v.innerHTML = `<div class="card"><div class="ch"><h3>Ruta desconocida</h3><span class="tag">${esc(k)}</span></div>
    <div class="daylist"><div class="it">Esta dirección no corresponde a ninguna pantalla. Puede venir de un enlace antiguo.</div>
    <div class="it"><button class="btn sm" id="phGo">Ir a la Torre</button></div></div></div>`;
        $("#phGo").onclick = () => go("tower");
      }

      function counts(k) {
        const S = erp.state;
        try {
          if (k === "tower") return erp.alerts().filter((a) => a.sev === "critical").length || "";
          if (k === "customers")
            return S.parties.filter((p) => p.active && (p.roles || []).includes("customer")).length;
          if (k === "quotes") return S.budgets.length;
          if (k === "progress") return S.projects.filter((p) => !p.closed).length;
          if (k === "invoicing") return S.invoices.length;
          if (k === "banking")
            return S.movements.filter((m) => m.status === "unallocated").length || "";
          if (k === "alerts") return erp.managedAlerts().length || "";
        } catch (e) {}
        return "";
      }
      let openSec = null; // section whose panel 2 is out
      function buildSections() {
        const p1 = $("#p1");
        p1.innerHTML = "";
        const curSec = SUBMAP[cur] ? SUBMAP[cur].sec.k : "tower";
        let critical = 0;
        try {
          critical = erp.alerts().filter((a) => a.sev === "critical").length;
        } catch (e) {}
        SECTIONS.forEach((s) => {
          const b = el("button", "secitem" + (s.k === curSec ? " on" : ""));
          b.innerHTML = `<span class="ic">${s.ic}</span><span class="lb">${s.short}</span>${s.k === "tower" && critical ? '<span class="dot"></span>' : ""}`;
          b.dataset.sec = s.k;
          b.setAttribute("aria-label", s.lab);
          b.onclick = () => toggleSection(s.k);
          p1.appendChild(b);
        });
      }
      function buildSubs(secKey) {
        const s = SECTIONS.find((x) => x.k === secKey);
        if (!s) return;
        $("#p2h").textContent = s.lab;
        const list = $("#p2list");
        list.innerHTML = "";
        s.subs.forEach((x) => {
          const b = el("button", "navitem" + (x.k === cur ? " on" : ""));
          const c = counts(x.k);
          b.innerHTML = `<span>${x.lab}</span>${x.href ? '<span class="ext">↗</span>' : c !== "" ? `<span class="ct${x.k === "torre" && c ? " alert" : ""}">${c}</span>` : ""}`;
          b.dataset.k = x.k;
          b.onclick = () => {
            closeSection();
            go(x.k);
          };
          list.appendChild(b);
        });
      }
      function toggleSection(secKey) {
        if (openSec === secKey) {
          closeSection();
          return;
        }
        openSec = secKey;
        buildSubs(secKey);
        $("#p2").classList.add("on");
        $("#subscrim").classList.add("on");
        document
          .querySelectorAll(".secitem")
          .forEach((b) => b.classList.toggle("on", b.dataset.sec === secKey));
      }
      function closeSection() {
        openSec = null;
        $("#p2").classList.remove("on");
        $("#subscrim").classList.remove("on");
        const curSec = SUBMAP[cur] ? SUBMAP[cur].sec.k : "tower";
        document
          .querySelectorAll(".secitem")
          .forEach((b) => b.classList.toggle("on", b.dataset.sec === curSec));
      }
      $("#subscrim").onclick = closeSection;

      /* The native shell announces itself in the user agent (see Config.swift).
     Reading it here rather than sniffing the platform is deliberate: Safari on
     an iPhone is NOT the app, and giving it the app's chrome would strand
     somebody who opened the site in a browser with no way back to the
     sections. */
      const IN_NATIVE_SHELL = / CaneiApp\//.test(navigator.userAgent);
      if (IN_NATIVE_SHELL) {
        document.body.classList.add("native");
        $("#crumbs").setAttribute("role", "button");
        $("#crumbs").setAttribute("tabindex", "0");
        $("#crumbs").onclick = () => toggleSection(SUBMAP[cur] ? SUBMAP[cur].sec.k : "tower");
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeSection();
      });

      function go(k, arg) {
        k = resolveRoute(k);
        const s = SUBMAP[k];
        if (s && s.href) {
          location.href = s.href;
          return;
        } // pages this shell does not own
        // Leaving ADM-02 closes the order that was open on it. A full-screen detail
        // that survives a trip to another section ambushes whoever comes back — they
        // asked for the list and got a document.
        if (k !== "purchasing") puWork = null;
        if (k !== "contracts") conWork = null;
        if (k !== "progress") ganttFull = false;
        if (k !== "economics") ecoFull = false;
        cur = k;
        location.hash = k;
        window._arg = arg;
        closeMenus();
        render();
        window.scrollTo(0, 0);
      }

      /* =============================== render =============================== */
      function render() {
        buildSections();
        if (openSec) buildSubs(openSec);
        const meta = SUBMAP[cur] || { lab: "—", sec: { lab: "ERP" } };
        // The section name goes in its own element. Concatenated into one text node
        // it was a string no dictionary could ever hold — "ERP › Torre de control" —
        // so the breadcrumb was the one part of the shell the language toggle could
        // not reach.
        $("#crumbs").innerHTML = `ERP › <span>${esc(meta.sec.lab)}</span>`;
        $("#ttl").textContent = meta.lab;
        $("#sub").textContent = "";
        renderBell();
        renderCreateMenu();
        renderProjectBar();
        renderSeedBar();
        const v = $("#view");
        // Full screen is opt-in per render, never sticky: a view that wants it turns
        // it on for itself (today only the presupuestador does). Clearing it here
        // rather than on the way out means no screen can strand the next one without
        // its navigation, whatever route the person took to leave.
        document.body.classList.remove("fs");
        if (VIEWS[cur]) VIEWS[cur](v);
        else unknownRouteView(cur, v);

      }

      /* ---------- Cards on a phone (S14) ----------
   The CSS turns a table into cards; this fills in the label each line needs.
   Doing it once here, after the view has rendered, rather than in twenty-nine
   template literals, is the whole point: a screen written next month gets
   cards without knowing this exists, and no screen can drift out of sync by
   forgetting a `data-th`.

   Three tables opt out with `data-nocards`, and the reason is the same each
   time: they are GRIDS, not lists. Turning the forecast's period columns, the
   Gantt's days or the week calendar into labelled lines destroys the shape
   across time that is the only reason those layouts exist. They scroll
   sideways inside their own container instead, which they already do. */
      function autoCards(root) {
        root.querySelectorAll("table").forEach((t) => {
          if (t.hasAttribute("data-nocards")) return;
          const heads = [...t.querySelectorAll("thead th")].map((th) => th.textContent.trim());
          // A headerless table still becomes cards, but only from three columns
          // up: a two-column key/value row already reads as one line, and
          // splitting it in two makes it longer without making it clearer.
          // With no header the lines carry no label, which is correct — there
          // was never a column name to show.
          const widest = Math.max(
            0,
            ...[...t.querySelectorAll("tbody tr")].map((tr) => tr.children.length),
          );
          if (!heads.length && widest < 3) return;
          t.classList.add("cards");
          t.querySelectorAll("tbody tr").forEach((tr) => {
            // A row that spans the table (a group heading, an empty state) is
            // already one line; labelling it would invent a column name.
            const tds = [...tr.children];
            if (tds.length === 1 && tds[0].hasAttribute("colspan")) return;
            tds.forEach((td, i) => {
              if (!td.hasAttribute("data-th")) td.setAttribute("data-th", heads[i] || "");
            });
          });
        });
      }

      /* =============================== global bar (spec §1) ==============================
   Universal search · contextual create · alert bell · period selector · profile
   and help. The period is a preference, not business data: it lives in the
   store's `meta` object store, never in the state blob, so it can never collide
   with an engine key or need a schema migration to change. */
      const MONTHS = [
        "enero",
        "febrero",
        "marzo",
        "abril",
        "mayo",
        "junio",
        "julio",
        "agosto",
        "septiembre",
        "octubre",
        "noviembre",
        "diciembre",
      ];
      const PERIOD_MODES = [
        ["year", "Año"],
        ["quarter", "Trimestre"],
        ["month", "Mes"],
        ["range", "Rango"],
      ];
      let PERIOD = { mode: "year", from: null, to: null };
      const pad2 = (n) => String(n).padStart(2, "0");
      const lastDay = (y, m) => `${y}-${pad2(m)}-${new Date(Date.UTC(y, m, 0)).getUTCDate()}`;
      /* The reference date is the dataset's today, not the wall clock: this dataset
   lives in its own exercise year and a wall-clock period would empty every
   table for reasons the user cannot see. */
      function periodRange() {
        const t = (erp && erp.today) || new Date().toISOString().slice(0, 10);
        const Y = +t.slice(0, 4),
          M = +t.slice(5, 7);
        if (PERIOD.mode === "month")
          return { from: `${Y}-${pad2(M)}-01`, to: lastDay(Y, M), label: `${MONTHS[M - 1]} ${Y}` };
        if (PERIOD.mode === "quarter") {
          const q = Math.floor((M - 1) / 3);
          return {
            from: `${Y}-${pad2(q * 3 + 1)}-01`,
            to: lastDay(Y, q * 3 + 3),
            label: `T${q + 1} ${Y}`,
          };
        }
        if (PERIOD.mode === "range" && PERIOD.from && PERIOD.to)
          return {
            from: PERIOD.from,
            to: PERIOD.to,
            label: `${fmtD(PERIOD.from)} – ${fmtD(PERIOD.to)}`,
          };
        return { from: `${Y}-01-01`, to: `${Y}-12-31`, label: String(Y) };
      }
      const inPeriod = (iso) => {
        const r = periodRange();
        return !!iso && iso >= r.from && iso <= r.to;
      };
      /* Every filtered table says so, with how much it is hiding — a table that
   quietly drops rows is indistinguishable from a table with no data. */
      function periodNote(shown, total) {
        const r = periodRange();
        return `<div class="periodnote"><span class="pill">Periodo · ${esc(r.label)}</span>
    <span>${shown} de ${total} registros${shown < total ? ` · ${total - shown} fuera del periodo` : ""}</span></div>`;
      }
      function savePrefs() {
        try {
          ErpStore.setMeta("ui.prefs", { period: PERIOD });
        } catch (e) {}
      }
      function buildPeriodControls() {
        const sel = $("#periodMode");
        sel.innerHTML = PERIOD_MODES.map(
          ([v, l]) => `<option value="${v}"${PERIOD.mode === v ? " selected" : ""}>${l}</option>`,
        ).join("");
        const range = PERIOD.mode === "range";
        $("#periodFrom").hidden = !range;
        $("#periodTo").hidden = !range;
        const r = periodRange();
        $("#periodFrom").value = PERIOD.from || r.from;
        $("#periodTo").value = PERIOD.to || r.to;
        sel.title = "Periodo aplicado: " + r.label;
      }
      $("#periodMode").onchange = (e) => {
        PERIOD = { ...PERIOD, mode: e.target.value };
        if (PERIOD.mode === "range" && (!PERIOD.from || !PERIOD.to)) {
          const r = periodRange();
          PERIOD.from = r.from;
          PERIOD.to = r.to;
        }
        savePrefs();
        buildPeriodControls();
        render();
      };
      ["#periodFrom", "#periodTo"].forEach((id) => {
        $(id).onchange = () => {
          PERIOD = {
            mode: "range",
            from: $("#periodFrom").value || null,
            to: $("#periodTo").value || null,
          };
          savePrefs();
          buildPeriodControls();

      let seedBarHidden = false;

      const TASK_STATUS_ES = {

      /* =============================== Gantt (spec §3.3 · §4.3) ==========================
   THE CHART IS A VIEW AND NOTHING MORE. Every date, duration, float,
   critical-path flag and baseline drift it draws is asked of
   @repo/capability-scheduling through ErpBridge. The only arithmetic in this
   block is pixels ↔ calendar days: where to put a bar, and what date a drag
   of N pixels landed on. Working-day questions — is this day closed, how long
   is this task really, where does the plan now finish — are the engine's, and
   the first time one of them gets recomputed here the chart and the engine
   will start disagreeing about the same plan. */
      let gProject = null,
        gSel = null,
        gZoom = 24,
        gBaseline = true,
        gDrag = null;
      const G_ROW = 30,
        G_HEAD = 34;
      const isoAdd = (iso, d) => {
        const t = new Date(iso + "T00:00:00Z");
        t.setUTCDate(t.getUTCDate() + d);
        return t.toISOString().slice(0, 10);
      };
      const isoDiff = (a, b) =>
        Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000);
      function ganttApi() {
        return typeof ErpBridge !== "undefined" && ErpBridge.available
          ? ErpBridge.scheduling.plans
          : null;
      }
      /* Give every freshly-seeded project a schedule.
   Plans are owned by @repo/capability-scheduling and live in the bundle, not
   in erp-engine.js, so erp-seed.js (which also has to run under plain Node)
   cannot build one. Deriving here — once, right after a seed or a reset, and
   only for projects that have none — is what stops Seguimiento opening on an
   empty chart. Never touches a project that already has a plan, so a user's
   own dragging and re-linking is never overwritten. */
      function seedPlans() {
        const B = ganttApi();
        if (!B) return 0;
        let made = 0;
        const cal = B.defaultCalendar();
        for (const p of erp.state.projects) {
          if (!p.budgetId || !p.acceptedVersionId) continue;
          if (erp.state.plans && erp.state.plans[p.id]) continue;
          try {
            const derived = B.fromBudget(erp, p.id, { calendar: cal });
            if (derived) {
              B.save(erp.state, p.id, derived.plan);
              made++;
            }
          } catch (e) {
            /* a project the capability cannot schedule is not a boot failure */
          }
        }
        return made;
      }
      /* Every change goes through one door: recalculate, store, persist, re-render.
   mutate() turns an engine refusal (a cycle, a bad duration) into a toast. */
      function ganttCommit(pid, plan, msg) {
        const B = ganttApi();
        mutate(() => {
          B.save(erp.state, pid, B.recalculate(plan));
        }, msg);
      }

      function ganttChart(plan, sch, cmp, pays) {
        const B = ganttApi(),
          cal = plan.calendar || B.defaultCalendar(),
          C = B.calendar;
        const S = {};
        if (sch)
          sch.tasks.forEach((t) => {
            S[t.taskId] = t;
          });
        const base = {};
        if (cmp) {
          const b = (plan.baselines || []).find((x) => x.id === cmp.baselineId);
          (b ? b.tasks : []).forEach((t) => {
            base[t.taskId] = t;
          });
        }
        const pos = (t) =>
          S[t.id] || {
            start: t.plannedStart,
            finish: t.plannedEnd,
            critical: false,
            lateFinish: t.plannedEnd,
            totalFloatDays: 0,
          };

        let from = null,
          to = null;
        const touch = (d) => {
          if (!d) return;
          if (!from || d < from) from = d;
          if (!to || d > to) to = d;
        };
        plan.tasks.forEach((t) => {
          const p = pos(t);
          touch(p.start);
          touch(p.finish);
          const b = base[t.id];
          if (b) {
            touch(b.start);
            touch(b.finish);
          }
        });
        pays.forEach((p) => touch(p.date));
        touch(erp.today);
        from = isoAdd(from, -3);
        to = isoAdd(to, 4);

        const nDays = isoDiff(from, to) + 1,
          W = Math.max(nDays * gZoom, 360);
        const rows = plan.tasks.length + (pays.length ? 1 : 0),
          H = G_HEAD + rows * G_ROW;
        const x = (iso) => isoDiff(from, iso) * gZoom;
        const barW = (a, b) => Math.max(gZoom * 0.7, (isoDiff(a, b) + 1) * gZoom - 3);

        /* --- axis: closed days shaded, day numbers, month labels, today --- */
        let axis = "";
        for (let i = 0; i < nDays; i++) {
          const d = isoAdd(from, i),
            X = i * gZoom;
          if (!C.isWorkingDay(cal, d))
            axis += `<rect class="gnonwork" x="${X}" y="${G_HEAD}" width="${gZoom}" height="${H - G_HEAD}"/>`;
          if (gZoom >= 24 || d.slice(8) === "01" || i === 0)
            axis += `<text x="${X + gZoom / 2}" y="${G_HEAD - 6}" text-anchor="middle">${+d.slice(8)}</text>`;
          if (d.slice(8) === "01" || i === 0)
            axis += `<text class="mon" x="${X + 2}" y="13">${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}</text>`;
        }
        axis += `<line class="gtoday" x1="${x(erp.today) + gZoom / 2}" y1="${G_HEAD}" x2="${x(erp.today) + gZoom / 2}" y2="${H}"/>`;

        /* --- bars --- */
        let bars = "",
          names = "";
        plan.tasks.forEach((t, i) => {
          const p = pos(t),
            y = G_HEAD + i * G_ROW,
            top = y + 5,
            mid = y + G_ROW / 2;
          const b = base[t.id];
          if (b)
            bars += `<rect class="gghost" x="${x(b.start)}" y="${y + 2}" width="${barW(b.start, b.finish)}" height="${G_ROW - 4}" rx="4"/>`;
          if (t.milestone) {
            const cx = x(p.start) + gZoom / 2;
            bars += `<polygon class="gms${p.critical ? " crit" : ""}" data-task="${t.id}" data-role="move" points="${cx},${mid - 9} ${cx + 9},${mid} ${cx},${mid + 9} ${cx - 9},${mid}"><title>${esc(t.title)} · ${fmtD(p.start)}</title></polygon>`;
          } else {
            const w = barW(p.start, p.finish),
              X = x(p.start);
            if (p.totalFloatDays > 0 && p.lateFinish > p.finish)
              bars += `<line class="gfloat" x1="${X + w}" y1="${mid}" x2="${x(p.lateFinish) + gZoom - 3}" y2="${mid}"/>`;
            bars += `<g><rect class="gbar${p.critical ? " crit" : ""}${gSel === t.id ? " sel" : ""}" data-task="${t.id}" data-role="move" x="${X}" y="${top}" width="${w}" height="20" rx="5"><title>${esc(t.title)} · ${fmtD(p.start)} → ${fmtD(p.finish)} · ${p.durationDays} d${p.critical ? " · crítica" : ` · holgura ${p.totalFloatDays} d`}</title></rect>
        ${t.progressPct ? `<rect class="gprog" x="${X}" y="${top + 14}" width="${Math.max(2, (w * t.progressPct) / 100)}" height="4" rx="2"/>` : ""}
        <rect class="ggrip" data-task="${t.id}" data-role="resize" x="${X + w - 6}" y="${top}" width="6" height="20" rx="2"/>
        <circle class="gknob" data-task="${t.id}" data-role="link" cx="${X + w + 7}" cy="${mid}" r="4.5"/></g>`;
          }
          names += `<div class="gn${gSel === t.id ? " on" : ""}" data-task="${t.id}" title="${esc(t.title)}">${p.critical ? '<span class="dot"></span>' : ""}${t.milestone ? "◆ " : ""}${esc(t.title)}</div>`;
        });

        /* --- dependency arrows --- */
        let deps = "";
        const rowOf = {};
        plan.tasks.forEach((t, i) => {
          rowOf[t.id] = i;
        });
        (plan.dependencies || []).forEach((d) => {
          const a = plan.tasks.find((t) => t.id === d.predecessorId),
            z = plan.tasks.find((t) => t.id === d.successorId);
          if (!a || !z) return;
          const pa = pos(a),
            pz = pos(z);
          const ya = G_HEAD + rowOf[a.id] * G_ROW + G_ROW / 2,
            yz = G_HEAD + rowOf[z.id] * G_ROW + G_ROW / 2;
          const xa = d.type === "SS" ? x(pa.start) : x(pa.finish) + barW(pa.start, pa.finish);
          const xz = d.type === "FF" ? x(pz.finish) + barW(pz.start, pz.finish) : x(pz.start);
          const midX = Math.max(xa + 8, xz - 8);
          deps += `<path class="gdep" d="M ${xa} ${ya} H ${midX} V ${yz} H ${xz}"/>
      <polygon class="gdep" style="fill:var(--muted)" points="${xz},${yz} ${xz - 5},${yz - 3.5} ${xz - 5},${yz + 3.5}"/>`;
        });

        /* --- contract payment milestones: drawn, never scheduled --- */
        if (pays.length) {
          const y = G_HEAD + plan.tasks.length * G_ROW,
            mid = y + G_ROW / 2;
          pays.forEach((p) => {
            const cx = x(p.date) + gZoom / 2;
            bars += `<polygon class="gpay" points="${cx},${mid - 8} ${cx + 8},${mid} ${cx},${mid + 8} ${cx - 8},${mid}" opacity="${p.invoiced ? 1 : 0.55}"><title>${esc(p.label)} · ${eur0(p.amountCents)} · ${fmtD(p.date)}${p.invoiced ? " · facturado" : ""}</title></polygon>`;
          });
          names += `<div class="gn pay">◆ Hitos de cobro</div>`;
        }

        let grid = "";
        for (let r = 0; r <= rows; r++)
          grid += `<line class="growline" x1="0" y1="${G_HEAD + r * G_ROW}" x2="${W}" y2="${G_HEAD + r * G_ROW}"/>`;

        return `<div class="gwrap">
    <div class="gnames"><div class="gh"></div>${names}</div>
    <div class="gscroll"><svg class="gsvg" id="gSvg" width="${W}" height="${H}" data-from="${from}">
      ${axis}${grid}${deps}${bars}</svg></div>
  </div>`;
      }

      /* Pointer gestures. One handler set for mouse, pen and touch — the ERP runs
   inside two WebViews and a desktop browser, and a mouse-only chart would be
   unusable on the site visit it is meant for. */
      function ganttWire(v, pid, plan, sch) {
        const svg = v.querySelector("#gSvg");
        if (!svg) return;
        const B = ganttApi(),
          cal = plan.calendar || B.defaultCalendar(),
          C = B.calendar;
        const S = {};
        if (sch)
          sch.tasks.forEach((t) => {
            S[t.taskId] = t;
          });

        v.querySelectorAll(".gn[data-task]").forEach((n) => {
          n.onclick = () => {
            gSel = n.dataset.task;
            ganttTaskDrawer(pid, n.dataset.task);
          };
        });

        const end = () => {
          if (gDrag && gDrag.rubber) gDrag.rubber.remove();
          gDrag = null;
        };

        svg.addEventListener("pointerdown", (e) => {
          const el = e.target.closest("[data-task]");
          if (!el) return;
          gDrag = {
            id: el.dataset.task,
            role: el.dataset.role || "move",
            x0: e.clientX,
            y0: e.clientY,
            moved: false,
            el,
            rubber: null,
          };
          if (gDrag.role === "link") {
            const r = document.createElementNS("http://www.w3.org/2000/svg", "path");
            r.setAttribute("class", "grubber");
            svg.appendChild(r);
            gDrag.rubber = r;
            gDrag.cx = +el.getAttribute("cx");
            gDrag.cy = +el.getAttribute("cy");
          }
          try {
            svg.setPointerCapture(e.pointerId);
          } catch (err) {}
          e.preventDefault();
        });

        svg.addEventListener("pointermove", (e) => {
          if (!gDrag) return;
          const dx = e.clientX - gDrag.x0;
          if (Math.abs(dx) > 3 || Math.abs(e.clientY - gDrag.y0) > 3) gDrag.moved = true;
          if (gDrag.role === "link") {
            const pt = svgPoint(svg, e);
            gDrag.rubber.setAttribute("d", `M ${gDrag.cx} ${gDrag.cy} L ${pt.x} ${pt.y}`);
          } else if (gDrag.role === "resize") {
            const bar = svg.querySelector(`.gbar[data-task="${gDrag.id}"]`);
            if (bar)
              bar.setAttribute(
                "width",
                Math.max(gZoom * 0.7, (+bar.dataset.w0 || +bar.getAttribute("width")) + dx),
              );
            if (bar && !bar.dataset.w0) bar.dataset.w0 = String(+bar.getAttribute("width") - dx);
          } else {
            gDrag.el.setAttribute("transform", `translate(${dx},0)`);
          }
        });

        svg.addEventListener("pointerup", (e) => {
          if (!gDrag) return;
          const { id, role, moved } = gDrag,
            dx = e.clientX - gDrag.x0;
          const hit = document.elementFromPoint(e.clientX, e.clientY);
          const target = hit && hit.closest ? hit.closest("[data-task]") : null;
          end();
          const cur = S[id];
          if (!cur) {
            render();
            return;
          }

          if (role === "link") {
            if (target && target.dataset.task !== id)
              ganttCommit(
                pid,
                B.link(plan, { predecessorId: id, successorId: target.dataset.task }),
                "Dependencia creada",
              );
            else render();
            return;
          }
          if (!moved) {
            gSel = id;
            ganttTaskDrawer(pid, id);
            return;
          }
          const days = Math.round(dx / gZoom);
          if (days === 0) {
            render();
            return;
          }
          if (role === "resize") {
            // A drag of N calendar days lands on a date; how many WORKING days that
            // is, is the calendar's answer, not this view's.
            const finish = isoAdd(cur.finish, days);
            const duration = C.workingDaysInclusive(
              cal,
              cur.start,
              finish < cur.start ? cur.start : finish,
            );
            ganttCommit(
              pid,
              B.setDuration(plan, id, Math.max(1, duration)),
              `Duración: ${Math.max(1, duration)} días laborables`,
            );
          } else {
            ganttCommit(
              pid,
              B.move(plan, id, isoAdd(cur.start, days)),
              "Tarea movida — la planificación se ha recalculado",
            );
          }
        });
        svg.addEventListener("pointercancel", () => {
          end();
          render();
        });
      }
      function svgPoint(svg, e) {
        const r = svg.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }

      function ganttNewTask(pid, milestone) {

          plan = B.get(erp.state, pid);
        const db = openDrawer(milestone ? "Nuevo hito" : "Nueva tarea de obra");
        db.innerHTML = `<div class="fgrid">
   <div class="field full"><label>${milestone ? "Hito" : "Tarea"} *</label><input id="g_title" placeholder="${milestone ? "Entrega de obra" : "Instalación eléctrica"}"></div>
   <div class="field"><label>Empieza</label><input id="g_start" type="date" value="${erp.today}"></div>
   ${milestone ? "" : `<div class="field"><label>Duración (días laborables)</label><input id="g_days" type="number" min="1" value="5"></div>`}
   <div class="field full" style="margin-top:8px"><button class="btn primary" id="g_save">Añadir a la planificación</button></div></div>`;

      function ganttFreeze(pid, plan) {

   <div class="field full" style="font-size:12.5px;color:var(--body)">Una línea base guarda la planificación tal como está hoy. No se puede modificar después: es la referencia contra la que se mide el avance real.</div>
   <div class="field full"><label>Nombre *</label><input id="g_lbl" value="Aprobada ${fmtD(erp.today)}"></div>
   <div class="field full" style="margin-top:8px"><button class="btn primary" id="g_frz">Congelar</button></div>
   ${(plan.baselines || []).length ? `<div class="field full"><label>Ya congeladas</label>${plan.baselines.map((b) => `<div class="it" style="font-size:12.5px">❄ ${esc(b.label)} · ${fmtD(b.frozenAt)} · fin ${fmtD(b.finish)}</div>`).join("")}</div>` : ""}
