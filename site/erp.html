  const vat=erp.vatSummary(q), irpf=erp.irpfSummary(q);
  const blocks=erp.packageBlocks(q), exs=erp.exceptionsWithStatus(q);
  const open=exs.filter(x=>!x.accepted), late=erp.lateDocuments(q), assets=erp.fixedAssetRegister(q);
  const sent=erp.state.packagesSent.filter(s=>s.quarter===q);
  const queries=(erp.state.gestoriaQueries||[]).filter(x=>x.quarter===q);
  const ready=open.length===0;
  v.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
    ${["2026-Q1","2026-Q2","2026-Q3","2026-Q4"].map(x=>`<button class="btn sm ${x===q?'primary':''}" data-q="${x}">${x.replace("2026-","T")}</button>`).join("")}
    <span style="flex:1"></span>
    ${sent.length?`<button class="btn sm" id="bReopen">Reabrir trimestre</button>`:""}
    <button class="btn sm" id="bQuery">Consulta a gestoría</button>
    <button class="btn primary sm" id="bSend" ${ready?"":'disabled title="Hay excepciones sin justificar"'}>📦 Generar y registrar envío</button></div>
   ${ready?"":`<div class="card" style="border-color:var(--danger);margin-bottom:12px"><div class="queuebar">
     <span class="n" style="color:var(--danger)">${open.length}</span> excepción${open.length===1?"":"es"} sin justificar bloquean el envío del ${q}.
     <span style="flex:1"></span><span class="tag">justifica cada una abajo, o corrígela en su pantalla</span></div></div>`}
   <div class="card"><div class="ch"><h3>Completitud del paquete</h3><span class="tag">${blocks.filter(b=>b.sev==="g").length}/${blocks.length} bloques en verde</span></div>
    <div style="padding:12px 14px"><div class="blocks">
    ${blocks.map(b=>`<div class="blk ${b.sev}"><div class="lab">${esc(b.label)}</div><div class="n">${b.count}</div>
      <div class="sub">${eur0(b.amountCents)}${b.issues?` · <b>${b.issues} incidencia${b.issues===1?"":"s"}</b>`:""}</div></div>`).join("")}
    </div></div></div>
   <div class="kpis">
    <div class="kpi ${vat.netCents>0?'warn':''}"><div class="lab">IVA neto (303)</div><div class="val">${eur0(vat.netCents)}</div><div class="sub">repercutido ${eur0(vat.outputVatCents)} − soportado ${eur0(vat.inputVatCents)}</div></div>
    <div class="kpi"><div class="lab">IRPF retenido (111)</div><div class="val">${eur0(irpf.retainedCents)}</div><div class="sub">a autónomos y profesionales</div></div>
    <div class="kpi"><div class="lab">Extemporáneos</div><div class="val">${late.length}</div><div class="sub">${late.filter(l=>l.alreadySent).length} ya declarados antes</div></div>
    <div class="kpi"><div class="lab">Consultas abiertas</div><div class="val">${queries.filter(x=>!x.resolvedAt).length}</div><div class="sub">de ${queries.length} en el trimestre</div></div>
   </div>
   <div class="card"><div class="ch"><h3>Excepciones antes de enviar</h3><span class="tag">${exs.length===0?"✓ limpio":`${open.length} pendientes · ${exs.length-open.length} justificadas`}</span></div>
    ${exs.length?exs.map(x=>`<div class="exrow">
      <div><span class="pill ${x.accepted?'g':'r'}">${x.accepted?"Justificada":"Pendiente"}</span></div>
      <div><b>${esc(x.label)}</b> ${esc(x.ref)}${x.accepted?`<div class="why">${esc(x.accepted.reason)} — ${esc(x.accepted.by)}, ${fmtD(x.accepted.at)}</div>`:""}</div>
      <div>${x.accepted?"":`<button class="btn sm" data-acc="${esc(x.key)}">Justificar</button>`}</div></div>`).join("")
     :'<div class="empty">Sin excepciones: el paquete puede enviarse tal cual.</div>'}
   </div>
   <div class="card"><div class="ch"><h3>IVA por tipo</h3><span class="tag">conciliado con los registros</span></div><div class="scroll"><table><thead><tr><th>Tipo</th><th class="num">Base repercutida</th><th class="num">IVA repercutido</th><th class="num">Base soportada</th><th class="num">IVA soportado</th></tr></thead><tbody>
   ${Object.entries(vat.byRate).map(([bp,r])=>`<tr><td class="k">${bp/100}%</td><td class="num">${eur(r.outputBaseCents)}</td><td class="num">${eur(r.outputVatCents)}</td><td class="num">${eur(r.inputBaseCents)}</td><td class="num">${eur(r.inputVatCents)}</td></tr>`).join("")}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Activos, vehículos y renting</h3><span class="tag">fuera del coste de obra</span></div><div class="scroll"><table><tbody>
   ${assets.map(a=>`<tr><td class="k">${esc(a.number)}</td><td>${esc(a.supplier)}</td><td>${({fixedAsset:"Inmovilizado",renting:"Renting",vehicles:"Vehículos"})[a.category]}</td><td>${fmtD(a.date)}</td><td class="num">${eur(a.baseCents)}</td></tr>`).join("")||'<tr><td><div class="empty">Nada en este trimestre.</div></td></tr>'}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Documentos extemporáneos</h3><span class="tag">llegaron después de cerrar el trimestre</span></div><div class="scroll"><table><tbody>
   ${late.map(l=>`<tr><td class="k">${esc(l.stdName||l.id)}</td><td>${fmtD(l.confirmed.date)}</td><td class="num">${eur(l.confirmed.totalCents)}</td><td>capturado ${fmtD(l.capturedAt)}</td><td>${l.alreadySent?'<span class="pill b">Ya declarado</span>':'<span class="pill y">Nuevo</span>'}</td></tr>`).join("")||'<tr><td><div class="empty">Ninguno.</div></td></tr>'}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Consultas con la gestoría</h3></div><div class="scroll"><table><tbody>
   ${queries.map(x=>`<tr><td>${esc(x.question)}</td><td>${fmtD(x.raisedAt)}</td>
     <td>${x.resolvedAt?`<span class="pill g">Resuelta</span> ${esc(x.resolution)}`:'<span class="pill y">Abierta</span>'}</td>
     <td>${x.resolvedAt?"":`<button class="btn sm" data-rq="${x.id}">Responder</button>`}</td></tr>`).join("")||'<tr><td><div class="empty">Sin consultas.</div></td></tr>'}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Envíos registrados</h3></div><div class="scroll"><table><tbody>
   ${erp.state.packagesSent.map(s=>`<tr><td class="k">${s.quarter}</td><td>${fmtD(s.date)}</td><td>${esc(s.recipient||"—")}</td>
     <td>${s.invoices} emitidas · ${s.bills} recibidas</td><td>${s.acceptedExceptions?`${s.acceptedExceptions} justificadas`:"sin excepciones"}</td>
     <td>${s.reopened?`<span class="pill y">Reabierto ${fmtD(s.reopened.reopenedAt)}</span> ${esc(s.reopened.reopenReason)}`:""}</td></tr>`).join("")||'<tr><td><div class="empty">Aún no se ha enviado ningún paquete.</div></td></tr>'}
   </tbody></table></div></div>`;
  v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{window._q=b.dataset.q;render();});
  // Justification is a free-text reason, required by the engine. Prompting for
  // it here rather than accepting a blank keeps the audit trail worth reading.
  v.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{
    const r=prompt("¿Por qué puede enviarse el paquete con esta excepción?");
    if(r===null)return;
    mutate(()=>erp.acceptException(q,b.dataset.acc,r,"backoffice"),"Excepción justificada");
  });
  v.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{
    const r=prompt("Respuesta de la gestoría:");
    if(r===null)return;
    mutate(()=>erp.resolveGestoriaQuery(b.dataset.rq,r,"backoffice"),"Consulta resuelta");
  });
  $('#bQuery').onclick=()=>{
    const t=prompt("¿Qué se pregunta a la gestoría sobre "+q+"?");
    if(t===null||!t.trim())return;
    mutate(()=>erp.addGestoriaQuery(q,t,"backoffice"),"Consulta registrada");
  };
  if($('#bReopen')) $('#bReopen').onclick=()=>{
    const r=prompt("Motivo para reabrir "+q+" (queda registrado):");
    if(r===null)return;
    mutate(()=>erp.reopenQuarter(q,r,"backoffice"),"Trimestre "+q+" reabierto");
  };
  $('#bSend').onclick=()=>{
    const to=prompt("¿A quién se envía el paquete "+q+"?","Gestoría Subirats");
    if(to===null)return;
    mutate(()=>erp.quarterlyPackage(q,{recipient:to},"backoffice"),"Paquete "+q+" generado y registrado");
  };
 },
};

/* The specification merges six built screens into three. Rather than rewrite
   them — that is S7, S8 and S11's job, with the layouts the doc actually asks
   for — each merged route is a tab strip over the existing bodies. The tab is
   remembered per route so moving away and back does not reset it, and it is
   NOT persisted: which tab you last looked at is not company data.
   `_`-prefixed entries are tab bodies, never routes; buildSubs never sees
   them because they are not in SECTIONS. */
/* DMC-07 · Alertas — where an alert is actually worked, not just seen.
   Nothing here is new: this is the manager panel the Torre used to carry,
   re-homed. It had to move because the doc says the Torre reads the whole
   chain and writes nothing, and that no panel opens from it — so the Torre
   keeps five read-only rows and every verb lives here. S3 adds the second
   tab (the rules: enabled, threshold, recipient, channel per alert code),
   which is reachable meanwhile through the ⚙ Reglas button. */
VIEWS.alerts=v=>{
  $('#sub').textContent="Asignar, poner fecha, posponer con motivo, resolver con nota y evidencia, o convertir en tarea. Las reglas viven detrás de ⚙ Reglas.";
  // managedAlerts(), not alerts(): the raw list has no key and no override, so
  // a snoozed or resolved alert would still be sitting there with buttons on it.
  v.innerHTML=alertsPanel(erp.managedAlerts());
  wireAlertsPanel();
};

/* DMC-08 · Usuarios — who may sign in, and what each may do.
   The screen that takes accounts out of the server's `.env`. Everything here
   goes through the API rather than the engine: users are not tenant business
   data, they are who is allowed to touch it, and putting them in the state
   document would mean the register carried its own access list.
   Local mode has no server and therefore no accounts, and says so rather than
   showing an empty table that looks like "nobody works here". */
const USER_ROLES=[["admin","Administrador","Todo, incluida esta pantalla."],
 ["backoffice","Oficina","Presupuestos, facturas, cobros y pagos. No gestiona usuarios."],
 ["site","Obra","Registrar avance, partes y fotos. Sin importes ni márgenes."],
 ["gestoria","Gestoría","Sólo lectura y exportación. Nunca ve márgenes ni precios de venta."]];
const USER_STATE={invited:["y","Invitado"],active:["g","Activo"],disabled:["","Desactivado"]};
let uList=[], uErr="";

async function usersApi(path,opts){
  const base=ErpStore.apiBase()||"";
  const res=await fetch(base+"/api/~/users"+(path||""),Object.assign({headers:{"content-type":"application/json"}},opts||{}));
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.message||data.error||("HTTP "+res.status));
  return data;
}

async function loadUsers(){
  try{ uList=(await usersApi("")).users||[]; uErr=""; }
  catch(e){ uList=[]; uErr=String(e.message||e); }
  render();
}

VIEWS.users=v=>{
  $('#sub').textContent="Altas, bajas y permisos. Al crear una cuenta, la persona elige su propia contraseña: nadie más la conoce.";
  // The legend is documentation, not data, so it renders with or without a
  // server: what the four permissions mean is worth being able to read while
  // deciding which one somebody should get.
  const legend=`<div class="card"><div class="ch"><h3>Qué puede hacer cada permiso</h3></div><div class="daylist">
    ${USER_ROLES.map(([,n,d])=>`<div class="it"><b>${esc(n)}</b> — ${esc(d)}</div>`).join("")}
    <div class="it" style="color:var(--muted)">Una cuenta se desactiva, nunca se borra: el registro de actividad tiene que seguir diciendo quién hizo qué. Al desactivar, sus sesiones abiertas terminan de inmediato.</div>
   </div></div>`;
  if(!ErpStore.isRemote()){
    v.innerHTML=`<div class="card"><div class="ch"><h3>Sólo en el servidor</h3></div>
     <div class="daylist"><div class="it">Esta copia funciona en modo local, sin servidor, así que no hay cuentas que gestionar. Las cuentas viven donde viven los datos.</div></div></div>${legend}`;
    return;
  }
  const rows=uList.map(u=>{
    const [cls,lab]=USER_STATE[u.state]||["","—"];
    const role=(USER_ROLES.find(r=>r[0]===u.role)||[,u.role])[1];
    return `<tr><td class="k">${esc(u.email)}</td><td>${esc(u.name||"—")}</td>
     <td>${esc(role)}</td>
     <td><span class="pill ${cls}">${esc(lab)}</span>${u.invitePending?' <span class="pill y">invitación pendiente</span>':''}</td>
     <td>${u.createdBy==="env"?'<span class="tag">en el servidor</span>':esc(u.createdBy||"—")}</td>
     <td><button class="btn sm" data-edit="${esc(u.email)}">Editar</button>
         <button class="btn sm" data-invite="${esc(u.email)}">${u.state==="invited"?"Reenviar invitación":"Restablecer contraseña"}</button></td></tr>`;}).join("");
  v.innerHTML=`${uErr?`<div class="card"><div class="ch"><h3>No se ha podido leer la lista</h3></div><div class="daylist"><div class="it">${esc(uErr)}</div></div></div>`:""}
   <div class="card"><div class="ch"><h3>Usuarios</h3><span class="tag">${uList.length}</span>
     <span style="flex:1"></span><button class="btn sm primary" id="uNew">＋ Nuevo usuario</button></div>
    <div class="scroll"><table><thead><tr><th>Correo</th><th>Nombre</th><th>Permiso</th><th>Estado</th><th>Dado de alta por</th><th></th></tr></thead>
     <tbody>${rows||'<tr><td colspan="6"><div class="empty">Sin usuarios todavía.</div></td></tr>'}</tbody></table></div></div>
   ${legend}`;
  $('#uNew').onclick=()=>newUserDrawer();
  v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editUserDrawer(b.dataset.edit));
  v.querySelectorAll('[data-invite]').forEach(b=>b.onclick=()=>inviteUser(b.dataset.invite));
  if(!uList.length&&!uErr) loadUsers();
};

/* The invitation, shown rather than claimed. `delivered` is false whenever no
   mail actually left — the screen then hands the admin the link instead of a
   success message for a message nobody will receive. */
function showInvitation(inv,email){
  const db=openDrawer("Invitación para "+email);
  db.innerHTML=`<div class="form">
   <div class="field full">${inv.delivered
     ? `<div class="pill g">Correo enviado a ${esc(email)}</div>`
     : `<div class="pill y">No se ha enviado ningún correo</div>
        <p style="font-size:12.5px;color:var(--body);margin:8px 0 0">Este servidor todavía no tiene correo configurado, así que hay que hacerle llegar este enlace a mano — por WhatsApp o en persona. La persona elige su contraseña; usted no llega a conocerla.</p>`}</div>
   <div class="field full"><label>Enlace de activación (caduca ${fmtD(inv.expiresAt.slice(0,10))})</label>
    <input id="uLink" value="${esc(inv.link)}" readonly style="font-family:ui-monospace,monospace;font-size:12px"></div>
   <div class="field full"><button class="btn primary" id="uCopy">Copiar enlace</button></div></div>`;
  $('#uCopy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(inv.link); toast("Enlace copiado"); }
    catch(e){ $('#uLink').select(); toast("Seleccionado — copie con Ctrl+C"); }
  };
}

function newUserDrawer(){
  const db=openDrawer("Nuevo usuario");
  db.innerHTML=`<div class="form">
   <div class="field full"><label>Correo electrónico</label><input id="u_email" type="email" placeholder="nombre@empresa.es"></div>
   <div class="field full"><label>Nombre</label><input id="u_name" placeholder="Cómo aparecerá en el registro de actividad"></div>
   <div class="field full"><label>Permiso</label><select id="u_role">${USER_ROLES.map(([k,n])=>`<option value="${k}">${n}</option>`).join("")}</select></div>
   <div class="field full" style="font-size:12.5px;color:var(--body)">Se creará la cuenta y se generará un enlace de activación. La persona elige su propia contraseña.</div>
   <div class="field full"><button class="btn primary" id="u_save">Crear e invitar</button></div></div>`;
  $('#u_save').onclick=async()=>{
    try{
      const r=await usersApi("",{method:"POST",body:JSON.stringify({
        email:$('#u_email').value.trim(),name:$('#u_name').value.trim(),role:$('#u_role').value})});
      closeDrawer(); await loadUsers(); showInvitation(r.invitation,r.user);

function editUserDrawer(email){
  const u=uList.find(x=>x.email===email); if(!u)return;
  const db=openDrawer(email);
  const fromEnv=u.createdBy==="env";
  db.innerHTML=`<div class="form">
   ${fromEnv?`<div class="field full"><div class="pill y">Configurado en el servidor</div>
     <p style="font-size:12.5px;color:var(--body);margin:8px 0 0">Esta cuenta está en el archivo de configuración del servidor, no en esta pantalla. Créela aquí y después retire la línea de ERP_USERS.</p></div>`:""}
   <div class="field full"><label>Nombre</label><input id="e_name" value="${esc(u.name||"")}" ${fromEnv?"disabled":""}></div>
   <div class="field full"><label>Permiso</label><select id="e_role" ${fromEnv?"disabled":""}>${USER_ROLES.map(([k,n])=>`<option value="${k}"${k===u.role?" selected":""}>${n}</option>`).join("")}</select></div>
   <div class="field full"><label>Estado</label><select id="e_state" ${fromEnv?"disabled":""}>
     <option value="active"${u.state!=="disabled"?" selected":""}>Activo</option>
     <option value="disabled"${u.state==="disabled"?" selected":""}>Desactivado</option></select></div>
   ${fromEnv?"":`<div class="field full"><button class="btn primary" id="e_save">Guardar</button></div>`}</div>`;
  if(fromEnv)return;
  $('#e_save').onclick=async()=>{
    try{
      await usersApi("/"+encodeURIComponent(email),{method:"PATCH",body:JSON.stringify({
        name:$('#e_name').value.trim(),role:$('#e_role').value,state:$('#e_state').value})});
      closeDrawer(); toast("Usuario actualizado"); await loadUsers();
    }catch(e){ toast("⚠ "+e.message); }
  };
}

async function inviteUser(email){
  const u=uList.find(x=>x.email===email);
  try{
    const r=await usersApi("/"+encodeURIComponent(email),{method:"POST",
      body:JSON.stringify({purpose:u&&u.state==="invited"?"activation":"reset"})});
    await loadUsers(); showInvitation(r.invitation,email);
  }catch(e){ toast("⚠ "+e.message); }
}

const TABBED={
  progress:[["Avance","_projectList"],["Programación","_projectSchedule"]],
  // ADM-03's first tab IS the doc's screen — bandeja and registro side by side
  // since S7. The second is the payables ledger: partial supplier payments and
  // one payment across several invoices have no screen in the v4 document, and
  // retiring the only interface that exercises those engine rules would
  // un-cover them (the distinction S1b drew over the subcontract screens).
  "supplier-invoices":[["Documentos","_docInbox"],["Facturas registradas","_supplierBills"]],
  banking:[["Cuentas y saldos","_bankAccounts"],["Conciliación","_reconcile"]],
};
const tabState={};
/** Open a route on a particular tab — how one tab hands over to its sibling. */
function goTab(route,tab){ tabState[route]=tab; go(route); render(); }
for(const [route,tabs] of Object.entries(TABBED)){
  VIEWS[route]=v=>{
    const active=tabState[route]||tabs[0][1];
    const bar=el('div','tabstrip');
    tabs.forEach(([lab,key])=>{
      const b=el('button','tab'+(key===active?' on':''),lab);
      b.dataset.tab=key;
      b.onclick=()=>{ tabState[route]=key; render(); };
      bar.appendChild(b);
    });
    v.innerHTML=''; v.appendChild(bar);
    const body=el('div'); v.appendChild(body);
    VIEWS[active](body);
  };
}

function newPartyDrawer(role){

   <div class="field full" style="margin-top:8px"><button class="btn primary" id="f_save">${cta}</button></div></div>`;
  $('#f_save').onclick=()=>{
    // A duplicate suspect is a soft warning (findDuplicateParty), never a
    // refusal — the record is still created, but the toast that would
    // otherwise say "creado" instead names what it may collide with, so it
    // is caught while the operator is still on the screen, not weeks later
    // when a factura chain gets confused between two records of one tercero.
    let rec;
    mutate(()=>{
      rec=erp.addParty({roles:[role||$('#f_role').value],name:$('#f_name').value.trim(),taxId:$('#f_tax').value.trim(),
        contactPerson:$('#f_contact').value.trim(),landline:$('#f_land').value.trim(),

      const other=erp.state.parties.find(x=>x.id===rec.duplicateSuspect);
      toast(`⚠ Posible duplicado de ${other?other.name:"un registro existente"} — revíselo`);
    } else if(rec){

    }
  };

/* ---------- COM-01 · a lead's own drawer (S4) ----------
   Identification, editable next action, the visit trail (schedule one from
   here, or open one already on the calendar), and the one manual state
   change this screen owns: marking a lead lost, with a reason. Winning is
   never a button here — it is what acceptVersion does automatically the
   moment the client accepts a presupuesto version, so a lead cannot be
   marked won without the fiscal trail (an accepted version) that justifies
   it existing. */
const OPP_STATUS={awaitingVisit:["Pendiente de visita","y"],awaitingBudget:["Pendiente de presupuesto","y"],
  awaitingResponse:["Esperando al cliente","b"],won:["Ganada","g"],lost:["Perdida","r"]};

  const o=erp.state.opportunities.find(x=>x.id===id); if(!o)return;

  const prop=o.propertyId?erp.state.properties.find(p=>p.id===o.propertyId):null;
  const visits=erp.state.visits.filter(v=>v.opportunityId===id).sort((a,b)=>(b.scheduledAt||"").localeCompare(a.scheduledAt||""));

     <div class="field full"><input id="opp_next" value="${esc(o.nextAction||"")}"></div>

    <div class="daylist">
     ${visits.map(v=>`<div class="it click" data-visit="${v.id}">
       ${v.status==="scheduled"?`📅 Programada ${fmtD(v.scheduledAt)}${v.scheduledTime?" · "+esc(v.scheduledTime):""}`
         :`✓ Realizada ${fmtD(v.completedAt)} · ${v.measurements.length} medición${v.measurements.length===1?"":"es"} · ${(v.photos||[]).length} 📷`}
      </div>`).join("")||'<div class="it">Sin visitas todavía.</div>'}
    </div></div>
   ${open?`<div style="display:flex;gap:8px;margin-top:10px">
     <button class="btn danger" id="opp_lose">Marcar como perdida</button>
   </div>`:""}`;
  db.querySelectorAll('[data-visit]').forEach(el=>el.onclick=()=>{
    const v=erp.state.visits.find(x=>x.id===el.dataset.visit);

/** Photo capture shared by completeVisitDrawer and visitDetailDrawer: upload
    or camera → compress → blob store → plain storageKey string, matching the
    shape demo visits already carry (a filename string), so one render path
    (imageUrl/paintImages) covers both real and seeded photos. */
async function captureVisitPhotos(files){
  const keys=[];
  for(const f of files){
    if(!/^image\//.test(f.type||"")){ toast("⚠ "+f.name+" no es una imagen"); continue; }
    try{
      const c=(typeof ErpBridge!=="undefined"&&ErpBridge.docs)?await ErpBridge.docs.compressImage(f):{blob:f};
      const key="img_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
      await ErpStore.putBlob(key,c.blob);
      keys.push(key);
    }catch(e){ toast("⚠ "+e.message); }
  }
  return keys;
}
function completeVisitDrawer(visitId){
  const v=erp.state.visits.find(x=>x.id===visitId); if(!v)return;
  const o=erp.state.opportunities.find(x=>x.id===v.opportunityId);
  // Local, unsaved draft — nothing is written to the visit until "Guardar".
  // Uploaded photos are the one exception: the file has to leave the <input>
  // and reach the blob store immediately or it cannot survive a re-render,
  // so those keys are held here and only LINKED to the visit on save.
  const draft={measurements:(v.measurements||[]).slice(),photos:(v.photos||[]).slice()};
  const overdue=v.scheduledAt&&v.scheduledAt<erp.today;

      const keys=await captureVisitPhotos([...input.files]);

/* The ONLY way the demo dataset is reloaded. Deliberately explicit and
   confirmed: boot() never reseeds over stored data by itself (see the schema
   guard there), so a device that already holds records keeps them until a
   person asks for this. That is also why a richer seed does not appear on its
   own after an update — you have to press this. */
function resetData(){
  // On the server this is not "reload the demo on this device" — the document
  // is the company's, so it would replace the real register, for everyone, from
  // one click behind one confirm box. The wording of that box ("en este
  // dispositivo") would also be a lie. Refused outright rather than confirmed
  // harder: there is no version of this that is safe against live data.
  if(ErpStore.isRemote()){
    alert("Estos son los datos reales de la empresa, en el servidor.\n\nNo se pueden sustituir por datos de demostración desde aquí.");
    return;
  }
  if(!confirm("¿Recargar los datos de demostración?\n\nSe sustituye TODO lo que haya ahora en este dispositivo por el conjunto de ejemplo: dos años de actividad (2024-2025) más la situación actual de 2026."))return;
  erp=ErpSeed.build(); seedPlans(); persist(); render(); toast("Datos de demostración recargados — 2024 a 2026"); }
/* A retired hash has to be normalised even when it resolves to the screen
   already on show, and even when its target is a page this shell does not own.
   Guarding on `k!==cur` did neither: arriving at #banco while already on
   banking left the dead hash in the address bar to be copied and shared, and
   #finanzas sat there rendering the wrong screen. */
window.addEventListener('hashchange',()=>{
  const raw=location.hash.slice(1), k=resolveRoute(raw);
  if(!k||!SUBMAP[k])return;
  if(SUBMAP[k].href){ location.href=SUBMAP[k].href; return; }
  if(raw!==k){ location.hash=k; return; }   // re-enters through this handler
  if(k!==cur){ cur=k; render(); }
});
boot();
</script>
</body>
</html>
