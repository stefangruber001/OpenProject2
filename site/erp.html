      /* =============================== Budget builder (spec §3.3) =========================
   Three zones at once: the chapter/line tree, the editable grid, and a totals
   panel that recalculates on every keystroke.

   ONE RULE HOLDS THIS TOGETHER: this block computes no money. Every figure on
   screen — line amounts, chapter subtotals, base, tax, withholding, total,
   margin, the value of the lines still pending a price — is asked of
   erp.budgetTotals(), which is the same function the emitted document uses. The
   "live" recalculation is therefore genuinely live rather than an optimistic
   copy that drifts from the document by a cent and is discovered by a customer.

   Editing writes through erp.updateLine(), which refuses on a frozen, issued or
   accepted version. The grid disables its inputs in that case too, but the
   refusal is the engine's, not the view's. */
      let bBudget = null,
        bChapter = null;
      const bMoney = (s) => {
        const n = Number(String(s).replace(",", "."));
        return Number.isFinite(n) ? Math.round(n * 100) : 0;
      };
      const bQty = (s) => {
        const n = Number(String(s).replace(",", "."));
        return Number.isFinite(n) ? Math.round(n * 1000) : 0;
      };
      /** Line amount and margin, exactly as budgetTotals computes them. */
      function bLineAmt(l) {
        const q = l.subLines.length
          ? l.subLines.reduce(
              (a, s) => a + Math.round(s.qtyMilli * (1 + (s.wastePct || 0) / 100)),
              0,
            )
          : l.qtyMilli;
        return {
          qtyMilli: q,
          saleCents: l.lumpSum ? l.priceCents : Math.round((q * l.priceCents) / 1000),
          costCents: l.lumpSum ? l.costCents : Math.round((q * l.costCents) / 1000),
        };
      }
      function bStatus(l) {
        return l.pending ? "pending" : l.optionalLine ? "optional" : "normal";
      }

      /* ---------- margin on a line (Package 1, slide 9) ----------
   The operator asked for margin as an INPUT expressed as a percentage, and
   for the sale price to follow from cost + that margin — "margen efectivo, es
   decir margen sobre el precio de venta". So:

       margen % = (venta − coste) / venta          venta = coste / (1 − margen)

   which is the same definition `budgetTotals.marginBasePct` and
   `projectEconomics.marginForecastPct` already use, so a line, a presupuesto
   and a job all say "40%" about the same thing.

   NOTHING NEW IS STORED. The margin is derived from the two figures the line
   already carries, so an old budget needs no migration and the number can
   never drift out of step with the money beside it.

   The sale price stays typeable even though it is "automatic": quoting a round
   number is ordinary, and typing one back-solves the margin instead of
   refusing. That keeps both directions available — which a purely derived
   field would not. */
      function bMarginPct(l) {
        if (!l.priceCents) return 0;
        return Math.round(((l.priceCents - l.costCents) / l.priceCents) * 1000) / 10;
      }
      /** Sale price implied by a cost and a margin-over-sale. Null when the margin
    cannot produce a finite price (100% of a non-zero cost is not a price). */
      function bPriceFromMargin(costCents, pct) {
        const m = Number(pct) / 100;
        if (!Number.isFinite(m) || m >= 0.9995) return null;
        return Math.round(costCents / (1 - m));
      }

      /* Blob-backed images are fetched once per session and the object URL kept.
   Revoking on every re-render would blank a thumbnail the user is still
   looking at, and the cache is bounded by the number of distinct pictures in
   the dataset, not by how often a view re-renders. */
      const IMGURL = new Map();
      async function imageUrl(key) {
        if (IMGURL.has(key)) return IMGURL.get(key);
        // On the server a picture already HAS an address, so point the <img> at it
        // and let the browser stream and cache it like any other image. Downloading
        // the bytes to build an object URL would hold every thumbnail on screen in
        // memory for as long as the page is open, and re-download them all on the
        // next visit — the response is marked immutable precisely so it need not be.
        const direct = ErpStore.blobUrl(key);
        if (direct) {
          IMGURL.set(key, direct);
          return direct;
        }
        try {
          const b = await ErpStore.getBlob(key);
          if (!b) return null;
          const u = URL.createObjectURL(b);
          IMGURL.set(key, u);
          return u;
        } catch (e) {
          return null;
        }
      }
      function paintImages(root) {
        (root || document).querySelectorAll("img[data-blob]").forEach(async (im) => {
          const u = await imageUrl(im.dataset.blob);
          if (u) im.src = u;
          else im.alt = "(imagen no disponible)";
        });
      }

      /* -------------------------- evidence viewer ---------------------------
   A thumbnail 90 px wide is proof that a photograph exists, not a look at
   what it shows — and the whole point of photographing a damp patch is that
   somebody looks at it later. The same is true of the PDF behind an
   acceptance or a signed contract: a filename is not a document. Clicking
   any picture or attachment in the workspace opens it full size, steps
   through the others in the same group with the arrow keys, and offers the
   original file for download.

   It handles BOTH kinds because a viewer that only knew about images would
   mean a second viewer for documents, and two of them drift: the arrows work
   in one and not the other, Escape closes the drawer behind one of them.
   A PDF is rendered page by page through the pdf.js already vendored for the
   capture screen — lazily, so a workspace that never opens a document never
   pays for the loader.

   It is delegated from the document rather than wired per screen: every
   picture the application renders already carries `data-blob`, and every
   attachment chip carries `data-evidence`, so visits, adicionales,
   presupuesto annexes, captured documents and backing files all inherit
   this without another line each. */
      let PV = null;
      function closePhotoViewer() {
        if (!PV) return;
        document.removeEventListener("keydown", PV.onKey, true);
        PV.node.remove();
        PV = null;
      }
      /** True when the stored blob is a PDF rather than a picture. The record
    carries the type it was stored with; a bare key (every photograph before
    this existed) is an image, which is what it always was. */
      function evidenceIsPdf(item) {
        return !!(item && typeof item === "object" && /pdf/i.test(item.type || ""));
      }
      function evidenceKey(item) {
        return typeof item === "string" ? item : item && item.storageKey;
      }
      /* Rendered PDF pages, kept for as long as the viewer is open. Re-rendering
     on every arrow press would re-decode the file each time; the cache is
     bounded by the pages of the one document being read. */
      async function renderPdfPage(key, pageNo) {
        const blob = await ErpStore.getBlob(key);
        if (!blob) return null;
        const buf = await blob.arrayBuffer();
        // ErpOcr's loader, not a bare import: it is the only place the worker
        // path is set, and without it the first render throws.
        const m = await ErpOcr.loadPdfjs();
        const doc = await m.getDocument({ data: new Uint8Array(buf) }).promise;
        const n = Math.max(1, Math.min(pageNo || 1, doc.numPages));
        const page = await doc.getPage(n);
        const vp = page.getViewport({ scale: 2 });
        const c = document.createElement("canvas");
        c.width = Math.round(vp.width);
        c.height = Math.round(vp.height);
        await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
        return { canvas: c, pages: doc.numPages };
      }
      async function openPhotoViewer(items, index) {
        closePhotoViewer();
        const node = el("div", "pview");
        node.innerHTML = `<div class="pvbar">
   <span class="pvn"></span><span style="flex:1"></span>
   <button class="btn sm" data-pv="pprev">‹ Página</button>
   <span class="pvn" data-pv="pnum"></span>
   <button class="btn sm" data-pv="pnext">Página ›</button>
   <button class="btn sm" data-pv="prev">‹ Anterior</button>
   <button class="btn sm" data-pv="next">Siguiente ›</button>
   <a class="btn sm" data-pv="dl" download>⤓ Descargar</a>
   <button class="btn sm" data-pv="close">Cerrar</button>
  </div><div class="pvimg"></div>`;
        document.body.appendChild(node);
        let i = Math.max(0, Math.min(index || 0, items.length - 1));
        let page = 1,
          pages = 1;
        const stage = node.querySelector(".pvimg");
        const show = async () => {
          const item = items[i];
          const key = evidenceKey(item);
          const pdf = evidenceIsPdf(item);
          const dl = node.querySelector("[data-pv=dl]");
          // The stored key is not a filename anyone wants in their downloads
          // folder, so the file arrives named after what it is — the name it
          // was uploaded under when there is one, and what it is when not.
          const name =
            (item && typeof item === "object" && item.name) ||
            (pdf ? "documento-" + (i + 1) + ".pdf" : "foto-" + (i + 1) + ".jpg");
          node.querySelector(".pvn").textContent =
            items.length > 1 ? i + 1 + " de " + items.length : "";
          node.querySelectorAll("[data-pv=prev],[data-pv=next]").forEach((b) => {
            b.style.display = items.length > 1 ? "" : "none";
          });
          if (pdf) {
            stage.innerHTML = '<div class="pvwait">Abriendo el documento…</div>';
            // A PDF has no object URL until its bytes are read, so the download
            // link is built from the blob rather than from the image cache.
            const blob = await ErpStore.getBlob(key);
            dl.href = blob ? URL.createObjectURL(blob) : "#";
            if (!blob) {
              stage.innerHTML = '<div class="pvwait">El archivo no está en este dispositivo.</div>';
            } else {
              try {
                const r = await renderPdfPage(key, page);
                pages = r.pages;
                stage.innerHTML = "";
                stage.appendChild(r.canvas);
              } catch (e) {
                /* The document is HERE — it just could not be drawn. That is a
               real case, not a theoretical one: the bundled pdf.js needs a
               recent browser, and an office machine that is a few versions
               behind lands exactly here. Saying "no se ha podido mostrar" and
               stopping would put the evidence one click out of reach at the
               only moment anybody wanted it, so the file is always offered
               instead — the browser's own PDF plugin can open what ours
               cannot draw. */
                stage.innerHTML = `<div class="pvwait" style="display:flex;flex-direction:column;gap:10px;align-items:center">
       <span>No se ha podido dibujar el documento aquí.</span>
       <a class="btn sm" data-pv="ext" target="_blank" rel="noopener">Abrir en una pestaña</a></div>`;
                const ext = stage.querySelector("[data-pv=ext]");
                if (ext) ext.href = dl.href;
              }
            }
          } else {
            pages = 1;
            const u = await imageUrl(key);
            stage.innerHTML = "";
            const img = new Image();
            img.alt = u ? "" : "(imagen no disponible)";
            if (u) img.src = u;
            stage.appendChild(img);
            dl.href = u || "#";
          }
          dl.setAttribute("download", name);
          // Page controls belong to a multi-page document and nothing else.
          node.querySelectorAll("[data-pv=pprev],[data-pv=pnext],[data-pv=pnum]").forEach((b) => {
            b.style.display = pdf && pages > 1 ? "" : "none";
          });
          const pn = node.querySelector("[data-pv=pnum]");
          if (pn) pn.textContent = pdf && pages > 1 ? page + " / " + pages : "";
        };
        const step = (d) => {
          i = (i + d + items.length) % items.length;
          page = 1;
          show();
        };
        const stepPage = (d) => {
          const next = page + d;
          if (next < 1 || next > pages) return;
          page = next;
          show();
        };
        node.querySelector("[data-pv=prev]").onclick = () => step(-1);
        node.querySelector("[data-pv=next]").onclick = () => step(1);
        node.querySelector("[data-pv=pprev]").onclick = () => stepPage(-1);
        node.querySelector("[data-pv=pnext]").onclick = () => stepPage(1);
        node.querySelector("[data-pv=close]").onclick = closePhotoViewer;
        node.onclick = (e) => {
          if (e.target === node || e.target.classList.contains("pvimg")) closePhotoViewer();
        };
        const onKey = (e) => {
          if (e.key === "Escape") {
            e.stopPropagation();
            closePhotoViewer();
          }
          // Inside a multi-page document the arrows read the document; between
          // documents they step the group. Reading is the commoner intent.
          else if (e.key === "ArrowLeft") pages > 1 ? stepPage(-1) : step(-1);
          else if (e.key === "ArrowRight") pages > 1 ? stepPage(1) : step(1);
        };
        // Capture phase, ahead of the drawer's own Escape handler: closing the
        // photograph must not also close the panel it was opened from.
        document.addEventListener("keydown", onKey, true);
        PV = { node, onKey };
        await show();
      }
      document.addEventListener("click", (e) => {
        const im = e.target.closest && e.target.closest("img[data-blob]");
        if (!im) return;
        // Every picture inside the same gallery is one group, so the arrows
        // step through the visit rather than through one photograph.
        const scope = im.closest(".gal") || im.closest(".card") || document;
        const keys = [...scope.querySelectorAll("img[data-blob]")].map((x) => x.dataset.blob);
        e.preventDefault();
        e.stopPropagation();
        openPhotoViewer(keys, keys.indexOf(im.dataset.blob));
      });
      /* An attachment that is not a picture has no thumbnail to click, so the
     chip itself opens it. The record travels on the element as JSON because
     the viewer needs the type and the name, not only the key. */
      document.addEventListener("click", (e) => {
        const n = e.target.closest && e.target.closest("[data-evidence]");
        if (!n) return;
        let rec = null;
        try {
          rec = JSON.parse(n.dataset.evidence);
        } catch (err) {
          rec = null;
        }
        if (!rec || !rec.storageKey) return;
        e.preventDefault();
        e.stopPropagation();
        openPhotoViewer([rec], 0);
      });

      /* --------------------------- evidence field ---------------------------
   The other half of the viewer: getting the file IN. Wherever the
   application asks for the document behind a decision — the email that
   accepted a presupuesto, the signed contract, the delivery note behind an
   extra — it asks for a FILE, through this.

   Both ways of giving it, because both are how it actually arrives: dragged
   out of the mail client on a laptop, chosen from the camera roll on a
   phone. Images are compressed on the way in, exactly as visit photographs
   are; a PDF is stored byte for byte, because a document that has been
   re-encoded is no longer the document that was signed.

   The file reaches the blob store IMMEDIATELY, before the surrounding form
   is saved. That is deliberate and it is the same rule the visit drawer
   learned: a file left in an <input> does not survive the next repaint. The
   cost is an orphaned blob if the person then abandons the form, which is
   storage the browser reclaims; the alternative cost is the person losing
   the file they just attached, which is their time. */
      const EV_ACCEPT = "image/*,application/pdf";
      function evidenceSize(n) {
        if (!n && n !== 0) return "";
        return n < 1024 * 1024
          ? Math.max(1, Math.round(n / 1024)) + " KB"
          : (n / 1024 / 1024).toFixed(1).replace(".", ",") + " MB";
      }
      /**
       * Renders an attach-a-file control into `host` and returns a handle on what
       * it is holding.
       *
       * opts.value   — an existing record to start from, or null
       * opts.prefix  — storage-key prefix, so a key says what it belongs to
       * opts.hint    — the line under the buttons; the default suits a document
       * opts.onChange— called with the record (or null) whenever it changes
       *
       * Returns { value, set, clear } — `value()` is the record to persist:
       * { storageKey, name, type, size, uploadedAt } or null.
       */
      function evidenceField(host, opts) {
        const o = opts || {};
        let rec = o.value || null;
        const emit = () => {
          if (typeof o.onChange === "function") o.onChange(rec);
        };
        const paint = () => {
          if (rec) {
            const pdf = /pdf/i.test(rec.type || "");
            host.innerHTML = `<div class="evfile">
     <span class="evth">${pdf ? "📄" : `<img data-blob="${esc(rec.storageKey)}" alt="">`}</span>
     <span style="min-width:0">
      <span class="evnm">${esc(rec.name || "Documento")}</span>
      <span class="evsz">${esc(evidenceSize(rec.size))}</span></span>
     <span class="evb">
      <button class="btn sm" data-ev="see">Ver</button>
      <button class="btn sm" data-ev="drop">Quitar</button></span>
    </div>`;
            // The picture chip paints through the same path every other
            // thumbnail does; the PDF chip has no image to paint.
            if (!pdf) paintImages(host);
            host.querySelector("[data-ev=see]").onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              openPhotoViewer([rec], 0);
            };
            host.querySelector("[data-ev=drop]").onclick = (e) => {
              e.preventDefault();
              e.stopPropagation();
              // The blob is left where it is. Deleting it here would destroy
              // the file behind an ALREADY SAVED record if the person opens
              // the form, removes the attachment and then abandons the edit.
              rec = null;
              paint();
              emit();
            };
            return;
          }
          host.innerHTML = `<div class="evz">
    <div class="evrow">
     <label class="btn sm">Buscar el archivo<input type="file" data-ev="file" accept="${EV_ACCEPT}" hidden></label>
    </div>
    <div class="evhint">${esc(o.hint || "Arrastra aquí el PDF o la imagen, o búscalo en el dispositivo.")}</div>
   </div>`;
          const zone = host.querySelector(".evz");
          const input = host.querySelector("[data-ev=file]");
          input.onchange = () => {
            const f = input.files && input.files[0];
            if (f) take(f);
          };
          // dragover must be cancelled or the browser navigates to the file.
          ["dragenter", "dragover"].forEach((ev) =>
            zone.addEventListener(ev, (e) => {
              e.preventDefault();
              zone.classList.add("over");
            }),
          );
          ["dragleave", "drop"].forEach((ev) =>
            zone.addEventListener(ev, (e) => {
              e.preventDefault();
              zone.classList.remove("over");
            }),
          );
          zone.addEventListener("drop", (e) => {
            const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (f) take(f);
          });
        };
        const take = async (f) => {
          const isImg = /^image\//.test(f.type || "");
          const isPdf = /pdf/i.test(f.type || "");
          if (!isImg && !isPdf) {
            toast("⚠ Sólo se puede adjuntar un PDF o una imagen");
            return;
          }
          host.innerHTML = '<div class="evz"><div class="evhint">Guardando el archivo…</div></div>';
          try {
            let blob = f;
            if (isImg && typeof ErpBridge !== "undefined" && ErpBridge.docs) {
              const c = await ErpBridge.docs.compressImage(f);
              if (c && c.blob) blob = c.blob;
            }
            const key =
              (o.prefix || "ev") +
              "_" +
              Date.now().toString(36) +
              "_" +
              Math.random().toString(36).slice(2, 9);
            await ErpStore.putBlob(key, blob);
            rec = {
              storageKey: key,
              name: f.name || (isPdf ? "documento.pdf" : "imagen.jpg"),
              type: isPdf ? "application/pdf" : blob.type || f.type || "image/jpeg",
              size: blob.size || f.size || 0,
              uploadedAt: erp.today,
            };
            paint();
            emit();
          } catch (e) {
            toast("⚠ No se ha podido guardar el archivo");
            paint();
          }
        };
        paint();
        return {
          value: () => rec,
          set: (r) => {
            rec = r || null;
            paint();
            emit();
          },
          clear: () => {
            rec = null;
            paint();
            emit();
          },
        };
      }

      /* ------------------------------ camera --------------------------------
   `<input type="file" capture="environment">` opens the camera on a phone and
   a FILE PICKER on a desktop, which is what the operator hit: pressing
   "Cámara" on a laptop asked them to go and find a photograph they had not
   taken yet. This asks the device for its camera and shows what it sees.

   The file input is kept as the fallback, not as the implementation: a denied
   permission, a machine with no camera, or an insecure origin all land there,
   and the message says which of those happened rather than silently opening
   a file browser. */
      function cameraAvailable() {
        return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      }
      async function capturePhoto() {
        if (!cameraAvailable()) throw new Error("Este dispositivo no ofrece cámara al navegador");
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } },
            audio: false,
          });
        } catch (e) {
          throw new Error(
            e && e.name === "NotAllowedError"
              ? "No se ha dado permiso de cámara. Puedes autorizarlo en el candado de la barra de direcciones."
              : "No se ha podido abrir la cámara: " + ((e && e.message) || e),
          );
        }
        const node = el("div", "camview");
        node.innerHTML = `<div class="cvbar"><span class="cvn">Encuadra y dispara</span><span style="flex:1"></span>
   <button class="btn sm" data-cam="cancel">Cancelar</button></div>
  <div class="cvstage"><video playsinline muted></video></div>
  <div class="cvfoot"><button class="btn primary" data-cam="shoot">Hacer la foto</button></div>`;
        document.body.appendChild(node);
        const video = node.querySelector("video");
        video.srcObject = stream;
        await video.play().catch(() => {});
        return new Promise((resolve) => {
          const finish = (file) => {
            stream.getTracks().forEach((t) => t.stop());
            document.removeEventListener("keydown", onKey, true);
            node.remove();
            resolve(file);
          };
          const onKey = (e) => {
            if (e.key === "Escape") {
              e.stopPropagation();
              finish(null);
            }
          };
          document.addEventListener("keydown", onKey, true);
          node.querySelector("[data-cam=cancel]").onclick = () => finish(null);
          node.querySelector("[data-cam=shoot]").onclick = () => {
            const c = document.createElement("canvas");
            c.width = video.videoWidth || 1280;
            c.height = video.videoHeight || 720;
            c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
            c.toBlob(
              (blob) => {
                if (!blob) return finish(null);
                finish(
                  new File([blob], "camara-" + Date.now() + ".jpg", {
                    type: "image/jpeg",
                    lastModified: Date.now(),
                  }),
                );
              },
              "image/jpeg",
              0.9,
            );
          };
        });
      }

      function openBuilder(id) {
        bChapter = null;
        bTab = "totals";
        go("quotes", id);
      }

      /* The five stages, in the order the specification lists them — which is also
   the order they matter in: what still needs writing, what is waiting on the
   customer, what was won, and then the two kinds of over. `erp.budgetStage`
   derives them; nothing here decides a status of its own. */
      const BUD_STAGES = [
        ["draft", "Borradores", "y"],
        ["issued", "Enviados", "b"],
        ["accepted", "Aceptados", "g"],
        ["rejected", "Rechazados", "r"],
        ["expired", "Caducados", "r"],
      ];

      // Package 3 slide 4: this list was a raw <table>, built before
      // renderMasterList existed — no search, no export, no pagination, on a
      // register that only grows. The stage grouping it used to show is kept
      // as an Estado column (matching how Contratos and other registers show
      // status) rather than as separate table sections, since renderMasterList
      // is a flat list; the stage order is still what the baseRows are sorted
      // by, so the same "what's unwritten first, what's closed last" reading
      // survives the search box and the pager.
      function budgetList(v) {
        $("#sub").textContent =
          "Busca por número o cliente, o crea uno nuevo desde una visita realizada o un lead abierto.";
        const stageIndex = Object.fromEntries(BUD_STAGES.map(([k], i) => [k, i]));
        const stageMeta = Object.fromEntries(BUD_STAGES.map(([k, l, t]) => [k, [l, t]]));
        const baseRows = erp.state.budgets.slice().sort((a, b) => {
          const sa = stageIndex[erp.budgetStage(a)] ?? 99,
            sb = stageIndex[erp.budgetStage(b)] ?? 99;
          return sa !== sb ? sa - sb : b.number.localeCompare(a.number);
        });
        renderMasterList(v, {
          id: "quotes",
          ids: {
            q: "bqQ",
            size: "bqSize",
            prev: "bqPrev",
            next: "bqNext",
            newBtn: "bqNew",
            exp: "bqExp",
            expMenu: "bqExpMenu",
            expXlsx: "bqExpXlsx",
            expCsv: "bqExpCsv",
          },
          newLabel: "＋ Presupuesto",
          onNew: () => newBudgetDrawer(),
          searchPlaceholder: "Buscar por número o cliente…",
          nounSingular: "presupuesto",
          nounPlural: "presupuestos",
          defSize: 25,
          baseRows,
          matches: (b, q) => (b.number + " " + erp.party(b.partyId).name).toLowerCase().includes(q),
          columns: [
            { label: "Número", primary: true, get: (b) => b.number },
            { label: "Cliente", get: (b) => erp.party(b.partyId).name },
            {
              label: "Versión",
              html: (b) => {
                const cv = b.versions[b.versions.length - 1];
                return `v${cv.vNumber} <span>· ${b.versions.length} versiones</span>`;
              },
            },
            {
              label: "Base",
              html: (b) =>
                eur0(erp.budgetTotals(b.id, b.acceptedVersionId || b.currentVersionId).baseCents),
            },
            {
              label: "Total",
              html: (b) =>
                `<b>${eur0(erp.budgetTotals(b.id, b.acceptedVersionId || b.currentVersionId).grandCents)}</b>`,
            },
            {
              label: "Pendientes",
              html: (b) => {
                const t = erp.budgetTotals(b.id, b.acceptedVersionId || b.currentVersionId);
                return t.pendingCount
                  ? `<span class="pill y">${t.pendingCount} (${eur0(t.pendingEstCents)})</span>`
                  : "—";
              },
            },
            {
              label: "Validez",
              get: (b) => b.validityDate,
              html: (b) => fmtD(b.validityDate),
            },
            {
              label: "Estado",
              get: (b) => stageMeta[erp.budgetStage(b)]?.[0] || b.status,
              html: (b) => {
                const [label, tone] = stageMeta[erp.budgetStage(b)] || [b.status, ""];
                return `<span class="pill ${tone}">${esc(label)}</span>`;
              },
            },
          ],
          onRowClick: (id) => openBuilder(id),
          emptyText: "Ningún presupuesto coincide con la búsqueda.",
        });
      }

      /** Package 3 slide 4: there was no way to start a presupuesto from this
    screen at all — every one arrived from a visit's own "＋ Crear
    presupuesto" (visitDetailDrawer), which required a visit to already
    exist and be completed. This is the same handoff generalised: pick a
    completed visit (nothing is retyped, and the visit is linked exactly as
    visitDetailDrawer already links one) OR an open lead that has not been
    visited yet — a visit should not be a prerequisite for pricing a job
    the operator already knows enough about. */
      function newBudgetDrawer() {
        const doneVisits = erp.state.visits.filter((x) => x.status === "done" && !x.budgetId);
        const openLeads = erp.state.opportunities.filter((o) =>
          ["awaitingVisit", "awaitingBudget"].includes(o.status),
        );
        let mode = doneVisits.length ? "visit" : "lead";
        const db = openDrawer("Nuevo presupuesto");
        const paint = () => {
          db.innerHTML = `
   <div class="card"><div class="ch"><h3>¿De dónde sale este presupuesto?</h3></div><div class="daylist" style="gap:9px">
    <div class="it"><label class="opt">
      <input type="radio" name="bnmode" value="visit" ${mode === "visit" ? "checked" : ""}${doneVisits.length ? "" : " disabled"}>
      <span>De una visita realizada</span></label></div>
    <div class="it" style="color:var(--muted);margin-top:-4px">${
      doneVisits.length
        ? "Las mediciones y notas de la visita quedan enlazadas al presupuesto."
        : "No hay ninguna visita realizada sin presupuesto todavía."
    }</div>
    <div class="it"><label class="opt">
      <input type="radio" name="bnmode" value="lead" ${mode === "lead" ? "checked" : ""}${openLeads.length ? "" : " disabled"}>
      <span>De un lead abierto</span></label></div>
    <div class="it" style="color:var(--muted);margin-top:-4px">${
      openLeads.length
        ? "No hace falta esperar a la visita para preparar el presupuesto."
        : "No hay ningún lead abierto todavía."
    }</div>
   </div></div>
   ${
     mode === "visit"
       ? `<div class="card"><div class="ch"><h3>Visita</h3></div><div class="daylist" style="gap:9px">
    <div class="it"><label class="opt">Visita realizada
      <select id="bn_visit" style="margin-left:auto">${doneVisits
        .map((x) => {
          const o = erp.state.opportunities.find((y) => y.id === x.opportunityId);
          return `<option value="${esc(x.id)}">${esc(fmtD(x.completedAt))} · ${esc(erp.party(o.partyId).name)} · ${esc(o.requestedWork)}</option>`;
        })
        .join("")}</select></label></div>
   </div></div>`
       : `<div class="card"><div class="ch"><h3>Lead</h3></div><div class="daylist" style="gap:9px">
    <div class="it"><label class="opt">Lead abierto
      <select id="bn_lead" style="margin-left:auto">${openLeads
        .map(
          (o) =>
            `<option value="${esc(o.id)}">${esc(erp.party(o.partyId).name)} · ${esc(o.requestedWork)}</option>`,
        )
        .join("")}</select></label></div>
   </div></div>`
   }
   <div style="margin-top:10px"><button class="btn primary" id="bn_save"${doneVisits.length || openLeads.length ? "" : " disabled"}>Crear presupuesto</button></div>`;
          db.querySelectorAll('input[name="bnmode"]').forEach((r) => {
            r.onchange = () => {
              mode = r.value;
              paint();
            };
          });
          $("#bn_save").onclick = save;
        };
        const save = () =>
          mutate(() => {
            let partyId,
              propertyId,
              visit = null;
            if (mode === "visit") {
              if (!doneVisits.length) throw new Error("No hay ninguna visita disponible");
              visit = doneVisits.find((x) => x.id === $("#bn_visit").value) || doneVisits[0];
              const o = erp.state.opportunities.find((y) => y.id === visit.opportunityId);
              partyId = o.partyId;
              propertyId = o.propertyId || visit.propertyId;
            } else {
              if (!openLeads.length) throw new Error("No hay ningún lead disponible");
              const o = openLeads.find((x) => x.id === $("#bn_lead").value) || openLeads[0];
              partyId = o.partyId;
              propertyId = o.propertyId;
            }
            const b = erp.createBudget({ partyId, propertyId }, "backoffice");
            if (visit) erp.validateVisit(visit.id, { budgetId: b.id }, "backoffice");
            closeDrawer();
            go("quotes", b.id);
          }, "Presupuesto creado");
        paint();
      }

      /* ---------- The customer document's own vocabulary (COM-03, "ES/CA output")
   These labels are NOT in the i18n dictionary, and the block that prints them
   carries `translate="no"`, on purpose. The dictionary translates the
   INTERFACE for whoever is at the screen; this table translates a DOCUMENT for
   whoever receives it. They are different people making different choices:
   `budget.language` is a field an estimator sets per customer, and it must not
   move because a colleague prefers to work in English. Keeping the document
   out of the toggle is what makes both behaviours correct at once. */
      const DOCL = {
        es: {
          doc: "PRESUPUESTO",
          base: "Base imponible",
          options: "Opcionales (aparte)",
          vat: "IVA",
          total: "TOTAL",
          perM2: "Total por m²",
          pending: "⚠ Líneas pendientes de precio (no incluidas)",
          annex: "Anexo gráfico",
          page: "página",
          of: "de",
          item: "partida",
          validity: "Validez",
          exclusions: "Exclusiones",
          assumptions: "Supuestos",
          sections: {
            base: "",
            optional: " (opcional — aparte)",
            outOfScope: " (fuera de presupuesto)",
            extras: " (extras)",
          },
        },
        ca: {
          doc: "PRESSUPOST",
          base: "Base imposable",
          options: "Opcionals (a part)",
          vat: "IVA",
          total: "TOTAL",
          perM2: "Total per m²",
          pending: "⚠ Partides pendents de preu (no incloses)",
          annex: "Annex gràfic",
          page: "pàgina",
          of: "de",
          item: "partida",
          validity: "Validesa",
          exclusions: "Exclusions",
          assumptions: "Supòsits",
          sections: {
            base: "",
            optional: " (opcional — a part)",
            outOfScope: " (fora de pressupost)",
            extras: " (extres)",

      const SECL = {
        base: "Base",
        optional: "Opcional",
        outOfScope: "Fuera de presupuesto",
        extras: "Extras",
      };
      /* Which of the two right-hand tabs is showing. Module state, not per-render,
   so that editing a row does not throw the estimator back to Totales while
   they are reading the visit report they are pricing from. */
      let bTab = "totals";

      /** The visit this presupuesto is being written from, if there is one.
    Preferring the explicit link (S4's `visit.budgetId`) and falling back to
    the customer's own last capture — labelled as the guess it is, because a
    report from the wrong visit is worse than no report at all. */
      function budgetVisit(b) {
        const linked = erp.state.visits.find((x) => x.budgetId === b.id);
        if (linked) return { visit: linked, linked: true };
        const mine = erp.state.visits
          .filter((x) => x.status === "done")
          .filter((x) => {
            const o = erp.state.opportunities.find((y) => y.id === x.opportunityId);
            return o && o.partyId === b.partyId;
          })
          .sort((x, y) => (y.completedAt || "").localeCompare(x.completedAt || ""));
        return mine.length ? { visit: mine[0], linked: false } : null;
      }

      function budgetBuilder(v, id) {

        const locked = V.frozen || V.issued || b.acceptedVersionId === V.id;
        const dis = locked ? " disabled" : "";
        const stage = erp.budgetStage(b);
        const meta = BUD_STAGES.find((s) => s[0] === stage) || ["draft", "Borrador", "y"];
        const t = erp.budgetTotals(id, vsel);
        // Outside the shell, per §3.2: the rail, breadcrumb and page heading go, and
        // the three panes get the room. render() takes the class off again on the
        // way to any other screen.

        v.innerHTML = `
   <div class="pb">

     ${
       b.versions.length > 1
         ? // Package 2 slide 2: the header named the version being edited but
           // offered no way to REACH any other one. Every version already
           // renders in full through budgetDrawer — this just makes them
           // reachable from the one screen the operator is actually looking
           // at, instead of only from the "Versiones" list buried inside
           // Vista previa.
           `<select id="bVerPick" title="Ir a otra versión" style="max-width:130px">
       ${b.versions

         .reverse()
         .map(

             `<option value="${esc(x.id)}"${x.id === vsel ? " selected" : ""}>v${x.vNumber}${x.id === b.acceptedVersionId ? " · aceptada" : x.issued ? " · emitida" : " · borrador"}</option>`,

     }
     <span class="pill ${meta[2]}">${meta[1]}</span>
     ${locked && stage !== "accepted" ? '<span class="pill b">Congelada</span>' : ""}
     <div class="tot"><span>Total</span><b id="pbTotal">${eur(t.grandCents)}</b></div>
     <div class="acts">
      ${locked && !b.acceptedVersionId ? '<button class="btn sm" id="bNewVer">Nueva versión</button>' : ""}
      <button class="btn sm" id="bSave">Guardar</button>
      <button class="btn sm" id="bPreview">Vista previa</button>
      ${
        V.issued && !V.customerResponse && !b.acceptedVersionId
          ? '<button class="btn primary sm" id="bAnswer">Respuesta del cliente</button>'
          : ""
      }
      ${locked ? "" : '<button class="btn primary sm" id="bSend">Enviar</button>'}
     </div>
    </div>

    <div class="pbpanes">
     <div class="pbpane">
      <div class="pbh">Capítulos<span style="flex:1"></span>
       ${locked ? "" : '<button class="btn sm" id="bAddChap">+</button>'}</div>
      <div class="btree" id="bTree" style="max-height:none"></div>
     </div>

     <div class="pbpane mid bgrid">
      <div class="pbh">Partidas<span style="flex:1"></span><span class="tag" id="bGridTag"></span></div>
      <!-- Column order and names come from Package 1 slide 9, and they are the
           order the work is actually done in: say what it is, in what unit, what
           it costs us, what we put on it, how much of it, and only then what the
           customer pays. Cost and margin sit BEFORE the sale price because the
           sale price is derived from them (see bPriceFromMargin), not typed
           alongside them. -->
      <div class="scroll"><table><thead><tr>
        <th style="width:16px"></th><th>Nº</th><th>Código</th><th>Descripción</th><th>Unidad</th>
        <th class="num int">Coste unitario</th><th class="num int">Margen unit. %</th>
        <th class="num">Cantidad</th><th class="num">P. unitario venta</th><th class="num">Precio total</th>
        <th>Estado</th><th>Imágenes</th>${locked ? "" : "<th></th>"}

      let bDrag = null; // {kind:"chapter"|"line", id}
      function bDragClear() {

      /** What can be picked up. `mark` is the element that dims while it travels —

      function bDragSource(el, kind, dragId, mark) {
        el.draggable = true;
        el.addEventListener("dragstart", (e) => {
          bDrag = { kind, id: dragId };
          (mark || el).classList.add("drag");
          e.dataTransfer.effectAllowed = "move";
          try {
            e.dataTransfer.setData("text/plain", dragId);
          } catch (err) {

          }
        });
        el.addEventListener("dragend", () => {
          bDrag = null;
          bDragClear();
        });

      /** Where it can be put down. */
      function bDropTarget(el, accept, onDrop) {
        el.addEventListener("dragover", (e) => {
          if (!bDrag || !accept(bDrag)) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "move";
          el.classList.add("over");

          if (!bDrag || !accept(bDrag)) return;
          e.preventDefault();
          e.stopPropagation();
          const d = bDrag;
          bDrag = null;
          bDragClear();
          onDrop(d);
        });
