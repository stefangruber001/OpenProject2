 /* ---------- Seguimiento económico de obra (spec §4.4) ----------
    Presupuestado · comprometido · real · proyectado · desviación · margen, por
    capítulo. The column that matters is "proyectado": "spent 40 of 100" reads
    as comfortable and says nothing, while "spent 40 to get a quarter of the way,
    so heading for 160" is the sentence somebody can act on. It is computed by
    @repo/capability-projects, never here. */
 economia(v){
  $('#sub').textContent="Presupuestado, comprometido, real y proyectado a fin de obra por capítulo, con la desviación y el margen que resultan. La proyección se calcula del avance real y del coste unitario observado, y puede ajustarse a mano justificando el motivo.";
  const P=erp.state.projects;
  if(!P.length){ v.innerHTML='<div class="card"><div class="empty">Todavía no hay proyectos.</div></div>'; return; }
  const pid=gProject;
  const f=(typeof ErpBridge!=="undefined"&&ErpBridge.projects)?ErpBridge.projects.forecast(erp,pid):null;
  if(!f){ v.innerHTML='<div class="card"><div class="empty">El seguimiento económico necesita el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>'; return; }
  const names={};
  try{ (erp.project(pid).baseline.chapters||[]).forEach(c=>{names[c.num]=c.name;}); }catch(e){}
  const over=new Set(f.overrunChapters);

  v.innerHTML=`
   <div class="kpis">
    <div class="kpi"><div class="lab">Venta actual</div><div class="val">${eur0(f.revenueCents)}</div><div class="sub">contratada + extras aprobados</div></div>
    <div class="kpi"><div class="lab">Coste real</div><div class="val">${eur0(f.actualCents)}</div><div class="sub">comprometido ${eur0(f.committedCents)}</div></div>
    <div class="kpi ${f.varianceCents>0?'warn':''}"><div class="lab">Coste proyectado</div><div class="val">${eur0(f.forecastCents)}</div><div class="sub">presupuestado ${eur0(f.budgetCents)} · ${f.varianceCents>0?"+":""}${eur0(f.varianceCents)}</div></div>
    <div class="kpi ${f.marginForecastCents<0?'warn':'hi'}"><div class="lab">Margen proyectado</div><div class="val">${eur0(f.marginForecastCents)}</div><div class="sub">${(f.marginForecastBp/100).toFixed(1)}% sobre la venta actual</div></div>
   </div>
   <div class="card"><div class="ch"><h3>Por capítulo</h3>
     ${over.size?`<span class="pill r">${over.size} capítulo(s) por encima del umbral</span>`:'<span class="tag">ninguno supera el umbral de desviación</span>'}</div>
    <div class="scroll"><table><thead><tr>
      <th>Capítulo</th><th class="num">Avance</th><th class="num">Presupuestado</th><th class="num">Comprometido</th>
      <th class="num">Real</th><th class="num">Proyectado</th><th class="num">Desviación</th><th class="num">%</th><th></th>
    </tr></thead><tbody>
    ${f.byChapter.map(c=>`<tr>
      <td class="k">${c.chapter}. ${esc(names[c.chapter]||"—")}${c.adjustedCents!=null?`<span class="adj" title="${esc(c.adjustmentReason||"")}">ajustada</span>`:""}${c.provisional?'<span class="adj" title="Muy poco avance para extrapolar con sentido">provisional</span>':""}</td>
      <td class="num">${c.progressPct}%</td>
      <td class="num">${eur0(c.budgetCents)}</td>
      <td class="num">${c.committedCents?eur0(c.committedCents):"—"}</td>
      <td class="num">${eur0(c.actualCents)}</td>
      <td class="num k">${eur0(c.forecastCents)}${c.adjustedCents!=null?`<br><span style="font-size:10.5px;color:var(--muted)">calculada ${eur0(c.calculatedCents)}</span>`:""}</td>
      <td class="num ${c.varianceCents>0?"warn":c.varianceCents<0?"good":""}">${c.varianceCents>0?"+":""}${eur0(c.varianceCents)}</td>
      <td class="num ${over.has(c.chapter)?"warn":""}">${(c.varianceBp/100).toFixed(1)}%</td>
      <td><button class="btn sm" data-adj="${c.chapter}">Ajustar</button></td></tr>`).join("")}
    <tr class="tot"><td>Total</td><td></td><td class="num">${eur0(f.budgetCents)}</td><td class="num">${eur0(f.committedCents)}</td>
      <td class="num">${eur0(f.actualCents)}</td><td class="num">${eur0(f.forecastCents)}</td>
      <td class="num">${f.varianceCents>0?"+":""}${eur0(f.varianceCents)}</td><td class="num">${(f.varianceBp/100).toFixed(1)}%</td><td></td></tr>
    </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Cómo se calcula</h3><span class="tag">FIN-01 a FIN-18</span></div><div class="daylist">
     <div class="it">La proyección de cada capítulo parte del coste real y del avance registrado: gastar 40 para llegar al 25% proyecta 160. Nunca queda por debajo de lo ya gastado o comprometido, y mientras no haya coste imputado se mantiene el presupuesto — un capítulo terminado sin factura casi siempre significa que la factura no ha llegado, no que fuese gratis.</div>
     <div class="it">Proyección total calculada <b>${eur0(f.calculatedCents)}</b>${f.calculatedCents!==f.forecastCents?` · con los ajustes manuales <b>${eur0(f.forecastCents)}</b>`:""}. Se muestran ambas cifras siempre que difieran.</div>
   </div></div>`;

  v.querySelectorAll('[data-adj]').forEach(b=>b.onclick=()=>forecastDrawer(pid,b.dataset.adj,names[b.dataset.adj]||"",
    f.byChapter.find(c=>c.chapter===b.dataset.adj)));
 },

 /* ---------- Seguimiento técnico: la carta Gantt (§3.3 · §4.3) ---------- */
 seguimiento(v){
  $('#sub').textContent="Carta Gantt derivada del presupuesto aceptado, avance por partida o por cantidad ejecutada, y desviación frente a la línea base. Arrastra una barra para moverla, tira del borde para alargarla y une dos barras para crear una dependencia.";
  const P=erp.state.projects;
  if(!P.length){ v.innerHTML='<div class="card"><div class="empty">Todavía no hay proyectos que planificar.</div></div>'; return; }
  const B=ganttApi();
  if(!B){ v.innerHTML='<div class="card"><div class="empty">La planificación necesita el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>'; return; }

  const pid=gProject, plan=B.get(erp.state,pid), sch=B.schedule(plan);
  const cmp=gBaseline?B.compareToBaseline(plan):null;
  const pays=ErpBridge.scheduling.paymentMilestones(erp,pid);
  const cal=plan.calendar||B.defaultCalendar();
  const crit=sch?sch.criticalPath.length:0;
  /* Every figure in the deviations panel and both curves come from
     @repo/capability-scheduling. This view draws them and computes none. */
  const curve=B.curve(plan,{asOf:erp.today,weights:planWeights(pid,plan)});
  const risk=B.risk(plan,{asOf:erp.today,thresholdDays:5});

  v.innerHTML=`<div class="trk"><div>
   <div class="card"><div class="gtools">
     <button class="btn sm" id="gAdd">＋ Tarea</button>
     <button class="btn sm" id="gAddMs">◆ Hito</button>
     <button class="btn sm${plan.tasks.length?"":" primary"}" id="gDerive" title="Vuelve a derivar la planificación de los capítulos y partidas del presupuesto aceptado, conservando el avance registrado">↻ Derivar del presupuesto</button>
     <span style="flex:1"></span>
     ${sch&&plan.tasks.length?`<span class="chip">Fin de obra <b>${fmtD(sch.finish)}</b></span>
     <span class="chip">Ruta crítica <b>${crit}</b> de ${plan.tasks.length}</span>`:""}
     ${cmp?`<span class="chip" title="Desvío frente a la línea base, en días laborables">Línea base «${esc(cmp.label)}» <b style="color:${cmp.finishDriftDays>0?'var(--danger)':'var(--greenDeep)'}">${cmp.finishDriftDays>0?"+":""}${cmp.finishDriftDays} d</b></span>`:""}
     <select class="inline" id="gZoom">${[[14,"Mes"],[24,"Semanas"],[38,"Días"]].map(([z,l])=>`<option value="${z}"${gZoom===z?" selected":""}>${l}</option>`).join("")}</select>
     ${plan.baselines&&plan.baselines.length?`<button class="btn sm${gBaseline?" primary":""}" id="gBl">Línea base</button>`:""}
     <button class="btn sm" id="gFreeze" title="Congelar la planificación actual como referencia">❄ Congelar</button>
   </div>
   ${plan.tasks.length?ganttChart(plan,sch,cmp,pays):`<div class="empty">Sin planificación. «Derivar del presupuesto» la construye a partir de los capítulos y partidas aceptados: la duración de cada capítulo sale de sus cantidades y del rendimiento diario del oficio.</div>`}
   <div class="glegend">
     <span><i style="background:var(--green)"></i>Tarea</span>
     <span><i style="background:var(--danger)"></i>Ruta crítica — un día perdido aquí es un día perdido en la obra</span>
     <span><i style="background:var(--greenDeep);border-radius:2px;transform:rotate(45deg)"></i>Hito</span>
     <span><i style="background:var(--blue)"></i>Hito de cobro del contrato</span>
     ${cmp?`<span><i style="background:transparent;border:1px dashed var(--faint)"></i>Línea base congelada</span>`:""}
     <span><i style="background:var(--hair)"></i>Día no laborable</span>
   </div>
   <div class="gtools" style="border-top:1px solid var(--hair)">
     <span style="font:600 11px var(--sans);color:var(--muted)">DÍAS NO LABORABLES</span>
     ${(cal.nonWorkingDates||[]).map(d=>`<span class="chip"><b>${fmtD(d)}</b><button data-nw="${d}" title="Quitar">✕</button></span>`).join("")||'<span class="chip">ninguno</span>'}
     <input class="dt" type="date" id="gNw"><button class="btn sm" id="gNwAdd">Añadir</button>
     <span style="font-size:11.5px;color:var(--muted)">Semana laboral: ${cal.workingWeekdays.length} días</span>
   </div></div>

   ${curve?`<div class="card"><div class="ch"><h3>Curva S</h3>
     <span class="tag">planificado ${curve.plannedPct}% · real ${curve.actualPct}% · ${curve.driftPct>=0?"+":""}${curve.driftPct} pts</span></div>
     ${curveChart(curve)}
     <div class="glegend">
       <span><i style="background:var(--faint)"></i>Planificado</span>
       <span><i style="background:var(--green)"></i>Real registrado</span>
       <span><i style="background:var(--spark)"></i>Proyectado al ritmo observado${curve.performanceIndex!=null?` (×${curve.performanceIndex})`:""}</span>
       <span>Fin previsto ${fmtD(curve.plannedFinish)} → proyectado <b>${fmtD(curve.projectedFinish)}</b></span>
     </div></div>`:""}

   ${progressTable(pid,plan)}
  </div>

  <div class="bside">
   <div class="card" style="margin:0"><div class="ch"><h3>Desviaciones</h3>
     ${risk&&risk.overThreshold?'<span class="pill r">Supera el umbral</span>':''}</div>
    <div class="daylist" style="padding:10px 14px">
     ${risk?`<div class="row" style="display:flex;justify-content:space-between"><span>Retraso sobre línea base</span><b style="color:${risk.delayDays>0?'var(--danger)':'var(--greenDeep)'}">${risk.delayDays>0?"+":""}${risk.delayDays} d</b></div>
      <div class="row" style="display:flex;justify-content:space-between"><span>Tareas críticas en riesgo</span><b>${risk.criticalAtRisk}</b></div>
      ${risk.baselineFinish?`<div class="row" style="display:flex;justify-content:space-between;color:var(--muted)"><span>Prometido</span><b>${fmtD(risk.baselineFinish)}</b></div>`:'<div class="row" style="color:var(--muted)">Sin línea base congelada: no hay promesa contra la que medir.</div>'}`
      :'<div class="row" style="color:var(--muted)">Sin planificación.</div>'}
    </div>
    ${risk&&risk.items.length?`<div style="padding:0 14px 12px">
      ${risk.items.slice(0,12).map(i=>`<div class="riskitem">
        <span class="pill ${i.kind==="overdue"?"r":i.kind==="not_started"?"y":"b"}">${({overdue:"Vencida",not_started:"Sin empezar",behind:"Retrasada"})[i.kind]}</span>
        <span class="t">${esc(i.title)}${i.critical?' <span class="pill r">crítica</span>':""}</span>
        <b>${i.kind==="behind"?`${i.actualPct}/${i.plannedPct}%`:`${i.days} d`}</b></div>`).join("")}
      ${risk.items.length>12?`<div class="riskitem" style="color:var(--muted)">…y ${risk.items.length-12} más</div>`:""}
     </div>`:risk?'<div class="daylist" style="padding:0 14px 12px"><div class="it">Nada fuera de plazo.</div></div>':''}
   </div>
  </div></div>`;

  $('#gZoom').onchange=e=>{gZoom=+e.target.value;render();};
  const bl=$('#gBl'); if(bl) bl.onclick=()=>{gBaseline=!gBaseline;render();};
  $('#gAdd').onclick=()=>ganttNewTask(pid,false);
  $('#gAddMs').onclick=()=>ganttNewTask(pid,true);
  $('#gDerive').onclick=()=>deriveFromBudget(pid,cal);
  $('#gFreeze').onclick=()=>ganttFreeze(pid,plan);
  $('#gNwAdd').onclick=()=>{
    const d=$('#gNw').value; if(!d)return;
    ganttCommit(pid,B.setCalendar(plan,{...cal,nonWorkingDates:[...new Set([...(cal.nonWorkingDates||[]),d])].sort()}),"Día no laborable añadido");
  };
  v.querySelectorAll('[data-nw]').forEach(b=>b.onclick=()=>{
    ganttCommit(pid,B.setCalendar(plan,{...cal,nonWorkingDates:(cal.nonWorkingDates||[]).filter(x=>x!==b.dataset.nw)}),"Día no laborable quitado");
  });
  wireProgressTable(pid,plan);
  ganttWire(v,pid,plan,sch);
 },

 /* ---------- Compras · Subcontratos · Modificaciones · Horas (§4.1/§4.2/§4.5/§4.6) ----------
    Defined once, above, as standalone functions — project-scoped through
    gProject like proyectos/seguimiento/economía, so they are referenced here
    rather than re-implemented inline. */
 compras,
 subcontratos,
 modificaciones,
 horas,

 /* ---------- Facturación y cobros (AR) ---------- */
 facturacion(v){
  $('#sub').textContent="Facturas generadas desde el presupuesto aceptado, los hitos del contrato o los extras aprobados. Numeración sin huecos; las emitidas son inmutables.";
  const all=erp.receivables();
  const issued={}; erp.state.invoices.forEach(i=>{issued[i.number]=i.date;});
  const rows=all.filter(r=>inPeriod(issued[r.number]));
  v.innerHTML=`${periodNote(rows.length,all.length)}<div class="card"><div class="ch"><h3>Facturas</h3><span class="tag">pendiente total ${eur0(rows.reduce((s,r)=>s+r.outstandingCents,0))}</span></div>
   <div class="scroll"><table><thead><tr><th>Número</th><th>Cliente</th><th>Proyecto</th><th class="num">Total</th><th class="num">Pendiente</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>
   ${rows.map(r=>{const st=r.outstandingCents<=0?'<span class="pill g">Cobrada</span>':r.daysOverdue>0?`<span class="pill r">Vencida ${r.daysOverdue}d</span>`:'<span class="pill y">Pendiente</span>';
    return `<tr><td class="k">${r.number}</td><td>${esc(r.party)}</td><td>${erp.project(r.projectId).code}</td>
     <td class="num">${eur(r.totalCents)}</td><td class="num k">${r.outstandingCents>0?eur(r.outstandingCents):"—"}</td><td>${fmtD(r.dueDate)}</td><td>${st}</td>
     <td>${r.outstandingCents>0?`<button class="btn sm" data-collect="${r.number}">Registrar cobro</button>`:""}</td></tr>`;}).join("")}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Recibos emitidos</h3></div><div class="scroll"><table><tbody>
   ${erp.state.receipts.map(r=>`<tr><td class="k">${r.number}</td><td>${esc(erp.party(r.partyId).name)}</td><td class="num">${eur(r.amountCents)}</td><td>${r.method==="cash"?"Efectivo":"Transferencia"}</td><td>${fmtD(r.date)}</td></tr>`).join("")||'<tr><td><div class="empty">Sin recibos.</div></td></tr>'}
   </tbody></table></div></div>`;
  v.querySelectorAll('[data-collect]').forEach(b=>b.onclick=()=>{
    const num=b.dataset.collect; const inv=erp.state.invoices.find(i=>i.number===num);
    const out=erp.invoiceOutstandingCents(inv.id);
    mutate(()=>erp.recordCollection({partyId:inv.partyId,amountCents:out,method:"transfer",allocations:[{invoiceId:inv.id,amountCents:out}]},"backoffice"),"Cobro registrado: "+eur(out));
  });
 },

 /* ---------- Proveedores y pagos (AP) ---------- */
 pagos(v){
  $('#sub').textContent="Facturas de proveedor con base, IVA y retención IRPF según el perfil fiscal. Pagos parciales y un pago para varias facturas.";
  const rows=erp.payables();
  v.innerHTML=`<div class="card"><div class="ch"><h3>Facturas de proveedor</h3><span class="tag">pendiente ${eur0(rows.reduce((s,r)=>s+Math.max(0,r.outstandingCents),0))}</span></div>
   <div class="scroll"><table><thead><tr><th>Proveedor</th><th>Nº factura</th><th class="num">Total</th><th class="num">Pendiente</th><th>Vence</th><th>Asignación</th><th>Estado</th><th></th></tr></thead><tbody>
   ${rows.map(r=>{const st={paid:'<span class="pill g">Pagada</span>',partPaid:'<span class="pill y">Parcial</span>',overdue:'<span class="pill r">Vencida</span>',disputed:'<span class="pill r">En disputa</span>',registered:'<span class="pill y">Registrada</span>'}[r.status]||r.status;
    return `<tr><td class="k">${esc(r.supplier)}</td><td>${esc(r.number)}</td><td class="num">${eur(r.totalCents)}</td>
     <td class="num k">${r.outstandingCents>0?eur(r.outstandingCents):"—"}</td><td>${fmtD(r.dueDate)}</td>
     <td>${r.unallocated?'<span class="pill r">Sin asignar</span>':'<span class="pill g">Asignada</span>'}</td><td>${st}</td>
     <td>${r.outstandingCents>0?`<button class="btn sm" data-pay="${r.id}">Pagar</button>`:""}</td></tr>`;}).join("")}
   </tbody></table></div></div>`;
  v.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{
    const bill=erp.state.bills.find(x=>x.id===b.dataset.pay); const out=erp.billOutstandingCents(bill.id);
    mutate(()=>erp.payBills({amountCents:out,method:"transfer",billAllocations:[{billId:bill.id,amountCents:out}]},"backoffice"),"Pago registrado: "+eur(out));
  });
 },

 /* ---------- Banco y caja (BNK) ---------- */
 banco(v){
  $('#sub').textContent="Importa los movimientos y teclea el número de proyecto sobre cualquier movimiento: el coste queda asignado a esa obra sin volver a escribir nada.";
  const cf=erp.cashForecast(6);
  const movAll=erp.state.movements, movs=movAll.filter(m=>inPeriod(m.accountingDate));
  v.innerHTML=`<div class="kpis" style="grid-template-columns:repeat(${erp.state.bankAccounts.length+1},1fr)">
    ${erp.state.bankAccounts.map(a=>`<div class="kpi"><div class="lab">${esc(a.name)}</div><div class="val">${eur0(erp.accountBalanceCents(a.id))}</div><div class="sub">${a.kind==="till"?"caja":"banco"}</div></div>`).join("")}
    <div class="kpi hi"><div class="lab">Total disponible</div><div class="val">${eur0(erp.cashPosition().totalCents)}</div><div class="sub">bancos + caja</div></div></div>
   ${periodNote(movs.length,movAll.length)}
   <div class="card"><div class="ch"><h3>Movimientos</h3><span class="tag">escribe el nº de proyecto para asignar (p. ej. P-2026-0001)</span></div>
   <div class="scroll"><table><thead><tr><th>Fecha</th><th>Concepto</th><th class="num">Importe</th><th>Clase</th><th>Asignación</th></tr></thead><tbody>
   ${movs.slice().reverse().map(m=>{
     const cls={projectCost:"Coste de obra",overhead:"Gasto general",tax:"Impuestos",salary:"Nóminas",financial:"Financiero",internalTransfer:"Traspaso interno",customerReceipt:"Cobro de cliente"}[m.class]||"—";
     const alloc=m.allocations.length?m.allocations.map(a=>(a.projectId?erp.project(a.projectId).code:a.overheadCategory)+(a.kind?` · ${a.kind}`:"")).join(", "):null;
     return `<tr><td>${fmtD(m.accountingDate)}</td>
      <td>${esc(m.merchantText||m.counterparty||m.concept)}${m.card?` <span class="pill b">${m.card}</span>`:""}${m.needsDoc?' <span class="pill r">Falta justificante</span>':''}</td>
      <td class="num" style="color:${m.amountCents<0?'var(--danger)':'var(--greenDeep)'}">${eur(m.amountCents)}</td>
      <td>${m.class?`<span class="pill ${m.class==="internalTransfer"?"b":m.class==="customerReceipt"?"g":""}">${cls}</span>`:'<span class="pill r">Sin clasificar</span>'}</td>
      <td>${alloc?esc(alloc):(m.status==="unallocated"?`<input class="inline" placeholder="Nº proyecto" data-mov="${m.id}"> <select class="inline" data-kind="${m.id}"><option value="material">Material</option><option value="labour">Mano de obra</option><option value="subcontract">Industrial</option><option value="other">Otro</option></select>`:"—")}</td></tr>`;}).join("")}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Previsión de caja — próximas 6 semanas</h3></div><div class="scroll"><table><thead><tr><th>Semana</th><th class="num">Cobros previstos</th><th class="num">Pagos previstos</th><th class="num">Neto</th></tr></thead><tbody>
   ${cf.map(w=>`<tr><td>${fmtD(w.from)} – ${fmtD(w.to)}</td><td class="num">${eur0(w.inflowCents)}</td><td class="num">${eur0(w.outflowCents)}</td><td class="num" style="color:${w.netCents<0?'var(--danger)':'var(--greenDeep)'}">${eur0(w.netCents)}</td></tr>`).join("")}
   </tbody></table></div></div>`;
  v.querySelectorAll('input[data-mov]').forEach(inp=>inp.onkeydown=(e)=>{
    if(e.key!=="Enter")return;
    const kind=v.querySelector(`select[data-kind="${inp.dataset.mov}"]`).value;
    mutate(()=>erp.allocateMovementToProject(inp.dataset.mov,inp.value.trim(),kind,"backoffice"),"Movimiento asignado a "+inp.value.trim());
  });
 },

 /* ---------- Precios y costes (SUP/CAT) ---------- */
 precios(v){
  $('#sub').textContent="Catálogo de partidas y precios por proveedor con fecha y documento de origen. Un precio ausente se ve ausente — nunca cuenta como cero.";
  const sups=erp.state.parties.filter(p=>p.roles.some(r=>["supplier","subcontractor"].includes(r)));
  const cmp=erp.comparePrices(erp.state.catalogue.map(i=>i.id),sups.map(s=>s.id));
  v.innerHTML=`<div class="card"><div class="ch"><h3>Comparativa de precios por partida</h3><span class="tag">neto por proveedor</span></div>
   <div class="scroll"><table><thead><tr><th>Partida</th>${sups.map(s=>`<th class="num">${esc(s.name.split(" ")[0])}</th>`).join("")}<th class="num">Mejor</th></tr></thead><tbody>
   ${cmp.map(row=>{const it=erp.state.catalogue.find(i=>i.id===row.itemId);
    return `<tr><td class="k">${esc(it.code)} · ${esc(it.desc)}</td>
     ${row.perSupplier.map(ps=>`<td class="num">${ps.missing?'<span class="pill y">Sin precio</span>':eur(ps.netCents)}</td>`).join("")}
     <td class="num k">${row.bestCents!=null?eur(row.bestCents):"—"}</td></tr>`;}).join("")}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Histórico de precios</h3><span class="tag">con origen y vigencia (nunca se sobrescribe)</span></div>
   <div class="scroll"><table><thead><tr><th>Partida</th><th>Proveedor</th><th>Fecha</th><th class="num">Lista</th><th class="num">Dto.</th><th class="num">Neto</th><th>Origen</th><th>Vigencia</th></tr></thead><tbody>
   ${erp.state.prices.map(p=>{const it=erp.state.catalogue.find(i=>i.id===p.itemId);const expired=p.validUntil&&p.validUntil<erp.today;
    return `<tr><td class="k">${esc(it.code)}</td><td>${esc(erp.party(p.supplierId).name)}</td><td>${fmtD(p.date)}</td>
     <td class="num">${eur(p.listCents)}</td><td class="num">${p.discountPct}%</td><td class="num k">${eur(p.netCents)}</td>
     <td>${({priceList:"Tarifa",supplierPortal:"Portal",supplierOffer:"Oferta",valuedDeliveryNote:"Albarán valorado",purchaseInvoice:"Factura",manualConfirmation:"Confirmación"})[p.source]} · ${esc(p.sourceDocRef)}</td>
     <td>${p.validUntil?(expired?`<span class="pill r">Caducado ${fmtD(p.validUntil)}</span>`:fmtD(p.validUntil)):"—"}</td></tr>`;}).join("")}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Paquetes de trabajo</h3><span class="tag">rendimiento · compra mínima · envase</span></div><div class="scroll"><table><tbody>
   ${erp.state.packages.map(w=>`<tr><td class="k">${esc(w.code)} · ${esc(w.name)}</td><td>por ${w.unit}</td><td>merma ${w.wastePct}%</td><td>mín. ${w.minPurchaseQty||"—"}</td><td>envase ${w.containerSize||"—"}</td><td class="num">coste 10 ${w.unit}: ${eur(erp.packageCostCents(w.id,10000))}</td></tr>`).join("")}
   </tbody></table></div></div>`;
 },

 /* ---------- Gestoría (GES) ---------- */
 gestoria(v){
  $('#sub').textContent="El paquete trimestral se genera desde los datos, con resúmenes de IVA e IRPF conciliados y la lista de excepciones antes de enviar.";
  // The quarter buttons stay; the default follows the global period selector
  // whenever that is expressed in quarters, so the two never contradict.
  const q=window._q||(PERIOD.mode==="quarter"?ErpEngine.quarterOf(periodRange().from):"2026-Q1");
  const pkg=(()=>{const inQ=d=>ErpEngine.quarterOf(d)===q;return {
    invoices:erp.state.invoices.filter(i=>inQ(i.date)), bills:erp.state.bills.filter(b=>inQ(b.date)),
    vat:erp.vatSummary(q), irpf:erp.irpfSummary(q), ex:erp.exceptionList(q)};})();
  const exCount=Object.values(pkg.ex).flat(2).filter(x=>typeof x==="string").length;
  v.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
    ${["2026-Q1","2026-Q2","2026-Q3","2026-Q4"].map(x=>`<button class="btn sm ${x===q?'primary':''}" data-q="${x}">${x.replace("2026-","T")}</button>`).join("")}
    <span style="flex:1"></span><button class="btn primary sm" id="bSend">📦 Generar y registrar envío</button></div>
   <div class="kpis">
    <div class="kpi"><div class="lab">Facturas emitidas</div><div class="val">${pkg.invoices.length}</div><div class="sub">${eur0(pkg.invoices.reduce((s,i)=>s+(i.kind==="creditNote"?-i.totalCents:i.totalCents),0))}</div></div>
    <div class="kpi"><div class="lab">Facturas recibidas</div><div class="val">${pkg.bills.length}</div><div class="sub">${eur0(pkg.bills.reduce((s,b)=>s+b.totalCents,0))}</div></div>
    <div class="kpi ${pkg.vat.netCents>0?'warn':''}"><div class="lab">IVA neto (303)</div><div class="val">${eur0(pkg.vat.netCents)}</div><div class="sub">repercutido ${eur0(pkg.vat.outputVatCents)} − soportado ${eur0(pkg.vat.inputVatCents)}</div></div>
    <div class="kpi"><div class="lab">IRPF retenido (111)</div><div class="val">${eur0(pkg.irpf.retainedCents)}</div><div class="sub">a autónomos y profesionales</div></div>
   </div>
   <div class="card"><div class="ch"><h3>Lista de excepciones antes de enviar</h3><span class="tag">${exCount===0?"✓ limpio":exCount+" incidencias"}</span></div><div class="daylist">
    ${pkg.ex.partiesWithoutTaxId.length?`<div class="it">🔴 <b>${pkg.ex.partiesWithoutTaxId.length}</b> terceros sin NIF válido: ${pkg.ex.partiesWithoutTaxId.join(", ")}</div>`:""}
    ${pkg.ex.billsWithoutDocument.length?`<div class="it">🟡 <b>${pkg.ex.billsWithoutDocument.length}</b> facturas sin documento adjunto: ${pkg.ex.billsWithoutDocument.join(", ")}</div>`:""}
    ${pkg.ex.unallocatedMovements.length?`<div class="it">🟡 <b>${pkg.ex.unallocatedMovements.length}</b> movimientos bancarios sin asignar</div>`:""}
    ${pkg.ex.unmatchedReceipts.length?`<div class="it">🟡 <b>${pkg.ex.unmatchedReceipts.length}</b> recibos sin casar</div>`:""}
    ${pkg.ex.undocumentedCash.length?`<div class="it">🔵 <b>${pkg.ex.undocumentedCash.length}</b> movimientos de caja sin justificante</div>`:""}
    ${pkg.ex.seriesGaps.invoice.length?`<div class="it">🔴 Huecos en la serie de facturas: ${pkg.ex.seriesGaps.invoice.join(", ")}</div>`:`<div class="it">✅ Serie de facturas sin huecos</div>`}
   </div></div>
   <div class="card"><div class="ch"><h3>IVA por tipo</h3><span class="tag">conciliado con los registros</span></div><div class="scroll"><table><thead><tr><th>Tipo</th><th class="num">Base repercutida</th><th class="num">IVA repercutido</th><th class="num">Base soportada</th><th class="num">IVA soportado</th></tr></thead><tbody>
   ${Object.entries(pkg.vat.byRate).map(([bp,r])=>`<tr><td class="k">${bp/100}%</td><td class="num">${eur(r.outputBaseCents)}</td><td class="num">${eur(r.outputVatCents)}</td><td class="num">${eur(r.inputBaseCents)}</td><td class="num">${eur(r.inputVatCents)}</td></tr>`).join("")}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Envíos registrados</h3></div><div class="scroll"><table><tbody>
   ${erp.state.packagesSent.map(s=>`<tr><td class="k">${s.quarter}</td><td>${fmtD(s.date)}</td><td>${s.invoices} emitidas · ${s.bills} recibidas</td><td>${s.exceptions} excepciones</td></tr>`).join("")||'<tr><td><div class="empty">Aún no se ha enviado ningún paquete.</div></td></tr>'}
   </tbody></table></div></div>`;
  v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{window._q=b.dataset.q;render();});
  $('#bSend').onclick=()=>mutate(()=>erp.quarterlyPackage(q,"backoffice"),"Paquete "+q+" generado y registrado");
 },
};

/* =============================== drawers =============================== */
function openDrawer(title){ $('#dttl').textContent=title; $('#scrim').classList.add('on'); $('#drawer').classList.add('on'); return $('#dbody'); }
function closeDrawer(){ $('#scrim').classList.remove('on'); $('#drawer').classList.remove('on'); }
$('#dClose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{if(e.key==="Escape")closeDrawer();});

function partyDrawer(id){
  const p=erp.party(id), c=erp.partyCompleteness(id), h=erp.partyHistory(id);
  const db=openDrawer(p.name);
  db.innerHTML=`
   <div class="card"><div class="ch"><h3>Identificación</h3><span class="tag">${c.ok?'✓ completa para facturar':'incompleta — '+c.missing.join(", ")}</span></div>
    <div class="daylist">
     <div class="it">Código <b>${p.code}</b> · contable <b>${p.accountingCode}</b></div>
     <div class="it">NIF/CIF: <b>${p.taxId||"—"}</b> · ${({individual:"Particular",company:"Empresa",community:"Comunidad",publicBody:"Ente público"})[p.partyType]}</div>
     <div class="it">Dirección: ${esc([p.billStreet,p.billPostalCode,p.billCity].filter(Boolean).join(", ")||"—")}</div>
     <div class="it">Contacto: ${esc(p.mobile||p.landline||"—")} · ${esc(p.email||"sin email")}</div>
     <div class="it">Condiciones: ${p.paymentMethod} · ${p.paymentTermsDays} días ${p.irpfApplies?` · IRPF ${p.irpfRateBp/100}%`:""}</div>
     <div class="it">Origen: ${p.leadSource||"—"} · Línea: ${p.activityLine||"—"}</div>
    </div></div>
   <div class="card"><div class="ch"><h3>Historial</h3></div><div class="daylist">
     <div class="it"><b>${h.budgets.length}</b> presupuestos · <b>${h.contracts.length}</b> contratos · <b>${h.projects.length}</b> proyectos</div>
     <div class="it"><b>${h.invoices.length}</b> facturas · <b>${h.receipts.length}</b> recibos · <b>${h.bills.length}</b> facturas recibidas</div>
     ${erp.state.properties.filter(x=>x.partyId===id).map(x=>`<div class="it">🏠 ${esc(x.street)} (${x.surfaceM2} m²)</div>`).join("")}
   </div></div>
   <div style="display:flex;gap:8px;margin-top:10px">
     <button class="btn primary" id="p_edit">✏️ Editar datos</button>
     <button class="btn" id="p_act">${p.active?"Desactivar":"Reactivar"}</button>
   </div>`;
  $('#p_edit').onclick=()=>editPartyDrawer(id);
  $('#p_act').onclick=()=>mutate(()=>{
    if(p.active) erp.deactivateParty(id,"backoffice");
    else erp.updateParty(id,{active:true},"backoffice");
    closeDrawer();
  },p.active?"Tercero desactivado":"Tercero reactivado");
}

   <div class="field full"><label>Roles</label><div style="display:flex;gap:12px;flex-wrap:wrap;padding:6px 0">${ROLES.map(([v,l])=>`<label style="display:flex;gap:5px;align-items:center;font-size:12.5px"><input type="checkbox" data-role="${v}"${p.roles.includes(v)?" checked":""}>${l}</label>`).join("")}</div></div>

   <div class="field"><label>Origen del contacto</label><select id="e_src">${ErpEngine.LISTS.leadSources.map(s=>`<option${p.leadSource===s?" selected":""}>${s}</option>`).join("")}</select></div>
   <div class="field"><label>Línea de actividad</label><select id="e_line">${[["renovation","Reforma"],["repairs","Reparaciones"],["damp","Humedades"],["commercial","Comercial"],["other","Otra"]].map(([v,l])=>`<option value="${v}"${p.activityLine===v?" selected":""}>${l}</option>`).join("")}</select></div>

   <div class="field"><label>IRPF</label><select id="e_irpf">${[[0,"No aplica"],[1,"Aplica"]].map(([v,l])=>`<option value="${v}"${(p.irpfApplies?1:0)===v?" selected":""}>${l}</option>`).join("")}</select></div>
   <div class="field"><label>IRPF % (si aplica)</label><input id="e_irpfr" type="number" min="0" max="47" step="0.5" value="${(p.irpfRateBp||0)/100}"></div>
   <div class="field full"><label>IBAN (opcional — el cambio queda registrado)</label><input id="e_iban" value="${esc((p.bank&&p.bank.iban)||"")}" placeholder="ES.."></div>
   <div class="field full"><label>Notas</label><input id="e_notes" value="${esc(p.notes||"")}"></div>
   <div class="field full" style="margin-top:8px"><button class="btn primary" id="e_save">Guardar cambios</button></div></div>`;
  $('#e_save').onclick=()=>mutate(()=>{
    const roles=[...db.querySelectorAll('input[data-role]:checked')].map(x=>x.dataset.role);
    if(!roles.length) throw new Error("El tercero necesita al menos un rol");
    if(!$('#e_name').value.trim()) throw new Error("El nombre es obligatorio");
    const patch={name:$('#e_name').value.trim(),taxId:$('#e_tax').value.trim(),partyType:$('#e_type').value,roles,
      billStreet:$('#e_street').value.trim(),billPostalCode:$('#e_cp').value.trim(),billCity:$('#e_city').value.trim(),billProvince:$('#e_prov').value.trim(),
      contactPerson:$('#e_contact').value.trim(),mobile:$('#e_mob').value.trim(),landline:$('#e_land').value.trim(),email:$('#e_mail').value.trim(),
      leadSource:$('#e_src').value,activityLine:$('#e_line').value,paymentMethod:$('#e_paym').value,
      paymentTermsDays:Math.max(0,+$('#e_terms').value||0),
      irpfApplies:$('#e_irpf').value==="1",irpfRateBp:Math.round((+$('#e_irpfr').value||0)*100),notes:$('#e_notes').value.trim()};
    const iban=$('#e_iban').value.trim().replace(/\s+/g,"");
    if(iban) patch.bank=Object.assign({},p.bank||{},{iban,holder:(p.bank&&p.bank.holder)||patch.name});
    erp.updateParty(id,patch,"backoffice");
    closeDrawer();
  },"Datos actualizados");
}

   <div class="field"><label>NIF / CIF / NIE *</label><input id="f_tax" placeholder="12345678Z"></div>

   <div class="field"><label>C.P. *</label><input id="f_cp"></div><div class="field"><label>Población *</label><input id="f_city"></div>
   <div class="field"><label>Móvil *</label><input id="f_mob"></div><div class="field"><label>Email</label><input id="f_mail"></div>
   <div class="field"><label>Origen del contacto *</label><select id="f_src">${ErpEngine.LISTS.leadSources.map(s=>`<option>${s}</option>`).join("")}</select></div>
   <div class="field"><label>Línea de actividad</label><select id="f_line"><option value="renovation">Reforma</option><option value="repairs">Reparaciones</option><option value="damp">Humedades</option><option value="commercial">Comercial</option><option value="other">Otra</option></select></div>

/* The three creations the global "+ Crear" offers. They call the engine's own
   entry points, so every validation (complete tax data before a project, a
   party that exists, the audit log entry) applies exactly as it does anywhere
   else — the bar is a shortcut to existing rules, never a way around them. */
function partyOptions(filter){
  return erp.state.parties.filter(p=>p.active&&filter(p)).map(p=>`<option value="${p.id}">${esc(p.name)} (${p.code})</option>`).join("");
}
function newOpportunityDrawer(){
  const db=openDrawer("Nueva oportunidad");
  db.innerHTML=`<div class="fgrid">
   <div class="field full"><label>Cliente *</label><select id="o_party">${partyOptions(p=>p.roles.includes("customer"))}</select></div>
   <div class="field full"><label>Trabajo solicitado *</label><input id="o_work" placeholder="Reforma integral de baño"></div>
   <div class="field"><label>Origen *</label><select id="o_src">${ErpEngine.LISTS.leadSources.map(s=>`<option>${s}</option>`).join("")}</select></div>
   <div class="field"><label>Valor estimado (€)</label><input id="o_val" type="number" min="0" step="100" value="0"></div>
   <div class="field full"><label>Próxima acción</label><input id="o_next" value="Programar visita"></div>
   <div class="field full" style="margin-top:8px"><button class="btn primary" id="o_save">Crear oportunidad</button></div></div>`;
  $('#o_save').onclick=()=>mutate(()=>{
    const work=$('#o_work').value.trim();
    if(!$('#o_party').value) throw new Error("Hace falta un cliente");
    if(!work) throw new Error("Describe el trabajo solicitado");
    erp.addOpportunity({partyId:$('#o_party').value,requestedWork:work,source:$('#o_src').value,
      expectedValue:Math.round((+$('#o_val').value||0)*100),nextAction:$('#o_next').value.trim()||"Programar visita"},"backoffice");
    closeDrawer(); go("oportunidades");
  },"Oportunidad creada");
}
function newQuickProjectDrawer(){
  const db=openDrawer("Nuevo proyecto");
  db.innerHTML=`<div class="fgrid">
   <div class="field full"><label>Cliente *</label><select id="n_party">${partyOptions(p=>p.roles.includes("customer"))}</select></div>
   <div class="field full"><label>Descripción del trabajo *</label><input id="n_desc" placeholder="Reparación de humedades"></div>
   <div class="field"><label>Línea de actividad</label><select id="n_line">${[["repairs","Reparaciones"],["renovation","Reforma"],["damp","Humedades"],["commercial","Comercial"]].map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></div>
   <div class="field"><label>Valor de venta (€) *</label><input id="n_val" type="number" min="0" step="100" value="0"></div>
   <div class="field full" style="font-size:12px;color:var(--muted)">Para una obra con presupuesto formal, créala desde el presupuesto aceptado: así conserva su línea base.</div>
   <div class="field full" style="margin-top:8px"><button class="btn primary" id="n_save">Crear proyecto</button></div></div>`;
  $('#n_save').onclick=()=>mutate(()=>{
    const desc=$('#n_desc').value.trim(), val=Math.round((+$('#n_val').value||0)*100);
    if(!$('#n_party').value) throw new Error("Hace falta un cliente");
    if(!desc) throw new Error("Describe el trabajo");
    if(val<=0) throw new Error("El valor de venta debe ser mayor que cero");
    erp.createQuickProject({partyId:$('#n_party').value,desc,activityLine:$('#n_line').value,valueCents:val},"backoffice");
    closeDrawer(); go("proyectos");
  },"Proyecto creado");
}
function newTaskDrawer(){
  const db=openDrawer("Nueva tarea");
  db.innerHTML=`<div class="fgrid">
   <div class="field full"><label>Tarea *</label><input id="t_title" placeholder="Llamar al cliente con la valoración"></div>
   <div class="field"><label>Responsable</label><select id="t_owner"><option value="backoffice">Oficina</option><option value="operations">Obra</option></select></div>
   <div class="field"><label>Vence</label><input id="t_due" type="date" value="${erp.today}"></div>
   <div class="field full" style="margin-top:8px"><button class="btn primary" id="t_save">Crear tarea</button></div></div>`;
  $('#t_save').onclick=()=>mutate(()=>{
    const title=$('#t_title').value.trim();
    if(!title) throw new Error("La tarea necesita un título");
    erp.addTask({title,owner:$('#t_owner').value,due:$('#t_due').value||erp.today},"backoffice");
    closeDrawer(); go("hoy");
  },"Tarea creada");
}
function budgetDrawer(id,versionId){
  const b=erp.budget(id); const vsel=versionId||b.acceptedVersionId||b.currentVersionId; const V=erp.version(id,vsel);
  const t=erp.budgetTotals(id,vsel); const doc=erp.renderBudgetDoc(id,vsel);
  /* The annex is laid out by @repo/capability-docs through the bridge: which
     picture goes on which page, in what order, under what reference. This view
     decides none of it — it only paints what came back, and asks the same
     object which rows carry the discreet mark. */
  const annex=(typeof ErpBridge!=="undefined"&&ErpBridge.docs)
    ? ErpBridge.docs.annex(doc) : {enabled:false,pages:[],plateCount:0,markedItems:[]};
  const marked=new Set(annex.markedItems);
  const perPage=(doc.annex&&doc.annex.imagesPerPage)||2;
  const db=openDrawer(b.number+" · v"+V.vNumber+(b.acceptedVersionId?" (aceptada)":""));
  const SEC={base:"",optional:" (opcional — aparte)",outOfScope:" (fuera de presupuesto)",extras:" (extras)"};
  db.innerHTML=`
   <div class="card"><div class="ch"><h3>Versiones</h3><span class="tag">automáticas, emitidas = congeladas</span></div><div class="daylist">
    ${b.versions.map(x=>`<div class="it"><b>v${x.vNumber}</b> ${fmtD(x.date)} · ${esc(x.reason||"—")} ${x.id===b.acceptedVersionId?'<span class="pill g">Aceptada</span>':x.issued?'<span class="pill b">Emitida</span>':'<span class="pill y">Borrador</span>'}${x.sent?` · enviada por ${x.sent.channel}`:""}</div>`).join("")}
    ${b.versions.length>1?(()=>{const d=erp.diffVersions(id,b.versions[0].id,b.versions[b.versions.length-1].id);return `<div class="it">Δ v${b.versions[0].vNumber}→v${b.versions[b.versions.length-1].vNumber}: <b>${eur(d.deltaCents)}</b> (${d.deltaPct}%) · ${d.changed.length} líneas modificadas</div>`;})():""}
   </div></div>
   <div class="doc">
    <div class="dh"><div><b>PRESUPUESTO ${doc.number} · v${doc.version}</b><br>${esc(doc.issuer.legalName)} · ${esc(doc.issuer.taxId)}<br>${esc(doc.issuer.address)}</div>
    <div style="text-align:right">${esc(doc.customer.name)}<br>${esc(doc.customer.taxId)}<br>${esc(doc.customer.address)}</div></div>
    ${doc.chapters.map(c=>`<div style="margin-bottom:8px"><b style="color:var(--greenDeep)">${c.num}. ${esc(c.name)}${SEC[c.section]||""}</b>
      ${c.lines.map(l=>`<div class="chapline"><span>${l.num} ${esc(l.desc)} — ${l.qty} ${l.unit} × ${eur(l.priceCents)}${marked.has(l.num)?'<span class="amark" title="Ver anexo gráfico">A</span>':""}</span><b>${eur(l.totalCents)}</b></div>`).join("")}</div>`).join("")}
    <div style="border-top:2px solid var(--green);padding-top:8px;margin-top:8px">
      <div class="chapline"><span>Base imponible</span><b>${eur(doc.totals.taxableCents)}</b></div>
      ${doc.totals.optionsCents?`<div class="chapline"><span>Opcionales (aparte)</span><span>${eur(doc.totals.optionsCents)}</span></div>`:""}
      <div class="chapline"><span>IVA ${doc.totals.vatBp/100}%</span><span>${eur(doc.totals.vatCents)}</span></div>
      <div class="chapline" style="font-size:14px"><b>TOTAL</b><b>${eur(doc.totals.grandCents)}</b></div>
      ${doc.totals.perM2Cents?`<div class="chapline"><span>Total por m²</span><span>${eur(doc.totals.perM2Cents)}/m²</span></div>`:""}
      ${t.pendingCount?`<div class="chapline"><span>⚠ Líneas pendientes de precio (no incluidas)</span><span>${t.pendingCount} · ~${eur(t.pendingEstCents)}</span></div>`:""}
    </div>
    ${annex.pages.map(pg=>`<div class="annexpg" data-annexpage="${pg.number}">
      <div class="ah">Anexo gráfico · página ${pg.number} de ${annex.pages.length}</div>
      <div class="plates" style="grid-template-columns:repeat(${Math.min(perPage,2)},minmax(0,1fr))">
       ${pg.plates.map(p=>`<figure class="plate"><img data-blob="${esc(p.ref)}" alt="${esc(p.itemLabel)}">
         <figcaption><b>${p.groupNum}. ${esc(p.groupName)} · partida ${p.itemNum}</b><br>${esc(p.itemLabel)}${p.sequence?` (${p.sequence} de ${p.siblings})`:""}${p.caption?`<br>${esc(p.caption)}`:""}</figcaption>
        </figure>`).join("")}
      </div></div>`).join("")}
    <div style="margin-top:8px;color:var(--muted)">Validez: ${fmtD(b.validityDate)} · ${esc(b.paymentConditions)} · IBAN ${esc(doc.issuer.iban)}</div>
   </div>
   <div class="card" style="margin-top:12px"><div class="ch"><h3>Margen interno</h3><span class="tag">nunca aparece en el documento del cliente</span></div><div class="daylist">
    <div class="it">Coste interno base: <b>${eur(t.costBaseCents)}</b> · Margen: <b>${eur(t.marginBaseCents)} (${t.marginBasePct}%)</b></div>
    ${t.chapters.filter(c=>c.section==="base").map(c=>`<div class="it">${c.num} ${esc(c.name)}: venta ${eur(c.saleCents)} · coste ${eur(c.costCents)} · <b style="color:${c.marginCents<0?'var(--danger)':'inherit'}">${eur(c.marginCents)}</b></div>`).join("")}
   </div></div>
   ${annex.plateCount?`<div class="card"><div class="ch"><h3>Anexo gráfico</h3><span class="tag">${annex.plateCount} imágenes · ${annex.pages.length} páginas</span></div>
    <div class="daylist"><div class="it">Se imprime después de los totales y antes de las condiciones. Al emitir la versión, el anexo queda congelado con ella.</div></div></div>`
    :(doc.annex&&doc.annex.enabled?"":`<div class="card"><div class="daylist"><div class="it">El anexo gráfico está desactivado para este presupuesto.</div></div></div>`)}`;
  paintImages(db);
}
/** Adjust one chapter's projection. The reason is required, by the engine. */
function forecastDrawer(pid,chapterNum,name,row){
  const db=openDrawer(`Proyección · ${chapterNum}. ${name}`);
  const stored=(erp.project(pid).forecastOverrides||{})[chapterNum];
  db.innerHTML=`<div class="card"><div class="ch"><h3>Coste a fin de obra</h3><span class="tag">§4.4</span></div>
   <div class="daylist">
    <div class="it">Presupuestado <b>${eur(row.budgetCents)}</b> · real <b>${eur(row.actualCents)}</b> · avance <b>${row.progressPct}%</b></div>
    <div class="it">Proyección calculada <b>${eur(row.calculatedCents)}</b>${row.provisional?' <span class="pill y">provisional — muy poco avance para extrapolar</span>':""}</div>
    ${stored?`<div class="it">Ajuste vigente <b>${eur(stored.costCents)}</b> · ${esc(stored.reason)} <span style="color:var(--muted)">(${esc(stored.by)}, ${fmtD(stored.at)})</span></div>`:""}
   </div></div>
   <div class="card"><div class="ch"><h3>Ajustar</h3></div><div class="fgrid" style="padding:12px 16px">
    <div class="field"><label>Coste a fin de obra (€)</label><input id="fc_amt" type="number" step="0.01" value="${((stored?stored.costCents:row.calculatedCents)/100).toFixed(2)}"></div>
    <div class="field full"><label>Motivo * — se guarda con el ajuste y es lo único revisable después</label>
      <input id="fc_why" placeholder="La parte cara ya está ejecutada" value="${esc(stored?stored.reason:"")}"></div>
    <div class="field full" style="margin-top:6px;display:flex;gap:8px">
      <button class="btn primary" id="fc_save">Guardar ajuste</button>
      ${stored?'<button class="btn danger" id="fc_clear">Volver a la calculada</button>':""}</div>
   </div></div>`;
  $('#fc_save').onclick=()=>mutate(()=>{
    erp.setForecastOverride(pid,chapterNum,{costCents:Math.round(+$('#fc_amt').value*100),reason:$('#fc_why').value},"backoffice");
    closeDrawer();
  },"Proyección ajustada");
  const cl=$('#fc_clear');
  if(cl) cl.onclick=()=>mutate(()=>{erp.clearForecastOverride(pid,chapterNum,"backoffice");closeDrawer();},"Ajuste retirado");
}

function projectDrawer(id){
  const p=erp.project(id); const e=erp.projectEconomics(id); const bill=erp.projectBilling(id); const ex=erp.extrasRegister(id);
  const db=openDrawer(p.code+" — "+erp.party(p.partyId).name);
  const chapters=p.budgetId?erp.version(p.budgetId,p.acceptedVersionId).chapters.filter(c=>c.section==="base"):[];
  const chEc=p.budgetId?erp.chapterEconomics(id):[];
  db.innerHTML=`
   <div class="kpis" style="grid-template-columns:1fr 1fr">
    <div class="kpi"><div class="lab">Venta actual</div><div class="val">${eur0(e.currentRevenueCents)}</div><div class="sub">base ${eur0(e.baselineRevenueCents)} + extras ${eur0(e.approvedChangesCents)}</div></div>
    <div class="kpi ${e.marginForecastCents<0?'warn':''}"><div class="lab">Margen previsto</div><div class="val">${eur0(e.marginForecastCents)}</div><div class="sub">${e.marginForecastPct}% · real ${eur0(e.actualCents)} de ${eur0(e.forecastCostCents)}</div></div>
   </div>
   <div class="card"><div class="ch"><h3>Avance por capítulo</h3><span class="tag">marca lo hecho — alimenta la certificación</span></div><div class="daylist">
    ${chapters.map(c=>`<div class="it" style="align-items:center;gap:10px">${pillProg(c.progress)} <span style="flex:1">${c.num}. ${esc(c.name)}</span>
      ${!p.closed?`<button class="btn sm" data-prog="${c.num}" data-st="inProgress">En curso</button><button class="btn sm" data-prog="${c.num}" data-st="done">✓ Hecho</button>`:""}</div>`).join("")||`<div class="it">Avance: ${e.progressPct}%</div>`}
   </div></div>
   ${chEc.length?`<div class="card"><div class="ch"><h3>Coste por capítulo</h3><span class="tag">previsto vs. real</span></div><div class="scroll"><table><thead><tr><th>Capítulo</th><th class="num">Venta</th><th class="num">Coste prev.</th><th class="num">Coste real</th><th></th></tr></thead><tbody>
    ${chEc.map(c=>`<tr><td>${c.num}. ${esc(c.name)}</td><td class="num">${eur0(c.saleCents)}</td><td class="num">${eur0(c.budgetCostCents)}</td><td class="num">${eur0(c.actualCents)}</td><td>${c.overrun?'<span class="pill r">Desvío</span>':''}</td></tr>`).join("")}
   </tbody></table></div></div>`:""}
   <div class="card"><div class="ch"><h3>Extras</h3><span class="tag">${ex.approved} aprobados · ${eur0(ex.unapprovedValueCents)} sin aprobar</span></div><div class="daylist">
    ${ex.items.map(c=>`<div class="it" style="align-items:center;gap:8px"><span class="pill ${({identified:"y",priced:"y",approved:"b",executed:"b",invoiced:"g",rejected:"r"})[c.status]}">${({identified:"Detectado",priced:"Valorado",approved:"Aprobado",executed:"Ejecutado",invoiced:"Facturado",rejected:"Rechazado"})[c.status]}</span>
      <span style="flex:1">${esc(c.desc)} — venta ${eur(c.priceCents)} · coste ${eur(c.costCents)}</span>
      ${c.status==="priced"?`<button class="btn sm" data-approve="${c.id}">Aprobar</button>`:""}</div>`).join("")||'<div class="it">Sin extras registrados.</div>'}
   </div></div>
   <div class="card"><div class="ch"><h3>Facturación del proyecto</h3></div><div class="daylist">
    <div class="it">Facturado <b>${eur(bill.invoicedCents)}</b> · Cobrado <b>${eur(bill.collectedCents)}</b> · Pendiente <b>${eur(bill.outstandingCents)}</b> · Por facturar <b>${eur(bill.remainingToInvoiceCents)}</b></div>
   </div></div>`;
  db.querySelectorAll('[data-prog]').forEach(b2=>b2.onclick=()=>mutate(()=>erp.markProgress(id,b2.dataset.prog,b2.dataset.st,null,"operations"),"Avance actualizado"));
  db.querySelectorAll('[data-approve]').forEach(b2=>b2.onclick=()=>mutate(()=>erp.approveChange(b2.dataset.approve,"aprobación-cliente.png","backoffice"),"Extra aprobado — anexo generado"));
}

/* =============================== data actions (profile menu) =============================== */
function exportData(){
  const blob=new Blob([JSON.stringify({_meta:{app:"Canei ERP",exportedAt:erp.today},data:erp.toJSON()},null,1)],{type:'application/json'});
  const a=el('a');a.href=URL.createObjectURL(blob);a.download='canei-erp.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast("Datos exportados");
}
function resetData(){ if(!confirm("¿Restablecer el entorno con los datos de ejemplo? Se sustituye todo lo actual."))return;
  erp=ErpSeed.build(); persist(); render(); toast("Datos de ejemplo cargados"); }
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k&&SUBMAP[k]&&!SUBMAP[k].href&&k!==cur){cur=k;render();}});
boot();
