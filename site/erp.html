      function ganttTaskDrawer(pid, taskId) {
        const B = ganttApi(),
          plan = B.get(erp.state, pid),
          sch = B.schedule(plan);
        const t = plan.tasks.find((x) => x.id === taskId);
        if (!t) return;
        const p = (sch ? sch.tasks.find((s) => s.taskId === taskId) : null) || {
          start: t.plannedStart,
          finish: t.plannedEnd,
          durationDays: 0,
          totalFloatDays: 0,
          critical: false,
        };
        const preds = (plan.dependencies || []).filter((d) => d.successorId === taskId);
        const TYPE = { FS: "fin → inicio", SS: "inicio → inicio", FF: "fin → fin" };
        const db = openDrawer(t.title);
        db.innerHTML = `
   <div class="kpis" style="grid-template-columns:1fr 1fr">
    <div class="kpi"><div class="lab">Fechas</div><div class="val" style="font-size:15px">${fmtD(p.start)} → ${fmtD(p.finish)}</div><div class="sub">${p.durationDays} días laborables</div></div>
    <div class="kpi ${p.critical ? "warn" : ""}"><div class="lab">Holgura</div><div class="val">${p.critical ? "0" : p.totalFloatDays}</div><div class="sub">${p.critical ? "en la ruta crítica" : "días de margen"}</div></div>
   </div>
   <div class="fgrid">
    <div class="field full"><label>Nombre</label><input id="t_title" value="${esc(t.title)}"></div>
    ${t.milestone ? "" : `<div class="field"><label>Duración (días laborables)</label><input id="t_days" type="number" min="1" value="${p.durationDays}"></div>`}
    <div class="field"><label>Avance %</label><input id="t_pct" type="number" min="0" max="100" value="${t.progressPct || 0}"></div>
    <div class="field full"><label>No empezar antes de ${t.earliestStart ? "" : "(sin fijar)"}</label><input id="t_pin" type="date" value="${t.earliestStart || ""}"></div>
    <div class="field full"><button class="btn primary" id="t_save">Guardar</button> ${t.earliestStart ? `<button class="btn" id="t_unpin">Soltar fecha</button>` : ""}</div>
   </div>
   <div class="card" style="margin-top:12px"><div class="ch"><h3>Depende de</h3><span class="tag">${preds.length} dependencia${preds.length === 1 ? "" : "s"}</span></div><div class="daylist">
    ${
      preds
        .map((d) => {
          const a = plan.tasks.find((x) => x.id === d.predecessorId);
          return `<div class="it" style="align-items:center;gap:8px">
      <span style="flex:1">${esc(a ? a.title : d.predecessorId)} <span class="pill b">${TYPE[d.type]}</span>${d.lagDays ? ` <span class="pill y">${d.lagDays > 0 ? "+" : ""}${d.lagDays} d</span>` : ""}</span>
      <button class="btn sm" data-unlink="${d.id}">Quitar</button></div>`;
        })
        .join("") ||
      '<div class="it">Ninguna. Arrastra el punto de otra barra hasta ésta para crear una.</div>'
    }
   </div></div>
   <div style="margin-top:12px"><button class="btn danger" id="t_del">Eliminar de la planificación</button></div>`;
        $("#t_save").onclick = () =>
          mutate(() => {
            let next = B.rename(plan, taskId, $("#t_title").value);
            if (!t.milestone)
              next = B.setDuration(next, taskId, Math.max(1, +$("#t_days").value || 1));
            next = B.setProgress(next, taskId, +$("#t_pct").value || 0);
            const pin = $("#t_pin").value;
            next = pin ? B.move(next, taskId, pin) : B.unpin(next, taskId);
            B.save(erp.state, pid, B.recalculate(next));
            closeDrawer();
          }, "Tarea actualizada");
        const up = $("#t_unpin");
        if (up)
          up.onclick = () =>
            mutate(() => {
              B.save(erp.state, pid, B.recalculate(B.unpin(plan, taskId)));
              closeDrawer();
            }, "La tarea vuelve a su fecha más temprana");
        db.querySelectorAll("[data-unlink]").forEach(
          (b) =>
            (b.onclick = () =>
              mutate(() => {
                B.save(erp.state, pid, B.recalculate(B.unlink(plan, b.dataset.unlink)));
              }, "Dependencia eliminada")),
        );
        $("#t_del").onclick = () =>
          mutate(() => {
            B.save(erp.state, pid, B.recalculate(B.removeTask(plan, taskId)));
            gSel = null;
            closeDrawer();
          }, "Tarea eliminada");
      }

      /* ===================== Technical tracking (spec §4.3) ==============================
   The chart came in session 6; this is the half around it — progress recorded
   per chapter and per line, the S curve, and the deviations panel.

   Same rule as everywhere else in this file: NOTHING here computes a schedule,
   a drift, a projection or a percentage of completion. Planned/actual/projected
   and every risk item come from @repo/capability-scheduling through the bridge;
   the value-weighting comes from erp.budgetTotals(). This block turns those
   numbers into pixels and inputs, and that is all. */

      /** What each bar is worth, so the S curve is value- and not time-weighted:
    a week of demolition and a week of joinery are not the same amount of job. */
      function planWeights(pid, plan) {
        const w = {};
        try {
          const p = erp.project(pid);
          const byNum = {};
          (p.baseline.chapters || []).forEach((c) => {
            byNum[c.num] = c.saleCents;
          });
          plan.tasks.forEach((t) => {
            const m = /^group:(.+)$/.exec(t.sourceRef || "");
            if (m && byNum[m[1]] > 0) w[t.id] = byNum[m[1]];
          });
        } catch (e) {}
        return w;
      }

      /* Re-derives the plan from the accepted budget. The toast reports how the
   durations were arrived at, because "5 tasks, 2 with no known daily output"
   is the difference between a plan and a guess, and the planner should be told
   which one they just got rather than having to infer it from bar widths. */
      async function deriveFromBudget(pid, cal) {
        const B = ganttApi();
        /* Package 3 slide 3: re-deriving is not additive, and the button read
       as though it were. `mergeDerivedPlan` maps over the DERIVED tasks and
       carries progress, status, pinned dates, baselines and the progress log
       across for the ones that survive — but a task that the budget's work
       breakdown does not regenerate is not in that list. That is every task
       and milestone added by hand with ＋ Tarea or ◆ Hito, and every
       dependency drawn on the chart, since the derived plan brings its own
       links. The tooltip's "conservando el avance registrado" was true and
       was being read as "conserving everything". */
        const before = B ? B.get(erp.state, pid) : null;
        if (before && before.tasks.length) {
          const byHand = before.tasks.filter((t) => !/^group:/.test(t.sourceRef || "")).length;
          const go = await askConfirm("¿Volver a derivar la planificación?", {
            body:
              "Se conservan el avance registrado, las líneas base congeladas y las fechas fijadas a mano." +
              (byHand
                ? ` Se pierden ${byHand === 1 ? "la tarea o hito añadido" : `las ${byHand} tareas o hitos añadidos`} a mano y las dependencias dibujadas sobre el gráfico.`
                : " Se pierden las dependencias dibujadas a mano sobre el gráfico."),
            okLabel: "Volver a derivar",
            danger: true,
          });
          if (!go) return;
        }
        let msg = "Planificación derivada del presupuesto";
        try {
          const derived = B.fromBudget(erp, pid, { calendar: cal });
          if (!derived)
            throw new Error("El proyecto no tiene presupuesto aceptado del que derivar");
          const guessed = derived.notes.filter((n) => n.basis === "default").length;
          msg =
            `${derived.plan.tasks.length} tareas · ` +
            (guessed
              ? `${guessed} sin rendimiento conocido (duración por defecto)`
              : "duraciones derivadas de las cantidades");
          mutate(() => {
            B.save(erp.state, pid, derived.plan);
          }, msg);
        } catch (e) {
          toast("⚠ " + e.message);
        }
      }

      /** Planned / actual / projected, drawn from the points the capability returned. */
      function curveChart(curve) {
        const W = 560,
          H = 210,
          L = 34,
          R = 10,
          T = 12,
          Bm = 26;
        const pts = curve.points;
        if (pts.length < 2) return "";
        const x = (i) => L + (i / (pts.length - 1)) * (W - L - R);
        const y = (v) => T + (1 - v / 100) * (H - T - Bm);
        const path = (key) => {
          let d = "",
            open = false;
          pts.forEach((p, i) => {
            const v = p[key];
            if (v == null) {
              open = false;
              return;
            }
            d += (open ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " ";
            open = true;
          });
          return d.trim();
        };
        const nowIdx = pts.findIndex((p) => p.date > curve.asOf);
        const nowX = nowIdx > 0 ? x(nowIdx - 1) : null;
        return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Curva S de avance">
    ${[0, 25, 50, 75, 100]
      .map(
        (v) => `<line class="cgrid" x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}"></line>
      <text x="4" y="${y(v) + 3}">${v}%</text>`,
      )
      .join("")}
    ${nowX != null ? `<line class="cnow" x1="${nowX}" y1="${T}" x2="${nowX}" y2="${H - Bm}"></line>` : ""}
    <path class="cplan" d="${path("plannedPct")}"></path>
    <path class="cproj" d="${path("projectedPct")}"></path>
    <path class="cact" d="${path("actualPct")}"></path>
    <text x="${L}" y="${H - 8}">${fmtD(pts[0].date)}</text>
    <text x="${W - R}" y="${H - 8}" text-anchor="end">${fmtD(pts[pts.length - 1].date)}</text>
  </svg>`;
      }

      /* ================= The one progress control (Package 3 slide 3) =============
   Two controls used to record the same fact. This screen had a grid of
   chapters and their partidas that wrote through to the plan's own bars;
   PRY-01's «Avance» tab had a three-state control that wrote only through
   `markProgress`, so a percentage typed there never reached the chart, and a
   job could read 40 % on one screen and 0 % on the other. The operator asked
   for one control, usable on a desk and on a phone.

   What each side contributed. From the grid: the chapter+partida structure
   and — the part that matters — the write path, `recordProgress` for a
   chapter with a bar and `syncProgress` after a partida, so the engine and
   the plan always move together. From the tab: the three contiguous state
   buttons and the percentage box that is live only in the middle state
   (§3.2), including the mobile rule that collapses the strip to the single
   button saying where the row is now, so one tap cycles.

   What went. The quantity column — the operator asked for percentage only,
   and it costs the record nothing: `markLineProgress` already converted a
   quantity to a percentage and never stored the quantity, so there was never
   a second figure to lose. And the <table>, which forced a phone into
   sideways scrolling; `.provrow` is a flex row and does not. */
      const PROG_STATES = [
        ["notStarted", "Sin empezar"],
        ["inProgress", "En ejecución"],
        ["done", "Terminado"],
      ];
      const progStrip = (attr, id, state) =>
        `<span class="pstate" data-${attr}="${esc(id)}">${PROG_STATES.map(
          ([k, l]) => `<button data-st="${k}"${k === state ? ' class="on"' : ""}>${l}</button>`,
        ).join("")}</span>`;
      const progBox = (attr, id, state, pct) =>
        `<input class="pctbox" type="number" min="0" max="100" step="1" data-${attr}="${esc(id)}"
     value="${state === "done" ? 100 : Math.round(pct || 0)}"${state === "inProgress" ? "" : " disabled"}>`;

      function progressControl(pid, plan) {
        let chapters = [];
        try {
          const p = erp.project(pid);
          chapters = p.budgetId
            ? erp
                .version(p.budgetId, p.acceptedVersionId)
                .chapters.filter((c) => c.section === "base")
            : [];
        } catch (e) {}
        const taskFor = {};
        plan.tasks.forEach((t) => {
          const m = /^group:(.+)$/.exec(t.sourceRef || "");
          if (m) taskFor[m[1]] = t;
        });
        // The chapter figure is asked of the engine rather than averaged here:
        // `chapterProgress` weights each line by its value, and it is the same
        // function `syncProgress` carries onto the bars and the S curve reads.
        // Computing a second, simpler average in the view is how the box and
        // the bar directly above it come to disagree.
        const chapPct = {};
        try {
          erp.chapterProgress(pid).forEach((c) => (chapPct[c.num] = c.progressPct));
        } catch (e) {}
        if (!chapters.length && !plan.tasks.length) return "";
        return `<div class="card" id="progCtl"><div class="ch"><h3>Avance</h3>
    <span class="tag">estado y porcentaje, por capítulo y por partida</span></div>
   <div style="padding:4px 14px 12px">
   ${
     chapters
       .map((c) => {
         const st = c.progress || "notStarted";
         const t = taskFor[c.num];
         return `<div class="provrow chap">
       <span class="nm">${c.num}. ${esc(c.name)}</span>

      </div>

        .filter((l) => !l.pending)
        .map((l) => {
          const lst = l.progress || "notStarted";
          return `<div class="provrow sub">
         <span class="nm">${l.num} ${esc(l.desc)}${l.unit ? ` <span class="ud">· ${esc(l.unit)}</span>` : ""}</span>

     '<div class="empty">Sin capítulos aceptados: el avance se registra sobre las tareas del gráfico.</div>'

      function wireProgressControl(pid, plan) {
        const B = ganttApi();
        const host = $("#progCtl");
        if (!B || !host) return;
        const taskFor = {};
        plan.tasks.forEach((t) => {
          const m = /^group:(.+)$/.exec(t.sourceRef || "");
          if (m) taskFor[m[1]] = t;
        });
        const clamp = (n) => Math.max(0, Math.min(100, Math.round(+n || 0)));
        /* A state button says which STATE, not which percentage. «Terminado» is
       100 and «Sin empezar» is 0 by definition; «En ejecución» keeps the
       figure the row already carries and only falls back to the engine's own
       50 when there is nothing to keep. The tab this replaces passed null
       there, which made `markProgress` write 50 over every line — so tapping
       «En ejecución» on a chapter already at 40 % reset it to 50. That number
       came from somebody on site; it is not the view's to round off. */
        const pctForState = (state, current) =>
          state === "done"
            ? 100
            : state === "notStarted"
              ? 0
              : current > 0 && current < 100
                ? current
                : 50;
        const writeChapter = (num, pct) => {
          const t = taskFor[num];
          mutate(() => {
            // `recordProgress` writes BOTH — the bar through the capability and
            // the chapter through `markProgress` — which is the whole reason
            // this is the surviving path. Without a bar there is nothing to
            // move, so the engine is written directly.
            if (t)
              B.save(erp.state, pid, B.recalculate(B.recordProgress(erp, pid, plan, t.id, pct)));
            else
              erp.markProgress(
                pid,
                num,
                pct >= 100 ? "done" : pct > 0 ? "inProgress" : "notStarted",
                pct,
                "operations",
              );
          }, "Avance registrado");
        };
        const writeLine = (lineId, pct) =>
          mutate(() => {
            erp.markLineProgress(pid, lineId, { pct }, "operations");
            B.save(erp.state, pid, B.syncProgress(erp, pid, plan));
          }, "Avance de la partida registrado");

        host.querySelectorAll(".pstate").forEach((strip) => {
          const isLine = "line" in strip.dataset;
          const key = isLine ? strip.dataset.line : strip.dataset.chap;
          const box = host.querySelector(`[data-${isLine ? "lpct" : "pct"}="${CSS.escape(key)}"]`);
          strip.querySelectorAll("button").forEach(
            (b) =>
              (b.onclick = () => {
                // Mobile shows only the button for the state the row is IN, so a
                // tap on it means "next state", not "this state" — §3.2's
                // one-tap cycle. One handler serves both, because the question
                // is only ever which button was pressed and whether the others
                // are on screen at all.
                const off = strip.querySelector("button:not(.on)");
                const cycling = !off || getComputedStyle(off).display === "none";
                let next = b.dataset.st;
                if (cycling && b.classList.contains("on")) {
                  const order = PROG_STATES.map((x) => x[0]);
                  next = order[(order.indexOf(b.dataset.st) + 1) % order.length];
                }
                const pct = pctForState(next, clamp(box && box.value));
                if (isLine) writeLine(key, pct);
                else writeChapter(key, pct);
              }),
          );
        });
        host
          .querySelectorAll("[data-pct]")
          .forEach((inp) => (inp.onchange = () => writeChapter(inp.dataset.pct, clamp(inp.value))));
        host
          .querySelectorAll("[data-lpct]")
          .forEach((inp) => (inp.onchange = () => writeLine(inp.dataset.lpct, clamp(inp.value))));
      }

      /* ===================== Compras · Subcontratos · Modificaciones · Horas ==============
   §4.1, §4.2, §4.5, §4.6. Every one of these is project-scoped through gProject,
   same as seguimiento/economía — one job is the context of the whole section.
   Nothing here computes a commitment, a reconciliation or a projection: those
   come from erp.purchaseNeeds()/purchaseReconciliation()/committedByChapter()/
   subcontractsForProject(), the same calls economía uses, so the figures on
   these screens can never disagree with the ones there. */
      const DOC_KIND_LABEL = { insurance: "Seguro RC", prl: "PRL", socialSecurity: "Alta S.S." };
      const SUPPLIER_ROLES = ["supplier", "subcontractor", "selfEmployed"];
      const PURCHASE_STATUS_LABEL = {

      };
      /* The three the v4 screen counts by. The seven above still describe what the
   order knows; these are the coarser reading ADM-02 is organised around, and
   both are derived from the same facts so they cannot disagree. */
      const PURCHASE_STAGE_LABEL = {
        offer: ["Oferta", "y"],

        invoiced: ["Facturado", "g"],

        sent: ["Enviada", "b"],

        inExecution: ["En ejecución", "y"],

        approved: ["Aceptada", "g"],
        executed: ["Aceptada", "g"],
        invoiced: ["Aceptada", "g"],

      function supplierOptions(sel) {
        return erp.state.parties
          .filter((p) => p.active && p.roles.some((r) => SUPPLIER_ROLES.includes(r)))

      function chapterOptions(pid, sel) {
        const p = erp.project(pid);
        // A project reached from ADM-03's allocation panel need not have a frozen
        // baseline — a cost can land on a job before its presupuesto was accepted.
        // The screen offers no capítulo in that case rather than throwing.
        return ((p.baseline && p.baseline.chapters) || [])

      function noProjectsCard(v) {

      /* ---------- Compras (§4.1 · ADM-02, rebuilt in S7) ----------
   The specification's shape: three counters across the top — oferta, pedido,
   facturado — each carrying a count AND an amount, and each filtering the
   list when pressed. Then the orders themselves, on the shared list primitive

   Necesidades and the arrivals calendar stay below. The v4 document does not
   describe them and could be read as removing them; they are kept because
   they are the only place the budget's committed-versus-pending figure is
   visible, and an order created from an open need is an order that already
   knows which capítulo it belongs to. Retiring them would move real work back
   into somebody's head. Logged in ASSUMPTIONS.md.

   Goods receipt is no longer a stage of this screen, which is what the doc
   asks for. The engine keeps `receivePurchase` and its reconciliation — the

      let purchStage = ""; // "" | offer | order | invoiced — which counter is pressed

        v.innerHTML = `

      <div class="lab">${esc(PURCHASE_STAGE_LABEL[k][0])}</div>

      .join("")}
   </div>
   <div id="puList"></div>
   <div class="card"><div class="ch"><h3>Necesidades</h3><span class="tag">lo comprometido frente a lo pendiente, por capítulo</span></div>
    <div class="scroll"><table><thead><tr><th>Capítulo</th><th class="num">Presupuestado</th><th class="num">Comprometido</th><th class="num">Pendiente</th><th></th></tr></thead><tbody>
    ${
      needs
        .map(
          (
            c,
          ) => `<tr><td>${c.num}. ${esc(c.name)}</td><td class="num">${eur0(c.budgetCostCents)}</td><td class="num">${eur0(c.committedCents)}</td>
      <td class="num warn">${eur0(c.pendingCents)}</td><td><button class="btn sm" data-need="${c.num}">＋ OC</button></td></tr>`,

   <div class="card"><div class="ch"><h3>Calendario de llegadas</h3></div><div class="daylist">
    ${

   </div></div>`;

        renderMasterList($("#puList"), {

        v.querySelectorAll("[data-stage]").forEach(

      /* ---------- ADM-02's order, full screen (S7) ----------
   The third of the specification's four out-of-shell surfaces to be built:

      let puWork = null; // {id, zoom}

      /** The supplier's paperwork, or an honest statement that there is none. */
      function purchaseDocPane(capId) {
        const host = $("#puDocPane");
        if (!host) return;
        const zoom = puWork ? puWork.zoom : 1;
        const fit = (elm) => {
          elm.style.width = zoom * 100 + "%";
        };
        if (!capId) {
          host.innerHTML =
            '<div class="empty">Sin la oferta del proveedor. Captúrela en Facturas de proveedores y adjúntela aquí para comprobar el pedido contra lo que ofreció.</div>';
          return;
        }
        const cap = erp.state.captured.find((x) => x.id === capId);
        if (!cap || !cap.imageRef) {
          host.innerHTML = '<div class="empty">El documento adjunto ya no tiene archivo.</div>';
          return;
        }
        host.innerHTML = '<div class="empty">Preparando la vista…</div>';
        ErpStore.getBlob(cap.imageRef)
          .then((blob) => {
            if (!blob) {
              host.innerHTML = '<div class="empty">El archivo no está en este dispositivo.</div>';
              return;
            }
            if (!/pdf/i.test(blob.type || "")) {
              const img = new Image();
              img.onload = () => {
                host.innerHTML = "";
                host.appendChild(img);
                fit(img);
              };
              img.onerror = () => {
                host.innerHTML = '<div class="empty">No se ha podido mostrar el documento.</div>';
              };
              img.alt = "";
              img.src = URL.createObjectURL(blob);
              return;
            }
            return blob
              .arrayBuffer()
              .then((buf) => ErpOcr.loadPdfjs().then((m) => ({ m, buf })))
              .then(({ m, buf }) => m.getDocument({ data: new Uint8Array(buf) }).promise)
              .then((doc) => doc.getPage(1))
              .then((page) => {
                const vp = page.getViewport({ scale: 1.4 });
                const c = document.createElement("canvas");
                c.width = Math.round(vp.width);
                c.height = Math.round(vp.height);
                return page
                  .render({ canvasContext: c.getContext("2d"), viewport: vp })
                  .promise.then(() => c);
              })
              .then((c) => {
                host.innerHTML = "";
                host.appendChild(c);
                fit(c);
              });
          })
          .catch(() => {
            host.innerHTML = '<div class="empty">No se ha podido mostrar el documento.</div>';
          });
      }

      /* ---------- PRY-03 Adicionales (S9) ----------

      let chgStage = "";
      function modificaciones(v) {

      /* The 40 × 40 photograph. Same cache and same fallback as ADM-03's inbox
   cards: a key that is not a blob (the seed writes plain file names) simply
   stays the camera icon rather than showing a broken image. */
      const chgThumbUrls = {};
      function changeThumbs(root) {
        root.querySelectorAll(".xthumb[data-photo]").forEach((box) => {
          const key = box.dataset.photo;
          if (!key) return;
          const show = (url) => {
            if (!url) return;
            const img = new Image();
            img.onload = () => {
              box.innerHTML = "";
              box.appendChild(img);
            };
            img.onerror = () => {};
            img.alt = "";
            img.src = url;
          };
          if (chgThumbUrls[key] !== undefined) {
            show(chgThumbUrls[key]);
            return;
          }
          const direct = ErpStore.blobUrl(key);
          if (direct) {
            chgThumbUrls[key] = direct;
            show(direct);
            return;
          }
          chgThumbUrls[key] = null;
          ErpStore.getBlob(key)
            .then((b) => {
              if (!b) return;
              chgThumbUrls[key] = URL.createObjectURL(b);
              show(chgThumbUrls[key]);
            })
            .catch(() => {});
        });
      }
      function changeActionsHtml(c) {
        if (c.status === "identified")
          return `<button class="btn sm" data-price="${c.id}">Valorar</button>`;

        if (c.status === "sent")
          return `<button class="btn sm primary" data-approve="${c.id}">Aprobar</button> <button class="btn sm danger" data-reject="${c.id}">Rechazar</button>`;

          let h = `<button class="btn sm" data-doc="${c.id}">Ver adenda</button>`;
          if (c.chapterNum && c.scheduleImpactDays)
            h += ` <button class="btn sm" data-apply="${c.id}">Aplicar a planificación</button>`;
          return h;
        }
        return "";

        document.querySelectorAll("[data-cancel]").forEach(
          (b) =>
            (b.onclick = async () => {

                label: "Motivo de la anulación",

                okLabel: "Anular",
                danger: true,
              });
              if (reason === null) return;
              mutate(
                () => erp.cancelChange(b.dataset.cancel, reason, "backoffice"),
                "Modificación anulada",
              );
            }),

        document
          .querySelectorAll("[data-doc]")
          .forEach((b) => (b.onclick = () => changeDocDrawer(b.dataset.doc)));
        document.querySelectorAll("[data-apply]").forEach(
          (b) =>
            (b.onclick = () => {
              const B = ganttApi();
              if (!B) {
                toast("⚠ Módulo de planificación no disponible");
                return;

                () => {

                      "El capítulo " +

                  B.save(erp.state, pid, B.recalculate(applied));

      /* ---------- Horas (§4.6) ---------- */
      /* ================= ADM-04 · Horas (S12) ====================================
   Two tabs, per §3.2. «Parte diario» is a day sheet with the week beside it:
   the 372 calendar on the left carries each day's total, so choosing a day
   and spotting the day nobody filled in are the same glance. «Resumen» rolls
   the period up per proyecto y capítulo and closes with the monthly
   reconciliation.

   The day sheet spans EVERY project, not the one in the project bar. An hour
   is recorded by the person who worked it, and that person moved between two
   jobs on Tuesday; a sheet scoped to one job asks them to remember which
   screen they were on. The project is therefore a column, which is exactly
   what the doc's four widths say (Trabajador 180 · Tipo 110 · Proyecto 200 ·
   Horas 80).

   Approval stays per worker per week — that is what the law and the payroll
   run care about — so the button lives on the worker's row and locks the week
   containing the selected day. */
      let hWeekRef = null,
        hChapter = null,
        hDay = null,
        hTab = "sheet";
      const DOW = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
      const WORKER_KINDS = { employee: "Empleado", selfEmployed: "Autónomo" };
      function horas(v) {
        $("#sub").textContent =
          "Parte diario por trabajador, con la semana al lado; y el resumen por proyecto y capítulo con la conciliación del mes.";
        if (!erp.state.projects.length) return noProjectsCard(v);
        if (!hDay) hDay = erp.today;
        hWeekRef = hDay;
        const tabs = `<div class="tabstrip">
    <button class="tab${hTab === "sheet" ? " on" : ""}" data-htab="sheet">Parte diario</button>
    <button class="tab${hTab === "summary" ? " on" : ""}" data-htab="summary">Resumen</button></div>`;
        v.innerHTML = tabs + (hTab === "sheet" ? horasSheet() : horasSummary());
        v.querySelectorAll("[data-htab]").forEach(
          (b) =>
            (b.onclick = () => {
              hTab = b.dataset.htab;
              render();
            }),
        );
        if (hTab === "sheet") wireHorasSheet();
        else wireHorasSummary();
      }

      /** The seven day cells and the day's grid. */
      function horasSheet() {
        const week = labourWeekAll(hDay);
        const dayRows = labourDayRows(hDay);
        const jobs = erp.state.projects.filter((p) => p.status !== "archived");
        const chaptersOf = (pid) => {
          const p = pid && erp.state.projects.find((x) => x.id === pid);
          return (p && p.baseline && p.baseline.chapters) || [];
        };
        const h = (m) => (m / 1000).toLocaleString("es-ES");
        return `
   <div class="stepbar">
    <button class="btn sm" id="hPrev">← Semana anterior</button>
    <span class="pill">${fmtD(week.days[0])} – ${fmtD(week.days[6])}</span>
    <button class="btn sm" id="hNext">Semana siguiente →</button>
    <span style="flex:1"></span>
    <button class="btn sm" id="hRepeat" title="Copia las horas del día anterior al día seleccionado">↻ Repetir día anterior</button>
    <button class="btn sm" id="hAssign">＋ Asignar trabajador</button>
    <button class="btn primary sm" id="hAdd">＋ Línea</button>
   </div>
   <div class="inbox2">
    <div class="inbox hcal"><div class="ih"><h3>Semana</h3>
      <span style="flex:1"></span><span class="tag">${h(week.totalMilli)} h</span></div>
      ${week.days
        .map(
          (
            d,
            i,
          ) => `<button class="hday${d === hDay ? " on" : ""}${i >= 5 ? " wknd" : ""}" data-hday="${d}">
        <span class="d">${DOW[i]} ${fmtD(d).slice(0, 5)}</span>
        <span class="h${week.totalsByDayMilli[i] ? "" : " zero"}">${week.totalsByDayMilli[i] ? h(week.totalsByDayMilli[i]) + " h" : "—"}</span></button>`,
        )
        .join("")}
    </div>
    <div class="card"><div class="ch"><h3>Parte del ${fmtD(hDay)}</h3>
      <span class="tag">${h(dayRows.reduce((s, r) => s + r.hoursMilli, 0))} h · ${dayRows.length} línea${dayRows.length === 1 ? "" : "s"}</span></div>
     <div class="scroll"><table class="hsheet"><thead><tr>
       <th class="cw">Trabajador</th><th class="ck">Tipo</th><th class="cp">Proyecto</th>
       <th class="ch2 num">Horas</th><th>Capítulo</th><th></th></tr></thead><tbody>
     ${
       dayRows
         .map(
           (r) => `<tr${r.locked ? ' class="locked"' : ""}>
       <td class="cw k">${esc(r.workerName)}</td>
       <td class="ck">${esc(WORKER_KINDS[r.kind] || r.kind)}</td>
       <td class="cp">${
         r.entry
           ? esc(r.projectCode || "—")
           : `<select class="inline" data-newproj="${r.workerId}">${jobs.map((p) => `<option value="${p.id}">${esc(p.code)}</option>`).join("")}</select>`
       }</td>
       <td class="ch2 num">${
         r.locked
           ? h(r.hoursMilli)
           : `<input class="inline hin" type="number" step="0.25" min="0" style="width:70px"
              data-entry="${r.entry ? r.entry.id : ""}" data-worker="${r.workerId}" value="${r.hoursMilli ? h(r.hoursMilli) : ""}">`
       }</td>
       <td>${
         r.entry
           ? esc(r.entry.chapterNum || "—")
           : `<select class="inline" data-newchap="${r.workerId}">${
               chaptersOf(jobs[0] && jobs[0].id)
                 .map((c) => `<option value="${c.num}">${c.num}. ${esc(c.name)}</option>`)
                 .join("") || '<option value="">—</option>'
             }</select>`
       }</td>
       <td>${
         r.locked
           ? `<button class="btn sm" data-unapprove="${r.workerId}">🔓 Reabrir semana</button>`

       }
          <button class="btn sm" data-workerdoc="${r.workerId}">🪪</button></td></tr>`,

         .join("") ||
       '<tr><td colspan="6"><div class="empty">Nadie tiene horas ni asignación para este día.</div></td></tr>'
     }
     </tbody></table></div></div>
   </div>
   ${labourRegisterAll()}`;
      }

      /** Rows for one day: every entry, plus a blank row per assigned worker with none. */
      function labourDayRows(day) {
        const rows = [];
        for (const l of erp.state.labour.filter((x) => x.date === day)) {
          const w = erp.state.workers.find((x) => x.id === l.workerId);
          rows.push({
            workerId: l.workerId,
            workerName: w ? w.name : "?",
            kind: w ? w.kind : "employee",
            projectCode: l.projectId ? erp.project(l.projectId).code : null,
            hoursMilli: l.hoursMilli,
            locked: !!l.locked,
            entry: l,
          });
        }
        const seen = new Set(rows.map((r) => r.workerId));
        for (const a of erp.state.assignments || []) {
          if (!a.workerId || a.from > day || a.to < day || seen.has(a.workerId)) continue;
          const w = erp.state.workers.find((x) => x.id === a.workerId);
          if (!w) continue;
          seen.add(a.workerId);
          rows.push({
            workerId: a.workerId,
            workerName: w.name,
            kind: w.kind,
            projectCode: null,
            hoursMilli: 0,
            locked: false,
            entry: null,
          });
        }
        return rows.sort((a, b) => a.workerName.localeCompare(b.workerName));
      }

      /** The week's day totals across every project — the calendar's own figures. */
      function labourWeekAll(dayIso) {
        const d = new Date(dayIso + "T00:00:00Z"),
          dw = d.getUTCDay();
        const start = isoAdd(dayIso, dw === 0 ? -6 : 1 - dw);
        const days = [0, 1, 2, 3, 4, 5, 6].map((i) => isoAdd(start, i));
        const totalsByDayMilli = days.map((x) =>
          erp.state.labour.filter((l) => l.date === x).reduce((s, l) => s + l.hoursMilli, 0),
        );
        return {
          weekStart: start,
          days,
          totalsByDayMilli,
          totalMilli: totalsByDayMilli.reduce((a, b) => a + b, 0),
        };
      }

      function wireHorasSheet() {
        const week = labourWeekAll(hDay);
        document.querySelectorAll("[data-hday]").forEach(
          (b) =>
            (b.onclick = () => {
              hDay = b.dataset.hday;
              render();
            }),

        $("#hPrev").onclick = () => {
          hDay = isoAdd(hDay, -7);
          render();
        };
        $("#hNext").onclick = () => {
          hDay = isoAdd(hDay, 7);
          render();
        };
        $("#hRepeat").onclick = () =>
          mutate(() => {
            // repeatDay is per project, so the day is repeated for every project that
            // had hours the previous day — the button says "the day", not "this job".
            const prev = isoAdd(hDay, -1);
            const pids = [
              ...new Set(
                erp.state.labour
                  .filter((l) => l.date === prev && l.projectId)
                  .map((l) => l.projectId),
              ),
            ];
            if (!pids.length) throw new Error("El día anterior no tiene horas que repetir");
            pids.forEach((pid) => erp.repeatDay(pid, prev, hDay, "operations"));
          }, "Jornada repetida desde el día anterior");
        $("#hAssign").onclick = () => assignWorkerDrawer(gProject || erp.state.projects[0].id);
        $("#hAdd").onclick = () => newHoursDrawer(hDay);
        document.querySelectorAll(".hsheet input.hin").forEach(
          (inp) =>
            (inp.onchange = () => {
              const val = +inp.value || 0,
                id = inp.dataset.entry;
              mutate(() => {
                if (id) {
                  if (val <= 0) erp.deleteHours(id, "operations");
                  else erp.correctHours(id, { hoursMilli: Math.round(val * 1000) }, "operations");

                if (val <= 0) return;
                const wid = inp.dataset.worker;
                const proj = document.querySelector(`[data-newproj="${wid}"]`);

                if (!proj || !proj.value) throw new Error("Selecciona el proyecto");
                erp.recordHours(
                  {
                    workerId: wid,
                    projectId: proj.value,
                    chapterNum: (chap && chap.value) || null,
                    hoursMilli: Math.round(val * 1000),

            }),
        );
        document
          .querySelectorAll("[data-approve]")

            (b) =>

                  () => erp.approveLabourWeek(b.dataset.approve, week.weekStart, "backoffice"),

                  "Semana reabierta",

          .querySelectorAll("[data-workerdoc]")

      /** Unit picker over the owner-maintained list, keeping a retired unit visible. */
      function listOptionsUnits(selected) {
        const rows = erp.listActive("units").slice();
        if (selected && !rows.some((r) => r.code === selected)) {
          const gone = erp.listAll("units").find((r) => r.code === selected);
          rows.unshift(
            gone
              ? Object.assign({}, gone, { _retired: true })
              : { code: selected, es: selected, _retired: true },
          );
        }
        return rows
          .map(
            (r) =>
              `<option value="${esc(r.code)}"${r.code === selected ? " selected" : ""}>${esc(r.code)} · ${esc(r.es || r.code)}${r._retired ? " (retirada)" : ""}</option>`,
          )
          .join("");
      }

      /* ---------- DMC-02 · capturing a price (S3) ----------

   budget written last month was priced from. So there is a "new" drawer and
   a read-only detail drawer, and no edit path at all — the absence is the
   feature.

   Net is derived from list × discount the moment either changes, but stays

        db.innerHTML = `<div class="fgrid">

          return Number.isFinite(n) ? Math.round(n * 100) : 0;

      /* ===================== Conciliación bancaria (spec §5.3) ===========================
   Statement on the left, candidate documents on the right, the proposed match
   and its REASONS in between. Every score and every reason comes from
   @repo/capability-reconciliation through the bridge; this block picks a
   movement, draws what came back, and turns a click into an engine call.

   The reasons are drawn deliberately, not decoratively. A person is being
   asked to accept or reject a proposal, and "0,99" gives them nothing to
   judge — "exact amount · reference quoted · same counterparty" gives them
   everything. A confidence with no argument behind it teaches people to click
   accept without reading, which is the failure mode this screen exists to
   avoid. */
      let recSel = null;
      const REC_REASON = {
        exactAmount: "importe exacto",
        amountWithinTolerance: "importe casi exacto",
        sameDate: "misma fecha",
        dateWithinTolerance: "fecha próxima",
        referenceQuoted: "referencia citada",
        counterpartyNamed: "tercero coincidente",
        directionAgrees: "signo correcto",
      };
      function reconApi() {
        return typeof ErpBridge !== "undefined" &&
          ErpBridge.reconciliation &&
          ErpBridge.reconciliation.available
          ? ErpBridge.reconciliation
          : null;
      }

      function conciliacion(v) {
        $("#sub").textContent =
          "Extracto a la izquierda, documentos candidatos a la derecha y la propuesta de emparejamiento en medio, con el porqué. La cola de movimientos sin conciliar es el indicador de salud del periodo.";
        const R = reconApi();
        const r = periodRange();
        const open = erp.unreconciledMovements(r.from, r.to);
        const allOpen = erp.unreconciledMovements();
        if (
          recSel &&
          !erp.state.movements.some((m) => m.id === recSel && m.status === "unallocated")
        )
          recSel = null;
        if (!recSel && open.length) recSel = open[0].id;
        const sel = recSel ? erp.state.movements.find((m) => m.id === recSel) : null;
        const suggestions = R && sel ? R.suggest(erp, sel.id) : [];
        const candidates = sel ? erp.reconciliationCandidates(sel.id) : [];
        const transfers = R ? R.internalTransfers(erp, r.from, r.to) : [];
        const closed = sel ? erp.bankPeriodClosed(sel.accountingDate) : false;
        const threshold = R ? R.autoAcceptScore : 1;

        v.innerHTML = `${periodNote(open.length, allOpen.length)}
   <div class="card"><div class="queuebar">
     <span class="n">${open.length}</span><span>movimientos sin conciliar en el periodo</span>
     <span style="flex:1"></span>
     ${transfers.length ? `<span class="pill b">${transfers.length} traspaso(s) interno(s) detectado(s)</span><button class="btn sm" id="rcTransfers">Marcar como internos</button>` : ""}
     <button class="btn sm" id="rcClose" title="Bloquea el periodo; exige cero movimientos sin conciliar">🔒 Cerrar periodo</button>
   </div></div>
   ${!R ? '<div class="card"><div class="empty">El emparejamiento asistido necesita el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>' : ""}
   <div class="rec">
    <div>
     <div class="card"><div class="ch"><h3>Extracto</h3><span class="tag">sin conciliar</span></div>
      ${
        open
          .map(
            (m) => `<div class="movrow${m.id === recSel ? " on" : ""}" data-mov="${m.id}">
        <span style="color:var(--muted)">${fmtD(m.accountingDate)}</span>
        <span class="cpt">${esc(m.concept || m.merchantText || "—")}${m.needsDoc ? ' <span class="pill r">sin respaldo</span>' : ""}</span>
        <span class="amt ${m.amountCents < 0 ? "neg" : "pos"}">${eur(m.amountCents)}</span></div>`,
          )
          .join("") || '<div class="empty">Nada pendiente de conciliar en este periodo.</div>'
      }
     </div>
     ${
       sel
         ? `<div class="card"><div class="ch"><h3>Propuestas</h3>
       <span class="tag">${suggestions.length} para ${esc(sel.concept || sel.merchantText || "")}</span></div>
      <div style="padding:11px 14px">
       ${closed ? '<div class="it" style="color:var(--danger);margin-bottom:8px">El periodo está cerrado. Reábrelo para conciliar.</div>' : ""}
       ${
         suggestions
           .map((s) => {
             const docs = s.docIds.map((id) => candidates.find((c) => c.id === id)).filter(Boolean);
             const strong = s.confidence >= threshold;
             return `<div class="sugg${strong ? " strong" : ""}">
          <div class="hd"><span class="conf" style="color:${strong ? "var(--greenDeep)" : "var(--body)"}">${Math.round(s.confidence * 100)}%</span>
           <span style="flex:1">${docs.map((d) => `${esc(d.reference)} · ${esc(d.counterparty)} · ${eur(d.outstandingCents)}`).join(" + ")}</span>
           ${closed ? "" : `<button class="btn sm${strong ? " primary" : ""}" data-accept="${s.docIds.join(",")}">Conciliar</button>`}</div>
          <div class="why">${s.reasons.map((x) => `<b>${REC_REASON[x] || x}</b>`).join(" · ")}${s.differenceCents ? ` · diferencia ${eur(s.differenceCents)}` : ""}${s.combination ? " · varios documentos" : ""}</div>
         </div>`;
           })
           .join("") ||
         '<div class="it" style="color:var(--muted)">Ningún documento explica este movimiento. Asígnalo a un proyecto o clasifícalo abajo.</div>'
       }
      </div>
      ${
        closed
          ? ""
          : `<div class="gtools" style="border-top:1px solid var(--hair)">
        <input class="inline" id="rcProj" placeholder="Nº de proyecto">
        <select class="inline" id="rcKind"><option value="material">Material</option><option value="labour">Mano de obra</option><option value="subcontract">Industrial</option><option value="other">Otro</option></select>

        <select class="inline" id="rcClass">${["overhead", "tax", "salary", "financial", "internalTransfer"].map((c) => `<option value="${c}">${{ overhead: "Gasto general", tax: "Impuestos", salary: "Nóminas", financial: "Financiero", internalTransfer: "Traspaso interno" }[c]}</option>`).join("")}</select>
        <button class="btn sm" id="rcClassify">Clasificar</button>
        <span style="flex:1"></span>
        <button class="btn sm" id="rcNoDoc">Marcar sin respaldo</button>
      </div>`
      }</div>`
         : ""
     }
    </div>
    <div class="bside">
     <div class="card" style="margin:0 0 12px"><div class="ch"><h3>Candidatos</h3><span class="tag">${candidates.length}</span></div>
      <div class="daylist" style="padding:10px 14px">
       ${
         candidates
           .slice(0, 12)
           .map(
             (
               c,
             ) => `<div class="it"><span class="pill ${c.direction === "in" ? "g" : "b"}">${c.kind === "invoice" ? "Emitida" : "Recibida"}</span>
         <span style="flex:1">${esc(c.reference)} · ${esc(c.counterparty)}</span><b>${eur(c.outstandingCents)}</b></div>`,
           )
           .join("") || '<div class="it">Sin documentos abiertos en este sentido.</div>'
       }
       ${candidates.length > 12 ? `<div class="it" style="color:var(--muted)">…y ${candidates.length - 12} más</div>` : ""}
      </div></div>
     <div class="card" style="margin:0"><div class="ch"><h3>Periodos cerrados</h3></div><div class="daylist" style="padding:10px 14px">
      ${
        (erp.state.bankPeriods || [])
          .map(
            (
              p,
            ) => `<div class="it">${fmtD(p.from)} – ${fmtD(p.to)} ${p.reopenedAt ? `<span class="pill y">reabierto ${fmtD(p.reopenedAt)}</span>` : '<span class="pill g">cerrado</span>'}
        ${p.reopenedAt ? `<br><span style="color:var(--muted)">${esc(p.reopenReason)}</span>` : `<button class="btn sm" data-reopen="${p.from}">Reabrir</button>`}</div>`,
          )
          .join("") || '<div class="it">Ningún periodo cerrado todavía.</div>'
      }
     </div></div>
    </div>
   </div>`;

        v.querySelectorAll("[data-mov]").forEach(
          (row) =>
            (row.onclick = () => {
              recSel = row.dataset.mov;
              render();
            }),
        );
        v.querySelectorAll("[data-accept]").forEach(
          (b) =>
            (b.onclick = () =>
              mutate(() => {
                const ids = b.dataset.accept.split(",");
                // One movement against several documents is exactly §5.3's partial
                // reconciliation; matchMovement takes one at a time, so a combination is
                // applied document by document against the same movement.
                ids.forEach((id) => {
                  const c = candidates.find((x) => x.id === id);
                  erp.matchMovement(
                    sel.id,
                    c.kind === "invoice" ? { invoiceId: id } : { billId: id },

                recSel = null;

        );

          assign.onclick = () =>
            mutate(() => {

              erp.allocateMovementToProject(sel.id, ref, $("#rcKind").value, "backoffice");
              recSel = null;
            }, "Movimiento asignado");
        const classify = $("#rcClassify");
        if (classify)
          classify.onclick = () =>
            mutate(() => {
              erp.classifyMovement(sel.id, $("#rcClass").value, "backoffice");

        const nodoc = $("#rcNoDoc");

        const tr = $("#rcTransfers");

          tr.onclick = () =>
            mutate(() => {

        $("#rcClose").onclick = () =>
          mutate(() => erp.closeBankPeriod(r.from, r.to, "backoffice"), "Periodo cerrado");
        v.querySelectorAll("[data-reopen]").forEach(
          (b) =>
            (b.onclick = async () => {
              const reason = await askText("Reabrir el periodo", {
                label: "Motivo de la reapertura",
                body: "Reabrir un periodo cerrado queda registrado con su motivo.",

      /* ===================== Comunicaciones (spec §5.7) ==================================

   NOTHING ON THIS SCREEN SENDS ANYTHING. "Aprobar" moves a draft to approved
   and "Registrar envío" marks it sent; the only thing that could put a message
   on a wire is the messaging capability's email-out port, whose sole bound

      let comSel = null,

      };

        return typeof ErpBridge !== "undefined" && ErpBridge.comms && ErpBridge.comms.available
          ? ErpBridge.comms
          : null;

        const C = commsApi();
        const tpls = erp.state.commsTemplates.filter((t) => t.active);
        if (comSel && !tpls.some((t) => t.id === comSel)) comSel = null;
        if (!comSel && tpls.length) comSel = tpls[0].id;
        const tpl = tpls.find((t) => t.id === comSel) || null;
        const pending = C ? C.pending(erp) : [];
        const queue = erp.state.commsQueue || [];
        const TABS = [
          ["plantillas", "Plantillas"],
          ["reglas", "Reglas"],
          ["cola", "Cola y historial"],
        ];

        v.innerHTML = `<div class="stepbar">
    ${TABS.map(([k, l]) => `<button class="btn sm${comTab === k ? " primary" : ""}" data-tab="${k}">${l}</button>`).join("")}
    <span style="flex:1"></span>
    ${pending.length ? `<span class="pill y">${pending.length} por encolar</span><button class="btn sm" id="cmQueue">Encolar pendientes</button>` : '<span class="tag">nada pendiente de encolar</span>'}
   </div>
   ${!C ? '<div class="card"><div class="empty">Las comunicaciones necesitan el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>' : ""}
   ${comTab === "plantillas" ? templatesPanel(tpls, tpl) : comTab === "reglas" ? rulesPanel() : queuePanel(queue, pending)}`;

        v.querySelectorAll("[data-tab]").forEach(
          (b) =>
            (b.onclick = () => {
              comTab = b.dataset.tab;
              render();
            }),
        );
        const q = $("#cmQueue");
        if (q)
          q.onclick = () =>
            mutate(() => {
              pending.forEach((p) => erp.queueCommunication(p, "backoffice"));
            }, pending.length + " mensaje(s) en cola — ninguno se ha enviado");
        if (comTab === "plantillas") wireTemplatesPanel(tpl);
        if (comTab === "reglas") wireRulesPanel();
        if (comTab === "cola") wireQueuePanel();
      }
      function templatesPanel(tpls, tpl) {
        const fams = {};
        tpls.forEach((t) => {
          (fams[t.family] = fams[t.family] || []).push(t);
        });
        const vars = ["cliente", "number", "importe", "fecha"];
        return `<div class="comm">
   <div class="card" style="margin:0"><div class="ch"><h3>Biblioteca</h3><button class="btn sm" id="cmNewTpl">＋</button></div>
    <div class="tpllist">
     ${
       Object.keys(fams)
         .map(
           (f) => `<div class="fam">${COM_FAMILY[f] || f}</div>
       ${fams[f].map((t) => `<button class="tpl${t.id === (tpl && tpl.id) ? " on" : ""}" data-tpl="${t.id}">${esc(t.label || t.key)} <span style="color:var(--faint)">v${t.version}</span></button>`).join("")}`,
         )
         .join("") || '<div class="empty">Sin plantillas.</div>'
     }
    </div></div>
   ${
     tpl

      /* ===================== Torre de Control (spec §2.1) =================================
   Eight cards, each carrying exactly the big/small figures the spec names, a
   twelve-period sparkline and the delta against the prior period. The colour
   dot is wired to the SAME numbers the card already shows (negative result,
   overdrawn balance, a payment week bigger than the cash on hand) rather than
   a second per-tile threshold store — "el umbral de cada indicador" already
   has a home in the alert rules below; duplicating it here is exactly the
   kind of two-sources-of-truth bug the rest of this codebase avoids.
   Card order/visibility is a viewing preference, not business data, so it
   lives in ErpStore meta (like the project selector's favourites) rather
   than in engine state — a second browser on the same tenant is allowed a

      /* TC-01 · four indicators, and only four.

   on a phone without scrolling, and that adding an indicator means removing
   another. Eight cards, a twelve-point sparkline on each, reorder/hide and a
   CSV export were built before that rule existed; they are gone.

      /* The Torre reads the whole chain and writes nothing: the doc says so twice,
   and says no panel opens from it. So this is five rows, ordered by severity
   rather than by age, each opening the record that caused it — and everything
   one actually DOES about an alert (assign, postpone, resolve, turn into a
   task, change the rule) happens in Configuración › Alertas. */
      function torreAlerts(alerts) {
        const rank = { critical: 0, high: 1, medium: 2, low: 3 };
        const top = [...alerts].sort((a, b) => (rank[a.sev] ?? 9) - (rank[b.sev] ?? 9)).slice(0, 5);
        return `<div class="card" style="margin:0"><div class="ch"><h3>Necesita atención</h3>
    <span class="tag">${alerts.filter((a) => a.sev === "critical").length} críticas · ${alerts.filter((a) => a.sev === "high").length} altas</span>

    ${alerts.length > 5 ? `<button class="btn sm" id="tAllAlerts">Ver las ${alerts.length}</button>` : ""}</div>
   <div class="almgr">${
     top
       .map(
         (a) => `<div class="alrow">
     <div>${a.sev === "critical" ? "🔴" : a.sev === "high" ? "🟡" : "🔵"}</div>
     <div><b class="click" data-goref='${esc(JSON.stringify(a.ref))}'>${esc(a.msg)}</b>
      <div class="meta">${a.assignee ? `<span>👤 ${esc(a.assignee)}</span>` : ""}${a.dueDate ? `<span>📅 ${fmtD(a.dueDate)}</span>` : ""}</div></div>
    </div>`,
       )
       .join("") || '<div class="empty">Sin alertas. Todo en orden.</div>'
   }</div></div>`;

      /** §2.1 "exportar la vista a PDF/Excel" — a real CSV download; print (Ctrl+P) covers PDF honestly via the browser's own dialog. */
      /* ===================== table export: CSV and real .xlsx =====================
   A genuine .xlsx, not a CSV wearing an Excel extension. An .xlsx is a ZIP of
   XML parts, so the ZIP writer below stores (never deflates) the five parts
   Excel needs. Every cell is written as an inline string on purpose: postal
   codes, phone numbers and client codes are text, and letting Excel guess
   turns "08960" into 8960 and eats the leading zero. No dependency — the
   whole writer is ~60 lines and the alternative was shipping a library into
   a page that has to work from a bare static host. */
      const CRC_T = (() => {
        let c,
          t = [];
        for (let n = 0; n < 256; n++) {
          c = n;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          t[n] = c >>> 0;
        }
        return t;
      })();
      function crc32(b) {
        let c = 0xffffffff;
        for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xff] ^ (c >>> 8);
        return (c ^ 0xffffffff) >>> 0;
      }
      function zipStore(files) {
        const enc = new TextEncoder(),
          parts = [],
          central = [];
        let off = 0;
        const u16 = (a, o, v) => {
          a[o] = v & 255;
          a[o + 1] = (v >>> 8) & 255;
        };
        const u32 = (a, o, v) => {
          a[o] = v & 255;
          a[o + 1] = (v >>> 8) & 255;
          a[o + 2] = (v >>> 16) & 255;
          a[o + 3] = (v >>> 24) & 255;
        };
        for (const f of files) {
          const name = enc.encode(f.path),
            data = f.bytes,
            crc = crc32(data);
          const lh = new Uint8Array(30 + name.length);
          u32(lh, 0, 0x04034b50);
          u16(lh, 4, 20);
          u16(lh, 6, 0);
          u16(lh, 8, 0);
          u16(lh, 10, 0);
          u16(lh, 12, 0);
          u32(lh, 14, crc);
          u32(lh, 18, data.length);
          u32(lh, 22, data.length);
          u16(lh, 26, name.length);
          u16(lh, 28, 0);
          lh.set(name, 30);
          parts.push(lh, data);
          const ch = new Uint8Array(46 + name.length);
          u32(ch, 0, 0x02014b50);
          u16(ch, 4, 20);
          u16(ch, 6, 20);
          u16(ch, 8, 0);
          u16(ch, 10, 0);
          u16(ch, 12, 0);
          u16(ch, 14, 0);
          u32(ch, 16, crc);
          u32(ch, 20, data.length);
          u32(ch, 24, data.length);
          u16(ch, 28, name.length);
          u16(ch, 30, 0);
          u16(ch, 32, 0);
          u16(ch, 34, 0);
          u16(ch, 36, 0);
          u32(ch, 38, 0);
          u32(ch, 42, off);
          ch.set(name, 46);
          central.push(ch);
          off += lh.length + data.length;
        }
        let cs = 0;
        central.forEach((c) => (cs += c.length));
        const end = new Uint8Array(22);
        u32(end, 0, 0x06054b50);
        u16(end, 4, 0);
        u16(end, 6, 0);
        u16(end, 8, files.length);
        u16(end, 10, files.length);
        u32(end, 12, cs);
        u32(end, 16, off);
        u16(end, 20, 0);
        return new Blob([...parts, ...central, end], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        });
      }
      const xmlEsc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" })[c],
        );
      const colRef = (i) => {
        let s = "",
          n = i;
        do {
          s = String.fromCharCode(65 + (n % 26)) + s;
          n = Math.floor(n / 26) - 1;
        } while (n >= 0);
        return s;
      };
      function xlsxBlob(sheetName, rows) {
        const enc = new TextEncoder();
        const sheet = rows
          .map(
            (r, ri) =>
              `<row r="${ri + 1}">` +
              r
                .map(
                  (c, ci) =>
                    `<c r="${colRef(ci)}${ri + 1}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(c)}</t></is></c>`,
                )
                .join("") +
              `</row>`,
          )
          .join("");
        const f = (path, xml) => ({
          path,
          bytes: enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' + xml),
        });
        return zipStore([
          f(
            "[Content_Types].xml",
            '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>',
          ),
          f(
            "_rels/.rels",
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
          ),
          f(
            "xl/workbook.xml",
            `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(sheetName).slice(0, 31)}" sheetId="1" r:id="rId1"/></sheets></workbook>`,
          ),
          f(
            "xl/_rels/workbook.xml.rels",
            '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>',
          ),
          f(
            "xl/worksheets/sheet1.xml",
            `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheet}</sheetData></worksheet>`,
          ),
        ]);
      }
      function downloadBlob(blob, filename) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      }
      /** Excel opens a UTF-8 CSV correctly only with a BOM; without it accents break. */
      function downloadCsv(rows, filename) {
        const csv = rows
          .map((r) => r.map((x) => `"${String(x ?? "").replace(/"/g, '""')}"`).join(","))
          .join("\r\n");
        downloadBlob(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }), filename);
      }

      /* ---- Alerts panel as a manager, not a read-only feed (DAS-06/07) ----
   Grouped by type then by project, because that is how a backoffice person
   actually triages a list: "what kind of problem is this" first, "which job
   does it belong to" second. Every row can be assigned, given a deadline,
   snoozed with a reason, resolved with a note and evidence, or turned into a
   task — the four verbs §2.1 names for "gestor, no aviso". */
      const ALERT_TYPE_LABEL = {
        economica: "Económica",
        tecnica: "Técnica",
        documental: "Documental",
        fiscal: "Fiscal",
      };
      let almgrGroupBy = "type";
      function alertsPanel(alerts) {
        const groups = {};
        alerts.forEach((a) => {
          const g =
            almgrGroupBy === "type"
              ? ALERT_TYPE_LABEL[a.type] || a.type
              : a.project || "Sin proyecto";
          (groups[g] = groups[g] || []).push(a);
        });
        const keys = Object.keys(groups).sort();
        return `<div class="card" style="margin:0"><div class="ch"><h3>Alertas</h3>
    <span class="tag">${alerts.filter((a) => a.sev === "critical").length} críticas · ${alerts.filter((a) => a.sev === "high").length} altas</span>
    <span style="flex:1"></span>
    <button class="btn sm ${almgrGroupBy === "type" ? "primary" : ""}" data-grp="type">Por tipo</button>
    <button class="btn sm ${almgrGroupBy === "project" ? "primary" : ""}" data-grp="project">Por proyecto</button>
    <button class="btn sm" id="aRules">⚙ Reglas</button></div>
   <div class="almgr">${
     keys
       .map(
         (g) =>
           `<div class="algroup">${esc(g)}</div>${groups[g].map((a) => alertRowHtml(a)).join("")}`,
       )
       .join("") || '<div class="empty">Sin alertas. Todo en orden.</div>'
   }</div></div>`;
      }
      function alertRowHtml(a) {
        const icon = a.sev === "critical" ? "🔴" : a.sev === "high" ? "🟡" : "🔵";
        return `<div class="alrow" data-key="${esc(a.key)}">
   <div>${icon}</div>
   <div><b class="click" data-goref='${esc(JSON.stringify(a.ref))}'>${esc(a.msg)}</b>
    <div class="meta">${a.assignee ? `<span>👤 ${esc(a.assignee)}</span>` : ""}${a.dueDate ? `<span>📅 ${fmtD(a.dueDate)}</span>` : ""}${a.snoozedUntil ? `<span>💤 hasta ${fmtD(a.snoozedUntil)}</span>` : ""}</div></div>
   <div class="acts">
    <button class="btn sm" data-assign="${esc(a.key)}">Asignar</button>
    <button class="btn sm" data-due="${esc(a.key)}">Fecha</button>
    <button class="btn sm" data-snooze="${esc(a.key)}">Posponer</button>
    <button class="btn sm" data-resolve="${esc(a.key)}">Resolver</button>
    <button class="btn sm" data-totask="${esc(a.key)}" ${a.taskId ? "disabled" : ""}>${a.taskId ? "En tareas" : "→ Tarea"}</button>
   </div></div>`;
      }
      function wireAlertsPanel() {
        document.querySelectorAll("[data-grp]").forEach(
          (b) =>
            (b.onclick = () => {
              almgrGroupBy = b.dataset.grp;
              render();
            }),
        );
        document
          .querySelectorAll("[data-goref]")
          .forEach((n) => (n.onclick = () => gotoAlert(JSON.parse(n.dataset.goref))));
        $("#aRules")?.addEventListener("click", () => alertRulesDrawer());
        document.querySelectorAll("[data-assign]").forEach(
          (b) =>
            (b.onclick = async () => {
              const who = await askText("Asignar la alerta", {
                label: "¿A quién se asigna?",
                placeholder: "Nombre o puesto",
                required: true,
                okLabel: "Asignar",
              });
              if (who === null) return;
              mutate(() => erp.assignAlert(b.dataset.assign, who, "backoffice"), "Alerta asignada");
            }),
        );
        document.querySelectorAll("[data-due]").forEach(
          (b) =>
            (b.onclick = async () => {
              const d = await askText("Fecha límite", {
                label: "Vence el",
                type: "date",
                value: erp.today,
                required: true,
                okLabel: "Guardar",
              });
              if (d === null) return;
              mutate(
                () => erp.setAlertDue(b.dataset.due, d, "backoffice"),
                "Fecha límite guardada",
              );
            }),
        );
        document.querySelectorAll("[data-snooze]").forEach(
          (b) =>
            (b.onclick = async () => {
              // Date and reason together: postponing without saying why is how a
              // list of alerts quietly becomes a list of things nobody looked at.
              const r = await ask(
                "Posponer la alerta",
                [
                  {
                    key: "d",
                    label: "Hasta el",
                    // Tomorrow, not today: postponing something until today is
                    // not postponing it, and the alert would come straight back.
                    type: "date",
                    value: isoAdd(erp.today, 1),
                    min: isoAdd(erp.today, 1),
                    required: true,
                  },
                  {
                    key: "reason",
                    label: "Motivo",
                    type: "textarea",
                    placeholder: "Opcional, pero es lo que explica la espera…",
                    rows: 3,
                  },
                ],
                { okLabel: "Posponer" },
              );
              if (r === null) return;
              const d = r.d,
                reason = r.reason || "";
              mutate(
                () => erp.snoozeAlert(b.dataset.snooze, d, reason, "backoffice"),
                "Alerta pospuesta",
              );
            }),
        );
        document.querySelectorAll("[data-resolve]").forEach(
          (b) =>
            (b.onclick = async () => {
              const r = await ask(
                "Resolver la alerta",
                [
                  {
                    key: "note",
                    label: "Nota de resolución",
                    type: "textarea",
                    rows: 3,
                    required: true,
                    requiredMsg: "Una alerta no se cierra sin decir cómo se resolvió.",
                  },
                  {
                    key: "ev",
                    label: "Evidencia",
                    placeholder: "Nº de factura, documento, referencia… (opcional)",
                  },
                ],
                { okLabel: "Resolver" },
              );
              if (r === null) return;
              const note = r.note,
                ev = r.ev || "";
              mutate(
                () =>
                  erp.resolveAlert(
                    b.dataset.resolve,
                    note,
                    ev.trim() ? [ev.trim()] : [],
                    "backoffice",
                  ),
                "Alerta resuelta",
              );
            }),
        );
        document.querySelectorAll("[data-totask]").forEach((b) => {
          if (b.disabled) return;
          b.onclick = async () => {
            const row = b.closest(".alrow");
            const msg = row.querySelector("[data-goref]").textContent;
            const due = await askText("Convertir en tarea", {
              label: "Vence el",
              type: "date",
              value: erp.today,
              required: true,
              okLabel: "Crear tarea",
            });
            if (due === null) return;
            mutate(
              () => erp.convertAlertToTask(b.dataset.totask, msg, "backoffice", due, "backoffice"),
              "Convertida en tarea",
            );
          };
        });
      }
      /** §2.1 "editor de reglas: condición, umbral, destinatario y canal". */
      function alertRulesDrawer() {
        const db = openDrawer("Reglas de alertas");
        const render2 = () => {
          const rules = erp.ensureAlertRules();
          db.innerHTML = `<div class="rulesbox">${rules
            .map(
              (r) => `<div class="rulesrow">
      <span>${esc(r.label)} <span class="tag">${ALERT_TYPE_LABEL[r.type] || r.type}</span></span>
      <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" data-en="${r.code}" ${r.enabled ? "checked" : ""}> activa</label>
      ${r.thresholdValue != null ? `<input type="number" min="0" data-th="${r.code}" value="${r.thresholdValue}" title="días">` : "<span></span>"}
      <select data-rec="${r.code}"><option value="backoffice"${r.recipient === "backoffice" ? " selected" : ""}>Oficina</option><option value="operations"${r.recipient === "operations" ? " selected" : ""}>Obra</option></select>
      <select data-ch="${r.code}"><option value="app"${r.channel === "app" ? " selected" : ""}>App</option><option value="email"${r.channel === "email" ? " selected" : ""}>Email</option></select>
     </div>`,
            )
            .join("")}</div>`;
          // No render2() after these: the field the user just edited already shows
          // the value they set (native checkbox/select/input state), and rebuilding
          // db.innerHTML from inside that same field's own change/blur handler
          // fought the browser over a node it was mid-way through removing —
          // "node to be removed is no longer a child of this node" — for no benefit,
          // since nothing else on screen depends on the value that just changed.
          db.querySelectorAll("[data-en]").forEach(
            (cb) =>
              (cb.onchange = () =>
                mutate(
                  () => erp.updateAlertRule(cb.dataset.en, { enabled: cb.checked }, "backoffice"),
                  "Regla actualizada",
                )),
          );
          db.querySelectorAll("[data-th]").forEach(
            (inp) =>
              (inp.onchange = () =>
                mutate(
                  () =>
                    erp.updateAlertRule(
                      inp.dataset.th,
                      { thresholdValue: +inp.value || 0 },
                      "backoffice",
                    ),
                  "Umbral actualizado",
                )),
          );
          db.querySelectorAll("[data-rec]").forEach(
            (s) =>
              (s.onchange = () =>
                mutate(
                  () => erp.updateAlertRule(s.dataset.rec, { recipient: s.value }, "backoffice"),
                  "Destinatario actualizado",
                )),
          );
          db.querySelectorAll("[data-ch]").forEach(
            (s) =>
              (s.onchange = () =>
                mutate(
                  () => erp.updateAlertRule(s.dataset.ch, { channel: s.value }, "backoffice"),
                  "Canal actualizado",
                )),
          );
        };
        render2();
      }

      /* =============================== Shared master-data list primitive (S2) ==============
   Toolbar + table + pagination + export, written once so DMT-01..04 (Clientes,
   Proveedores, Subcontratas, Personal) inherit the same behaviour instead of
   each retyping it (decision 15). Page sizes are 10/25/50 per the doc —
   Clientes shipped with 10/20/50, which this corrects.

   `ids` lets a screen keep pre-existing element ids (Clientes' #cliQ etc. are
   already asserted on by site-e2e); a screen with no history gets fresh
   generic ids. Mobile: every <td> carries data-th, and CSS turns the table
   into two-line-ish cards at the phone breakpoint (verified in full in S14) —
   the same table markup serves both, so there is exactly one row template to
   keep correct. */
      const LIST_PAGE_SIZES = [10, 25, 50];
      const listState = {};
      function getListState(id, defSize) {
        if (!listState[id]) listState[id] = { q: "", page: 1, pageSize: defSize || 25 };
        return listState[id];
      }
      async function loadListPageSize(id) {
        try {
          const m = await ErpStore.getMeta("ui.list." + id);
          return m && LIST_PAGE_SIZES.includes(m.pageSize) ? m.pageSize : null;
        } catch (e) {
          return null;
        }
      }
      function saveListPageSize(id, size) {
        try {
          ErpStore.setMeta("ui.list." + id, { pageSize: size });
        } catch (e) {}
      }

      /**
       * cfg: { id, ids?, newLabel, onNew, searchPlaceholder, nounSingular, nounPlural,
       *        baseRows, matches(row,q), columns:[{label,get,primary?,html?,sheet?}],
       *        onRowClick(id), exportFile, exportSheetName, emptyText }
       */
      /**
       * cfg gains three optional flags for compact, fixed-height blocks like
       * COM-02's programadas/realizadas pair (S4): `fixedSize` pins the page size
       * and hides the "filas por pantalla" selector — the block's height is fixed
       * by the doc, not chosen by the operator; `noExport`/`noNew` drop those
       * toolbar buttons when a block has neither (a read-mostly sub-list still
       * gets its own search and pagination either way).
       */
      function renderMasterList(v, cfg) {
        const st = getListState(cfg.id, cfg.fixedSize || cfg.defSize);
        if (cfg.fixedSize) st.pageSize = cfg.fixedSize;
        const ids = Object.assign(
          {
            q: "mlQ",
            size: "mlSize",
            prev: "mlPrev",
            next: "mlNext",
            newBtn: "mlNew",
            exp: "mlExp",
            expMenu: "mlExpMenu",
            expXlsx: "mlExpXlsx",
            expCsv: "mlExpCsv",
          },
          cfg.ids || {},
        );
        const q = st.q.trim().toLowerCase();
        const base = cfg.baseRows;
        const rows = q ? base.filter((r) => cfg.matches(r, q)) : base;
        const pages = Math.max(1, Math.ceil(rows.length / st.pageSize));
        if (st.page > pages) st.page = pages;
        const start = (st.page - 1) * st.pageSize,
          page = rows.slice(start, start + st.pageSize);
        const cols = cfg.columns;
        const sing = cfg.nounSingular || "registro",
          plur = cfg.nounPlural || "registros";
        v.innerHTML = `<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
    ${cfg.noNew ? "" : `<button class="btn primary sm" id="${ids.newBtn}">${cfg.newLabel || "＋ Nuevo"}</button>`}
    <input id="${ids.q}" placeholder="${esc(cfg.searchPlaceholder || "Buscar…")}" value="${esc(st.q)}"
      style="flex:0 1 280px;min-width:190px;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)">
    ${
      cfg.noExport
        ? ""
        : `<span style="position:relative">
      <button class="btn sm" id="${ids.exp}">⬇ Exportar</button>
      <span id="${ids.expMenu}" style="display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:160px;
        background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:4px;flex-direction:column">
        <button class="btn sm" id="${ids.expXlsx}" style="justify-content:flex-start;border:0;background:none">Excel (.xlsx)</button>
        <button class="btn sm" id="${ids.expCsv}" style="justify-content:flex-start;border:0;background:none">CSV (.csv)</button>
