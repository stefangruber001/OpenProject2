/* =============================== Budget builder (spec §3.3) =========================
   Three zones at once: the chapter/line tree, the editable grid, and a totals
   panel that recalculates on every keystroke.

   ONE RULE HOLDS THIS TOGETHER: this block computes no money. Every figure on
   screen — line amounts, chapter subtotals, base, tax, withholding, total,
   margin, the value of the lines still pending a price — is asked of
   erp.budgetTotals(), which is the same function the emitted document uses. The
   "live" recalculation is therefore genuinely live rather than an optimistic
   copy that drifts from the document by a cent and is discovered by a customer.

   Editing writes through erp.updateLine(), which refuses on a frozen, issued or
   accepted version. The grid disables its inputs in that case too, but the
   refusal is the engine's, not the view's. */
let bBudget=null, bChapter=null;
const bMoney=s=>{const n=Number(String(s).replace(",","."));return Number.isFinite(n)?Math.round(n*100):0;};
const bQty=s=>{const n=Number(String(s).replace(",","."));return Number.isFinite(n)?Math.round(n*1000):0;};
/** Line amount and margin, exactly as budgetTotals computes them. */
function bLineAmt(l){const q=l.subLines.length?l.subLines.reduce((a,s)=>a+Math.round(s.qtyMilli*(1+(s.wastePct||0)/100)),0):l.qtyMilli;
  return {qtyMilli:q, saleCents:l.lumpSum?l.priceCents:Math.round(q*l.priceCents/1000), costCents:l.lumpSum?l.costCents:Math.round(q*l.costCents/1000)};}
function bStatus(l){return l.pending?"pending":l.optionalLine?"optional":"normal";}

/* Blob-backed images are fetched once per session and the object URL kept.
   Revoking on every re-render would blank a thumbnail the user is still
   looking at, and the cache is bounded by the number of distinct pictures in
   the dataset, not by how often a view re-renders. */
const IMGURL=new Map();
async function imageUrl(key){
  if(IMGURL.has(key)) return IMGURL.get(key);
  // On the server a picture already HAS an address, so point the <img> at it
  // and let the browser stream and cache it like any other image. Downloading
  // the bytes to build an object URL would hold every thumbnail on screen in
  // memory for as long as the page is open, and re-download them all on the
  // next visit — the response is marked immutable precisely so it need not be.
  const direct=ErpStore.blobUrl(key);
  if(direct){ IMGURL.set(key,direct); return direct; }
  try{ const b=await ErpStore.getBlob(key); if(!b) return null;
    const u=URL.createObjectURL(b); IMGURL.set(key,u); return u; }catch(e){ return null; }
}
function paintImages(root){
  (root||document).querySelectorAll('img[data-blob]').forEach(async im=>{
    const u=await imageUrl(im.dataset.blob); if(u) im.src=u; else im.alt="(imagen no disponible)";
  });
}

/* ---------- The customer document's own vocabulary (COM-03, "ES/CA output")
   These labels are NOT in the i18n dictionary, and the block that prints them
   carries `translate="no"`, on purpose. The dictionary translates the
   INTERFACE for whoever is at the screen; this table translates a DOCUMENT for
   whoever receives it. They are different people making different choices:
   `budget.language` is a field an estimator sets per customer, and it must not
   move because a colleague prefers to work in English. Keeping the document
   out of the toggle is what makes both behaviours correct at once. */
const DOCL={
  es:{doc:"PRESUPUESTO",base:"Base imponible",options:"Opcionales (aparte)",vat:"IVA",
    total:"TOTAL",perM2:"Total por m²",pending:"⚠ Líneas pendientes de precio (no incluidas)",
    annex:"Anexo gráfico",page:"página",of:"de",item:"partida",validity:"Validez",
    exclusions:"Exclusiones",assumptions:"Supuestos",
    sections:{base:"",optional:" (opcional — aparte)",outOfScope:" (fuera de presupuesto)",extras:" (extras)"}},
  ca:{doc:"PRESSUPOST",base:"Base imposable",options:"Opcionals (a part)",vat:"IVA",
    total:"TOTAL",perM2:"Total per m²",pending:"⚠ Partides pendents de preu (no incloses)",
    annex:"Annex gràfic",page:"pàgina",of:"de",item:"partida",validity:"Validesa",
    exclusions:"Exclusions",assumptions:"Supòsits",
    sections:{base:"",optional:" (opcional — a part)",outOfScope:" (fora de pressupost)",extras:" (extres)"}},
};

const SECL={base:"Base",optional:"Opcional",outOfScope:"Fuera de presupuesto",extras:"Extras"};
/* Which of the two right-hand tabs is showing. Module state, not per-render,
   so that editing a row does not throw the estimator back to Totales while
   they are reading the visit report they are pricing from. */
let bTab="totals";

/** The visit this presupuesto is being written from, if there is one.
    Preferring the explicit link (S4's `visit.budgetId`) and falling back to
    the customer's own last capture — labelled as the guess it is, because a
    report from the wrong visit is worse than no report at all. */
function budgetVisit(b){
  const linked=erp.state.visits.find(x=>x.budgetId===b.id);
  if(linked) return {visit:linked,linked:true};
  const mine=erp.state.visits
    .filter(x=>x.status==="done")
    .filter(x=>{const o=erp.state.opportunities.find(y=>y.id===x.opportunityId); return o&&o.partyId===b.partyId;})
    .sort((x,y)=>(y.completedAt||"").localeCompare(x.completedAt||""));
  return mine.length?{visit:mine[0],linked:false}:null;
}

function budgetBuilder(v,id){

  const stage=erp.budgetStage(b);
  const meta=BUD_STAGES.find(s=>s[0]===stage)||["draft","Borrador","y"];
  const t=erp.budgetTotals(id,vsel);
  // Outside the shell, per §3.2: the rail, breadcrumb and page heading go, and
  // the three panes get the room. render() takes the class off again on the
  // way to any other screen.
  document.body.classList.add('fs');

  v.innerHTML=`
   <div class="pb">
    <div class="pbbar">
     <button class="btn sm" id="bBack" title="Todos los presupuestos">←</button>
     <div class="who"><b>${b.number} · v${V.vNumber}</b><span>${esc(erp.party(b.partyId).name)}</span></div>
     <span class="pill ${meta[2]}">${meta[1]}</span>
     ${locked&&stage!=="accepted"?'<span class="pill b">Congelada</span>':''}
     <div class="tot"><span>Total</span><b id="pbTotal">${eur(t.grandCents)}</b></div>
     <div class="acts">
      ${locked&&!b.acceptedVersionId?'<button class="btn sm" id="bNewVer">Nueva versión</button>':''}
      <button class="btn sm" id="bSave">Guardar</button>
      <button class="btn sm" id="bPreview">Vista previa</button>
      ${V.issued&&!V.customerResponse&&!b.acceptedVersionId
        ?'<button class="btn primary sm" id="bAnswer">Respuesta del cliente</button>':''}
      ${locked?"":'<button class="btn primary sm" id="bSend">Enviar</button>'}
     </div>
    </div>

    <div class="pbpanes">
     <div class="pbpane">
      <div class="pbh">Capítulos<span style="flex:1"></span>
       ${locked?"":'<button class="btn sm" id="bAddChap">+</button>'}</div>
      <div class="btree" id="bTree" style="max-height:none"></div>
     </div>

     <div class="pbpane mid bgrid">
      <div class="pbh">Partidas<span style="flex:1"></span><span class="tag" id="bGridTag"></span></div>
      <div class="scroll"><table><thead><tr>
        <th style="width:16px"></th><th>Nº</th><th>Código</th><th>Descripción</th><th>Ud</th><th class="num">Cantidad</th>
        <th class="num">P. venta</th><th class="num">Importe</th>
        <th class="num int">P. coste</th><th class="num int">Margen</th>
        <th>Estado</th><th>Imágenes</th>${locked?"":"<th></th>"}
      </tr></thead><tbody id="bRows"></tbody></table></div>
     </div>

     <div class="pbpane">
      <div class="pbtabs">
       <button data-tab="totals"${bTab==="totals"?' class="on"':''}>Totales</button>
       <button data-tab="visit"${bTab==="visit"?' class="on"':''}>Visita</button>
      </div>
      <div class="pbbody" id="bSide"></div>
     </div>
    </div>

    <div class="pbcond">
     <label>Validez <input type="date" id="bcValid" value="${esc(b.validityDate||"")}"${dis}></label>
     <label>Idioma del documento
      <select id="bcLang"${dis}>
       <option value="es"${b.language==="es"?" selected":""}>Español</option>
       <option value="ca"${b.language==="ca"?" selected":""}>Català</option>
      </select></label>
     <label class="grow" style="flex:1 1 220px">Condiciones de pago
      <input class="grow" id="bcPay" value="${esc(b.paymentConditions||"")}" placeholder="40% a la firma, 60% a la entrega"${dis}></label>
     <label>Superficie <input type="number" id="bcM2" min="0" step="1" style="width:74px" value="${b.surfaceM2||0}"${dis}> m²</label>

  $('#bBack').onclick=()=>go("quotes");
  const addChap=$('#bAddChap');
  if(addChap) addChap.onclick=()=>mutate(()=>{

  // "Guardar" is in the bar because the specification's own layout puts it
  // there — but §3.1 is equally explicit that nothing waits for it, and this
  // screen already writes every keystroke through to the engine. So the button
  // does the one honest thing left: it flushes the debounced write NOW and
  // says the work is safe. It never claims to have saved something that was
  // not already saved.
  $('#bSave').onclick=()=>{ persistNow().then(()=>toast("Guardado")).catch(()=>toast("⚠ No se ha podido guardar")); };

  const answer=$('#bAnswer'); if(answer) answer.onclick=()=>budgetResponseDrawer(id,vsel);

    "Nueva versión creada");
  $('#bValidate').onclick=()=>{
    const issues=erp.validateBudget(id);
    toast(issues.length?`${issues.filter(i=>i.level==="block").length} bloqueos · ${issues.filter(i=>i.level==="warn").length} avisos`:"Sin incidencias");
    builderIssues(id,issues);

  v.querySelectorAll('.pbtabs button').forEach(btn=>btn.onclick=()=>{ bTab=btn.dataset.tab; render(); });

  if(!locked){
    const hdr=(el,patch,msg)=>{ el.onchange=()=>mutate(()=>erp.updateBudget(id,patch(el),"backoffice"),msg); };
    hdr($('#bcValid'),el=>({validityDate:el.value}),"Validez actualizada");

    hdr($('#bcPay'),el=>({paymentConditions:el.value}),"Condiciones de pago actualizadas");
    hdr($('#bcM2'),el=>({surfaceM2:Math.max(0,Number(el.value)||0)}),"Superficie actualizada");
  }

  builderRows(id,vsel,locked,SECL);
  builderRecalc(id,vsel);

  /* One delegated listener for the whole grid. `input` fires on every
     keystroke — that is what makes the right-hand panel live — and writes
     straight through to the engine record, so the tree, the panel and the
     document can never disagree about what was typed. `change` fires once when
     the field is left, and that is the one the audit trail hears: a trail with
     an entry per character is a trail nobody reads.

     `num` is the exception and goes through setLineNumber, not editLine: a
     number is checked against every other row before it is taken, so it can
     be REFUSED — and a refusal has to be seen once, when the field is left,
     not shouted on every keystroke of a number being typed. */
  if(!locked){
    const rows=$('#bRows');
    const write=(target,audit)=>{
      const f=target.dataset.f, lid=target.dataset.line; if(!f||!lid)return;
      const val=target.value;
      if(f==="num"){
        if(!audit) return; // committed on blur only — see above
        try{ erp.setLineNumber(id,lid,val,"backoffice"); }
        catch(err){ toast(err.code==="DUPLICATE_NUMBER"?"⚠ Ese número ya está en uso":"⚠ "+err.message); }
        render(); return;
      }
      const patch=f==="qty"?{qtyMilli:bQty(val)}
        :f==="cost"?{costCents:bMoney(val)}
        :f==="price"?{priceCents:bMoney(val)}
        :f==="status"?{pending:val==="pending",optionalLine:val==="optional"}
        :{[f]:val};
      try{ erp.editLine(id,lid,patch,{audit,user:"backoffice"}); }
      catch(err){ toast("⚠ "+err.message); return; }
      builderRecalc(id,vsel,lid); persist();
    };
    rows.addEventListener('input',e=>write(e.target,false));
    rows.addEventListener('change',e=>write(e.target,true));
  }
}

/* ---------- Dragging (COM-03) ----------
   Chapters reorder among themselves; lines reorder within a chapter and move
   BETWEEN chapters, which is the case that earns the feature: a line under the
   wrong capítulo is in the wrong subtotal and, if that chapter is optional or
   out of scope, in the wrong part of the customer's document.

   The drag id lives here rather than in dataTransfer because Safari will not
   let a dragover handler read dataTransfer — and dragover is where the drop
   target has to decide whether it accepts. */
let bDrag=null; // {kind:"chapter"|"line", id}
function bDragClear(){
  document.querySelectorAll('.over,.drag').forEach(el=>el.classList.remove('over','drag'));
}
/** What can be picked up. `mark` is the element that dims while it travels —
    for a line that is the row, not the 16 px handle you actually grabbed. */
function bDragSource(el,kind,dragId,mark){
  el.draggable=true;
  el.addEventListener('dragstart',e=>{
    bDrag={kind,id:dragId}; (mark||el).classList.add('drag');
    e.dataTransfer.effectAllowed="move";
    try{ e.dataTransfer.setData("text/plain",dragId); }catch(err){ /* Safari refuses some types */ }
  });
  el.addEventListener('dragend',()=>{ bDrag=null; bDragClear(); });
}
/** Where it can be put down. */
function bDropTarget(el,accept,onDrop){
  el.addEventListener('dragover',e=>{
    if(!bDrag||!accept(bDrag)) return;
    e.preventDefault(); e.dataTransfer.dropEffect="move"; el.classList.add('over');
  });
  el.addEventListener('dragleave',()=>el.classList.remove('over'));
  el.addEventListener('drop',e=>{
    if(!bDrag||!accept(bDrag)) return;
    e.preventDefault(); e.stopPropagation();
    const d=bDrag; bDrag=null; bDragClear();
    onDrop(d);
  });
}

/** Renders the grid body. Called once per builder render — never on keystroke,
    which would move the caret out from under the person typing. */
function builderRows(id,vsel,locked,SECL){
  const V=erp.version(id,vsel);
  const chapters=bChapter?V.chapters.filter(c=>c.id===bChapter):V.chapters;
  $('#bGridTag').textContent=bChapter?"capítulo seleccionado":`${V.chapters.length} capítulos`;
  const cols=locked?12:13;
  $('#bRows').innerHTML=chapters.map(c=>`
    <tr class="chaprow" data-chaprow="${c.id}"><td colspan="${cols}">${esc(c.num)}. ${esc(c.name)} · ${SECL[c.section]||c.section}
      ${locked?"":`<button class="btn sm" data-addline="${c.id}" style="margin-left:8px">+ partida</button>`}</td></tr>
    ${c.lines.map(l=>{const a=bLineAmt(l);const m=a.saleCents-a.costCents;
      return `<tr class="pbrow" data-row="${l.id}" data-chap="${c.id}">
      <td class="pbdrag" data-handle="${l.id}" title="Arrastrar para reordenar">${locked?"":"⠿"}</td>
      <td><input data-line="${l.id}" data-f="num" value="${esc(l.num)}" style="width:56px"
        title="${l.manualNum?"Número escrito a mano — se mantiene al reordenar":"Número automático — cambia con la posición"}"${locked?" disabled":""}></td>
      <td><input data-line="${l.id}" data-f="code" value="${esc(l.code)}" size="6"${locked?" disabled":""}></td>
      <td><input data-line="${l.id}" data-f="desc" value="${esc(l.desc)}"${locked?" disabled":""}></td>
      <td><input data-line="${l.id}" data-f="unit" value="${esc(l.unit)}" style="width:52px"${locked?" disabled":""}></td>
      <td><input class="r" data-line="${l.id}" data-f="qty" type="number" step="0.001" value="${l.qtyMilli/1000}"${locked||l.subLines.length?" disabled":""}></td>
      <td><input class="r" data-line="${l.id}" data-f="price" type="number" step="0.01" value="${(l.priceCents/100).toFixed(2)}"${locked?" disabled":""}></td>
      <td><span class="out" data-out="amt-${l.id}">${eur(a.saleCents)}</span></td>
      <td class="int"><input class="r" data-line="${l.id}" data-f="cost" type="number" step="0.01" value="${(l.costCents/100).toFixed(2)}"${locked?" disabled":""}></td>
      <td class="int"><span class="out${m<0?" neg":""}" data-out="mar-${l.id}">${eur(m)}</span></td>
      <td><select data-line="${l.id}" data-f="status"${locked?" disabled":""}>
        <option value="normal"${bStatus(l)==="normal"?" selected":""}>Normal</option>
        <option value="pending"${bStatus(l)==="pending"?" selected":""}>Pendiente</option>
        <option value="optional"${bStatus(l)==="optional"?" selected":""}>Opcional</option></select></td>
      <td><button class="bimg${l.imageRefs.length?" has":""}" data-gal="${l.id}">🖼 ${l.imageRefs.length}</button></td>
      ${locked?"":`<td><button class="btn sm danger" data-delline="${l.id}">✕</button></td>`}
    </tr>`;}).join("")}`).join("")
    ||`<tr><td colspan="${cols}"><div class="empty">Sin capítulos todavía.</div></td></tr>`;

  $('#bRows').querySelectorAll('[data-gal]').forEach(btn=>btn.onclick=()=>lineImagesDrawer(id,btn.dataset.gal));
  $('#bRows').querySelectorAll('[data-addline]').forEach(btn=>btn.onclick=()=>mutate(()=>{
    erp.addLine(id,btn.dataset.addline,{desc:"Nueva partida",unit:"ud",qtyMilli:1000});
  },"Partida añadida"));
  $('#bRows').querySelectorAll('[data-delline]').forEach(btn=>btn.onclick=()=>mutate(()=>{
    erp.deleteLine(id,btn.dataset.delline,"backoffice");
  },"Partida eliminada"));
  if(locked) return;

  // Dragging. Only the 16 px handle starts a drag — the rest of the row still
  // selects text, which is how a description gets copied.
  const accept=d=>d.kind==="line";
  $('#bRows').querySelectorAll('[data-handle]').forEach(h=>{
    const row=h.closest('tr');
    bDragSource(h,"line",h.dataset.handle,row);
    // The handle is the grip; the whole ROW is the target, so dropping anywhere
    // along it puts the travelling line in that row's place.
    bDropTarget(row,accept,d=>{
      if(d.id===row.dataset.row) return;
      const dest=row.dataset.chap;
      const idx=erp.version(id,vsel).chapters.find(c=>c.id===dest).lines.findIndex(l=>l.id===row.dataset.row);
      mutate(()=>erp.moveLine(id,d.id,dest,idx,"backoffice"),"Partida movida");
    });
  });
  // Dropping on a chapter heading appends to that chapter — the only way to
  // move a line into a chapter that has no rows to drop between yet.
  $('#bRows').querySelectorAll('[data-chaprow]').forEach(tr=>{
    bDropTarget(tr,accept,d=>
      mutate(()=>erp.moveLine(id,d.id,tr.dataset.chaprow,null,"backoffice"),"Partida movida de capítulo"));
  });
}

/** The live half: tree totals, the edited row's own figures, and the panel. */
function builderRecalc(id,vsel,lineId){
  const b=erp.budget(id), V=erp.version(id,vsel), t=erp.budgetTotals(id,vsel);
  const locked=V.frozen||V.issued||b.acceptedVersionId===V.id;
  const byId={}; t.chapters.forEach(c=>{byId[c.id]=c;});

  $('#bTree').innerHTML=V.chapters.map(c=>{const ct=byId[c.id]||{saleCents:0};
    const open=!bChapter||bChapter===c.id;
    return `<div class="bc${bChapter===c.id?" on":""}" data-chap="${c.id}" data-idx="${V.chapters.indexOf(c)}">
       <span>${locked?"":'<span class="pbdrag" style="display:inline-block">⠿</span> '}${esc(c.num)}. ${esc(c.name||"—")}</span>
       <span class="amt">${eur0(ct.saleCents)}</span></div>
     ${open?c.lines.map(l=>{const a=bLineAmt(l);
       return `<div class="bl${l.pending?" pend":""}" data-line="${l.id}"><span>${esc(l.num)} ${esc(l.desc||"—")}</span><span class="amt">${l.pending?"pdte.":eur0(a.saleCents)}</span></div>`;}).join(""):""}`;
  }).join("")||'<div class="empty" style="padding:16px">Sin capítulos.</div>';
  $('#bTree').querySelectorAll('[data-chap]').forEach(d=>{
    d.onclick=()=>{ bChapter=bChapter===d.dataset.chap?null:d.dataset.chap; render(); };
    if(locked) return;
    bDragSource(d,"chapter",d.dataset.chap,d);
    bDropTarget(d,x=>x.kind==="chapter",x=>{
      if(x.id===d.dataset.chap) return;
      mutate(()=>erp.moveChapter(id,x.id,Number(d.dataset.idx),"backoffice"),"Capítulo movido");
    });
  });
  $('#bTree').querySelectorAll('.bl[data-line]').forEach(d=>d.onclick=()=>{
    const row=document.querySelector(`tr[data-row="${d.dataset.line}"]`);
    if(row) row.scrollIntoView({block:"center",behavior:"smooth"});
  });

  if(lineId){
    const found=erp.findLine(id,lineId,vsel);
    if(found){const a=bLineAmt(found.line);const m=a.saleCents-a.costCents;
      const ae=document.querySelector(`[data-out="amt-${lineId}"]`); if(ae)ae.textContent=eur(a.saleCents);
      const me=document.querySelector(`[data-out="mar-${lineId}"]`);
      if(me){me.textContent=eur(m);me.classList.toggle("neg",m<0);}}
  }

/* ================= ADM-03 · document capture and validation (S6) =========
   Recognition happens in site/erp-ocr.js and meaning in the extraction
   capability; this is only the screen between them. Its whole job is the
   sentence the specification and CAP-04 both insist on: a partial extraction
   never creates a validated record in silence. So the record is written at
   the END, by a person pressing a button, and every field carries a dot
   saying whether anything actually checked it.

   `capWork` holds the document being validated. It is deliberately NOT in
   `erp.state`: nothing about a half-checked reading belongs in the company's
   data, and the moment it does belong there it stops being a reading and
   becomes a captured document. */
let capWork=null;   // {file, url, kind, recognised, result, blobKey, docType, focusKey}

const CAP_FIELDS=[
  ["issuerName","Emisor"],
  ["issuerTaxId","NIF"],
  ["docNumber","Nº documento"],
  ["issueDate","Fecha"],
  ["dueDate","Vencimiento"],
  ["netAmount","Base imponible"],
  ["taxAmount","IVA"],
  ["withholdingAmount","Retención"],
  ["totalAmount","Total"],
  ["iban","IBAN"],
  ["orderRef","Referencia"],
];
const CAP_AMOUNTS=new Set(["netAmount","taxAmount","withholdingAmount","totalAmount"]);

const CAP_TYPE_LABEL={supplierInvoice:"Factura proveedor",selfEmployedInvoice:"Factura autónomo",
  deliveryNote:"Albarán",valuedDeliveryNote:"Albarán valorado",ticket:"Ticket",
  supplierOffer:"Oferta",orderConfirmation:"Confirmación",paymentProof:"Justificante pago",
  creditNote:"Abono"};
const CAP_STATUS={captured:["Capturado","y"],extracted:["Extraído","y"],validated:["Validado","b"],
  allocated:["Asignado","g"],sentToAccounting:["Enviado a gestoría","g"],paid:["Pagado","g"]};
/* The overhead categories the engine accepts, in the words the owner uses.
   The codes are the engine's (LISTS.overheadCategories) and this is only a
   rendering of them, so a category the engine does not know cannot be
   offered — which is the failure the allocation guard exists to prevent. */
const OVERHEAD_LABEL={rent:"Alquiler",vehicles:"Vehículos",fuel:"Combustible",insurance:"Seguros",
  office:"Oficina",accountingFirm:"Gestoría",marketing:"Marketing",financial:"Gastos financieros",
  taxes:"Impuestos",fixedAsset:"Inmovilizado",renting:"Renting",otherOverhead:"Otros gastos generales"};
const COST_KIND_LABEL={material:"Material",labour:"Mano de obra",subcontract:"Subcontrata",other:"Otros"};

/** How a document's allocation reads in a table cell. */
function capAllocationText(c){
  if(!c.allocations.length) return '<span class="pill y">Sin asignar</span>';
  return esc(c.allocations.map(a=>a.projectId
    ?erp.project(a.projectId).code+(a.chapterNum?" · "+a.chapterNum:"")
    :(OVERHEAD_LABEL[a.overheadCategory]||a.overheadCategory)).join(", "));
}

/* Thumbnails for the inbox cards.
   Cached per blob key for the life of the page: a card list re-renders on
   every keystroke elsewhere on the screen, and minting a fresh object URL
   each time would hold every picture ever shown in memory until the tab is
   closed. A PDF has no thumbnail an <img> can draw, so the icon stays — found
   by letting the load fail rather than by guessing from the file name, which
   is the only test that works for both the local and the served path. */
const capThumbUrls={};
function capThumbs(root){
  root.querySelectorAll('.thumb[data-blob]').forEach(box=>{
    const key=box.dataset.blob; if(!key) return;
    const show=url=>{ if(!url) return;
      const img=new Image();
      img.onload=()=>{ box.innerHTML=''; box.appendChild(img); };
      img.onerror=()=>{}; // stays the 📄 icon: a PDF, or a blob that has gone
      img.alt=''; img.src=url;
    };
    if(capThumbUrls[key]!==undefined){ show(capThumbUrls[key]); return; }
    const direct=ErpStore.blobUrl(key);
    if(direct){ capThumbUrls[key]=direct; show(direct); return; }
    capThumbUrls[key]=null; // claim the key so a re-render does not fetch twice
    ErpStore.getBlob(key).then(b=>{
      if(!b) return;
      capThumbUrls[key]=URL.createObjectURL(b);
      show(capThumbUrls[key]);
    }).catch(()=>{});
  });
}

/* ---------- The document's own panel (ADM-03, S7) ----------
   Everything a filed document needs a person for, in the 480 side panel the
   specification makes the universal edit surface: where the cost lands, the
   two archive fields the workbook has columns for, and the note.

   Allocation is deliberately the last block rather than the first. The order
   on screen is the order of the questions — what is this, where did it come
   from, then who pays for it — and the amount you are splitting is stated
   above the split rather than remembered from the row you clicked. */
function captureDrawer(id){
  const c=erp.state.captured.find(x=>x.id===id); if(!c) return;
  const cf=c.confirmed;
  const total=cf?cf.totalCents:0;
  const db=openDrawer(c.stdName||CAP_TYPE_LABEL[c.docType]||"Documento");
  capAlloc=(c.allocations.length?c.allocations:[{projectId:"",overheadCategory:"",chapterNum:"",kind:"material",amountCents:total}])
    .map(a=>({projectId:a.projectId||"",overheadCategory:a.overheadCategory||"",
      chapterNum:a.chapterNum||"",kind:a.kind||"material",amountCents:a.amountCents}));
  db.innerHTML=`
   <div class="card"><div class="ch"><h3>${esc(CAP_TYPE_LABEL[c.docType]||c.docType)}</h3>
     <span class="pill ${CAP_STATUS[c.status]?CAP_STATUS[c.status][1]:""}">${esc(CAP_STATUS[c.status]?CAP_STATUS[c.status][0]:c.status)}</span></div>
    <div class="daylist">
     <div class="it"><span>Emisor</span><span style="flex:1"></span><b>${cf?esc(cf.issuerName||"—"):"—"}</b></div>
     <div class="it"><span>NIF</span><span style="flex:1"></span><b>${cf?esc(cf.issuerTaxId||"—"):"—"}</b></div>
     <div class="it"><span>Nº documento</span><span style="flex:1"></span><b>${cf?esc(cf.docNumber||"—"):"—"}</b></div>
     <div class="it"><span>Fecha</span><span style="flex:1"></span><b>${cf&&cf.date?fmtD(cf.date):"—"}</b></div>
     <div class="it"><span>Total</span><span style="flex:1"></span><b>${cf?eur(cf.totalCents):"—"}</b></div>
     ${c.duplicateSuspect?'<div class="it"><span class="pill r">Posible duplicado</span><span>ya hay un documento con el mismo NIF y número</span></div>':""}
    </div></div>
   <div class="card"><div class="ch"><h3>Archivo</h3><span class="tag">de dónde viene y con qué se relaciona</span></div>
    <div class="fgrid" style="padding:10px 12px 12px">
     <div class="field full"><label>Referencia</label><input id="cd_ref" value="${esc(c.reference||"")}" placeholder="Nº de pedido, obra o expediente"></div>
     <div class="field full"><label>Ruta de origen</label><input id="cd_path" value="${esc(c.sourcePath||"")}" placeholder="Carpeta o archivo del que procede"></div>
     <div class="field full"><label>Notas</label><input id="cd_notes" value="${esc(c.notes||"")}" placeholder="Lo que la siguiente persona necesita saber"></div>
     <div class="field full"><button class="btn" id="cd_save">Guardar datos de archivo</button></div>
    </div></div>
   <div class="card"><div class="ch"><h3>Asignación</h3><span class="tag" id="cd_rest"></span></div>
    <div id="cd_rows" style="padding:6px 12px 12px"></div>
    <div style="display:flex;gap:8px;padding:0 12px 12px;flex-wrap:wrap">
     <button class="btn sm" id="cd_add">＋ Repartir</button>
     <span style="flex:1"></span>
     <button class="btn primary" id="cd_alloc">Asignar</button>
    </div></div>`;

  $('#cd_save').onclick=()=>mutate(()=>{
    erp.updateCapture(id,{reference:$('#cd_ref').value.trim(),
      sourcePath:$('#cd_path').value.trim(),notes:$('#cd_notes').value.trim()},"backoffice");
  },"Datos de archivo guardados");
  $('#cd_add').onclick=()=>{ capAlloc.push({projectId:"",overheadCategory:"",chapterNum:"",kind:"material",amountCents:0}); capAllocRows(id,total); };
  $('#cd_alloc').onclick=()=>mutate(()=>{
    erp.allocateCapture(id,capAlloc.map(a=>({
      projectId:a.projectId||null,
      overheadCategory:a.projectId?null:(a.overheadCategory||null),
      chapterNum:a.chapterNum||null,kind:a.kind,amountCents:a.amountCents})),"backoffice");
    closeDrawer();
  },"Documento asignado");
  capAllocRows(id,total);
}

/* One row per destination. The destination is ONE select holding both kinds
   of answer — a project or an overhead category — because the engine refuses
   a line that names both, and a screen that lets you tick two boxes and then
   says no is a screen that asked the question badly. */
let capAlloc=[];
function capAllocRows(id,total){
  const host=$('#cd_rows'); if(!host) return;
  const projects=erp.state.projects.filter(p=>!p.closed);
  host.innerHTML=capAlloc.map((a,i)=>`
   <div class="fgrid" style="border-top:${i?"1px solid var(--hair)":"0"};padding-top:${i?"8px":"0"}">
    <div class="field full"><label>Destino</label><select data-ai="${i}" data-k="dest">
      <option value="">—</option>
      <optgroup label="Obras">${projects.map(p=>`<option value="p:${p.id}"${a.projectId===p.id?" selected":""}>${esc(p.code)} — ${esc(erp.party(p.partyId).name)}</option>`).join("")}</optgroup>
      <optgroup label="Gastos generales">${Object.entries(OVERHEAD_LABEL).map(([k,l])=>`<option value="o:${k}"${a.overheadCategory===k?" selected":""}>${esc(l)}</option>`).join("")}</optgroup>
     </select></div>
    ${a.projectId?`<div class="field"><label>Capítulo</label><select data-ai="${i}" data-k="chapterNum"><option value="">—</option>${chapterOptions(a.projectId,a.chapterNum)}</select></div>
    <div class="field"><label>Naturaleza</label><select data-ai="${i}" data-k="kind">${Object.entries(COST_KIND_LABEL).map(([k,l])=>`<option value="${k}"${a.kind===k?" selected":""}>${esc(l)}</option>`).join("")}</select></div>`:""}
    <div class="field"><label>Importe (€)</label><input data-ai="${i}" data-k="amountCents" type="number" step="0.01" value="${(a.amountCents/100).toFixed(2)}"></div>
    ${capAlloc.length>1?`<div class="field" style="display:flex;align-items:flex-end"><button class="btn sm danger" data-rm="${i}">Quitar</button></div>`:""}
   </div>`).join("");
  // The label and the figure are separate elements on purpose: a sentence with
  // a number inside it is one text node no dictionary can hold, which is the
  // gap S5 found the hard way. Splitting them fixes all three languages with
  // no interpolation rule at all.
  const assigned=capAlloc.reduce((s,a)=>s+(a.amountCents||0),0);
  const rest=$('#cd_rest');
  if(rest){
    const diff=total-assigned;
    rest.innerHTML=total
      ?(Math.abs(diff)<=1
        ?'<span>Cuadra con el documento</span>'
        :`<span>Sin repartir</span> <b>${eur(diff)}</b>`)
      :'<span>Documento sin total confirmado</span>';
  }
  host.querySelectorAll('[data-ai]').forEach(inp=>{
    inp.onchange=()=>{
      const a=capAlloc[+inp.dataset.ai], k=inp.dataset.k;
      if(k==="dest"){
        const val=inp.value;
        a.projectId=val.startsWith("p:")?val.slice(2):"";
        a.overheadCategory=val.startsWith("o:")?val.slice(2):"";
        if(!a.projectId){ a.chapterNum=""; }
      }
      else if(k==="amountCents") a.amountCents=Math.round(Number(String(inp.value).replace(",","."))*100)||0;
      else a[k]=inp.value;
      capAllocRows(id,total);
    };
  });
  host.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ capAlloc.splice(+b.dataset.rm,1); capAllocRows(id,total); });
}

/** Read a chosen file and open the validation screen on the result. */
function captureStart(file){
  if(typeof ErpOcr==="undefined"||!ErpBridge.extraction){
    toast("⚠ El lector de documentos no está disponible — introdúzcalo a mano"); return;
  }
  toast("Leyendo el documento…");
  ErpOcr.recognise(file,{onProgress:p=>{ if(p>0&&p<1) toast(`Leyendo… ${Math.round(p*100)}%`); }})
    .then(rec=>{
      let result;
      try{ result=ErpBridge.extraction.read(rec.text); }
      catch(e){
        // A photograph with nothing readable on it. The document is still
        // worth keeping — it just has to be typed. Never a dead end.
        toast("⚠ No se ha podido leer nada: rellénelo a mano");
        result=null;
      }
      capWork={file,url:URL.createObjectURL(file),
        kind:/pdf$/i.test(file.type)?"pdf":"image",
        recognised:rec,result,docType:"supplierInvoice",
        focusKey:(result&&result.needsReview[0])||null};
      render();
    })
    .catch(e=>toast("⚠ "+(e.message||"No se ha podido leer el documento")));
}

function captureClose(){
  if(capWork&&capWork.url) URL.revokeObjectURL(capWork.url);
  capWork=null; render();
}

/** The value as it should appear in its box: cents become euros, else text. */
function capShown(f){
  if(f.value===null||f.value===undefined) return "";
  return CAP_AMOUNTS.has(f.key)?(f.value/100).toFixed(2):String(f.value);
}

function captureValidate(v){
  const w=capWork, r=w.result;
  document.body.classList.add('fs');
  const rec=w.recognised;
  const engine=rec.engine==="pdf-text"
    ?'<span class="pill g">Leído del texto del PDF</span>'
    :`<span class="pill y">Leído de una imagen${rec.confidence!=null?" · "+rec.confidence+"% de confianza":""}</span>`;
  const amber=r?r.fields.filter(f=>f.verdict==="amber").length:CAP_FIELDS.length;

  v.innerHTML=`<div class="pb">
   <div class="pbbar">
    <button class="btn sm" id="capBack" title="Volver a la bandeja">←</button>
    <div class="who"><b>Validar documento</b><span>${esc(w.file.name||"documento")}</span></div>
    ${engine}
    <div class="tot"><span>Por revisar</span><b id="capAmber">${amber}</b></div>
    <div class="acts">
     <select id="capType" style="font:12px var(--sans);border:1px solid var(--line);border-radius:8px;padding:5px 7px;background:var(--paper);color:var(--ink)">
      ${[["supplierInvoice","Factura de proveedor"],["selfEmployedInvoice","Factura de autónomo"],
         ["deliveryNote","Albarán"],["valuedDeliveryNote","Albarán valorado"],["ticket","Ticket"],
         ["supplierOffer","Oferta"],["orderConfirmation","Confirmación de pedido"],
         ["paymentProof","Justificante de pago"],["creditNote","Abono"]]
        .map(([k,l])=>`<option value="${k}"${w.docType===k?" selected":""}>${l}</option>`).join("")}
     </select>
     <button class="btn primary sm" id="capSave">Confirmar y guardar</button>
    </div>
   </div>
   ${rec.warnings.length?`<div class="pbcond"><span class="pill y">⚠</span> ${rec.warnings.map(x=>`<span>${esc(x)}</span>`).join(" ")}</div>`:""}
   <div class="cap2">
    <div class="capdoc" id="capDoc"></div>
    <div class="capform" id="capForm"></div>
   </div>
  </div>`;

  $('#capBack').onclick=captureClose;
  $('#capType').onchange=e=>{ w.docType=e.target.value; };
  $('#capSave').onclick=captureSave;
  captureDocPane();
  captureFormPane();
}

/** The document itself. A PDF's first page is rendered, an image shown. */
function captureDocPane(){
  const host=$('#capDoc'), w=capWork;
  if(w.kind==="image"){ host.innerHTML=`<img src="${w.url}" alt="">`; }
  else{
    host.innerHTML='<div class="empty">Preparando la vista…</div>';
    w.file.arrayBuffer()
      .then(buf=>import(ErpOcr.vendorBase()+"pdfjs/pdf.min.mjs").then(m=>({m,buf})))
      .then(({m,buf})=>m.getDocument({data:new Uint8Array(buf)}).promise)
      .then(doc=>doc.getPage(1))
      .then(page=>{
        const vp=page.getViewport({scale:1.4});
        const c=document.createElement('canvas');
        c.width=Math.round(vp.width); c.height=Math.round(vp.height);
        return page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(()=>c);
      })
      .then(c=>{ host.innerHTML=''; host.appendChild(c); captureLines(host); })
      .catch(()=>{ host.innerHTML='<div class="empty">No se ha podido mostrar el documento.</div>'; captureLines(host); });
    return;
  }
  captureLines(host);
}

/* The text the reader actually saw, under the picture. This is the provenance
   the specification asks for — "al pulsar un campo se destaca la zona de la
   imagen de la que se obtuvo". We have line offsets rather than pixel boxes,
   so the honest version of that is to highlight the LINE, and to show the
   lines. A wrong reading you can see the source of is a wrong reading somebody
   can fix; one you cannot is a mystery. */
function captureLines(host){
  if(!capWork) return;
  const r=capWork.result; if(!r) return;
  const box=document.createElement('div');
  box.className='caplines'; box.id='capLines';
  box.innerHTML=r.lines.map((l,i)=>`<div data-line="${i}">${esc(l)||"&nbsp;"}</div>`).join("");
  host.appendChild(box);
  captureHighlight();
}

function captureHighlight(){
  if(!capWork) return;
  const r=capWork.result; if(!r) return;
  const box=$('#capLines'); if(!box) return;
  box.querySelectorAll('[data-line]').forEach(d=>d.classList.remove('capsrc'));
  const f=r.fields.find(x=>x.key===capWork.focusKey);
  if(f&&f.source){
    const d=box.querySelector(`[data-line="${f.source.line}"]`);
    if(d){ d.classList.add('capsrc'); d.scrollIntoView({block:"nearest"}); }
  }
}

function captureFormPane(){
  /* Guarded because the teardown order is genuinely racy: pressing "Confirmar"
     blurs whatever field had focus, and a blur fires `change` — which lands
     AFTER the save has already closed the screen and cleared capWork. */
  if(!capWork) return;
  const r=capWork.result;
  const host=$('#capForm');
  if(!r){
    host.innerHTML=`<div class="pbh">Datos</div><div class="pbbody">
      <div class="empty">No se ha leído nada del documento. Escriba los datos a mano; la imagen queda adjunta igualmente.</div></div>`;
    return;
  }
  const badChecks=r.checks.filter(c=>c.status==="mismatch");
  host.innerHTML=`<div class="pbh">Datos leídos<span style="flex:1"></span>
     <span class="tag">${r.profile.id.split("/")[1]||r.profile.id}</span></div>
   ${badChecks.length?`<div class="pbbody" style="padding-bottom:0">${badChecks.map(c=>
     `<div class="it"><span class="pill r">No cuadra</span> <span>${esc(c.detail)}</span></div>`).join("")}</div>`:""}
   ${CAP_FIELDS.map(([key,label])=>{
     const f=r.fields.find(x=>x.key===key);
     const why=f.reasons.slice(0,2).join(" · ");
     return `<div class="capf${capWork.focusKey===key?" on":""}" data-f="${key}">
       <span class="dot ${f.verdict}" title="${f.verdict==="green"?"Comprobado":"Sin comprobar — revíselo"}"></span>
       <label for="cap_${key}">${label}</label>
       <input id="cap_${key}" data-key="${key}" value="${esc(capShown(f))}"
         ${CAP_AMOUNTS.has(key)?'inputmode="decimal"':''}>
       ${why?`<div class="capwhy">${esc(why)}</div>`:""}
      </div>`;}).join("")}
   <div class="pbbody"><div class="it" style="color:var(--muted)">Un punto verde significa que algo ha comprobado el dato — un dígito de control, una fecha real, una suma que cuadra. Ámbar significa que nadie lo ha comprobado, por muy claro que se leyera.</div></div>`;

  host.querySelectorAll('.capf').forEach(row=>{
    row.onclick=()=>{ if(!capWork) return; capWork.focusKey=row.dataset.f; captureFormPane(); captureHighlight();
      const i=document.getElementById('cap_'+row.dataset.f); if(i) i.focus(); };
  });
  host.querySelectorAll('input[data-key]').forEach(inp=>{
    inp.onchange=()=>{
      if(!capWork||!capWork.result) return;
      const key=inp.dataset.key;
      const raw=inp.value.trim();
      const value=raw===""?null:(CAP_AMOUNTS.has(key)?Math.round(Number(raw.replace(",","."))*100):raw);
      // Re-check through the capability — the same arithmetic and the same
      // check digits the reading was judged by, so a typed value earns its
      // dot exactly as a read one does.
      capWork.result=ErpBridge.extraction.recheck(capWork.result,{[key]:Number.isNaN(value)?null:value});
      captureFormPane(); captureHighlight();
      const again=document.getElementById('cap_'+key); if(again){ again.focus(); }
      const a=$('#capAmber'); if(a) a.textContent=capWork.result.fields.filter(f=>f.verdict==="amber").length;
    };
  });
  // The specification's own instruction: the cursor starts on the first thing
  // that needs a person.
  if(capWork.focusKey){ const i=document.getElementById('cap_'+capWork.focusKey); if(i) i.focus(); }
}

/** Write the record — the only moment anything reaches the company's data. */
function captureSave(){
  const w=capWork, r=w.result;
  const val=k=>{ const f=r&&r.fields.find(x=>x.key===k); return f?f.value:null; };
  const key="cap_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
  const store=ErpStore.putBlob(key,w.file).catch(()=>null);
  store.then(()=>{
    mutate(()=>{
      const cap=erp.captureDocument({
        docType:w.docType,
        imageRef:key,
        // Gap 10. A browser only knows what it was handed: the file's own name,
        // or the path below the folder when a whole folder was chosen. That is
        // less than the workbook's "Ruta completa" and it is what is true —
        // the field is editable in the document's panel for the rest.
        sourcePath:w.file.webkitRelativePath||w.file.name||"",
        // Gap 11. The reader offers an order reference when it finds one; it
        // is never green (nothing can check it), so it arrives here as a
        // proposal a person has already seen on the validation screen.
        reference:(r&&(r.fields.find(f=>f.key==="orderRef")||{}).value)||"",
        machineReadable:w.recognised.engine==="pdf-text",
        // The reading travels with the record, unconfirmed, so that what the
        // machine proposed stays visible beside what the person accepted.
        extractable:r?{fields:r.fields.map(f=>({key:f.key,value:f.value,verdict:f.verdict,
          confidence:f.confidence,raw:f.raw})),profile:r.profile,engine:w.recognised.engine}:null,
        confidence:w.recognised.confidence!=null?w.recognised.confidence/100:undefined,
      },"backoffice");
      erp.confirmCapture(cap.id,{
        issuerName:val("issuerName")||"",
        issuerTaxId:val("issuerTaxId")||"",
        docNumber:val("docNumber")||"",
        date:val("issueDate")||erp.today,
        dueDate:val("dueDate")||null,
        baseCents:val("netAmount")||0,
        vatCents:val("taxAmount")||0,
        totalCents:val("totalAmount")||0,
        iban:val("iban")||"",
      },"backoffice");
    },"Documento guardado");
  }).then(()=>captureClose());
}

/* ---------- Gallery for one line (Improvement #1) ----------
   The pictures of a line are managed here and printed nowhere near it. Sources

   photo from the site visit, a file from this computer, and the phone camera
   (same input, `capture` set, which is what a mobile browser needs to open the
   camera instead of the file browser). Everything is compressed before it is
   stored. */
function lineImagesDrawer(budgetId,lineId){
  const b=erp.budget(budgetId), vsel=b.currentVersionId;
  const found=erp.findLine(budgetId,lineId,vsel); if(!found)return;
  const V=erp.version(budgetId,vsel);

  const item=l.itemId?erp.state.catalogue.find(c=>c.id===l.itemId):null;
  const catImgs=(item&&item.imageRefs||[]).filter(r=>!l.imageRefs.some(x=>x.storageKey===(r.storageKey||r)));
  const visitPhotos=erp.state.visits.flatMap(x=>(x.photos||[]).map(p=>typeof p==="string"?p:p.storageKey)).filter(Boolean)
    .filter(p=>!l.imageRefs.some(x=>x.storageKey===p));
  const SRC={catalogue:"catálogo",visit:"visita",upload:"archivo",camera:"cámara"};

  const db=openDrawer(`Imágenes · ${l.num} ${l.desc||""}`);
  db.innerHTML=`
   <div class="card"><div class="ch"><h3>${l.imageRefs.length} imágenes</h3>
     <span class="tag">${b.annex&&b.annex.enabled?"el anexo está activo":"el anexo está desactivado"}</span></div>
    <div class="daylist"><div class="it">Las imágenes no se imprimen en la fila de la partida: se reúnen en el anexo gráfico al final del documento, con su capítulo, su número de partida y su descripción.</div></div>
    <div class="gal" style="padding:0 16px 14px">
     ${l.imageRefs.map((im,i)=>`<div class="gi" data-img="${im.id}">
       <img data-blob="${esc(im.storageKey)}" alt="">
       <div class="m">
        <input type="text" data-cap="${im.id}" value="${esc(im.caption)}" placeholder="Pie de imagen (opcional)"${locked?" disabled":""}>
        <div class="b">
         <label><input type="checkbox" data-int="${im.id}"${im.internal?" checked":""}${locked?" disabled":""}> Sólo uso interno</label>
         <span class="pill">${SRC[im.source]||im.source}</span>
         ${im.sizeBytes?`<span class="pill">${Math.round(im.sizeBytes/1024)} KB</span>`:""}
         <span style="flex:1"></span>
         ${locked?"":`<button class="btn sm" data-up="${im.id}"${i===0?" disabled":""}>↑</button>
         <button class="btn sm" data-down="${im.id}"${i===l.imageRefs.length-1?" disabled":""}>↓</button>
         <button class="btn sm danger" data-del="${im.id}">✕</button>`}
        </div>
       </div></div>`).join("")||'<div class="empty">Esta partida no tiene imágenes.</div>'}
    </div>
   </div>
   ${locked?'<div class="card"><div class="daylist"><div class="it">La versión está congelada: su anexo se conserva tal como se emitió.</div></div></div>':`
   <div class="card"><div class="ch"><h3>Añadir</h3></div><div class="daylist" style="gap:9px">
     <div class="it"><label class="btn sm">Desde el ordenador<input type="file" id="imgFile" accept="image/*" multiple hidden></label>
       <label class="btn sm">Cámara<input type="file" id="imgCam" accept="image/*" capture="environment" hidden></label></div>
     ${catImgs.length?`<div class="it"><button class="btn sm" id="imgCat">Imagen del catálogo (${catImgs.length})</button></div>`:""}
     ${visitPhotos.length?`<div class="it"><button class="btn sm" id="imgVisit">Foto de la visita (${visitPhotos.length})</button></div>`:""}
   </div></div>`}`;

  paintImages(db);
  if(locked)return;
  db.querySelectorAll('[data-cap]').forEach(inp=>inp.onchange=()=>mutate(()=>
    erp.updateLineImage(budgetId,lineId,inp.dataset.cap,{caption:inp.value}),"Pie actualizado"));
  db.querySelectorAll('[data-int]').forEach(cb=>cb.onchange=()=>mutate(()=>{
    erp.updateLineImage(budgetId,lineId,cb.dataset.int,{internal:cb.checked});
    lineImagesDrawer(budgetId,lineId);
  },cb.checked?"Imagen marcada como interna":"Imagen incluida en el anexo"));
  db.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>mutate(()=>{
    erp.moveLineImage(budgetId,lineId,x.dataset.up,-1); lineImagesDrawer(budgetId,lineId);},"Orden actualizado"));
  db.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>mutate(()=>{
    erp.moveLineImage(budgetId,lineId,x.dataset.down,1); lineImagesDrawer(budgetId,lineId);},"Orden actualizado"));
  db.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>mutate(()=>{
    erp.removeLineImage(budgetId,lineId,x.dataset.del); lineImagesDrawer(budgetId,lineId);},"Imagen eliminada"));

  const take=(input,source)=>{ if(!input)return;
    input.onchange=()=>storeLineImages(budgetId,lineId,[...input.files],source); };
  take($('#imgFile'),"upload"); take($('#imgCam'),"camera");

    lineImagesDrawer(budgetId,lineId);
  },"Imagen del catálogo añadida");
  const vis=$('#imgVisit');
  if(vis) vis.onclick=()=>mutate(()=>{
    erp.attachLineImage(budgetId,lineId,{storageKey:visitPhotos[0],source:"visit"},"backoffice");
    lineImagesDrawer(budgetId,lineId);
  },"Foto de la visita añadida");
}

/** Compress → blob store → engine reference. Bytes never enter the state blob. */
async function storeLineImages(budgetId,lineId,files,source){
  if(!files.length)return;
  let added=0;
  for(const f of files){
    if(!/^image\//.test(f.type||"")){ toast("⚠ "+f.name+" no es una imagen"); continue; }
    try{
      const c=(typeof ErpBridge!=="undefined"&&ErpBridge.docs)
        ? await ErpBridge.docs.compressImage(f)
        : {blob:f,mime:f.type,width:0,height:0};
      const key="img_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
      await ErpStore.putBlob(key,c.blob);
      erp.attachLineImage(budgetId,lineId,{storageKey:key,source,mime:c.mime,
        sizeBytes:c.blob.size||0,width:c.width,height:c.height},"backoffice");
      added++;
    }catch(e){ toast("⚠ "+e.message); }
  }
  if(added){ persist(); render(); lineImagesDrawer(budgetId,lineId); toast(`${added} ${added===1?"imagen añadida":"imágenes añadidas"}`); }
}

/* ===================== DMC-03/04/05 · the lists the owner maintains ================
   Three subsecciones, one renderer. They differ only in which list kinds they
   show and what the help column says, so writing them three times would be
   three chances for the same edit-and-save behaviour to drift.

   The editing model is the doc's: no drawer, no modal, no save button. A cell
   is an input; Enter or moving away commits it. That is right for a screen
   whose whole content is twenty short labels — a drawer per row would be more
   interaction than the data justifies.

   Two things are deliberately NOT offered:

     * renaming a code. Records store the code forever, so an editable code is
       an offer to break every record already carrying it. The label is what
       people read and the label is what is editable.
     * deleting an entry. Deactivate, never delete — the system-wide rule. A
       retired entry leaves the pickers and keeps resolving on the records
       that already carry it, which is why the "en uso" count is shown beside
       the retire button rather than used to block it. */
const LIST_META={
  units:{title:"Unidades de medida",code:"DMC-03",singular:"unidad",
    codeLabel:"Símbolo",codePlaceholder:"m2",esPlaceholder:"metro cuadrado",caPlaceholder:"metre quadrat"},
  leadSources:{title:"Fuentes de leads",code:"DMC-04",singular:"fuente",
    codeLabel:"Código",codePlaceholder:"feriaLocal",esPlaceholder:"Feria local",caPlaceholder:"Fira local"},
  lossReasons:{title:"Motivos de pérdida",code:"DMC-04",singular:"motivo",
    codeLabel:"Código",codePlaceholder:"plazo",esPlaceholder:"Plazo",caPlaceholder:"Termini"},
  paymentMethods:{title:"Formas de pago",code:"DMC-05",singular:"forma de pago",
    codeLabel:"Código",codePlaceholder:"transfer15",esPlaceholder:"Transferencia 15 días",caPlaceholder:"Transferència 15 dies"},
};
/** New-row drafts, keyed by list kind, so a half-typed entry survives re-render. */
const listDraft={};
/** DMC-02's partida filter. A view concern, so it lives here, not in state. */
let priceItem="";
/** DMC-01: the selected chapter ("" = all), the tree's own search, and the drag. */
let catChapter="", catTreeQ="", catQ="", catDrag=null;

/**
 * A picker over one of the owner-maintained lists.
 *
 * The option VALUE is the code and the option TEXT is the label, which is the
 * whole point of moving these lists into the document: a customer's origin
 * used to render as `referrer` because the list had codes and nothing else.
 *
 * A `selected` code that is no longer active is still offered, marked as
 * retired. Dropping it would silently rewrite the record to whatever happens
 * to be first in the list the next time somebody opens the drawer and saves —
 * a retired list entry must not be able to change data behind somebody's back.
 */
function listOptions(kind,selected){
  const rows=erp.listActive(kind).slice();
  if(selected&&!rows.some(r=>r.code===selected)){
    const gone=erp.listAll(kind).find(r=>r.code===selected);
    rows.unshift(gone?Object.assign({},gone,{_retired:true}):{code:selected,es:selected,_retired:true});
  }
  return rows.map(r=>`<option value="${esc(r.code)}"${r.code===selected?" selected":""}>${esc(r.es||r.code)}${r._retired?" (retirada)":""}</option>`).join("");
}

function listConfigTable(kind){
  const m=LIST_META[kind];
  const rows=erp.listAll(kind);

   <tr>

function wireListConfig(v){
  // Label edits commit on change (Enter or moving away), never on keystroke —
  // a re-render per character would take the caret with it.
  v.querySelectorAll('input[data-lk]').forEach(inp=>inp.onchange=()=>{
    const {lk,lc,lf}=inp.dataset;
    mutate(()=>erp.updateListEntry(lk,lc,{[lf]:inp.value},"backoffice"),"Lista actualizada");
  });
  v.querySelectorAll('[data-ltoggle]').forEach(b=>b.onclick=()=>{
    const kind=b.dataset.ltoggle, code=b.dataset.lc, turningOn=b.dataset.lon==="1";
    const used=erp.listEntryUsage(kind,code);
    if(!turningOn&&used&&!confirm(`«${erp.listLabel(kind,code)}» se usa en ${used} registro${used===1?"":"s"}.\n\nRetirarla la quita de los desplegables; los registros que ya la llevan la conservan y se siguen viendo con su nombre. ¿Continuar?`)) return;
    mutate(()=>erp.setListEntryActive(kind,code,turningOn,"backoffice"),turningOn?"Entrada reactivada":"Entrada retirada");
  });
  v.querySelectorAll('[data-ladd]').forEach(b=>b.onclick=()=>{
    const kind=b.dataset.ladd;
    const code=$('#new_'+kind+'_code').value.trim();
    const es=$('#new_'+kind+'_es').value.trim();
    const ca=$('#new_'+kind+'_ca').value.trim();
    // Kept before the mutate so a rejected entry (duplicate code, missing
    // name) is still in the boxes when the toast explains why.
    listDraft[kind]={code,es,ca};
    try{
      erp.addListEntry(kind,{code,es,ca},"backoffice");
      listDraft[kind]={code:"",es:"",ca:""};
      persist(); render(); toast("Entrada añadida");
    }catch(e){ toast("⚠ "+e.message); }
  });
}
function listConfigScreen(v,kinds,sub,help){
  $('#sub').textContent=sub;
  v.innerHTML=`<div class="cfgwrap">
    <div class="cfgtables${kinds.length>1?" two":""}">${kinds.map(listConfigTable).join("")}</div>
    <div class="cfghelp">${help}</div></div>`;
  wireListConfig(v);
}

  $('#sub').textContent="Presupuestado, comprometido, real y proyectado a fin de obra por capítulo, con la desviación y el margen que resultan. La proyección se calcula del avance real y del coste unitario observado, y puede ajustarse a mano justificando el motivo.";

  const names={};
  try{ (erp.project(pid).baseline.chapters||[]).forEach(c=>{names[c.num]=c.name;}); }catch(e){}
  const over=new Set(f.overrunChapters);

  v.innerHTML=`

  if(!P.length){ v.innerHTML='<div class="card"><div class="empty">Todavía no hay proyectos que planificar.</div></div>'; return; }
  const B=ganttApi();

  const pid=gProject, plan=B.get(erp.state,pid), sch=B.schedule(plan);

  const pays=ErpBridge.scheduling.paymentMilestones(erp,pid);
  const cal=plan.calendar||B.defaultCalendar();
  const crit=sch?sch.criticalPath.length:0;
  /* Every figure in the deviations panel and both curves come from
     @repo/capability-scheduling. This view draws them and computes none. */
  const curve=B.curve(plan,{asOf:erp.today,weights:planWeights(pid,plan)});

     ${sch&&plan.tasks.length?`<span class="chip">Fin de obra <b>${fmtD(sch.finish)}</b></span>

     <select class="inline" id="gZoom">${[[14,"Mes"],[24,"Semanas"],[38,"Días"]].map(([z,l])=>`<option value="${z}"${gZoom===z?" selected":""}>${l}</option>`).join("")}</select>

     <button class="btn sm" id="gFreeze" title="Congelar la planificación actual como referencia">❄ Congelar</button>
   </div>
   ${plan.tasks.length?ganttChart(plan,sch,cmp,pays):`<div class="empty">Sin planificación. «Derivar del presupuesto» la construye a partir de los capítulos y partidas aceptados: la duración de cada capítulo sale de sus cantidades y del rendimiento diario del oficio.</div>`}
   <div class="glegend">
     <span><i style="background:var(--green)"></i>Tarea</span>

     <span><i style="background:var(--blue)"></i>Hito de cobro del contrato</span>

   </div>
   <div class="gtools" style="border-top:1px solid var(--hair)">
     <span style="font:600 11px var(--sans);color:var(--muted)">DÍAS NO LABORABLES</span>
     ${(cal.nonWorkingDates||[]).map(d=>`<span class="chip"><b>${fmtD(d)}</b><button data-nw="${d}" title="Quitar">✕</button></span>`).join("")||'<span class="chip">ninguno</span>'}
     <input class="dt" type="date" id="gNw"><button class="btn sm" id="gNwAdd">Añadir</button>
     <span style="font-size:11.5px;color:var(--muted)">Semana laboral: ${cal.workingWeekdays.length} días</span>
   </div></div>

   ${curve?`<div class="card"><div class="ch"><h3>Curva S</h3>
     <span class="tag">planificado ${curve.plannedPct}% · real ${curve.actualPct}% · ${curve.driftPct>=0?"+":""}${curve.driftPct} pts</span></div>
     ${curveChart(curve)}
     <div class="glegend">
       <span><i style="background:var(--faint)"></i>Planificado</span>
       <span><i style="background:var(--green)"></i>Real registrado</span>

       <span>Fin previsto ${fmtD(curve.plannedFinish)} → proyectado <b>${fmtD(curve.projectedFinish)}</b></span>
     </div></div>`:""}

   ${progressTable(pid,plan)}

  <div class="bside">
   <div class="card" style="margin:0"><div class="ch"><h3>Desviaciones</h3>
     ${risk&&risk.overThreshold?'<span class="pill r">Supera el umbral</span>':''}</div>

    ${risk&&risk.items.length?`<div style="padding:0 14px 12px">
      ${risk.items.slice(0,12).map(i=>`<div class="riskitem">

        <span class="t">${esc(i.title)}${i.critical?' <span class="pill r">crítica</span>':""}</span>
        <b>${i.kind==="behind"?`${i.actualPct}/${i.plannedPct}%`:`${i.days} d`}</b></div>`).join("")}
      ${risk.items.length>12?`<div class="riskitem" style="color:var(--muted)">…y ${risk.items.length-12} más</div>`:""}
     </div>`:risk?'<div class="daylist" style="padding:0 14px 12px"><div class="it">Nada fuera de plazo.</div></div>':''}
   </div>
  </div></div>`;

  $('#gZoom').onchange=e=>{gZoom=+e.target.value;render();};
  const bl=$('#gBl'); if(bl) bl.onclick=()=>{gBaseline=!gBaseline;render();};
  $('#gAdd').onclick=()=>ganttNewTask(pid,false);
  $('#gAddMs').onclick=()=>ganttNewTask(pid,true);
  $('#gDerive').onclick=()=>deriveFromBudget(pid,cal);

  });
  wireProgressTable(pid,plan);
  ganttWire(v,pid,plan,sch);

 /* ---------- Partidas y subpartidas (DMC-01, spec §DMC-01) ----------
    The catalogue finally gets a screen inside the shell. It lived in
    master-data.html, which was a separate page holding a separate dataset
    that was never wired to the engine — so what looked like the partidas
    file was a mock, and the real catalogue had no interface at all.

    Two zones, per the doc: the chapter tree on the left with a count per
    branch and its own search, the partidas table on the right. Chapters are
    an owner-maintained list (state.lists.itemChapters), which is what makes
    the tree draggable — the array order IS the display order, so there is no
    second sort field that can disagree with what is on screen.

    Images are counted here, never rendered in the row: the doc puts pictures
    in the presupuesto's graphic annex, and a table that renders them becomes
    a gallery you cannot read prices off. */
 items(v){
  $('#sub').textContent="El catálogo de partidas: capítulo, unidad, marca, modelo y calidad, con su coste y su precio de referencia. Arrastra un capítulo para cambiar el orden en que sale en los presupuestos.";
  const chapters=erp.listAll("itemChapters");
  const tq=catTreeQ.trim().toLowerCase();
  const shown=tq?chapters.filter(c=>c.es.toLowerCase().includes(tq)||c.code.toLowerCase().includes(tq)):chapters;
  if(catChapter&&!chapters.some(c=>c.code===catChapter)) catChapter="";
  const countOf=code=>erp.state.catalogue.filter(i=>i.active!==false&&i.chapter===code).length;
  const orphans=erp.state.catalogue.filter(i=>i.active!==false&&!chapters.some(c=>c.code===i.chapter));

  const q=catQ.trim().toLowerCase();
  const rows=erp.state.catalogue
    .filter(i=>i.active!==false)
    .filter(i=>catChapter===""?true:catChapter==="~"?!chapters.some(c=>c.code===i.chapter):i.chapter===catChapter)
    .filter(i=>!q||i.code.toLowerCase().includes(q)||i.desc.toLowerCase().includes(q)
      ||(i.brand||"").toLowerCase().includes(q)||(i.model||"").toLowerCase().includes(q))
    .sort((a,b)=>String(a.code).localeCompare(String(b.code)));
  const TYPE={material:"Material",ownLabour:"Mano de obra",subcontract:"Subcontrata",
    machinery:"Maquinaria",professional:"Profesional",waste:"Residuos",other:"Otros"};

    b.ondragstart=e=>{ catDrag=b.dataset.chap; b.classList.add('dragging');
      // Firefox needs data set on the transfer or the drag never starts.
      try{ e.dataTransfer.setData('text/plain',catDrag); e.dataTransfer.effectAllowed='move'; }catch(err){}
    };
    b.ondragend=()=>{ catDrag=null; v.querySelectorAll('.catbr').forEach(x=>x.classList.remove('dragging','dropbefore','dropafter')); };
    b.ondragover=e=>{
      if(!catDrag||b.dataset.chap===catDrag) return;
      e.preventDefault();
      const r=b.getBoundingClientRect(), after=e.clientY>r.top+r.height/2;
      b.classList.toggle('dropbefore',!after); b.classList.toggle('dropafter',after);
    };
    b.ondragleave=()=>b.classList.remove('dropbefore','dropafter');
    b.ondrop=e=>{
      e.preventDefault();
      const over=b.dataset.chap; if(!catDrag||over===catDrag) return;
      const r=b.getBoundingClientRect(), after=e.clientY>r.top+r.height/2;
      const all=erp.listAll("itemChapters");
      let to=all.findIndex(c=>c.code===over);
      // Dropping below a row that sits ABOVE the dragged one lands on that
      // row's index; dropping above one that sits below it does too, because
      // the splice removes the dragged element first.
      const from=all.findIndex(c=>c.code===catDrag);
      if(after&&to<from) to+=1; else if(!after&&to>from) to-=1;
      const moved=catDrag; catDrag=null;
      mutate(()=>erp.moveListEntry("itemChapters",moved,to,"backoffice"),"Orden de capítulos actualizado");
    };
  });
  $('#catNew').onclick=()=>catalogueItemDrawer(null);
  v.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>catalogueItemDrawer(tr.dataset.item));
 },

 /* ---------- Lista de precios (DMC-02, spec §DMC-02) ----------
    The doc puts a partida filter at the top and makes it permanent, because
    the comparison the screen exists for is "who is cheapest for THIS item" —
    a grid of every partida against every supplier is a spreadsheet, not an
    answer. Choosing one partida is what makes the strip appear.

    The rule that outranks the layout: a supplier with no price is drawn as
    having no price. Rendering a blank as 0,00 € would make the supplier who
    never quoted the cheapest one on screen, which is how a purchase order
    goes to the wrong company. `comparePrices` already returns `missing`
    rather than a zero; this screen keeps that distinction visible. */
 "price-list"(v){
  $('#sub').textContent="Precios por proveedor con su fecha, su documento de origen y su vigencia. Filtra por partida para comparar proveedores; un precio ausente se ve ausente y nunca cuenta como cero.";
  const sups=erp.state.parties.filter(p=>p.active&&p.roles.some(r=>["supplier","subcontractor","selfEmployed"].includes(r)));
  const items=erp.state.catalogue.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code)));
  if(priceItem&&!items.some(i=>i.id===priceItem)) priceItem="";
  const one=priceItem?items.find(i=>i.id===priceItem):null;
  const SRC={priceList:"Tarifa",supplierPortal:"Portal",supplierOffer:"Oferta",valuedDeliveryNote:"Albarán valorado",purchaseInvoice:"Factura",manualConfirmation:"Confirmación"};

  const rows=erp.state.prices.filter(p=>!one||p.itemId===one.id)
    .slice().sort((a,b)=>b.date.localeCompare(a.date));

  // The strip, only when the screen is filtered to a single partida.
  let strip="";
  if(one){
    const cmp=erp.comparePrices([one.id],sups.map(s=>s.id))[0];
    strip=`<div class="card"><div class="ch"><h3>Comparativa para ${esc(one.code)} · ${esc(one.desc)}</h3>
      <span class="tag">${cmp.bestCents!=null?`mejor precio ${eur(cmp.bestCents)} / ${esc(one.unit)}`:"todavía sin ningún precio"}</span></div>
     <div style="padding:12px 14px 14px"><div class="pstrip">
     ${cmp.perSupplier.map(ps=>{
       const s=erp.party(ps.supplierId);
       if(ps.missing) return `<div class="pcard none"><div class="sup">${esc(s.name)}</div>
         <div class="net">Sin precio</div><div class="meta">nunca ha cotizado esta partida</div></div>`;
       const best=cmp.bestCents!=null&&ps.netCents===cmp.bestCents;
       const last=rows.find(p=>p.supplierId===ps.supplierId&&p.itemId===one.id);
       const over=cmp.bestCents?Math.round(((ps.netCents-cmp.bestCents)/cmp.bestCents)*1000)/10:0;
       return `<div class="pcard${best?" best":""}"><div class="sup">${esc(s.name)}</div>
        <div class="net">${eur(ps.netCents)}</div>
        <div class="meta">${best?"<b>el más barato</b>":`+${over}% sobre el mejor`}
         ${last?`<br>${fmtD(last.date)} · ${esc(SRC[last.source]||last.source)}`:""}
         ${last&&last.validUntil?`<br>vigente hasta ${fmtD(last.validUntil)}`:""}</div></div>`;}).join("")
      ||'<div class="empty">No hay proveedores dados de alta todavía.</div>'}
     </div></div></div>`;
  }

  v.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center">
    <button class="btn primary sm" id="prcNew">＋ Nuevo precio</button>
    <label style="font-size:12px;color:var(--dim)">Partida
      <select id="prcItem" style="font:inherit;font-size:12.5px;margin-left:6px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);max-width:340px">
        <option value="">Todas las partidas</option>
        ${items.map(i=>`<option value="${i.id}"${i.id===priceItem?" selected":""}>${esc(i.code)} · ${esc(i.desc)}</option>`).join("")}
      </select></label>
    <span class="tag">${rows.length} precio${rows.length===1?"":"s"}${one?" de esta partida":""}</span>
    ${one?'<button class="btn sm" id="prcAll">Ver todas</button>':""}</div>
   ${strip}
   <div class="card"><div class="ch"><h3>Histórico de precios</h3><span class="tag">se añade, nunca se sobrescribe</span></div>
   <div class="scroll"><table><thead><tr>
     <th>Partida</th><th>Proveedor</th><th>Cód. art.</th><th>Fecha</th>
     <th class="num">Lista</th><th class="num">Dto.</th><th class="num">Neto</th><th class="num">IVA</th>
     <th class="num">Transporte</th><th class="num">Residuos</th><th class="num">Mín.</th>
     <th>Origen</th><th>Proyecto</th><th>Vigencia</th><th>Notas</th></tr></thead><tbody>

 /* ---------- Gestoría (GES, spec §5.6) ----------
    Rebuilt in session 11 around one idea: the screen must be able to say NO.
    Before, "Generar y registrar envío" always worked and the exception list
    was decoration next to it — which is precisely how a quarter goes out with
    four suppliers missing a NIF. Now the engine refuses, and the only way past
    is to justify each exception by name, so the button and the list finally
    mean the same thing. The completeness blocks above them answer the
    question people actually ask at quarter end ("is anything missing?")
    per block rather than as one aggregate number, because the blocks fail
    independently and an aggregate hides which one. */
 accountant(v){
  $('#sub').textContent="Ocho bloques de completitud, la lista de excepciones que bloquea el envío hasta justificarla, y el registro de lo enviado con fecha y destinatario.";
