<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Canei Subirats — ERP</title>
    <style>
      :root {
        --green: #48733c;
        --greenLt: #6ba85a;
        --greenDeep: #31532a;
        --greenSoft: #e7f0e1;
        --greenPale: #dce8d4;
        --spark: #f2c230;
        --ink: #14160f;
        --body: #4f5347;
        --muted: #8b8f80;
        --faint: #aab0a0;
        --line: #dde5d6;
        --hair: #e7eee1;
        --bg: #eef3ea;
        --paper: #fff;
        --danger: #b4402f;
        --dangerSoft: #f6e3df;
        --amber: #8a6d12;
        --amberSoft: #fbf0cf;
        --blue: #4f6b86;
        --blueSoft: #e6edf3;
        --shadow: 0 1px 2px rgba(24, 32, 16, 0.03), 0 18px 40px -24px rgba(24, 32, 16, 0.18);
        --serif: "Roboto Serif", Georgia, serif;
        --sans: Inter, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        --mono: ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        color: var(--body);
        font: 14.5px/1.55 var(--sans);
        letter-spacing: -0.004em;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          radial-gradient(1100px 560px at 90% -14%, rgba(72, 115, 60, 0.15), transparent 58%),
          radial-gradient(760px 430px at -6% 2%, rgba(242, 194, 48, 0.09), transparent 55%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3 {
        font-family: var(--serif);
        color: var(--ink);
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.02em;
      }
      a {
        color: var(--green);
        text-decoration: none;
      }
      .native-app .topbar {
        padding-top: max(12px, env(safe-area-inset-top));
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        flex-wrap: wrap;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: saturate(1.4) blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .brand .nm {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 15.5px;
        color: var(--ink);
        line-height: 1;
        white-space: nowrap;
      }
      .brand .nm small {
        display: block;
        font: 600 9.5px var(--sans);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--green);
        margin-top: 3px;
      }
      .tsp {
        flex: 1;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 600 12.5px var(--sans);
        border-radius: 10px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        transition: 0.15s;
        white-space: nowrap;
      }
      .btn:hover {
        border-color: color-mix(in srgb, var(--green) 40%, var(--line));
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }
      .btn.primary {
        background: linear-gradient(120deg, var(--greenDeep), var(--green) 70%);
        color: #fff;
        border-color: transparent;
      }
      .btn.sm {
        padding: 5px 9px;
        font-size: 11.5px;
        border-radius: 8px;
      }
      .btn.danger {
        color: var(--danger);
        border-color: var(--dangerSoft);
      }

      /* ---------- global bar (spec §1: search · create · alerts · period · profile) ---------- */
      .gsearch {
        position: relative;
        flex: 1 1 210px;
        min-width: 0;
        max-width: 440px;
      }
      .gsearch input {
        width: 100%;
        font: 13px var(--sans);
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 11px;
        outline: 0;
      }
      .gsearch input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--greenSoft);
      }
      .sres {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        max-height: min(62vh, 430px);
        overflow-y: auto;
        display: none;
        z-index: 45;
      }
      .sres.on {
        display: block;
      }
      .sres .sg {
        font: 700 9.5px var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 9px 12px 3px;
      }
      .sres .si {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 7px 12px;
        font: 12.5px var(--sans);
        color: var(--muted);
      }
      .sres .si b {
        display: block;
        color: var(--ink);
        font: 600 13px var(--sans);
      }
      .sres .si:hover,
      .sres .si.sel {
        background: var(--greenSoft);
      }
      .gactions {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
      }
      .menuwrap {
        position: relative;
      }
      .menu {
        position: absolute;
        top: calc(100% + 6px);
        right: 0;
        min-width: 214px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 5px;
        display: none;
        z-index: 45;
      }
      .menu.on {
        display: block;
      }
      .menu.wide {
        min-width: min(340px, 84vw);
      }
      .menu button,
      .menu a {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 8px 10px;
        border-radius: 9px;
        font: 600 12.5px var(--sans);
        color: var(--body);
      }
      .menu button:hover,
      .menu a:hover {
        background: var(--greenSoft);
        color: var(--ink);
      }
      .menu .sep {
        height: 1px;
        background: var(--hair);
        margin: 5px 2px;
      }
      .menu .none {
        padding: 10px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .menu .al {
        width: 100%;
        text-align: left;
        margin-bottom: 5px;
      }
      .bell {
        position: relative;
      }
      .bell .badge {
        position: absolute;
        top: -5px;
        right: -5px;
        min-width: 16px;
        height: 16px;
        border-radius: 999px;
        background: var(--danger);
        color: #fff;
        font: 700 9.5px/16px var(--sans);
        text-align: center;
        padding: 0 4px;
      }
      select.period {
        font: 600 12px var(--sans);
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 7px 8px;
        outline: 0;
      }
      input.dt {
        font: 12px var(--sans);
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 6px 8px;
        outline: 0;
      }
      .periodnote {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .periodnote .pill {
        background: var(--greenSoft);
        color: var(--greenDeep);
      }

      /* ---------- three panels (spec §1) ----------
     Panel 1 (sections) is always visible; panel 2 (subsections) overlays the
     main panel and collapses on choice or outside click; panel 3 (main) is the
     only one whose content changes. Both live inside .rail, which is the
     positioned ancestor panel 2 is absolute against — that keeps the overlay
     glued to panel 1 without hard-coding the centred layout's left margin. */
      .shell {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        max-width: 1400px;
        margin: 0 auto;
        align-items: start;
      }
      .rail {
        position: sticky;
        top: var(--top, 59px);
        height: calc(100vh - var(--top, 59px));
        z-index: 35;
      }
      .p1 {
        height: 100%;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 6px 26px;
        border-right: 1px solid var(--line);
      }
      .secitem {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        width: 100%;
        border: 0;
        background: transparent;
        cursor: pointer;
        color: var(--body);
        padding: 8px 2px;
        border-radius: 11px;
        transition: 0.12s;
        position: relative;
      }
      .secitem .ic {
        font-size: 17px;
        line-height: 1;
      }
      .secitem .lb {
        font: 600 9.5px var(--sans);
        line-height: 1.15;
        text-align: center;
      }
      .secitem:hover {
        background: var(--greenSoft);
        color: var(--ink);
      }
      .secitem.on {
        background: var(--greenSoft);
        color: var(--greenDeep);
      }
      .secitem .dot {
        position: absolute;
        top: 5px;
        right: 9px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--danger);
      }
      .p2 {
        position: absolute;
        top: 0;
        left: 76px;
        width: 240px;
        height: 100%;
        overflow-y: auto;
        background: var(--paper);
        border-right: 1px solid var(--line);
        box-shadow: 22px 0 46px -34px rgba(20, 26, 14, 0.5);
        padding: 14px 10px 26px;
        opacity: 0;
        visibility: hidden;
        transform: translateX(-10px);
        transition: 0.16s;
      }
      .p2.on {
        opacity: 1;
        visibility: visible;
        transform: none;
      }
      .p2 .p2h {
        font: 700 10px var(--sans);
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--faint);
        margin: 0 10px 7px;
      }
      .tabstrip {
        display: flex;
        gap: 4px;
        margin: 0 0 12px;
        border-bottom: 1px solid var(--hair);
      }
      .tabstrip .tab {
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 9px 14px;
        border-radius: 9px 9px 0 0;
        font: 600 12.5px var(--sans);
        color: var(--muted);
        border-bottom: 3px solid transparent;
        margin-bottom: -1px;
      }
      .tabstrip .tab:hover {
        color: var(--ink);
      }
      .tabstrip .tab.on {
        color: var(--greenDeep);
        border-bottom-color: var(--green);
      }
      .navitem {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        cursor: pointer;
        font: 600 13px var(--sans);
        color: var(--body);
        padding: 8px 10px;
        border-radius: 9px;
        transition: 0.12s;
      }
      .navitem .ct {
        margin-left: auto;
        font: 600 10.5px var(--sans);
        color: var(--faint);
        background: var(--hair);
        border-radius: 999px;
        padding: 1px 7px;
      }
      .navitem .ct.alert {
        background: var(--dangerSoft);
        color: var(--danger);
      }
      .navitem .ext {
        margin-left: auto;
        font-size: 11px;
        color: var(--faint);
      }
      .navitem:hover {
        background: var(--greenSoft);
        color: var(--ink);
      }
      .navitem.on {
        background: var(--greenSoft);
        color: var(--greenDeep);
      }
      .subscrim {
        position: fixed;
        inset: 0;
        z-index: 30;
        background: rgba(20, 26, 14, 0.1);
        opacity: 0;
        pointer-events: none;
        transition: 0.16s;
      }
      .subscrim.on {
        opacity: 1;
        pointer-events: auto;
      }

      main {
        padding: 20px 22px 90px;
        min-width: 0;
      }
      .crumbs {
        font-size: 11.5px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .head {
        margin-bottom: 14px;
      }
      .head h1 {
        font-size: clamp(20px, 3vw, 27px);
      }
      .head .sub {
        font-size: 13px;
        color: var(--body);
        max-width: 70ch;
        margin-top: 5px;
      }

      .kpis {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 11px;
        margin: 4px 0 16px;
      }
      @media (max-width: 1080px) {
        .kpis {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .kpi {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: 0.12s;
      }
      .kpi:hover {
        transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--green) 36%, var(--line));
      }
      .kpi .lab {
        font: 600 10px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .kpi .val {
        font-family: var(--serif);
        font-size: 21px;
        color: var(--ink);
        margin-top: 5px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .kpi .sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .kpi.hi {
        background: linear-gradient(125deg, var(--greenDeep), var(--green) 72%);
        border-color: transparent;
      }
      .kpi.hi .lab {
        color: rgba(255, 255, 255, 0.75);
      }
      .kpi.hi .val {
        color: #fff;
      }
      .kpi.hi .sub {
        color: rgba(255, 255, 255, 0.8);
      }
      .kpi.warn .val {
        color: var(--danger);
      }

      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 15px;
        box-shadow: var(--shadow);
        overflow: hidden;
        margin-bottom: 14px;
      }
      .card > .ch {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--hair);
        flex-wrap: wrap;
      }
      .card > .ch h3 {
        font-size: 15px;
      }
      .card > .ch .tag {
        margin-left: auto;
        font: 600 11px var(--sans);
        color: var(--muted);
      }
      /* A count that does not add up to what it should — the payment
         milestones that miss 100%, for one. Amber rather than red: it is a
         warning about the figures, not a refusal to save them. */
      .card > .ch .tag.warn {
        color: var(--amber);
      }
      .scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 520px;
        font-size: 13px;
      }
      thead th {
        text-align: left;
        font: 700 10.5px var(--sans);
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--greenSoft);
        padding: 9px 14px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      tbody td {
        padding: 9px 14px;
        border-bottom: 1px solid var(--hair);
        color: var(--body);
        vertical-align: top;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr.click {
        cursor: pointer;
      }
      tbody tr.click:hover {
        background: var(--greenSoft);
      }
      .num {
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
      }
      th.num {
        text-align: right;
      }
      td .k {
        font-weight: 600;
        color: var(--ink);
      }
      tr.tot td {
        background: var(--greenSoft);
        font-weight: 700;
        color: var(--greenDeep);
      }
      .pill {
        display: inline-block;
        font: 600 10.5px var(--sans);
        border-radius: 999px;
        padding: 2px 8px;
        background: var(--hair);
        color: var(--body);
        white-space: nowrap;
      }
      .pill.g {
        background: var(--greenSoft);
        color: var(--greenDeep);
      }
      .pill.y {
        background: var(--amberSoft);
        color: var(--amber);
      }
      .pill.r {
        background: var(--dangerSoft);
        color: var(--danger);
      }
      .pill.b {
        background: var(--blueSoft);
        color: var(--blue);
      }
      .bar {
        height: 7px;
        border-radius: 5px;
        background: var(--hair);
        overflow: hidden;
        min-width: 70px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 5px;
        background: linear-gradient(90deg, var(--green), var(--greenLt));
      }
      .empty {
        padding: 34px;
        text-align: center;
        color: var(--muted);
      }
      input.inline,
      select.inline {
        font: 12.5px var(--sans);
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 8px;
        outline: 0;
        max-width: 130px;
      }
      input.inline:focus {
        border-color: var(--green);
      }
      .alerts {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
      }
      .al {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border: 1px solid var(--line);
        border-left-width: 3px;
        border-radius: 0 11px 11px 0;
        padding: 9px 13px;
        cursor: pointer;
        background: var(--paper);
        transition: 0.12s;
      }
      .al:hover {
        transform: translateX(2px);
      }
      .al.critical {
        border-left-color: var(--danger);
      }
      .al.high {
        border-left-color: var(--spark);
      }
      .al.medium {
        border-left-color: var(--blue);
      }
      .al b {
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 600;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 960px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
      .daylist {
        padding: 10px 16px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 13px;
      }
      .daylist .it {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .daylist .it b {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .daylist .it.click {
        cursor: pointer;
      }
      .daylist .it.click:hover {
        color: var(--greenDeep);
      }
      /* The one row of a version list that IS what is on screen right now —
         distinct from the others, which is the whole point of a navigator:
         you can tell where you are, not only where you could go. */
      .daylist .it.active {
        font-weight: 600;
      }
      .doc {
        background: #fbfdf9;
        border: 1px dashed var(--line);
        border-radius: 12px;
        padding: 18px 20px;
        font-size: 12.5px;
      }
      .doc .dh {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 2px solid var(--green);
        padding-bottom: 10px;
        margin-bottom: 12px;
      }
      .doc .dh b {
        font-family: var(--serif);
        font-size: 16px;
        color: var(--ink);
      }
      .chapline {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 3px 0;
      }

      /* ---------- Gantt (spec §3.3 · §4.3) ---------- */
      .gwrap {
        display: flex;
        align-items: flex-start;
        border-top: 1px solid var(--hair);
      }
      .gnames {
        flex: none;
        width: 190px;
        border-right: 1px solid var(--line);
        background: var(--paper);
      }
      .gnames .gh {
        height: 34px;
        border-bottom: 1px solid var(--line);
        background: var(--greenSoft);
      }
      .gnames .gn {
        height: 30px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        border-bottom: 1px solid var(--hair);
        font-size: 12.5px;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .gnames .gn:hover {
        background: var(--greenSoft);
      }
      .gnames .gn.on {
        background: var(--greenSoft);
        color: var(--greenDeep);
        font-weight: 600;
      }
      .gnames .gn.pay {
        color: var(--blue);
        cursor: default;
      }
      .gnames .gn .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--danger);
        flex: none;
      }
      .gscroll {
        overflow-x: auto;
        overflow-y: hidden;
        flex: 1;
        -webkit-overflow-scrolling: touch;
      }
      .gsvg {
        display: block;
      }
      /* The bars own their gestures; everything else on the chart scrolls normally. */
      .gsvg .gbar,
      .gsvg .ggrip,
      .gsvg .gknob,
      .gsvg .gms {
        touch-action: none;
      }
      .gsvg text {
        font: 11px var(--sans);
        fill: var(--muted);
      }
      .gsvg text.mon {
        font: 600 10px var(--sans);
        fill: var(--body);
      }
      .gsvg .gbar {
        fill: var(--green);
        cursor: grab;
      }
      .gsvg .gbar.crit {
        fill: var(--danger);
      }
      .gsvg .gbar.sel {
        stroke: var(--ink);
        stroke-width: 1.5;
      }
      .gsvg .gprog {
        fill: rgba(255, 255, 255, 0.45);
        pointer-events: none;
      }
      .gsvg .gghost {
        fill: none;
        stroke: var(--faint);
        stroke-width: 1;
        stroke-dasharray: 3 2;
      }
      .gsvg .ggrip {
        fill: rgba(255, 255, 255, 0.55);
        cursor: ew-resize;
      }
      .gsvg .gknob {
        fill: var(--paper);
        stroke: var(--green);
        stroke-width: 1.5;
        cursor: crosshair;
      }
      .gsvg .gdep {
        stroke: var(--muted);
        stroke-width: 1.2;
        fill: none;
      }
      .gsvg .gnonwork {
        fill: var(--hair);
      }
      .gsvg .gtoday {
        stroke: var(--spark);
        stroke-width: 1.5;
      }
      .gsvg .growline {
        stroke: var(--hair);
        stroke-width: 1;
      }
      .gsvg .gfloat {
        stroke: var(--faint);
        stroke-width: 1;
        stroke-dasharray: 2 2;
      }
      .gsvg .gms {
        fill: var(--greenDeep);
        cursor: grab;
      }
      .gsvg .gms.crit {
        fill: var(--danger);
      }
      .gsvg .gpay {
        fill: var(--blue);
      }
      .gsvg .grubber {
        stroke: var(--green);
        stroke-width: 1.6;
        stroke-dasharray: 4 3;
        fill: none;
        pointer-events: none;
      }
      .gbarwrap {
        position: relative;
      }
      .gtools {
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 14px;
      }
      .gtools .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font: 600 11px var(--sans);
        color: var(--body);
        background: var(--hair);
        border-radius: 999px;
        padding: 3px 9px;
      }
      .gtools .chip b {
        color: var(--ink);
      }
      .gtools .chip button {
        border: 0;
        background: transparent;
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        padding: 0 1px;
      }
      .glegend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 8px 14px;
        border-top: 1px solid var(--hair);
        font-size: 11.5px;
        color: var(--muted);
      }
      .glegend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: -1px;
      }

      /* ---------- Project context: selector + fixed header (spec §4) ----------
     "El proyecto elegido queda como contexto activo y todas las subsecciones
     muestran únicamente su información." The strip is sticky because it is the
     frame of reference for everything below it — scrolling a cost table until
     you can no longer see which job it belongs to is how costs end up on the
     wrong project. */
      .projbar {
        position: sticky;
        top: var(--top, 59px);
        z-index: 25;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        margin-bottom: 14px;
        overflow: hidden;
      }
      .projbar .psel {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 9px 13px;
        /* No border-bottom any more: with the summary strip gone (PK5-B) this
           row is the whole bar, and the hairline sat a pixel above the bar's
           own border. */
        background: linear-gradient(120deg, var(--greenSoft), transparent 70%);
      }
      .projbar .psel select {
        font: 600 12.5px var(--sans);
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 6px 9px;
        outline: 0;
        max-width: min(340px, 60vw);
      }
      .projbar .psel input {
        font: 12.5px var(--sans);
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 6px 9px;
        outline: 0;
        width: 150px;
      }
      .projbar .psel input:focus,
      .projbar .psel select:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--greenSoft);
      }
      .projbar .fav {
        border: 0;
        background: transparent;
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
        padding: 2px 4px;
        color: var(--faint);
      }
      .projbar .fav.on {
        color: var(--spark);
      }
      @media (max-width: 860px) {
        .projbar {
          position: static;
        }
      }

      /* ---------- Technical + economic tracking (spec §4.3 / §4.4) ---------- */
      .trk {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 1180px) {
        .trk {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .curve {
        display: block;
        width: 100%;
        height: 210px;
      }
      .curve .cplan {
        fill: none;
        stroke: var(--faint);
        stroke-width: 1.6;
        stroke-dasharray: 4 3;
      }
      .curve .cact {
        fill: none;
        stroke: var(--green);
        stroke-width: 2.4;
      }
      .curve .cproj {
        fill: none;
        stroke: var(--spark);
        stroke-width: 2;
        stroke-dasharray: 5 3;
      }
      .curve .cnow {
        stroke: var(--blue);
        stroke-width: 1.2;
        stroke-dasharray: 2 2;
      }
      .curve .cgrid {
        stroke: var(--hair);
        stroke-width: 1;
      }
      .curve text {
        font: 10px var(--sans);
        fill: var(--muted);
      }
      .riskitem {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 7px 0;
        border-bottom: 1px solid var(--hair);
        font-size: 12.5px;
      }
      .riskitem:last-child {
        border-bottom: 0;
      }
      .riskitem .t {
        flex: 1;
        min-width: 0;
        color: var(--ink);
      }
      .pctin {
        width: 64px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      td.warn {
        color: var(--danger);
        font-weight: 600;
      }
      td.good {
        color: var(--greenDeep);
      }
      .adj {
        font: 600 10px var(--sans);
        color: var(--amber);
        background: var(--amberSoft);
        border-radius: 999px;
        padding: 1px 6px;
        margin-left: 5px;
      }

      /* ---------- Conciliación bancaria (spec §5.3) ----------
     Two columns and the suggestions between them: statement on the left,
     candidate documents on the right, and the match with its reasons in the
     middle. The unreconciled queue sits underneath because it is the period's
     health indicator, not a footnote. */
      .rec {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 1180px) {
        .rec {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .movrow {
        display: grid;
        grid-template-columns: 78px minmax(0, 1fr) 96px;
        gap: 8px;
        align-items: baseline;
        padding: 8px 12px;
        border-bottom: 1px solid var(--hair);
        cursor: pointer;
      }
      .movrow:last-child {
        border-bottom: 0;
      }
      .movrow:hover {
        background: var(--greenSoft);
      }
      .movrow.on {
        background: var(--greenSoft);
        box-shadow: inset 3px 0 0 var(--green);
      }
      .movrow .cpt {
        color: var(--ink);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .movrow .amt {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .movrow .amt.neg {
        color: var(--danger);
      }
      .movrow .amt.pos {
        color: var(--greenDeep);
      }
      .sugg {
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px 11px;
        margin-bottom: 8px;
        background: var(--paper);
      }
      .sugg.strong {
        border-color: var(--green);
        background: var(--greenSoft);
      }
      .sugg .hd {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .sugg .conf {
        font: 700 12px var(--sans);
        font-variant-numeric: tabular-nums;
      }
      .sugg .why {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .sugg .why b {
        color: var(--body);
        font-weight: 600;
      }
      .queuebar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 9px 14px;
        font-size: 12.5px;
      }
      .queuebar .n {
        font: 700 15px var(--sans);
        color: var(--ink);
      }

      /* ---------- Comunicaciones (spec §5.7) ---------- */
      .comm {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 1080px) {
        .comm {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .tpllist {
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        max-height: 64vh;
        overflow-y: auto;
      }
      .tpllist .fam {
        font: 700 9.5px var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 8px 8px 3px;
      }
      .tpllist .tpl {
        text-align: left;
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 6px 9px;
        border-radius: 8px;
        font: 600 12.5px var(--sans);
        color: var(--body);
      }
      .tpllist .tpl:hover {
        background: var(--greenSoft);
        color: var(--ink);
      }
      .tpllist .tpl.on {
        background: var(--greenSoft);
        color: var(--greenDeep);
      }
      .tplbody {
        width: 100%;
        min-height: 170px;
        font: 12.5px/1.55 var(--mono);
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        outline: 0;
        resize: vertical;
      }
      .tplbody:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--greenSoft);
      }
      .varchip {
        display: inline-block;
        font: 600 11px var(--mono);
        background: var(--hair);
        color: var(--body);
        border-radius: 6px;
        padding: 1px 6px;
        margin: 0 4px 4px 0;
        cursor: pointer;
      }
      .varchip:hover {
        background: var(--greenSoft);
        color: var(--greenDeep);
      }
      .preview {
        background: #fbfdf9;
        border: 1px dashed var(--line);
        border-radius: 11px;
        padding: 12px 14px;
        font-size: 12.5px;
        white-space: pre-wrap;
      }

      /* ---------- Gestoría: completeness traffic light (spec §5.6) ---------- */
      .blocks {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
        gap: 9px;
      }
      .blk {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        background: var(--paper);
        border-left-width: 4px;
      }
      .blk.g {
        border-left-color: var(--green);
      }
      .blk.y {
        border-left-color: var(--amber);
      }
      .blk.r {
        border-left-color: var(--danger);
      }
      .blk .lab {
        font: 600 10px var(--sans);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .blk .n {
        font-family: var(--serif);
        font-size: 19px;
        color: var(--ink);
        margin-top: 4px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .blk .sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .blk .sub b {
        color: var(--danger);
      }
      .exrow {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr) auto;
        gap: 9px;
        align-items: baseline;
        padding: 8px 14px;
        border-bottom: 1px solid var(--hair);
        font-size: 12.5px;
      }
      .exrow:last-child {
        border-bottom: 0;
      }
      .exrow .why {
        font-size: 11px;
        color: var(--muted);
      }

      /* ---------- Torre de Control (spec §2.1) ---------- */
      .torrebar {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 11px;
      }
      .torrebar .ts {
        font-size: 11.5px;
        color: var(--muted);
      }
      .tcards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 11px;
        margin: 4px 0 16px;
      }
      @media (max-width: 1080px) {
        .tcards {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 560px) {
        .tcards {
          grid-template-columns: 1fr;
        }
      }
      .tcard {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: 0.12s;
        position: relative;
      }
      .tcard:hover {
        transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--green) 36%, var(--line));
      }
      .tcard .lab {
        font: 600 10px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .tcard .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
        flex: none;
      }
      .tcard .val {
        font-family: var(--serif);
        font-size: 22px;
        color: var(--ink);
        margin-top: 5px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .tcard .sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
        min-height: 14px;
      }
      .tcard .delta {
        font: 700 10.5px var(--sans);
        margin-left: 6px;
      }
      .tcard .delta.up {
        color: var(--greenDeep);
      }
      .tcard .delta.down {
        color: var(--danger);
      }
      .tcard svg.spark {
        display: block;
        width: 100%;
        height: 26px;
        margin-top: 6px;
      }
      .tcard svg.spark path {
        fill: none;
        stroke: var(--green);
        stroke-width: 1.6;
        opacity: 0.75;
      }
      .cardmgr {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .cardmgr .cmrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-bottom: 1px solid var(--hair);
        font-size: 12.5px;
      }
      .cardmgr .cmrow:last-child {
        border-bottom: 0;
      }
      .cardmgr .cmrow button {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 7px;
        width: 26px;
        height: 26px;
        color: var(--body);
        font-size: 12px;
      }
      /* ---------- Alerts as manager (DAS-06/07) ---------- */
      .almgr {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .alrow {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        padding: 9px 12px;
        border-bottom: 1px solid var(--hair);
        font-size: 12.5px;
      }
      .alrow:last-child {
        border-bottom: 0;
      }
      .alrow .meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .alrow .acts {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .alrow .acts button {
        font-size: 11px;
        padding: 4px 8px;
      }
      .algroup {
        font: 700 9.5px var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
        padding: 9px 12px 4px;
      }
      .rulesrow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 70px 90px 120px 90px;
        gap: 8px;
        align-items: center;
        padding: 7px 12px;
        border-bottom: 1px solid var(--hair);
        font-size: 12px;
      }
      .rulesrow input,
      .rulesrow select {
        font: inherit;
        font-size: 12px;
        padding: 5px 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        width: 100%;
      }
      @media (max-width: 700px) {
        .rulesrow {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- Mi Día — hitos calendar (spec §2.2) ---------- */
      .miday {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 940px) {
        .miday {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .calhead {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--hair);
      }
      .calgrid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 1px;
        background: var(--hair);
      }
      .calcell {
        background: var(--paper);
        min-height: 64px;
        padding: 4px 5px;
        font-size: 10.5px;
        position: relative;
      }
      .calcell .dnum {
        font: 700 10px var(--sans);
        color: var(--faint);
      }
      .calcell.today .dnum {
        color: var(--green);
      }
      .calcell.out {
        background: var(--panel, #f4f8f1);
        opacity: 0.55;
      }
      .calcell .ev {
        display: block;
        border-radius: 5px;
        padding: 1px 4px;
        margin-top: 2px;
        font-size: 9.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .miwk {
        font: 700 9px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        text-align: center;
        padding: 4px 0;
        background: var(--paper);
      }
      .milegend {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        padding: 9px 14px;
        font-size: 10.5px;
      }
      .milegend span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: var(--muted);
        cursor: pointer;
        opacity: 1;
        transition: 0.12s;
      }
      .milegend span.off {
        opacity: 0.35;
      }
      .milegend i {
        width: 8px;
        height: 8px;
        border-radius: 2px;
        display: inline-block;
      }

      /* ---------- Compras · Subcontratos · Modificaciones · Horas (spec §4.1/§4.2/§4.5/§4.6) ---------- */
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        vertical-align: middle;
      }
      .dot.g {
        background: var(--greenLt);
      }
      .dot.y {
        background: var(--spark);
      }
      .dot.r {
        background: var(--danger);
      }
      .wgrid input.hin {
        width: 52px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .wgrid td.wtot,
      .wgrid th.wtot {
        background: var(--greenSoft);
        font-weight: 700;
      }
      .wgrid td.wknd {
        background: var(--hair);
      }
      .stepbar {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 10px;
      }

      /* ---------- Budget builder: three simultaneous zones (spec §3.3) ----------
     Left, the chapter/line tree with its per-chapter totals; centre, the
     editable grid; right, the totals panel, which recalculates on every
     keystroke. The zones stack on a narrow viewport rather than scrolling
     sideways: a spreadsheet you have to pan is not a spreadsheet. */
      .bwrap {
        display: grid;
        grid-template-columns: 224px minmax(0, 1fr) 264px;
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 1240px) {
        .bwrap {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .btree {
        padding: 8px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 1px;
        max-height: 70vh;
        overflow-y: auto;
      }
      .btree .bc {
        display: flex;
        gap: 6px;
        align-items: baseline;
        padding: 6px 8px;
        border-radius: 8px;
        cursor: pointer;
        font: 600 12.5px var(--sans);
        color: var(--ink);
      }
      .btree .bc:hover {
        background: var(--greenSoft);
      }
      .btree .bc.on {
        background: var(--greenSoft);
        color: var(--greenDeep);
      }
      .btree .amt {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      .btree .bl {
        display: flex;
        gap: 6px;
        padding: 3px 8px 3px 18px;
        font-size: 11.5px;
        color: var(--muted);
        cursor: pointer;
        border-radius: 7px;
      }
      .btree .bl:hover {
        background: var(--hair);
        color: var(--ink);
      }
      .btree .bl.pend {
        color: var(--amber);
      }
      .bgrid table {
        min-width: 940px;
      }
      .bgrid tbody td {
        padding: 3px 6px;
        vertical-align: middle;
      }
      .bgrid thead th {
        padding: 8px 7px;
      }
      .bgrid input,
      .bgrid select {
        font: 12.5px var(--sans);
        color: var(--ink);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 7px;
        padding: 4px 6px;
        width: 100%;
        outline: 0;
      }
      .bgrid input:hover:not(:disabled),
      .bgrid select:hover:not(:disabled) {
        border-color: var(--line);
      }
      .bgrid input:focus,
      .bgrid select:focus {
        border-color: var(--green);
        background: var(--paper);
        box-shadow: 0 0 0 3px var(--greenSoft);
      }
      .bgrid input:disabled,
      .bgrid select:disabled {
        color: var(--muted);
      }
      .bgrid input.r {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .bgrid tr.chaprow td {
        background: var(--greenSoft);
        font: 600 12px var(--sans);
        color: var(--greenDeep);
      }
      .bgrid .out {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        text-align: right;
        display: block;
      }
      .bgrid .neg {
        color: var(--danger);
      }
      /* Internal-use only: the count of pictures on a line. It is never part of
     the emitted document — there the pictures are in the annex, not the row. */
      .bimg {
        border: 1px solid var(--line);
        background: var(--paper);
        border-radius: 999px;
        font: 600 11px var(--sans);
        padding: 2px 8px;
        cursor: pointer;
        color: var(--muted);
        white-space: nowrap;
      }
      .bimg.has {
        border-color: var(--green);
        color: var(--greenDeep);
        background: var(--greenSoft);
      }
      .bside {
        position: sticky;
        top: calc(var(--top, 59px) + 12px);
      }
      .bside .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 3px 0;
        font-size: 12.5px;
      }
      .bside .row b {
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .bside .row.big {
        border-top: 2px solid var(--green);
        margin-top: 6px;
        padding-top: 8px;
      }
      .bside .row.big b {
        font-family: var(--serif);
        font-size: 17px;
      }
      .bside .row.mut {
        color: var(--muted);
      }
      .bside .row.warn b {
        color: var(--amber);
      }
      .bside .opt {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--body);
        padding: 3px 0;
      }
      .bside .opt select {
        font: 12px var(--sans);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 3px 6px;
        background: var(--paper);
        color: var(--ink);
        margin-left: auto;
      }

      /* ---------- COM-03: the presupuestador, full screen ----------
     One of the four surfaces the specification puts outside the normal shell.
     The reason is not drama: a presupuesto is worked through WHOLE — the
     estimator reads the tree, edits a row, watches the total, and does that a
     hundred times — so anything that costs vertical space (breadcrumb, page
     heading, project strip) or horizontal space (the section rail) is taken
     from the only three things that matter. `body.fs` hides them; render()
     clears the class on every navigation, so no other screen can inherit it.

     The line table is the ONE table in the app that does not paginate. Page 2
     of a presupuesto is not a thing an estimator can hold in their head. */
      body.fs .rail,
      body.fs .crumbs,
      body.fs .head,
      body.fs #projbar,
      body.fs #seedbar {
        display: none;
      }
      body.fs .shell {
        grid-template-columns: minmax(0, 1fr);
        max-width: none;
      }
      body.fs main {
        padding: 0;
      }
      .pb {
        display: flex;
        flex-direction: column;
        height: calc(100vh - var(--top, 59px));
        min-height: 0;
      }
      .pbbar {
        flex: 0 0 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }
      .pbbar .who {
        display: flex;
        flex-direction: column;
        gap: 1px;
        min-width: 0;
      }
      .pbbar .who b {
        font: 600 13px var(--sans);
        color: var(--ink);
        white-space: nowrap;
      }
      .pbbar .who span {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pbbar .tot {
        margin: 0 auto;
        text-align: center;
        line-height: 1.1;
      }
      .pbbar .tot b {
        font-family: var(--serif);
        font-size: 21px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .pbbar .tot span {
        display: block;
        font: 600 9.5px var(--sans);
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .pbbar .acts {
        display: flex;
        gap: 7px;
        align-items: center;
        margin-left: auto;
      }
      .pbpanes {
        flex: 1;
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr) 300px;
        min-height: 0;
      }
      .pbpane {
        min-height: 0;
        overflow: auto;
        background: var(--paper);
      }
      .pbpane.mid {
        background: var(--bg);
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
      .pbh {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        padding: 7px 11px;
        display: flex;
        align-items: center;
        gap: 7px;
        font: 600 11px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
      }
      .pbpane.mid .pbh {
        background: var(--bg);
      }
      .pbtabs {
        display: flex;
        gap: 0;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--paper);
      }
      .pbtabs button {
        flex: 1;
        appearance: none;
        border: 0;
        background: none;
        padding: 9px 8px;
        cursor: pointer;
        font: 600 11.5px var(--sans);
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .pbtabs button.on {
        color: var(--greenDeep);
        border-bottom-color: var(--green);
      }
      .pbbody {
        padding: 10px 12px;
      }
      /* The drag handle. 16 px, per the specification, and it is the ONLY grab
     point: making the whole row draggable steals the text selection an
     estimator needs to copy a description. */
      .pbdrag {
        width: 16px;
        cursor: grab;
        color: var(--faint);
        text-align: center;
        user-select: none;
        line-height: 1;
      }
      .pbdrag:active {
        cursor: grabbing;
      }
      tr.pbrow.drag {
        opacity: 0.4;
      }
      tr.pbrow.over td {
        box-shadow: inset 0 2px 0 var(--green);
      }
      .btree .bc.over {
        box-shadow: inset 0 2px 0 var(--green);
      }
      .btree .bc.drag {
        opacity: 0.4;
      }
      /* Cost and margin sit on grey, so that what is internal LOOKS internal even
     before you read the header — the specification's own instruction, and the
     cheapest possible guard against reading a cost figure aloud to a customer. */
      .bgrid td.int,
      .bgrid th.int {
        background: var(--hair);
      }
      /* The catalogue picker's result list. */
      .cplist {
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-height: 46vh;
        overflow-y: auto;
      }
      .cpi {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        text-align: left;
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--paper);
        cursor: pointer;
        font: inherit;
        color: var(--ink);
        transition: 0.12s;
      }
      .cpi:hover {
        border-color: var(--greenLt);
        background: var(--greenSoft);
      }
      .cpi .cpc {
        font: 600 11.5px var(--mono);
        color: var(--muted);
      }
      .cpi .cpd b {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
      }
      .cpi .cpd i {
        display: block;
        font-style: normal;
        font-size: 11.5px;
        color: var(--muted);
      }
      .cpi .cpm {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      /* The 🔍 that opens it, tucked in beside the código cell. */
      .pbfind {
        white-space: nowrap;
      }
      .bfind {
        border: 0;
        background: transparent;
        cursor: pointer;
        padding: 0 3px 0 0;
        font-size: 12px;
        opacity: 0.55;
        transition: 0.12s;
      }
      .bfind:hover {
        opacity: 1;
      }

      .pbcond {
        flex: 0 0 auto;
        border-top: 1px solid var(--line);
        background: var(--paper);
        /* The ES·CA·EN pill floats bottom-left over every page. This bar is the
           only one that reaches the bottom of the viewport, so it is the only
           one that has to leave room for it — the first control used to sit
           underneath the pill. */
        padding: 8px 14px 8px 152px;
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
      }
      @media (max-width: 560px) {
        .pbcond {
          padding-left: 14px;
          padding-bottom: 52px;
        }
      }
      .pbcond label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        color: var(--muted);
        white-space: nowrap;
      }
      .pbcond input,
      .pbcond select {
        font: 12px var(--sans);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 7px;
        background: var(--paper);
        color: var(--ink);
        outline: 0;
      }
      .pbcond input:focus,
      .pbcond select:focus {
        border-color: var(--green);
      }
      .pbcond input.grow {
        flex: 1 1 220px;
        min-width: 130px;
      }
      @media (max-width: 1180px) {
        .pbpanes {
          grid-template-columns: minmax(0, 1fr);
          overflow: auto;
        }
        .pbpane {
          overflow: visible;
          border: 0;
          border-bottom: 1px solid var(--line);
        }
        .pb {
          height: auto;
        }
      }
      /* ---------- ADM-03: document validation, full screen (S6) ----------
     The second of the specification's four out-of-shell surfaces. Two zones:
     the document itself on the left at 620, the form on the right at 480,
     both full height, because checking a reading against a picture is the
     one job here and anything else on screen is in the way. */
      .cap2 {
        display: grid;
        grid-template-columns: minmax(0, 620px) 480px;
        min-height: 0;
        flex: 1;
      }
      .capdoc {
        min-height: 0;
        overflow: auto;
        background: var(--hair);
        padding: 12px;
        text-align: center;
      }
      .capdoc img,
      .capdoc canvas {
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }
      .capform {
        min-height: 0;
        overflow: auto;
        background: var(--paper);
        border-left: 1px solid var(--line);
      }
      .capf {
        display: grid;
        grid-template-columns: 14px 150px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        padding: 6px 12px;
        border-bottom: 1px solid var(--hair);
      }
      .capf:hover {
        background: var(--hair);
      }
      .capf.on {
        background: var(--greenSoft);
      }
      .capf label {
        font-size: 12px;
        color: var(--muted);
      }
      .capf input {
        font: 12.5px var(--sans);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 8px;
        background: var(--paper);
        color: var(--ink);
        outline: 0;
        width: 100%;
      }
      .capf input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--greenSoft);
      }
      /* The dot. Green means a validator vouched for the value; amber means
     nothing did — never "the reader was confident", which is the whole point
     (see FieldVerdict in the extraction capability). */
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.green {
        background: var(--green);
      }
      .dot.amber {
        background: var(--amber);
      }
      .capwhy {
        grid-column: 2 / -1;
        font-size: 11px;
        color: var(--muted);
        padding: 0 0 4px;
      }
      .capsrc {
        background: var(--amberSoft, #fdf3d7);
        outline: 2px solid var(--amber);
        border-radius: 3px;
      }
      .caplines {
        font:
          11.5px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre-wrap;
        text-align: left;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        margin-top: 10px;
      }
      /* Zoom for a document pane (S7). The picture is the evidence, so it has to
     be readable at the size the reader needs, not the size the pane happens
     to be — a 9 pt order reference on an A4 scan is unreadable at fit-width
     on every screen anybody actually owns. */
      .capzoom {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        padding: 6px 0 2px;
      }
      .capdoc.z img,
      .capdoc.z canvas {
        max-width: none;
      }

      /* ---------- ADM-03: the inbox beside the register (S7) ----------
     The specification's two zones: a 372 column of 96 px cards on the left —
     one per document still waiting for a person — and the 756 register of
     everything already filed on the right. The split is not decorative: the
     left column is a worklist that empties, and a worklist you can see the
     bottom of is the difference between filing documents and having a pile. */
      /* ---------- COM-04: the contract, full screen (S9) ----------
     The fourth and last of §3.1's out-of-shell surfaces. Wider on the left
     than ADM-02's 620 because a contract is read, not compared: up to 760
     for the document, which is a fixed-width piece of paper and gains
     nothing from stretching further, and the REST for the panel that
     indexes it — a fixed 392 there (Package 2 slides 5 and 7) left a wide
     strip of nothing on any screen over ~1150px wide, and starved the
     Hitos de pago table into a horizontal scrollbar it never needed to
     have. 392 stays as the FLOOR: the panel's own content (labels beside
     figures) does not ask for less. */
      .con2 {
        display: grid;
        grid-template-columns: minmax(0, 760px) minmax(392px, 1fr);
        min-height: 0;
        flex: 1;
      }
      /* Package 3 slide 6: no explicit align-items defaults a flex container
     to stretch, which forced .cdoc to the full column height even for a
     short document (few chapters) with nothing to fill it — the blank
     white card the operator flagged. flex-start lets .cdoc size to its own
     content instead; a long document still grows past the viewport on its
     own, unaffected. The generous bottom padding was originally clearance
     for the fixed language pill, which has since moved into Configuración
     (DMC-09); it stays because a document wants breathing room under its
     last line either way, but it is now a typographic choice rather than a
     workaround for something floating over it. */
      .condoc {
        min-height: 0;
        overflow: auto;
        background: var(--hair);
        padding: 16px 16px 48px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .conpanel {
        min-height: 0;
        overflow: auto;
        background: var(--paper);
        border-left: 1px solid var(--line);
      }
      /* The document itself. Type, not chrome: it is the thing the customer signs,
     so it is set like a document and marked translate="no" (S5) — its language
     is a field on the contract, not a preference of whoever is at the screen. */
      .cdoc {
        background: #fff;
        color: #111;
        width: 100%;
        max-width: 720px;
        padding: 34px 40px;
        border: 1px solid var(--line);
        border-radius: 4px;
        box-shadow: var(--shadow);
        font: 13px/1.55 var(--sans);
      }
      .cdoc h1 {
        font: 700 17px var(--sans);
        margin: 0 0 4px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .cdoc h2 {
        font: 700 11px var(--sans);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #666;
        margin: 22px 0 6px;
        border-bottom: 1px solid #ddd;
        padding-bottom: 4px;
      }
      .cdoc .meta {
        color: #666;
        font-size: 12px;
        margin-bottom: 18px;
      }
      .cdoc table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      .cdoc th {
        text-align: left;
        font-weight: 600;
        color: #666;
        padding: 4px 6px;
        border-bottom: 1px solid #ddd;
      }
      .cdoc td {
        padding: 4px 6px;
        border-bottom: 1px solid #f0f0f0;
      }
      .cdoc td.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .cdoc .tot td {
        font-weight: 700;
        border-top: 1px solid #999;
        border-bottom: 0;
      }
      .cdoc .pair {
        display: flex;
        gap: 10px;
        padding: 3px 0;
        border-bottom: 1px solid #f4f4f4;
      }
      .cdoc .pair span:first-child {
        color: #666;
        min-width: 180px;
      }
      @media (max-width: 1180px) {
        .con2 {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* ---------- PRY-03: adicionales (S9) ----------
     Rows are 56 rather than 44 because they carry a 40 × 40 photograph, and an
     unapproved extra gets a 3 px amber rule down its left edge as well as its
     pill — §3.2 wants it readable from across a site office, where nobody is
     going to lean in and read a word. */
      /* 56 exactly: the cells' own padding would otherwise push a row carrying a
     40 px thumbnail to 59, and §3.2's numbers are the point of this screen. */
      tr.xrow td {
        height: 56px;
        padding-top: 4px;
        padding-bottom: 4px;
      }
      /* A border, not a box-shadow: the table is border-collapse:collapse, where a
     shadow on a cell is not painted at all in Chromium. */
      tr.xrow.unapproved td:first-child {
        border-left: 3px solid var(--amber);
      }
      .xthumb {
        width: 40px;
        height: 40px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--hair);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-size: 15px;
        color: var(--faint);
        vertical-align: middle;
      }
      .xthumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ---------- Counter strip (S7) ----------
     The specification's second shared primitive: a row of fixed-width cards
     carrying a count AND an amount, where pressing one filters the list below
     (§3.2 — TC-01, PRY-03, ADM-01, ADM-02, ADM-07 all use it at different
     widths). Width is the caller's, through --cw, because the doc gives a
     different one per screen and a strip that quietly rounds them all to the
     same number is a strip that stopped following the document. */
      .counters {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin: 4px 0 16px;
      }
      .counter {
        flex: 0 1 var(--cw, 270px);
        min-width: 190px;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: 0.12s;
      }
      .counter:hover {
        transform: translateY(-2px);
        border-color: color-mix(in srgb, var(--green) 36%, var(--line));
      }
      .counter.on {
        border-color: var(--green);
        box-shadow: 0 0 0 3px var(--greenSoft);
      }
      .counter .lab {
        font: 600 10px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .counter .val {
        font-family: var(--serif);
        font-size: 21px;
        color: var(--ink);
        margin-top: 5px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .counter .sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      /* ADM-01 paints its overdue counter red, and only when it is non-zero — a
     counter that is always red is a counter nobody looks at (§3.2). */
      .counter.warn .val {
        color: var(--danger);
      }

      /* ---------- Week calendar (S12) ----------
     ADM-04's left zone. Seven day cells with their totals, because choosing
     a day and seeing which days are still empty is the same act — a picker
     that hides the totals makes somebody open all seven to find the gap. */
      .hcal .hday {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--hair);
        background: transparent;
        cursor: pointer;
        font: inherit;
        color: inherit;
        text-align: left;
      }
      .hcal .hday:hover {
        background: var(--hair);
      }
      .hcal .hday.on {
        background: var(--greenSoft);
      }
      .hcal .hday.wknd .d {
        color: var(--faint);
      }
      .hcal .hday .d {
        flex: 1;
        font: 600 12.5px var(--sans);
        color: var(--ink);
      }
      .hcal .hday .h {
        font-variant-numeric: tabular-nums;
        font: 600 13px var(--sans);
        color: var(--ink);
      }
      .hcal .hday .h.zero {
        color: var(--faint);
        font-weight: 400;
      }
      /* The four columns §3.2 fixes for the day sheet: 180 · 110 · 200 · 80. */
      .hsheet td,
      .hsheet th {
        height: 44px;
      }
      .hsheet .cw {
        width: 180px;
      }
      .hsheet .ck {
        width: 110px;
      }
      .hsheet .cp {
        width: 200px;
      }
      .hsheet .ch2 {
        width: 80px;
      }

      /* ---------- Forecast grid (S12) ----------
     ADM-08's shape: a fixed 240 label column that never scrolls away, one 96
     column per period, and the cumulative balance along the foot. The label
     column is sticky rather than duplicated because a row you have scrolled
     sideways past is a row you can no longer name, and "−4.120 €" in an
     unnamed row is worse than no figure at all. */
      .fcast {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      /* Fixed layout with a width the screen computes (240 + 96 per period):
         an auto table distributes any spare container width across its
         columns, which silently turns the document's 96 into whatever fits.
         Wider than the card is exactly what the horizontal scroll is for. */
      .fcast table {
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
      }
      .fcast th,
      .fcast td {
        box-sizing: border-box;
        padding: 8px 10px;
        border-bottom: 1px solid var(--hair);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .fcast th.lab,
      .fcast td.lab {
        position: sticky;
        left: 0;
        z-index: 1;
        background: var(--paper);
        width: 240px;
        min-width: 240px;
        max-width: 240px;
        text-align: left;
        white-space: normal;
      }
      .fcast thead th {
        font: 600 10px var(--sans);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        border-bottom: 1px solid var(--line);
      }
      .fcast td:not(.lab),
      .fcast thead th:not(.lab) {
        width: 96px;
        min-width: 96px;
      }
      .fcast tr.grp td {
        font: 600 10px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        background: var(--hair);
        text-align: left;
      }
      .fcast tr.sub td.lab {
        padding-left: 22px;
        color: var(--body);
      }
      .fcast tr.tot td {
        font-weight: 600;
        color: var(--ink);
        border-top: 1px solid var(--line);
      }
      .fcast tr.cum td {
        font-family: var(--serif);
        font-size: 15px;
        color: var(--ink);
        border-top: 2px solid var(--line);
        border-bottom: 0;
      }
      /* §3.2: the cumulative balance goes red the period it turns negative, and
     only then. That single cell is the whole reason this screen exists. */
      .fcast tr.cum td.neg {
        color: var(--danger);
      }

      /* ---------- Wizard steps (S12) ----------
     ADM-07's 48 step indicator. A step that is not reachable yet is disabled
     rather than hidden: the shape of the job stays visible from step one, so
     nobody discovers at the end that there was a third thing to do. */
      .steps {
        display: flex;
        gap: 8px;
        align-items: stretch;
        margin: 0 0 14px;
      }
      .steps .stp {
        flex: 1 1 0;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        cursor: pointer;
        font: inherit;
        color: var(--muted);
        text-align: left;
        transition: 0.12s;
      }
      .steps .stp .n {
        flex: 0 0 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--hair);
        color: var(--muted);
        font: 600 11px var(--sans);
      }
      .steps .stp.on {
        border-color: var(--green);
        color: var(--ink);
        box-shadow: 0 0 0 3px var(--greenSoft);
      }
      .steps .stp.on .n {
        background: var(--green);
        color: #fff;
      }
      .steps .stp.done .n {
        background: var(--greenSoft);
        color: var(--greenDeep);
      }
      .steps .stp[disabled] {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .steps .stp .t {
        font: 600 12px var(--sans);
        letter-spacing: 0.02em;
      }

      /* .ctrbody survives PK4-B as the padding on a full-screen job surface's
     scrollable body (economicsScreen's #ecoBody) — the rest of the "centre
     panel" rule set it used to live under (.ctr/.ctrlist/.ctrpanel/.ctrhd)
     went with PK4-B: PRY-02 was its last caller once PRY-01 retired it in
     PK4-A, so the 372/780 split, the fixed 88px header and its close button
     have nowhere left to render. */
      .ctrbody {
        padding: 12px 14px 16px;
      }
      .ctrrow {
        font-size: 12.5px;
      }
      .ctrrow b {
        color: var(--ink);
      }

      /* Three contiguous buttons and a percentage that is only live in the middle
     state — §3.2. A percentage on a chapter nobody has started is a number
     with nothing behind it, and one on a finished chapter is always 100. */
      .pstate {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .pstate button {
        width: 90px;
        height: 28px;
        font: 12px var(--sans);
        border: 0;
        background: var(--paper);
        color: var(--body);
        cursor: pointer;
        border-right: 1px solid var(--line);
      }
      .pstate button:last-child {
        border-right: 0;
      }
      .pstate button.on {
        background: var(--green);
        color: #fff;
      }
      .pstate button:hover:not(.on) {
        background: var(--hair);
      }
      .pctbox {
        width: 60px;
        height: 28px;
        margin-left: 8px;
        font: 12px var(--sans);
        text-align: right;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 6px;
        background: var(--paper);
        color: var(--ink);
      }
      .pctbox:disabled {
        background: var(--hair);
        color: var(--faint);
      }
      .provrow {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        border-bottom: 1px solid var(--hair);
        padding: 0 2px;
      }
      .provrow .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }
      /* Package 3 slide 3: the same row, one level down. A partida is indented
     under the chapter it belongs to and set slightly quieter, so the two read
     as a tree without needing a <table> to draw one — which is the whole
     point, since a table forces a phone into horizontal scrolling and a flex
     row does not. */
      .provrow.chap .nm {
        font-weight: 600;
      }
      .provrow.sub {
        height: 40px;
        padding-left: 22px;
      }
      .provrow.sub .nm {
        font-size: 12.5px;
        color: var(--body);
      }
      .provrow .ud,
      .provrow .gdates {
        color: var(--muted);
        font-weight: 500;
        font-size: 11.5px;
      }
      .provrow .gdates {
        white-space: nowrap;
      }
      @media (max-width: 860px) {
        /* Mobile: one tap cycles the three states, so the strip collapses to the
       single button that says where the row is now (§3.2). */
        .pstate button {
          display: none;
          width: auto;
          padding: 0 14px;
        }
        .pstate button.on {
          display: block;
        }
        /* The planned dates are the first thing to go when the row is tight:
       they are readable off the bar directly above. */
        .provrow .gdates {
          display: none;
        }
      }

      .inbox2 {
        display: grid;
        grid-template-columns: 372px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .inbox {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      .inbox .ih {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      .inbox .ih h3 {
        font: 600 13px var(--sans);
        margin: 0;
      }
      .inboxl {
        max-height: 640px;
        overflow: auto;
      }
      .icard {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        height: 96px;
        padding: 0 12px;
        border-bottom: 1px solid var(--hair);
        cursor: pointer;
      }
      .icard:hover {
        background: var(--hair);
      }
      .icard .thumb {
        width: 72px;
        height: 72px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--hair);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-size: 22px;
        color: var(--faint);
      }
      .icard .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .icard .who {
        font: 600 12.5px var(--sans);
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .icard .amt {
        font: 700 15px var(--sans);
        color: var(--ink);
      }
      .icard .meta {
        font-size: 11.5px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (max-width: 1180px) {
        .inbox2 {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      /* The status groups of the register (Borradores · Enviados · …). */
      .grouphd {
        font: 600 11px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--faint);
        background: var(--hair);
      }
      .grouphd td {
        padding: 8px 10px !important;
        height: 32px;
      }

      /* ---------- Graphic annex (Improvement #1) ----------
     Pictures never enter a line's row: they collect at the end of the document
     and the row carries a discreet mark instead, so a table of numbers stays a
     table of numbers whatever anyone attaches to it. */
      .amark {
        font: 700 8.5px var(--sans);
        color: var(--green);
        border: 1px solid var(--green);
        border-radius: 3px;
        padding: 0 2px;
        margin-left: 4px;
        vertical-align: super;
      }
      .annexpg {
        border-top: 1px dashed var(--line);
        margin-top: 12px;
        padding-top: 10px;
      }
      .annexpg .ah {
        font: 700 9.5px var(--sans);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 8px;
      }
      .plates {
        display: grid;
        gap: 10px;
      }
      .plate {
        margin: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: var(--paper);
      }
      .plate img {
        display: block;
        width: 100%;
        height: 148px;
        object-fit: cover;
        background: var(--hair);
      }
      .plate figcaption {
        padding: 6px 9px;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.4;
      }
      .plate figcaption b {
        color: var(--ink);
      }
      .gal {
