/* ===================== Conciliación bancaria (spec §5.3) ===========================
   Statement on the left, candidate documents on the right, the proposed match
   and its REASONS in between. Every score and every reason comes from
   @repo/capability-reconciliation through the bridge; this block picks a
   movement, draws what came back, and turns a click into an engine call.

   The reasons are drawn deliberately, not decoratively. A person is being
   asked to accept or reject a proposal, and "0,99" gives them nothing to
   judge — "exact amount · reference quoted · same counterparty" gives them
   everything. A confidence with no argument behind it teaches people to click
   accept without reading, which is the failure mode this screen exists to
   avoid. */
let recSel=null;
const REC_REASON={
  exactAmount:"importe exacto", amountWithinTolerance:"importe casi exacto",
  sameDate:"misma fecha", dateWithinTolerance:"fecha próxima",
  referenceQuoted:"referencia citada", counterpartyNamed:"tercero coincidente",
  directionAgrees:"signo correcto",
};
function reconApi(){ return (typeof ErpBridge!=="undefined"&&ErpBridge.reconciliation&&ErpBridge.reconciliation.available)?ErpBridge.reconciliation:null; }

function conciliacion(v){
  $('#sub').textContent="Extracto a la izquierda, documentos candidatos a la derecha y la propuesta de emparejamiento en medio, con el porqué. La cola de movimientos sin conciliar es el indicador de salud del periodo.";
  const R=reconApi();
  const r=periodRange();
  const open=erp.unreconciledMovements(r.from,r.to);
  const allOpen=erp.unreconciledMovements();
  if(recSel&&!erp.state.movements.some(m=>m.id===recSel&&m.status==="unallocated")) recSel=null;
  if(!recSel&&open.length) recSel=open[0].id;
  const sel=recSel?erp.state.movements.find(m=>m.id===recSel):null;
  const suggestions=(R&&sel)?R.suggest(erp,sel.id):[];
  const candidates=sel?erp.reconciliationCandidates(sel.id):[];
  const transfers=R?R.internalTransfers(erp,r.from,r.to):[];
  const closed=sel?erp.bankPeriodClosed(sel.accountingDate):false;
  const threshold=R?R.autoAcceptScore:1;

  v.innerHTML=`${periodNote(open.length,allOpen.length)}
   <div class="card"><div class="queuebar">
     <span class="n">${open.length}</span><span>movimientos sin conciliar en el periodo</span>
     <span style="flex:1"></span>
     ${transfers.length?`<span class="pill b">${transfers.length} traspaso(s) interno(s) detectado(s)</span><button class="btn sm" id="rcTransfers">Marcar como internos</button>`:""}
     <button class="btn sm" id="rcClose" title="Bloquea el periodo; exige cero movimientos sin conciliar">🔒 Cerrar periodo</button>
   </div></div>
   ${!R?'<div class="card"><div class="empty">El emparejamiento asistido necesita el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>':""}
   <div class="rec">
    <div>
     <div class="card"><div class="ch"><h3>Extracto</h3><span class="tag">sin conciliar</span></div>
      ${open.map(m=>`<div class="movrow${m.id===recSel?" on":""}" data-mov="${m.id}">
        <span style="color:var(--muted)">${fmtD(m.accountingDate)}</span>
        <span class="cpt">${esc(m.concept||m.merchantText||"—")}${m.needsDoc?' <span class="pill r">sin respaldo</span>':""}</span>
        <span class="amt ${m.amountCents<0?"neg":"pos"}">${eur(m.amountCents)}</span></div>`).join("")
       ||'<div class="empty">Nada pendiente de conciliar en este periodo.</div>'}
     </div>
     ${sel?`<div class="card"><div class="ch"><h3>Propuestas</h3>
       <span class="tag">${suggestions.length} para ${esc(sel.concept||sel.merchantText||"")}</span></div>
      <div style="padding:11px 14px">
       ${closed?'<div class="it" style="color:var(--danger);margin-bottom:8px">El periodo está cerrado. Reábrelo para conciliar.</div>':""}
       ${suggestions.map(s=>{
         const docs=s.docIds.map(id=>candidates.find(c=>c.id===id)).filter(Boolean);
         const strong=s.confidence>=threshold;
         return `<div class="sugg${strong?" strong":""}">
          <div class="hd"><span class="conf" style="color:${strong?'var(--greenDeep)':'var(--body)'}">${Math.round(s.confidence*100)}%</span>
           <span style="flex:1">${docs.map(d=>`${esc(d.reference)} · ${esc(d.counterparty)} · ${eur(d.outstandingCents)}`).join(" + ")}</span>
           ${closed?"":`<button class="btn sm${strong?" primary":""}" data-accept="${s.docIds.join(",")}">Conciliar</button>`}</div>
          <div class="why">${s.reasons.map(x=>`<b>${REC_REASON[x]||x}</b>`).join(" · ")}${s.differenceCents?` · diferencia ${eur(s.differenceCents)}`:""}${s.combination?" · varios documentos":""}</div>
         </div>`;}).join("")
        ||'<div class="it" style="color:var(--muted)">Ningún documento explica este movimiento. Asígnalo a un proyecto o clasifícalo abajo.</div>'}
      </div>
      ${closed?"":`<div class="gtools" style="border-top:1px solid var(--hair)">
        <input class="inline" id="rcProj" placeholder="Nº de proyecto">
        <select class="inline" id="rcKind"><option value="material">Material</option><option value="labour">Mano de obra</option><option value="subcontract">Industrial</option><option value="other">Otro</option></select>
        <button class="btn sm" id="rcAssign">Asignar a proyecto</button>
        <span style="width:10px"></span>
        <select class="inline" id="rcClass">${["overhead","tax","salary","financial","internalTransfer"].map(c=>`<option value="${c}">${({overhead:"Gasto general",tax:"Impuestos",salary:"Nóminas",financial:"Financiero",internalTransfer:"Traspaso interno"})[c]}</option>`).join("")}</select>
        <button class="btn sm" id="rcClassify">Clasificar</button>
        <span style="flex:1"></span>
        <button class="btn sm" id="rcNoDoc">Marcar sin respaldo</button>
      </div>`}</div>`:""}
    </div>
    <div class="bside">
     <div class="card" style="margin:0 0 12px"><div class="ch"><h3>Candidatos</h3><span class="tag">${candidates.length}</span></div>
      <div class="daylist" style="padding:10px 14px">
       ${candidates.slice(0,12).map(c=>`<div class="it"><span class="pill ${c.direction==="in"?"g":"b"}">${c.kind==="invoice"?"Emitida":"Recibida"}</span>
         <span style="flex:1">${esc(c.reference)} · ${esc(c.counterparty)}</span><b>${eur(c.outstandingCents)}</b></div>`).join("")
        ||'<div class="it">Sin documentos abiertos en este sentido.</div>'}
       ${candidates.length>12?`<div class="it" style="color:var(--muted)">…y ${candidates.length-12} más</div>`:""}
      </div></div>
     <div class="card" style="margin:0"><div class="ch"><h3>Periodos cerrados</h3></div><div class="daylist" style="padding:10px 14px">
      ${(erp.state.bankPeriods||[]).map(p=>`<div class="it">${fmtD(p.from)} – ${fmtD(p.to)} ${p.reopenedAt?`<span class="pill y">reabierto ${fmtD(p.reopenedAt)}</span>`:'<span class="pill g">cerrado</span>'}
        ${p.reopenedAt?`<br><span style="color:var(--muted)">${esc(p.reopenReason)}</span>`:`<button class="btn sm" data-reopen="${p.from}">Reabrir</button>`}</div>`).join("")
       ||'<div class="it">Ningún periodo cerrado todavía.</div>'}
     </div></div>
    </div>
   </div>`;

  v.querySelectorAll('[data-mov]').forEach(row=>row.onclick=()=>{recSel=row.dataset.mov;render();});
  v.querySelectorAll('[data-accept]').forEach(b=>b.onclick=()=>mutate(()=>{
    const ids=b.dataset.accept.split(",");
    // One movement against several documents is exactly §5.3's partial
    // reconciliation; matchMovement takes one at a time, so a combination is
    // applied document by document against the same movement.
    ids.forEach(id=>{
      const c=candidates.find(x=>x.id===id);
      erp.matchMovement(sel.id, c.kind==="invoice"?{invoiceId:id}:{billId:id}, "backoffice");
    });
    recSel=null;
  },"Movimiento conciliado"));
  const assign=$('#rcAssign');
  if(assign) assign.onclick=()=>mutate(()=>{
    const ref=$('#rcProj').value.trim(); if(!ref) throw new Error("Escribe el número de proyecto");
    erp.allocateMovementToProject(sel.id,ref,$('#rcKind').value,"backoffice"); recSel=null;
  },"Movimiento asignado");
  const classify=$('#rcClassify');
  if(classify) classify.onclick=()=>mutate(()=>{
    erp.classifyMovement(sel.id,$('#rcClass').value,"backoffice"); recSel=null;
  },"Movimiento clasificado");
  const nodoc=$('#rcNoDoc');
  if(nodoc) nodoc.onclick=()=>mutate(()=>erp.flagMovementNoDoc(sel.id,"backoffice"),
    "Marcado sin respaldo — tarea creada para reclamarlo");
  const tr=$('#rcTransfers');
  if(tr) tr.onclick=()=>mutate(()=>{
    transfers.forEach(t=>{
      erp.classifyMovement(t.outMovementId,"internalTransfer","backoffice");
      erp.classifyMovement(t.inMovementId,"internalTransfer","backoffice");
    });
  },transfers.length+" traspaso(s) marcados — no cuentan como ingreso ni gasto");
  $('#rcClose').onclick=()=>mutate(()=>erp.closeBankPeriod(r.from,r.to,"backoffice"),"Periodo cerrado");
  v.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{
    const reason=prompt("Motivo de la reapertura"); if(reason==null)return;
    mutate(()=>erp.reopenBankPeriod(b.dataset.reopen,reason,"backoffice"),"Periodo reabierto");
  });
}

/* ===================== Comunicaciones (spec §5.7) ==================================
   Template library, the rules that fire them, and the queue they fill.

   NOTHING ON THIS SCREEN SENDS ANYTHING. "Aprobar" moves a draft to approved
   and "Registrar envío" marks it sent; the only thing that could put a message
   on a wire is the messaging capability's email-out port, whose sole bound
   adapter records and delivers nothing. The mandate says no real emails, and
   the button labels are honest about which of the two things they do. */
let comSel=null, comTab="plantillas";
const COM_FAMILY={comercial:"Comercial",contractual:"Contractual",obra:"Obra",cobros:"Cobros",proveedores:"Proveedores",posventa:"Posventa"};
const COM_EVENT={"quote-sent":"Presupuesto enviado","invoice-overdue":"Factura vencida",
  "contract-signed":"Contrato firmado","works-finished":"Obra finalizada",
  "subcontractor-docs-expired":"Documentación de subcontrata caducada"};
function commsApi(){ return (typeof ErpBridge!=="undefined"&&ErpBridge.comms&&ErpBridge.comms.available)?ErpBridge.comms:null; }

function comunicaciones(v){
  $('#sub').textContent="Plantillas por familia, reglas evento → plantilla → destinatario → momento, y la cola resultante. Por defecto nada sale sin que una persona lo apruebe.";
  const C=commsApi();
  const tpls=erp.state.commsTemplates.filter(t=>t.active);
  if(comSel&&!tpls.some(t=>t.id===comSel)) comSel=null;
  if(!comSel&&tpls.length) comSel=tpls[0].id;
  const tpl=tpls.find(t=>t.id===comSel)||null;
  const pending=C?C.pending(erp):[];
  const queue=erp.state.commsQueue||[];
  const TABS=[["plantillas","Plantillas"],["reglas","Reglas"],["cola","Cola y historial"]];

  v.innerHTML=`<div class="stepbar">
    ${TABS.map(([k,l])=>`<button class="btn sm${comTab===k?" primary":""}" data-tab="${k}">${l}</button>`).join("")}
    <span style="flex:1"></span>
    ${pending.length?`<span class="pill y">${pending.length} por encolar</span><button class="btn sm" id="cmQueue">Encolar pendientes</button>`:'<span class="tag">nada pendiente de encolar</span>'}
   </div>
   ${!C?'<div class="card"><div class="empty">Las comunicaciones necesitan el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>':""}
   ${comTab==="plantillas"?templatesPanel(tpls,tpl):comTab==="reglas"?rulesPanel():queuePanel(queue,pending)}`;

  v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{comTab=b.dataset.tab;render();});
  const q=$('#cmQueue');
  if(q) q.onclick=()=>mutate(()=>{
    pending.forEach(p=>erp.queueCommunication(p,"backoffice"));
  },pending.length+" mensaje(s) en cola — ninguno se ha enviado");
  if(comTab==="plantillas") wireTemplatesPanel(tpl);
  if(comTab==="reglas") wireRulesPanel();
  if(comTab==="cola") wireQueuePanel();
}
function templatesPanel(tpls,tpl){
  const fams={}; tpls.forEach(t=>{(fams[t.family]=fams[t.family]||[]).push(t);});
  const vars=["cliente","number","importe","fecha"];
  return `<div class="comm">
   <div class="card" style="margin:0"><div class="ch"><h3>Biblioteca</h3><button class="btn sm" id="cmNewTpl">＋</button></div>
    <div class="tpllist">
     ${Object.keys(fams).map(f=>`<div class="fam">${COM_FAMILY[f]||f}</div>
       ${fams[f].map(t=>`<button class="tpl${t.id===(tpl&&tpl.id)?" on":""}" data-tpl="${t.id}">${esc(t.label||t.key)} <span style="color:var(--faint)">v${t.version}</span></button>`).join("")}`).join("")
      ||'<div class="empty">Sin plantillas.</div>'}
    </div></div>
   ${tpl?`<div>
    <div class="card" style="margin:0 0 12px"><div class="ch"><h3>${esc(tpl.label||tpl.key)}</h3>
      <span class="tag">${esc(tpl.key)} · ${tpl.lang} · v${tpl.version}</span></div>
     <div class="fgrid" style="padding:12px 16px">
      <div class="field full"><label>Asunto</label><input id="cm_subject" value="${esc(tpl.subject)}"></div>
      <div class="field full"><label>Cuerpo</label><textarea class="tplbody" id="cm_body">${esc(tpl.body)}</textarea></div>
      <div class="field full"><label>Variables — pulsa para insertar</label>
        <div>${vars.map(x=>`<span class="varchip" data-var="${x}">{{${x}}}</span>`).join("")}</div></div>
      <div class="field"><label>Adjunto automático</label><select id="cm_attach">${[["","Ninguno"],["budget","Presupuesto"],["invoice","Factura"],["contract","Contrato"]].map(([val,l])=>`<option value="${val}"${tpl.attach===val?" selected":""}>${l}</option>`).join("")}</select></div>
      <div class="field"><label>Idioma</label><select id="cm_lang">${["es","ca"].map(l=>`<option value="${l}"${tpl.lang===l?" selected":""}>${l==="es"?"Español":"Català"}</option>`).join("")}</select></div>
      <div class="field full" style="margin-top:6px"><button class="btn primary" id="cm_save">Guardar como nueva versión</button></div>
     </div></div>
    <div class="card" style="margin:0"><div class="ch"><h3>Previsualización</h3><span class="tag">con datos reales del primer registro que encaja</span></div>
     <div style="padding:12px 16px"><div class="preview" id="cm_preview"></div></div></div>
   </div>`:'<div class="card" style="margin:0"><div class="empty">Selecciona o crea una plantilla.</div></div>'}
  </div>`;
}
function wireTemplatesPanel(tpl){
  document.querySelectorAll('[data-tpl]').forEach(b=>b.onclick=()=>{comSel=b.dataset.tpl;render();});
  $('#cmNewTpl').onclick=()=>newTemplateDrawer();
  if(!tpl) return;
  const refresh=()=>{
    const C=commsApi(); if(!C) return;
    // Previewed against a REAL record (§5.7 "previsualización con datos reales"),
    // because a template that reads well against {{placeholders}} and badly
    // against an actual customer name is the normal failure.
    const ev=erp.commsEvents()[0]||{vars:{}};
    const vars=Object.assign({cliente:"—",number:"—",importe:0,fecha:fmtD(erp.today)},ev.vars||{});
    $('#cm_preview').textContent=C.render($('#cm_subject').value,vars)+"\n\n"+C.render($('#cm_body').value,vars);
  };
  $('#cm_subject').oninput=refresh; $('#cm_body').oninput=refresh; refresh();
  document.querySelectorAll('[data-var]').forEach(c=>c.onclick=()=>{
    const ta=$('#cm_body'); const tok="{{"+c.dataset.var+"}}";
    ta.setRangeText(tok,ta.selectionStart,ta.selectionEnd,"end"); ta.focus(); refresh();
  });
  $('#cm_save').onclick=()=>mutate(()=>{
    const next=erp.updateCommsTemplate(tpl.id,{subject:$('#cm_subject').value,body:$('#cm_body').value,
      attach:$('#cm_attach').value,lang:$('#cm_lang').value},"backoffice");
    comSel=next.id;
  },"Nueva versión guardada — la anterior se conserva");
}
function newTemplateDrawer(){
  const db=openDrawer("Nueva plantilla");
  db.innerHTML=`<div class="fgrid">
   <div class="field"><label>Clave *</label><input id="nt_key" placeholder="quote-followup"></div>
   <div class="field"><label>Nombre</label><input id="nt_label" placeholder="Seguimiento de presupuesto"></div>
   <div class="field"><label>Familia</label><select id="nt_fam">${Object.entries(COM_FAMILY).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
   <div class="field"><label>Idioma</label><select id="nt_lang"><option value="es">Español</option><option value="ca">Català</option></select></div>
   <div class="field full"><label>Asunto</label><input id="nt_subject" placeholder="Su presupuesto {{number}}"></div>
   <div class="field full"><label>Cuerpo</label><textarea class="tplbody" id="nt_body" placeholder="Hola {{cliente}},"></textarea></div>
   <div class="field full" style="margin-top:6px"><button class="btn primary" id="nt_save">Crear plantilla</button></div>
  </div>`;
  $('#nt_save').onclick=()=>mutate(()=>{
    const key=$('#nt_key').value.trim(); if(!key) throw new Error("La clave es obligatoria");
    const rec=erp.addCommsTemplate({key,label:$('#nt_label').value,family:$('#nt_fam').value,
      lang:$('#nt_lang').value,subject:$('#nt_subject').value,body:$('#nt_body').value},"backoffice");
    comSel=rec.id; closeDrawer();
  },"Plantilla creada");
}
function rulesPanel(){
  const rules=erp.state.commsRules||[];
  return `<div class="card"><div class="ch"><h3>Reglas</h3><span class="tag">evento → plantilla → destinatario → momento → canal</span>
    <button class="btn sm" id="cmNewRule">＋ Nueva regla</button></div>
   <div class="scroll"><table><thead><tr><th>Regla</th><th>Evento</th><th>Plantilla</th><th>Destinatario</th><th class="num">Momento</th><th>Canal</th><th>Modo</th><th>Estado</th><th></th></tr></thead><tbody>
   ${rules.map(r=>`<tr><td class="k">${esc(r.label||r.id)}</td><td>${COM_EVENT[r.event]||esc(r.event)}</td>
     <td>${esc(r.template)}</td><td>${esc(r.recipient)}</td>
     <td class="num">${r.afterDays?`+${r.afterDays} d`:"inmediato"}</td><td>${esc(r.channel)}</td>
     <td>${r.mode==="auto"?'<span class="pill y">Automático</span>':'<span class="pill g">Borrador</span>'}</td>
     <td>${r.active?'<span class="pill b">Activa</span>':'<span class="pill">Inactiva</span>'}</td>
     <td><button class="btn sm" data-sim="${r.id}">Simular</button> <button class="btn sm" data-toggle="${r.id}">${r.active?"Desactivar":"Activar"}</button></td></tr>`).join("")
    ||'<tr><td colspan="9"><div class="empty">Sin reglas. Una regla dice cuándo se prepara un mensaje — nunca que se envíe solo.</div></td></tr>'}
   </tbody></table></div></div>`;
}
function wireRulesPanel(){
  $('#cmNewRule').onclick=()=>newRuleDrawer();
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>mutate(()=>{
    const r=erp.state.commsRules.find(x=>x.id===b.dataset.toggle);
    erp.updateCommsRule(r.id,{active:!r.active},"backoffice");
  },"Regla actualizada"));
  document.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>simulateRuleDrawer(b.dataset.sim));
}
function newRuleDrawer(){
  const tpls=erp.state.commsTemplates.filter(t=>t.active);
  const db=openDrawer("Nueva regla");
  db.innerHTML=`<div class="fgrid">
   <div class="field full"><label>Nombre</label><input id="nr_label" placeholder="Aviso de factura vencida a 3 días"></div>
   <div class="field"><label>Evento *</label><select id="nr_event">${Object.entries(COM_EVENT).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
   <div class="field"><label>Plantilla *</label><select id="nr_tpl">${tpls.map(t=>`<option value="${esc(t.key)}">${esc(t.label||t.key)}</option>`).join("")||'<option value="">—</option>'}</select></div>
   <div class="field"><label>Destinatario</label><select id="nr_to"><option value="customer">Cliente</option><option value="supplier">Proveedor</option></select></div>
   <div class="field"><label>Días tras el evento</label><input id="nr_days" type="number" min="0" value="0"></div>
   <div class="field"><label>Canal</label><select id="nr_ch"><option value="email">Email</option><option value="whatsapp">WhatsApp</option><option value="sms">SMS</option></select></div>
   <div class="field"><label>Modo</label><select id="nr_mode"><option value="draft">Borrador para aprobar</option><option value="auto">Automático</option></select></div>
   <div class="field full" style="margin-top:6px"><button class="btn primary" id="nr_save">Crear regla</button></div>
  </div>`;
  $('#nr_save').onclick=()=>mutate(()=>{
    const tplKey=$('#nr_tpl').value; if(!tplKey) throw new Error("Crea una plantilla antes de la regla");
    erp.addCommsRule({label:$('#nr_label').value,event:$('#nr_event').value,template:tplKey,
      recipient:$('#nr_to').value,afterDays:+$('#nr_days').value||0,channel:$('#nr_ch').value,
      mode:$('#nr_mode').value},"backoffice");
    closeDrawer();
  },"Regla creada");
}
/** §5.7 "probar una regla en modo simulación" — what it WOULD produce, sending nothing. */
function simulateRuleDrawer(ruleId){
  const C=commsApi(); const r=erp.state.commsRules.find(x=>x.id===ruleId);
  const planned=C?C.simulate(erp,[Object.assign({},r,{active:true})]):[];
  const db=openDrawer("Simulación · "+(r.label||r.event));
  db.innerHTML=`<div class="card"><div class="ch"><h3>${planned.length} mensaje(s) que produciría</h3>
    <span class="tag">simulación — no se encola ni se envía nada</span></div><div class="daylist">
   ${planned.map(p=>`<div class="it"><span class="pill ${p.due?"y":"b"}">${p.due?"ya vencido":fmtD(p.dueDate)}</span>
     <span style="flex:1">${esc(p.subjectRef)} → ${esc(p.to||"sin dirección")}</span>
     ${p.blocked?'<span class="pill r">sin destinatario</span>':""}</div>`).join("")
    ||'<div class="it">Esta regla no produciría ningún mensaje con los datos de hoy.</div>'}
  </div></div>`;
}
function queuePanel(queue,pending){
  const ST={draft:["Borrador","y"],approved:["Aprobado","b"],sent:["Registrado como enviado","g"],
    cancelled:["Cancelado",""],blocked:["Sin destinatario","r"]};
  return `<div class="card"><div class="ch"><h3>Cola</h3>
    <span class="tag">nada sale sin aprobación — el envío real no está conectado</span></div>
   <div class="scroll"><table><thead><tr><th>Vence</th><th>Asunto</th><th>Plantilla</th><th>Destinatario</th><th>Canal</th><th>Estado</th><th></th></tr></thead><tbody>
   ${queue.slice().reverse().map(q=>{const st=ST[q.status]||[q.status,""];
     return `<tr><td>${fmtD(q.dueDate)}</td><td class="k">${esc(q.subjectRef)}</td><td>${esc(q.templateKey)}</td>
      <td>${esc(q.to||"—")}</td><td>${esc(q.channel)}</td><td><span class="pill ${st[1]}">${st[0]}</span></td>
      <td>${q.status==="draft"?`<button class="btn sm primary" data-approve-msg="${q.id}">Aprobar</button> <button class="btn sm danger" data-cancel-msg="${q.id}">Cancelar</button>`:""}
       ${q.status==="approved"?`<button class="btn sm" data-sent-msg="${q.id}">Registrar envío</button>`:""}</td></tr>`;}).join("")
    ||'<tr><td colspan="7"><div class="empty">La cola está vacía.</div></td></tr>'}
   </tbody></table></div>
   ${pending.length?`<div class="queuebar" style="border-top:1px solid var(--hair)"><span class="pill y">${pending.length}</span>
     <span>mensaje(s) que las reglas producirían y todavía no están en la cola</span></div>`:""}
  </div>`;
}
function wireQueuePanel(){
  document.querySelectorAll('[data-approve-msg]').forEach(b=>b.onclick=()=>mutate(()=>
    erp.approveCommunication(b.dataset.approveMsg,"backoffice"),"Aprobado — sigue sin enviarse"));
  document.querySelectorAll('[data-cancel-msg]').forEach(b=>b.onclick=()=>mutate(()=>
    erp.cancelCommunication(b.dataset.cancelMsg,"backoffice"),"Cancelado"));
  document.querySelectorAll('[data-sent-msg]').forEach(b=>b.onclick=()=>mutate(()=>
    erp.recordCommunicationSent(b.dataset.sentMsg,"backoffice"),"Registrado como enviado"));

/* ===================== Torre de Control (spec §2.1) =================================
   Eight cards, each carrying exactly the big/small figures the spec names, a
   twelve-period sparkline and the delta against the prior period. The colour
   dot is wired to the SAME numbers the card already shows (negative result,
   overdrawn balance, a payment week bigger than the cash on hand) rather than
   a second per-tile threshold store — "el umbral de cada indicador" already
   has a home in the alert rules below; duplicating it here is exactly the
   kind of two-sources-of-truth bug the rest of this codebase avoids.
   Card order/visibility is a viewing preference, not business data, so it
   lives in ErpStore meta (like the project selector's favourites) rather
   than in engine state — a second browser on the same tenant is allowed a
   different layout. */
const TORRE_CARDS=[
 {key:"activeProjects",label:"Proyectos activos",dest:"proyectos",fmt:"count",
  series:s=>s.activeProjects,
  big:c=>String(c.activeProjects.count),
  small:c=>eur0(c.activeProjects.contractedCents)+" contratado",
  dot:()=>false},
 {key:"monthResult",label:"Resultado operativo del mes",dest:"finanzas",fmt:"money",
  series:s=>s.monthResult,
  big:c=>eur0(c.monthResult.resultCents),
  small:c=>`Ingresos ${eur0(c.monthResult.revenueCents)} − Gastos ${eur0(c.monthResult.expenseCents)}`,
  dot:c=>c.monthResult.resultCents<0},
 {key:"quarterResult",label:"Resultado operativo del trimestre",dest:"finanzas",fmt:"money",
  series:s=>s.quarterResult,
  big:c=>eur0(c.quarterResult.resultCents),
  small:c=>`Ingresos ${eur0(c.quarterResult.revenueCents)} − Gastos ${eur0(c.quarterResult.expenseCents)}`,
  dot:c=>c.quarterResult.resultCents<0},
 {key:"bankBalance",label:"Saldo bancos",dest:"banco",fmt:"money",
  series:s=>s.bankBalance,
  big:c=>eur0(c.bankBalance.nowCents),
  small:c=>"Cierre mes anterior "+eur0(c.bankBalance.prevMonthCloseCents),
  dot:c=>c.bankBalance.nowCents<0},
 {key:"cashForecast",label:"Proyección de caja",dest:"banco",fmt:null,
  series:null, // forward-looking by nature — no honest "last 12 periods" to draw
  big:c=>eur0(c.cashForecast.d7.netCents)+" (7 d)",
  small:c=>`14 d ${eur0(c.cashForecast.d14.netCents)} · 30 d ${eur0(c.cashForecast.d30.netCents)}`,
  dot:c=>c.cashForecast.d7.netCents<0},
 {key:"supplierPayments",label:"Pagos a proveedores",dest:"pagos",fmt:"money",
  series:s=>s.supplierPayments,
  big:c=>eur0(c.supplierPayments.thisWeekCents),
  small:c=>"Próxima semana "+eur0(c.supplierPayments.nextWeekCents),
  dot:c=>c.supplierPayments.thisWeekCents>c.bankBalance.nowCents},
 {key:"opportunities",label:"Oportunidades abiertas",dest:"oportunidades",fmt:"count",
  series:s=>s.opportunities,
  big:c=>String(c.opportunities.openCount),
  small:c=>`Contratadas ${c.opportunities.wonCount12m} · Perdidas ${c.opportunities.lostCount12m} (12 m)`,
  dot:()=>false},
 {key:"visits",label:"Visitas",dest:"oportunidades",fmt:"count",
  series:s=>s.visits,
  big:c=>String(c.visits.pendingCount),
  small:c=>"Realizadas 30 d: "+c.visits.done30dCount,
  dot:()=>false},
];
let torreOrder=[], torreHidden=[];
function saveTorrePrefs(){ try{ ErpStore.setMeta("ui.torre",{order:torreOrder,hidden:torreHidden}); }catch(e){} }
function torreCardList(){
  const known=TORRE_CARDS.map(c=>c.key);
  const order=torreOrder.filter(k=>known.includes(k)).concat(known.filter(k=>!torreOrder.includes(k)));
  return order.map(k=>TORRE_CARDS.find(c=>c.key===k)).filter(c=>!torreHidden.includes(c.key));
}
function sparklinePath(values){
  const n=values.length;
  const min=Math.min(...values), max=Math.max(...values), span=(max-min)||1;
  return values.map((v,i)=>{
    const x=n>1?(i/(n-1))*100:50, y=24-((v-min)/span)*20-2;
    return (i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
}
function seriesDelta(values){
  if(!values||values.length<2) return null;
  const last=values[values.length-1], prev=values[values.length-2];
  if(last===prev) return {diff:0,up:true};
  return {diff:last-prev,up:last>=prev};
}

/** §2.1 "exportar la vista a PDF/Excel" — a real CSV download; print (Ctrl+P) covers PDF honestly via the browser's own dialog. */
function exportTorreCsv(ct){
  const rows=[["Indicador","Valor principal","Detalle"]].concat(
    torreCardList().map(c=>[c.label,c.big(ct.cards).replace(/\s/g," "),c.small(ct.cards).replace(/\s/g," ")]));
  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`torre-de-control-${erp.today}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}
function torreCustomizeDrawer(){
  const db=openDrawer("Tarjetas de la Torre");
  const list=TORRE_CARDS.map(c=>c.key);
  const order=torreOrder.filter(k=>list.includes(k)).concat(list.filter(k=>!torreOrder.includes(k)));
  const render2=()=>{
    db.innerHTML=`<div class="cardmgr">${order.map((k,i)=>{const c=TORRE_CARDS.find(x=>x.key===k);
      return `<div class="cmrow"><button data-up="${k}" ${i===0?"disabled":""}>↑</button><button data-down="${k}" ${i===order.length-1?"disabled":""}>↓</button>
       <span style="flex:1">${c.label}</span><label style="display:flex;align-items:center;gap:5px">
        <input type="checkbox" data-vis="${k}" ${torreHidden.includes(k)?"":"checked"}> visible</label></div>`;}).join("")}</div>`;
    db.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=order.indexOf(b.dataset.up); if(i>0){[order[i-1],order[i]]=[order[i],order[i-1]]; torreOrder=order.slice(); saveTorrePrefs(); render(); render2();}});
    db.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=order.indexOf(b.dataset.down); if(i<order.length-1){[order[i+1],order[i]]=[order[i],order[i+1]]; torreOrder=order.slice(); saveTorrePrefs(); render(); render2();}});
    db.querySelectorAll('[data-vis]').forEach(cb=>cb.onchange=()=>{
      torreHidden = cb.checked ? torreHidden.filter(k=>k!==cb.dataset.vis) : torreHidden.concat([cb.dataset.vis]);
      saveTorrePrefs(); render();});
  };
  render2();
}

/* ---- Alerts panel as a manager, not a read-only feed (DAS-06/07) ----
   Grouped by type then by project, because that is how a backoffice person
   actually triages a list: "what kind of problem is this" first, "which job
   does it belong to" second. Every row can be assigned, given a deadline,
   snoozed with a reason, resolved with a note and evidence, or turned into a
   task — the four verbs §2.1 names for "gestor, no aviso". */
const ALERT_TYPE_LABEL={economica:"Económica",tecnica:"Técnica",documental:"Documental",fiscal:"Fiscal"};
let almgrGroupBy="type";
function alertsPanel(alerts){
  const groups={};
  alerts.forEach(a=>{
    const g=almgrGroupBy==="type"?(ALERT_TYPE_LABEL[a.type]||a.type):(a.project||"Sin proyecto");
    (groups[g]=groups[g]||[]).push(a);
  });
  const keys=Object.keys(groups).sort();
  return `<div class="card" style="margin:0"><div class="ch"><h3>Alertas</h3>
    <span class="tag">${alerts.filter(a=>a.sev==="critical").length} críticas · ${alerts.filter(a=>a.sev==="high").length} altas</span>
    <span style="flex:1"></span>
    <button class="btn sm ${almgrGroupBy==='type'?'primary':''}" data-grp="type">Por tipo</button>
    <button class="btn sm ${almgrGroupBy==='project'?'primary':''}" data-grp="project">Por proyecto</button>
    <button class="btn sm" id="aRules">⚙ Reglas</button></div>
   <div class="almgr">${keys.map(g=>`<div class="algroup">${esc(g)}</div>${groups[g].map(a=>alertRowHtml(a)).join("")}`).join("")
    ||'<div class="empty">Sin alertas. Todo en orden.</div>'}</div></div>`;
}
function alertRowHtml(a){
  const icon=a.sev==="critical"?"🔴":a.sev==="high"?"🟡":"🔵";
  return `<div class="alrow" data-key="${esc(a.key)}">
   <div>${icon}</div>
   <div><b class="click" data-goref='${esc(JSON.stringify(a.ref))}'>${esc(a.msg)}</b>
    <div class="meta">${a.assignee?`<span>👤 ${esc(a.assignee)}</span>`:""}${a.dueDate?`<span>📅 ${fmtD(a.dueDate)}</span>`:""}${a.snoozedUntil?`<span>💤 hasta ${fmtD(a.snoozedUntil)}</span>`:""}</div></div>
   <div class="acts">
    <button class="btn sm" data-assign="${esc(a.key)}">Asignar</button>
    <button class="btn sm" data-due="${esc(a.key)}">Fecha</button>
    <button class="btn sm" data-snooze="${esc(a.key)}">Posponer</button>
    <button class="btn sm" data-resolve="${esc(a.key)}">Resolver</button>
    <button class="btn sm" data-totask="${esc(a.key)}" ${a.taskId?"disabled":""}>${a.taskId?"En tareas":"→ Tarea"}</button>
   </div></div>`;
}
function wireAlertsPanel(){
  document.querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{almgrGroupBy=b.dataset.grp; render();});
  document.querySelectorAll('[data-goref]').forEach(n=>n.onclick=()=>gotoAlert(JSON.parse(n.dataset.goref)));
  $('#aRules')?.addEventListener('click',()=>alertRulesDrawer());
  document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>{
    const who=prompt("¿A quién se asigna esta alerta?"); if(who===null)return;
    mutate(()=>erp.assignAlert(b.dataset.assign,who,"backoffice"),"Alerta asignada");
  });
  document.querySelectorAll('[data-due]').forEach(b=>b.onclick=()=>{
    const d=prompt("Fecha límite (AAAA-MM-DD):",erp.today); if(d===null)return;
    mutate(()=>erp.setAlertDue(b.dataset.due,d,"backoffice"),"Fecha límite guardada");
  });
  document.querySelectorAll('[data-snooze]').forEach(b=>b.onclick=()=>{
    const d=prompt("Posponer hasta (AAAA-MM-DD):"); if(d===null||!d)return;
    const reason=prompt("Motivo (opcional):")||"";
    mutate(()=>erp.snoozeAlert(b.dataset.snooze,d,reason,"backoffice"),"Alerta pospuesta");
  });
  document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>{
    const note=prompt("Nota de resolución (obligatoria):"); if(note===null||!note.trim())return;
    const ev=prompt("Evidencia (descripción; opcional):")||"";
    mutate(()=>erp.resolveAlert(b.dataset.resolve,note,ev.trim()?[ev.trim()]:[],"backoffice"),"Alerta resuelta");
  });
  document.querySelectorAll('[data-totask]').forEach(b=>{ if(b.disabled)return; b.onclick=()=>{
    const row=b.closest('.alrow'); const msg=row.querySelector('[data-goref]').textContent;
    const due=prompt("Vence (AAAA-MM-DD):",erp.today); if(due===null)return;
    mutate(()=>erp.convertAlertToTask(b.dataset.totask,msg,"backoffice",due,"backoffice"),"Convertida en tarea");
  };});
}
/** §2.1 "editor de reglas: condición, umbral, destinatario y canal". */
function alertRulesDrawer(){
  const db=openDrawer("Reglas de alertas");
  const render2=()=>{
    const rules=erp.ensureAlertRules();
    db.innerHTML=`<div class="rulesbox">${rules.map(r=>`<div class="rulesrow">
      <span>${esc(r.label)} <span class="tag">${ALERT_TYPE_LABEL[r.type]||r.type}</span></span>
      <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" data-en="${r.code}" ${r.enabled?"checked":""}> activa</label>
      ${r.thresholdValue!=null?`<input type="number" min="0" data-th="${r.code}" value="${r.thresholdValue}" title="días">`:'<span></span>'}
      <select data-rec="${r.code}"><option value="backoffice"${r.recipient==="backoffice"?" selected":""}>Oficina</option><option value="operations"${r.recipient==="operations"?" selected":""}>Obra</option></select>
      <select data-ch="${r.code}"><option value="app"${r.channel==="app"?" selected":""}>App</option><option value="email"${r.channel==="email"?" selected":""}>Email</option></select>
     </div>`).join("")}</div>`;
    // No render2() after these: the field the user just edited already shows
    // the value they set (native checkbox/select/input state), and rebuilding
    // db.innerHTML from inside that same field's own change/blur handler
    // fought the browser over a node it was mid-way through removing —
    // "node to be removed is no longer a child of this node" — for no benefit,
    // since nothing else on screen depends on the value that just changed.
    db.querySelectorAll('[data-en]').forEach(cb=>cb.onchange=()=>mutate(()=>erp.updateAlertRule(cb.dataset.en,{enabled:cb.checked},"backoffice"),"Regla actualizada"));
    db.querySelectorAll('[data-th]').forEach(inp=>inp.onchange=()=>mutate(()=>erp.updateAlertRule(inp.dataset.th,{thresholdValue:+inp.value||0},"backoffice"),"Umbral actualizado"));
    db.querySelectorAll('[data-rec]').forEach(s=>s.onchange=()=>mutate(()=>erp.updateAlertRule(s.dataset.rec,{recipient:s.value},"backoffice"),"Destinatario actualizado"));
    db.querySelectorAll('[data-ch]').forEach(s=>s.onchange=()=>mutate(()=>erp.updateAlertRule(s.dataset.ch,{channel:s.value},"backoffice"),"Canal actualizado"));
  };
  render2();
}

function shiftMonth(ym,n){ const [y,m]=ym.split("-").map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); return d.toISOString().slice(0,7); }

/* =============================== Project context (spec §4) ==========================
   "Lo primero de esta sección es la selección del proyecto, de modo que todo lo
   que aparece debajo quede asociado a un proyecto concreto."

   One context for the whole section, held in gProject — the same variable the
   chart already used, promoted from a chart-local selector to the section's.
   Two screens showing different projects at once is the bug this prevents, and
   it is the kind that gets discovered when a cost lands on the wrong job. */
const PROJECT_SUBS=["proyectos","compras","subcontratos","seguimiento","economia","modificaciones","horas"];
let projFilter="", projStatus="open";
let projFavs=[], projRecents=[];
function saveProjPrefs(){ try{ ErpStore.setMeta("ui.projects",{favs:projFavs,recents:projRecents}); }catch(e){} }
function projectOptions(){
  const q=projFilter.trim().toLowerCase();
  return erp.state.projects.filter(p=>{
    if(projStatus==="open"&&p.closed) return false;
    if(projStatus==="closed"&&!p.closed) return false;
    if(projStatus==="fav"&&!projFavs.includes(p.id)) return false;
    if(!q) return true;
    return (p.code+" "+erp.party(p.partyId).name).toLowerCase().includes(q);
  }).sort((a,b)=>{
    // Favourites first, then most recently opened, then by code.
    const fa=projFavs.includes(a.id),fb=projFavs.includes(b.id); if(fa!==fb) return fa?-1:1;
    const ra=projRecents.indexOf(a.id),rb=projRecents.indexOf(b.id);
    if(ra!==rb) return (ra<0?99:ra)-(rb<0?99:rb);
    return a.code<b.code?-1:1;
  });
}
function setProject(id){
  gProject=id; gSel=null;
  projRecents=[id,...projRecents.filter(x=>x!==id)].slice(0,5); saveProjPrefs();
  render();
}

  let h;
  try{ h=erp.projectHeader(gProject); }catch(e){ host.innerHTML=""; return; }
  const fav=projFavs.includes(gProject);

      ${projRecents.length>1?`<span style="font-size:11.5px;color:var(--muted)">Recientes: ${projRecents.slice(1,4).map(id=>{const p=erp.state.projects.find(x=>x.id===id);return p?`<a href="#" data-recent="${id}">${p.code}</a>`:"";}).filter(Boolean).join(" · ")}</span>`:""}
    </div>

      <div class="f"><span class="l">Estado</span><span class="v"><span class="pill ${(ST[h.status]||["b"])[0]}">${(ST[h.status]||["","—"])[1]}</span></span></div>
      <div class="sep"></div>

    </div></div>`;
  $('#psel').onchange=e=>setProject(e.target.value);

/* =============================== Budget builder (spec §3.3) =========================
   Three zones at once: the chapter/line tree, the editable grid, and a totals
   panel that recalculates on every keystroke.

   ONE RULE HOLDS THIS TOGETHER: this block computes no money. Every figure on
   screen — line amounts, chapter subtotals, base, tax, withholding, total,
   margin, the value of the lines still pending a price — is asked of
   erp.budgetTotals(), which is the same function the emitted document uses. The
   "live" recalculation is therefore genuinely live rather than an optimistic
   copy that drifts from the document by a cent and is discovered by a customer.

   Editing writes through erp.updateLine(), which refuses on a frozen, issued or
   accepted version. The grid disables its inputs in that case too, but the
   refusal is the engine's, not the view's. */
let bBudget=null, bChapter=null;
const bMoney=s=>{const n=Number(String(s).replace(",","."));return Number.isFinite(n)?Math.round(n*100):0;};
const bQty=s=>{const n=Number(String(s).replace(",","."));return Number.isFinite(n)?Math.round(n*1000):0;};
/** Line amount and margin, exactly as budgetTotals computes them. */
function bLineAmt(l){const q=l.subLines.length?l.subLines.reduce((a,s)=>a+Math.round(s.qtyMilli*(1+(s.wastePct||0)/100)),0):l.qtyMilli;
  return {qtyMilli:q, saleCents:l.lumpSum?l.priceCents:Math.round(q*l.priceCents/1000), costCents:l.lumpSum?l.costCents:Math.round(q*l.costCents/1000)};}
function bStatus(l){return l.pending?"pending":l.optionalLine?"optional":"normal";}

/* Blob-backed images are fetched once per session and the object URL kept.
   Revoking on every re-render would blank a thumbnail the user is still
   looking at, and the cache is bounded by the number of distinct pictures in
   the dataset, not by how often a view re-renders. */
const IMGURL=new Map();
async function imageUrl(key){
  if(IMGURL.has(key)) return IMGURL.get(key);
  try{ const b=await ErpStore.getBlob(key); if(!b) return null;
    const u=URL.createObjectURL(b); IMGURL.set(key,u); return u; }catch(e){ return null; }
}
function paintImages(root){
  (root||document).querySelectorAll('img[data-blob]').forEach(async im=>{
    const u=await imageUrl(im.dataset.blob); if(u) im.src=u; else im.alt="(imagen no disponible)";
  });
}

        <th class="num">P. coste</th><th class="num">P. venta</th><th class="num">Importe</th><th class="num">Margen</th>
        <th>Estado</th><th>Imágenes</th>${locked?"":"<th></th>"}
      </tr></thead><tbody id="bRows"></tbody></table></div></div>

    <div class="bside">
     <div class="card" style="margin:0 0 12px"><div class="ch"><h3>Totales</h3><span class="tag">en vivo</span></div>
       <div class="daylist" id="bTotals" style="padding:10px 14px"></div></div>
     <div class="card" style="margin:0 0 12px"><div class="ch"><h3>Anexo gráfico</h3></div>
       <div class="daylist" style="padding:10px 14px">
        <label class="opt"><input type="checkbox" id="bAnnexOn"${(b.annex&&b.annex.enabled)?" checked":""}> Incluir anexo en el documento</label>
        <label class="opt">Imágenes por página

        <div class="row mut" id="bAnnexCount"></div>
       </div></div>
     <div class="card" style="margin:0"><div class="daylist" style="padding:10px 14px;gap:8px">
       <button class="btn" id="bPreview">Vista del cliente</button>
       <button class="btn" id="bValidate">Validar</button>
      </div></div>
    </div>
   </div>`;

  $('#bBack').onclick=()=>go("presupuestos");
  const addChap=$('#bAddChap');
  if(addChap) addChap.onclick=()=>mutate(()=>{
    const name=prompt("Nombre del capítulo","Nuevo capítulo"); if(name==null)return;
    bChapter=erp.addChapter(id,{name:name||"Nuevo capítulo"}).id;
  },"Capítulo añadido");
  $('#bPreview').onclick=()=>budgetDrawer(id,vsel);
  $('#bValidate').onclick=()=>{
    const issues=erp.validateBudget(id);
    toast(issues.length?`${issues.filter(i=>i.level==="block").length} bloqueos · ${issues.filter(i=>i.level==="warn").length} avisos`:"Sin incidencias");
    builderIssues(id,issues);
  };
  $('#bAnnexOn').onchange=e=>mutate(()=>erp.setAnnexOptions(id,{enabled:e.target.checked}),
    e.target.checked?"Anexo gráfico activado":"Anexo gráfico desactivado");
  $('#bAnnexPer').onchange=e=>mutate(()=>erp.setAnnexOptions(id,{imagesPerPage:+e.target.value}),"Anexo actualizado");

  builderRows(id,vsel,locked,SECL);
  builderRecalc(id,vsel);

  /* One delegated listener for the whole grid. `input` fires on every
     keystroke — that is what makes the right-hand panel live — and writes
     straight through to the engine record, so the tree, the panel and the
     document can never disagree about what was typed. `change` fires once when
     the field is left, and that is the one the audit trail hears: a trail with
     an entry per character is a trail nobody reads. */
  if(!locked){
    const rows=$('#bRows');
    const write=(target,audit)=>{
      const f=target.dataset.f, lid=target.dataset.line; if(!f||!lid)return;
      const val=target.value;
      const patch=f==="qty"?{qtyMilli:bQty(val)}
        :f==="cost"?{costCents:bMoney(val)}
        :f==="price"?{priceCents:bMoney(val)}
        :f==="status"?{pending:val==="pending",optionalLine:val==="optional"}
        :{[f]:val};
      try{ erp.editLine(id,lid,patch,{audit,user:"backoffice"}); }
      catch(err){ toast("⚠ "+err.message); return; }
      builderRecalc(id,vsel,lid); persist();
    };
    rows.addEventListener('input',e=>write(e.target,false));
    rows.addEventListener('change',e=>write(e.target,true));
  }
}

/** Renders the grid body. Called once per builder render — never on keystroke,
    which would move the caret out from under the person typing. */
function builderRows(id,vsel,locked,SECL){
  const V=erp.version(id,vsel);
  const chapters=bChapter?V.chapters.filter(c=>c.id===bChapter):V.chapters;
  $('#bGridTag').textContent=bChapter?"capítulo seleccionado":`${V.chapters.length} capítulos`;

      ${locked?"":`<button class="btn sm" data-addline="${c.id}" style="margin-left:8px">+ partida</button>`}</td></tr>
    ${c.lines.map(l=>{const a=bLineAmt(l);const m=a.saleCents-a.costCents;
      return `<tr data-row="${l.id}">

      <td><input class="r" data-line="${l.id}" data-f="cost" type="number" step="0.01" value="${(l.costCents/100).toFixed(2)}"${locked?" disabled":""}></td>
      <td><input class="r" data-line="${l.id}" data-f="price" type="number" step="0.01" value="${(l.priceCents/100).toFixed(2)}"${locked?" disabled":""}></td>
      <td><span class="out" data-out="amt-${l.id}">${eur(a.saleCents)}</span></td>
      <td><span class="out${m<0?" neg":""}" data-out="mar-${l.id}">${eur(m)}</span></td>
      <td><select data-line="${l.id}" data-f="status"${locked?" disabled":""}>
        <option value="normal"${bStatus(l)==="normal"?" selected":""}>Normal</option>
        <option value="pending"${bStatus(l)==="pending"?" selected":""}>Pendiente</option>

      <td><button class="bimg${l.imageRefs.length?" has":""}" data-gal="${l.id}">🖼 ${l.imageRefs.length}</button></td>
      ${locked?"":`<td><button class="btn sm danger" data-delline="${l.id}">✕</button></td>`}
    </tr>`;}).join("")}`).join("")
    ||'<tr><td colspan="12"><div class="empty">Sin capítulos todavía.</div></td></tr>';

  $('#bRows').querySelectorAll('[data-gal]').forEach(btn=>btn.onclick=()=>lineImagesDrawer(id,btn.dataset.gal));
  $('#bRows').querySelectorAll('[data-addline]').forEach(btn=>btn.onclick=()=>mutate(()=>{
    erp.addLine(id,btn.dataset.addline,{desc:"Nueva partida",unit:"ud",qtyMilli:1000});
  },"Partida añadida"));

    erp.deleteLine(id,btn.dataset.delline,"backoffice");

/** The live half: tree totals, the edited row's own figures, and the panel. */
function builderRecalc(id,vsel,lineId){
  const b=erp.budget(id), V=erp.version(id,vsel), t=erp.budgetTotals(id,vsel);
  const byId={}; t.chapters.forEach(c=>{byId[c.id]=c;});

  $('#bTree').innerHTML=V.chapters.map(c=>{const ct=byId[c.id]||{saleCents:0};
    return `<div class="bc${bChapter===c.id?" on":""}" data-chap="${c.id}"><span>${c.num}. ${esc(c.name||"—")}</span><span class="amt">${eur0(ct.saleCents)}</span></div>
     ${c.lines.map(l=>{const a=bLineAmt(l);
       return `<div class="bl${l.pending?" pend":""}" data-line="${l.id}"><span>${l.num} ${esc(l.desc||"—")}</span><span class="amt">${l.pending?"pdte.":eur0(a.saleCents)}</span></div>`;}).join("")}`;
  }).join("")||'<div class="empty" style="padding:16px">Sin capítulos.</div>';
  $('#bTree').querySelectorAll('[data-chap]').forEach(d=>d.onclick=()=>{
    bChapter=bChapter===d.dataset.chap?null:d.dataset.chap; render();
  });

/* ---------- Gallery for one line (Improvement #1) ----------
   The pictures of a line are managed here and printed nowhere near it. Sources
   are the four the spec names: the catalogue item's own reference picture, a
   photo from the site visit, a file from this computer, and the phone camera
   (same input, `capture` set, which is what a mobile browser needs to open the
   camera instead of the file browser). Everything is compressed before it is
   stored. */
function lineImagesDrawer(budgetId,lineId){
  const b=erp.budget(budgetId), vsel=b.currentVersionId;
  const found=erp.findLine(budgetId,lineId,vsel); if(!found)return;
  const V=erp.version(budgetId,vsel);
  const locked=V.frozen||V.issued||b.acceptedVersionId===V.id;
  const l=found.line;
  const item=l.itemId?erp.state.catalogue.find(c=>c.id===l.itemId):null;
  const catImgs=(item&&item.imageRefs||[]).filter(r=>!l.imageRefs.some(x=>x.storageKey===(r.storageKey||r)));
  const visitPhotos=erp.state.visits.flatMap(x=>(x.photos||[]).map(p=>typeof p==="string"?p:p.storageKey)).filter(Boolean)
    .filter(p=>!l.imageRefs.some(x=>x.storageKey===p));
  const SRC={catalogue:"catálogo",visit:"visita",upload:"archivo",camera:"cámara"};

  const db=openDrawer(`Imágenes · ${l.num} ${l.desc||""}`);
  db.innerHTML=`
   <div class="card"><div class="ch"><h3>${l.imageRefs.length} imágenes</h3>
     <span class="tag">${b.annex&&b.annex.enabled?"el anexo está activo":"el anexo está desactivado"}</span></div>
    <div class="daylist"><div class="it">Las imágenes no se imprimen en la fila de la partida: se reúnen en el anexo gráfico al final del documento, con su capítulo, su número de partida y su descripción.</div></div>
    <div class="gal" style="padding:0 16px 14px">
     ${l.imageRefs.map((im,i)=>`<div class="gi" data-img="${im.id}">
       <img data-blob="${esc(im.storageKey)}" alt="">
       <div class="m">
        <input type="text" data-cap="${im.id}" value="${esc(im.caption)}" placeholder="Pie de imagen (opcional)"${locked?" disabled":""}>
        <div class="b">
         <label><input type="checkbox" data-int="${im.id}"${im.internal?" checked":""}${locked?" disabled":""}> Sólo uso interno</label>
         <span class="pill">${SRC[im.source]||im.source}</span>
         ${im.sizeBytes?`<span class="pill">${Math.round(im.sizeBytes/1024)} KB</span>`:""}
         <span style="flex:1"></span>
         ${locked?"":`<button class="btn sm" data-up="${im.id}"${i===0?" disabled":""}>↑</button>
         <button class="btn sm" data-down="${im.id}"${i===l.imageRefs.length-1?" disabled":""}>↓</button>
         <button class="btn sm danger" data-del="${im.id}">✕</button>`}
        </div>
       </div></div>`).join("")||'<div class="empty">Esta partida no tiene imágenes.</div>'}
    </div>
   </div>
   ${locked?'<div class="card"><div class="daylist"><div class="it">La versión está congelada: su anexo se conserva tal como se emitió.</div></div></div>':`
   <div class="card"><div class="ch"><h3>Añadir</h3></div><div class="daylist" style="gap:9px">
     <div class="it"><label class="btn sm">Desde el ordenador<input type="file" id="imgFile" accept="image/*" multiple hidden></label>
       <label class="btn sm">Cámara<input type="file" id="imgCam" accept="image/*" capture="environment" hidden></label></div>
     ${catImgs.length?`<div class="it"><button class="btn sm" id="imgCat">Imagen del catálogo (${catImgs.length})</button></div>`:""}
     ${visitPhotos.length?`<div class="it"><button class="btn sm" id="imgVisit">Foto de la visita (${visitPhotos.length})</button></div>`:""}
   </div></div>`}`;

  paintImages(db);
  if(locked)return;
  db.querySelectorAll('[data-cap]').forEach(inp=>inp.onchange=()=>mutate(()=>
    erp.updateLineImage(budgetId,lineId,inp.dataset.cap,{caption:inp.value}),"Pie actualizado"));
  db.querySelectorAll('[data-int]').forEach(cb=>cb.onchange=()=>mutate(()=>{
    erp.updateLineImage(budgetId,lineId,cb.dataset.int,{internal:cb.checked});
    lineImagesDrawer(budgetId,lineId);
  },cb.checked?"Imagen marcada como interna":"Imagen incluida en el anexo"));
  db.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>mutate(()=>{
    erp.moveLineImage(budgetId,lineId,x.dataset.up,-1); lineImagesDrawer(budgetId,lineId);},"Orden actualizado"));
  db.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>mutate(()=>{
    erp.moveLineImage(budgetId,lineId,x.dataset.down,1); lineImagesDrawer(budgetId,lineId);},"Orden actualizado"));
  db.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>mutate(()=>{
    erp.removeLineImage(budgetId,lineId,x.dataset.del); lineImagesDrawer(budgetId,lineId);},"Imagen eliminada"));

  const take=(input,source)=>{ if(!input)return;
    input.onchange=()=>storeLineImages(budgetId,lineId,[...input.files],source); };
  take($('#imgFile'),"upload"); take($('#imgCam'),"camera");
  const cat=$('#imgCat');
  if(cat) cat.onclick=()=>mutate(()=>{
    const r=catImgs[0]; erp.attachLineImage(budgetId,lineId,{storageKey:r.storageKey||r,source:"catalogue",caption:(item&&item.desc)||""},"backoffice");
    lineImagesDrawer(budgetId,lineId);
  },"Imagen del catálogo añadida");
  const vis=$('#imgVisit');
  if(vis) vis.onclick=()=>mutate(()=>{
    erp.attachLineImage(budgetId,lineId,{storageKey:visitPhotos[0],source:"visit"},"backoffice");
    lineImagesDrawer(budgetId,lineId);
  },"Foto de la visita añadida");
}

/** Compress → blob store → engine reference. Bytes never enter the state blob. */
async function storeLineImages(budgetId,lineId,files,source){
  if(!files.length)return;
  let added=0;
  for(const f of files){
    if(!/^image\//.test(f.type||"")){ toast("⚠ "+f.name+" no es una imagen"); continue; }
    try{
      const c=(typeof ErpBridge!=="undefined"&&ErpBridge.docs)
        ? await ErpBridge.docs.compressImage(f)
        : {blob:f,mime:f.type,width:0,height:0};
      const key="img_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
      await ErpStore.putBlob(key,c.blob);
      erp.attachLineImage(budgetId,lineId,{storageKey:key,source,mime:c.mime,
        sizeBytes:c.blob.size||0,width:c.width,height:c.height},"backoffice");
      added++;
    }catch(e){ toast("⚠ "+e.message); }
  }
  if(added){ persist(); render(); lineImagesDrawer(budgetId,lineId); toast(`${added} ${added===1?"imagen añadida":"imágenes añadidas"}`); }
}

    <td class="num">${eur0(e.currentRevenueCents)}</td><td class="num">${eur0(e.committedCents)}</td><td class="num">${eur0(e.actualCents)}</td>
    <td class="num" style="color:${e.marginForecastCents<0?'var(--danger)':'var(--greenDeep)'}">${eur0(e.marginForecastCents)}</td>
    <td>${p.closed?'<span class="pill g">Cerrado</span>':'<span class="pill b">Activo</span>'}</td></tr>`;}).join("")}
   </tbody></table></div></div>`;
  // Choosing a row also makes it the section's active project: picking a job
  // from a list and then finding another one selected above is the surprise
  // this avoids.
  v.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>{setProject(tr.dataset.id);projectDrawer(tr.dataset.id);});
  if(arg){const p=rows.find(x=>x.code===arg); if(p){setProject(p.id);projectDrawer(p.id);}}
 },

 /* ---------- Seguimiento técnico: la carta Gantt (§3.3 · §4.3) ---------- */
 seguimiento(v){
  $('#sub').textContent="Carta Gantt derivada del presupuesto aceptado, avance por partida o por cantidad ejecutada, y desviación frente a la línea base. Arrastra una barra para moverla, tira del borde para alargarla y une dos barras para crear una dependencia.";
  const P=erp.state.projects;
  if(!P.length){ v.innerHTML='<div class="card"><div class="empty">Todavía no hay proyectos que planificar.</div></div>'; return; }
  const B=ganttApi();
  if(!B){ v.innerHTML='<div class="card"><div class="empty">La planificación necesita el módulo de capacidades, que no se ha cargado. Recarga la página.</div></div>'; return; }

  const pid=gProject, plan=B.get(erp.state,pid), sch=B.schedule(plan);
  const cmp=gBaseline?B.compareToBaseline(plan):null;
  const pays=ErpBridge.scheduling.paymentMilestones(erp,pid);
  const cal=plan.calendar||B.defaultCalendar();
  const crit=sch?sch.criticalPath.length:0;
  /* Every figure in the deviations panel and both curves come from
     @repo/capability-scheduling. This view draws them and computes none. */
  const curve=B.curve(plan,{asOf:erp.today,weights:planWeights(pid,plan)});
  const risk=B.risk(plan,{asOf:erp.today,thresholdDays:5});

  v.innerHTML=`<div class="trk"><div>
   <div class="card"><div class="gtools">
     <button class="btn sm" id="gAdd">＋ Tarea</button>
     <button class="btn sm" id="gAddMs">◆ Hito</button>
     <button class="btn sm${plan.tasks.length?"":" primary"}" id="gDerive" title="Vuelve a derivar la planificación de los capítulos y partidas del presupuesto aceptado, conservando el avance registrado">↻ Derivar del presupuesto</button>
     <span style="flex:1"></span>
     ${sch&&plan.tasks.length?`<span class="chip">Fin de obra <b>${fmtD(sch.finish)}</b></span>
     <span class="chip">Ruta crítica <b>${crit}</b> de ${plan.tasks.length}</span>`:""}
     ${cmp?`<span class="chip" title="Desvío frente a la línea base, en días laborables">Línea base «${esc(cmp.label)}» <b style="color:${cmp.finishDriftDays>0?'var(--danger)':'var(--greenDeep)'}">${cmp.finishDriftDays>0?"+":""}${cmp.finishDriftDays} d</b></span>`:""}
     <select class="inline" id="gZoom">${[[14,"Mes"],[24,"Semanas"],[38,"Días"]].map(([z,l])=>`<option value="${z}"${gZoom===z?" selected":""}>${l}</option>`).join("")}</select>
     ${plan.baselines&&plan.baselines.length?`<button class="btn sm${gBaseline?" primary":""}" id="gBl">Línea base</button>`:""}
     <button class="btn sm" id="gFreeze" title="Congelar la planificación actual como referencia">❄ Congelar</button>
   </div>
   ${plan.tasks.length?ganttChart(plan,sch,cmp,pays):`<div class="empty">Sin planificación. «Derivar del presupuesto» la construye a partir de los capítulos y partidas aceptados: la duración de cada capítulo sale de sus cantidades y del rendimiento diario del oficio.</div>`}
   <div class="glegend">
     <span><i style="background:var(--green)"></i>Tarea</span>
     <span><i style="background:var(--danger)"></i>Ruta crítica — un día perdido aquí es un día perdido en la obra</span>
     <span><i style="background:var(--greenDeep);border-radius:2px;transform:rotate(45deg)"></i>Hito</span>
     <span><i style="background:var(--blue)"></i>Hito de cobro del contrato</span>
     ${cmp?`<span><i style="background:transparent;border:1px dashed var(--faint)"></i>Línea base congelada</span>`:""}
     <span><i style="background:var(--hair)"></i>Día no laborable</span>
   </div>
   <div class="gtools" style="border-top:1px solid var(--hair)">
     <span style="font:600 11px var(--sans);color:var(--muted)">DÍAS NO LABORABLES</span>
     ${(cal.nonWorkingDates||[]).map(d=>`<span class="chip"><b>${fmtD(d)}</b><button data-nw="${d}" title="Quitar">✕</button></span>`).join("")||'<span class="chip">ninguno</span>'}
     <input class="dt" type="date" id="gNw"><button class="btn sm" id="gNwAdd">Añadir</button>
     <span style="font-size:11.5px;color:var(--muted)">Semana laboral: ${cal.workingWeekdays.length} días</span>
   </div></div>

   ${curve?`<div class="card"><div class="ch"><h3>Curva S</h3>
     <span class="tag">planificado ${curve.plannedPct}% · real ${curve.actualPct}% · ${curve.driftPct>=0?"+":""}${curve.driftPct} pts</span></div>
     ${curveChart(curve)}
     <div class="glegend">
       <span><i style="background:var(--faint)"></i>Planificado</span>
       <span><i style="background:var(--green)"></i>Real registrado</span>
       <span><i style="background:var(--spark)"></i>Proyectado al ritmo observado${curve.performanceIndex!=null?` (×${curve.performanceIndex})`:""}</span>
       <span>Fin previsto ${fmtD(curve.plannedFinish)} → proyectado <b>${fmtD(curve.projectedFinish)}</b></span>
     </div></div>`:""}

   ${progressTable(pid,plan)}
  </div>

  <div class="bside">
   <div class="card" style="margin:0"><div class="ch"><h3>Desviaciones</h3>
     ${risk&&risk.overThreshold?'<span class="pill r">Supera el umbral</span>':''}</div>
    <div class="daylist" style="padding:10px 14px">
     ${risk?`<div class="row" style="display:flex;justify-content:space-between"><span>Retraso sobre línea base</span><b style="color:${risk.delayDays>0?'var(--danger)':'var(--greenDeep)'}">${risk.delayDays>0?"+":""}${risk.delayDays} d</b></div>
      <div class="row" style="display:flex;justify-content:space-between"><span>Tareas críticas en riesgo</span><b>${risk.criticalAtRisk}</b></div>
      ${risk.baselineFinish?`<div class="row" style="display:flex;justify-content:space-between;color:var(--muted)"><span>Prometido</span><b>${fmtD(risk.baselineFinish)}</b></div>`:'<div class="row" style="color:var(--muted)">Sin línea base congelada: no hay promesa contra la que medir.</div>'}`
      :'<div class="row" style="color:var(--muted)">Sin planificación.</div>'}
    </div>
    ${risk&&risk.items.length?`<div style="padding:0 14px 12px">
      ${risk.items.slice(0,12).map(i=>`<div class="riskitem">
        <span class="pill ${i.kind==="overdue"?"r":i.kind==="not_started"?"y":"b"}">${({overdue:"Vencida",not_started:"Sin empezar",behind:"Retrasada"})[i.kind]}</span>
        <span class="t">${esc(i.title)}${i.critical?' <span class="pill r">crítica</span>':""}</span>
        <b>${i.kind==="behind"?`${i.actualPct}/${i.plannedPct}%`:`${i.days} d`}</b></div>`).join("")}
      ${risk.items.length>12?`<div class="riskitem" style="color:var(--muted)">…y ${risk.items.length-12} más</div>`:""}
     </div>`:risk?'<div class="daylist" style="padding:0 14px 12px"><div class="it">Nada fuera de plazo.</div></div>':''}
   </div>
  </div></div>`;

  $('#gZoom').onchange=e=>{gZoom=+e.target.value;render();};
  const bl=$('#gBl'); if(bl) bl.onclick=()=>{gBaseline=!gBaseline;render();};
  $('#gAdd').onclick=()=>ganttNewTask(pid,false);
  $('#gAddMs').onclick=()=>ganttNewTask(pid,true);
  $('#gDerive').onclick=()=>deriveFromBudget(pid,cal);
  $('#gFreeze').onclick=()=>ganttFreeze(pid,plan);
  $('#gNwAdd').onclick=()=>{
    const d=$('#gNw').value; if(!d)return;
    ganttCommit(pid,B.setCalendar(plan,{...cal,nonWorkingDates:[...new Set([...(cal.nonWorkingDates||[]),d])].sort()}),"Día no laborable añadido");
  };
  v.querySelectorAll('[data-nw]').forEach(b=>b.onclick=()=>{
    ganttCommit(pid,B.setCalendar(plan,{...cal,nonWorkingDates:(cal.nonWorkingDates||[]).filter(x=>x!==b.dataset.nw)}),"Día no laborable quitado");
  });
  wireProgressTable(pid,plan);
  ganttWire(v,pid,plan,sch);
 },

     <td>${r.outstandingCents>0?`<button class="btn sm" data-collect="${r.number}">Registrar cobro</button>`:""}</td></tr>`;}).join("")}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Recibos emitidos</h3></div><div class="scroll"><table><tbody>
   ${erp.state.receipts.map(r=>`<tr><td class="k">${r.number}</td><td>${esc(erp.party(r.partyId).name)}</td><td class="num">${eur(r.amountCents)}</td><td>${r.method==="cash"?"Efectivo":"Transferencia"}</td><td>${fmtD(r.date)}</td></tr>`).join("")||'<tr><td><div class="empty">Sin recibos.</div></td></tr>'}

 /* ---------- Gestoría (GES, spec §5.6) ----------
    Rebuilt in session 11 around one idea: the screen must be able to say NO.
    Before, "Generar y registrar envío" always worked and the exception list
    was decoration next to it — which is precisely how a quarter goes out with
    four suppliers missing a NIF. Now the engine refuses, and the only way past
    is to justify each exception by name, so the button and the list finally
    mean the same thing. The completeness blocks above them answer the
    question people actually ask at quarter end ("is anything missing?")
    per block rather than as one aggregate number, because the blocks fail
    independently and an aggregate hides which one. */
 gestoria(v){
  $('#sub').textContent="Ocho bloques de completitud, la lista de excepciones que bloquea el envío hasta justificarla, y el registro de lo enviado con fecha y destinatario.";
  // The quarter buttons stay; the default follows the global period selector
  // whenever that is expressed in quarters, so the two never contradict.
  const q=window._q||(PERIOD.mode==="quarter"?ErpEngine.quarterOf(periodRange().from):"2026-Q1");
  const inQ=d=>ErpEngine.quarterOf(d)===q;
  const vat=erp.vatSummary(q), irpf=erp.irpfSummary(q);
  const blocks=erp.packageBlocks(q), exs=erp.exceptionsWithStatus(q);
  const open=exs.filter(x=>!x.accepted), late=erp.lateDocuments(q), assets=erp.fixedAssetRegister(q);
  const sent=erp.state.packagesSent.filter(s=>s.quarter===q);
  const queries=(erp.state.gestoriaQueries||[]).filter(x=>x.quarter===q);
  const ready=open.length===0;
  v.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap">
    ${["2026-Q1","2026-Q2","2026-Q3","2026-Q4"].map(x=>`<button class="btn sm ${x===q?'primary':''}" data-q="${x}">${x.replace("2026-","T")}</button>`).join("")}
    <span style="flex:1"></span>
    ${sent.length?`<button class="btn sm" id="bReopen">Reabrir trimestre</button>`:""}
    <button class="btn sm" id="bQuery">Consulta a gestoría</button>
    <button class="btn primary sm" id="bSend" ${ready?"":'disabled title="Hay excepciones sin justificar"'}>📦 Generar y registrar envío</button></div>
   ${ready?"":`<div class="card" style="border-color:var(--danger);margin-bottom:12px"><div class="queuebar">
     <span class="n" style="color:var(--danger)">${open.length}</span> excepción${open.length===1?"":"es"} sin justificar bloquean el envío del ${q}.
     <span style="flex:1"></span><span class="tag">justifica cada una abajo, o corrígela en su pantalla</span></div></div>`}
   <div class="card"><div class="ch"><h3>Completitud del paquete</h3><span class="tag">${blocks.filter(b=>b.sev==="g").length}/${blocks.length} bloques en verde</span></div>
    <div style="padding:12px 14px"><div class="blocks">
    ${blocks.map(b=>`<div class="blk ${b.sev}"><div class="lab">${esc(b.label)}</div><div class="n">${b.count}</div>
      <div class="sub">${eur0(b.amountCents)}${b.issues?` · <b>${b.issues} incidencia${b.issues===1?"":"s"}</b>`:""}</div></div>`).join("")}
    </div></div></div>
   <div class="kpis">
    <div class="kpi ${vat.netCents>0?'warn':''}"><div class="lab">IVA neto (303)</div><div class="val">${eur0(vat.netCents)}</div><div class="sub">repercutido ${eur0(vat.outputVatCents)} − soportado ${eur0(vat.inputVatCents)}</div></div>
    <div class="kpi"><div class="lab">IRPF retenido (111)</div><div class="val">${eur0(irpf.retainedCents)}</div><div class="sub">a autónomos y profesionales</div></div>
    <div class="kpi"><div class="lab">Extemporáneos</div><div class="val">${late.length}</div><div class="sub">${late.filter(l=>l.alreadySent).length} ya declarados antes</div></div>
    <div class="kpi"><div class="lab">Consultas abiertas</div><div class="val">${queries.filter(x=>!x.resolvedAt).length}</div><div class="sub">de ${queries.length} en el trimestre</div></div>
   </div>
   <div class="card"><div class="ch"><h3>Excepciones antes de enviar</h3><span class="tag">${exs.length===0?"✓ limpio":`${open.length} pendientes · ${exs.length-open.length} justificadas`}</span></div>
    ${exs.length?exs.map(x=>`<div class="exrow">
      <div><span class="pill ${x.accepted?'g':'r'}">${x.accepted?"Justificada":"Pendiente"}</span></div>
      <div><b>${esc(x.label)}</b> ${esc(x.ref)}${x.accepted?`<div class="why">${esc(x.accepted.reason)} — ${esc(x.accepted.by)}, ${fmtD(x.accepted.at)}</div>`:""}</div>
      <div>${x.accepted?"":`<button class="btn sm" data-acc="${esc(x.key)}">Justificar</button>`}</div></div>`).join("")
     :'<div class="empty">Sin excepciones: el paquete puede enviarse tal cual.</div>'}
   </div>
   <div class="card"><div class="ch"><h3>IVA por tipo</h3><span class="tag">conciliado con los registros</span></div><div class="scroll"><table><thead><tr><th>Tipo</th><th class="num">Base repercutida</th><th class="num">IVA repercutido</th><th class="num">Base soportada</th><th class="num">IVA soportado</th></tr></thead><tbody>
   ${Object.entries(vat.byRate).map(([bp,r])=>`<tr><td class="k">${bp/100}%</td><td class="num">${eur(r.outputBaseCents)}</td><td class="num">${eur(r.outputVatCents)}</td><td class="num">${eur(r.inputBaseCents)}</td><td class="num">${eur(r.inputVatCents)}</td></tr>`).join("")}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Activos, vehículos y renting</h3><span class="tag">fuera del coste de obra</span></div><div class="scroll"><table><tbody>
   ${assets.map(a=>`<tr><td class="k">${esc(a.number)}</td><td>${esc(a.supplier)}</td><td>${({fixedAsset:"Inmovilizado",renting:"Renting",vehicles:"Vehículos"})[a.category]}</td><td>${fmtD(a.date)}</td><td class="num">${eur(a.baseCents)}</td></tr>`).join("")||'<tr><td><div class="empty">Nada en este trimestre.</div></td></tr>'}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Documentos extemporáneos</h3><span class="tag">llegaron después de cerrar el trimestre</span></div><div class="scroll"><table><tbody>
   ${late.map(l=>`<tr><td class="k">${esc(l.stdName||l.id)}</td><td>${fmtD(l.confirmed.date)}</td><td class="num">${eur(l.confirmed.totalCents)}</td><td>capturado ${fmtD(l.capturedAt)}</td><td>${l.alreadySent?'<span class="pill b">Ya declarado</span>':'<span class="pill y">Nuevo</span>'}</td></tr>`).join("")||'<tr><td><div class="empty">Ninguno.</div></td></tr>'}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Consultas con la gestoría</h3></div><div class="scroll"><table><tbody>
   ${queries.map(x=>`<tr><td>${esc(x.question)}</td><td>${fmtD(x.raisedAt)}</td>
     <td>${x.resolvedAt?`<span class="pill g">Resuelta</span> ${esc(x.resolution)}`:'<span class="pill y">Abierta</span>'}</td>
     <td>${x.resolvedAt?"":`<button class="btn sm" data-rq="${x.id}">Responder</button>`}</td></tr>`).join("")||'<tr><td><div class="empty">Sin consultas.</div></td></tr>'}
   </tbody></table></div></div>
   <div class="card"><div class="ch"><h3>Envíos registrados</h3></div><div class="scroll"><table><tbody>
   ${erp.state.packagesSent.map(s=>`<tr><td class="k">${s.quarter}</td><td>${fmtD(s.date)}</td><td>${esc(s.recipient||"—")}</td>
     <td>${s.invoices} emitidas · ${s.bills} recibidas</td><td>${s.acceptedExceptions?`${s.acceptedExceptions} justificadas`:"sin excepciones"}</td>
     <td>${s.reopened?`<span class="pill y">Reabierto ${fmtD(s.reopened.reopenedAt)}</span> ${esc(s.reopened.reopenReason)}`:""}</td></tr>`).join("")||'<tr><td><div class="empty">Aún no se ha enviado ningún paquete.</div></td></tr>'}
   </tbody></table></div></div>`;
  v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{window._q=b.dataset.q;render();});
  // Justification is a free-text reason, required by the engine. Prompting for
  // it here rather than accepting a blank keeps the audit trail worth reading.
  v.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{
    const r=prompt("¿Por qué puede enviarse el paquete con esta excepción?");
    if(r===null)return;
    mutate(()=>erp.acceptException(q,b.dataset.acc,r,"backoffice"),"Excepción justificada");
  });
  v.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{
    const r=prompt("Respuesta de la gestoría:");
    if(r===null)return;
    mutate(()=>erp.resolveGestoriaQuery(b.dataset.rq,r,"backoffice"),"Consulta resuelta");
  });
  $('#bQuery').onclick=()=>{
    const t=prompt("¿Qué se pregunta a la gestoría sobre "+q+"?");
    if(t===null||!t.trim())return;
    mutate(()=>erp.addGestoriaQuery(q,t,"backoffice"),"Consulta registrada");
  };
  if($('#bReopen')) $('#bReopen').onclick=()=>{
    const r=prompt("Motivo para reabrir "+q+" (queda registrado):");
    if(r===null)return;
    mutate(()=>erp.reopenQuarter(q,r,"backoffice"),"Trimestre "+q+" reabierto");
  };
  $('#bSend').onclick=()=>{
    const to=prompt("¿A quién se envía el paquete "+q+"?","Gestoría Subirats");
    if(to===null)return;
    mutate(()=>erp.quarterlyPackage(q,{recipient:to},"backoffice"),"Paquete "+q+" generado y registrado");
  };
 },
};

/* =============================== drawers =============================== */
function openDrawer(title){ $('#dttl').textContent=title; $('#scrim').classList.add('on'); $('#drawer').classList.add('on'); return $('#dbody'); }

/* The three creations the global "+ Crear" offers. They call the engine's own
   entry points, so every validation (complete tax data before a project, a
   party that exists, the audit log entry) applies exactly as it does anywhere
   else — the bar is a shortcut to existing rules, never a way around them. */
function partyOptions(filter){
  return erp.state.parties.filter(p=>p.active&&filter(p)).map(p=>`<option value="${p.id}">${esc(p.name)} (${p.code})</option>`).join("");
}
function newOpportunityDrawer(){
  const db=openDrawer("Nueva oportunidad");
  db.innerHTML=`<div class="fgrid">
   <div class="field full"><label>Cliente *</label><select id="o_party">${partyOptions(p=>p.roles.includes("customer"))}</select></div>
   <div class="field full"><label>Trabajo solicitado *</label><input id="o_work" placeholder="Reforma integral de baño"></div>
   <div class="field"><label>Origen *</label><select id="o_src">${ErpEngine.LISTS.leadSources.map(s=>`<option>${s}</option>`).join("")}</select></div>
   <div class="field"><label>Valor estimado (€)</label><input id="o_val" type="number" min="0" step="100" value="0"></div>
   <div class="field full"><label>Próxima acción</label><input id="o_next" value="Programar visita"></div>
   <div class="field full" style="margin-top:8px"><button class="btn primary" id="o_save">Crear oportunidad</button></div></div>`;
  $('#o_save').onclick=()=>mutate(()=>{
    const work=$('#o_work').value.trim();
    if(!$('#o_party').value) throw new Error("Hace falta un cliente");
    if(!work) throw new Error("Describe el trabajo solicitado");
    erp.addOpportunity({partyId:$('#o_party').value,requestedWork:work,source:$('#o_src').value,
      expectedValue:Math.round((+$('#o_val').value||0)*100),nextAction:$('#o_next').value.trim()||"Programar visita"},"backoffice");
    closeDrawer(); go("oportunidades");
  },"Oportunidad creada");
}

}
