# Native flow — open the Project workspace, exercise pull-to-refresh, and try to
# drive the journey through the WKWebView. The web taps are best-effort
# (optional) because Maestro cannot always see WKWebView elements; the deep
# journey assertions run in tests/site-e2e (Playwright). Screenshots captured.
#
# Run locally:  maestro test ios/maestro/02-journey.yaml
appId: com.caneisubirats.erp
---
- launchApp:
    clearState: true

- tapOn: "Project"
- waitForAnimationToEnd
- assertNotVisible: "You're offline"
- takeScreenshot: journey-project

# Native pull-to-refresh gesture reloads the live page.
- swipe:
    direction: DOWN
    duration: 400
- waitForAnimationToEnd
- assertNotVisible: "You're offline"
- takeScreenshot: journey-refreshed

# Best-effort: drive the web journey if Maestro can see the buttons.
- tapOn:
    text: "Load sample.*"
    optional: true
- tapOn:
    text: "Start the journey.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: journey-after
