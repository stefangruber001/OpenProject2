# Native shell smoke test — launch, splash, tab navigation, and a native check
# that the web content actually loaded (not the offline screen). Screenshots of
# every tab are captured for visual review.
#
# Note: Maestro reads the native accessibility tree reliably (tab bar, SwiftUI
# text) but cannot consistently read text *inside* a WKWebView — so deep
# web-content assertions live in the Playwright harness (tests/site-e2e), and
# any web checks here are best-effort (optional).
#
# `clearState: true` is load-bearing now, not just hygiene: the Face ID gate
# (Security/BiometricLock.swift) arms itself after the first successful sign-in
# and stores that in UserDefaults. Clearing state means it is never armed, so no
# lock screen stands between this flow and the tab bar — a simulator has no
# biometrics to satisfy it with.
#
# Run locally:  maestro test ios/maestro/01-smoke.yaml
appId: com.caneisubirats.erp
---
- launchApp:
    clearState: true

# Native shell is up …
- assertVisible: "Canei Subirats"
# … and the web content loaded (the offline fallback is NOT showing).
- assertNotVisible: "You're offline"

# Native tab bar (VoiceOver labels from TabBar.swift).
- assertVisible: "Home"
- assertVisible: "Project"
- assertVisible: "Control Tower"
- assertVisible: "Guide"
- takeScreenshot: 01-home

# Best-effort web-content check (Maestro's WKWebView text reading is limited).
- assertVisible:
    text: "enquiry|renovation|five-star|thread"
    optional: true

# Walk the tabs; each should navigate without dropping to the offline screen.
- tapOn: "Project"
- waitForAnimationToEnd
- assertNotVisible: "You're offline"
- takeScreenshot: 02-project

- tapOn: "Control Tower"
- waitForAnimationToEnd
- assertNotVisible: "You're offline"
- takeScreenshot: 03-tower

- tapOn: "Guide"
- waitForAnimationToEnd
- assertNotVisible: "You're offline"
- takeScreenshot: 04-guide

- tapOn: "Home"
- assertVisible: "Canei Subirats"
- takeScreenshot: 05-home-again
