# XcodeGen spec — a guaranteed-valid way to (re)generate CaneiSubirats.xcodeproj.
#
# You normally do NOT need this: the repo already contains a ready-to-open
# CaneiSubirats.xcodeproj. Use this only if that project ever fails to open or
# you want to regenerate it cleanly:
#
#   brew install xcodegen        # once
#   cd ios && xcodegen generate  # rewrites CaneiSubirats.xcodeproj
#
# (Or just run ./setup.sh, which does the above for you.)

name: CaneiSubirats
options:
  bundleIdPrefix: com.caneisubirats
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # ← set your Apple Developer Team ID here (or in Xcode)

targets:
  CaneiSubirats:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CaneiSubirats
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caneisubirats.erp
        INFOPLIST_FILE: CaneiSubirats/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
    scheme:
      testTargets: []
      gatherCoverageData: false
