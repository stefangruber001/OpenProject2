# =============================================================================
# Production stack for the Canei ERP. Runs on the Hetzner VPS.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# PORTS: the app binds 127.0.0.1 ONLY. Nothing is published to the internet in
# any mode. Read that binding carefully before changing it:
#
#   "127.0.0.1:3000:3000"  loopback — reachable only from the machine itself,
#                          which is what makes `ssh -L 3000:localhost:3000`
#                          work. This is correct.
#   "3000:3000"            means 0.0.0.0 — the whole internet. The app has NO
#                          login of its own, so this publishes the customer's
#                          invoice register to anyone who scans the address.
#                          Never do this.
#
# The loopback binding exists because without it the SSH tunnel has nothing to
# connect to: the tunnel forwards to the server's localhost, and with no
# published port that is a closed door (ECONNRESET, which is how this was
# found). The Cloudflare path does not need it — cloudflared reaches app:3000
# over the compose network — but it is harmless there and keeps one file.
#
# Configuration comes from a `.env` file sitting next to this one. See
# `.env.production.example` for the full list.
# =============================================================================
name: canei-erp

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Deterministic collation, so index order cannot drift between a restore
      # and the original. Matters for a system holding an invoice register.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Read-only mount so the backup job can reach the socket without a password.
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # One-shot. Runs to completion, then exits — `docker compose up` waits for it
  # because the app depends on it completing successfully.
  migrate:
    image: ${IMAGE_MIGRATE}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy

  # One-shot, after migrate so the tables it grants on exist. Creates the role
  # the app connects as: a plain LOGIN role with DML only.
  #
  # This is not tidiness. POSTGRES_USER is a SUPERUSER, and Postgres lets
  # superusers bypass row-level security unconditionally — FORCE ROW LEVEL
  # SECURITY does not change that. An app connecting as the owner gets zero
  # isolation from the RLS policies, so the "defense in depth" in ADR-0007 is
  # only real once the app stops being the owner. The script proves it before
  # exiting 0.
  db-role:
    image: postgres:17
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    entrypoint: ["bash", "/harden-db-role.sh"]
    volumes:
      - ./ops/harden-db-role.sh:/harden-db-role.sh:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app:
    image: ${IMAGE_APP}
    restart: unless-stopped
    environment:
      # The restricted role — never POSTGRES_USER. See db-role above.
      DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NODE_ENV: production
      # Who gets stamped on every ERP change in the audit trail. Two modes, and
      # lib/session.ts refuses to write without one of them.
      #
      # SINGLE SEAT — no login, one named person, reachable only over a tunnel.
      ERP_OPERATOR: ${ERP_OPERATOR}
      # PUBLISHED — set BOTH of these and the signed-in email is used instead,
      # so several people are attributable individually. Setting only one is
      # refused rather than quietly falling back to the shared name above.
      # Team domain: <team>.cloudflareaccess.com. Audience: the Access app's AUD
      # tag. Empty here means single-seat; compose passes "" for an unset value,
      # and session.ts treats empty as absent.
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
    # Loopback only. See the note at the top of this file before touching it.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-role:
        condition: service_completed_successfully

  # Ingress, when Cloudflare is in use. Dials out and forwards to app:3000; no
  # inbound firewall rule exists for it, by design.
  #
  # It sits behind a PROFILE, so the default `up -d` starts a completely private
  # stack with no way in from the internet at all:
  #
  #   docker compose -f docker-compose.prod.yml up -d                      → private
  #   docker compose -f docker-compose.prod.yml --profile cloudflare up -d → published
  #
  # Private mode is the correct default while Cloudflare is undecided: the app
  # has NO authentication of its own, so anything that publishes it also
  # publishes the customer's data.
  tunnel:
    profiles: ["cloudflare"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  db-data:
