# Tenant: Diorka — internal project/group codename. Company #1's REAL identity
# is Canei Subirats, S.L. (confirmed from their first-party public website,
# 2026-07-16). Corporate identity captured in docs/clients/canei-subirats/BRAND.md;
# the branding block below is the machine-readable tokens (data, not a fork).
# REAL intake: intake/diorka/ (BRD 2026-07-17). Only the CIF (tax ID) remains a
# placeholder until the BRD §11.1 workshop — replacing it is config-only.
# Additional group entities become sibling tenants via `factory new-tenant`
# (group registry: tenants/_groups/diorka.yaml).
tenant: diorka
kernel: "^1"
capabilities:
  [
    quoting,
    billing,
    sourcing,
    messaging,
    projects,
    receivables,
    payables,
    crm,
    procurement,
    scheduling,
    time,
    docs,
    visits,
    access,
    catalogue,
    suppliers,
  ]
jurisdiction: es-ES@2026-07-17
vertical: construction/reformas
plugins: []

config:
  locale: es-ES
  currency: EUR
  branding:
    legalName: "Canei Subirats, S.L." # source: first-party (their website footer)
    tradeName: "Canei Subirats"
    slogan: "Renovations, simply complex." # EN working; CA handover: "Reformes senzillament complexes"
    contact:
      address: "Carrer de la Creu, 74, 08960 Sant Just Desvern, Barcelona"
      phone: "659 87 67 00"
      email: "hola@caneisubirats.com"
      web: "https://cane.gestortectic.com"
    # Design tokens — see docs/clients/canei-subirats/BRAND.md §5–7.
    palette:
      brandGreen: "#48733C" # primary
      brandGreenLt: "#65BC7B" # secondary / success
      brandYellow: "#F2C230" # accent (approx; refine from picto-groc SVG at handover)
      ink: "#000000"
      body: "#333333"
      muted: "#747474"
      line: "#D2D2D2"
      mist: "#E5E4E3"
      paper: "#FFFFFF"
    typography:
      display: "'Roboto Serif', Georgia, serif" # headings / document titles
      body: "Inter, Arial, Helvetica, sans-serif" # body / UI
    logo:
      wordmark: "logo-Caneisubirats-2.svg" # pending handover (INTEGRATIONS_PENDING)
      white: "logo-Caneisubirats_blanc-1.svg"
      mark: "picto-groc.png"

  billing:
    seller:
      name: "Canei Subirats, S.L." # source: first-party (their website footer)
      taxId: "B00000000" # source: pending-validation — real CIF at BRD §11.1 workshop
      address: "Carrer de la Creu, 74, 08960 Sant Just Desvern, Barcelona" # source: first-party
      countryCode: "ES"
    series:
      - { id: FAC, kind: standard, pad: 4, yearly: true }
      - { id: RECT, kind: rectificative, pad: 4, yearly: true }

  jurisdiction:
    verifactu:
      enabled: false # gate — LEGAL_REVIEW.md #1 (2027 deadline)

  vertical:
    # Vocabulary is language-keyed in the pack (terminologyByLang: en working,
    # es/ca for handover); the UI picks by UI_LANG. No per-tenant override here.
    materialsShareDefaultBp: 3500
    # chapters: uses the pack default seeded from BRD Appendix A.2

  # Email is auto-drafted from lifecycle events; the user presses Send once.
  # Templates are DATA (English working; es/ca before handover). No real send in
  # dev — a log-only outbox is bound (INTEGRATIONS_PENDING: real provider).
  messaging:
    from: "hola@caneisubirats.com"
    signature: "Canei Subirats — Renovations, simply complex."
    templates:
      - event: quote-sent
        subject: "Your renovation quote — {{project}}"
        body: |
          Dear {{client}},

          Thank you for trusting Canei Subirats with your project “{{project}}”.
          Please find attached our detailed quote for {{amount}}, broken down by
          chapter with clear measurements.

          You will have a single point of contact throughout, fixed deadlines and
          our 2-year guarantee on the works.

          Kind regards,
          {{signature}}
          {{from}}
      - event: acceptance
        subject: "Thank you — your project is confirmed ({{ref}})"
        body: |
          Dear {{client}},

          We are delighted to confirm your acceptance for “{{project}}”. Your
          project number is {{ref}}. We will schedule the works and keep you
          updated at each milestone.

          Kind regards,
          {{signature}}
      - event: invoice
        subject: "Invoice {{invoice}} — {{project}}"
        body: |
          Dear {{client}},

          Please find attached invoice {{invoice}} for the works on “{{project}}”.
          Total due: {{amount}}. Payment terms: 15 days.

          Kind regards,
          {{signature}}
      - event: reminder
        subject: "Friendly reminder — invoice for {{project}}"
        body: |
          Dear {{client}},

          Our records show invoice {{invoice}} for {{amount}} is now due. If you
          have already arranged payment, please disregard this note.

          Thank you very much,
          {{signature}}

  # Roles reflect the family split (BRD): administration (wife) runs the office,
  # operations (husband) runs the site. Data only — grant lists are the contract.
  access:
    roles:
      owner: ["*"]
      administration:
        [
          "crm.manage",
          "quote.issue",
          "invoice.issue",
          "receivable.record",
          "payable.record",
          "report.view",
        ]
      operations:
        ["visit.record", "time.log", "procurement.raise", "project.update", "schedule.manage"]

  # Work/material catalogue (data). Items carry a selling price and internal
  # cost (for margin); the room template expands into ready-made quote lines.
  catalogue:
    items:
      - {
          code: DEM-STRIP,
          name: "Strip tiling & remove rubble",
          chapter: "Demolition & preliminary works",
          unit: "m²",
          kind: labour,
          unitPriceCents: 1840,
          unitCostCents: 1100,
        }
      - {
          code: TILE-2060,
          name: "Ceramic wall tiling 20×60",
          chapter: "Coverings & finishes",
          unit: "m²",
          kind: material,
          unitPriceCents: 3200,
          unitCostCents: 2000,
        }
      - {
          code: FLOOR-PORC,
          name: "Porcelain flooring",
          chapter: "Coverings & finishes",
          unit: "m²",
          kind: material,
          unitPriceCents: 2890,
          unitCostCents: 1950,
        }
      - {
          code: PLUMB-BATH,
          name: "Full bathroom plumbing",
          chapter: "Plumbing",
          unit: "ud",
          unitPriceCents: 185000,
          unitCostCents: 140000,
        }
    templates:
      - name: "Standard bathroom"
        lines:
          - { itemCode: DEM-STRIP, qtyMillis: 12500 }
          - { itemCode: TILE-2060, qtyMillis: 24750 }
          - { itemCode: PLUMB-BATH, qtyMillis: 1000 }
