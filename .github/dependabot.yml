version: 2
updates:
  # JavaScript/TypeScript dependencies across the monorepo.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One grouped PR for routine updates keeps review noise low.
      dependencies:
        patterns: ["*"]

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
