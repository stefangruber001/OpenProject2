name: Deploy (build & publish images)

# Builds the two production images and pushes them to GHCR. It does NOT touch
# the server: the VPS pulls new images itself every 60s via canei-deploy.timer.
# That is deliberate — no SSH key in CI, no inbound port on the box, and a bad
# deploy is undone by re-tagging rather than by logging in somewhere.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "site/**" # bundled into the image: the engine and the workspace UI
      - "tenants/**" # copied into the image and read at request time
      - "ops/**" # harden-db-role.sh runs in the smoke job
      - "tests/server-e2e/**" # ditto
      - "Dockerfile"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # Both images share the build stage's layer cache, but publishing them
      # independently means a migrate-only change does not force an app redeploy.
      matrix:
        target: [runtime, migrate]
        include:
          - target: runtime
            image: app
          - target: migrate
            image: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          # ONLY the sha tag. The server follows `:main`, so publishing that tag
          # here would put the image into production the moment the build ends —
          # roughly three minutes before `smoke` finishes deciding whether it
          # works. It did exactly that: `smoke` sat red for a day with a broken
          # image name while every push shipped to the server anyway.
          #
          # `main` now moves in the `promote` job, which needs: smoke. A sha tag
          # is addressable but nothing follows it, so publishing it early is
          # harmless and is what lets `smoke` test the real artifact.
          tags: |
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* is inlined at build time, so the public URL has to be
          # known here rather than at run time.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  # Proves the image actually starts and reaches a database before the server
  # is allowed to pull it. Without this the first sign of a broken image would
  # be the app failing to come back up in production.
  #
  # This is a real gate only because `promote` needs it and the rolling tag is
  # published nowhere else. If you ever add `type=ref,event=branch` back to the
  # meta step above, this job goes back to being a post-mortem.
  smoke:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: canei
          POSTGRES_PASSWORD: canei
          POSTGRES_DB: canei_erp
        options: >-
          --health-cmd "pg_isready -U canei"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      # Needed for ops/harden-db-role.sh below — the images come from the
      # registry, but the role script is repo content.
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI repository names must be lowercase, and this repo has capitals in it
      # ("OpenProject2"). docker/metadata-action lowercases ${{ github.repository }}
      # for the push, so the images publish fine — but a bare `docker run` does
      # not, and rejects the reference before it ever contacts the registry:
      #
      #   invalid reference format: repository name (…/OpenProject2/…) must be lowercase
      #
      # That killed this job on every run for a day while `images` stayed green,
      # so unsmoked images shipped to the server regardless. Compute the name once.
      - name: Resolve the published image names
        run: echo "IMAGE_BASE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Apply migrations with the published migrate image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgresql://canei:canei@127.0.0.1:5432/canei_erp?schema=public" \
            "$IMAGE_BASE/migrate:sha-${{ github.sha }}"

      # Production does not run the app as the database owner — the owner is a
      # superuser and superusers bypass RLS. So the smoke test must not either,
      # or it proves the image works under privileges it will never have and
      # misses every missing GRANT.
      - name: Create the restricted application role
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: canei
          POSTGRES_USER: canei
          POSTGRES_DB: canei_erp
          APP_DB_USER: canei_app
          APP_DB_PASSWORD: canei_app
        run: bash ops/harden-db-role.sh

      - name: Start the published app image and check it serves
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL="postgresql://canei_app:canei_app@127.0.0.1:5432/canei_erp?schema=public" \
            -e ERP_OPERATOR="ci-smoke" \
            "$IMAGE_BASE/app:sha-${{ github.sha }}"
          for i in $(seq 1 40); do
            body=$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null) && break
            sleep 3
          done
          echo "$body"
          # Parsed, not grepped. Whether a route emits compact or indented JSON
          # is a detail of which helper it happens to use, and a check that
          # depends on it reports a healthy app as broken.
          echo "$body" | jq -e '.status == "ok" and .database == "connected"' >/dev/null \
            || { docker logs app; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:3000/  || { docker logs app; exit 1; }

      # /api/health passes even when tenant specs are unreachable, because it
      # only touches the database. The image once shipped without tenants/ and
      # without TENANTS_DIR: it built, started, reported healthy, and then
      # failed EVERY tenant request with "repo root not found". Health alone is
      # not proof the app works — exercise a real tenant route.
      - name: A tenant route must resolve its spec from inside the container
        run: |
          out=$(curl -fsS http://127.0.0.1:3000/api/reformas-demo/quotes) || { docker logs app; exit 1; }
          echo "$out"
          # This route goes through lib/api.ts's json() helper, which indents.
          # A grep for '"tenant":"reformas-demo"' can never match it, and spent
          # a run claiming the tenant specs were missing when the route was
          # returning 200 with the right body.
          echo "$out" | jq -e '.tenant == "reformas-demo"' >/dev/null || {
            echo "::error::Tenant spec not resolvable in the image — check TENANTS_DIR and the tenants/ COPY."
            docker logs app; exit 1; }

      # Exercises the ERP the way it is actually used: the workspace UI is
      # served, commands run, the whitelist holds, and a stale write is refused
      # rather than silently overwriting. Runs against the PUBLISHED image with
      # the RESTRICTED database role, so a missing GRANT or a `public/` left out
      # of the container fails here instead of on the server.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The ERP must work end to end inside the published image
        env:
          ERP_BASE_URL: http://127.0.0.1:3000
          ERP_TEST_TENANT: reformas-demo
        run: node tests/server-e2e/run.mjs || { docker logs app; exit 1; }

      # A SECOND CONTAINER, BEHIND A REAL LOGIN.
      #
      # The container above runs single-seat (`ERP_OPERATOR`), where there is
      # exactly one identity and it is an administrator. That is the shape the
      # pilot ships in, and it is worth smoking — but it cannot prove anything
      # about what a SITE WORKER is refused, because there is nobody to be.
      #
      # The site-worker boundary is not cosmetic: before it existed, an account
      # meant to type its own hours could PUT the whole document — the invoice
      # register included — and its state response carried every bank line. So
      # this starts a second copy of the SAME image with named accounts, on
      # another port, sharing the same database, and runs the suite against it.
      # With credentials present the suite signs in, creates a `site` account,
      # signs in as that account, and checks the four refusals and the redaction.
      #
      # ERP_DEFAULT_TENANT matters more than it looks. Accounts and invitations
      # belong to the DEPLOYMENT'S OWN company — `/api/auth/activate` has no
      # tenant in its path on purpose, because the person following an
      # invitation is not signed in yet, so it resolves `defaultTenant()`. Left
      # unset that is "diorka", while the suite creates its account under
      # `reformas-demo`: the invitation is filed in one company and looked up in
      # another, and the activation answers 400. Naming the company the suite
      # uses makes this container a coherent deployment rather than two halves
      # of different ones. See ASSUMPTIONS.md S74 — the same mismatch is
      # reachable by hand on a real server, and is its own change to fix.
      #
      # The hash format is auth.ts's (`scrypt$N$r$p$salt$key`, base64). It is
      # duplicated here rather than shared because generating one needs a
      # terminal — hash-password.mjs refuses a non-TTY on purpose, so a password
      # never lands in a shell history. If the format ever changes, the sign-in
      # below fails loudly on the first run rather than silently skipping.
      - name: Start a second copy behind named accounts
        run: |
          ADMIN_PW="smoke-$(openssl rand -hex 12)"
          HASH=$(node -e '
            const { randomBytes, scryptSync } = require("node:crypto");
            const salt = randomBytes(16);
            const key = scryptSync(process.argv[1], salt, 64, { N: 16384, r: 8, p: 1, maxmem: 67108864 });
            process.stdout.write(`scrypt$16384$8$1$${salt.toString("base64")}$${key.toString("base64")}`);
          ' "$ADMIN_PW")
          docker run -d --name app-auth --network host \
            -e PORT=3100 \
            -e DATABASE_URL="postgresql://canei_app:canei_app@127.0.0.1:5432/canei_erp?schema=public" \
            -e SESSION_SECRET="smoke-$(openssl rand -hex 16)" \
            -e ERP_USERS="smoke-admin@example.com:$HASH" \
            -e ERP_DEFAULT_TENANT="reformas-demo" \
            "$IMAGE_BASE/app:sha-${{ github.sha }}"
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:3100/api/health 2>/dev/null && break
            sleep 3
          done
          curl -fsS -o /dev/null http://127.0.0.1:3100/api/health || { docker logs app-auth; exit 1; }
          # The login page must be reachable without a session; everything else
          # must not be. Both directions, because a lock that lets everybody in
          # and a lock that lets nobody in fail the same test if you only run one.
          curl -fsS -o /dev/null http://127.0.0.1:3100/login || { docker logs app-auth; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/reformas-demo/erp/state)
          [ "$code" = "401" ] || { echo "::error::unauthenticated state read answered $code, expected 401"; docker logs app-auth; exit 1; }
          echo "ADMIN_PW=$ADMIN_PW" >> "$GITHUB_ENV"

      - name: A site worker must be refused what the office may do
        env:
          ERP_BASE_URL: http://127.0.0.1:3100
          ERP_TEST_TENANT: reformas-demo
          ERP_E2E_ADMIN: smoke-admin@example.com
        run: |
          ERP_E2E_ADMIN_PASSWORD="$ADMIN_PW" node tests/server-e2e/run.mjs \
            || { docker logs app-auth; exit 1; }

  # The actual release step: move the rolling `main` tag onto images that have
  # just been proven to boot, migrate, serve a tenant and pass the ERP suite.
  # The server pulls `:main` every 60s, so THIS job is the deploy — everything
  # above it is a build.
  #
  # `imagetools create` retags inside the registry by pointing a new tag at the
  # existing manifest. Nothing is pulled, nothing is rebuilt, so the bytes that
  # go to production are byte-identical to the bytes `smoke` tested. Rebuilding
  # here instead would ship an artifact no test had ever run against.
  promote:
    needs: smoke
    # `workflow_dispatch` can be fired from ANY branch, and without this guard a
    # manual run from a feature branch would build that branch and point `:main`
    # at it — a deploy to production from a branch nobody reviewed, one dropdown
    # away. Dispatching from a branch still builds and smokes it; it just does
    # not release it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      matrix:
        image: [app, migrate]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased for the same reason as in `smoke`: this repository has
      # capitals in its name and OCI rejects them outright.
      - name: Point :main at the tested image
        run: |
          BASE="${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.image }}"
          docker buildx imagetools create -t "$BASE:main" "$BASE:sha-${GITHUB_SHA}"
          echo "::notice::${{ matrix.image }} promoted — the server will pull it within 60s."

  # ---------------------------------------------------------------------------
  # Did it actually arrive?
  #
  # Everything above this job ends at the registry. `promote` retags `:main` and
  # the workflow goes green — and that is ALL green has ever meant here. The
  # server pulls on its own timer, and when it stops pulling nothing says so:
  # the ticks are green, the timer reports active, the container is healthy, and
  # the code answering is days old. That is not a hypothetical. Production spent
  # 25 hours on an image 19 commits behind `main` while six consecutive deploys
  # passed, and it was the operator who noticed, not this pipeline.
  #
  # `/api/health` has reported the commit it was built from since the last time
  # this happened. The probe was there; nothing read it. So this job reads it,
  # and a server that has stopped following `main` turns the commit that exposed
  # it red within a few minutes instead of hiding until somebody complains.
  #
  # It never blocks a release: `promote` has already happened by the time this
  # runs. A red `verify` over a green `promote` says exactly the right thing —
  # the image is good and the box did not take it.
  verify:
    needs: promote
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: The revision answering must be the one just built
        env:
          # Required. An unset variable FAILS this job — see the run below.
          APP_URL: ${{ vars.APP_URL }}
          # Set this repository variable to `true` while the server is
          # deliberately pinned to an older image (see docs/HANDOVER-OPS.md).
          # A rollback is a decision; this is where it gets declared, so that a
          # frozen box is a thing somebody chose rather than a thing nobody
          # noticed. Unset it when you put `:main` back.
          PINNED: ${{ vars.DEPLOY_PINNED }}
        run: |
          set -uo pipefail
          # THIS USED TO WARN AND PASS, AND THE FIRST RUN PROVED WHY IT MUST NOT.
          # `vars.APP_URL` was never set, so the very first `verify` — written to
          # catch a green pipeline over a stale server — exited 0 in under a
          # second having checked nothing, and reported success. A gate that
          # cannot see its subject must say so in the only way a pipeline
          # communicates: by failing. «I could not look» and «I looked and it is
          # fine» are the same colour otherwise, which is the whole bug.
          if [ -z "${APP_URL}" ]; then
            echo "::error::APP_URL is not set, so nothing here checked what production is running."
            echo "Set it under Settings → Secrets and variables → Actions → Variables,"
            echo "as the public address of the server, e.g. https://<host>"
            echo "It is the same variable NEXT_PUBLIC_APP_URL is built from (see the images job),"
            echo "which is also empty in every image built while it was unset."
            exit 1
          fi
          if [ "${PINNED}" = "true" ]; then
            echo "::warning::DEPLOY_PINNED is set — the server is deliberately not following :main."
            exit 0
          fi

          # The timer pulls every 60s and the container needs a moment to come
          # up, so give it a few minutes before calling it stuck.
          for i in $(seq 1 20); do
            BODY="$(curl -fsS --max-time 15 "${APP_URL%/}/api/health" || true)"
            GOT="$(printf '%s' "$BODY" | sed -n 's/.*"revision"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            if [ "$GOT" = "${GITHUB_SHA}" ]; then
              echo "::notice::production is serving ${GITHUB_SHA} — the deploy arrived."
              exit 0
            fi
            echo "attempt ${i}/20: production reports '${GOT:-no answer}'"
            sleep 15
          done

          echo "::error::production is still serving '${GOT:-no answer}', not ${GITHUB_SHA}."
          echo "The image is published and tested; the server has not taken it."
          echo "On the box:  systemctl status canei-deploy.service"
          echo "             journalctl -u canei-deploy.service -n 50 --no-pager"
          echo "             grep IMAGE_ /opt/canei-erp/.env   # must end :main"
          echo "Or from a checkout with ops/provision.conf:  ./ops/deploy-now.sh"
          exit 1
