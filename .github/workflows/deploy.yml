name: Deploy (build & publish images)

# Builds the two production images and pushes them to GHCR. It does NOT touch
# the server: the VPS pulls new images itself every 60s via canei-deploy.timer.
# That is deliberate — no SSH key in CI, no inbound port on the box, and a bad
# deploy is undone by re-tagging rather than by logging in somewhere.

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "Dockerfile"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # Both images share the build stage's layer cache, but publishing them
      # independently means a migrate-only change does not force an app redeploy.
      matrix:
        target: [runtime, migrate]
        include:
          - target: runtime
            image: app
          - target: migrate
            image: migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          # `main` is the rolling tag the server follows; the sha tag is what
          # you pin to in .env when rolling back.
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* is inlined at build time, so the public URL has to be
          # known here rather than at run time.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.APP_URL }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  # Proves the image actually starts and reaches a database before the server
  # is allowed to pull it. Without this the first sign of a broken image would
  # be the app failing to come back up in production.
  smoke:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: canei
          POSTGRES_PASSWORD: canei
          POSTGRES_DB: canei_erp
        options: >-
          --health-cmd "pg_isready -U canei"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply migrations with the published migrate image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgresql://canei:canei@127.0.0.1:5432/canei_erp?schema=public" \
            ${{ env.REGISTRY }}/${{ github.repository }}/migrate:sha-${{ github.sha }}

      - name: Start the published app image and check it serves
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL="postgresql://canei:canei@127.0.0.1:5432/canei_erp?schema=public" \
            ${{ env.REGISTRY }}/${{ github.repository }}/app:sha-${{ github.sha }}
          for i in $(seq 1 40); do
            body=$(curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null) && break
            sleep 3
          done
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'        || { docker logs app; exit 1; }
          echo "$body" | grep -q '"database":"connected"' || { docker logs app; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:3000/  || { docker logs app; exit 1; }
