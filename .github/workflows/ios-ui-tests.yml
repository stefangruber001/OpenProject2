name: iOS UI tests (Maestro)

# Autonomous native UI testing of the app on the iOS Simulator: builds the app
# (no signing needed for the simulator), boots a simulator, installs the app,
# and runs the Maestro flows in ios/maestro (launch, tab navigation, and driving
# the customer journey through the WKWebView).
#
# Manual trigger only, so it never fires on ordinary pushes or emails failures.

on:
  workflow_dispatch:

jobs:
  ui:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app for the simulator (no code signing)
        run: |
          xcodebuild \
            -project CaneiSubirats.xcodeproj \
            -scheme CaneiSubirats \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO build

      - name: Boot an iPhone simulator
        run: |
          # Pick the newest available iPhone on an installed iOS runtime.
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); c=[x for k,v in d['devices'].items() if 'iOS' in k for x in v if 'iPhone' in x['name']]; print(c[-1]['udid'] if c else '')")
          test -n "$UDID" || { echo 'no iPhone simulator available'; xcrun simctl list devices available; exit 1; }
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          open -a Simulator || true
          # Bounded poll for the Booted state (never hangs the job).
          for i in $(seq 1 60); do
            if xcrun simctl list devices | grep "$UDID" | grep -q "Booted"; then echo "simulator booted"; break; fi
            sleep 3
          done
          xcrun simctl list devices | grep "$UDID" || true

      - name: Install the app on the simulator
        run: |
          APP=$(find build-sim/Build/Products -name 'CaneiSubirats.app' -type d | head -1)
          echo "Installing $APP"
          xcrun simctl install "$SIM_UDID" "$APP"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        run: maestro --device "$SIM_UDID" test maestro --format junit --output ../maestro-report.xml

      - name: Upload Maestro report + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: |
            maestro-report.xml
            ~/.maestro/tests/**/*.png
          if-no-files-found: ignore
