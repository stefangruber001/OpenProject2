name: Android → Google Play

# Push-button publishing: run this workflow, and the signed app bundle is
# built and uploaded straight to the chosen Google Play track. All that is
# left is pressing "Publish"/"Promote" in the Play Console.
#
# Required repository secrets (see PLAY-SETUP.md for the one-time setup):
#   ANDROID_KEYSTORE_BASE64    upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (usually "upload")
#   ANDROID_KEY_PASSWORD       key password
#   PLAY_SERVICE_ACCOUNT_JSON  Google Cloud service-account JSON with Play access
# Without secrets the workflow still builds a debug-signed bundle as an
# artifact so the pipeline can be tested end to end.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Detect signing/publishing secrets
        id: cfg
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "signed=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "play=$([ -n "$SA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        if: steps.cfg.outputs.signed == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.cfg.outputs.signed == 'true' && format('{0}/upload.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:bundleRelease

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: canei-subirats-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play (${{ inputs.track }})
        if: steps.cfg.outputs.play == 'true' && steps.cfg.outputs.signed == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.caneisubirats.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Publishing summary
        env:
          SIGNED: ${{ steps.cfg.outputs.signed }}
          PLAY: ${{ steps.cfg.outputs.play }}
        run: |
          {
            echo "## Android build"
            echo "- Signed with upload key: $SIGNED"
            if [ "$PLAY" = "true" ] && [ "$SIGNED" = "true" ]; then
              echo "- Uploaded to Play track: ${{ inputs.track }} — press Publish/Promote in the Play Console."
            else
              echo "- Play upload skipped (secrets missing) — see PLAY-SETUP.md; the .aab artifact above can be uploaded manually."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
