name: Deploy site + dev preview (GitHub Pages)

# Publishes TWO copies of the site in one Pages deployment:
#   • main            → site root      (production)
#   • the dev branch  → /preview/      (development preview)
# Runs whenever EITHER branch changes, and rebuilds both from scratch each time,
# so production and the preview are always current no matter which side pushed.
# Both you and a collaborator can iterate on the dev branch and watch /preview/;
# once aligned, merge the dev branch into main and the root updates.

on:
  push:
    # Deploy runs only from main — the github-pages environment rejects other
    # branches. Dev-branch pushes refresh the preview via preview-refresh.yml,
    # which dispatches THIS workflow on main; the deploy always rebuilds /preview
    # from the dev branch by name, so it picks up the latest dev content.
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # The warning stamped onto every published page, and the script that does
      # it. Without these, editing the warning changes nothing that is served.
      - ".github/pages-warning.html"
      - ".github/scripts/stamp-pages-warning.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The branch published under /preview.
  #
  # Sessions 1-3 ran on claude/orin-project-status-1q50dt; session 4 moved the
  # programme to the branch below and this value did NOT move with it, so
  # /preview quietly kept serving session-3 content for the whole of sessions
  # 4-12. Nothing failed and nothing was red — the preview was simply built
  # from a branch nobody was committing to any more, which is exactly the kind
  # of drift that only shows up when somebody opens the link expecting to
  # review the latest work. If the programme branch changes again, change it
  # here in the SAME commit.
  DEV_BRANCH: claude/candi-programme-session-4-07amo8

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV_BRANCH }}
          path: dev

      - name: Assemble site (main at root, dev under /preview)
        env:
          # The only address where the company's data actually lives. Everything
          # this job publishes is a read-only copy pointing back at it.
          LIVE_URL: https://178-105-10-156.sslip.io
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R prod/site/. _site/
          mkdir -p _site/preview
          cp -R dev/site/. _site/preview/

          # Mark EVERY published page as not-the-live-system. Both copies, not
          # just the preview: the root is equally a static copy with no database
          # behind it, and it is the one that looks most like the real thing.
          #
          # This replaces a `perl -0pi -e 's{</body>}{...}'` one-liner that
          # missed three of eleven pages in silence and injected its banner into
          # journey.html's generated emails instead of onto the page. See the
          # header of the script for the full account.
          # ORDER MATTERS. The script recurses, so `_site` also reaches
          # `_site/preview`. Stamping the preview FIRST and relying on the
          # script's idempotence (it skips a file that already carries the
          # warning) is what gives each copy its own wording. Reversed, the
          # root's pass would claim the preview is the public demo copy.
          python3 prod/.github/scripts/stamp-pages-warning.py \
            _site/preview "una vista previa de desarrollo" "a development preview" "$LIVE_URL"
          python3 prod/.github/scripts/stamp-pages-warning.py \
            _site "la copia pública de demostración" "the public demonstration copy" "$LIVE_URL"

          # Assert rather than trust. The step above prints a count; this proves
          # the warning is actually IN the files that will be uploaded, so a
          # future refactor cannot quietly go back to publishing an unmarked
          # copy of a customer's ERP.
          total=$(find _site -name '*.html' | wc -l)
          marked=$(grep -rl 'canei-not-live-bar' _site --include='*.html' | wc -l)
          echo "warning present on ${marked}/${total} pages"
          [ "$marked" = "$total" ] || { echo "::error::${total} pages published, only ${marked} carry the warning"; exit 1; }

          echo "Assembled root=$(ls _site | wc -l) entries; preview=$(ls _site/preview | wc -l) entries."

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
