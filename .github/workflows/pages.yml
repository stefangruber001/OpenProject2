name: Deploy site (GitHub Pages)

# Publishes ONE copy of the site: main, at the root.
#
# There used to be a second, under /preview/, built from a long-lived dev branch
# named by hand in this file. It is gone, and the reason is worth keeping: the
# branch name here and the trigger in preview-refresh.yml had to be changed
# together, they were not, and /preview quietly served nine-session-old content
# while nothing failed and nothing went red. It was noticed only when somebody
# opened the link expecting recent work.
#
# By the end the preview had no consumer at all — the iOS and Android shells
# had already been moved to the live server — and the branch it tracked was
# byte-identical to main. A second publishing target that nobody reads and that
# can silently disagree with the trunk is a liability, not a safety net.
#
# Work now happens on short-lived branches merged into main the same day. If a
# look-before-live step is ever wanted again, the replacement is a pull request
# with the built pages attached, not a branch name written into a workflow.

on:
  push:
    # Deploy runs only from main — the github-pages environment rejects other
    # branches, and main is now the only thing published.
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      # The warning stamped onto every published page, and the script that does
      # it. Without these, editing the warning changes nothing that is served.
      - ".github/pages-warning.html"
      - ".github/scripts/stamp-pages-warning.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v7
        with:
          ref: main
          path: prod

      - name: Assemble site (main at root)
        env:
          # The only address where the company's data actually lives. Everything
          # this job publishes is a read-only copy pointing back at it.
          LIVE_URL: https://178-105-10-156.sslip.io
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R prod/site/. _site/

          # Mark EVERY published page as not-the-live-system. The root is a
          # static copy with no database behind it, and it is the one that looks
          # most like the real thing.
          #
          # This replaces a `perl -0pi -e 's{</body>}{...}'` one-liner that
          # missed three of eleven pages in silence and injected its banner into
          # journey.html's generated emails instead of onto the page. See the
          # header of the script for the full account.
          #
          # There were two passes here, ordered so the /preview copy got its own
          # wording before the root's pass claimed it. With the preview gone
          # there is one copy and one pass, and no ordering to get wrong.
          python3 prod/.github/scripts/stamp-pages-warning.py \
            _site "la copia pública de demostración" "the public demonstration copy" "$LIVE_URL"

          # Assert rather than trust. The step above prints a count; this proves
          # the warning is actually IN the files that will be uploaded, so a
          # future refactor cannot quietly go back to publishing an unmarked
          # copy of a customer's ERP.
          total=$(find _site -name '*.html' | wc -l)
          marked=$(grep -rl 'canei-not-live-bar' _site --include='*.html' | wc -l)
          echo "warning present on ${marked}/${total} pages"
          [ "$marked" = "$total" ] || { echo "::error::${total} pages published, only ${marked} carry the warning"; exit 1; }

          echo "Assembled root=$(ls _site | wc -l) entries."

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
