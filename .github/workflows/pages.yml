name: Deploy site + dev preview (GitHub Pages)

# Publishes TWO copies of the site in one Pages deployment:
#   • main            → site root      (production)
#   • the dev branch  → /preview/      (development preview)
# Runs whenever EITHER branch changes, and rebuilds both from scratch each time,
# so production and the preview are always current no matter which side pushed.
# Both you and a collaborator can iterate on the dev branch and watch /preview/;
# once aligned, merge the dev branch into main and the root updates.

on:
  push:
    branches: [main, claude/orin-project-status-1q50dt]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DEV_BRANCH: claude/orin-project-status-1q50dt

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod

      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEV_BRANCH }}
          path: dev

      - name: Assemble site (main at root, dev under /preview)
        env:
          # Perl reads this via %ENV; keep the Perl script single-quoted below so
          # bash (set -u) never tries to expand $ENV itself.
          BANNER: '<div style="position:fixed;left:10px;bottom:10px;z-index:99999;font:600 11px/1 -apple-system,Segoe UI,Roboto,sans-serif;color:#fff;background:#b4531f;padding:6px 11px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18);letter-spacing:.06em;text-transform:uppercase;pointer-events:none">Dev preview</div>'
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R prod/site/. _site/
          mkdir -p _site/preview
          cp -R dev/site/. _site/preview/
          # Stamp a small fixed "Dev preview" pill on every preview page so it's
          # never mistaken for production. Non-intrusive (fixed, high z-index).
          find _site/preview -name '*.html' -print0 | while IFS= read -r -d '' f; do
            perl -0pi -e 's{</body>}{$ENV{BANNER}</body>}i' "$f"
          done
          echo "Assembled root=$(ls _site | wc -l) entries; preview=$(ls _site/preview | wc -l) entries."

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
