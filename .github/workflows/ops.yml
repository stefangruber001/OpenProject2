name: Ops (run from a browser)

# Everything you would otherwise need a laptop and an SSH key for, behind a
# "Run workflow" button. Actions -> Ops -> Run workflow, pick one, read the log.
# Works from a phone.
#
# THE FIREWALL. SSH is restricted to a small set of addresses, and a GitHub
# runner's address is different every time, so each run lets itself in, does the
# work, and takes itself back out. The removal runs in an always() step: if it
# were skipped on failure, every red run would leave a stranger's address on the
# firewall forever. ops/ssh-allow.sh adds and removes ONE entry rather than
# replacing the set, so a run never disturbs the humans already listed.
#
# THE KEY. This needs the production SSH key, which lives in repository secrets.
# That is a real widening: anyone who can push a workflow to this repository can
# print a secret, so the set of people who can reach the server is now the set of
# people with write access. That is a deliberate trade for being able to operate
# without a laptop, and the way to tighten it is the `production` environment
# below — add a required reviewer to it in Settings -> Environments and every run
# waits for an approval.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        default: status
        type: choice
        options:
          - status
          - deploy-now
          - set-ghcr-token
          - sync-server
          - backup-now
          - set-email
          - list-ssh-allowed

concurrency:
  # Two runs mutating the same firewall would race: the first one's cleanup
  # removes an address while the second is still using it.
  group: ops-server
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      # Full history: deploy-now works out the newest commit that actually
      # builds an image, and a depth-1 clone cannot answer that.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the secrets this needs are present
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=""
          [ -n "$HCLOUD_TOKEN" ]   || missing="$missing HCLOUD_TOKEN"
          [ -n "$SERVER_SSH_KEY" ] || missing="$missing SERVER_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — see docs/OPS-WITHOUT-A-LAPTOP.md"
            exit 1
          fi

      - name: Materialise the config the ops scripts expect
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          # Written with printf rather than echo so a value containing a
          # backslash survives intact, and quoted because the scripts source it.
          mkdir -p ops/.provisioned
          printf 'HCLOUD_TOKEN="%s"\n' "$HCLOUD_TOKEN" > ops/provision.conf
          printf '%s\n' "$SERVER_SSH_KEY" > ops/.provisioned/id_ed25519
          chmod 600 ops/.provisioned/id_ed25519
          # A key with CRLF or a missing trailing newline fails with the
          # spectacularly unhelpful "invalid format", so check it here where the
          # error can say what is actually wrong.
          ssh-keygen -y -f ops/.provisioned/id_ed25519 >/dev/null 2>&1 || {
            echo "::error::SERVER_SSH_KEY is not a usable private key. Paste the whole file, including the BEGIN and END lines and a trailing newline."
            exit 1; }

      - name: Let this runner through the firewall
        id: allow
        run: |
          RUNNER_IP="$(curl -sS --max-time 10 https://api.ipify.org)"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          echo "This run is coming from $RUNNER_IP"
          bash ops/ssh-allow.sh add "$RUNNER_IP"
          # Hetzner applies rules asynchronously; connecting immediately
          # sometimes still gets refused.
          sleep 5

      - name: status
        if: inputs.action == 'status'
        run: bash ops/status.sh

      - name: list-ssh-allowed
        if: inputs.action == 'list-ssh-allowed'
        run: bash ops/ssh-allow.sh list

      # Pull the current release onto the server and prove it arrived. Exactly
      # what ops/deploy-now.sh does from a laptop — the point of having it here
      # is that the operator does not need one, and that the person who wrote
      # the change can finish it rather than handing over a command.
      - name: deploy-now
        if: inputs.action == 'deploy-now'
        run: bash ops/deploy-now.sh

      # The compose file, the Caddyfile and the ops scripts on the SERVER. These
      # are NOT in the container image, so a release can update the application
      # while the machine keeps running last month's stack definition — which is
      # how `up -d` once reported "Running" with no web container at all. Rare,
      # but when it is needed it is needed from wherever you happen to be.
      - name: sync-server
        if: inputs.action == 'sync-server'
        run: bash ops/sync-server.sh

      # Connect the company mailbox so the ERP can file its drafts in it.
      #
      # This is the one place a password travels through a workflow, and it is
      # a deliberate exception to the rule that kept add-user out of here. The
      # difference is that this one is a repository SECRET, which GitHub masks
      # in logs and never puts in an input box — whereas add-user would have had
      # to take the password as a workflow input, which persists in plain text
      # on the run for anyone with read access. The trade is also bounded by
      # what is already true: this repository holds the production SSH key,
      # which is strictly more powerful than a mailbox password.
      #
      # IMAP_HOST is set explicitly. Deriving it from the address would give
      # imap.2iberia.com, and the mailbox is hosted elsewhere — the provider's
      # own instructions say imap.hostinger.com. A derived default that happens
      # to be wrong is worse than no default.
      - name: set-email
        if: inputs.action == 'set-email'
        env:
          MAIL_PASSWORD: ${{ secrets.ERP_MAIL_PASSWORD }}
          IMAP_HOST: ${{ vars.ERP_MAIL_IMAP_HOST || 'imap.hostinger.com' }}
        run: |
          if [ -z "$MAIL_PASSWORD" ]; then
            echo "::error::Repository secret ERP_MAIL_PASSWORD is not set. Add it in"
            echo "::error::Settings -> Secrets and variables -> Actions, then run this again."
            exit 1
          fi
          # sync-server first, always. The mailbox variables are read from the
          # compose file ON THE SERVER, which is not part of the released image,
          # so a machine still running last month's stack definition would store
          # the password and pass it to nothing. Idempotent, so running it when
          # it is already current costs a few seconds.
          bash ops/sync-server.sh
          bash ops/set-email.sh "${{ vars.ERP_MAIL_ADDRESS || 'if@2iberia.com' }}"

      # THE ONE THAT COULD NOT BE FIXED FROM A PHONE, UNTIL IT HAD TO BE.
      #
      # This was deliberately left off the button, for the reason given above:
      # a token travelling through a workflow INPUT persists in the run log for
      # anyone with read access. That objection is about inputs, and it still
      # stands. A repository SECRET is the other thing — masked in logs, never
      # in a box on a page — which is precisely the distinction `set-email`
      # already draws for the mailbox password.
      #
      # What changed the balance: an expired registry token is the failure that
      # STRANDS you. The pipeline stays green, the image is published, the timer
      # runs every minute — and the machine serves the old version for as long
      # as nobody notices. It cost this project 25 commits and two days, and the
      # only remedy needed a laptop nobody had. A recovery path that requires
      # the thing the incident takes away is not a recovery path.
      - name: set-ghcr-token
        if: inputs.action == 'set-ghcr-token'
        env:
          GHCR_TOKEN_NEW: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN_NEW" ]; then
            echo "::error::Repository secret GHCR_TOKEN is not set."
            echo "::error::Make one at github.com -> Settings -> Developer settings ->"
            echo "::error::Personal access tokens -> Tokens (classic) -> Generate new token,"
            echo "::error::ticking ONLY read:packages. Then add it under Settings ->"
            echo "::error::Secrets and variables -> Actions as GHCR_TOKEN and run this again."
            exit 1
          fi
          # The script stores it AND proves it by logging in and pulling. A
          # stored token that cannot pull is indistinguishable from a working
          # one until a release silently fails to arrive — which is the whole
          # shape of this incident.
          bash ops/set-ghcr-token.sh

      - name: backup-now
        if: inputs.action == 'backup-now'
        run: |
          IP="$(curl -sS -H "Authorization: Bearer ${{ secrets.HCLOUD_TOKEN }}" \
                 "https://api.hetzner.cloud/v1/servers?name=${SERVER_NAME:-canei-erp-prod}" \
               | jq -r '.servers[0].public_net.ipv4.ip')"
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -i ops/.provisioned/id_ed25519 root@${IP}"
          # </dev/null on every remote command: anything that reads stdin eats
          # the rest of a piped script, silently. That cost a day once.
          $SSH "systemctl start canei-backup.service" </dev/null
          echo "Backup service started. Most recent dumps on the machine:"
          $SSH "ls -lt /opt/canei-erp/backups/*.age 2>/dev/null | head -5 || echo '(none yet)'" </dev/null

      - name: Take this runner back out of the firewall
        # always(), because a failed run that leaves its address allowed is how
        # the allow-list silently fills up with addresses nobody recognises.
        if: always() && steps.allow.outputs.runner_ip != ''
        run: bash ops/ssh-allow.sh remove "${{ steps.allow.outputs.runner_ip }}"

      - name: Shred the credentials from the runner's disk
        if: always()
        run: rm -f ops/provision.conf ops/.provisioned/id_ed25519
