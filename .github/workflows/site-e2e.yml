name: Site E2E (autonomous journey)

# Autonomously drives the live web app (the pages the iOS app loads) end-to-end
# in a real browser: loads the sample, walks all 13 lifecycle stages, checks the
# P&L ledger, exports the project ZIP, and asserts no console errors or mobile
# overflow. Runs on every push/PR that touches the site or the test.
#
# claude/** is included because work happens on short-lived branches that are
# merged into main the same day, and main is what deploys to the server the
# mobile shells load (ios/CaneiSubirats/Support/Config.swift baseURL). Running
# here means a branch is already proven before it becomes production, rather
# than after.
#
# The original reason was different and is now obsolete: every push to the dev
# branch republished /preview, which was what the TestFlight and Android betas
# loaded. Both shells were moved to the live server, and /preview was deleted
# with the dev branch it tracked.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "site/**"
      - "tests/site-e2e/**"
      - "tests/site-sync/**"
      - ".github/workflows/site-e2e.yml"
  pull_request:
    paths:
      - "site/**"
      - "tests/site-e2e/**"
      - "tests/site-sync/**"
  workflow_dispatch:

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (matching Playwright version)
        # playwright is declared in apps/web, so the bin lives there, not at the root
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The business simulations (erp-engine.js invariants) now run in ci.yml's
      # "simulations" job on every push/PR — unconditionally, not just when
      # site/** changes — so they are not duplicated here.

      - name: Run autonomous site E2E
        run: node tests/site-e2e/run.mjs

      # Does an already-open page notice a change made somewhere else? This is
      # the behaviour the operator reported missing ("I need to refresh 178-105
      # every time"), and it decides whether to reload a page that may have
      # half-typed work on it — so it is worth a browser, not a unit test.
      - name: Run cross-device refresh tests
        run: node tests/site-sync/run.mjs
