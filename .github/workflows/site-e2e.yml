name: Site E2E (autonomous journey)

# Autonomously drives the live web app (the pages the iOS app loads) end-to-end
# in a real browser: loads the sample, walks all 13 lifecycle stages, checks the
# P&L ledger, exports the project ZIP, and asserts no console errors or mobile
# overflow. Runs on every push/PR that touches the site or the test.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/site-e2e/**"
      - ".github/workflows/site-e2e.yml"
  pull_request:
    paths:
      - "site/**"
      - "tests/site-e2e/**"
  workflow_dispatch:

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (matching Playwright version)
        # playwright is declared in apps/web, so the bin lives there, not at the root
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Business simulations (1 year × 3/mo, 2 years × 2/mo)
        run: |
          node tests/simulation/year-sim.mjs 1
          SIM_MONTHS=24 SIM_PPM=2 node tests/simulation/year-sim.mjs 1
          node tests/simulation/manageability-sim.mjs

      - name: Run autonomous site E2E
        run: node tests/site-e2e/run.mjs
