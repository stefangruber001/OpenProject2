name: Site E2E (autonomous journey)

# Autonomously drives the live web app (the pages the iOS app loads) end-to-end
# in a real browser: loads the sample, walks all 13 lifecycle stages, checks the
# P&L ledger, exports the project ZIP, and asserts no console errors or mobile
# overflow. Runs on every push/PR that touches the site or the test.
#
# claude/** is included because work happens on short-lived branches that are
# merged into main the same day, and main is what deploys to the server the
# mobile shells load (ios/CaneiSubirats/Support/Config.swift baseURL). Running
# here means a branch is already proven before it becomes production, rather
# than after.
#
# The original reason was different and is now obsolete: every push to the dev
# branch republished /preview, which was what the TestFlight and Android betas
# loaded. Both shells were moved to the live server, and /preview was deleted
# with the dev branch it tracked.

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "site/**"
      - "tests/site-e2e/**"
      - "tests/site-sync/**"
      - ".github/workflows/site-e2e.yml"
  pull_request:
    paths:
      - "site/**"
      - "tests/site-e2e/**"
      - "tests/site-sync/**"
  workflow_dispatch:

jobs:
  journey:
    runs-on: ubuntu-latest
    # 15 -> 25 on 22 Oct, and the reason written here then was WRONG. It said
    # the budget had been eaten by the suite growing to forty-nine suites. It
    # had not: on 5 Nov the same tree was measured twice, and the suite took
    # 12m53s and 12m59s while the browser DOWNLOAD took 22 seconds once and
    # 11m23s the other time. Growth was never the variable; fetching Chromium
    # over the network was, and it had already failed once that way in ci.yml
    # on 45483f6. The fix is the cache step below, not a bigger number here and
    # not splitting a suite that takes thirteen predictable minutes.
    #
    # Twenty-five stays, because a cancelled gate is indistinguishable from a
    # red one at a glance and the suite needs half of it. If this brushes
    # twenty-five again WITH the cache warm, then the suite really has grown
    # and splitting it is the answer.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # THE BROWSER DOWNLOAD IS THE VARIABLE, not the suite. Measured on one
      # tree, 8d90844, in two runs an hour apart: this step took 22 SECONDS on
      # the branch and 11 MINUTES 23 SECONDS on main, while the suite itself
      # took 12m53s and 12m59s. The second run was cancelled at the 25-minute
      # wall thirteen seconds after everything in it had passed — 905/905 and
      # 30/30, both printed in the log above the cancellation.
      #
      # So the cache goes in front of it. Keyed on the lockfile, which is where
      # the Playwright version lives, so a version bump misses the cache and
      # downloads once. `--with-deps` still runs on a hit: the apt packages are
      # outside ~/.cache/ms-playwright and take seconds. What it stops being is
      # an eleven-minute coin toss inside a twenty-five-minute budget.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium (matching Playwright version)
        # playwright is declared in apps/web, so the bin lives there, not at the root
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The business simulations (erp-engine.js invariants) now run in ci.yml's
      # "simulations" job on every push/PR — unconditionally, not just when
      # site/** changes — so they are not duplicated here.

      - name: Run autonomous site E2E
        run: node tests/site-e2e/run.mjs

      # Does an already-open page notice a change made somewhere else? This is
      # the behaviour the operator reported missing ("I need to refresh 178-105
      # every time"), and it decides whether to reload a page that may have
      # half-typed work on it — so it is worth a browser, not a unit test.
      - name: Run cross-device refresh tests
        run: node tests/site-sync/run.mjs
