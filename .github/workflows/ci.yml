name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture boundaries (layer matrix + forbidden literals)
        run: pnpm boundaries

      - name: Type-check
        run: pnpm check-types

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  bundle:
    name: Capability bundle (build, browser-safety, drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build capability bundle
        run: pnpm --filter @repo/erp-browser build

      # One copy of this rule, in a script `make gates` runs too. It lived
      # here as inline bash and that is precisely how it failed to help: a
      # local gate run cannot execute a workflow step, so the regression was
      # found after the push instead of before it.
      - name: Assert the bundle is browser-safe
        run: node tests/parity/bundle-safety.mjs

      # The artifacts are committed (pages.yml publishes site/** from a bare
      # checkout with no Node). This proves the committed copies still match
      # the capability sources they were generated from.
      #
      # The tracked check is not redundant: `git diff` ignores untracked files,
      # so if the artifacts were ever deleted from the index the diff would
      # pass silently while the deployed site served nothing.
      - name: Committed bundle must be tracked and match its source
        run: |
          git ls-files --error-unmatch site/erp-factory.js site/erp-factory.cjs >/dev/null
          git diff --exit-code -- site/erp-factory.js site/erp-factory.cjs

      # Lets a machine without a Node toolchain obtain a freshly built bundle:
      # download this artifact and commit it.
      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-bundle
          path: |
            site/erp-factory.js
            site/erp-factory.cjs
          retention-days: 7

  simulations:
    name: Business simulations (erp-engine invariants + ownership guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs on every push/PR (not gated on site/** paths) so a change in
      # packages/ that later reaches erp-engine.js/erp-bridge.js through the
      # migration seam is checked too, not only edits under site/.
      - name: Business simulations (1 year × 3/mo, 2 years × 2/mo)
        run: |
          node tests/simulation/year-sim.mjs 1
          SIM_MONTHS=24 SIM_PPM=2 node tests/simulation/year-sim.mjs 1
          node tests/simulation/manageability-sim.mjs

      # Data foundation: replays the frozen real v1 blob through the schema
      # ladder, and drives the one-way legacy import's decision logic — the two
      # paths that can silently damage a live dataset.
      - name: Schema migration + legacy import simulations
        run: |
          node tests/simulation/migrations-sim.mjs
          node tests/simulation/import-sim.mjs

      # Drives the COMMITTED site/erp-factory bundle, not the TypeScript source:
      # the scheduling capability reaches the browser only through that artifact,
      # so a bundle that was not rebuilt after a source change fails here rather
      # than in front of an operator looking at a Gantt chart.
      - name: Scheduling capability simulation (committed bundle)
        run: node tests/simulation/scheduling-sim.mjs

      - name: Ownership file guard (strangler-fig migration state)
        run: node tests/parity/ownership-guard.mjs

      # The interface is trilingual (ES · CA · EN) and the dictionary is
      # hand-maintained, so nothing but a check stops a new Spanish string
      # shipping with no translation — it renders correctly for whoever wrote
      # it and silently falls back for everybody else. Fails on a missing
      # English form, and on any growth in the Catalan backlog.
      - name: i18n coverage (no untranslated user-visible string)
        run: node tests/i18n/coverage.mjs

      # The mapping's field dictionary is the strongest claim in the governance
      # set — "the data you have today fits the system you are buying" — and it
      # is a markdown table, so nothing but this stops it drifting away from the
      # engine. Resolves every field the table claims against the real seeded
      # dataset, not against the source text.
      - name: Workbook coverage (the field dictionary is still true)
        run: node tests/workbook/coverage.mjs

  persistence:
    name: Durable adapters (Postgres + RLS contract tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The OWNER connection: DDL, migrations, and the contract tests.
      DATABASE_URL: postgresql://factory:factory@localhost:5432/factory
      # The RESTRICTED connection the application would really use. It has to be
      # a different role: `factory` is a superuser, and superusers bypass RLS
      # unconditionally, so RLS assertions made over the owner connection pass
      # for the wrong reason — or rather, fail to fail when RLS is broken.
      RLS_TEST_DATABASE_URL: postgresql://factory_app:factory_app@localhost:5432/factory
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations (incl. RLS policies)
        run: pnpm --filter @repo/db exec prisma migrate deploy

      - name: Create the restricted application role
        # Same script production runs, so a change that breaks the grants breaks
        # here rather than on the server.
        env:
          PGHOST: localhost
          PGPASSWORD: factory
          POSTGRES_USER: factory
          POSTGRES_DB: factory
          APP_DB_USER: factory_app
          APP_DB_PASSWORD: factory_app
        run: bash ops/harden-db-role.sh

      - name: Seed fleet registry
        run: pnpm --filter @repo/db exec tsx prisma/seed.ts

      - name: Run store contract tests against Postgres
        run: pnpm --filter @repo/db test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm --filter web test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
