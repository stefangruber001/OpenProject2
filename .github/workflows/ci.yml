name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Architecture boundaries (layer matrix + forbidden literals)
        run: pnpm boundaries

      - name: Type-check
        run: pnpm check-types

      # The draft mailbox adapter, against a stub IMAP server. No credentials and
      # no network: it asserts what we SAY to a mail server, which is the half
      # that can be wrong in ways that look like success.
      - name: Draft mailbox adapter
        run: pnpm test:mailbox

      # THE CORE GATES COME FIRST, AND THE DOCUMENT ONES MAY NOT MASK THEM.
      # Previously a failure in the PDF gate marked every later step "skipped",
      # so a run could go red without unit tests or the build ever executing —
      # the cheapest, most important checks hidden behind the newest ones.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # The document gates read the produced PDFs with poppler. Without it they
      # can extract nothing — and they now fail rather than report a clean sheet,
      # which is how a missing binary here turned into a green tick on a file
      # nobody had read.
      - name: Install poppler (PDF text extraction for the document gates)
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # The template and translation gates render real pages in a real browser,
      # which is the whole point of them — so they need one. The runner has no
      # browser until this step, and `pnpm install` does not fetch it.
      - name: Install Playwright browser (document + translation gates render pages)
        if: always()
        run: pnpm --filter web exec playwright install --with-deps chromium

      # The writer behind every quote and invoice: paginates instead of
      # truncating, keeps Spanish accents, stays clear of the printable border.
      - name: PDF writer
        if: always()
        run: pnpm test:pdf

      # Every approved template rendered and measured: no ink within 9.5mm of the
      # paper edge on any page. The redesign shipped with 0.8mm on continuation
      # pages, which no printer can reproduce.
      - name: Documents are printable
        if: always()
        run: pnpm test:docs

      # The runner's Chromium places glyphs differently from any machine this is
      # developed on, and its build cannot be downloaded here — so its PDFs are
      # the only evidence that exists for the heading-splitting question. Kept
      # so the next person diagnoses it from the artifact instead of guessing.
      - name: Keep the runner's rendered PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-documents
          path: dist/doc-print-check/*.pdf
          retention-days: 14
          if-no-files-found: warn

      # Two questions, two checks, and they are not the same question.
      #
      # coverage.mjs asks whether every entry exists in all three languages —
      # cheap, exact, and blind to whether the page uses it.
      # audit.mjs renders every page in every language and counts what came out
      # identical in two of them, which is what the operator actually sees.
      #
      # The audit is budgeted rather than zero: setup-guide.html alone is 457 of
      # the Catalan total and is prose a native speaker should translate, and a
      # gate nobody can pass is a gate that gets deleted. The ceilings are the
      # numbers measured on 2026-08-16 and only ever move down. See the header
      # of audit.mjs for what inflates them.
      - name: Translation completeness (dictionary)
        if: always()
        run: node tests/i18n/coverage.mjs

      - name: Translation coverage (rendered pages)
        if: always()
        run: |
          node tests/i18n/audit.mjs --lang en --max 668
          node tests/i18n/audit.mjs --lang ca --max 845

      # The one above reads erp.html on a static server, where the workspace
      # shell never finishes booting — so it sees the login chrome and misses
      # the screens the operator actually uses. That gap SHIPPED: an operator on
      # English read the control tower's description, its timestamp, its buttons
      # and "0 proyectos activos" in Spanish, on the screen the app opens on.
      # This one waits for the shell and walks twelve screens. The ceilings are
      # today's measurement and only move down; what remains is a site address
      # and two version labels, which are data.
      # Merging the v4 programme branch brought twelve sessions of screens this
      # audit had never walked, and the seven strings it found were translated
      # rather than budgeted for — so the ceiling comes DOWN to zero. The two
      # version labels the note above excused as data are gone too: they were
      # one cell rendering "v1.0" and "· 2 versiones" as separate text nodes,
      # which no dictionary rule could ever match, and a rule written for
      # exactly that cell had been sitting unused since it was added.
      - name: Translation coverage (booted workspace)
        if: always()
        run: |
          node tests/i18n/workspace-audit.mjs --lang en --max 0
          node tests/i18n/workspace-audit.mjs --lang ca --max 0

      # Neither audit above can see a modal, a toast or a validation message:
      # none of it is in the DOM until somebody taps something, and a crawler
      # never performs the exact gesture. That is how 269 untranslated strings
      # in erp.html sat behind a gate reporting three. This one reads the
      # SOURCE — labels, options, placeholders, thrown messages — so a string
      # counts the moment it is written, not if a crawler happens to reach it.
      #
      # RAISED BY THE MERGE, AND SAID SO PLAINLY. 147/219 were measured against
      # main's erp.html; the v4 programme branch's is twelve sessions larger —
      # the presupuestador, the Gantt, the invoice generator and everything
      # around them — and none of that Spanish had ever been scanned here. The
      # ceilings below are the merged measurement exactly, so the ratchet still
      # fails on the next untranslated string written. It is a debt, not a
      # dispensation: see ASSUMPTIONS #167. The booted-workspace audit above,
      # which measures what an operator actually reads, is at zero.
      - name: Translation coverage (source literals)
        if: always()
        run: |
          node tests/i18n/source-audit.mjs --lang en --max 256
          node tests/i18n/source-audit.mjs --lang ca --max 335

      # THE ONE THAT DOES NOT GUESS. The four gates above each answer "what is
      # untranslated" by enumerating places a string might live — an entry, a
      # page, a route, a quoted literal — and each has reported clean while an
      # operator was looking at Spanish. The photograph that prompted this was
      # an invoice-issuing form no route walker opens.
      #
      # This one asks the translator. `tr()` is called with every visible string
      # before it is painted and knows, at the moment it fails, that the string
      # has no translation; site/i18n.js now keeps those verdicts and this drives
      # the app — every route, then every control on it — and reads them off. It
      # cannot miss a screen it has opened, and it opens the ones a click away.
      #
      # THE CEILINGS BELOW WENT UP, AND THAT IS THE HONEST DIRECTION.
      #
      # They were 6 / 79. Those came from a run that drove TWELVE pages: the
      # route list was fourteen hashes copied out of erp.html, the v4 merge
      # renamed five of them, and the guard said "more than half booted" so the
      # run reported a total for screens it never opened. Reading the route list
      # from the application instead — SECTIONS, where the workspace declares
      # its own nav — turns up THIRTY, and the crawl now covers 33 pages
      # including sixteen no translation gate had ever walked: the
      # presupuestador, the Gantt, invoicing, purchasing, supplier invoices,
      # banking, petty cash, the accountant screens, customers, suppliers,
      # staff, the price list, messaging.
      #
      # So 239 / 341 is not a regression against 6 / 79; the two numbers measure
      # different things, and only one of them measured the product. Raising a
      # ratchet is normally the thing a ratchet exists to prevent, which is why
      # it is spelled out here rather than adjusted quietly — see ASSUMPTIONS
      # #168, and the same argument for the source-literal ceilings in #167.
      #
      # From here it only goes down. Every string behind these numbers is one an
      # operator can see in the wrong language. Run this locally with --json to get
      # the full list grouped by screen.
      - name: Translation coverage (translator miss ledger)
        if: always()
        run: |
          node tests/i18n/miss-crawl.mjs --lang en --max 239
          node tests/i18n/miss-crawl.mjs --lang ca --max 341

  bundle:
    name: Capability bundle (build, browser-safety, drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build capability bundle
        run: pnpm --filter @repo/erp-browser build

      # One copy of this rule, in a script `make gates` runs too. It lived
      # here as inline bash and that is precisely how it failed to help: a
      # local gate run cannot execute a workflow step, so the regression was
      # found after the push instead of before it.
      - name: Assert the bundle is browser-safe
        run: node tests/parity/bundle-safety.mjs

      # The artifacts are committed (pages.yml publishes site/** from a bare
      # checkout with no Node). This proves the committed copies still match
      # the capability sources they were generated from.
      #
      # The tracked check is not redundant: `git diff` ignores untracked files,
      # so if the artifacts were ever deleted from the index the diff would
      # pass silently while the deployed site served nothing.
      - name: Committed bundle must be tracked and match its source
        run: |
          git ls-files --error-unmatch site/erp-factory.js site/erp-factory.cjs >/dev/null
          git diff --exit-code -- site/erp-factory.js site/erp-factory.cjs

      # Lets a machine without a Node toolchain obtain a freshly built bundle:
      # download this artifact and commit it.
      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-bundle
          path: |
            site/erp-factory.js
            site/erp-factory.cjs
          retention-days: 7

  simulations:
    name: Business simulations (erp-engine invariants + ownership guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs on every push/PR (not gated on site/** paths) so a change in
      # packages/ that later reaches erp-engine.js/erp-bridge.js through the
      # migration seam is checked too, not only edits under site/.
      - name: Business simulations (1 year × 3/mo, 2 years × 2/mo)
        run: |
          node tests/simulation/year-sim.mjs 1
          SIM_MONTHS=24 SIM_PPM=2 node tests/simulation/year-sim.mjs 1
          node tests/simulation/manageability-sim.mjs

      # Data foundation: replays the frozen real v1 blob through the schema
      # ladder, and drives the one-way legacy import's decision logic — the two
      # paths that can silently damage a live dataset.
      - name: Schema migration + legacy import simulations
        run: |
          node tests/simulation/migrations-sim.mjs
          node tests/simulation/import-sim.mjs

      # Drives the COMMITTED site/erp-factory bundle, not the TypeScript source:
      # the scheduling capability reaches the browser only through that artifact,
      # so a bundle that was not rebuilt after a source change fails here rather
      # than in front of an operator looking at a Gantt chart.
      - name: Scheduling capability simulation (committed bundle)
        run: node tests/simulation/scheduling-sim.mjs

      - name: Ownership file guard (strangler-fig migration state)
        run: node tests/parity/ownership-guard.mjs

      # The interface is trilingual (ES · CA · EN) and the dictionary is
      # hand-maintained, so nothing but a check stops a new Spanish string
      # shipping with no translation — it renders correctly for whoever wrote
      # it and silently falls back for everybody else. Fails on a missing
      # English form, and on any growth in the Catalan backlog.
      - name: i18n coverage (no untranslated user-visible string)
        run: node tests/i18n/coverage.mjs

      # The mapping's field dictionary is the strongest claim in the governance
      # set — "the data you have today fits the system you are buying" — and it
      # is a markdown table, so nothing but this stops it drifting away from the
      # engine. Resolves every field the table claims against the real seeded
      # dataset, not against the source text.
      - name: Workbook coverage (the field dictionary is still true)
        run: node tests/workbook/coverage.mjs

      # The phone app is six URLs pointed at this site, and it is built on a
      # macOS runner — so nothing here would notice a tab addressing a page
      # that no longer exists, a section that was renamed, or the URL being
      # assembled in the one way that percent-encodes a fragment. All three are
      # readable as text, so they are checked next to the site they point at.
      - name: iOS tab routes (every tab addresses a real screen)
        run: node tests/ios-routes/coverage.mjs

  persistence:
    name: Durable adapters (Postgres + RLS contract tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The OWNER connection: DDL, migrations, and the contract tests.
      DATABASE_URL: postgresql://factory:factory@localhost:5432/factory
      # The RESTRICTED connection the application would really use. It has to be
      # a different role: `factory` is a superuser, and superusers bypass RLS
      # unconditionally, so RLS assertions made over the owner connection pass
      # for the wrong reason — or rather, fail to fail when RLS is broken.
      RLS_TEST_DATABASE_URL: postgresql://factory_app:factory_app@localhost:5432/factory
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations (incl. RLS policies)
        run: pnpm --filter @repo/db exec prisma migrate deploy

      - name: Create the restricted application role
        # Same script production runs, so a change that breaks the grants breaks
        # here rather than on the server.
        env:
          PGHOST: localhost
          PGPASSWORD: factory
          POSTGRES_USER: factory
          POSTGRES_DB: factory
          APP_DB_USER: factory_app
          APP_DB_PASSWORD: factory_app
        run: bash ops/harden-db-role.sh

      - name: Seed fleet registry
        run: pnpm --filter @repo/db exec tsx prisma/seed.ts

      - name: Run store contract tests against Postgres
        run: pnpm --filter @repo/db test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm --filter web test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
