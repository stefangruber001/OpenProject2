name: Probe · reproduce what App Review saw

# Drives a real browser at the reviewer's iPad size, with the native shell's
# user agent, against the LIVE server — signing in with the same demo account
# App Review was given. See tests/review-repro/run.mjs for why a browser check
# and an app check are not the same check.
#
# Read-only against production: it signs in and reads screens. It writes
# nothing, and the screenshots are uploaded as an artifact rather than
# committed.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to drive"
        required: false
        default: "https://178-105-10-156.sslip.io"

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install WebKit and Chromium
        # WebKit is the one that matters — it is the engine WKWebView runs, so
        # it is the engine App Review saw. Chromium comes too, only so the two
        # can be compared: a page that is fine in one and blank in the other is
        # the diagnosis, not a curiosity.
        # playwright is declared in apps/web, so the bin lives there, not at the
        # root — same as site-e2e.yml.
        run: pnpm --filter web exec playwright install --with-deps webkit chromium

      - name: What the reviewer saw — WebKit, the engine the app runs
        env:
          BROWSER: webkit
          ERP_BASE_URL: ${{ inputs.base_url || 'https://178-105-10-156.sslip.io' }}
          ERP_USER: ${{ vars.ASC_DEMO_USER || 'stefan@caneisubirats.com' }}
          ERP_PASSWORD: ${{ secrets.ASC_DEMO_PASSWORD }}
        run: node tests/review-repro/run.mjs

      # Always, so the two engines can be read side by side even when WebKit
      # has already failed the job. The comparison is the point.
      - name: The same run in Chromium, for comparison
        if: always()
        continue-on-error: true
        env:
          BROWSER: chromium
          ERP_BASE_URL: ${{ inputs.base_url || 'https://178-105-10-156.sslip.io' }}
          ERP_USER: ${{ vars.ASC_DEMO_USER || 'stefan@caneisubirats.com' }}
          ERP_PASSWORD: ${{ secrets.ASC_DEMO_PASSWORD }}
        run: node tests/review-repro/run.mjs

      - name: The screenshots, whatever happened
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-repro-shots
          path: tests/review-repro/shots/
          if-no-files-found: warn
